数抵。<br>工资薪金抵免限额 = (800000 − 60000) × 35% − 85920 = <b>173080 元</b> > 境外已纳 150000；<br>在我国应补 = 173080 − 150000 = <b>23080 元</b>(B 对)。","trap":"选 0(D) 是误以为「境外交过就不用再交」；选 173080(C) 是忘了抵免。<b>取限额与已纳孰低</b>，差额才补。"},{"no":38,"type":"single","stem":"2025年12月天使投资人张某转让于2023年5月取得的某初创科技有限公司股权，投资成本和转让收入分别为1000万元和2200万元。已知张某对初创科技有限公司的投资符合投资抵扣税收优惠条件，张某转让股权应缴纳个人所得税( )万元。","opts":{"A":"440","B":"240","C":"100","D":"40"},"ans":"C","raw":"天使投资个人直接投资初创科技型企业满2年，可按投资额70%抵扣转让该股权的应纳税所得额：(2200-1000-1000×70%)×20%=100万元。","block":"5-17","exam":"天使投资个人 70% 投资额抵扣","think":"天使投资个人采取股权投资方式直接投资初创科技型企业<b>满 2 年</b>的，可按投资额 <b>70%</b> 抵扣转让该股权的应纳税所得额；当期不足抵扣可结转。<br>(2200 − 1000 − 1000×70%) × 20% = 500 × 20% = <b>100 万元</b>(C 对)。","trap":"70% 是按<b>投资额</b>算(1000×70%=700)，不是按转让所得算；选项 A 的 440 是完全没抵扣的 (2200−1000)×20%。"},{"no":39,"type":"single","stem":"李某为互联网平台内从业人员，2025年6月、7月连续在同一平台企业取得不含税劳务报酬收入，分别为8000元、9000元，无依法确定的其他扣除及减免税额，当年无其他收入。平台按照累计预扣法计算并预扣预缴李某的税款，李某2025年7月应预扣预缴个人所得税税额为( )元。","opts":{"A":"42","B":"66","C":"108","D":"144"},"ans":"B","raw":"平台累计预扣法：累计费用=累计收入×20%，累计减除费用=5000×连续从业月份数。6月=(8000-1600-5000)×3%=42元；7月=[17000-3400-10000]×3%-42=66元。","block":"5-18","exam":"平台累计预扣法跨两个月的计算","think":"累计收入 = 8000+9000 = 17000；累计费用 = 17000×20% = 3400；累计减除费用 = 5000×<b>连续从业月份数 2</b> = 10000。<br>6 月：(8000−1600−5000)×3% = 42 元；<br>7 月：(17000−3400−10000)×3% − 42 = 108 − 42 = <b>66 元</b>(B 对)。","trap":"7 月要<b>减去 6 月已预扣的 42 元</b>(不减会得 108，选项 C)；也别把 6、7 月各自独立按次扣。"},{"no":1,"type":"multi","stem":"个人取得的下列所得中，属于来源于中国境内所得的有( )。","opts":{"A":"将境外房产出租给境内企业取得的租金","B":"境外专利权在境内使用取得的收入","C":"取得境外杂志社支付且负担的稿酬","D":"在境内转让机器设备给境外企业取得的所得"},"ans":"BD","raw":"来源于中国境内的所得：因任职受雇履约在境内提供劳务；将财产出租给承租人在境内使用；转让境内不动产或在境内转让其他财产；许可特许权在境内使用；从境内企业事业单位其他组织及居民个人取得利息股息红利。选项A境外房产租给境内企业，属于境外财产在境外使用，为境外所得；选项C境外杂志社支付且负担的稿酬，为境外所得。","block":"5-2","exam":"所得来源地的判定","think":"按<b>价值创造地</b>判断，不看谁付钱：<br>境内提供劳务、财产出租给承租人在<b>境内使用</b>、许可特许权在<b>境内使用</b>、转让境内不动产或<b>在境内转让</b>其他财产、从境内企业事业单位及居民个人取得利息股息红利，均为境内所得。<br><b>B</b> 境外专利权在境内使用 → 境内；<b>D</b> 在境内转让机器设备给境外企业 → 境内。<br><b>A</b> 境外房产出租，财产使用地在境外 → 境外所得；<b>C</b> 境外杂志社支付且负担的稿酬，写作发表也在境外 → 境外所得。答案 <b>BD</b>。","trap":"A 是最经典的反向陷阱：<b>承租人是境内企业≠财产在境内使用</b>。C 的「支付且负担」两个词是提示行为地在境外。"},{"no":2,"type":"multi","stem":"下列个人所得税的纳税义务人，只就其来源于中国境内的所得向中国缴纳个人所得税的有( )。","opts":{"A":"在中国境内无住所又不居住的甲","B":"在中国境内有住所的乙","C":"在中国境内无住所且在一个纳税年度内在境内居住累计不满183天的丙","D":"在中国境内无住所且在一个纳税年度内在境内居住累计满183天的丁"},"ans":"AC","raw":"【解析】(1)选项AC:属于非居民个人，承担有限纳税义务，只就其来源于中国境内的\n所得向中国缴纳个人所得税。\n(2)选项BD:属于居民个人，负有无限纳税义务，其所取得的应税所得，无论是来源于\n中国境内还是中国境外任何地方，都要在中国缴纳个人所得税。","block":"5-1","exam":"有限纳税义务人（非居民）","think":"居民个人 = <b>有住所</b> 或 <b>无住所但一个纳税年度内累计居住满 183 天</b>，负无限纳税义务(境内外所得都交)。非居民 = 无住所又不居住，或无住所且居住累计不满 183 天，只就境内所得交。<br><b>A</b> 无住所又不居住 → 非居民；<b>C</b> 无住所且居住不满 183 天 → 非居民。<br><b>B</b> 有住所 → 居民；<b>D</b> 无住所但居住满 183 天 → <b>仍是居民</b>。答案 <b>AC</b>。","trap":"「无住所」不等于非居民。D 只要住满 183 天就是居民，这一项最容易漏判。"},{"no":3,"type":"multi","stem":"(非标准题)居民个人取得的下列收入中，应按照“工资、薪金所得”项目计征个人所得税的有( )。","opts":{"A":"雇员获得免费旅游业绩奖励","B":"股票增值权所得","C":"独立董事取得的董事费收入","D":"提供担保收入","E":"个人业余兼职收入","F":"证券经纪人取得的佣金收入","G":"个人退休后再受雇取得的收入","H":"外聘审稿人员的审稿收入"},"ans":"ABG","raw":"【解析】(1)选项CEFH:属于劳务报酬所得。\n(2)选项D:属于偶然所得。","block":"5-4","exam":"【8 选项】工资薪金所得的边界","think":"逐个按「有无任职受雇关系」判：<br><b>A</b> 雇员获免费旅游业绩奖励 → 工资 ✔；<b>B</b> 股票增值权所得 → 工资 ✔；<b>G</b> 退休后再受雇取得收入 → 工资 ✔。<br><b>C</b> 独立董事费(不在公司任职) → 劳务；<b>E</b> 个人业余兼职 → 劳务；<b>F</b> 证券经纪人佣金 → 劳务(走累计预扣法)；<b>H</b> 外聘审稿人员审稿收入 → 劳务。<br><b>D</b> 提供担保收入 → <b>偶然所得</b>。答案 <b>ABG</b>。","trap":"8 选项题要<b>逐个打勾</b>，别按印象打包。D 不是劳务也不是工资，是偶然所得；F 的佣金虽走累计预扣法，性质仍是劳务报酬。"},{"no":4,"type":"multi","stem":"(非标准题)下列各项中，按照“经营所得”缴纳个人所得税的有( )。","opts":{"A":"从事彩票代销业务的收入","B":"从事个体出租车运营的出租车驾驶员取得的收入","C":"个体工商户业主对外投资取得的股息所得","D":"合伙企业用企业资金为其个人合伙人购买房屋","E":"出租汽车经营单位对出租车驾驶员采取单车承包或承租方式运营，出租车驾驶员从事客货营运取得的收入"},"ans":"ABD","raw":"【解析】(1)选项C:个体工商户和从事生产、经营的个人，取得与生产、经营活动无关\n的其他各项应税所得，应分别按照其他应税项目的有关规定，计算征收个人所得税。如\n对外投资取得的股息所得，应按“利息、股息、红利所得”缴纳个人所得税。\n(2)选项E:应按“工资、薪金所得”缴纳个人所得税。","block":"5-11","exam":"【5 选项】经营所得的界定","think":"<b>A</b> 彩票代销 → 经营 ✔；<b>B</b> 个体出租车运营(车归个人) → 经营 ✔；<b>D</b> 合伙企业用企业资金为个人合伙人购房 → 视为对投资者的利润分配，按经营所得 ✔。<br><b>C</b> 个体工商户业主对外投资取得的股息 → 与生产经营无关，按<b>利息股息红利所得</b>；<b>E</b> 出租汽车经营单位对驾驶员单车承包/承租 → 实质雇员，按<b>工资薪金所得</b>。答案 <b>ABD</b>。","trap":"C 的「经营无关的所得单独归类」和 E 的「单车承包按工资」是本块两条最硬的边界。"},{"no":5,"type":"multi","stem":"下列各项中，按照“劳务报酬所得”缴纳个人所得税的有( )。","opts":{"A":"兼任本公司董事取得董事费收入","B":"在非任职公司担任监事取得监事费收入","C":"彩票代销收入","D":"非雇员获得免费旅游业绩奖励"},"ans":"BD","raw":"【解析】(1)选项A:按照“工资、薪金所得”缴纳个人所得税。\n(2)选项C:按照“经营所得”缴纳个人所得税。","block":"5-4","exam":"劳务报酬所得的界定","think":"<b>B</b> 在非任职公司担任监事取得监事费 → 无雇佣关系 → 劳务 ✔；<b>D</b> 非雇员获得免费旅游业绩奖励 → 劳务 ✔。<br><b>A</b> 兼任<b>本公司</b>董事取得董事费 → 本就是雇员，按工资薪金；<b>C</b> 彩票代销收入 → 经营所得。答案 <b>BD</b>。","trap":"A 的「本公司」三个字决定归属，与 B 的「非任职公司」正好成对照，母题子题式命题。"},{"no":6,"type":"multi","stem":"下列各项中，按照“稿酬所得”缴纳个人所得税的有( )。","opts":{"A":"作者去世后，财产继承人取得的遗作稿酬","B":"作者将自己的文字作品手稿原件或复印件公开拍卖取得的所得","C":"作者将自己收藏多年的字画公开拍卖取得的所得","D":"专业作者取得的发表作品费"},"ans":"AD","raw":"【解析】(1)选项B:按“特许权使用费所得”征收个人所得税。\n(2)选项C:按“财产转让所得”征收个人所得税。","block":"5-5","exam":"稿酬所得的界定","think":"<b>A</b> 作者去世后财产继承人取得的<b>遗作稿酬</b> → 稿酬 ✔；<b>D</b> 专业作者取得的发表作品费 → 稿酬 ✔。<br><b>B</b> 作者将自己文字作品手稿原件/复印件公开拍卖 → <b>特许权使用费所得</b>；<b>C</b> 作者拍卖自己收藏多年的字画 → <b>财产转让所得</b>。答案 <b>AD</b>。","trap":"「拍卖」两个选项都不是稿酬：拍的是自己的作品权利→特许权，拍的是物品→财产转让。"},{"no":7,"type":"multi","stem":"下列各项中，按照“利息、股息、红利所得”缴纳个人所得税的有( )。","opts":{"A":"一人有限责任公司为其个人投资者购买汽车","B":"股份制企业为普通雇员购买房屋","C":"个人取得量化资产的分红","D":"纳税年度内个人投资者从其投资的有限责任公司借款用于家庭支出且年终未归还"},"ans":"ACD","raw":"【解析】(1)选项A:个人独资企业、合伙企业以外的其他企业用企业资金为其个人投资\n者或其家庭成员购买房屋等财产，按照“利息、股息、红利所得”缴纳个人所得税。\n(2)选项B:企业用企业资金为本企业除投资者以外的雇员购买房屋等财产，按照“工资、\n薪金所得”缴纳个人所得税。\n(3)选项D:纳税年度内个人投资者从其投资企业(个人独资企业、合伙企业除外)借款，\n在该纳税年度终了后既不归还，又未用于企业生产经营的，其未归还的借款可视为企业\n对个人投资者的红利分配，按照“利息、股息、红利所得”缴纳个人所得税。","block":"5-14","exam":"利息股息红利所得的变相分配","think":"<b>A</b> 一人有限责任公司为个人投资者买车 → 视为红利分配 ✔；<b>C</b> 个人取得量化资产的分红 → 利息股息红利 ✔；<b>D</b> 个人投资者从其投资企业借款、纳税年度终了既不归还又未用于生产经营 → 视为红利分配 ✔。<br><b>B</b> 股份制企业为<b>普通雇员</b>买房 → 按<b>工资薪金所得</b>。答案 <b>ACD</b>。","trap":"判断人是「投资者」还是「雇员」，一个词决定税目。D 的两个条件(年终未归还 + 未用于生产经营)缺一不可。"},{"no":8,"type":"multi","stem":"(非标准题)下列各项中，按照“财产转让所得”缴纳个人所得税的有( )。","opts":{"A":"个人取得的财产转租收入","B":"个人转让新三板挂牌公司原始股收入","C":"个人取得的仅作为分红依据，不拥有所有权的企业量化资产","D":"个人拍卖收藏的他人文字作品手稿原件收入","E":"创投企业选择按年度所得整体核算的，其个人合伙人应从创投企业取得的所得","F":"个人终止投资，从被投资企业取得违约金、补偿金","G":"雇员律师从事务所取得的分成收入","H":"投资者以低于被收购企业净资产价格取得该企业100%股权后将盈余积累转增股本","I":"个人转让限售股取得的所得"},"ans":"BDFI","raw":"【解析】(1)选项A:按照“财产租赁所得”缴纳个人所得税。\n(2)选项C:不征个人所得税。\n(3)选项D:个人拍卖别人的文字作品手稿或个人拍卖除文字作品手稿原件及复印件外\n的其他财产，都应按照“财产转让所得”缴纳个人所得税。\n(4)选项E:按照“经营所得”缴纳个人所得税。\n(5)选项F:个人因各种原因终止投资、联营、经营合作等行为，从被投资企业或合作项\n目、被投资企业的其他投资者以及合作项目的经营合作人取得股权转让收入、违约金、\n补偿金、赔偿金及以其他名目收回的款项等，均属于个人所得税应税收入，应按照“财\n产转让所得”项目适用的规定计算缴纳个人所得税。\n(6)选项G:按照“工资、薪金所得”缴纳个人所得税。\n(7)选项H:新股东以低于净资产价格收购股权的，企业原盈余积累中，对于股权收购价\n格减去原股本的差额部分已经计入股权交易价格，新股东取得盈余积累转增股本的部分，\n不征收个人所得税；对于股权收购价格低于原所有者权益的差额部分未计入股权交易价格，\n新股东取得盈余积累转增股本的部分，应按照“利息、股息、红利所得”缴纳个人所得税。","block":"5-13","exam":"【9 选项】财产转让所得的边界","think":"<b>B</b> 转让新三板挂牌公司原始股 → 财产转让 ✔；<b>D</b> 拍卖收藏的<b>他人</b>文字作品手稿原件 → 财产转让 ✔；<b>F</b> 终止投资从被投资企业取得违约金、补偿金 → 财产转让 ✔；<b>I</b> 转让限售股 → 财产转让 ✔。<br><b>A</b> 财产转租收入 → 财产租赁；<b>C</b> 仅作分红依据、不拥有所有权的量化资产 → 不征；<b>E</b> 创投按年度所得整体核算，合伙人所得 → 经营所得；<b>G</b> 雇员律师分成收入 → 工资薪金；<b>H</b> 低价收购股权后盈余积累转增股本 → 按情形不征或按利息股息红利。答案 <b>BDFI</b>。","trap":"9 个选项要逐个归类。E 只在<b>单一投资基金核算</b>时才按 20%，「按年度所得整体核算」是经营所得；H 的两种情形要分清楚。"},{"no":9,"type":"multi","stem":"下列各项中，按照“偶然所得”缴纳个人所得税的有( )","opts":{"A":"受赠人因无偿受赠房屋取得的受赠收入","B":"个人取得的企业向其支付的不竞争款项","C":"律师以个人名义聘请其他人员为其工作而支付的报酬","D":"对累积消费达到一定额度的个人按消费积分反馈礼品"},"ans":"AB","raw":"【解析】(1)选项C:按照“劳务报酬所得”缴纳个人所得税。\n(2)选项D:不征收个人所得税。","block":"5-14","exam":"偶然所得的界定与不征税情形","think":"<b>A</b> 受赠人因无偿受赠房屋取得的受赠收入 → 偶然所得 ✔；<b>B</b> 个人取得企业支付的不竞争款项 → 偶然所得 ✔。<br><b>C</b> 律师以个人名义聘请他人工作支付的报酬 → <b>劳务报酬所得</b>；<b>D</b> 累积消费达一定额度按消费积分<b>反馈礼品</b> → <b>不征收</b>个税。答案 <b>AB</b>。","trap":"积分反馈礼品(不征)与「额外抽奖机会」(按偶然所得征)是一对，别记反。"},{"no":10,"type":"multi","stem":"下列情形中，不征收个人所得税的有( )。","opts":{"A":"顾客取得企业赠送的具有价格折扣性质的消费券","B":"企业对累积消费达到一定额度的顾客，给予额外抽奖机会，个人的获奖所得","C":"企业在年会中向本单位以外的个人赠送礼品，个人取得的礼品所得","D":"企业通过价格折扣方式向个人销售商品"},"ans":"AD","raw":"不征个税：企业赠送具有价格折扣或折让性质的消费券、代金券、抵用券、优惠券(A)；通过价格折扣折让方式向个人销售商品和提供服务(D)。按偶然所得征税：对累积消费达到一定额度的顾客给予额外抽奖机会的获奖所得(B)、企业在年会中向本单位以外个人赠送礼品(C)。判断关键是\"有没有对价\"——折扣折让是买卖的一部分，白送才是偶然所得。","block":"5-19","exam":"不征收个人所得税的情形","think":"判断口径是<b>有没有对价</b>：<b>A</b> 具有价格折扣性质的消费券 → 只是折扣凭证，不征 ✔；<b>D</b> 企业通过价格折扣方式向个人销售商品 → 买卖的一部分，不征 ✔。<br><b>B</b> 累积消费达额度给予<b>额外抽奖机会</b>、个人获奖所得 → 按偶然所得征；<b>C</b> 年会向本单位<b>以外</b>个人赠送礼品 → 按偶然所得征。答案 <b>AD</b>。","trap":"「折扣折让」不征、「白送」要征。B 的「额外」二字说明没对价，C 的「本单位以外」说明不是员工福利。"},{"no":11,"type":"multi","stem":"居民个人取得的下列所得中，在计缴个人所得税时可享受专项附加扣除的有( )。","opts":{"A":"偶然所得","B":"经营所得","C":"综合所得","D":"财产转让所得"},"ans":"BC","raw":"【解析】纳税人取得综合所得或经营所得可以扣除专项附加扣除。","block":"5-7","exam":"哪些所得可以扣专项附加扣除","think":"专项附加扣除是减<b>应纳税所得额</b>的，只有按年计算所得额的<b>综合所得(C)</b>和<b>经营所得(B)</b>挂得上；分类所得大多按收入全额×20%，没有减除环节。<b>A</b> 偶然所得、<b>D</b> 财产转让所得都不能扣。答案 <b>BC</b>。","trap":"别把「只要是个人所得就能扣专项附加」当默认；这一限制是量能负担只在综合计税中才有意义的直接结果。"},{"no":12,"type":"multi","stem":"下列所得中，适用按次征收个人所得税的有( )。","opts":{"A":"居民个人张某出租闲置商铺的租金所得","B":"非居民个人约翰在境内提供连续性劳务的劳务报酬所得","C":"个人独资企业的投资者取得的经营所得","D":"非居民个人汤姆在境内任职取得的加班费"},"ans":"AB","raw":"【解析】(1)选项A:财产租赁所得，按次计征。\n(2)选项BD:非居民个人取得工资薪金所得，按月计征；取得劳务报酬、稿酬、特许权\n使用费所得，按次计征。\n(3)选项C:经营所得，按年计征。","block":"5-3","exam":"按次计征的所得","think":"<b>A</b> 财产租赁所得 → 以 1 个月内收入为一次，按次 ✔；<b>B</b> 非居民个人在境内提供连续性劳务的劳务报酬 → 按次 ✔(非居民不汇算，工劳稿特按月或按次)。<br><b>D</b> 非居民个人在境内任职取得的加班费 → 工资薪金<b>按月</b>；<b>C</b> 个人独资企业投资者取得的经营所得 → <b>按年</b>。答案 <b>AB</b>。","trap":"非居民的四项所得里，工资按月、劳稿特按次，别一律按次或一律按月。"},{"no":13,"type":"multi","stem":"居民个人取得的下列所得中，除另有规定外，以收入全额作为应纳税所得额缴纳个人所得税的有( )。","opts":{"A":"财产转让所得","B":"偶然所得","C":"经营所得","D":"利息、股息、红利所得"},"ans":"BD","raw":"【解析】(1)选项A:以收入减除财产原值和合理费用后的余额为应纳税所得额。\n(2)选项C:以每一纳税年度的收入总额减除成本、费用以及损失等后的余额为应纳税所\n得额。","block":"5-3","exam":"以收入全额作为应纳税所得额的项目","think":"<b>B</b> 偶然所得、<b>D</b> 利息股息红利所得 → 一律<b>收入全额 ×20%</b>，不减任何费用 ✔。<br><b>A</b> 财产转让所得 → 减财产原值和合理费用；<b>C</b> 经营所得 → 减成本、费用及损失。答案 <b>BD</b>。","trap":"「全额计税」四个字在个税里只对应这两项。看到财产转让 / 经营所得，一定要减。"},{"no":14,"type":"multi","stem":"下列关于全员全额扣缴申报纳税的表述，正确的有( )。","opts":{"A":"扣缴义务人每月或者每次预扣、代扣的税款，应当在次月15日内缴入国库","B":"对扣缴义务人按照规定扣缴的税款，按年付给1%手续费","C":"非居民个人由扣缴义务人按月或者按次代扣代缴税款，不办理汇算清缴","D":"经营所得实行全员全额扣缴申报"},"ans":"AC","raw":"【解析】(1)选项B:对扣缴义务人按照规定扣缴的税款，按年付给2%手续费。\n(2)选项D:经营所得不实行扣缴申报，而是由纳税人自行申报纳税。","block":"5-21","exam":"全员全额扣缴申报","think":"<b>A</b> 每月或每次预扣、代扣的税款应在<b>次月 15 日内</b>缴入国库 ✔；<b>C</b> 非居民个人由扣缴义务人按月或按次代扣代缴，<b>不办理汇算清缴</b> ✔。<br><b>B</b> 对扣缴义务人按规定扣缴的税款，按年付给 <b>2%</b> 手续费(不是 1%)；<b>D</b> 经营所得<b>不实行</b>全员全额扣缴申报，由纳税人自行申报。答案 <b>AC</b>。","trap":"2% 的手续费和「经营所得自行申报」是两处固定错项，几乎每年都拿出来改数。"},{"no":15,"type":"multi","stem":"(非标准题)某个体工商户发生的下列支出中，不得在个人所得税税前扣除的有( )。","opts":{"A":"摊位费","B":"研究开发新产品所发生的开发费用","C":"代从业人员负担的税款","D":"实际发生的工会经费","E":"家庭生活用电支出","F":"业主的工资薪金支出","G":"研究开发新产品而购置单台价值8万元的测试仪器","H":"职工福利费支出超过工资薪金总额14%的部分"},"ans":"CEFH","raw":"【解析】(1)选项AB:据实扣除。\n(2)选项C:个体工商户代其从业人员或者他人负担的税款，不得税前扣除。\n(3)选项D:工会经费在工资薪金总额2%标准内据实扣除。\n(4)选项G:个体工商户研究开发新产品、新技术、新工艺所发生的开发费用，以及研\n究开发新产品、新技术而购置单台价值在10万元以下的测试仪器和试验性装置的购置费\n准予直接扣除；单台价值在10万元以上(含10万元)的测试仪器和试验性装置，按固\n定资产管理，不得在当期直接扣除。\n(5)选项H:职工福利费支出在工资薪金总额14%标准内，准予扣除；超过部分不得\n扣除。","block":"5-11","exam":"【8 选项】个体户不得税前扣除的支出","think":"<b>C</b> 代从业人员负担的税款 ✔不得扣；<b>E</b> 家庭生活用电支出 ✔不得扣；<b>F</b> 业主本人工资薪金支出 ✔不得扣；<b>H</b> 职工福利费超过工资薪金总额 <b>14%</b> 的部分 ✔不得扣。<br><b>A</b> 摊位费、<b>B</b> 研发新产品开发费用 → 据实扣；<b>D</b> 工会经费在 <b>2%</b> 内据实扣；<b>G</b> 研发购置单台 <b>8 万元</b>测试仪器(<10 万)准予直接扣除。答案 <b>CEFH</b>。","trap":"G 的门槛是 <b>10 万元</b>：8 万可直接扣，10 万以上(含)才按固定资产。D 别看成「工会经费一律不许扣」。"},{"no":16,"type":"multi","stem":"某个人独资企业2025年由于会计核算不健全，由查账征收改为核定征收。则下列表述中，正确的有( )。","opts":{"A":"除另有规定外，不能享受个人所得税的优惠政策","B":"在查账征收方式下认定的年度经营亏损未弥补完的部分，可以继续弥补","C":"按核定应纳税所得额的30%扣除公益捐赠支出","D":"企业经营多业的，应根据其主营项目确定其适用的应税所得率"},"ans":"AD","raw":"【解析】(1)选项B:在查账征收方式下认定的年度经营亏损未弥补完的部分，不得再继\n续弥补。\n(2)选项C:经营所得采取核定征收方式的，不扣除公益捐赠支出。","block":"5-11","exam":"核定征收的三不","think":"<b>A</b> 除另有规定外，核定征收不能享受个人所得税优惠政策 ✔；<b>D</b> 企业经营多业的，根据<b>主营项目</b>确定适用应税所得率 ✔。<br><b>B</b> 查账征收方式下认定的年度经营亏损未弥补完部分，<b>不得再继续弥补</b>；<b>C</b> 核定征收<b>不扣除</b>公益捐赠支出(不是按 30% 扣)。答案 <b>AD</b>。","trap":"核定征收的所得额是估出来的，所以优惠、亏损弥补、限额扣除三项都失去依据。C 的「30%」是从查账口径搬来的诱饵。"},{"no":17,"type":"multi","stem":"张某将自有闲置商铺出租，不含增值税月租金2万元，计算个人所得税时，可以扣除的项目包括( 。","opts":{"A":"贷款利息","B":"房产税","C":"修缮费","D":"装修费"},"ans":"BC","raw":"【解析】个人出租房产取得租金收入按照财产租赁所得交税，扣除项目包括：\n(1)在出租财产过程中缴纳的税金(如城建税、房产税)和教育费附加等税费(选项B)。\n(2)向出租方支付的租金和增值税额(仅限转租)。\n(3)由纳税人负担的该出租财产实际开支的修缮费用(每月以800元为限)(选项C)。\n(4)法定扣除标准为800元或20%","block":"5-12","exam":"财产租赁的可扣项目","think":"个人出租房产按财产租赁计税，可扣：① 出租过程中缴纳的税金及教育费附加(<b>B 房产税</b>) ✔；② 转租情形下向出租方支付的租金；③ 由纳税人负担的<b>修缮费</b>(每月限 800 元，<b>C</b>) ✔；④ 法定减除费用 800 元或 20%。<br><b>A 贷款利息、D 装修费</b>都不在清单里。答案 <b>BC</b>。","trap":"「装修费」不是「修缮费」。这是本章最经典的凑选项，看到就划掉。"},{"no":18,"type":"multi","stem":"下列关于个人转让股权个人所得税处理的相关表述中，正确的有( )。","opts":{"A":"证券交易中心为扣缴义务人","B":"将股权转让给配偶的，转让收入明显偏低，但视为有正当理由","C":"转让方无法提供股权转让收入的相关资料，税务机关可以核定股权转让收入","D":"多次取得同一被投资企业股权的，转让部分股权时采用先进先出法确定股权原值"},"ans":"BC","raw":"【解析】(1)选项A:股权转让方为纳税人，受让方为扣缴义务人。\n(2)选项D:多次取得同一被投资企业股权的，转让部分股权时采用加权平均法确定股\n权原值。","block":"5-13","exam":"个人转让股权的处理","think":"<b>B</b> 将股权转让给配偶，转让收入明显偏低但<b>视为有正当理由</b> ✔；<b>C</b> 转让方无法提供股权转让收入相关资料，税务机关可<b>核定</b>转让收入 ✔。<br><b>A</b> 股权转让方是纳税人、<b>受让方</b>是扣缴义务人(证券交易中心不是)；<b>D</b> 多次取得同一被投资企业股权，转让部分股权时采用<b>加权平均法</b>确定原值，不是先进先出。答案 <b>BC</b>。","trap":"A 的纳税人/扣缴人方向、D 的加权平均法，都是把公司法/存货口径搬来改成错项。"},{"no":19,"type":"multi","stem":"下列房屋产权的无偿赠与行为，不征收个人所得税的有( )。","opts":{"A":"张某将商铺赠与其女儿","B":"李某将住房赠与其好友","C":"王某将别墅赠与其赡养人","D":"赵某死亡，取得其住房的受遗赠人"},"ans":"ACD","raw":"【解析】以下情形的房屋产权无偿赠与，对当事双方不征收个人所得税：\n(1)房屋产权所有人将房屋产权无偿赠与配偶、父母、子女、祖父母、外祖父母、孙子女、\n外孙子女、兄弟姐妹(选项A)。\n(2)房屋产权所有人将房屋产权无偿赠与对其承担直接抚养或者赡养义务的抚养人或者\n赡养人(选项C)\n(3)房屋产权所有人死亡，依法取得房屋产权的法定继承人、遗嘱继承人或者受遗赠人\n(选项D)。","block":"5-13","exam":"房屋产权无偿赠与不征个税的情形","think":"三类不征：① 无偿赠与<b>配偶、父母、子女、祖父母、外祖父母、孙子女、外孙子女、兄弟姐妹</b>(<b>A</b> 赠女儿 ✔)；② 赠与对其承担<b>直接抚养或赡养义务</b>的抚养人/赡养人(<b>C</b> ✔)；③ 房屋产权所有人死亡后，依法取得产权的法定继承人、遗嘱继承人或<b>受遗赠人</b>(<b>D</b> ✔)。<br><b>B</b> 赠与好友不在清单内，受赠人按偶然所得纳税。答案 <b>ACD</b>。","trap":"「赡养人」指对你承担直接赡养义务的人，不是你赡养的人；D 的<b>受遗赠人</b>也在免税清单里，别只记法定继承人。"},{"no":20,"type":"multi","stem":"下列个人所获得的收入，属于免征个人所得税的有( )。","opts":{"A":"保险理赔金额5000元","B":"商场抽奖所得500元","C":"单张发票中奖金额1000元","D":"举报犯罪行为获得奖金8000元"},"ans":"AD","raw":"【解析】(1)选项B:属于“偶然所得”,没有免税优惠。\n(2)选项C:个人取得单张有奖发票奖金所得不超过800元(含800元)的，暂免征收\n个人所得税；个人取得单张有奖发票奖金所得超过800元的，应全额按照“偶然所得”\n项目征收个人所得税。","block":"5-19","exam":"免征个人所得税的项目","think":"<b>A</b> 保险理赔金额 5000 元 → 免征 ✔；<b>D</b> 举报犯罪行为获得奖金 8000 元 → 免征 ✔。<br><b>B</b> 商场抽奖所得 500 元 → 偶然所得，<b>无免税</b>优惠(彩票才有 1 万元免税线)；<b>C</b> 单张有奖发票中奖 1000 元 → 超过 <b>800 元</b>，应全额按偶然所得征税。答案 <b>AD</b>。","trap":"三个不同的免税门槛别串：彩票 10000 元、有奖发票 800 元、商场抽奖无门槛。"},{"no":21,"type":"multi","stem":"居民个人取得的下列收入中，减按50%计入应纳税所得额缴纳个人所得税的有( )。","opts":{"A":"一个纳税年度内在船航行时间累计满183天的远洋船员取得的工资薪金收入","B":"因持有上市公司股票9个月而分得的股息收入","C":"因持有2024年发行的铁路债券取得的利息收入","D":"依法批准设立的非营利性研究开发机构从职务科技成果转化收入中给予科技人员的股权奖励"},"ans":"ABC","raw":"【解析】选项D:依法批准设立的非营利性研究开发机构和高等学校根据规定，从职务科\n技成果转化收入中给予科技人员的现金奖励，可减按50%人科技人员当月“工资、薪\n金所得”,依法缴纳个人所得税；以股份或出资比例等股权形式给予科技人员个人奖励，\n暂不征收个人所得税。","block":"5-19","exam":"减按 50% 计入应纳税所得额的项目","think":"<b>A</b> 一个纳税年度内在船航行时间累计满 <b>183 天</b>的远洋船员取得的工资薪金 ✔；<b>B</b> 持有上市公司股票 <b>9 个月</b>分得的股息(1 个月～1 年减半计入) ✔；<b>C</b> 持有 2024 年发行的<b>铁路债券</b>取得的利息 ✔。<br><b>D</b> 非营利性研发机构从职务科技成果转化收入给予科技人员的<b>股权奖励</b> → <b>暂不征收</b>个税；只有<b>现金奖励</b>才是减按 50% 计入当月工资薪金。答案 <b>ABC</b>。","trap":"D 把「股权奖励(暂不征)」和「现金奖励(减半)」调包，是本块最阴的一项。"},{"no":22,"type":"multi","stem":"(非标准题)下列各项所得中，(暂)免征或不征收个人所得税的有( )。","opts":{"A":"办理代扣代缴税款手续，按规定取得的扣缴手续费","B":"残疾、孤老人员和烈属的所得","C":"外籍个人从外商投资企业取得的股息、红利所得","D":"香港市场个人投资者投资上交所上市A股取得的转让差价所得","E":"农民取得的青苗补偿费","F":"个人投资者从投保基金公司取得的行政和解金","G":"高级专家延长退休期间从其任职单位取得符合规定的工资、薪金所得","H":"个人独资企业从事食品加工取得的所得"},"ans":"ACDEFG","raw":"选项B残疾、孤老人员和烈属所得是\"减征\"不是免征；选项H个人独资企业从事食品加工所得照章纳税。其余AC(扣缴手续费、外籍个人从外商投资企业取得股息红利)DE(香港个人投资A股差价、青苗补偿费)FG(行政和解金、高级专家延长退休工资)属于(暂)免征或不征。","block":"5-19","exam":"【8 选项】(暂)免征或不征收个税的项目","think":"<b>A</b> 办理代扣代缴手续按规定取得的扣缴手续费 → 免 ✔；<b>C</b> 外籍个人从外商投资企业取得的股息红利 → 免 ✔；<b>D</b> 香港市场个人投资者投资上交所上市 A 股取得的转让差价 → 暂免 ✔；<b>E</b> 农民取得的青苗补偿费 → 不征 ✔；<b>F</b> 个人投资者从投保基金公司取得的行政和解金 → 暂不征 ✔；<b>G</b> 高级专家延长退休期间从任职单位取得符合规定的工资薪金 → 免 ✔。<br><b>B</b> 残疾、孤老人员和烈属的所得 → <b>减征</b>(由省级政府定幅度和期限)，不是免征也不是不征；<b>H</b> 个人独资企业从事食品加工取得的所得 → <b>照章征税</b>。答案 <b>ACDEFG</b>。","trap":"「减征」不属于「免征或不征」，B 必须排除；H 别因为「个人」两个字就往优惠里归。8 选项题逐个标档再勾。"},{"no":23,"type":"multi","stem":"下列关于彩票中奖的表述中，正确的有( )。","opts":{"A":"电脑彩票以同一人在同一期同一游戏中获得的全部奖金为一次中奖收入","B":"即开型彩票以一张彩票奖金为一次中奖收入","C":"中奖人应自行申报缴纳个人所得税","D":"电脑彩票一次中奖收入未超过10000元的，无须办理免税申报"},"ans":"AB","raw":"【解析】(1)选项C:彩票机构负责代扣代缴个人所得税。\n(2)选项D:由彩票机构为电脑彩票一次中奖收入超过3000元至10000元(含)的个\n人办理免税申报，为电脑彩票和即开型彩票一次中奖收入超过10000元的个人办理纳税\n申报。","block":"5-14","exam":"彩票中奖的「一次」与申报义务","think":"<b>A</b> 电脑彩票以<b>同一人在同一期同一游戏中获得的全部奖金</b>为一次中奖收入 ✔；<b>B</b> 即开型彩票以<b>一张彩票</b>奖金为一次 ✔。<br><b>C</b> 由<b>彩票机构代扣代缴</b>个税，不是中奖人自行申报；<b>D</b> 由彩票机构为电脑彩票一次中奖收入<b>超过 3000 元至 10000 元(含)</b>的个人办理<b>免税申报</b>，不是「未超过 10000 元无须办理免税申报」。答案 <b>AB</b>。","trap":"3000 元是「需要办免税申报」的起点，10000 元是「是否征税」的分界，两个数别混。"},{"no":24,"type":"multi","stem":"下列关于居民换购住房的个人所得税规定的表述中，正确的有( )。","opts":{"A":"现住房转让金额和新购住房金额与核定计税价格不一致的，以核定计税价格为准","B":"出售和重新购买的住房应在同一省范围内","C":"对出售自有住房并在现住房出售后1年内在市场重新购买住房的纳税人，对其出售现住房已缴纳的个人所得税予以退税优惠","D":"新购住房金额小于现住房转让金额的，全部退还已缴纳的个人所得税"},"ans":"AC","raw":"【解析】(1)选项B:纳税人出售和重新购买的住房应在同一城市范围内。同一城市范围\n是指同一直辖市、副省级城市、地级市(地区、州、盟)所辖全部行政区划范围。\n(2)选项D:新购住房金额小于现住房转让金额的，按新购住房金额占现住房转让金额\n的比例退还出售现住房已缴纳的个人所得税。","block":"5-21","exam":"居民换购住房退税条件","think":"<b>A</b> 现住房转让金额和新购住房金额与核定计税价格不一致的，以<b>核定计税价格</b>为准 ✔；<b>C</b> 出售自有住房并在现住房出售后 <b>1 年内</b>在市场重新购买住房的，对出售现住房已缴个税予以退税 ✔。<br><b>B</b> 出售与重新购买的住房应在<b>同一城市</b>范围内(不是同一省)；<b>D</b> 新购金额小于现住房转让金额的，按<b>新购金额占现住房转让金额的比例</b>退还，不是全部退还。答案 <b>AC</b>。","trap":"「同一城市」的三个字和「按比例退」是本块两个固定错项，多选 42 又会再考一次比例。"},{"no":25,"type":"multi","stem":"张某是某境内上市公司员工，2025年年初被该公司授予股票期权，一年后可行权。下列处理中，符合规定的有( )。","opts":{"A":"行权所得应单独计算纳税","B":"张某可在不超过5年内缴纳个人所得税","C":"授权时张某应按“工资、薪金所得”缴纳个人所得税","D":"张某将行权后的股票再行转让而取得的所得免征个人所得税"},"ans":"AD","raw":"【解析】(1)选项B:上市公司授予个人的股票期权、限制性股票和股权奖励，经向主管\n税务机关备案，个人可自股票期权行权、限制性股票解禁或取得股权奖励之日起，在不\n超过36个月的期限内缴纳个人所得税。\n(2)选项C:员工接受实施股票期权计划企业授予的股票期权时，除另有规定外，一般不\n作为应税所得征税。","block":"5-16","exam":"上市公司股票期权的税务处理","think":"<b>A</b> 行权所得<b>单独计算纳税</b>(不并入当年综合所得) ✔；<b>D</b> 行权后将股票再转让取得的所得<b>免征</b>个税(境内上市公司股票) ✔。<br><b>B</b> 经向主管税务机关备案，可自行权/解禁/取得奖励之日起在不超过 <b>36 个月</b>内缴纳(不是 5 年)；<b>C</b> 授权时除另有规定外<b>一般不作为应税所得</b>。答案 <b>AD</b>。","trap":"36 个月和 5 个公历年度是两处不同的分期：股权激励 36 个月，非货币资产投资 5 年。"},{"no":26,"type":"multi","stem":"居民个人取得下列各项所得，符合规定条件的，可暂不缴纳个人所得税的有( )。","opts":{"A":"科研机构转化职务科技成果以股权形式给予科技人员个人奖励","B":"高新技术企业转化科技成果，给予本企业相关技术人员的股权奖励","C":"非上市公司授予本公司员工限制性股票","D":"国家机关给予办理内部退养员工的一次性补贴"},"ans":"AC","raw":"【解析】(1)选项B:全国范围内的高新技术企业转化科技成果，给予本企业相关技术\n人员的股权奖励，个人一次缴纳税款有困难的，可根据实际情况自行制定分期缴税计划，\n在不超过5个公历年度内(含)分期缴纳，并将有关资料报主管税务机关备案。\n(2)选项D:个人办理内部退养手续而取得的一次性补贴收入，按规定计算纳税。","block":"5-16","exam":"符合条件可暂不缴纳个税的股权奖励","think":"<b>A</b> 科研机构转化职务科技成果以<b>股权形式</b>给予科技人员个人奖励 → 暂不缴 ✔；<b>C</b> 非上市公司授予本公司员工<b>限制性股票</b>(符合条件可递延至转让时) → 暂不缴 ✔。<br><b>B</b> 高新技术企业转化科技成果给予本企业技术人员的股权奖励 → 一次缴税困难的可自行制定分期计划，在不超过 <b>5 个公历年度</b>内分期缴纳，是「可分期」不是「暂不缴」；<b>D</b> 办理内部退养取得的一次性补贴 → 按规定照章计算纳税。答案 <b>AC</b>。","trap":"「暂不缴」「可分期」是两种不同待遇，B 把后者写成前者，是本块最细的一条分界。"},{"no":27,"type":"multi","stem":"有关个人转让上市公司限售股的规定，下列表述正确的有( )。","opts":{"A":"纳税地点为发行限售股的上市公司所在地","B":"纳税人同时持有限售股及该股流通股的，其转让股票视同为先转让流通股","C":"证券机构扣缴的税款，于次月7日内以纳税保证金形式向主管税务机关缴纳","D":"纳税人未能提供完整、真实的限售股原值凭证的，按限售股转让收入全额缴纳个人所得税"},"ans":"AC","raw":"【解析】(1)选项B:纳税人同时持有限售股及该股流通股的，转让股票视同为先转让限\n售股，按规定计算缴纳个人所得税。\n(2)选项D:如果纳税人未能提供完整、真实的限售股原值凭证的，不能准确计算限售\n股原值的，主管税务机关一律按限售股转让收入的15%定限售股原值及合理税费。","block":"5-13","exam":"个人转让上市公司限售股","think":"<b>A</b> 纳税地点为发行限售股的<b>上市公司所在地</b> ✔；<b>C</b> 证券机构扣缴的税款于<b>次月 7 日内</b>以纳税保证金形式向主管税务机关缴纳 ✔。<br><b>B</b> 同时持有限售股及该股流通股的，转让股票<b>视同先转让限售股</b>(不是流通股)；<b>D</b> 未能提供完整真实限售股原值凭证的，主管税务机关按限售股转让收入的 <b>15%</b> 核定原值及合理税费，不是按收入全额计税。答案 <b>AC</b>。","trap":"B 的方向(先限售股)、D 的 15% 核定率，都是把「对纳税人不利」的口径反过来写成错项。"},{"no":28,"type":"multi","stem":"关于创投企业选择按单一投资基金核算的个人所得税政策的表述中，正确的有( )。","opts":{"A":"其个人合伙人从该基金应分得的股权转让所得，按照“经营所得”缴纳个人所得税","B":"符合条件的，可以按照被转让项目对应投资额的70%抵扣其应从基金年度股权转让所得中分得的份额后再计算其应纳税额","C":"创投企业选择按单一投资基金核算后，5年内不能变更","D":"其个人合伙人从该基金应分得的股息红利所得，按照20%税率计算缴纳个人所得税"},"ans":"BD","raw":"【解析】(1)选项AD:创投企业选择按单一投资基金核算的，其个人合伙人从该基金应\n分得的股权转让所得和股息红利所得，按照20%税率计算缴纳个人所得税。\n(2)选项C:创投企业选择按单一投资基金核算或按创投企业年度所得整体核算后，3年\n内不能变更。","block":"5-17","exam":"创投企业单一投资基金核算","think":"<b>B</b> 符合条件的，可按被转让项目对应投资额的 <b>70%</b> 抵扣其应从基金年度股权转让所得中分得的份额后再算税额 ✔；<b>D</b> 个人合伙人从该基金分得的股息红利所得按 <b>20%</b> 税率计税 ✔。<br><b>A</b> 单一投资基金核算下，股权转让所得也按 <b>20%</b>，不是经营所得；<b>C</b> 选择核算方式后 <b>3 年内</b>不能变更(不是 5 年)。答案 <b>BD</b>。","trap":"两种核算方式别串：<b>整体核算→经营所得</b>，<b>单一基金核算→一律 20%</b>；3 年锁定是防来回切换。"},{"no":29,"type":"multi","stem":"下列关于居民个入境外所得税额扣除的表述，正确的有( )","opts":{"A":"来源于中国境外一个国家的综合所得、经营所得以及其他分类所得，应分别计算抵免限额、分别抵免","B":"按照境外所得税法律属于错缴的境外所得税税额不属于可抵免的境外所得税额","C":"境外所得税纳税人从境外征税主体得到实际返还的境外所得税税额属于可抵免的境外所得税额","D":"因少缴境外所得税而追加的利息不属于可抵免的境外所得税额"},"ans":"BD","raw":"【解析】(1)选项A:除另有规定外，来源于中国境外一个国家(地区)的综合所得抵免\n限额、经营所得抵免限额以及其他分类所得抵免限额之和，为来源于该国家(地区)所\n得的抵免限额。\n(2)选项C:境外所得税纳税人或者其利害关系人从境外征税主体得到实际返还或补偿的\n境外所得税税款，不可抵免境外所得税额。","block":"5-20","exam":"境外所得税额抵免的规则","think":"<b>B</b> 按境外所得税法律属于<b>错缴或错征</b>的税额，不属于可抵免的境外所得税额 ✔(该表述正确)；<b>D</b> 因少缴境外所得税而追加的<b>利息</b>不属于可抵免税额 ✔(该表述正确)。<br><b>A</b> 来源于境外一个国家的综合所得、经营所得及其他分类所得抵免限额应<b>相加合并</b>为一个国家的限额(分国不分项)，不是「分别计算、分别抵免」；<b>C</b> 从境外征税主体得到<b>实际返还或补偿</b>的税款<b>不可</b>抵免(选项说「属于可抵免」，错)。答案 <b>BD</b>。","trap":"A 的「分别抵免」和 C 的「返还也可抵」是两处反向错项。记一句：<b>分国不分项，凡不是依法应缴且实际负担的都不算</b>。"},{"no":30,"type":"multi","stem":"个人发生的下列公益捐赠，税前可以全额扣除的有( )。","opts":{"A":"对中国福利会的捐赠","B":"通过国家机关向农村义务教育的捐赠","C":"通过国家机关向公益性青少年活动场所的捐赠","D":"通过中国境内非营利的社会团体向非营利养老院的捐赠"},"ans":"ABCD","raw":"个人公益捐赠税前全额扣除的项目：对公益性青少年活动场所、老年服务机构、农村义务教育、红十字事业、非关联科研机构和高等学校用于研发的捐赠，以及对中华健康快车基金会、孙冶方经济科学基金会、中华慈善总会、中国福利会等特定公益组织的捐赠。四项全选ABCD。","block":"5-19","exam":"公益捐赠全额扣除项目","think":"个人公益捐赠税前<b>全额扣除</b>的清单包括：对<b>中国福利会</b>等特定公益组织(A ✔)、通过国家机关向<b>农村义务教育</b>(B ✔)、对<b>公益性青少年活动场所</b>(C ✔)、对<b>非营利养老院等老年服务机构</b>(D ✔)的捐赠，另有红十字事业、非关联科研机构与高校用于研发等。四项全对，答案 <b>ABCD</b>。","trap":"全额扣除是<b>清单式</b>优惠，不在清单内的一律按应纳税所得额 30% 限额。别因为「全额」少见就少选。"},{"no":31,"type":"multi","stem":"下列纳税人中，应当在取得所得的次年3月1日至6月30日内向主管税务机关办理纳税申报的有( )。","opts":{"A":"全年工资收入20万元且需要补税600元的张某","B":"取得财产租赁所得但扣缴义务人未扣缴税款的李某","C":"从中国境外取得股息所得的王某","D":"因移居境外注销中国户籍的刘某"},"ans":"AC","raw":"【解析】(1)选项A:取得综合所得应当依法办理汇算清缴的，在取得所得的次年3月1\n日至6月30日内向任职、受雇单位所在地主管税务机关办理纳税申报。\n(2)选项B:纳税人取得利息、股息、红利所得，财产租赁所得，财产转让所得和偶然所得\n的，扣缴义务人未扣缴税款，应当在取得所得的次年6月30日前，按相关规定向主管税\n务机关办理纳税申报。\n(3)选项C;从中国境外取得所得，应当在取得所得的次年3月1日至6月30日内办理\n纳税申报。\n(4)选项D:因移居境外注销中国户籍，应当在申请注销中国户籍前，向户籍所在地主\n管税务机关办理纳税申报，进行税款清算。","block":"5-21","exam":"次年 3/1–6/30 办理纳税申报的情形","think":"<b>A</b> 取得综合所得应当依法办理汇算清缴的(全年工资 20 万且需补税 600 元) → 次年 3/1–6/30 ✔；<b>C</b> 从中国境外取得所得 → 次年 3/1–6/30 ✔。<br><b>B</b> 取得财产租赁所得但扣缴义务人未扣缴税款的 → 应在取得所得的<b>次年 6 月 30 日前</b>按相关规定申报，不落在题干这段期间表述；<b>D</b> 因移居境外注销中国户籍 → 应在<b>申请注销户籍前</b>办理申报并清算税款。答案 <b>AC</b>。","trap":"四种情形四个时间口径，别一律套 3/1–6/30。B 的「未扣缴分类所得」和 D 的「注销前清算」是两条独立规则。"},{"no":32,"type":"multi","stem":"纳税人办理2025年度个人所得税综合所得汇算清缴，向纳税人任职受雇单位的主管税务机关申报；纳税人没有任职受雇单位的，可以申报纳税的地点有( )","opts":{"A":"户籍所在地","B":"经常居住地","C":"主要收入来源地","D":"任一扣缴义务人所在地"},"ans":"ABC","raw":"【解析】纳税人没有任职受雇单位的，向其户籍所在地、经常居住地或者主要收入来源地\n的主管税务机关申报。","block":"5-21","exam":"无任职受雇单位的汇算地点","think":"纳税人办理综合所得汇算，向<b>任职受雇单位</b>主管税务机关申报；<b>没有任职受雇单位</b>的，可向<b>户籍所在地(A)、经常居住地(B)、主要收入来源地(C)</b>主管税务机关申报。答案 <b>ABC</b>。<br><b>D</b> 「任一扣缴义务人所在地」不在法定选项内。","trap":"为什么不给「任一扣缴义务人所在地」？防纳税人挑征管宽松的地方，所以只给三个与本人有实际联系的地点。"},{"no":33,"type":"multi","stem":"张某2025年由于生病住院，发生与基本医保相关的医药费用支出，扣除医保报销后个人负担90000元。关于这笔医药费用，下列表述正确的有( )。","opts":{"A":"只能在办理年度汇算清缴时扣除","B":"只能由张某本人扣除","C":"可以由张某妻子扣除","D":"2025年可以扣除的大病医疗支出为75000元"},"ans":"ACD","raw":"【解析】在一个纳税年度内，纳税人发生的与基本医保相关的医药费用支出，扣除医保报\n销后个人负担(指医保目录范围内的自付部分)累计超过15000元的部分，由纳税人在\n办理年度汇算清缴时，在80000元限额内据实扣除；纳税人发生的医药费用支出可以选\n择由本人或者其配偶扣除。","block":"5-8","exam":"大病医疗专项附加扣除","think":"一个纳税年度内与基本医保相关的医药费用，扣除医保报销后个人负担(医保目录范围内自付部分)<b>累计超过 15000 元</b>的部分，在 <b>80000 元限额内</b>据实扣除：90000 − 15000 = <b>75000 元</b>(<b>D</b> ✔)。<br><b>A</b> 只能在办理<b>年度汇算清缴</b>时扣 ✔；<b>C</b> 可以选择由<b>本人或其配偶</b>扣除 ✔；<b>B</b> 「只能由本人扣」错。答案 <b>ACD</b>。","trap":"大病医疗是七项里唯一<b>只能汇算扣</b>的；配偶可扣，未成年子女发生的由父母一方扣。"},{"no":34,"type":"multi","stem":"张某2025年在上海工作，由于没有自有住房故租房居住，同时张某在老家购买的住房享受首套住房贷款利率，每月偿还住房贷款3000元。下列表述中，符合规定的有( )。","opts":{"A":"张某可同时享受住房贷款利息和住房租金专项附加扣除","B":"张某选择享受住房租金专项附加扣除更有利","C":"住房租金专项附加扣除的计算时间为租赁合同约定的房屋租赁期开始的当月至租赁期结束的当月","D":"张某可以在工资薪金所得预扣预缴时扣除专项附加扣除"},"ans":"BCD","raw":"【解析】(1)选项A:一个纳税年度内不得同时分别享受住房贷款利息专项附加扣除和住\n房租金专项附加扣除。\n(2)选项B:直辖市、省会(首府)城市、计划单列市以及国务院确定的其他城市，住房\n租金扣除标准为每月1500元；住房贷款利息扣除标准为每月1000元，所以张某选择享\n受住房租金专项附加扣除更有利。\n(3)选项D:享受子女教育、继续教育、住房贷款利息或者住房租金、赡养老人、3岁以\n下婴幼儿照护专项附加扣除的纳税人，自符合条件开始，可以由支付工资薪金的扣缴义\n务人在预扣预缴税款时，按其在本单位本年可享受的累计扣除额办理扣除，也可以在次\n年3月1日至6月30日内，向汇缴地主管税务机关办理汇算清缴申报时扣除。","block":"5-8","exam":"住房贷款利息与住房租金二选一","think":"<b>B</b> 上海属直辖市，住房租金扣除标准 <b>1500 元/月</b> > 住房贷款利息 <b>1000 元/月</b>，选租金更有利 ✔；<b>C</b> 住房租金扣除时间为租赁合同约定的租赁期<b>开始当月</b>至租赁期<b>结束当月</b> ✔；<b>D</b> 六项定额专项附加扣除可在工资薪金<b>预扣预缴时</b>扣 ✔。<br><b>A</b> 一个纳税年度内<b>不得同时</b>分别享受房贷利息和住房租金专项附加扣除。答案 <b>BCD</b>。","trap":"A 的「可同时享受」是绝对陷阱。三档租金标准(1500 / 1100 / 800)按城市类型选，别一律用 1500。"},{"no":35,"type":"multi","stem":"某个体工商户2025年应纳税所得额为180万元，当年发生符合规定的公益性捐赠支出60万元。下列关于公益性捐赠支出税前扣除的处理中，正确的有( )。","opts":{"A":"预缴时不扣除公益捐赠支出，统一在汇算清缴时扣除","B":"可以税前扣除的捐赠支出为60万元","C":"可以税前扣除的捐赠支出为54万元","D":"应妥善留存捐赠相关票据，留存期限为5年"},"ans":"CD","raw":"经营所得中扣除公益捐赠可选择在预缴或汇算时扣除(A错)；捐赠额不超过应纳税所得额30%的部分准予扣除：180×30%=54万元，不是全额60万(B错C对)；捐赠票据留存5年(D对)。注意个体户公益捐赠限额是应纳税所得额30%，企业所得税是利润总额12%。","block":"5-19","exam":"经营所得中公益捐赠的扣除","think":"<b>C</b> 通过公益性社会组织或县级以上政府及其部门用于规定公益事业的捐赠，不超过<b>应纳税所得额 30%</b> 的部分准予扣除：180×30% = <b>54 万元</b> ✔；<b>D</b> 应妥善留存捐赠票据，留存期限 <b>5 年</b> ✔。<br><b>A</b> 在经营所得中扣除公益捐赠，可选择在<b>预缴税款时</b>扣除，也可在汇算清缴时扣(不是「统一汇算」)；<b>B</b> 可扣 54 万不是全额 60 万。答案 <b>CD</b>。","trap":"个体户公益捐赠限额是<b>应纳税所得额 30%</b>，企业所得税是<b>利润总额 12%</b>——基数和比例都不同。"},{"no":36,"type":"multi","stem":"(非标准题)居民个人取得的下列所得中，能够按照累计预扣法预扣预缴个人所得税的有( )。","opts":{"A":"张某从任职公司取得的工资、薪金收入","B":"证券经纪人李某取得的佣金收入","C":"全日制研究生小王利用假期实习取得的报酬","D":"赵某兼职取得的收入","E":"吴某自互联网平台企业取得劳务报酬所得"},"ans":"ABCE","raw":"【解析】(1)选项A:扣缴义务人向居民个人支付工资、薪金所得时，应当按照累计预扣\n法计算预扣税款，并按月办理扣缴申报。\n(2)选项B:扣缴义务人向保险营销员、证券经纪人支付佣金收入时，应按照累计预扣法\n计算并预扣预缴税款。\n(3)选项C:正在接受全日制学历教育的学生因实习取得劳务报酬所得的，扣缴义务人预\n扣预缴个人所得税时，可按照累计预扣法计算并预扣预缴税款。\n(4)选项D:属于劳动报酬，按次预扣预缴个人所得税。\n(5)选项E:互联网平台从业人员自互联网平台企业取得劳务报酬所得，互联网平台企业\n按照规定的累计预扣法计算并预扣预缴税款。","block":"5-9","exam":"【5 选项】适用累计预扣法的情形","think":"<b>A</b> 工资薪金 ✔；<b>B</b> 证券经纪人佣金 ✔；<b>C</b> 正在接受全日制学历教育的学生因<b>实习</b>取得劳务报酬 ✔；<b>E</b> 互联网平台从业人员自平台企业取得劳务报酬 ✔。<br><b>D</b> 赵某<b>兼职</b>取得的收入属于普通劳务报酬，<b>按次</b>预扣预缴。答案 <b>ABCE</b>。","trap":"「实习」和「兼职」只有一词之差：全日制学生实习可累计预扣，普通兼职不行。这是本块的题眼。"},{"no":37,"type":"multi","stem":"美国公民约翰在中国境内无住所，由于工作原因临时来华，2025年4月6日入境、10月6日离境。则下列表述中，正确的有( )。","opts":{"A":"约翰2025年为我国的居民个人","B":"约翰2025年为我国的非居民个人","C":"约翰境内实际工作天数为183天","D":"约翰境内实际工作天数为184天"},"ans":"BC","raw":"【解析】(1)选项AB:无住所个人一个纳税年度内在中国境内累计居住天数，按照个人在\n中国境内累计停留的天数计算。在中国境内停留的当天满24小时的，计入中国境内居住\n天数，在中国境内停留的当天不足24小时的，不计入中国境内居住天数，居住天数=24+\n31+30+31+31+30+5=182(天)<183天，属于非居民个人。\n(2)选项CD:在境内停留的当天不足24小时的，按照半天计算境内工作天数，工作天\n数=24.5+31+30+31+31+30+5.5=183(天)。","block":"5-1","exam":"境内居住天数与境内工作天数","think":"<b>居住天数</b>判身份：当天在境内停留<b>满 24 小时</b>才计 1 天，不足 24 小时<b>不计</b>。4/6 入境、10/6 离境两天都不满 24 小时：24+31+30+31+31+30+5 = <b>182 天 < 183 天</b> → 非居民(<b>B</b> ✔，A 错)。<br><b>工作天数</b>算税额：入境、离境当天不足 24 小时各按 <b>0.5 天</b>：24.5+31+30+31+31+30+5.5 = <b>183 天</b>(<b>C</b> ✔，D 错)。答案 <b>BC</b>。","trap":"两个天数差的那 1 天，全在入境/离境两端。<b>判身份从严(不算天)，算税额从宽(算半天)</b>。"},{"no":38,"type":"multi","stem":"张某以其名下的仓库对外投资，取得甲公司10%股权。下列表述中，符合相关规定的有( )。","opts":{"A":"张某应按照“财产转让所得”缴纳个人所得税","B":"张某应向经常居住地主管税务机关申报纳税","C":"张某一次性缴税有困难的，可在不超过5个公历年度内(含)分期缴纳个人所得税","D":"应按取得股权的账面价值确认仓库转让收入"},"ans":"AC","raw":"以不动产投资：按\"财产转让所得\"纳税(A对)；主管税务机关为不动产所在地，不是经常居住地(B错)；一次性缴税困难可在不超过5个公历年度内分期(C对)；应按评估后的公允价值确认转让收入，不是股权账面价值(D错)。","block":"5-17","exam":"以非货币性资产投资","think":"<b>A</b> 以仓库对外投资视同转让财产，按<b>财产转让所得</b>纳税 ✔；<b>C</b> 一次性缴税有困难的，可在不超过 <b>5 个公历年度(含)</b>内分期缴纳 ✔。<br><b>B</b> 纳税人以不动产投资的，以<b>不动产所在地</b>税务机关为主管机关(不是经常居住地)；<b>D</b> 应按<b>评估后的公允价值</b>确认非货币性资产转让收入(不是取得股权的账面价值)。答案 <b>AC</b>。","trap":"「没收到现金」不等于不纳税——财产形态变了增值就实现；但税法给了 5 年分期缓冲。"},{"no":39,"type":"multi","stem":"张某是一家个体工商户业主，育有一子。2025年取得经营所得60万元，当年无其他所得。下列表述正确的有( )。","opts":{"A":"张某应自行申报纳税","B":"在月度或季度终了后15日内预缴税款","C":"张某应在2026年3月31日前，向其居住地主管税务机关办理汇算清缴","D":"张某可以在预缴税款时享受子女教育专项附加扣除"},"ans":"AB","raw":"取得经营所得应自行申报(A对)；月度或季度终了后15日内预缴(B对)；汇算清缴应向经营管理所在地主管税务机关办理，选项C写\"居住地\"错误(且汇算期是次年3月31日前)；经营所得的专项附加扣除只能在汇算清缴时减除，预缴时不得扣(D错)。","block":"5-21","exam":"经营所得的申报与扣除阶段","think":"<b>A</b> 取得经营所得应<b>自行申报</b>纳税 ✔；<b>B</b> 在月度或季度终了后 <b>15 日内</b>预缴税款 ✔。<br><b>C</b> 汇算清缴应向<b>经营管理所在地</b>主管税务机关办理(选项写「居住地」错；期限是次年 3 月 31 日前)；<b>D</b> 取得经营所得的，专项附加扣除<b>只能在办理汇算清缴时</b>减除，预缴时不得扣。答案 <b>AB</b>。","trap":"C 的地点和 D 的扣除阶段是两处「差一个词」的错项，与综合所得「可预扣」形成对照。"},{"no":40,"type":"multi","stem":"张某将一套住房无偿赠与好友王某，房产原值为100万元、赠与合同上标明的赠与房屋价值为140万元，受赠过程中王某支付契税等税费4.5万元。下列表述中，正确的有( )。","opts":{"A":"张某为个人所得税纳税人","B":"王某为个人所得税纳税人","C":"应缴纳个人所得税27.1万元","D":"应缴纳个人所得税7.1万元"},"ans":"BC","raw":"无偿受赠房屋，受赠人王某是纳税人，按\"偶然所得\"计税(B对A错)。应纳税所得额=赠与合同标明的房屋价值-受赠人支付的相关税费=(140-4.5)=135.5万元，应纳个税=135.5×20%=27.1万元(C对D错)。","block":"5-13","exam":"无偿受赠房屋的纳税人与税额","think":"<b>B</b> 受赠人因无偿受赠房屋取得的受赠所得按<b>偶然所得</b>纳税，纳税人是<b>受赠人王某</b> ✔；<b>C</b> 应纳税所得额 = 赠与合同标明的赠与房屋价值 − 赠与过程中受赠人支付的相关税费 = 140 − 4.5 = 135.5 万元，应纳个税 = 135.5×20% = <b>27.1 万元</b> ✔。<br><b>A</b> 赠与人未取得对价，不是纳税人；<b>D</b> 7.1 万元是答案册 OCR 把「27.1」丢了首位数字后的错值。答案 <b>BC</b>。","trap":"房产原值 100 万是干扰项(那是以后<b>转让</b>受赠房屋时才用的成本)；题目问的是<b>受赠环节</b>，只看合同标明价值减受赠税费。（核验：答案册OCR把\"27.1\"识别成\"7.1\"。）"},{"no":41,"type":"multi","stem":"张某为甲公司员工，2025年甲公司依照国家标准为张某办理了企业年金并每月缴费560元、张某每月自行缴费330元。张某上一年度月平均工资8000元，工作地上年度职工月平均工资3000元。下列表述中，符合规定的有( )。","opts":{"A":"甲公司缴费部分张某暂不缴纳个人所得税","B":"甲公司缴费部分应并入张某工资缴纳个人所得税","C":"张某缴费部分可以全额从其应纳税所得额中扣除","D":"张某缴费部分可以320元/月为限从其应纳税所得额中扣除"},"ans":"AD","raw":"单位按国家规定缴付的年金单位缴费部分计入个人账户时暂不纳税(A对B错)；个人缴费在本人缴费工资计税基数4%以内(8000×4%=320元)准予扣除，实际缴330元只能扣320元(D对C错)。","block":"5-16","exam":"企业年金单位缴费与个人缴费","think":"<b>A</b> 单位按国家有关政策规定为全体职工缴付的年金<b>单位缴费部分</b>，计入个人账户时个人<b>暂不缴纳</b>个税 ✔；<b>D</b> 个人缴费部分在不超过<b>本人缴费工资计税基数 4%</b> 标准内准予扣除：8000×4% = <b>320 元/月</b>，实际缴 330 元只能扣 320 ✔。<br><b>B</b> 单位缴费部分并入工资征税(错)；<b>C</b> 个人缴费可<b>全额</b>扣除(错)。答案 <b>AD</b>。","trap":"限额基数是<b>本人缴费工资计税基数</b>(上年度月平均工资 8000)，不是工作地上年度职工月平均工资 3000——后者是干扰数据。"},{"no":42,"type":"multi","stem":"居民个人张某将其居住了三年的90平方米的住房对外出售，取得不含增值税转让价款120万元并支付转让过程中的相关税费共计1.2万元。该住房购置时价款90万元、缴纳契税0.9万元，张某另向装修公司支付装修费用12万元。三个月后，张某又在同一市重新购买住房，支付不含增值税价150万元。下列表述中正确的有( )。(相关扣除均已取得有效凭证并经审核)","opts":{"A":"张某转让住房应缴纳个人所得税3.76万元","B":"张某转让住房应缴纳个人所得税3.18万元","C":"张某购置新房不得申请退还个人所得税","D":"张某购置新房可以申请退还个人所得税3.76万元"},"ans":"AD","raw":"住房转让原值=90+0.9=90.9万元；装修费最高扣房屋原值10%=9.09万元；应纳个税=(120-90.9-1.2-9.09)×20%=3.76万元(A对B错)。新购住房金额≥现住房转让金额，可全额退还已缴个税3.76万元(D对C错)。","block":"5-21","exam":"住房转让所得与换购住房退税的计算","think":"<b>A</b> 转让住房：原值 = 90(购置价) + 0.9(契税) = 90.9 万；装修费最高扣房屋原值 <b>10%</b> = 9.09 万(实际 12 万只能扣 9.09)。应纳个税 = (120 − 90.9 − 1.2 − 9.09)×20% = <b>3.76 万元</b> ✔；<b>D</b> 新购住房 150 万 ≥ 现住房转让金额 120 万，可<b>全额退还</b>已缴的 3.76 万 ✔。<br><b>B</b> 3.18 万是按装修费全额扣算出的错数；<b>C</b> 不得申请退税错。答案 <b>AD</b>。","trap":"装修费 12 万只能扣 9.09 万(原值 10% 上限)；原值要<b>含契税</b>。两处都漏就会掉进 B。"},{"no":43,"type":"multi","stem":"根据个人养老金有关个人所得税政策，下列表述正确的有( )。","opts":{"A":"个人领取的个人养老金，不并入综合所得，单独按照3%税率计算缴纳个人所得税","B":"取得工资薪金所得的个人，其个人养老金缴费仅可在次年汇算清缴时限额扣除，不得在当年预扣预缴环节扣除","C":"个人缴费享受个人养老金税前扣除优惠时，以个人养老金信息管理服务平台出具的扣除凭证为扣税凭据","D":"个人按规定领取个人养老金时，由开立个人养老金资金账户所在市的商业银行机构代扣代缴其应缴纳的个人所得税"},"ans":"ACD","raw":"个人领取的个人养老金不并入综合所得，单独按3%税率计税，税款计入\"工资、薪金所得\"项目(A对)；缴费可选择在当年预扣预缴或次年汇算清缴时扣除，不是只能汇算时扣(B错)；以个人养老金信息管理服务平台出具的扣除凭证为扣税凭据(C对)；领取时由开立资金账户所在市的商业银行机构代扣代缴(D对)。","block":"5-16","exam":"个人养老金的扣除凭证与领取","think":"<b>A</b> 个人领取的个人养老金<b>不并入综合所得</b>，单独按 <b>3%</b> 税率计税，税款计入「工资、薪金所得」项目 ✔；<b>C</b> 缴费享受税前扣除优惠以<b>个人养老金信息管理服务平台出具的扣除凭证</b>为扣税凭据 ✔；<b>D</b> 领取时由开立个人养老金资金账户<b>所在市的商业银行机构</b>代扣代缴 ✔。<br><b>B</b> 取得工资薪金所得的个人，缴费可选择在<b>当年预扣预缴或次年汇算清缴</b>时扣除，不是「仅可汇算」。答案 <b>ACD</b>。","trap":"缴费扣除阶段是「二选一」不是「只能汇算」；领取地按<b>资金账户开立行所在市</b>，不是户籍地。"}],"notes":{"blocks":[{"id":"5-1","name":"先把人分两类：居民、非居民与两个天数","star":"★★★","level":"L3","scene":"约翰 4 月 6 日入境、10 月 6 日离境。同一段日子，题目问「居住天数」和「工作天数」，答案居然差一天（182 天 vs 183 天）。<br><br>再想一个更现实的场景：一个老外被总部派来中国待 59 天，境内公司给他发 3 万、境外总部也给他发 1.5 万。他到底要就哪部分钱、在哪一国交税？<br><br>这就是本章第一道闸门——<b>先判人，再判钱</b>。人没判对，后面所有公式都是白算。","why":"为什么第一步要分居民和非居民？因为国家能向一个人征多少税，取决于这个人和国家的<b>联系深浅</b>。有住所或一个纳税年度内累计住满 183 天，说明你的生活重心、收入来源、享受的公共服务都在这里，那就该就<b>全球所得</b>纳税；只是临时来一趟，只能就<b>来源于境内的那部分</b>征，否则别国也不会承认我们的征税权。<br><br>为什么 183 天是「累计」不是「连续」？因为如果要求连续，来华人员每次出境一天就能重置计数，条款形同虚设。多选 37 里 4/6 入境、10/6 离境，把中间整月加起来是 <b>182 天</b>——差一天就是非居民，这一分就是整道题。<br><br>最容易混的是<b>两个天数用在不同地方</b>：<br>· <b>居住天数</b>用来判身份，口径<b>严</b>：当天在境内满 24 小时才算 1 天，不足 24 小时<b>整天不算</b>。因为这里决定的是「你是不是我们的人」，宁可少算。<br>· <b>工作天数</b>用来算税额，口径<b>宽</b>：入境、离境当天不足 24 小时按<b>半天</b>计。因为身份已经定了、税肯定要交，此时按实际劳动量折算更贴合事实。<br><br>非居民再按境内停留时间分三档，是一条链：<b>≤90 天 → 只就「境内支付」的境内所得征；90～183 天 → 境内所得全征（境外支付的也算）；≥183 天 → 转居民，全球征</b>。为什么 90 天以内只管境内支付？因为来这么短、钱还是境外发的，境内既没有征管抓手，也不该把境外雇主拖进来。","sentence":"判身份用居住天数（当天不足 24 小时不算），算税额用工作天数（当天不足 24 小时算半天）；≤90 天只征境内支付的境内所得，90～183 天征境内所得全部，满 183 天全球征。","trap":"· <b>183 天是累计居住</b>，不是连续居住，也不是「工作满 183 天」；多选 37 的答案是 <b>非居民 + 183 天工作天数</b>，两个天数别对调。<br>· 单选 34：11 月 12 日离境当天不足 24 小时按 <b>0.5 天</b>，11 月工作天数 = 11 + 0.5 = 11.5 天；再用「境内外工资总额 × 境内支付比例 × 工作天数÷当月公历天数」挤出当月收入额。<br>· 「有住所」指因户籍、家庭、经济利益关系而习惯性居住，<b>不是</b>有房子；有住所的人哪怕一年没回国也是居民。<br>· 多选 2 里「无住所且居住满 183 天」的丁是<b>居民</b>，别因为「无住所」三个字就选成有限纳税义务。","table":{"head":["境内停留","身份","征哪部分钱","当月工资薪金收入额"],"rows":[["≤ 90 日","非居民","仅境内所得且境内支付","境内外工资总额 × 境内工作天数÷当月天数 × 境内支付工资÷境内外工资总额"],["90 日 ~ 183 日","非居民","境内所得（含境外支付）","境内外工资总额 × 境内工作天数÷当月天数"],["≥ 183 日","居民","境内 + 境外全部所得","按综合所得按年合并，适用年税率表"],["有住所","居民（不看天数）","境内 + 境外全部所得","同上"]]},"tips":["<b>两个天数两把尺</b>：判身份从严（不足 24 小时不算天），算税额从宽（不足 24 小时算半天）。","无住所个人的题先圈出「入境日、离境日」，两端各按半天计工作天数，中间整月照加。"],"qs":[2,37]},{"id":"5-2","name":"钱从哪来：所得来源地判定","star":"★★","level":"L2","scene":"四笔钱摆在你面前：境外的房子租给一家境内企业、境外的专利拿到境内使用、境外杂志社付且负担的稿酬、在境内把一台机器卖给境外公司。<br><br>哪些算「来源于中国境内」？直觉会看「谁付的钱」——境内企业付的就算境内吧？恰恰相反，第一笔不算、最后一笔算。","why":"为什么不以「付款方在哪」为准？因为付款地是最容易被人为安排的一环：境内企业完全可以把钱付到境外账户，境外主体也可以代付给境内的人。若按付款地定来源，纳税人挪一下账户就能改变征税权归属。<br><br>所以税法盯的是<b>价值真正在哪里被创造</b>：劳务看<b>劳务发生地</b>（人在哪干活）、财产出租看<b>财产使用地</b>（东西在哪用）、特许权看<b>许可使用地</b>（技术在哪用）、不动产看<b>不动产所在地</b>、动产转让看<b>转让行为发生地</b>、股息红利看<b>分配企业所在地</b>、利息租金特许权费看<b>负担或支付方所在地</b>。<br><br>回到开头：境外房产虽然租给了境内企业，房子在境外使用，租金是境外财产产生的 → 境外所得（选项 A 错）；境外专利在境内使用，技术价值在境内实现 → 境内所得（选项 B 对）；境外杂志社支付且负担的稿酬，写作/发表都不在境内 → 境外所得（选项 C 错）；在境内把设备转让给境外企业，转让行为发生在境内 → 境内所得（选项 D 对）。<br><br>这条规则平时不显眼，但它是 5-1「非居民只就境内所得纳税」和 5-20「境外所得抵免」的共同前置条件——<b>来源地判错，后面抵免限额、申报义务全错</b>。","sentence":"不看谁付钱，看东西在哪用、人在哪干活、财产在哪转；付款地点不影响来源地。","trap":"· 「境外房产出租给境内企业」是最经典的反向陷阱：<b>看使用地，不看承租人所在地</b>。<br>· 股息红利按<b>分配所得的企业</b>所在地，不是投资方居住地；权益性投资资产转让按<b>被投资企业</b>所在地。<br>· 稿酬、劳务一律看行为发生地；「境外杂志社支付且负担」两个词是提示你写作发表也在境外。","tips":["把来源地记成一句：<b>价值创造地征税</b>。所有「付款方在境内/境外」的字眼都是烟雾弹。"],"qs":[1]},{"id":"5-3","name":"再把钱分四桶：计征方式与税率总表","star":"★★★","level":"L3","scene":"同样一年赚 20 万：小张是上班族，年终要汇算多退少补；老李开小饭馆，按年算五级累进；小王中了 2 万彩票，领奖现场直接扣走 4000，之后再无它事；小陈买了股票拿股息，券商直接代扣。<br><br>为什么同样是「赚到钱」，税法给了四套完全不同的算法？","why":"因为<b>钱的性质不同，国家想量能负担的程度也不同</b>。<br><br>· <b>综合所得（工资薪金、劳务报酬、稿酬、特许权使用费）</b>是「人靠劳动换来的钱」。它有生计成本、年内波动大、还有家庭负担差异，所以必须<b>按年合并、七级超额累进、允许扣 6 万和七项专项附加</b>——这样才能体现「赚得多的多交、负担重的少交」。这就是 2019 年改革把四项合并的核心理由。<br>· <b>经营所得</b>是「自己当老板赚的钱」。有成本费用要扣，但业主不领工资、也不享受雇员的社保扣除，所以单独用<b>按年、五级超额累进（5%～35%）</b>。<br>· <b>分类所得（利息股息红利、财产租赁、财产转让、偶然所得）</b>是「钱生钱或凭运气来的钱」。没有生计负担，也不便逐笔核成本，用<b>按次、20% 比例税率</b>征管成本最低。<br><br>为什么分类所得不能享受专项附加扣除（多选 11）？因为专项附加扣除是<b>减「应纳税所得额」</b>的，而分类所得大多按收入全额乘 20%，压根没有「减除费用」这个环节；只有综合所得和经营所得是按年计算应纳税所得额的，才挂得上这七项。<br><br>再看「按次」：财产租赁以<b>1 个月内取得的收入为一次</b>，是因为租金持续流入，按月切分最便于扣缴；而非居民个人的工资薪金是<b>按月</b>、劳务稿酬特许权是<b>按次</b>，因为他们不做年度汇算。","sentence":"先看是不是综合所得四项（按年、合并、七级累进），再看是不是经营所得（按年、五级累进），剩下的分类所得一律按次、20% 比例，且不得扣专项附加。","trap":"· <b>收入全额计税</b>的只有利息股息红利所得和偶然所得（多选 13 答案 BD）；财产转让所得减原值和合理费用，财产租赁所得有 800 元或 20% 的扣除，经营所得减成本费用损失。<br>· 多选 12 按次征收：财产租赁（A）、非居民连续性劳务报酬（B）；非居民加班费按月（D 错）、经营所得按年（C 错）。<br>· 别把「经营所得」和「劳务报酬」混了：彩票代销、个体出租车是经营所得；兼职、独立董事费是劳务报酬。","table":{"head":["桶","包含","计税单位","税率","能不能扣专项附加"],"rows":[["综合所得","工资薪金、劳务报酬、稿酬、特许权使用费","按年（居民）；按月/按次（非居民）","3%～45% 七级（年表）","能"],["经营所得","个体户、个独、合伙、承包承租","按年","5%～35% 五级","能（且仅限无综合所得时）"],["分类所得·租赁","财产租赁","按次（1 个月一次）","20%（住房 10%）","不能"],["分类所得·转让","财产转让","按次","20%","不能"],["分类所得·利股红/偶然","利息股息红利、偶然所得","按次","20%（收入全额）","不能"]]},"tips":["先归桶，再套公式。<b>80% 的题目做错不是算错，是桶放错了</b>。","「全额计税」四个字只对应利息股息红利和偶然所得，看到财产转让就一定要减原值。"],"qs":[12,13]},{"id":"5-4","name":"工资薪金 vs 劳务报酬：一条雇佣关系的分界线","star":"★★★","level":"L3","scene":"同样一笔「干活的报酬」：雇员拿免费旅游业绩奖励算工资薪金，非雇员拿同样的奖励却算劳务报酬；在本公司兼任董事拿董事费算工资，去一家不在那儿任职的公司当监事却算劳务；出租车司机跑一样的活，三种经营模式下分别落到工资、经营、工资。<br><br>还有一道 8 选项的非标准题（多选 3），要把八种收入逐个塞回这两个桶。","why":"分界线只有一个：<b>有没有任职受雇关系</b>。<br><br>有雇佣关系，说明单位对你有日常管理、给你发的是劳动的持续对价、还替你缴社保——这笔钱就是工资的延伸，单位能按累计预扣法代扣，也能扣三险一金和专项附加。没有雇佣关系，你只是独立承接一项服务，对方买的是「这件活的结果」，钱就是劳务报酬，按次预扣。<br><br>为什么独立董事费算劳务？因为他不在公司任职受雇，只履行董事职责，公司对他没有劳动管理关系；反过来「兼任本公司董事」的人本来就是雇员，董事费只是工资的一部分。<br><br>出租车司机三种模式是最好的练习：<b>单车承包/承租</b>——车是公司的、司机按合同交钱，本质是公司雇员 → 工资薪金；<b>车归个人但挂靠公司、交管理费</b>——自负盈亏、自担风险，是自己做生意 → 经营所得；<b>公司把车所有权转给司机</b>（答案册归入工资薪金口径）按题目给定情形处理。<br><br>为什么这条边界值得做成 8 选项题？因为它同时牵动三件事：<b>按年还是按次、能不能扣专项附加、预扣率用哪张表</b>。一个词判错，整题崩。","sentence":"有任职受雇 → 工资薪金；没有 → 劳务报酬。佣金、稿酬、特许权、个体经营另有专门口径。","trap":"· 多选 3 答案 <b>ABG</b>：雇员免费旅游奖励、股票增值权所得、退休后再受雇收入是工资薪金；独立董事费(C)、提供担保(D 偶然所得)、业余兼职(E)、证券经纪人佣金(F)、外聘审稿(H)都不是。<br>· 多选 5 里「<b>兼任本公司</b>董事」是工资薪金(A 错)，「<b>在非任职公司</b>担任监事」才是劳务(B 对)；彩票代销是经营所得(C 错)。<br>· 提成、佣金、分成收入容易一律当成劳务：保险营销员/证券经纪人佣金走<b>累计预扣法</b>（仍是劳务性质），雇员律师从事务所取得的分成收入是<b>工资薪金</b>。<br>· 「企业用资金为普通雇员买房」是工资薪金；为<b>投资者</b>买房才是利息股息红利（见 5-14）。","table":{"head":["情形","税目","判断理由"],"rows":[["奖励雇员 / 劳动分红 / 退休再受雇","工资、薪金所得","有任职受雇关系"],["奖励非雇员 / 个人兼职 / 独立董事费 / 审稿费","劳务报酬所得","无雇佣，买的是服务结果"],["兼任本公司董事、监事取得董事费","工资、薪金所得","本就是本公司雇员"],["彩票代销 / 个体出租车（车归个人挂靠）","经营所得","自负盈亏、自己当老板"],["出租汽车经营单位单车承包或承租","工资、薪金所得","车是公司的，实质雇员"],["律师以个人名义聘人支付的报酬","劳务报酬所得","被聘者无雇佣关系"],["雇员律师从事务所取得分成收入","工资、薪金所得","事务所雇员"]]},"tips":["母题子题最爱改「是否任职受雇」一个词；先圈出这个词再选桶。","<b>劳动分红是工资，股份分红是利息股息红利</b>——单选 1 就考这一字之差。"],"qs":[1,3,5]},{"id":"5-5","name":"稿酬与特许权：自己写的和别人写的，不是一回事","star":"★★","level":"L2","scene":"同样拿去拍卖：作家拍卖自己小说的手稿原件、拍卖自己收藏多年的字画、拍卖别人的文字作品手稿、作者去世后继承人拿到遗作稿酬——四种情形落到三个不同税目。<br><br>再算一道预扣题：报社发表文章 3000 元、出版社出小说 8 万元，两笔稿酬为什么不能合起来减一次费用？","why":"先看「拍卖」这组词。<b>自己写的文字作品手稿原件或复印件公开拍卖</b>，本质是转让作品里含的著作财产权价值，税法把它归到<b>特许权使用费所得</b>；<b>拍卖别人的手稿</b>或<b>自己收藏的字画古董</b>，转的只是一件物品的所有权，与著作权无关，归<b>财产转让所得</b>；<b>作品发表取得的报酬</b>才是<b>稿酬所得</b>；作者去世后继承人取得的<b>遗作稿酬</b>，承接的仍是稿酬性质。<br><br>为什么稿酬预扣要「按次」分开算？因为预扣预缴阶段劳务、稿酬、特许权都是<b>按次（以每次取得收入为一次）</b>由支付方代扣，两笔稿酬由两个不同支付方付、发生在不同作品上，自然是两笔；只有到年度汇算才合并成综合所得。单选 6 里 3000 元那笔按「≤4000 减 800」、8 万那笔按「减 20%」，再各打七折乘 20%，合计 <b>9268 元</b>。<br><br>稿酬为什么要打七折？见下一块 5-6：创作含精神劳动、政策鼓励，收入额按 80%×70%=56% 计算。","sentence":"发表作品→稿酬；自己写的手稿拍卖→特许权使用费；别人的手稿或字画古董拍卖→财产转让；遗作稿酬→稿酬。","trap":"· 多选 6 答案 <b>AD</b>：遗作稿酬、专业作者发表作品费是稿酬；自己文字作品手稿拍卖是特许权(B 错)、自己收藏字画拍卖是财产转让(C 错)。<br>· 单选 6 两笔稿酬<b>分别按次</b>预扣，不能合并减一次费用；合并是年度汇算才做的事。<br>· 别把「稿酬」和「特许权使用费」按金额大小分，只按<b>取得方式</b>分。","tips":["看到「拍卖」先问一句：<b>拍的是作品权利，还是一件东西</b>？"],"qs":[6,6]},{"id":"5-6","name":"收入额三张表：80%、56% 与 800 元保底","star":"★★★","level":"L3","scene":"同一个 5 万元设计费，预扣 1 万；一篇 3000 元稿酬，先减 800 再打七折；一个非居民拿 8 万稿酬，扣了 9030，既不是 20% 也不是 11200。<br><br>为什么有的减 800、有的减 20%、有的还要再乘 70%？为什么居民和非居民算出来不一样？","why":"先问最根本的一句：<b>为什么劳务/稿酬/特许权的收入额要先打八折</b>？因为这三项不像工资有单位代缴社保、有稳定的生计扣除，税法统一给 <b>20% 当作「为取得收入花的成本」</b>，让你只对净额纳税；稿酬再乘 <b>70%</b>（合计 56%）是额外的文化鼓励。<br><br>再问：<b>为什么预扣时 ≤4000 元减 800 而不是 20%</b>？因为 4000×20% 正好等于 800，给小额收入一个<b>保底扣除</b>——收入 1000 元若只减 20%（200 元）会明显偏高。所以规则是「≤4000 减 800，>4000 减 20%」，在 4000 元处平滑衔接。<br><br>最后：<b>为什么汇算和非居民又不一样</b>？<br>· 居民<b>年度汇算</b>时不再逐笔比大小，一律减 20%（稿酬再×70%），因为全年合并后逐笔判定已无意义，统一口径最简。<br>· <b>非居民</b>不做汇算、由扣缴义务人一次扣清，所以也一律减 20%（稿酬×56%），但适用的是<b>按月换算的综合所得税率表</b>而不是 20% 比例预扣率。单选 31：80000×80%×70%=44800 → 44800×30%-4410=<b>9030 元</b>。<br><br>把三套口径并排看，就不会再串：居民预扣「比 4000」、居民汇算「一律 20%」、非居民代扣「一律 20% + 月税率表」。","sentence":"汇算一律 80%（稿酬 56%）；预扣 ≤4000 减 800、>4000 减 20%；非居民一律 80%（稿酬 56%）但用月度税率表。","trap":"· 单选 5：50000×(1-20%)=40000，预扣率 <b>30%</b>、速算扣除 2000 → 10000 元，不是 20% 比例的 8000。<br>· 单选 31 最容易错选 13490（误用 20%）或 15240（误用年表）：<b>非居民稿酬 = 收入×56%，套月税率表</b>。<br>· 单选 28 里劳务 3000 元：预扣时减 800，但<b>汇算时只减 20%（600 元）</b>，这是母题子题最爱设的差。<br>· 稿酬的 70% 是乘在「减完费用后的余额」上，不是乘在收入全额上。","table":{"head":["口径","工资薪金","劳务报酬","稿酬","特许权使用费"],"rows":[["居民·预扣预缴","累计预扣法，减 5000/月","≤4000 减 800；>4000 ×80%","上述余额再 ×70%","≤4000 减 800；>4000 ×80%"],["居民·年度汇算","收入全额","一律 ×80%","一律 ×80%×70% = 56%","一律 ×80%"],["非居民·代扣代缴","月收入 - 5000，月税率表","一律 ×80%，月税率表","一律 ×56%，月税率表","一律 ×80%，月税率表"]]},"tips":["三套口径写成三行贴在桌角，做题前先问：<b>这是预扣、汇算，还是非居民代扣</b>？"],"qs":[5,31]},{"id":"5-7","name":"扣除的三层楼：专项、专项附加、其他扣除","star":"★★★","level":"L3","scene":"月工资 2 万，到手前要扣三险一金 2000、企业年金 400、可能还有个人养老金和商业健康险，另外申报了子女教育。看着都是「扣」，单选 2 却只认其中一项是「专项附加扣除」。<br><br>这不是抠字眼——<b>三层楼的扣除阶段、限额、可挂的所得类型都不一样</b>。","why":"三层对应三种完全不同的政策目的：<br>· <b>专项扣除（三险一金）</b>：法定生存成本，强制、据实、无上限之争。目的是不把「缴社保的钱」也当成所得征税。<br>· <b>专项附加扣除（7 项）</b>：这是<b>社会政策工具</b>——鼓励生育（3 岁以下婴幼儿照护、子女教育）、鼓励养老（赡养老人）、鼓励教育与自我提升（继续教育）、减轻住房与医疗负担（房贷利息/租金、大病医疗）。所以是<b>定额</b>而非据实，因为政策要给的是统一补贴，不是逐笔核销。<br>· <b>依法确定的其他扣除</b>：年金、商业健康险、个人养老金、税延养老保险等，目的是<b>鼓励个人自己补充保障</b>，所以都有明确限额（年金 4%、健康险 2400/年、个人养老金 12000/年）。<br><br>为什么专项附加扣除只能挂在综合所得或经营所得（多选 11）？因为只有这两类是<b>按年计算应纳税所得额</b>、有「减除费用」环节的；分类所得按次按收入全额×20%，没有可减的所得额。这条限制不是技术细节，而是「量能负担」只在综合计税里才有意义。<br><br>顺序也有讲究：<b>先减 6 万 → 再减专项扣除 → 再减专项附加 → 再减其他扣除</b>。单选 28 就按这个顺序算出 154000 元的应纳税所得额。","sentence":"先减 6 万，再减三险一金（专项），再减 7 项专项附加，最后减年金/个人养老金/商业健康险（其他扣除）；只有综合所得和经营所得挂得上专项附加。","trap":"· 单选 2：<b>基本医疗保险是专项扣除</b>(A 错)，<b>企业年金、个人养老金是其他扣除</b>(C、D 错)，只有<b>子女教育</b>是专项附加(B 对)。<br>· 大病医疗<b>只能在汇算清缴时扣</b>，其余六项可在预扣预缴时扣（单选 21 答案 A）。<br>· 同时有综合所得和经营所得的，6 万和各项扣除<b>只能选一边，不得重复</b>；没有综合所得才在经营所得里扣（单选 23 选项 C 的「一律不得」是错的）。<br>· 预扣环节没享受到的专项附加，可在当年剩余月份补扣，或次年 3/1–6/30 汇算时扣，不是「作废」。","table":{"head":["层","项目","标准","扣除阶段"],"rows":[["减除费用","基本减除","60000 元/年（5000 元/月）","综合/经营所得"],["专项扣除","基本养老、基本医疗、失业保险、住房公积金","据实（在规定标准内）","预扣 + 汇算"],["专项附加扣除","7 项（见 5-8）","定额为主","预扣 + 汇算（大病医疗仅汇算）"],["其他扣除","企业/职业年金、商业健康险、个人养老金、税延养老","年金 4%、健康险 2400/年、养老金 12000/年","预扣或汇算"]]},"tips":["把「扣除」当三张发票夹：<b>法定的、政策补贴的、鼓励自购的</b>，别混成一堆。"],"qs":[2,23,11]},{"id":"5-8","name":"专项附加扣除七项：标准、时间、谁能扣","star":"★★★","level":"L3","scene":"张某有对双胞胎儿子读小学三年级，2025 年 8 月妻子又生了个女儿，约定全由张某扣。他当年能扣多少？答案是 <b>58000 元</b>：两个儿子 2000×2×12=48000，女儿从出生当月算 5 个月 2000×5=10000。<br><br>再看另一头：赡养老人扣多少？不管你赡养的是父母两人还是一位，都是 3000 元/月。<br><br>同样是「养人」，为什么一个按人数翻倍、一个不按？","why":"答案在政策想补的是什么。<b>赡养老人</b>扣的是「你承担了赡养义务」这件事本身，定额 3000 元（非独生子女分摊、每人最多 1500），不因老人数量加倍——否则家里老人多反而能大幅抵税，偏离了补贴初衷。<b>子女教育与 3 岁以下婴幼儿照护</b>扣的是每个孩子实打实的支出，人数翻倍支出就翻倍，所以按<b>每个子女 / 每个婴幼儿 2000 元/月</b>计算。这就是答案册那句口诀「<b>上有老不考虑人数，下有小要考虑人数</b>」。<br><br>再看「什么时候能扣」这条暗线：<b>定额项目</b>（子女教育、婴幼儿照护、继续教育、房贷利息、房租、赡养老人）年初就能确定金额，所以允许在<b>工资薪金预扣预缴</b>时按月扣；<b>大病医疗</b>要等医保信息系统全年结算后才知道「个人负担累计超过 15000 元的部分」是多少，年中根本算不准，因此<b>只能在年度汇算清缴时扣</b>，且可由本人或配偶扣（未成年子女的由父母一方扣）。<br><br>最后是「扣除期间」的四个端点，题目专挑端点改词：房贷利息最长 <b>240 个月</b>、子女教育到全日制学历教育结束<b>当月</b>、赡养老人到义务终止<b>年末</b>、职业资格继续教育是取得证书<b>当年</b>。为什么端点必须写死？因为这些都是定额按月扣的，起止差一个月就差一整月的扣除额。","sentence":"上有老不看人数（3000 定额），下有小按人数（每人 2000/月）；大病医疗只汇算、其余可预扣；七个端点按月算，起止差一月就差一月的钱。","trap":"· 单选 22：房贷利息 <b>240 个月</b>（A 的 180 错）、子女教育结束<b>当月</b>（B 的次月错）、同一学历继续教育 <b>48 个月</b>（C 对）、赡养老人到<b>年末</b>（D 的月末错）→ 答案 C。<br>· 单选 23：职业资格继续教育是取得证书<b>当年</b>（A 的次年错）；大病医疗是医保系统记录实际支出的<b>当年</b>（B 对）；没有综合所得可在经营所得扣 6 万（C 错）；预扣没扣的可汇算补扣（D 错）。<br>· 单选 3：被赡养人不含<b>公婆</b>（B 错）；本科及以下学历继续教育可由父母或本人扣（C 的「只能本人」错）；继续教育须在<b>境内</b>，境外只有子女教育可以（D 错）。<br>· 房贷利息和住房租金<b>一个纳税年度内不得同时享受</b>；多选 34 里上海工作 1500/月 > 房贷利息 1000/月，选租金更划算。<br>· 大病医疗：个人负担累计超 15000 元的部分、<b>80000 元限额内</b>据实扣，可由配偶扣，只能汇算扣（多选 33）。","table":{"head":["项目","标准","扣除期间","谁能扣"],"rows":[["3 岁以下婴幼儿照护","2000 元/月/婴幼儿","出生当月至年满 3 周岁前一月","父母一方 100% 或双方各 50%"],["子女教育","2000 元/月/子女","年满 3 周岁当月至全日制学历教育结束当月","父母一方或双方分摊"],["学历(学位)继续教育","400 元/月，最长 48 个月","入学当月至结束当月（含休学保留学籍、寒暑假）","本科及以下父母或本人；本科以上本人"],["职业资格继续教育","3600 元（一次性）","取得相关证书的当年","本人"],["大病医疗","超 15000 元部分，限 80000 元","医保系统记录实际支出的当年","本人或配偶；未成年子女由父母一方"],["住房贷款利息","1000 元/月，最长 240 个月","开始还款当月至贷款归还/合同终止当月","夫妻一方（与租金二选一）"],["住房租金","1500 / 1100 / 800 元/月","租赁期开始当月至结束当月","签合同的承租人"],["赡养老人","独生 3000 元/月；非独生分摊最高 1500","被赡养人年满 60 周岁当月至义务终止年末","子女（不含配偶父母）"]]},"tips":["<b>上有老不看人数，下有小按人数</b>——单选 24 的 58000 就靠这一句。","四个端点（240 个月 / 当月 / 年末 / 当年）是命题人最爱改的四个字，考前单独抄一遍。"],"qs":[3,21,22,24,33,34]},{"id":"5-9","name":"累计预扣法：为什么 3 月突然多扣了税","star":"★★★","level":"L3","scene":"张某 2026 年 1 月入职，月薪 2 万、三险一金 2000、年金 400。1 月扣 378、2 月扣 378、3 月却扣 504。<br><br>再看母题子题：同样是 8 月预扣，上年就在这家公司、全年工资 5.8 万的人能扣 65600 元；改成「7 月毕业 8 月入职」，只能扣 40700 元。<b>差的那 24900 元，是同一条规则的两个分支</b>。","why":"累计预扣法的动作只有一步：<b>每月把「本年至今累计收入 − 累计扣除」重算一遍应纳税额，再减去前面月份已经扣过的</b>。所以 3 月累计应纳税所得额 37800 元跨进了 10% 那一档，税额一次性跳上来，这就是「突然多扣」的真相——不是税率每月变，是累计额跨档了。<br><br>为什么要用「累计」而不是各月独立算？两个理由：① <b>让收入稳定的人年内就扣准</b>，不用等第二年大额退税；② 累进税率本来就该按<b>全年</b>能力衡量，按月独立算会让季节性收入的人吃亏。速算扣除数在公式里<b>只减一次</b>（按累计额对应的档），这是单选 27 的题眼。<br><br>三种「累计减除费用」的分支，各自对应一个照顾对象：<br>· <b>一般情形</b>：5000 × 当年截至本月<b>在本单位的任职受雇月份数</b>。换工作就从新单位重新数。<br>· <b>首次取得工资薪金</b>（毕业生）：5000 × <b>当年截至本月的月份数</b>，把没工作的月份也算进去。否则 8 月入职只能扣 5000，明显不合理——所以子题是 5000×8+700=<b>40700</b>。<br>· <b>上年各月均在同一单位申报且全年工资 ≤6 万、本年自 1 月起仍在该单位</b>：自 1 月起<b>直接按全年 60000 元</b>一次扣足，不用等月份累计。这是给低收入者免去「先扣后退」的麻烦——母题 60000+700×8=<b>65600</b>。<br><br>这一支还有个很有画面的效果：<b>累计收入不超过 6 万元的月份，暂不预扣预缴个税</b>；等累计收入跨过 6 万的那个月才开始扣。课件例题里小周每月 8000 元，1—7 月累计 56000 元一分不扣，8 月累计 64000 元才开始预扣。为什么这样设计？因为既然全年大概率不用交税，与其每月先扣、次年再退，不如干脆不扣，省掉双方一遍手续。判断「6 万」时用的是<b>上年累计工资薪金收入全额（含全年一次性奖金，且不扣减任何费用及免税收入）</b>，不是扣完三险一金后的到手数。","sentence":"本期应预扣 =（累计收入 − 累计扣除）× 预扣率 − 速算扣除数 − 累计已预扣；三种累计减除费用按身份选，速算扣除只减一次。","trap":"· 母题（上年在职、年工资 5.8 万）→ <b>65600</b>；子题（首次取得工资）→ <b>40700</b>。只改「首次入职」一个词，答案换一档。<br>· 单选 27：1 月 378、2 月 378、3 月 <b>504</b>；别把 3 月按 (20000−7400)×10%−2520 单独算成 1260。<br>· 企业年金个人缴费限<b>本人缴费工资计税基数 4%</b>以内才准扣（本题 400 元合规，见 5-16）。<br>· 多选 36 能用累计预扣法的只有：工资薪金、保险营销员/证券经纪人佣金、全日制学历教育学生实习报酬、平台从业人员劳务报酬；<b>普通兼职仍按次</b>（D 错）。","table":{"head":["情形","累计减除费用","为什么"],"rows":[["一般（本单位任职）","5000 × 当年在本单位任职月份数","换单位重新起算，避免重复扣"],["首次取得工资薪金","5000 × 当年截至本月的月份数","照顾毕业生，把待业月份也算上"],["上年全年工资 ≤6 万且每月同单位","自 1 月起直接按 60000 元","低收入者免去先扣后退"]]},"tips":["看到「母题/子题」先圈改动的那个词，别整题重算。","累计预扣的口诀：<b>每月重算全年至今，减掉已扣的</b>。"],"qs":[25,26,27,36]},{"id":"5-10","name":"汇算清缴：把四桶钱倒进一个池子重算","star":"★★","level":"L2","scene":"张某 2025 年工资 20 万、劳务报酬 3000、特许权使用费 4 万，每月三险一金 1200，7 月开始读在职研究生、当年考过 CPA。全年应纳个税 <b>13880 元</b>。<br><br>这道题把本章前半本全串起来了：收入额怎么折算、扣除按哪几层、继续教育怎么算月份。","why":"为什么一定要汇算？因为预扣阶段四项所得是<b>各扣各的</b>：工资按累计预扣法、劳务稿酬特许权按次按不同预扣率和减除方式，且预扣不等于最终税负。汇算做三件事：<b>① 把四项收入额合并；② 统一减 6 万、专项扣除、专项附加、其他扣除；③ 统一套年税率表</b>，多退少补。这才是「综合所得」四个字的兑现——同样 20 万年收入的人，不管收入结构如何，税负趋同。<br><br>单看这道题的三处易错：<br>· <b>劳务 3000 元</b>：预扣时能减 800，但汇算一律减 20%，只能减 600 → 收入额 2400。<br>· <b>特许权 4 万</b>：一律 ×80% = 32000。年度收入额 = 200000 + 2400 + 32000 = <b>234400</b>。<br>· <b>继续教育</b>：7 月开始的学历(学位)继续教育按 400 元/月扣 6 个月 = 2400，加上<b>取得 CPA 证书当年</b>的职业资格继续教育 3600，合计 <b>6000</b>。两项继续教育可以<b>同时</b>享受，因为一个按期间、一个按证书。<br><br>最后：(234400 − 60000 − 14400 − 6000) = 154000 → 154000×20% − 16920 = <b>13880</b>。","sentence":"年度收入额 = 工资全额 + 劳务/特许权×80% + 稿酬×56%；再统一减 6 万、专项、专项附加、其他扣除，套年税率表多退少补。","trap":"· 汇算时<b>不再与 4000 元比大小</b>，劳务/稿酬/特许权一律减 20%（单选 28 的 3000 元只减 600）。<br>· 学历继续教育按<b>实际在读月份</b>算（7 月开始只有 6 个月），不是全年 12 个月；职业资格继续教育是取得证书<b>当年一次性 3600</b>。<br>· 汇算期：<b>次年 3 月 1 日至 6 月 30 日</b>；经营所得汇算是次年 <b>3 月 31 日前</b>，两个日子别串。","tips":["汇算题按四行写：<b>收入额 → 减 6 万 → 减三层扣除 → 套年表</b>，别跳步。"],"qs":[28]},{"id":"5-11","name":"经营所得：个体户的账，和公司不是一套规矩","star":"★★★","level":"L3","scene":"个体户给员工发工资 30 万，职工教育经费只能扣 7500（公司能扣 24000）；账上 40 万经营费用和家里生活混用分不清，只准扣 16 万；年应纳税所得额 240 万，还能享受 200 万部分减半。<br><br>另外个人独资企业遇到同样的混用费用，<b>一分钱都不许扣</b>。同一个「分不清」，两个主体结论相反。","why":"个体户不是公司，<b>业主本人不领工资</b>——他赚的就是经营利润，所以「业主工资薪金支出」不得税前扣除；但雇员工资、社保、工会经费、福利费都是真实成本，可以扣。这是第一层。<br><br>为什么混用费用给 <b>40% 定额</b>？因为逐笔划分「这笔电是店里用的还是家里用的」征管成本极高、争议极大，税法索性给一个统一比例：既承认确实有一部分与经营有关，又不许全额扣以防把家庭开支塞进来。个人独资企业口径更严（<b>混用一律不得扣</b>），因为个独的投资者对企业资金支配更随意、更易混入个人消费。<br><br>职工教育经费 <b>2.5%</b> 明显低于公司的 8%，因为个体户规模小、培训支出有限；亏损结转 <b>5 年</b> 也与公司一般 5 年一致；公益捐赠限额是<b>应纳税所得额 30%</b>，而企业所得税是<b>利润总额 12%</b>——基数和比例都不同，这是多选 35 的题眼。<br><br>为什么核定征收要「三不」？<b>不能享受优惠、不能弥补查账期亏损、不扣公益捐赠</b>（多选 16）。因为核定征收本就是因为账不健全、算不清真实所得才用的简化办法，既然所得额是估出来的，再叠加限额扣除和亏损弥补就失去依据。<br><br>200 万减半政策（2023–2027）的算式里有个反直觉动作：<b>其他政策减免税额要按 200 万÷全部所得的比例分摊后再减半</b>。单选 29 里残疾人减免 6000 元先乘 200/240，再从 200 万部分应纳税额里扣除，最后才 ×50%，得 314750 元，再加回 6000 = <b>320750</b>。","sentence":"个体户：业主工资不扣、雇员工资扣；混用费用按 40% 扣，个独一分不扣；有综合所得就不在经营所得重复扣 6 万。","trap":"· 单选 7：职工教育经费 <b>2.5%</b>（300000×2.5%=7500），别套公司的 8%。<br>· 多选 15 不得扣除的是 <b>CEFH</b>：代从业人员负担的税款、家庭生活用电、业主工资、超 14% 的福利费；摊位费、研发费用据实扣(A、B 错)，工会经费 2% 内据实扣(D 错)，单台 <b>8 万元</b>测试仪器在 10 万以下可直接扣(G 错)。<br>· 单选 8：40×40%=<b>16 万元</b>，不是 0 也不是 24。<br>· 多选 16：核定征收<b>不得</b>继续弥补以前年度亏损(B 错)、<b>不扣</b>公益捐赠(C 错)、按主营项目定应税所得率(D 对)。<br>· 多选 35：公益捐赠在经营所得中<b>可选择预缴或汇算时扣</b>(A 的「统一汇算」错)，限额 180×30%=<b>54 万</b>，票据留存 5 年。","table":{"head":["扣除项目","个体工商户（个税）","公司（企业所得税）"],"rows":[["职工教育经费","工资薪金总额 2.5%","工资薪金总额 8%"],["职工福利费 / 工会经费","14% / 2%","14% / 2%"],["公益捐赠限额","应纳税所得额 30%","利润总额 12%"],["亏损弥补","5 年","一般 5 年，特殊 8/10 年"],["生产经营与家庭混用费用","40% 视为经营费用准予扣除","—（个独企业一律不得扣）"],["研发设备单台 < 10 万","准予直接扣除","研发费用加计扣除"],["业主/投资者本人工资","不得扣除","—（合理工资可扣）"]]},"tips":["把这张<b>个体户 vs 公司</b>对照表单独记，多选题的错项几乎都是从公司口径搬过来的。","看到「家庭生活混用」先判主体：个体户 40%，个独 0%。"],"qs":[7,8,29,4,15,16]},{"id":"5-12","name":"财产租赁：按月切一次，修缮费慢慢扣","star":"★★★","level":"L3","scene":"张某 10 月起出租自有住房，月租金 3800（不含增值税）。当月修下水管道花了 1000，每月房产税 76。10—12 月共交个税 <b>777.2 元</b>。<br><br>为什么 1000 元修缮费不能在 10 月一次扣完？为什么个人出租住房税率是 10% 而不是 20%？","why":"先看「按次」：财产租赁以<b>1 个月内取得的收入为一次</b>。租金是持续流入的，如果按整年或按合同算一次，扣缴义务人无法按月代扣、纳税人也难以及时申报，所以按月切块最便于征管。<br><br>再看扣除顺序，本质是在回答「为赚这笔租金，真花出去多少钱」：租金里先扣<b>出租过程缴纳的税费</b>（房产税、城建税等，有凭据）、<b>转租情形下的原租金</b>、<b>由纳税人负担的修缮费</b>，最后再扣<b>法定减除费用</b>（≤4000 元减 800，>4000 元减 20%）。<br><br>为什么修缮费<b>每月限 800 元、且未扣完可无限期结转</b>？因为修缮是一次性支出、金额可能很大，若允许当月全额扣，会把当月税基直接打到零甚至为负，税款在月份之间剧烈波动；限 800 元并允许往后结转，既承认了这笔真实成本，又把扣除平滑地摊到后续月份。<br><br>为什么个人按市场价出租住房<b>减按 10%</b>？这是住房民生优惠，降低个人出租合规住房的税负，鼓励房源进入租赁市场；商铺出租仍按 20%。<br><br>回到本题：10 月 (3800−76−800−800)×10%、11 月 (3800−76−200−800)×10%（上月剩的 200 元修缮费继续扣）、12 月 (3800−76−0−800)×10%，合计 <b>777.2 元</b>。","sentence":"应纳税所得额 = 不含税收入 − 税费 − 转租租金 − 修缮费（每月限 800、可结转）− 800 或 20%；个人按市场价出租住房减按 10%。","trap":"· 多选 17 能扣的是<b>房产税(B)、修缮费(C)</b>；<b>贷款利息、装修费都不能扣</b>（A、D 错），这是最经典的凑选项。<br>· 修缮费上限是<b>每月 800</b>，不是按次 800 就作废，余额可无限期向以后月份结转。<br>· 收入 ≤4000 减 800、>4000 减 20%，与劳务报酬预扣的规则长得像但<b>顺序不同</b>：租赁是先扣税费和修缮费再减 800。<br>· 「每月实际缴纳房产税 76 元」必须凭相关凭据才能扣；没凭据的税费一律不扣。","table":{"head":["每次（月）收入","应纳税所得额"],"rows":[["≤ 4000 元","不含税收入 − 相关税费 − 转租租金 − 修缮费(≤800) − 800"],["> 4000 元","[不含税收入 − 相关税费 − 转租租金 − 修缮费(≤800)] × (1 − 20%)"],["个人按市场价出租住房","上述所得额 × 10%（其余财产租赁 × 20%）"]]},"tips":["修缮费记一句：<b>当月最多 800，扣不完往后挪，直到扣完</b>。","「装修费」不是「修缮费」，前者一律不扣，后者每月限 800。"],"qs":[16,17]},{"id":"5-13","name":"财产转让：为什么按差额，以及拿不出原值怎么办","star":"★★★","level":"L3","scene":"卖掉住了 10 年的唯一住房免税，卖商铺要按 (480−300−30)×20% 交 30 万；拍卖字画和海外回流古董拿不出原值凭证，直接按收入的 3% 和 2% 核定；把房子白送给好友，反而是<b>受赠人</b>按 27.1 万交税。<br><br>同一章里「财产转让」这四个字，落到了四种完全不同的算法上。","why":"第一个为什么：<b>财产转让为什么按差额</b>？因为转让收入里含着你当初买它的本金，对本金再征一遍税就是重复征税。所以计税依据必须是<b>转让收入 − 财产原值 − 合理费用</b>。这也解释了为什么财产转让所得<b>不能</b>算「收入全额计税」（多选 13）。<br><br>第二个为什么：<b>拿不出原值凭证怎么办</b>？税法不能无限期替纳税人查证，就给一个核定征收率：一般拍卖按转让收入 <b>3%</b>，经文物部门认定的<b>海外回流文物按 2%</b>（鼓励文物回流）。此时拍卖费等税费<b>不再另行扣除</b>——因为核定率已经把成本因素包进去了。单选 19：20×3% + 80×2% = <b>2.2 万</b>，题目给的 2 万元税费是干扰项。<br><br>第三个为什么：<b>无偿受赠房屋为什么由受赠人按「偶然所得」交税，而不是赠与人按财产转让</b>？因为赠与人没收到任何对价，没有「转让收入」，财产转让所得无从计算；而受赠人白得了一处房产，这笔意外之财对他是偶然所得。计税依据 = <b>赠与合同标明的房屋价值 − 受赠人支付的相关税费</b>，即 (140−4.5)×20% = <b>27.1 万</b>（多选 40 答案 BC；答案册 OCR 把「27.1」印成了「7.1」）。<br><br>免税那头：<b>自用达 5 年以上 + 家庭唯一生活用房</b>，两个条件必须同时满足才免征。为什么？这是给「卖掉自住房改善居住」的民生照顾，不是给投资性房产的优惠——商铺、第二套房都不适用（单选 30）。","sentence":"财产转让 = 收入 − 原值 − 合理费用；拿不出原值就按核定率；无偿受赠房屋由受赠人按偶然所得、以合同价减受赠税费计税。","trap":"· 多选 8（9 选项）答案 <b>BDFI</b>：新三板原始股、拍卖他人文字作品手稿、终止投资取得的违约金补偿金、限售股转让属财产转让；财产转租收入(A 财产租赁)、不具所有权的量化资产(C 不征)、创投整体核算的合伙人所得(E 经营)、雇员律师分成(G 工资)、盈余积累转增股本(H 利息股息红利)都不是。<br>· 多选 27：<b>同时持有限售股和流通股，视同先转让限售股</b>（B 的「先转让流通股」错）；拿不出原值凭证按转让收入 <b>15% 核定原值及合理税费</b>，不是全额计税(D 错)。<br>· 多选 18：股权转让<b>受让方是扣缴义务人</b>、转让方是纳税人(A 错)；多次取得同一企业股权用<b>加权平均法</b>定原值，不是先进先出(D 错)。<br>· 多选 19 不征个税的无偿赠与：直系亲属/兄弟姐妹(A)、承担直接抚养赡养义务的人(C)、房屋产权人死亡后的法定/遗嘱继承人或受遗赠人(D)；赠与好友(B)要征。<br>· 多选 42：住房装修费最高扣<b>房屋原值的 10%</b>（90.9×10%=9.09 万），不是全额 12 万；原值含购房时缴纳的契税。","table":{"head":["情形","计税依据","税率/征收率"],"rows":[["一般财产转让","转让收入 − 财产原值 − 合理费用","20%"],["拍卖无法提供原值凭证","转让收入额","3% 核定征收"],["海外回流文物（经认定）","转让收入额","2% 核定征收"],["无偿受赠房屋（受赠人）","赠与合同标明价值 − 受赠人支付的税费","20%（偶然所得）"],["自用 ≥5 年且家庭唯一生活用房","—","免征"],["住房装修费","最高扣房屋原值 10%","计入合理费用"]]},"tips":["<b>受赠房屋看两头</b>：白拿时按偶然所得（受赠人交），以后再卖时按财产转让所得（转让收入 − 原捐赠人购房成本 − 相关税费）。","题干出现「无法提供原值凭证」，立刻切到核定征收，别再扣任何税费。"],"qs":[19,30,8,18,19,27,40]},{"id":"5-14","name":"利息股息红利与偶然所得：全额、20%、几个免税口子","star":"★★★","level":"L3","scene":"同样是 1 万元股息：持股 9 个月只要交 1000 元，通过深港通拿 H 股股息 2000 元却要交 400 元。体彩中奖 2 万元交 4000 元，1 万元以内一分不交。<br><br>还有一组「谁付的钱」题：企业用资金给普通雇员买房算工资薪金，给<b>投资者</b>买房却算利息股息红利。","why":"为什么上市公司股息要<b>按持股期限差别化</b>？这是资本市场的政策工具：抑制短线炒作、鼓励长期持有。持股 ≤1 个月<b>全额</b>计入、1 个月至 1 年（含）<b>减按 50%</b> 计入、<b>超过 1 年免征</b>。单选 17 里 1 万元股息减半后按 20% 交 1000 元，而 5 万元股票转让差价<b>免征</b>——境内上市公司股票转让所得暂免个税，与股息是两条线。<br><br>为什么 H 股股息不享受差别化？因为通过沪港通/深港通投资联交所 H 股，不是直接从境内公开发行市场取得，政策明确规定由 <b>H 股公司按 20% 代扣</b>，转让差价则暂免（单选 9：2000×20%=400）。<br><br>为什么偶然所得<b>按收入全额、不许扣任何费用</b>？因为中奖、受赠没有「为取得收入而发生的必要成本」这一概念。单选 12 里领奖花的 200 元通讯费不能扣，2 万×20%=4000 元。同理，免税分界 <b>1 万元</b> 是「≤1 万免、>1 万全额征」——注意是<b>全额</b>征，不是只对超出部分征。<br><br>最后那组「谁付的钱」：企业用资金为<b>除投资者以外的雇员</b>购房，是给雇员的报酬 → 工资薪金；为<b>个人投资者或其家庭成员</b>购房，实质是把企业利润变相分给投资人 → <b>利息股息红利所得</b>（多选 7）。还有一个隐蔽口径：个人投资者从其投资企业借款、<b>纳税年度终了既不归还又未用于生产经营</b>，视为红利分配。","sentence":"利息股息红利和偶然所得按收入全额×20%；上市公司股息按持股期限全额/减半/免征，H 股按 20% 代扣；彩票 1 万元是「超过即全额征」的分界。","trap":"· 单选 10：国债利息、国家发行的金融债券利息、教育储蓄存款利息<b>免征</b>；<b>企业债券利息照章征税</b>（答案 D）。<br>· 单选 12 / 多选 23：彩票一次中奖 ≤10000 元暂免，>10000 元<b>全额</b>征税；电脑彩票以<b>同一人同一期同一游戏全部奖金</b>为一次，即开型以<b>一张彩票</b>为一次；由<b>彩票机构代扣代缴</b>（C 的「自行申报」错），3000～10000 元的免税申报也由彩票机构办(D 错)。<br>· 单张有奖发票奖金 ≤<b>800 元</b> 暂免，超过 800 元全额按偶然所得征（多选 20 里 1000 元要交税）。<br>· 多选 9：无偿受赠房屋(A)、企业支付的不竞争款项(B)是偶然所得；律师以个人名义聘人付的报酬是<b>劳务报酬</b>(C)，消费积分反馈礼品<b>不征</b>(D)。<br>· 多选 10：价格折扣性质的消费券(A)、企业按折扣折让方式销售商品(D)<b>不征</b>；额外抽奖机会(B)、年会向本单位以外个人赠礼(C)按偶然所得征。判断关键是<b>有没有对价</b>。","table":{"head":["所得","计税依据","特殊口径"],"rows":[["上市公司股息（≤1 个月）","收入全额 ×20%","全额计入"],["上市公司股息（1 个月～1 年）","收入 ×50% ×20%","减半计入"],["上市公司股息（>1 年）","免征","鼓励长期持有"],["H 股股息（沪/深港通）","收入 ×20%","H 股公司代扣，不执行差别化"],["境内上市公司股票转让差价","暂免","与股息分开判断"],["彩票中奖 ≤10000 元 / >10000 元","暂免 / 全额 ×20%","超过即全额征，不是超额征"],["企业债券利息","全额 ×20%","国债、金融债券、教育储蓄免"]]},"tips":["差别化股息记三个台阶：<b>一个月全额、一年减半、超一年全免</b>。","看到「企业为个人买房买车」先问：<b>这人是雇员还是投资者</b>？"],"qs":[10,12,17,7,9,23]},{"id":"5-15","name":"三笔一次性的钱：年终奖、解除补偿、提前退休","star":"★★★","level":"L3","scene":"同样 8 万元年终奖，选单独计税交 7790 元；19.6 万元解除劳动关系补偿交 7480 元；把条件改成「提前退休 2 年」，同样 19.6 万只交 <b>2560 元</b>。<br><br>三笔钱都是「一次性拿到一大笔」，为什么算法完全不同？答案藏在<b>这笔钱本来该以什么形式、在多少年里拿到</b>。","why":"<b>全年一次性奖金</b>本质是全年劳动的奖金，如果并入综合所得会一次性把边际税率推高，显得对拿奖金的人不公平。所以给一条过渡通道（延续至 <b>2027.12.31</b>）：<b>奖金 ÷ 12 找月度税率表的税率和速算扣除数，再用奖金全额 × 税率 − 速算扣除数</b>。8 万÷12=6666.67 → 10%、速扣 210 → 80000×10%−210=<b>7790</b>。注意速算扣除数<b>只减一次</b>，不是乘 12。<br><br><b>解除劳动关系一次性补偿</b>不是劳动报酬，而是失业保障。所以 <b>当地上年职工平均工资 3 倍以内免税</b>（视作基本安置），超出部分<b>不并入综合所得、单独适用综合所得税率表</b>，但<b>不按年数平摊</b>：(196000−32000×3)×10%−2520=<b>7480</b>。<br><br><b>提前退休一次性补贴</b>替代的是「本该逐年领取的工资」——提前 2 年退休，这笔钱相当于补了 2 年的收入，所以要求<b>按实际提前年度数平均分摊</b>后再找税率，最后再乘回年数：[(196000÷2−60000)×10%−2520]×2=<b>2560</b>。每一步都扣一次 6 万减除费用，这是它比解除补偿便宜的原因。<br><br>为什么这三笔都要「单独计税」？共同理由是：<b>一次性大额收入若并入当年综合所得，会因累进税率产生与实质不符的税负</b>。但它们替代的收入形态不同（全年奖金 / 失业安置 / 跨年工资），所以摊法各异。","sentence":"年终奖：÷12 找月度税率，全额×税率−一次速扣；解除补偿：3 倍内免、超出单独用年表不平摊；提前退休：按提前年数平均、每年扣 6 万。","trap":"· 单选 14 适用<b>月度税率表</b>的是「按月领取的企业年金」(A)；因出境定居一次性领年金、解除补偿、提前退休补贴都用<b>年度综合所得税率表</b>。<br>· 母题（解除）→ <b>7480</b>；子题（提前退休 2 年）→ <b>2560</b>。只改一个词组，公式全换。<br>· 单选 18 别算成 2400（按 3% 错档）或 3600；6666.67 落在 10% 档、速扣 210。<br>· 提前退休的「2 年」是<b>办理提前退休手续至法定离退休年龄之间的实际年度数</b>，不是工作年限。","table":{"head":["所得","算法","本题答案"],"rows":[["全年一次性奖金（单独计税，≤2027.12.31）","奖金÷12 定税率 → 奖金全额×税率 − 速算扣除数","80000×10%−210 = 7790"],["解除劳动关系一次性补偿","上年职工平均工资 3 倍内免；超出部分单独用年表","(196000−96000)×10%−2520 = 7480"],["提前退休一次性补贴","按提前年数平均，每年减 6 万找税率，再乘年数","[(196000÷2−60000)×10%−2520]×2 = 2560"]]},"tips":["三笔钱只问一句：<b>它本来该分摊到几个月/几年</b>？年终奖 12 个月、提前退休 N 年、解除补偿不分摊。","母题子题是这一章最典型的命题法，先圈改动词再换公式。"],"qs":[14,18,35,36]},{"id":"5-16","name":"股权激励与补充保障：授权不征、缴费不征、领取才征","star":"★★★","level":"L3","scene":"股票期权<b>授予时</b>不征税、<b>行权时</b>按工资薪金征、行权后再转让按财产转让（境内上市公司股票免）；企业年金单位缴费部分计入账户时暂不征、个人缴费 4% 以内准扣；个人养老金每年 12000 元限额扣、领取时单独按 3%；商业健康险 2400 元/年，且<b>从提交保单凭证的次月起</b>每月最多扣 200。<br><br>四件事看着不搭，其实是同一套逻辑。","why":"共同逻辑叫 <b>EET</b>：<b>缴费/取得环节不征（Exempt）、投资收益环节不征（Exempt）、领取/变现环节才征（Taxed）</b>。<br><br>为什么期权<b>授予日不征</b>？因为那天员工拿到的只是一个「将来可以按某价格买股票的资格」，能不能行权、行权时股价多少都不确定，既没有可计量的收益也不能变现。到<b>行权日</b>，施权价与当日收盘价的差额才是一笔确定的、因任职受雇而来的报酬，按<b>工资薪金所得</b>征；行权后股票再转让，已经是个人财产处置，按<b>财产转让所得</b>（境内上市公司股票转让暂免）。<br><br>为什么年金/个人养老金「先不征、领取才征」？国家想鼓励个人自己补充养老，若缴费当下就征、投资收益年年征，几十年复利会被大幅削薄。所以把本金和收益都留在账户里滚存，等领取时按低税率一次性结清：个人养老金领取<b>不并入综合所得、单独按 3%</b>，税款计入「工资、薪金所得」项目；按月领取的年金适用<b>月度税率表</b>，因出境定居一次性领取的用年表。<br><br>为什么都有<b>限额</b>？因为这是税收优惠，不是无限兜底：年金个人缴费限本人缴费工资计税基数 <b>4%</b>、商业健康险 <b>2400 元/年（200 元/月）</b>、个人养老金 <b>12000 元/年</b>。超限额部分不许扣，防止高收入者借通道避税。单选 4 的题眼是「<b>次月起</b>」：12 月底提交保单，1 月只能扣 200 元，不是全年 4800。","sentence":"期权授权不征、行权按工资、再转让按财产转让；年金/养老金缴费与收益不征、领取才征；三类补充扣除都有硬限额。","trap":"· 单选 13：<b>授权时一般不作为应税所得</b>（C 错）；行权差额按工资薪金（A 的「暂不征税」错）；行权后再转让按财产转让（B 的「工资薪金」错）；因拥有股权参与税后利润分配按<b>利息股息红利所得</b>（D 对）。<br>· 单选 15 / 多选 43：个人养老金 <b>12000 元/年</b>（A 的 2400 错）、投资收益暂不征(B 对)、领取<b>不并入综合所得单独 3%</b>(C 错)、可在<b>综合所得或经营所得</b>扣(D 错)；缴费可在当年预扣或次年汇算扣，以信息管理服务平台出具的凭证为凭据。<br>· 多选 41：年金单位缴费部分<b>暂不纳税</b>(A 对 B 错)；个人缴费限额 8000×4%=<b>320 元/月</b>，实际缴 330 只能扣 320(D 对 C 错)。<br>· 多选 25：上市公司股权激励经备案可自<b>行权/解禁/取得奖励之日起不超过 36 个月</b>分期缴税（B 的 5 年错）；授权时不征(C 错)；行权后股票再转让免征(D 对)。<br>· 多选 26 暂不缴纳的是科研机构成果转化<b>股权奖励</b>(A)、非上市公司授予本公司员工<b>限制性股票</b>(C)；高新技术企业股权奖励是<b>可分期</b>不是暂不缴(B 错)，内退一次性补贴照章纳税(D 错)。<br>· 单选 4：商业健康险 12 月底交凭证 → 1 月扣 <b>200 元</b>；别忘了「次月」和「200/月」两个限制。","table":{"head":["项目","缴费/授予","持有/收益","领取/变现"],"rows":[["股票期权","授权一般不征","—","行权差额按工资薪金；再转让按财产转让（上市公司股票免）"],["企业/职业年金","单位缴费暂不征；个人缴费 4% 内扣","暂不征","按月领用月度税率表；一次性领用年表"],["个人养老金","12000 元/年限额据实扣","投资收益暂不征","不并入综合所得，单独 3%"],["商业健康险","2400 元/年（200 元/月），提交凭证次月起扣","—","—"]]},"tips":["<b>EET 一句话</b>：进去不征、中间不征、出来才征。凡是「缴费环节就要交税」的选项，基本都是错的。","三个限额单独背：<b>年金 4%、健康险 2400、养老金 12000</b>。"],"qs":[4,13,15,25,26,41,43]},{"id":"5-17","name":"特定股权与创投：拿东西换股权，也算卖了一次","star":"★★","level":"L2","scene":"张某拿名下仓库对外投资换甲公司 10% 股权，没收到一分钱现金，却要按「财产转让所得」交税；天使投资张某转让初创科技股权赚了 1200 万，只按 500 万计税；通过深港通买 H 股拿股息按 20% 代扣；创投企业选单一投资基金核算，股权转让和股息红利都按 20%。<br><br>共同点：<b>税法把没拿到钱的事，当成已经拿到钱来处理</b>。","why":"为什么<b>非货币性资产投资视同转让</b>？因为你把仓库换成股权，等价于「先把仓库卖了、再拿钱去买股权」——财产形态变了，增值已经实现，投资方也取得了可计量的对价（股权）。若此时不征税，等将来转让股权时原值难以追溯，增值就永久消失了。所以按<b>评估后的公允价值</b>确认转让收入（不是股权账面价值），减原值及合理税费后按 20% 计税。<br><br>但纳税人确实<b>没收到现金</b>，一次性缴税可能缴不起，所以允许在<b>不超过 5 个公历年度内（含）分期缴纳</b>。为什么主管税务机关是<b>不动产所在地</b>而不是居住地？因为被转让的财产在哪、原值凭证在哪，哪儿的税务机关才核得清。<br><br>为什么<b>天使投资能按投资额 70% 抵扣</b>？早期投资失败率极高，若只对成功项目征税、失败项目的亏损不能抵，就没人愿意投初创企业。政策让成功项目的税基先扣掉 70% 投资额，等于用盈利补亏损，是典型的「以组合为单位」的激励。单选 38：(2200−1000−1000×70%)×20%=<b>100 万</b>。<br><br>创投企业选<b>单一投资基金核算</b>同理：把基金视作一个投资管道，个人合伙人分得的股权转让所得和股息红利<b>一律按 20%</b>（不并进经营所得的五级累进），股权转让所得还能按被转让项目对应投资额 <b>70%</b> 抵扣；代价是<b>选择后 3 年内不得变更</b>，防止在两种核算方式间挑有利的来回切换。","sentence":"非货币投资视同转让、按评估公允价值计税但可 5 年分期；天使投资与创投单一基金都按投资额 70% 抵扣，单一基金核算一律 20%、3 年不得变更。","trap":"· 多选 38：按财产转让所得(A 对)、主管机关是<b>不动产所在地</b>(B 的「经常居住地」错)、可 5 个公历年度分期(C 对)、按<b>评估公允价值</b>确认收入(D 的「账面价值」错)。<br>· 多选 28（创投单一基金）：股权转让所得按 <b>20%</b> 不是经营所得(A 错)、70% 抵扣(B 对)、<b>3 年</b>不得变更(C 的 5 年错)、股息红利按 20%(D 对)。<br>· 单选 9 / 多选 22：内地个人经沪港通/深港通投资联交所 H 股，股息由 H 股公司按 <b>20%</b> 代扣，转让差价<b>暂免</b>；香港市场个人投资上交所 A 股转让差价暂免(D 属于免征项)。<br>· 多选 8：创投企业<b>按年度所得整体核算</b>时，个人合伙人所得是<b>经营所得</b>(E 错)；只有选单一投资基金核算才按 20%。","table":{"head":["情形","税目 / 计税","关键优惠"],"rows":[["以不动产/股权等非货币资产投资","财产转让所得，评估公允价值 − 原值","一次缴税困难可 ≤5 个公历年度分期"],["天使投资个人转让初创科技型企业股权","财产转让所得","按投资额 70% 抵扣应纳税所得额，不足可结转"],["创投企业单一投资基金核算","个人合伙人股权转让与股息红利均 20%","项目对应投资额 70% 抵扣；3 年不得变更"],["沪/深港通投资 H 股","股息按 20% 代扣","转让差价暂免"]]},"tips":["「没拿到现金」不等于不纳税：<b>财产形态一变，增值就实现</b>；但税法会给你分期缴的缓冲。","70% 抵扣在两处出现（天使投资、创投单一基金），别和企税的 70% 混淆。"],"qs":[9,38,28,38]},{"id":"5-18","name":"特殊职业与平台：谁用累计预扣法","star":"★★★","level":"L3","scene":"保险营销员佣金 3 万预扣 390 元、网红从平台拿 8 万劳务报酬扣 3380 元、平台内从业人员 6 月 8000 / 7 月 9000 分别扣 42 / 66 元、无住所非居民约翰 11 月只交 440 元。<br><br>四道题四个身份，但前三道用的是<b>同一套累计预扣法</b>，只是「其他扣除」和「减除费用」的算法略有不同。","why":"先问一句：这些人的收入明明是劳务报酬，为什么不按「按次 20%/30%/40%」预扣？因为他们<b>收入波动大、与平台或公司有持续从业关系却没有雇佣关系</b>。按次扣会在淡季多扣、旺季少扣，年终产生大量退税；累计预扣法把「5000 元/月减除费用」和「20% 费用」按累计月份摊开，接近工资的处理，年内税负更平稳。这也是多选 36 的答案来源：<b>工资薪金、保险营销员/证券经纪人佣金、全日制学生实习报酬、平台从业人员劳务报酬</b>四类可用；<b>普通兼职仍按次</b>。<br><br>三处差别要分清：<br>· <b>保险营销员</b>：收入额 = 佣金×(1−20%)，再扣<b>展业成本 = 收入额×25%</b>（自己承担交通、通讯、客户维护等开支）、附加税费、依法确定的其他扣除；减除费用 5000×从业月份数。<b>专项扣除和专项附加扣除在预扣环节暂不扣</b>，等汇算再扣。单选 32：[30000×80%×(1−25%)−5000]×3%=390。<br>· <b>平台从业人员</b>：累计费用 = 累计收入×20%，累计减除费用 = 5000×<b>在本平台连续取得劳务报酬的月份数</b>；注意是「连续」，中间断月要重新起算。单选 33：[80000×80%−5000]×10%−2520=3380；单选 39 两月累计 17000 → 6 月 42 元、7 月 66 元。<br>· <b>无住所非居民</b>：不适用累计预扣法。≤90 天只就境内支付的境内所得征；当月收入额要按「境内外工资总额 × 境内支付比例 × 境内工作天数÷当月公历天数」挤出，再减 5000 用<b>月度税率表</b>。单选 34 里离境当天按半天，11 月工作 11.5 天，收入额 11500 → (11500−5000)×10%−210=<b>440</b>。","sentence":"累计预扣法用于工资薪金、保险营销员/证券经纪人佣金、全日制学生实习、平台从业人员劳务报酬；普通兼职按次；非居民另按工作天数折算。","trap":"· 单选 32 别漏 <b>展业成本 25%</b>（会算成 570）；也别把专项附加扣除塞进预扣环节。<br>· 单选 33 平台减除费用按<b>连续从业月份数</b>；8 万元那题只有一个月，减 5000 而不是 60000。<br>· 单选 34 离境当天不足 24 小时按 <b>0.5 天</b>计工作天数；「在华期间无离境记录」不等于按整月算。<br>· 多选 36 里「赵某兼职取得的收入」是普通劳务报酬，<b>按次</b>预扣(D 错)；「证券经纪人佣金」和「平台劳务报酬」都走累计预扣(B、E 对)。","table":{"head":["身份","累计收入额","减除费用","其他扣除"],"rows":[["工资薪金","收入全额","5000 × 任职月份数（三种特殊情形见 5-9）","三险一金、专项附加、年金等"],["保险营销员/证券经纪人佣金","佣金 ×80%","5000 × 从业月份数","展业成本 = 收入额 ×25%；专项与专项附加预扣时不扣"],["平台内从业人员劳务报酬","累计收入 ×80%","5000 × 本平台连续从业月份数","依法确定的其他扣除"],["全日制学生实习报酬","可比照累计预扣法","同上","—"],["普通兼职劳务报酬","按次，≤4000 减 800 / >4000 ×80%","无","按次预扣，无累计"]]},"tips":["四道计算题共用一个公式：<b>(累计收入 − 累计费用 − 累计减除费用 − 其他扣除)×预扣率 − 速算扣除 − 已预扣</b>，差别只在「其他扣除」那一格。","非居民题不要套累计预扣法，先算<b>工作天数</b>再算收入额。"],"qs":[32,33,34,39]},{"id":"5-19","name":"不征、免征、减征与公益捐赠：三个词不能混","star":"★★★","level":"L3","scene":"政府特殊津贴免、提前退休补贴不免；价格折扣消费券不征、额外抽奖机会要征；残疾孤老烈属所得是「减征」不是「免征」；个体户捐 60 万，只能扣 54 万。<br><br>多选 22 是 8 选项非标准题，专门考你能不能把这三档分开。","why":"三个词对应三件不同的事：<br>· <b>不征</b>：这笔钱<b>压根不构成所得</b>。价格折扣/折让是买卖合同的一部分、消费券是折扣凭证、企业按折扣价卖商品——买方没白得任何东西，只是少付了钱。<br>· <b>免征</b>：本来就是所得，但政策给免。保险赔款、举报违法犯罪奖金、国债利息、按国务院规定发给的政府特殊津贴、育儿补贴、法律援助补贴、扣缴手续费都属于此类。<br>· <b>减征</b>：本来要交，但照顾特定人群或特定政策目标，<b>减按 50% 计入或减少税额</b>。残疾孤老烈属所得由省级政府定减征幅度和期限（所以多选 22 的 B 不能被选进「免征或不征」）。<br><br>为什么减按 50% 计入的项目（多选 21）是<b>远洋船员、持股 9 个月股息、铁路债券利息</b>？都是定向产业/投资激励：远洋船员一个纳税年度内船航行满 183 天、上市公司股息按持股期差别化、铁路债券利息减半。而职务科技成果转化的<b>股权奖励是「暂不征收」</b>（现金奖励才是减按 50% 计入当月工资薪金），两者常被混在一个选项里。<br><br>公益捐赠这边，为什么有的能<b>全额扣</b>、有的只能限额扣？全额扣除清单是定向引导的项目（农村义务教育、红十字、公益性青少年活动场所、老年服务机构、非关联科研机构研发、中国福利会等特定组织，多选 30 四项全对）；其余只能限额：<b>综合所得/经营所得按应纳税所得额 30%</b>（企业所得税是利润总额 12%）。多选 35 里 180×30%=54 万，所以 60 万捐款只能扣 54 万。","sentence":"不征＝不是所得，免征＝是所得但政策免，减征＝照常是所得只减半；公益捐赠全额扣除限清单内项目，其余按应纳税所得额 30% 限额。","trap":"· 单选 11：<b>提前退休取得的一次性补贴</b>应照章纳税(B 对)，政府特殊津贴、育儿补贴、法律援助补贴都免。<br>· 多选 22 答案 <b>ACDEFG</b>：B 残疾孤老烈属是<b>减征</b>、H 个独食品加工所得<b>照章征税</b>，这两个不能选；香港市场个人投资上交所 A 股转让差价暂免(D)、青苗补偿费(E)、行政和解金(F)、高级专家延长退休工资(G)、扣缴手续费(A)、外籍个人从外商投资企业取得股息红利(C)都属于免税或不征。<br>· 多选 20：保险理赔 5000(A)、举报犯罪奖金 8000(D) 免；商场抽奖 500 元(B)属偶然所得无免税；单张有奖发票 1000 元 >800 元要全额征(C)。<br>· 多选 35：公益捐赠在经营所得中<b>可选预缴或汇算扣</b>(A 的「统一汇算」错)、限额 54 万(C 对 B 错)、票据留存 <b>5 年</b>(D 对)。<br>· 多选 10 的「不征」判断口径：<b>有没有对价</b>；折扣折让不征，白送的礼品/抽奖按偶然所得。","table":{"head":["档","含义","本章例子"],"rows":[["不征","不构成所得（有对价）","价格折扣折让、消费券/代金券、折扣方式销售商品、消费积分反馈礼品、不具所有权的量化资产"],["免征","是所得但政策免","保险赔款、举报奖金、国债/金融债券利息、政府特殊津贴、育儿补贴、法律援助补贴、扣缴手续费、青苗补偿费"],["减征/减半计入","是所得，减幅或减半","残疾孤老烈属所得、远洋船员（满 183 天）、上市公司股息（1 个月～1 年）、铁路债券利息、科技成果转化现金奖励"],["全额扣除捐赠","政策定向引导","农村义务教育、红十字、青少年活动场所、老年服务机构、非关联科研机构研发、特定公益组织"]]},"tips":["做 8 选项题时，先把每个选项标上<b>不征 / 免 / 减 / 照征</b>再勾，别凭印象打包选。","「全额扣除」是例外清单，<b>不在清单里的一律按 30% 限额</b>。"],"qs":[11,10,20,21,22,30,35]},{"id":"5-20","name":"境外所得抵免：只抵到按我国税法算出来的数","star":"★★★","level":"L3","scene":"A 国的纳税年度是 5 月 1 日到次年 4 月 30 日，张某在这期间拿了 100 万股息——这算 2024 年还是 2025 年？<br><br>另一题：张某被派往境外工作，全年工资折合 80 万、在境外已缴 15 万，回国还要再交 <b>23080 元</b>。","why":"先解决「哪一年」：各国会计年度不一致，如果允许纳税人自己挑归属年度，就能把境外所得挪到低收入年份少交税。所以规则写死：<b>境外纳税年度最后一日所在的公历年度，就是该笔境外所得对应的我国纳税年度</b>。A 国年度 2024.5.1–2025.4.30，最后一日落在 2025 年 → 归 <b>2025 年度</b>（单选 20 答案 B）。<br><br>再解决「为什么还要补钱」：同一笔钱被两国征税会抑制跨境流动，所以居民国承认来源国<b>优先征</b>，允许抵免。但抵免有上限——<b>按我国税法对这笔境外所得算出来的应纳税额</b>。为什么设上限？因为若不封顶，境外高税率国家征多了的部分就要由我国财政退还，等于让别国的税率反过来决定我们的税收。所以取<b>抵免限额与境外已纳税额孰低</b>；超额部分不能退，但可在以后年度该国抵免余额内结转。<br><br>单选 37：按我国综合所得算抵免限额 = (800000−60000)×35%−85920 = <b>173080</b> > 已纳 150000，所以在我国补 173080−150000 = <b>23080</b>。<br><br>为什么是「<b>分国不分项</b>」？多选 29 的选项 A 说「综合、经营、其他分类所得分别计算抵免限额、分别抵免」是错的：来源于<b>同一国家（地区）</b>的三类抵免限额要<b>相加成一个总额</b>再抵免。因为跨境投资常有几类所得混在一起，分国已经能防税率套利，再分项只会让限额用不完、   const q = c && c.questions.find(x => x.type === type && x.no === no);
  // 历史踩坑次数只增不减：重刷答对后题目会离开错题本，但薄弱点排行仍能看见这个坑
  if (q && val !== q.ans) S.wrongLog[k] = (S.wrongLog[k] || 0) + 1;
  S.answers[k] = val; save();
}
function isRight(ch, q) {
  const a = answerOf(ch, q.type, q.no);
  return a != null && a === q.ans;
}
function wrongLogOf(ch, q) { return S.wrongLog[key(ch.id, q.type, q.no)] || 0; }
// 老数据懒迁移：以前答错但还没建过错题日志的，补记 1 次
function migrateWrongLog() {
  let touched = false;
  Object.values(CH).forEach(ch => ch.questions.forEach(q => {
    const k = key(ch.id, q.type, q.no);
    const a = S.answers[k];
    if (a != null && a !== q.ans && !S.wrongLog[k]) { S.wrongLog[k] = 1; touched = true; }
  }));
  if (touched) save();
}
// 当前仍算错题的题（答错过且尚未重刷答对）
function wrongList(scope) {
  const out = [];
  Object.values(CH).forEach(ch => ch.questions.forEach(q => {
    const a = answerOf(ch.id, q.type, q.no);
    if (a == null || a === q.ans) return;
    if (scope && scope !== 'all') {
      if (scope.indexOf('ch') === 0 && ch.id !== scope) return;
      if (scope.indexOf('ch') !== 0 && q.block !== scope) return;
    }
    out.push({ ch, q });
  }));
  return out;
}
// 按知识块聚合薄弱点：先按历史踩坑次数，再按当前错题数，最后按该块正确率
function weakness() {
  const map = {};
  Object.values(CH).forEach(ch => ch.questions.forEach(q => {
    const b = ch.notes.blocks.find(x => x.id === q.block);
    if (!b) return;
    const m = map[q.block] || (map[q.block] = { id: q.block, ch, b, total: 0, done: 0, right: 0, wrong: 0, hist: 0 });
    m.total++;
    const a = answerOf(ch.id, q.type, q.no);
    if (a != null) { m.done++; if (a === q.ans) m.right++; else m.wrong++; }
    m.hist += wrongLogOf(ch, q);
  }));
  return Object.values(map).filter(m => m.wrong > 0 || m.hist > 0)
    .sort((a, b) => (b.hist - a.hist) || (b.wrong - a.wrong) ||
      ((a.right / (a.done || 1)) - (b.right / (b.done || 1))));
}
function chapterStats(ch) {
  let total = 0, done = 0, right = 0;
  ch.questions.forEach(q => {
    total++;
    if (answerOf(ch.id, q.type, q.no) != null) {
      done++;
      if (isRight(ch.id, q)) right++;
    }
  });
  return { total, done, right, wrong: done - right };
}
function globalStats() {
  let t = 0, d = 0, r = 0;
  Object.values(CH).forEach(c => { const s = chapterStats(c); t += s.total; d += s.done; r += s.right; });
  return { t, d, r };
}

window.addEventListener('hashchange', route);
function route() {
  const h = location.hash.replace(/^#\/?/, '');
  const parts = h.split('/').filter(Boolean);
  closeSidebar();
  if (!parts.length) return renderHome();
  if (parts[0] === 'wrong') return renderWrong();
  if (parts[0] === 'cards') return renderCards();
  if (parts[0] === 'sprint') return renderSprint(parts[1], parts[2]);
  const ch = CH[parts[0]];
  if (!ch) return renderHome();
  if (parts[1] === 'b' && parts[2]) {
    const b = ch.notes.blocks.find(x => x.id === parts[2]);
    return b ? renderBlock(ch, b) : renderChapter(ch);
  }
  if (parts[1] === 'quiz') return renderQuiz(ch);

}

/* ---------- question card ---------- */
function qCardHTML(ch, q) {
  const a = answerOf(ch.id, q.type, q.no);
  const done = a != null;
  const opts = Object.keys(q.opts).map(k => {
    let cls = 'opt';
    if (done) {
      if (q.ans.includes(k)) cls += ' right';
      else if (a.includes(k)) cls += ' wrong';
    }
    return `<button class="${cls}" data-k="${k}" ${done ? 'disabled' : ''}>
      <span class="k">${k}</span><span>${rich(q.opts[k])}</span></button>`;
  }).join('');
  const fb = done ? feedbackHTML(ch, q, a) : '';
  return `<div class="q" data-no="${q.no}" data-type="${q.type}">
    <div class="q-head">
      <span class="q-no">${q.type === 'single' ? '单选' : '多选'} ${q.no}</span>
      ${q.type === 'multi' && !done ? '<span>选全部正确项后提交</span>' : ''}
      ${done ? `<span>你的答案 <b style="color:${isRight(ch, q) ? 'var(--ok)' : 'var(--accent)'}">${a}</b></span>` : ''}
    </div>
    <div class="q-stem">${rich(q.stem)}</div>
    ${opts}
    ${q.type === 'multi' && !done ? '<button class="submit" data-submit>提交答案</button>' : ''}
    ${fb}
  </div>`;
}
function feedbackHTML(ch, q, a) {
  const ok = a === q.ans;
  return `<div class="fb">
    <div class="verdict ${ok ? 'ok' : 'no'}">${ok ? '✓ 对了' : '✗ 正确答案 ' + q.ans}</div>

    ${q.raw ? `<div class="fbrow raw"><b>原书解析</b>${rich(q.raw)}</div>` : ''}
  </div>`;
}

/* ---------- bind questions (in block page) ---------- */
function bindQuestions() {
  document.querySelectorAll('.q').forEach(el => {
    if (el.dataset.qb) return;
    el.dataset.qb = '1';
    const no = +el.dataset.no, type = el.dataset.type;
    const ch = currentChapter();
    if (!ch) return;
    const q = ch.questions.find(x => x.no === no && x.type === type);
    if (!q) return;
    el.querySelectorAll('.opt').forEach(btn => {
      btn.addEventListener('click', () => {
        const k = btn.dataset.k;
        if (q.type === 'single') {
          setAnswer(ch.id, type, no, k);
          rerenderCard(el, ch, q);
        } else {
          const cur = (el.dataset.tmp || '').split('').filter(Boolean);
          const i = cur.indexOf(k);
          i >= 0 ? cur.splice(i, 1) : cur.push(k);
          el.dataset.tmp = cur.sort().join('');
          el.querySelectorAll('.opt').forEach(b => b.classList.toggle('sel', el.dataset.tmp.includes(b.dataset.k)));
        }
      });
    });
    const sb = el.querySelector('[data-submit]');
    if (sb) sb.addEventListener('click', () => {
      const v = el.dataset.tmp || '';
      if (!v) return;
      setAnswer(ch.id, type, no, v);
      rerenderCard(el, ch, q);
      refreshNav();
    });
  });
}
function rerenderCard(el, ch, q) {
  const tmp = document.createElement('div');
  tmp.innerHTML = qCardHTML(ch, q);
  const fresh = tmp.firstElementChild;
  el.replaceWith(fresh);
  bindQuestions();
  refreshNav();
}
function currentChapter() {
  const parts = location.hash.replace(/^#\/?/, '').split('/').filter(Boolean);
  return CH[parts[0]] || null;
}

  quizState = { ch, qs, i: firstUndone >= 0 ? firstUndone : 0 };
  drawQuiz();
}
function drawQuiz() {
  const { ch, qs, i } = quizState;
  const q = qs[i];
  const done = chapterStats(ch);
  document.getElementById('view').innerHTML = `
  <div class="crumb"><b>${esc(ch.name)}</b> · 刷题模式</div>
  <div class="quizbar">

function highlightNumbers(root) {
  const re = /(\d+(?:\.\d+)?\s*(?:%|‰|万元|万|元\/[年月]|元|个月|日|天|年|倍|吨|升|公斤))/g;
  const walker = document.createTreeWalker(root, 4, null);  // 4 = SHOW_TEXT
  const nodes = [];
  while (walker.nextNode()) nodes.push(walker.currentNode);
  nodes.forEach(n => {
    const txt = n.nodeValue || '';
    if (!/\d/.test(txt)) return;
    re.lastIndex = 0;
    const frag = document.createDocumentFragment();
    let last = 0, m, any = false;
    while ((m = re.exec(txt))) {
      if (m.index > last) frag.appendChild(document.createTextNode(txt.slice(last, m.index)));
      const mark = document.createElement('mark');
      mark.className = 'hl'; mark.textContent = m[0];
      frag.appendChild(mark);
      last = m.index + m[0].length; any = true;
    }
    if (!any) return;
    if (last < txt.length) frag.appendChild(document.createTextNode(txt.slice(last)));
    n.parentNode.replaceChild(frag, n);
  });
}
