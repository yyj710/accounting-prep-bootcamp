时必备「原因证明 + 合同 + 非现金付款凭证」三项。","trap":"· 已抵扣进项税的被盗/霉烂存货要做<b>进项转出</b>，并计入损失一起扣；<br>· 「逾期 1 年」「清算期超过 1 年」「投资超过 5 年」都是教材故意调低的错误数字；<br>· 无法补开发票时，<b>出入库内部凭证不是必备资料</b>；<br>· 已扣损失以后收回，计入<b>收回当期</b>，不追溯；<br>· 实际资产损失追补到<b>发生年度</b>，法定资产损失在<b>申报年度</b>扣。","table":{"head":["损失类型","扣除条件要点"],"rows":[["存货被盗","成本 + 进项转出 - 保险 - 责任人赔偿"],["应收账款","逾期 3 年以上且确凿无力清偿 / 破产 / 重组 / 灾害"],["股权投资","破产注销，或停营 3 年以上无恢复计划；无控制且投资 >10 年"],["补不开票","原因证明 + 合同 + 非现金付款凭证（三项必备）"]]},"tips":["看到「预计难以收回」「超过 1 年」这类软措辞，先怀疑数字被调低了。"],"qs":[46,16,17,21,22,23]},{"id":"4-20","name":"其他扣除边界：不得扣除项目、手续费佣金、筹办费、平台劳务报酬","star":"★★","level":"L2","scene":"企业之间付的管理费、被没收财物的损失、向投资者支付的股息、烟草企业的烟草广宣费——这些<b>一律不能扣</b>；而违约金、银行罚息、诉讼费、银行内部机构间利息<b>可以扣</b>。<br><br>这一块就是把「哪些钱税法认」的边界一次划清。","why":"不得扣除项目的共同点：<b>要么不是经营代价，要么扣了会破坏别的制度</b>。向投资者支付股息是利润分配（不是费用）；企业之间支付的管理费、内营业机构间利息容易被用来转移利润；罚金、滞纳金、被没收财物损失若允许扣，等于国家替违法者买单；非广告性质赞助、为投资者付的商业保险费与经营无关。<br><br><b>手续费及佣金</b>分三档（多选 43）：<br>① <b>据实扣除</b>：从事代理服务、主营收入就是手续费佣金的企业（证券、期货、保险代理等）；<br>② <b>限额但可结转</b>：保险企业按「全部保费收入 - 退保金等」余额的 <b>18%</b>；<br>③ <b>限额不可结转</b>：电信企业按收入总额 <b>5%</b>；其他企业按服务协议确认收入金额的 <b>5%</b>。另外发行权益性证券的手续费佣金属资本性支出，冲减资本公积、不得当期扣；<b>除委托个人代理外，现金等非转账方式支付</b>的手续费佣金不得扣。<br><br><b>互联网平台企业</b>是 2026 年新考点（单选 56）：要<b>同时</b>完成个人所得税扣缴申报、增值税及附加税费代办申报并缴款，且按规定留存实名核验、业务交易明细等真实性资料，才能凭完税凭证<b>据实扣除</b>劳务报酬；只办个税、或没留存资料、或用内部付款凭证，都不行。<br><br><b>筹建期</b>：广告费和业务宣传费按实际发生额计入筹办费，业务招待费按 <b>60%</b> 计入；筹办费不算亏损，可在开始经营当年一次性扣除或作为长期待摊费用 <b>不少于 3 年</b>摊销，一经选定不得改变（多选 42）。","sentence":"不得扣的四类：利润分配、内部转移、违法代价、与经营无关；手续费佣金三档（代理据实 / 保险 18% 可结转 / 电信及其他 5% 不可结转）。","trap":"· 「<b>非银行</b>企业内营业机构之间支付的利息」不得扣，「<b>银行</b>企业」可以；<br>· 烟草企业的<b>烟草</b>广宣费一律不得扣；<br>· 预提的维简费不得扣，实际发生且属收益性支出的才可以；<br>· 电信企业 5% 的基数是<b>收入总额</b>，其他企业是<b>合同确认的收入金额</b>；<br>· 保险企业 18% 超额可结转，其他企业 5% 超额不可结转；<br>· 平台企业只完成个税扣缴<b>不够</b>，必须同时办增值税及附加代办申报。","table":{"head":["企业类型","手续费佣金限额","超额结转"],"rows":[["证券 / 期货 / 保险代理等","据实扣除","—"],["保险企业","净保费收入 18%","可结转"],["电信企业","收入总额 5%","不可结转"],["其他企业","合同确认收入 5%","不可结转"]]},"tips":["「据实扣除」的那一档看的是<b>主营业务本身就是手续费佣金</b>，不是行业名头。"],"qs":[56,13,14,42,43]},{"id":"4-21","name":"征收管理：纳税年度、汇算清缴、跨地区汇总纳税","star":"★","level":"L1","scene":"一年中间才开业、或者中途终止经营，这一年怎么算？跨省有分公司，税在谁那儿交？<br><br>这三道题（多选 35、36）考的都是程序规则，没有推理，但错一个选项整题不得分。","why":"· <b>纳税年度</b>：正常是公历 1 月 1 日至 12 月 31 日；年度中间开业或终止经营、实际经营期不足 12 个月的，以<b>实际经营期</b>为一个纳税年度（不是「连续 12 个月」）；<b>清算期间单独作为一个纳税年度</b>。<br>· <b>汇算清缴</b>：按年计征、分月或分季预缴、年终汇算清缴、多退少补；年度终了之日起 <b>5 个月</b>内汇缴；<b>年度中间终止经营</b>的，应自实际经营终止之日起 <b>60 日内</b>办理当期汇缴。<br>· <b>跨地区经营汇总纳税</b>：总机构统一计算当期应纳税额，其中 <b>50%</b> 在各分支机构之间分摊，分摊按上年度各省市分支机构的<b>营业收入、职工薪酬、资产总额</b>三个因素（加权 0.35 / 0.35 / 0.30），<b>不含营业成本</b>（多选 36 = BCD）。","sentence":"不足 12 个月按实际经营期，清算单独一个年度；终止经营 60 日内汇缴、正常年度 5 个月内；跨省汇总 50% 按收入/薪酬/资产三因素分摊。","trap":"· 「以连续经营的 12 个月为纳税年度」是错的；<br>· 终止经营的汇缴期限是 <b>60 日</b>，不是 5 个月；<br>· 分摊三因素里<b>没有营业成本</b>；<br>· 分摊用的是<b>上年度</b>数据。","tips":["三因素记成「<b>人、钱、物</b>」：职工薪酬、营业收入、资产总额。"],"qs":[35,36]}],"questions":[{"no":1,"type":"single","stem":"下列企业中，属于居民企业的是( )。","opts":{"A":"在我国境内成立但实际管理机构在A国的甲有限责任公司","B":"实际管理机构在我国的乙个体工商户","C":"在我国境内成立的丙合伙企业","D":"在A国成立且实际管理机构在A国，但有来源于我国境内所得的丁企业"},"ans":"A","raw":"【解析】(1)选项A:“依法在中国境内成立”与“实际管理机构在中国境内”,二者满足\n其一即为居民企业。\n(2)选项BC:依法在境内成立的个体工商户、个人独资企业、合伙企业不适用《企业所\n得税法》,不属于企业所得税的纳税人。\n(3)选项D:属于非居民企业。非居民企业，是指依照外国(地区)法律成立且实际管\n理机构不在中国境内，但在中国境内设立机构、场所的，或者在中国境内未设立机构、\n场所，但有来源于中国境内所得的企业。","block":"4-1","exam":"居民企业的判定标准","think":"两个标准满足其一即居民：<b>依法在境内成立</b> 或 <b>实际管理机构在境内</b>。A 在境内成立，哪怕管理机构在 A 国，仍是居民。BC 是个体工商户、合伙企业，压根不适用企业所得税法。D 成立地和实际管理机构都在境外，是非居民。","trap":"别被「实际管理机构在境外」骗了——它只是两个标准之一；也别把个体户、合伙企业当居民企业。"},{"no":2,"type":"single","stem":"某公司是在我国境内设立机构、场所的非居民企业，2025年取得收入如下：来源于境内的与机构、场所有实际联系的所得300万元，来源于境内的与机构、场所无实际联系的所得100万元；来源于境外的与机构、场所有实际联系的所得200万元，来源于境外的与机构、场所无实际联系的所得50万元。该公司上述所得应该在我国缴纳企业所得税的是( )万元。","opts":{"A":"300","B":"500","C":"600","D":"650"},"ans":"C","raw":"【解析】在我国境内设立机构、场所的非居民企业，就来源于中国境内的所得(300万元+\n100万元),以及发生在中国境外但与其所设机构、场所有实际联系的所得(200万元)\n在我国缴纳企业所得税。","block":"4-1","exam":"设立机构场所的非居民企业，哪些所得在境内交税","think":"分两块记：① <b>全部境内所得</b>（不管有没有实际联系）都要交：300+100；② <b>境外所得中与该机构有实际联系</b>的部分也要交：200。境外无实际联系的 50 不交。合计 300+100+200=600。","trap":"「境内无实际联系」不等于不交税，只要钱来源于境内就要交；只有「境外 + 无实际联系」才排除。"},{"no":3,"type":"single","stem":"下列企业的所得中，适用25%税率缴纳企业所得税的是( )。","opts":{"A":"未在我国境内设立机构、场所的非居民企业取得来源于境内的租金所得","B":"未在我国境内设立机构、场所的非居民企业取得来源于境外的利息所得","C":"在我国境内设立机构、场所的非居民企业取得来源于境内与设立的机构、场所没有实际联系的股息所得","D":"在我国境内设立机构、场所的非居民企业取得来源于境内与设立的机构、场所有实际联系的财产转让所得"},"ans":"D","raw":"【解析】(1)选项AC:适用10%税率。","block":"4-1","exam":"非居民企业适用 25% 还是 10%","think":"两问定税率：有无境内机构场所 → 有无实际联系。<b>有联系按 25%</b>，<b>无联系按 10% 源泉扣缴</b>。D 是境内有机构场所且有实际联系的财产转让所得 → 25%。A、C 是 10%，B 境外利息与境内机构无联系 → 不征。","trap":"境外所得不是一律不征：与境内机构有实际联系的境外所得按 25% 征。"},{"no":4,"type":"single","stem":"企业取得的下列收入中，按照实际收到的日期确认收入实现的是( )。","opts":{"A":"转让股权收入","B":"接受捐赠收入","C":"与销售货物金额直接相关的财政补贴","D":"特许权使用费收入"},"ans":"B","raw":"【解析】(1)选项A:应于转让协议生效且完成股权变更手续时确认收入的实现。\n(2)选项B:按照实际收到捐赠资产的日期确认收入的实现。\n(3)选项C:企业按市场价格销售货物、提供劳务服务等，凡由政府财政部门根据企业销\n售货物、提供劳务服务的数量、金额的一定比例给予全部或部分资金支付的，应当按照\n权责发生制原则确认收入；除上述情形外，企业取得的各种政府财政支付，如财政补贴、\n补助、补偿、退税等，应当按照实际取得收入的时间确认收入。\n(4)选项D:按照合同约定的特许权使用人应付特许权使用费的日期确认收入的实现。","block":"4-2","exam":"哪类收入按「实际收到日」确认","think":"税法确认时点要一个能查证的时刻。<b>接受捐赠</b>没有对价、没有合同约定付款日，唯一确定的就是东西到手那天 → 按实际收到日。A 股权转让要协议生效+完成变更；C 与销量挂钩的补贴随货物按权责发生制；D 特许权费按合同约定应付日。","trap":"政府补贴分两种：跟销售数量/金额挂钩的按权责发生制，其余财政补贴才按实际取得时间——别一刀切。"},{"no":5,"type":"single","stem":"企业发生下列处置资产的情形中，应当视同销售确认企业所得税收入的是( )。","opts":{"A":"将自建商品房转为自用","B":"将开发产品用于股息分配","C":"将自产货物在境内分支机构之间转移","D":"将自产货物用于加工另一产品"},"ans":"B","raw":"【解析】选项ACD:资产所有权属在形式和实质上均不变，不视同销售确认收入。","block":"4-3","exam":"企业所得税视同销售的判断线","think":"只问一句：<b>所有权有没有离开企业</b>。用于股息分配，货给了股东，所有权出门 → 视同销售。ACD 是自用、境内分支机构间移送、继续加工另一产品，都在企业内部转，不视同。","trap":"增值税里总分机构异地移送可能视同销售，企税不视同——两税判断线不同。"},{"no":6,"type":"single","stem":"某公司采用买一赠一方式销售冰箱20台，开具增值税普通发票注明不含税金额60000元、税额7800元，同时赠送加湿器20台，每台加湿器成本500元、市场不含税销售价格600元/台。该公司就该业务确认冰箱的企业所得税销售收入是( )元。","opts":{"A":"50000","B":"70000","C":"72000","D":"60000"},"ans":"A","raw":"买一赠一不属于捐赠，按各项商品公允价值比例分摊总销售额：冰箱收入=60000/(60000+600×20)×60000=50000元。","block":"4-4","exam":"买一赠一的收入分摊","think":"买一赠一<b>不是捐赠</b>，钱是一整笔收的，按公允价值比例把 60000 分摊给冰箱和加湿器：冰箱 = 60000 ÷ (60000 + 600×20) × 60000 = <b>50000</b> 元。","trap":"别按赠品市价额外加收入（会得 72000），也别把全部 60000 都算冰箱（那是没分摊）。"},{"no":7,"type":"single","stem":"企业接收股东划人资产，凡合同、协议约定作为资本金(包括资本公积)且在会计上已作实际处理的，不计入企业的收入总额，企业应按( )确定该项资产的计税基础。","opts":{"A":"接收价值","B":"公允价值","C":"账面净值","D":"账面原值"},"ans":"B","raw":"股东划入资产约定作为资本金且会计已作处理的，不计入收入总额，按公允价值确定计税基础。","block":"4-5","exam":"股东划入资产的计税基础","think":"合同约定作为资本金且会计已实际处理 → 性质是<b>投入资本</b>，不进收入总额；但计税基础要按<b>公允价值</b>确定，防止把低估资产塞进来以后多提折旧。","trap":"「不计入收入」≠「按账面净值记账」；接收价值和账面原值都是干扰项。"},{"no":8,"type":"single","stem":"下列款项中，免征企业所得税的是( )","opts":{"A":"非营利性科研机构接收企业基础研究资金收入","B":"国债转让收入","C":"全国社会保障基金理事会将转让划转的国有股权及现金收益投资取得的收入","D":"依法收取并纳人财政管理的行政事业性收费"},"ans":"A","raw":"选项B国债转让收入照章纳税；选项CD属于不征税收入；选项A非营利性科研机构接收企业基础研究资金收入免征企业所得税。","block":"4-6","exam":"不征税 / 免税 / 照章纳税三分法","think":"A 非营利性科研机构接收企业基础研究资金收入 → <b>免税</b>。B 国债<b>转让</b>收入照章纳税（只有国债利息免税）。C 社保基金理事会转让划转国有股权及现金收益投资收入、D 纳入财政管理的行政事业性收费 → <b>不征税</b>。","trap":"看到「国债」先分清是利息还是转让；看到「依法收取并纳入财政管理」是不征税不是免税。"},{"no":9,"type":"single","stem":"下列各项中，不属于企业转让国债时成本计算方法的是( )。","opts":{"A":"先进先出法","B":"后进先出法","C":"加权平均法","D":"个别计价法"},"ans":"B","raw":"国债成本计算方法可选先进先出法、加权平均法、个别计价法，一经选用不得随意变更；<b>后进先出法</b>不得使用（存货成本计算同样禁用）。","block":"4-7","exam":"国债成本计算方法","think":"可用先进先出、加权平均、个别计价，一经选用不得随意变更；<b>后进先出法禁用</b>。存货成本计算同样禁用，理由都是防止通胀下长期压低所得。","trap":"别和增值税串：增值税金融商品买入价用加权平均/移动加权平均，且 36 个月不变。"},{"no":10,"type":"single","stem":"下列企业发生的广告费和业务宣传费支出，以不超过当年销售(营业)收入30%为税前扣除限额的是( )。","opts":{"A":"啤酒制造企业","B":"卷烟生产企业","C":"化妆品制造企业","D":"医药零售企业"},"ans":"C","raw":"【解析】(1)选项ACD:对化妆品制造或销售、医药制造和饮料制造(不含酒类制造)企\n业发生的广告费和业务宣传费支出，不超过当年销售(营业)收入30%部分，准予扣除；\n超过部分，准予在以后纳税年度结转扣除。\n(2)选项B:烟草企业的烟草广告费和业务宣传费支出，一律不得在计算应纳税所得额时\n扣除。","block":"4-8","exam":"广宣费 30% 限额的适用行业","think":"30% 只给三类：<b>化妆品制造或销售、医药制造、饮料制造（不含酒类）</b>。化妆品制造 → C。啤酒制造属于酒类、卷烟制造的烟草广宣费一律不得扣、医药零售不在名单。","trap":"「医药制造」和「医药零售」一字之差；烟草是「一律不得扣除」，不是限额低一点。"},{"no":11,"type":"single","stem":"(母题)某上市公司2023年年初对100名高管授予股票期权，约定两年后每人可以8元/股的价格购买20000股公司股票，授予日股票收盘价为18元/股。该公司2023年计算应纳税所得额时，可以扣除的成本费用为( )万元。","opts":{"A":"3600","B":"1800","C":"1000","D":"0"},"ans":"D","raw":"【解析】对股权激励计划实行后，需待一定服务年限或者达到规定业绩条件方可行权的，\n上市公司等待期内会计上计算确认的相关成本费用，不得在对应年度计算缴纳企业所得\n税时扣除。所以该公司2023年可以扣除的成本费用为0。","block":"4-9","exam":"股权激励等待期的税会差异","think":"等待期会计按权责发生制摊了期权费用，但<b>没人行权、没有实际支出、金额随股价变</b>，税法一分不认 → 可扣 <b>0</b>，全额纳税调增。","trap":"授予日股价 18 元是干扰项，等待期用不上。"},{"no":12,"type":"single","stem":"(子题)补充上题条件为“2025年年初，100名高管全部行权。当日股票收盘价为26元/股。公司已代扣代缴股权激励个人所得税”。该公司2025年计算应纳税所得额时，可以扣除的成本费用为( )万元。","opts":{"A":"3600","B":"1800","C":"1000","D":"0"},"ans":"A","raw":"【解析】2025年该公司计算应纳税所得额时，可以扣除的成本费用=(实际行权时该股\n票的公允价格-激励对象实际行权支付价格)×行权数量=(26-8)×100×20000÷\n10000=3600(万元)。","block":"4-9","exam":"股权激励行权时可扣金额","think":"真正行权那天才有确定成本：<b>(行权日公允价 - 行权价) × 行权数量</b> = (26-8)×100×20000÷10000 = <b>3600 万</b>。","trap":"用行权日 26 元，不是授予日 18 元；已代扣个税不影响企税扣除。"},{"no":13,"type":"single","stem":"甲公司2025年1月1日用500万元购买乙公司发行的可转换债券，2025年12月6日甲公司将该可转换债券转为股票，发生相关税费2万元。甲公司转股时，将2025年应收未收利息5万元一并转为股票。则甲公司该股票的投资成本为( )万元。","opts":{"A":"500","B":"502","C":"505","D":"507"},"ans":"D","raw":"【解析】购买方企业可转换债券转换为股票时，将应收未收利息一并转为股票的，该应收\n未收利息即使会计上未确认收入，税收上也应当作为当期利息收入申报纳税；转换后以\n该债券购买价、应收未收利息和支付的相关税费为该股票投资成本。甲公司该股票的投\n资成本=500+2+5=507(万元)。","block":"4-5","exam":"可转债转股的股票计税基础","think":"应收未收利息一并转股的，税收上先确认利息收入，再把「购买价 + 利息 + 相关税费」一起作为股票投资成本：500+5+2 = <b>507 万</b>。","trap":"会计上没确认收入不影响税收确认；三项都要加，漏利息得 502、漏税费得 505。"},{"no":14,"type":"single","stem":"某公司2025年由核定征收改为查账征收，其核定征收期间购入一辆小汽车，已使用1年。该公司2025年计算应纳税所得额时对该设备计提折旧的最低年限为( )年。","opts":{"A":"2","B":"3","C":"4","D":"10"},"ans":"B","raw":"【解析】飞机、火车、轮船以外的运输工具，最低折旧年限为4年。企业核定征税期间投\n入使用的资产，改为查账征税后，按照税法规定的折旧、摊销年限，扣除该资产投入使\n用年限后，就剩余年限[4-1=3(年)]继续计提折旧、摊销额并在税前扣除。","block":"4-10","exam":"核定征收改查账征收后的折旧年限","think":"小汽车属于「飞机火车轮船以外的运输工具」，法定最低 <b>4 年</b>；核定期间已用 1 年，改查账后按剩余 4-1 = <b>3 年</b> 继续计提。","trap":"别把小汽车当「器具工具家具 5 年」或「电子设备 3 年」；也别直接答 4 年（要扣掉已使用年限）。"},{"no":15,"type":"single","stem":"依据企业所得税法相关规定，下列各项中可以计提折旧的生物资产是( ·)。","opts":{"A":"水源涵养林","B":"薪炭林","C":"用材林","D":"生长中的农田作物"},"ans":"B","raw":"【解析】生物资产分为消耗性生物资产(选项CD)、生产性生物资产(选项B)和公益性\n生物资产(选项A),其中生产性生物资产可以计提折旧并在税前扣除。","block":"4-11","exam":"可以计提折旧的生物资产","think":"只有<b>生产性生物资产</b>可在税前提折旧。薪炭林持续产出、属于生产性 → B。水源涵养林是公益性，用材林和生长中的农田作物是消耗性（等着卖，属存货）。","trap":"记住三分类：消耗性=存货、生产性=可折旧、公益性=不可折旧。"},{"no":16,"type":"single","stem":"下列税务处理中，符合企业所得税相关规定的是( )。","opts":{"A":"已足额提取折旧的固定资产的改建支出，按照固定资产预计尚可使用年限分期摊销","B":"其他应当作为长期待摊费用的支出，摊销年限不得低于5年","C":"存货的成本计算方法，可以使用后进先出法","D":"被投资企业发生的经营亏损，由投资企业按规定结转弥补"},"ans":"A","raw":"【解析】(1)选项B:其他应当作为长期待摊费用的支出，摊销年限不得低于3年。\n(2)选项C:存货的成本计算方法，不能使用后进先出法。\n(3)选项D:被投资企业发生的经营亏损，由被投资企业按规定结转弥补，不得由投资\n企业弥补。","block":"4-11","exam":"资产税务处理综合判断","think":"A 已足额提足折旧的固定资产改建支出，按<b>预计尚可使用年限</b>分期摊销 → 正确。B 其他长期待摊费用摊销年限不得低于 <b>3 年</b>（不是 5 年）；C 存货成本禁用后进先出法；D 被投资企业亏损由<b>被投资企业</b>自己结转，投资企业不得弥补。","trap":"3 年、后进先出、亏损归属，这三个数字/主体最爱被改。"},{"no":17,"type":"single","stem":"下列关于企业资产的税务处理，表述正确的是( )","opts":{"A":"对外投资期间，投资资产的成本在计算应纳税所得额时准予扣除","B":"转让投资资产时，投资资产的成本不再重复扣除","C":"购买文物用于收藏，在文物持有期间计提的折旧费用准予扣除","D":"以非货币性资产投资，应于投资协议生效并办理股权登记手续时确认非货币性资产转让收入的实现"},"ans":"D","raw":"【解析】(1)选项AB:企业对外投资期间，投资资产的成本在计算应纳税所得额时不得\n扣除，企业在转让或者处置投资资产时，投资资产的成本准予扣除。\n(2)选项C:企业购买的文物、艺术品用于收藏、展示、保值增值的，作为投资资产进行\n税务处理。文物、艺术品资产在持有期间，计提的折旧、摊销费用，不得税前扣除。","block":"4-5","exam":"投资资产的税务处理","think":"D 以非货币性资产投资，于<b>投资协议生效并办理股权登记手续</b>时确认转让收入实现 → 正确。对外投资期间成本<b>不得扣除</b>，转让处置时才准扣（A、B 都反了）；文物艺术品用于收藏展示按投资资产处理，持有期间折旧<b>不得扣</b>（C 错）。","trap":"「持有期间不扣、处置时才扣」是投资资产的核心，A 和 B 是把这句话拆成两个错误选项。"},{"no":18,"type":"single","stem":"(母题)甲公司2022年8月以1000万元直接投资于境内未上市乙公司，占有乙公司40%的股权。2025年12月将全部股权转让取得收入1800万元，并完成股权变更手续。转让时乙公司账面累计未分配利润1500万元，甲公司应确认股权转让的应纳税所得额是( )万元。","opts":{"A":"200","B":"600","C":"800","D":"1800"},"ans":"C","raw":"【解析】甲公司在计算股权转让所得时，不得扣除被投资企业未分配利润等股东留存收益\n中按该项股权所可能分配的金额，即本题中“乙公司账面累计未分配利润1500万元”属\n于干扰项；甲公司应确认股权转让的应纳税所得额=1800-1000=800(万元)。","block":"4-5","exam":"股权转让所得（母题）","think":"钱来自第三方股东，税法不让扣被投资企业留存收益中可分配部分 → 1800-1000 = <b>800 万</b>。账面累计未分配利润 1500 万是纯干扰项。","trap":"只有撤资/清算才切「股息所得」；转让一律不切。"},{"no":19,"type":"single","stem":"(子题)将上题条件“将全部股权转让取得收入1800万元，并完成股权变更手续。转让时乙公司账面累计未分配利润1500万元，”修改为“撤回全部投资分得银行存款1800万元，撤资时乙公司账面累计未分配利润1500万元”。甲公司应确认投资资产转让所得( )万元。","opts":{"A":"0","B":"200","C":"600","D":"800"},"ans":"B","raw":"【解析】投资企业从被投资企业撤回或减少投资，其取得的资产中，相当于初始出资的部\n分(1000万元),应确认为投资收回；相当于被投资企业累计未分配利润和累计盈余公积\n按减少实收资本比例计算的部分[1500×40%00(万元)],应确认为股息所得；其余\n部分确认为投资资产转让所得[1800-1000-600=200(万元)]。","block":"4-5","exam":"撤资的三层切分（子题）","think":"钱是被投资企业退的，分三层：先还本 1000；再切股息 1500×40% = 600（免税）；剩余为转让所得 1800-1000-600 = <b>200 万</b>。","trap":"母题改的只是「钱从谁手里来」，其余数字一个都别动；漏掉股息切分会得 800。"},{"no":20,"type":"single","stem":"甲公司于2025年10月合并乙公司，乙公司全部资产公允价值为7500万元、全部负债公允价值为5200万元、未超过弥补年限的亏损额为460万元。已知该合并业务符合企业重组特殊性税务处理的条件且选择此方法执行，截至当年年末国家发行的最长期限的国债年利率为6%甲公司2025年可以弥补的乙公司亏损为( )万元。","opts":{"A":"0","B":"138","C":"450","D":"460"},"ans":"B","raw":"【解析】可由合并企业弥补的被合并企业亏损的限额=被合并企业净资产公允价值×截\n至合并业务发生当年年末国家发行的最长期限的国债利率=(7500-5200)×6%38\n(万元)。","block":"4-12","exam":"特殊性重组下可弥补亏损的限额","think":"限额 = 被合并企业<b>净资产公允价值 × 合并当年年末最长期限国债利率</b> = (7500-5200)×6% = <b>138 万</b>，再与实际亏损 460 万取小 → 138。","trap":"用净资产（资产减负债），不是资产总额 7500；这是「限额内」弥补，不是全额带走。"},{"no":21,"type":"single","stem":"下列关于企业资产收购重组的一般性税务处理的表述中，正确的是( )。","opts":{"A":"被收购方暂不确认资产的转让所得或损失","B":"收购方取得资产的计税基础以被转让资产的原有计税基础确定","C":"收购方取得资产的计税基础应以原账面价值为基础确定","D":"被收购企业的相关所得税事项原则上保持不变"},"ans":"D","raw":"【解析】(1)选项A:被收购方应确认资产的转让所得或损失。\n(2)选项BC:收购方取得资产的计税基础应以公允价值为基础确定。","block":"4-12","exam":"资产收购的一般性税务处理","think":"一般性 = 按公允价值当场卖一遍：被收购方<b>确认</b>所得或损失，收购方按<b>公允价值</b>定计税基础；所以 A、B、C 都写反了。D「被收购企业相关所得税事项原则上保持不变」正确。","trap":"题目问的是<b>一般性</b>，整题都在拿特殊性规则当迷惑项。"},{"no":22,"type":"single","stem":"某公司2025年12月接受100%控股母公司按账面净值无偿划转的一台设备，该设备原值5000万元、公允价值为3500万元，已按税法规定计提折旧1200万元。该业务符合特殊性重组条件，该公司选择采用特殊性税务处理。该公司取得该设备的计税基础为( )万元。","opts":{"A":"1500","B":"3500","C":"3800","D":"5000"},"ans":"C","raw":"【解析】对100%直接控制的居民企业之间按账面净值划转股权或资产，符合特殊性重组\n条件的，划人方企业取得被划转股权或资产的计税基础，以被划转股权或资产的原账面\n净值[5000-1200=3800(万元)]确定。","block":"4-12","exam":"100% 直接控制企业间划转的计税基础","think":"特殊性处理下划入方计税基础按<b>原账面净值</b> = 5000-1200 = <b>3800 万</b>，双方均不确认所得。","trap":"公允价值 3500 是干扰项；账面原值 5000 也不对，要减掉已提折旧。"},{"no":23,"type":"single","stem":"基础设施领域不动产 这是防止把利润全压到境外的反避税规则。","trap":"10% 是「不低于」的下限，不是固定比例；前提是「未列明且无参照标准」。"},{"no":34,"type":"single","stem":"根据企业所得税的相关规定，下列关于源泉扣缴的表述正确的是( )。","opts":{"A":"扣缴义务人每次代扣的税款，应当自代扣之日起7日内缴入国库","B":"税款由扣缴义务人在合同约定的日期，从应支付的款项中扣缴","C":"适用税率为15%","D":"以税务机关为扣缴义务人"},"ans":"A","raw":"【解析】(1)选项B:税款由扣缴义务人在每次支付或者到期应支付时，从支付或者到期\n应支付的款项中扣缴。\n(2)选项C;适用税率一般为10%\n(3)选项D:以支付人为扣缴义务人。","block":"4-16","exam":"源泉扣缴的四要素","think":"A 正确：扣缴义务人自代扣之日起 <b>7 日内</b>缴入国库。B 错在时点，应在<b>每次支付或到期应支付</b>时扣；C 税率是 <b>10%</b> 不是 15%；D 扣缴义务人是<b>支付人</b>不是税务机关。","trap":"7 日、10%、支付人、每次支付——四个数字/主体一起记。"},{"no":35,"type":"single","stem":"某公司是经国务院批准的跨境电子商务综合试验区内的跨境电商企业，采用应税所得率方式核定征收企业所得税，2025年收入总额为1000万元。该公司2025年应纳税所得额为( )万元。","opts":{"A":"10","B":"30","C":"40","D":"50"},"ans":"C","raw":"【解析】综试区内核定征收的跨境电商企业应准确核算收入总额，并采用应税所得率方\n式核定征收企业所得税，应税所得率统一按照4%定。该公司2025年应纳税所得额=\n1000×4%0(万元)。","block":"4-16","exam":"跨境电商综试区核定应税所得率","think":"综试区内跨境电商企业采用应税所得率方式核定，统一按 <b>4%</b>：1000×4% = <b>40 万</b>。","trap":"4% 是统一口径，不要用一般核定的 15%，也别再乘 25%（题目问的是应纳税所得额，不是税额）。"},{"no":36,"type":"single","stem":"(母题)某公司2025年12月3日销售一批公允价值100万元(不含增值税，下同)的货物，因货物存在瑕疵，当月给予购货方10万元折让；12月15日采用商业折扣方式销售自产货物，该批货物公允价值1000万元，给予购货方50万元折扣。该公司当月应确认企业所得税收入( )万元。","opts":{"A":"1040","B":"1050","C":"1090","D":"1100"},"ans":"A","raw":"【解析】(1)企业已经确认销售收入的售出商品发生销售折让和销售退回，应当在发生当\n期冲减当期销售商品收入。\n(2)商品销售涉及商业折扣的，应当按照扣除商业折扣后的金额确定销售商品收入金额。\n(3)该公司当月应确认企业所得税收入=(100-10)+(1000-50)=1040(万元)。","block":"4-4","exam":"销售折让 + 商业折扣（母题）","think":"折让在发生当期冲减收入：100-10 = 90；商业折扣按扣除后金额：1000-50 = 950；合计 <b>1040 万</b>。","trap":"折让和折扣都减，但减的位置不同——一个冲当期、一个按净额确认。"},{"no":37,"type":"single","stem":"(子题)将上题条件“12月15日采用商业折扣方式销售自产货物”修改为“12月15日采用现金折扣方式销售自产货物”,其他条件不变。该公司当月应确认企业所得税收入( )万元。","opts":{"A":"1040","B":"1050","C":"1090","D":"1100"},"ans":"C","raw":"【解析】(1)销售商品涉及现金折扣的，应当按扣除现金折扣前的金额确定销售商品收入\n金额。\n(2)该公司当月应确认企业所得税收入=(100-10)+1000=1090(万元)。","block":"4-4","exam":"现金折扣不减收入（子题）","think":"现金折扣是提前付款的融资代价，收入按<b>扣除前</b>金额：1000。合计 (100-10)+1000 = <b>1090 万</b>。","trap":"与母题只差「商业→现金」四个字，答案从 1040 变 1090；别整题重算。"},{"no":38,"type":"single","stem":"(母题)居民企业甲公司2023年以自产产品投资境内乙公司，该产品的不含增值税公允价值200万元、账面成本140万元，会计上已确认转让所得60万元。甲公司选择将对外投资确认的非货币性资产转让所得分5年均匀计入相应年度的应纳税所得额，则其2024年计算企业所得税应纳税所得额时应( )。","opts":{"A":"纳税调减12万元","B":"纳税调增12万元","C":"纳税调增60万元","D":"纳税调减60万元"},"ans":"B","raw":"【解析】(1)居民企业以非货币性资产对外投资确认的非货币性资产转让所得，可在不超\n过5年期限内，分期均匀计入相应年度的应纳税所得额，按规定计算缴纳企业所得税。\n(2)会计口径上，2023年一次性确认转让所得60万元。税法口径上，甲公司选择5年分期递延纳税，每年确认所得12万元，2023年当年纳税调减=60-12=48(万元),剩余四\n年(2024—2027年)每年纳税调增12万元。","block":"4-9","exam":"非货币性资产投资 5 年递延的纳税调整","think":"会计 2023 年一次认 60 万，税法分 5 年每年认 12 万。2024 年会计 0、税法 12 → <b>纳税调增 12 万</b>。","trap":"问的是 <b>2024 年</b>，不是投资当年（当年是调减 48）；画两条时间轴就不会错符号。"},{"no":39,"type":"single","stem":"(子题)补充上题条件为“2025年甲公司收回上述投资”。则其2025年计算企业所得税应纳税所得额时应( )。","opts":{"A":"纳税调减12万元","B":"纳税调增12万元","C":"纳税调增36万元","D":"纳税调减48万元"},"ans":"C","raw":"【解析】企业在对外投资5年内转让股权或投资收回的，应停止执行递延纳税政策，并就\n递延期内尚未确认的(2025—2027年)非货币性资产转让所得[12×3=36(万元)],在\n转让股权或投资收回当年的企业所得税年度汇算清缴时，一次性计算缴纳企业所得税。","block":"4-9","exam":"5 年内收回投资停止递延（子题）","think":"2025 年收回 → 递延理由消失，剩余未确认年度 2025–2027 共 3 年，一次性确认 12×3 = <b>36 万</b>，纳税调增 36。","trap":"补的是「剩余未确认」部分，不是全额 60 万（那会选 C 之外的 48/60）。"},{"no":40,"type":"single","stem":"某企业购入政府发行的年利率为4.5%一年期国债1000万元，持有200天时以1030万元的不含税价格转让，该笔转让交易应缴纳企业所得税( )万元。","opts":{"A":"0","B":"7.5","C":"1.34","D":"1.8"},"ans":"C","raw":"【解析】(1)国债利息收入免税，国债转让收入纳税。\n(2)企业到期前转让国债，其持有期间尚未兑付的国债利息收入，免征企业所得税，免税\n利息收入=国债金额×(适用年利率÷365)×持有天数=1000×(4.5%365)×200=\n24.66(万元)。\n(3)该笔转让交易应纳企业所得税=(1030-1000-24.66)×25%.34(万元)。","block":"4-7","exam":"国债提前转让：先剥利息、再算价差","think":"① 免税的持有期应计利息 = 1000×4.5%÷365×200 = 24.66 万；② 应税转让所得 = 1030-1000-24.66 = 5.34 万；③ 税额 = 5.34×25% ≈ <b>1.34 万</b>。","trap":"直接 (1030-1000)×25% = 7.5 万（选项 B）是忘剥利息；兑付前转让才需要这一步。"},{"no":41,"type":"single","stem":"某企业2025年实际发生并支付给员工的合理的工资、薪金支出共计1200万元。另因接受外部劳务派遣用工，向劳务派遣公司支付费用50万元；直接向劳务派遣的员工支付费用80万元，其中属于福利费性质的支出为10万元。该企业2025年可以在企业所得税前扣除的职工福利费的限额为( )万元。","opts":{"A":"168","B":"177.8","C":"184.8","D":"186.2"},"ans":"B","raw":"【解析】(1)企业接受外部劳务派遣用工所实际发生的费用，应分两种情况按规定在税前\n扣除：\n①按照协议(合同)约定直接支付给劳务派遣公司的费用(50万元),应作为劳务费支出。\n②直接支付给员工个人的费用，应分别计入工资薪金支出[80-10=70(万元)]和职工福\n利费支出(10万元),其中属于工资薪金支出的70万元准予计入企业工资薪金总额，作\n为计算其他各项相关费用扣除的依据。\n(2)该企业2025年计入工资、薪金支出的金额=1200+70=1270(万元),可以在企业所\n得税前扣除的职工福利费的限额=1270×14%77.8(万元)。","block":"4-8","exam":"劳务派遣用工下的职工福利费限额基数","think":"付给<b>派遣公司</b>的 50 万是劳务费、不进工资总额；直接发给员工的 80 万里，扣掉福利费性质 10 万，剩余 <b>70 万</b> 计入工资薪金。基数 = 1200+70 = 1270，限额 = 1270×14% = <b>177.8 万</b>。","trap":"把 50 万或 80 万整笔塞进基数都会错；福利费性质的那 10 万本身不进工资基数。"},{"no":42,"type":"single","stem":"甲设备制造公司2025年年初向关联企业乙公司(非金融企业)借款3000万元用于日常经营，支付全年借款利息200万元。已知金融机构同期同类贷款年利率为6该交易不符合独立交易原则。乙公司对甲公司的权益性投资额为1000万元，且实际税负低于甲公司。甲公司计算2025年企业所得税时可以扣除利息( )万元。","opts":{"A":"200","B":"180","C":"120","D":"133"},"ans":"C","raw":"【解析】企业从其关联方接受的债权性投资与权益性投资的比例超过规定标准(非金融企\n业为2:1)而发生的利息支出，不得在计算应纳税所得额时扣除。权益性投资额的2倍=\n1000×2=2000(万元)<3000万元，甲公司计算2025年企业所得税时可以扣除利息=\n2000×6%20(万元)。\n43.(","block":"4-17","exam":"关联方借款利息的双限额","think":"非金融企业关联方债资比 <b>2:1</b>：1000×2 = 2000 万 < 借款 3000 万，取 2000；可扣利息 = 2000×6% = <b>120 万</b>。","trap":"先「权益×2 与本金取小」再乘利率；实际税负低于借方、不符合独立交易原则都是提示要用反避税规则。"},{"no":43,"type":"single","stem":"某公司2025年取得销售货物收入4000万元、出租闲置设备收入300万元、接受捐赠收入100万元；当年该公司将自产货物对外捐赠，该批货物账面成本100万元、不含增值税市场价格180万元；当年发生业务招待费80万元。该公司计算2025年企业所得税时可以扣除业务招待费( )万元。","opts":{"A":"21.5","B":"22.4","C":"22.5","D":"48"},"ans":"B","raw":"业务招待费：按发生额60%与销售(营业)收入5‰孰低。销售(营业)收入=4000+300+180(视同销售)=4480，接受捐赠收入不计入基数。80×60%=48 > 4480×5‰=22.4，准予扣除22.4万元。","block":"4-8","exam":"业务招待费双限额 + 销售收入基数","think":"销售(营业)收入 = 4000（主营）+ 300（其他业务）+ <b>180（视同销售）</b> = 4480；接受捐赠 100 是营业外收入，<b>不入基数</b>。限额1 = 80×60% = 48，限额2 = 4480×5‰ = 22.4，孰低取 <b>22.4 万</b>。","trap":"两处设套：视同销售要加、捐赠收入不加；只算 48 会选 D。"},{"no":44,"type":"single","stem":"某公司为增值税一般纳税人，2025年实现会计利润1200万元。当年将一批自产货物通过市政府捐赠给贫困地区，营业外支出中列支118.2万元，该批货物不含增值税市场价格为140万元、账面成本为100万元，该公司计算2025年企业所得税时可以扣除捐赠支出( )万元。","opts":{"A":"113","B":"118.2","C":"144","D":"158.2"},"ans":"C","raw":"公益性捐赠：税法口径捐赠支出=140+140×13%=158.2万元，限额=会计利润1200×12%=144万元，准予扣除144万元。","block":"4-8","exam":"公益性捐赠限额与视同销售的销项税","think":"税法口径捐赠支出 = 140（公 )万元。","opts":{"A":"445","B":"450","C":"450.5","D":"455"},"ans":"A","raw":"软件企业职工培训费50万元可全额扣除；职工教育经费限额=2100×8%=168万元>待扣除140万元，纳税调减上年结转20万元，应纳税额=(1800-20)×25%=445万元。","block":"4-8","exam":"软件企业职工培训费与教育经费结转","think":"职工培训费 50 万<b>全额扣除</b>；剩余待扣 = 170-50+上年结转 20 = 140 < 限额 2100×8% = 168，可全额扣，故纳税调减上年结转的 20 万；应纳 = (1800-20)×25% = <b>445 万</b>。","trap":"先剔培训费再算 8% 限额；上年结转在本年扣完要做<b>纳税调减</b>。"},{"no":55,"type":"single","stem":"下列关于境外投资者以分配利润直接投资企业所得税税收抵免政策的规定中，表述正确的是( )。","opts":{"A":"境外投资者以分得利润进行境内直接投资，包括收购上市公司股份","B":"符合条件的可按投资额10%免当年应纳税额，当年不足抵免准予结转","C":"境外投资者再投资不满5年收回投资的，需补缴递延税款，无须调整抵免额度","D":"用于再投资的现金利润，可先在其他账户周转后再转入被投资企业账户"},"ans":"B","raw":"【解析】(1)选项A:境外投资者以分得利润进行的境内直接投资，包括境外投资者以分\n得利润进行的增资、新建、股权收购等权益性投资，但不包括新增、转增、收购上市公\n司股份(符合条件的战略投资除外)。\n(2)选项C:境外投资者在投资不满5年(60个月)时收回享受税收抵免政策的全部或\n部分直接投资的，除按规定补缴递延的税款外，还应按比例减少可享受的税收抵免额度。\n(3)选项D:境外投资者用于境内直接投资的利润以现金形式支付的，相关款项从利润\n分配企业的账户直接转人被投资企业或股权转让方账户，在直接投资前不得在境内外其\n他账户周转。","block":"4-13","exam":"境外投资者以分配利润直接投资的税收抵免","think":"B 正确：符合条件的按<b>投资额 10% 抵免当年应纳税额</b>，不足可结转。A 收购上市公司股份原则上不属于合格直接投资；C 不满 5 年收回除补缴递延税款外，还要<b>按比例减少抵免额度</b>；D 现金利润必须从利润分配企业账户<b>直接转入</b>，不得在其他账户周转。","trap":"10% 抵的是税额；「无须调整抵免额度」「可先周转」都是把规则说反。"},{"no":56,"type":"single","stem":"下列关于互联网平台企业为从业人员支付劳务报酬企业所得税税前扣除说法中，正确的是( )。","opts":{"A":"互联网平台企业完成个人所得税扣缴申报及税款缴纳后，可凭相关完税凭证税前限额扣除劳务报酬","B":"互联网平台企业需同时办理个人所得税扣缴申报、增值税及附加税费代办申报并完成税款缴纳，且按规定留存业务真实性资料，可在税前据实扣除劳务报酬","C":"互联网平台企业未按规定保存实名核验记录、业务交易明细等资料，仍可凭相关完税凭证税前扣除劳务报酬","D":"互联网平台企业支付的劳务报酬，可直接以内部付款凭证作为企业所得税税前扣除的合法凭证"},"ans":"B","raw":"【解析】(1)选项ABD:互联网平台企业已为从业人员同时办理个人所得税扣缴申报、增\n值税及附加税费代办申报，且已完成税费缴纳的，可凭个人所得税扣缴申报表、个人所\n得税完税凭证、互联网平台企业代办申报表、增值税及附加税费完税凭证作为扣除凭证，\n在企业所得税税前据实扣除向从业人员支付的劳务报酬。\n(2)选项C:互联网平台企业未按规定保存能够证明业务真实性材料的，其办理扣缴申报、\n代办申报取得的相关凭证不得作为企业所得税税前扣除凭证。","block":"4-20","exam":"互联网平台企业劳务报酬的扣除凭证（2026 新增）","think":"必须<b>同时</b>完成个税扣缴申报、增值税及附加税费代办申报并缴款，且留存实名核验、业务交易明细等真实性资料，才能据实扣除 → B。只办个税（A）、未留存资料（C）、用内部付款凭证（D）都不行。","trap":"关键词是「<b>同时</b>」和「<b>据实扣除</b>」——不是限额扣除，也不是凭完税凭证就能扣。"},{"no":1,"type":"multi","stem":"(非标准题)下列关于所得来源地确定方法的表述中，符合企业所得税法规定的有( )。","opts":{"A":"股权转让所得按照转出方所在地确定","B":"提供劳务所得按照劳务发生地确定","C":"特许权使用费所得按照收取特许权使用费的企业所在地确定","D":"动产转让所得按照转让动产的企业所在地确定","E":"销售货物所得按照交易活动发生地确定","F":"不动产转让所得按照转让不动产的企业所在地确定","G":"股息、红利等权益性投资所得按照投资企业所在地确定","H":"利息所得按照取得所得的企业所在地确定"},"ans":"BDE","raw":"所得来源地：销售货物按交易活动发生地、劳务按劳务发生地、动产转让按转让方企业所在地、不动产按不动产所在地、权益性投资资产转让按被投资企业所在地、股息红利按分配所得企业所在地、利息租金特许权使用费按负担或支付方所在地。","block":"4-1","exam":"所得来源地确定（8 选项非标准题）","think":"对的是 <b>BDE</b>：劳务按<b>劳务发生地</b>、动产转让按<b>转让动产的企业所在地</b>、销售货物按<b>交易活动发生地</b>。错在：A 权益性投资资产转让按<b>被投资企业</b>所在地，不是转出方；C 特许权费按<b>负担/支付方</b>所在地，不是收取方；F 不动产按<b>不动产所在地</b>；G 股息红利按<b>分配所得的企业</b>所在地；H 利息按<b>负担/支付方</b>所在地。","trap":"这一组有个统一规律：<b>钱从哪儿来/谁付的</b>决定来源地，不是谁收钱。A、C、G、H 全是把「收钱方」写成了「付钱方」。"},{"no":2,"type":"multi","stem":"下列关于境内居民企业股息、红利等权益性投资收益的表述中，符合企业所得税法规定的有( )。","opts":{"A":"除另有规定外，按照被投资方作出利润分配决定的日期确认收入的实现","B":"通过沪港通投资香港联交所上市股票取得的股息、红利所得，计入收入总额","C":"通过沪港通连续持有H股满12个月取得的股息、红利所得，免征企业所得税","D":"被投资企业将股权(票)溢价所形成的资本公积转为股本的，作为投资方企业的股息、红利收入"},"ans":"ABC","raw":"【解析】选项D:被投资企业将股权(票)溢价所形成的资本公积转为股本的，不作为投\n资方企业的股息、红利收入，投资方企业也不得增加该项长期投资的计税基础。","block":"4-6","exam":"股息红利等权益性投资收益","think":"<b>ABC</b>：按被投资方作出利润分配决定日确认；沪港通投资 H 股股息要计入收入总额；连续持有 H 股满 <b>12 个月</b>的股息免征企税。D 错：股权溢价形成的资本公积转增股本，<b>不作为</b>投资方股息红利收入，也不得增加长期投资计税基础。","trap":"「计入收入总额」和「免税」不矛盾——先计入、再作纳税调减；D 是纯干扰项。"},{"no":3,"type":"multi","stem":"(非标准题)下列关于企业销售收入确认的税务处理中，符合企业所得税法规定的有( )","opts":{"A":"销售商品采用托收承付方式的，在办妥托收手续时确认收入","B":"销售商品采取预收款方式的，在收到预收款时确认收入","C":"销售商品采用支付手续费方式委托代销的，在收到代销清单时确认收入","D":"销售商品采用分期收款方式的，在收到全部货款时确认收入","E":"销售商品涉及现金折扣的，应当按扣除现金折扣前的金额确定销售商品收入金额","F":"销售商品采用以旧换新方式的，按实际收到的金额确定销售商品收入金额","G":"采用售后回购方式销售商品的，按售价减回购价后的金额确定销售商品收入金额","H":"包含在商品售价内可区分的服务费，在收取时确认收入"},"ans":"ACE","raw":"【解析】(1)选项B:销售商品采取预收款方式的，在发出商品时确认收入。\n(2)选项D:销售商品采用分期收款方式的，按照合同约定的收款日期确认收入。\n(3)选项F:销售商品以旧换新的，销售的商品应当按照销售商品收入确认条件确认收入，\n回收的商品作为购进商品处理。\n(4)选项G:采用售后回购方式销售商品的，销售的商品按售价确认收入，回购的商品\n作为购进商品处理，另有规定的除外。\n(5)选项H:包含在商品售价内可区分的服务费，在提供服务的期间分期确认收入。","block":"4-2","exam":"销售货物收入确认（8 选项非标准题）","think":"对的是 <b>ACE</b>：托收承付在<b>办妥托收手续</b>时、支付手续费委托代销在<b>收到代销清单</b>时、现金折扣按<b>扣除前</b>金额。错在：B 预收款在<b>发出商品</b>时；D 分期收款按<b>合同约定收款日</b>；F 以旧换新按正常售价确认收入、回收商品作购进；G 售后回购按<b>售价</b>确认、回购作购进；H 售价内可区分的服务费在<b>服务期间分期</b>确认。","trap":"把「什么时候认」和「认多少」分开看：B、D 错时点，F、G、H 错金额。"},{"no":4,"type":"multi","stem":"企业提供下列劳务取得的收入中，应按照完工进度确认收入实现的有( )。","opts":{"A":"单独收取的安装费","B":"为特定客户开发软件的收费","C":"宣传媒介的收费","D":"属于提供初始及后续服务的特许权费"},"ans":"AB","raw":"【解析】(1)选项C:宣传媒介的收费，应在相关的广告或商业行为出现于公众面前时确\n认收入。\n(2)选项D:属于提供设备和其他有形资产的特许权费，在交付资产或转移资产所有权\n时确认收入；属于提供初始及后续服务的特许权费，在提供服务时确认收入。","block":"4-2","exam":"按完工进度确认收入的劳务","think":"<b>AB</b>：单独收取的安装费按安装完工进度；为特定客户开发软件按开发完工进度。C 宣传媒介收费在广告<b>公之于众</b>时确认（广告制作费才按完工进度）；D 提供初始及后续服务的特许权费在<b>提供服务时</b>确认，不是完工进度。","trap":"宣传媒介收费 vs 广告制作费，一字之差、两个时点。"},{"no":5,"type":"multi","stem":"符合规定条件的永续债，可以按照债券利息适用企业所得税政策。下列各项中，属于规定条件的有( )。","opts":{"A":"该项投资不承担被投资企业股东同等的经营风险","B":"被投资企业将该项投资计入负债","C":"被投资企业不可以赎回","D":"投资方不参与被投资企业日常生产经营活动"},"ans":"ABD","raw":"【解析】符合规定条件的永续债，可以按照债券利息适用企业所得税政策，符合规定条件\n是指符合下列条件中5条(含)以上：\n(1)被投资企业对该项投资具有还本义务。\n(2)有明确约定的利率和付息频率。\n(3)有一定的投资期限。\n(4)投资方对被投资企业净资产不拥有所有权。\n(5)投资方不参与被投资企业日常生产经营活动(选项D)。\n(6)被投资企业可以赎回，或满足特定条件后可以赎回(选项C不正确)。\n(7)被投资企业将该项投资计入负债(选项B)。\n(8)该项投资不承担被投资企业股东同等的经营风险(选项A)。\n(9)该项投资的清偿顺序位于被投资企业股东持有的股份之前。","block":"4-5","exam":"永续债可按债券利息处理的条件","think":"<b>ABD</b>：不承担股东同等经营风险、被投资企业计入负债、投资方不参与日常经营，都符合「9 条里满足 5 条以上」。C 错：条件写的是「被投资企业<b>可以</b>赎回，或满足特定条件后可以赎回」，选项写成「不可以赎回」正好说反。","trap":"其余六条里还有：有还本义务、明确利率与付息频率、有投资期限、投资方对净资产无所有权、清偿顺序先于股东。"},{"no":6,"type":"multi","stem":"下列关于永续债的企业所得税处理中，表述正确的有( )。","opts":{"A":"企业发行的永续债均按照债券利息适用企业所得税政策","B":"企业发行的永续债均适用股息、红利政策，符合免税条件的，享受免税政策","C":"发行永续债的企业对每一永续债产品的税收处理方法一经确定，不得变更","D":"企业对永续债采取的税收处理办法可以与会计核算方式不一致"},"ans":"CD","raw":"【解析】(1)选项AB:企业发行的永续债，可以适用股息、红利企业所得税政策；符合\n规定条件的，也可以按照债券利息适用企业所得税政策。\n(2)选项D:企业对永续债采取的税收处理办法与会计核算方式不一致的，发行方、投\n资方在进行税收处理时须作出相应纳税调整。","block":"4-5","exam":"永续债税务处理的方法选择与变更","think":"<b>CD</b>：税收处理方法<b>一经确定不得变更</b>；与会计核算方式<b>可以不一致</b>，但发行方、投资方须作相应纳税调整。A、B 都用了「均」——永续债既可适用股息红利政策，符合 9 条中 5 条以上也可按债券利息处理，不是一律某一类。","trap":"看到「均」「一律」先警惕，这类绝对化表述在永续债题里必错。"},{"no":7,"type":"multi","stem":"下列关于企业收入的表述中，符合企业所得税法规定的有( )。","opts":{"A":"将资产用于捐赠，按照被移送资产的账面价值确定销售收入","B":"因持有铁路债券取得的利息收入，减半征收企业所得税","C":"租金收入按照合同约定的承租人应付租金的日期确认收入的实现","D":"利息收入按照实际收到利息的日期确认收入的实现"},"ans":"BC","raw":"【解析】(1)选项A:企业将资产用于捐赠，因资产所有权属巳发生改变，应视同销售确\n认收入，除另有规定外，应按照被移送资产的公允价值确定销售收入。\n(2)选项D:利息收入，按照合同约定的债务人应付利息的日期确认收入的实现。","block":"4-2","exam":"收入确认的综合判断","think":"<b>BC</b>：铁路债券利息<b>减半征收</b>（不是免税，但表述为「减半征收」正确）；租金按合同约定应付租金日确认。A 错：将资产用于捐赠所有权已变，应按<b>公允价值</b>确定视同销售收入，不是账面价值。D 错：利息收入按<b>合同约定应付利息日</b>，不是实际收到日。","trap":"A 改了计量属性、D 改了确认时点，两个都是把「税法要确定性」这条线抹掉。"},{"no":8,"type":"multi","stem":"符合条件的非营利组织的下列收入，免征企业所得税的有( )。","opts":{"A":"接受其他单位捐赠的收入","B":"因政府购买服务取得的收入","C":"按照市级民政、财政部门规定收取的会费","D":"不征税收入孳生的银行存款利息收入"},"ans":"AD","raw":"【解析】非营利组织的下列收入为免税收入：\n(1)接受其他单位或者个人捐赠的收入(选项A)。\n(2)除《企业所得税法》第七条规定的财政拨款以外的其他政府补助收入，但不包括因\n政府购买服务取得的收入(选项B不正确)。\n(3)按照省级以上民政、财政部门规定收取的会费(选项C不正确)。\n(4)不征税收入和免税收入孳生的银行存款利息收入(选项D)。\n(5)财政部、国家税务总局规定的其他收入。","block":"4-6","exam":"非营利组织免税收入范围","think":"<b>AD</b>：接受其他单位捐赠的收入、不征税收入和免税收入孳生的银行存款利息 → 免税。B 错：<b>因政府购买服务</b>取得的收入是等价交易，不属于免税范围。C 错：必须是<b>省级以上</b>民政、财政部门规定收取的会费，市级不行。","trap":"「政府购买服务」和「市级」是这一题两个专门的设错词。"},{"no":9,"type":"multi","stem":"(非标准题)企业发生的下列税金，在发生当期计入相关资产的成本，在以后各期分摊扣除的有( )。","opts":{"A":"消费税","B":"车船税","C":"契税","D":"车辆购置税","E":"企业所得税","F":"环境保护税","G":"耕地占用税"},"ans":"CDG","raw":"计入资产成本、以后各期分摊扣除的税金：契税、车辆购置税、耕地占用税、进口关税、不得抵扣的增值税。消费税、车船税、房产税等计入税金及附加当期扣除；企业所得税与可抵扣增值税不得扣除。","block":"4-11","exam":"计入资产成本、以后分摊扣除的税金（7 选项）","think":"<b>CDG</b>：契税、车辆购置税、耕地占用税（以及进口关税、不得抵扣的增值税）计入资产成本分期扣。ABF 消费税、车船税、环境保护税计入<b>税金及附加当期扣除</b>；E 企业所得税本身<b>永远不得扣除</b>。","trap":"判断标准是「这笔税是不是为取得资产而付」——取得环节的一次性税才资本化，持有/经营环节的税当期扣。"},{"no":10,"type":"multi","stem":"企业发生的下列保险费中，准予据实在税前扣除的有( )","opts":{"A":"为特殊工种职工支付的人身安全保险费","B":"为投资者支付的补充养老保险费","C":"企业依规定范围和标准为职工缴纳的基本养老保险费","D":"为投资者支付的家庭财产保险费"},"ans":"AC","raw":"【解析】(1)选项B:企业为投资者或职工支付的补充养老保险费、补充医疗保险费，在\n国务院财政、税务主管部门规定的范围和标准内，准予扣除。\n(2)选项D:不得扣除。","block":"4-8","exam":"保险费据实扣除的边界","think":"<b>AC</b>：为<b>特殊工种</b>职工支付的人身安全保险费、依规定范围标准为职工缴纳的基本养老保险费可据实扣。B 错：为投资者或职工支付的<b>补充</b>养老/医疗保险费要在规定范围和标准内扣，不是据实；D 为投资者支付的家庭财产保险费与经营无关，不得扣。","trap":"「据实」和「限额」要分开：基本险据实、补充险限额、商业/家庭险不扣。"},{"no":11,"type":"multi","stem":"企业因下列行为发生的借款费用，可在发生当期扣除的有( )。","opts":{"A":"企业为建造固定资产发生借款的，该固定资产建造期间发生的合理借款费用","B":"企业为购置无形资产发生借款的，该无形资产交付使用后发生的合理借款利息","C":"企业为经过14个月的建造才达到预定可销售状态的存货发生借款的，该存货建造期间发生的合理借款费用","D":"企业为日常经营发生的合理的不需要资本化的借款费用"},"ans":"BD","raw":"【解析】(1)选项ABC:企业为购置、建造固定资产、无形资产和经过12个月以上的建\n造才能达到预定可销售状态的存货发生借款的，在有关资产购置、建造期间发生的合理\n的借款费用，应当作为资本性支出计入有关资产的成本；有关资产交付使用后发生的借\n款利息，可在发生当期扣除。\n(2)选项D:在发生当期扣除。","block":"4-17","exam":"借款费用资本化 vs 当期扣除","think":"<b>BD</b>：购置无形资产<b>交付使用后</b>发生的利息、日常经营不需资本化的借款费用，当期扣。A 错：建造固定资产<b>期间</b>的借款费用要资本化进成本。C 错：经过 <b>14 个月</b>（超过 12 个月）建造才达到可销售状态的存货，建造期间借款费用<b>也要资本化</b>。","trap":"资本化门槛是「12 个月以上」，14 个月故意写给你看；关键是「建造期间」还是「交付使用后」。"},{"no":12,"type":"multi","stem":"金融企业提取的下列贷款损失准备金，不得税前扣除的有( )。","opts":{"A":"代理贷款","B":"同业拆出","C":"质押贷款","D":"委托贷款"},"ans":"AD","raw":"【解析】金融企业的委托贷款、代理贷款、国债投资、应收股利、上交央行准备金以及金\n融企业剥离的债权和股权、应收财政贴息、央行款项等不承担风险和损失的资产，不得\n提取贷款损失准备金在税前扣除。","block":"4-17","exam":"金融企业不得提取贷款损失准备金的资产","think":"<b>AD</b>：代理贷款、委托贷款属于<b>不承担风险和损失</b>的资产，不得提取准备金税前扣除。B 同业拆出、C 质押贷款都是承担风险的贷款类资产，准予按年末余额 1% 计提。","trap":"口诀：只要银行自己是「过手」或「不承担风险」的（委托、代理、国债投资、应收股利、上交央行准备金、剥离的债权股权、应收财政贴息），一律不得提。"},{"no":13,"type":"multi","stem":"(非标准题)企业发生的下列支出中，在计算企业所得税应纳税所得额时准予扣除的有( )。","opts":{"A":"企业之间支付的管理费","B":"被没收财物的损失","C":"诉讼费","D":"向投资者支付的股息","E":"烟草企业的烟草广告费和业务宣传费支出","F":"企业为投资者支付的商业保险费","G":"银行企业内营业机构之间支付的利息"},"ans":"CG","raw":"【解析】(1)选项ABDEF:不得税前扣除。\n(2)选项C:诉讼费不属于行政或刑事处罚，可以在计算企业所得税应纳税所得额时扣除。\n(3)选项G:银行企业内营业机构之间支付的利息，可以扣除；非银行企业内营业机构\n之间支付利息，不得扣除。","block":"4-20","exam":"准予税前扣除的支出（7 选项）","think":"<b>CG</b>：诉讼费不属于行政或刑事处罚，可扣；<b>银行</b>企业内营业机构之间支付的利息可扣。ABDEF 全不得扣：企业之间支付的管理费、被没收财物的损失、向投资者支付的股息、<b>烟草企业</b>的烟草广宣费、为投资者支付的商业保险费。","trap":"G 特意写「银行企业」——换成「非银行企业」就不得扣，这是同一份表里最刁的一组对照。"},{"no":14,"type":"multi","stem":"(非标准题)企业发生的下列支出中，不得税前扣除的有( )。","opts":{"A":"违约金","B":"银行罚息","C":"税收滞纳金","D":"非广告性质赞助支出","E":"为发行权益性证券支付给有关证券承销机构的手续费及佣金","F":"以现金等非转账方式支付给某中介个人的手续费及佣金","G":"金融企业的同业拆借利息支出","H":"按照有关规定预提的维简费"},"ans":"CDEH","raw":"【解析】(1)选项AB:准予据实税前扣除。\n(2)选项E:企业为发行权益性证券支付的手续费及佣金支出属于资本性支出，需冲减资\n本公积(股本溢价),而非计入当期损益，因此不能税前扣除。\n(3)选项F:除委托个人代理外，企业以现金等非转账方式支付的手续费及佣金不得在税\n前扣除。\n(4)选项G:非金融企业向金融企业借款的利息支出、金融企业的各项存款利息支出、\n金融企业的同业拆借利息支出、企业经批准发行债券的利息支出按实际发生额据实扣除。\n(5)选项H:企业实际发生的维简费支出，划分资本性支出和收益性支出；属于收益性\n支出的，可作为当期费用税前扣除；属于资本性支出的，应计入有关资产成本，并按规\n定计提折旧或摊销在税前扣除。预提的维简费，不得在当期税前扣除。","block":"4-20","exam":"不得税前扣除的支出（8 选项非标准题）","think":"<b>CDEH</b>：税收滞纳金、非广告性质赞助支出、发行权益性证券的手续费佣金（资本性支出、冲减资本公积）、<b>预提</b>的维简费不得扣。A 违约金、B 银行罚息<b>可以据实扣</b>；F 现金等非转账方式付给<b>中介个人</b>的手续费——「除委托个人代理外」才禁止，本题是个人代理故可扣；G 金融企业同业拆借利息据实扣。","trap":"AB 是「看似罚款其实能扣」的经典反转；F 的例外别漏；H 只有「实际发生且属收益性支出」的维简费才可扣，预提的不行。"},{"no":15,"type":"multi","stem":"下列企业中，尚未弥补完的亏损最长结转年限为10年的有( )。","opts":{"A":"高新技术企业","B":"科技型中小企业","C":"技术先进型服务企业","D":"西部地区鼓励类企业"},"ans":"AB","raw":"【解析】当年具备高新技术企业或科技型中小企业资格的企业，其具备资格年度之前5\n个年度发生的尚未弥补完的亏损，准予结转以后年度弥补，最长结转年限由5年延长至\n10年。\n项目\n具体规定\n(1)贷款(含抵押、质押、保证、信用等贷款)\n(2)银行卡透支、贴现、信用垫款(含银行承兑汇票垫款、信用证垫款、\n准予税前提取担保垫款等)、进出口押汇、同业拆出、应收融资租赁款等具有贷款特\n贷款损失准备\n征的风险资产\n金的范围\n(3)由金融企业转贷并承担对外还款责任的国外贷款，包括国际金融\n组织贷款、外国买方信贷、外国政府贷款、日本国际协力银行不附条\n件贷款和外国政府混合贷款等资产\n不得税前提取金融企业的委托贷款、代理贷款、国债投资、应收股利、上交央行准\n贷款损失准备备金以及金融企业剥离的债权和股权、应收财政贴息、央行款项等不\n金的范围\n承担风险和损失的资产\n金融企业准予当年税前扣除的贷款损失准备金=本年末准予提取货款\n计算公式\n损失准备金的贷款资产余额×1%%至上年末已在税前扣除的货款损\n失准备金的余额\n扣除顺序\n金融企业发生的符合条件的贷款损失，应先冲减已在税前扣除的贷款\n损失准备金，不足冲减部分可据实在计算当年应纳税所得额时扣除","block":"4-18","exam":"亏损结转 10 年的适用主体","think":"<b>AB</b>：当年具备<b>高新技术企业</b>或<b>科技型中小企业</b>资格的企业，资格年度之前 5 个年度尚未弥补完的亏损，结转年限由 5 年延长至 10 年。C 技术先进型服务企业、D 西部地区鼓励类企业享受的是 <b>15% 税率</b>，不是延长亏损结转期。","trap":"把「15% 身份优惠」和「10 年亏损结转」分开：科技型中小企业是后者，也不是 15% 税率。"},{"no":16,"type":"multi","stem":"企业在境内发生的支出项目属于增值税应税项目的，对方为已办理税务登记的增值税纳税人，企业可以作为税前扣除凭证的有( )。","opts":{"A":"内部凭证","B":"收款凭证","C":"对方开具的增值税普通发票","D":"税务机关代开的增值税专用发票"},"ans":"CD","raw":"【解析】企业在境内发生的支出项目属于增值税应税项目的，对方为已办理税务登记的增\n值税纳税人，其支出以发票(包括按照规定由税务机关代开的发票)作为税前扣除凭证；\n对方为依法无须办理税务登记的单位或者从事小额零星经营业务的个人，其支出以税务\n机关代开的发票或者收款凭证及内部凭证作为税前扣除凭证。","block":"4-19","exam":"增值税应税项目的税前扣除凭证","think":"<b>CD</b>：对方是<b>已办理税务登记的增值税纳税人</b>，必须凭<b>发票</b>扣除——对方开具的增值税普通发票、税务机关代开的增值税专用发票都算。A 内部凭证、B 收款凭证只适用于「依法无须办理税务登记的单位」或「小额零星经营业务的个人」。","trap":"先看「对方是谁」再定凭证类型；题里明确说已办理税务登记，就只能用发票。"},{"no":17,"type":"multi","stem":"企业因对方注销、撤销、依法被吊销营业执照、被税务机关认定为非正常户等特殊原因无法补开、换开发票、其他外部凭证的，可凭有关资料证实支出真实性后，其支出允许税前扣除，其中为必备资料的有( )。","opts":{"A":"无法补开、换开发票、其他外部凭证原因的证明资料","B":"相关业务活动的合同或者协议","C":"采用非现金方式支付的付款凭证","D":"货物入库、出库内部凭证"},"ans":"ABC","raw":"【解析】企业在补开、换开发票、其他外部凭证过程中，因对方注销、撤销、依法被吊销\n营业执照、被税务机关认定为非正常户等特殊原因无法补开、换开发票、其他外部凭证的，\n可凭以下资料证实支出真实性后，其支出允许税前扣除：\n(1)无法补开、换开发票、其他外部凭证原因的证明资料(包括工商注销、机构撤销、\n列入非正常经营户、破产公告等证明资料)(选项A)。\n(2)相关业务活动的合同或者协议(选项B)。\n(3)采用非现金方式支付的付款凭证(选项C)。\n(4)货物运输的证明资料。\n(5)货物入库、出库内部凭证(选项D)。\n(6)企业会计核算记录以及其他资料。\n其中，第(1)至(3)项为必备资料。","block":"4-19","exam":"无法补开发票时的必备资料","think":"<b>ABC</b>：① 无法补开/换开原因的证明资料 ② 相关业务活动的合同或协议 ③ 采用<b>非现金</b>方式支付的付款凭证，这三项是<b>必备</b>。D 货物入库出库内部凭证属于六项资料之一，但<b>不是必备</b>（另还有运输证明、会计核算记录）。","trap":"现金付款无法第三方验证，所以非现金凭证被列为必备；D 是最像必备的干扰项。"},{"no":18,"type":"multi","stem":"下列固定资产，不得计提折旧在税前扣除的有( )","opts":{"A":"经营租入的小汽车","B":"融资租人的设备","C":"未投入使用的厂房","D":"已足额提取折旧仍继续使用的办公楼"},"ans":"AD","raw":"【解析】下列固定资产不得计算折旧扣除：\n境内/境外\n是否为增值\n税应税项目\n交易对方\n税前扣除凭证\n已办理税务登记的增值税纳\n税人\n发票\n√\n依法无须办理税务登记的单位\n税务机关代开的发票或收款\n从事小额零星经营业务的个人\n凭证及内部凭证\n境内发生\n(1)能取得发票的：发票\n支出项目\n单位\n(2)不能取得发票的：发票\n以外的其他外部凭证(财政\n×\n票据、收款凭证、分割单等)\n(1)能取得发票的：发票\n个人\n(2)不能取得发票的：内部\n凭证\n对方开具的发票或者具有发\n境外购进\n一\n票性质的收款凭证、相关税\n货物1劳务\n费缴纳凭证\n(1)房屋、建筑物以外未投入使用的固定资产。\n(2)以经营租赁方式租入的固定资产(选项A)。\n(3)以融资租赁方式租出的固定资产。\n(4)已足额提取折旧仍继续使用的固定资产(选项D)。\n(5)与经营活动无关的固定资产。\n(6)单独估价作为固定资产入账的土地。\n(7)其他不得计算折旧扣除的固定资产。","block":"4-10","exam":"不得计提折旧扣除的固定资产","think":"<b>AD</b>：经营租入的小汽车（不归企业所有）、已足额提取折旧仍继续使用的办公楼（成本已摊完）不得再扣。B 融资<b>租入</b>的设备视同自有资产可扣；C <b>未投入使用的厂房</b>可以扣——法条写的是「房屋建筑物<b>以外</b>未投入使用的固定资产」，厂房被排除了。","trap":"C 是全题最阴的一个：读漏「以外」两个字就会多选；融资租入 vs 融资租出也要分清。"},{"no":19,"type":"multi","stem":"企业的下列支出中，可作为长期待摊费用按规定摊销的有( )。","opts":{"A":"尚未足额提取折旧的固定资产的改建支出","B":"固定资产的大修理支出","C":"租人固定资产的改建支出","D":"使固定资产达到预定用途的支出"},"ans":"BC","raw":"【解析】(1)选项A:以改建过程中发生的改建支出增加计税基础。\n(2)选项D:计入固定资产的计税基础。","block":"4-11","exam":"可作为长期待摊费用的支出","think":"<b>BC</b>：固定资产的大修理支出（按尚可使用年限摊）、租入固定资产的改建支出（按剩余租赁期摊）。A 错：<b>尚未足额</b>提取折旧的固定资产改建支出要<b>增加计税基础</b>走折旧，只有已提足的才走长期待摊；D 使固定资产达到预定用途的支出直接计入<b>计税基础</b>。","trap":"改建支出分两种：提足折旧的 → 长期待摊；没提足的 → 加计税基础。"},{"no":20,"type":"multi","stem":"下列关于无形资产的税务处理，表述正确的有( )。","opts":{"A":"自创商誉在10年内摊销扣除","B":"除另有规定外，无形资产的摊销年限不得低于10年","C":"外购商誉的支出，在企业整体转让或者清算时，准予扣除","D":"接受投资取得的无形资产，以该资产的账面价值和支付的相关税费为计税基础"},"ans":"BC","raw":"【解析】(1)选项A:自创商誉不得计算摊销费用在税前扣除。\n(2)选项D:通过捐赠、投资、非货币性资产交换、债务重组等方式取得的无形资产，\n以该资产的公允价值和支付的相关税费为计税基础。","block":"4-11","exam":"无形资产的税务处理","think":"<b>BC</b>：无形资产摊销年限除另有规定外不得低于 <b>10 年</b>；<b>外购商誉</b>的支出在企业整体转让或清算时准予扣除。A 错：<b>自创商誉</b>不得计算摊销费用扣除。D 错：通过捐赠、投资、非货币性资产交换、债务重组取得的无形资产，按<b>公允价值 + 相关税费</b>定计税基础，不是账面价值。","trap":"自创商誉 vs 外购商誉、账面价值 vs 公允价值，两组对照各错一个选项。"},{"no":21,"type":"multi","stem":"下列在会计上已作损失处理的除贷款类债权外的应收账款损失中，可在计算企业所得税应纳税所得额时扣除的有( )。","opts":{"A":"债务人死亡后其财产或遗产不足清偿的应收账款损失","B":"债务人逾期1年未清偿预计难以收回的应收账款损失","C":"与债务人达成债务重组协议后无法追偿的应收账款损失","D":"因自然灾害导致无法收回的应收账款损失"},"ans":"ACD","raw":"【解析】(1)选项ACD:减除可收回金额后确认的无法收回的应收款项，可以作为坏账损\n失在计算应纳税所得额时扣除。\n(2)选项B:债务人逾期3年以上未清偿，且有确凿证据证明已无力清偿债务的，才可按\n规定作为坏账损失在计算应纳税所得额时扣除。","block":"4-19","exam":"可作为坏账损失的应收账款","think":"<b>ACD</b>：债务人死亡遗产不足清偿、债务重组协议后无法追偿、自然灾害导致无法收回，减除可收回金额后可作损失扣除。B 错：需债务人逾期 <b>3 年以上</b>未清偿且有确凿证据证明无力清偿，仅「逾期 1 年、预计难以收回」不达标。","trap":"「预计」两字就是信号：税法不认估计，只认证据 + 年限。"},{"no":22,"type":"multi","stem":"下列在会计上已作损失处理的股权投资损失中，可在计算企业所得税应纳税所得额时扣除的有( )。","opts":{"A":"被投资方依法宣告破产的","B":"被投资方财务状况严重恶化，累计发生巨额亏损，已连续停止经营3年以上，且无重新恢复经营改组计划的","C":"对被投资方不具有控制权，投资期限已超过5年，且被投资单位资不抵债的","D":"被投资方财务状况严重恶化，累计发生巨额亏损，清算期超过1年的"},"ans":"AB","raw":"【解析】下列情形中的股权投资损失，准予按规定在企业所得税前扣除：\n(1)被投资方依法宣告破产、关闭、解散、被撤销，或者被依法注销、吊销营业执照的(选\n项A)。\n(2)被投资方财务状况严重恶化，累计发生巨额亏损，已连续停止经营3年以上，且无\n重新恢复经营改组计划的(选项B)。\n(3)对被投资方不具有控制权，投资期限届满或者投资期限已超过10年，且被投资单位\n因连续3年经营亏损导致资不抵债的(选项C不正确)。\n(4)被投资方财务状况严重恶化，累计发生巨额亏损，已完成清算或清算期超过3年以\n上的(选项D不正确)。\n(5)国务院财政、税务主管部门规定的其他条件。","block":"4-19","exam":"可扣除的股权投资损失","think":"<b>AB</b>：被投资方依法宣告破产/关闭/解散/被撤销/注销吊销；或财务状况严重恶化、累计巨额亏损、<b>连续停止经营 3 年以上</b>且无恢复经营改组计划。C 错：要求「投资期限届满或<b>超过 10 年</b>」且连续 3 年经营亏损导致资不抵债，选项改成 5 年；D 错：清算期需<b>超过 3 年</b>（或已完成清算），选项改成 1 年。","trap":"C、D 是把 10 年、3 年偷偷调低成 5 年、1 年——这一章的资产损失题几乎都这么设错。"},{"no":23,"type":"multi","stem":"下列关于企业资产损失的税务处理，表述正确的有( )。","opts":{"A":"企业在计算应纳税所得额时已经扣除的资产损失，在以后纳税年度收回的，其收回部分应当作为收入计入损失实际发生当期的应纳税所得额","B":"对企业以前年度实际发生未能在当年税前扣除的实际资产损失应在申报年度扣除","C":"对企业以前年度实际发生未能在当年税前扣除的法定资产损失应在申报年度扣除","D":"企业由于以前年度实际资产损失未在税前扣除而多缴的企业所得税，可以在追补确认年度企业所得税应纳税款中抵扣"},"ans":"CD","raw":"【解析】(1)选项A:企业在计算应纳税所得额时已经扣除的资产损失，在以后纳税年度\n全部或部分收回的，其收回部分应当作为收入计入收回当期的应纳税所得额。\n(2)选项B:对企业的实际资产损失准予追补至该项损失发生年度扣除，其追补确认期限\n一般不得超过5年。","block":"4-19","exam":"资产损失的追补与收回","think":"<b>CD</b>：以前年度<b>法定</b>资产损失在<b>申报年度</b>扣除；因以前年度实际资产损失未扣而多缴的税款，可在追补确认年度应纳税款中抵扣。A 错：已扣除的损失以后收回，计入<b>收回当期</b>的应纳税所得额，不是原损失发生当期。B 错：<b>实际</b>资产损失应<b>追补至损失发生年度</b>扣除（一般不超过 5 年），不是在申报年度。","trap":"实际损失「追到发生年度」、法定损失「留在申报年度」，两句正好相反；收回部分永远看「收回当期」。"},{"no":24,"type":"multi","stem":"对100%直接控制的居民企业之间按照账面净值划转资产，符合特殊性税务处理条件的，下列税务处理中，正确的有( )。","opts":{"A":"划人方企业取得被划转资产的计税基础以账面原值确定","B":"划入方企业不确认所得","C":"划人方企业取得的被划转资产，应按其原账面净值计算折旧扣除","D":"划出方企业不确认所得"},"ans":"BCD","raw":"【解析】对100%直接控制的居民企业之间按照账面净值划转股权或资产，符合规定条件\n的，可以选择按以下规定进行特殊性税务处理：\n(1)划出方企业和划人方企业均不确认所得(选项BD)。\n(2)划人方企业取得被划转股权或资产的计税基础，以被划转股权或资产的原账面净值\n确定(选项A不正确)。\n(3)划人方企业取得的被划转资产，应按其原账面净值计算折旧扣除(选项C)。","block":"4-12","exam":"100% 直接控制企业间划转资产的特殊性处理","think":"<b>BCD</b>：划出方和划入方<b>均不确认所得</b>；划入方按<b>原账面净值</b>计算折旧扣除。A 错：计税基础按<b>原账面净值</b>确定，不是账面原值（与单选 22 是同一条规则的两种问法）。","trap":"「账面原值 / 账面净值」差一个「已提折旧」，这一章反复考。"},{"no":25,"type":"multi","stem":"企业从事下列项目的所得，免征企业所得税的有( )。","opts":{"A":"内陆养殖","B":"远洋捕捞","C":"林木种植","D":"香料作物种植"},"ans":"BC","raw":"【解析】选项AD:减半征收企业所得税。","block":"4-14","exam":"农林项目免征 vs 减半","think":"<b>BC</b>：远洋捕捞、林木种植等<b>免征</b>。A 内陆养殖、D 香料作物种植属于<b>减半征收</b>，不是免征。","trap":"记「免」的清单比记「减半」短：蔬菜谷物、林木育种种植、远洋捕捞、中药材等；花卉茶饮料香料、内陆养殖、海水养殖多为减半。"},{"no":26,"type":"multi","stem":"企业从事环境保护、节能节水项目的所得享受“三免三减半”优惠。符合条件的环境保护、节能节水项目包括( )。","opts":{"A":"沼气综合开发利用","B":"公共垃圾处理","C":"节能减排技术改造","D":"海水淡化"},"ans":"ABCD","raw":"【解析】符合条件的环境保护、节能节水项目，包括公共污水处理、公共垃圾处理、沼气\n综合开发利用、节能减排技术改造、海水淡化等。","block":"4-14","exam":"三免三减半的环保节能节水项目范围","think":"<b>ABCD</b> 全对：公共污水处理、公共垃圾处理、沼气综合开发利用、节能减排技术改造、海水淡化等都属于符合条件的项目，自项目<b>取得第一笔生产经营收入所属纳税年度</b>起三免三减半。","trap":"起点是「第一笔生产经营收入」，不是获利年度、不是设立年度。"},{"no":27,"type":"multi","stem":"下列关于居民企业技术转让所得优惠的表述中，符合规定的有( )","opts":{"A":"境内技术转让经省级以上商务部门认定","B":"取得限制出口技术转让所得，不享受技术转让减免企业所得税优惠","C":"从间接持有股权之和达到85%以上关联方取得的技术转让所得，不享受技术转让减免企业所得税优惠","D":"没有单独计算技术转让所得的，不享受技术转让减免企业所得税优惠"},"ans":"BD","raw":"【解析】(1)选项A:境内技术转让经省级以上(含省级)科技部门认定。\n(2)选项C:居民企业从直接或间接持有股权之和达到100%联方取得的技术转让所得，\n不享受技术转让减免企业所得税优惠。","block":"4-14","exam":"技术转让所得优惠的条件","think":"<b>BD</b>：取得<b>限制出口</b>技术转让所得不享受减免；没有单独计算技术转让所得的不享受。A 错：境内技术转让须经<b>省级以上科技部门</b>认定，不是商务部门。C 错：不享受的门槛是「直接或间接持有股权之和达到 <b>100%</b> 的关联方」，选项写成 85%。","trap":"科技部门 / 商务部门、100% / 85%，两处都是把数字或机关换掉。"},{"no":28,"type":"multi","stem":"下列企业中，适用15%优惠税率缴纳企业所得税的有( )。","opts":{"A":"经认定的技术先进型服务企业","B":"科技型中小企业","C":"设在西部地区国家鼓励类产业企业","D":"国家需要重点扶持的高新技术企业"},"ans":"ACD","raw":"【解析】适用15%优惠税率缴纳企业所得税的有(不限于):国家需要重点扶持的高新\n技术企业(选项D)、经认定的技术先进型服务企业(选项A)、注册在海南自由贸易港并\n实质性运营的鼓励类产业企业、设在西部地区国家鼓励类产业企业(选项C)、从事污染\n防治的第三方企业。","block":"4-15","exam":"适用 15% 优惠税率的身份","think":"<b>ACD</b>：经认定的技术先进型服务企业、设在西部地区的国家鼓励类产业企业、国家需要重点扶持的高新技术企业。B 错：<b>科技型中小企业</b>不是 15% 税率档，它享受的是亏损结转 10 年、研发加计等。","trap":"「科技型中小企业」和「高新技术企业」名字像，待遇不同——这是全章最经典的一组混淆。"},{"no":29,"type":"multi","stem":"下列关于研发费用税前扣除规定的表述中，正确的有( )。","opts":{"A":"委托研发发生的研发费用受托方可以同时享受加计扣除","B":"委托境外个人研发发生的研发费用可以按照规定加计扣除","C":"企业产品的常规性升级不适用税前加计扣除政策","D":"企业共同合作开发的项目，由合作各方就自身实际承担的研发费用分别计算加计扣除"},"ans":"CD","raw":"【解析】(1)选项A:无论委托方是否享受研发费用税前加计扣除政策，受托方均不得加\n计扣除。\n(2)选项B:委托境外个人研发发生的研发费用，不得加计扣除。","block":"4-14","exam":"研发费用加计扣除的规则边界","think":"<b>CD</b>：产品常规性升级不适用加计扣除；共同合作开发项目由合作各方就<b>自身实际承担</b>的研发费用分别计算加计。A 错：无论委托方是否加计，<b>受托方一律不得</b>再加计。B 错：委托境外<b>个人</b>研发的费用不得加计（委托境外机构才可以，且受 80% / 2/3 孰低限制）。","trap":"受托方不得重复加计、境外个人不得加计——两条「不得」常被改成「可以」。"},{"no":30,"type":"multi","stem":"下列关于证券投资基金的税务处理，表述正确的有( )。","opts":{"A":"证券投资基金从证券市场中取得买卖股票差价收入，暂不征收企业所得税","B":"投资者从证券投资基金分配中取得的收入，征收企业所得税","C":"证券投资基金管理人运用基金买卖股票的差价收入，暂不征收企业所得税","D":"证券投资基金管理人运用基金买卖债券的差价收入，暂不征收企业所得税"},"ans":"ACD","raw":"【解析】选项B:对投资者从证券投资基金分配中取得的收入，暂不征收企业所得税。","block":"4-14","exam":"证券投资基金的税务处理","think":"<b>ACD</b>：基金从证券市场买卖股票差价、基金管理人运用基金买卖股票和债券的差价收入，均<b>暂不征收</b>企业所得税。B 错：投资者从基金分配中取得的收入也是<b>暂不征收</b>，不是征收。","trap":"四个选项里三个「暂不征」，唯一一个「征收」就是错的。"},{"no":31,"type":"multi","stem":"下列关于企业所得税税收优惠的表述中，正确的有( )。","opts":{"A":"对符合条件的节能服务公司实施合同能源管理项目，可享受“两免三减半”优惠","B":"对在海南自由贸易港设立的旅游业企业新增境外直接投资取得所得，免征企业所得税","C":"生产和装配伤残人员专门用品企业的所得，免征企业所得税","D":"企业出资给高等学校用于基础研究的支出，可按50%税前加计扣除"},"ans":"BC","raw":"【解析】(1)选项A:对符合条件的节能服务公司实施合同能源管理项目，符合规定的，\n自项目取得第一笔生产经营收入所属纳税年度起“三免三减半”。\n(2)选项D:对企业出资给非营利性科学技术研究开发机构、高等学校和政府性自然科\n学基金用于基础研究的支出，在计算应纳税所得额时可按实际发生额在税前扣除，并可\n按100%税前加计扣除。","block":"4-14","exam":"税收优惠综合判断","think":"<b>BC</b>：海南自贸港旅游业等鼓励类产业企业新增境外直接投资所得免征；生产装配伤残人员专门用品企业所得免征。A 错：节能服务公司合同能源管理项目是<b>三免三减半</b>，不是两免三减半。D 错：出资给高校、非营利科研机构、政府性自然科学基金用于基础研究的支出，可据实扣除并<b>按 100% 加计扣除</b>，不是 50%。","trap":"两免/三免、50%/100%，两处数字被对调或调低。"},{"no":32,"type":"multi","stem":"下列关于小型微利企业所得税征收管理的表述中，正确的有( )。","opts":{"A":"采用核定征收方式缴纳企业所得税的企业，不能享受小型微利企业所得税优惠政策","B":"统一实行按月预缴","C":"在预缴企业所得税时，通过填写纳税申报表，即可享受小型微利企业所得税优惠政策","D":"预缴企业所得税时，资产总额、从业人数、年度应纳税所得额指标，暂按当年度截至本期预缴申报所属期末的情况进行判断"},"ans":"CD","raw":"【解析】(1)选项A;小型微利企业无论按查账征收方式或核定征收方式缴纳企业所得税，\n均可享受小型微利企业所得税优惠政策。\n(2)选项B:小型微利企业所得税统一实行按季度预缴。","block":"4-15","exam":"小型微利企业的征收管理","think":"<b>CD</b>：预缴时通过填写纳税申报表即可享受，无需审批；资产总额、从业人数、年度应纳税所得额暂按<b>当年度截至本期预缴申报所属期末</b>的情况判断。A 错：<b>核定征收</b>企业同样可以享受小微优惠。B 错：统一实行<b>按季度</b>预缴，不是按月。","trap":"「核定征收不能享受」「按月预缴」两个说法都说反了。"},{"no":33,"type":"multi","stem":"下列行业中，不能享受研发费用加计扣除政策的有( )。","opts":{"A":"零售业","B":"烟草制造业","C":"商务服务业","D":"信息技术服务业"},"ans":"ABC","raw":"【解析】烟草制造业(选项B)、住宿和餐饮业、批发和零售业(选项A)、房地产业、租\n赁和商务服务业(选项C)、娱乐业，不能享受研发费用加计扣除政策。","block":"4-14","exam":"不能享受研发费用加计扣除的行业","think":"<b>ABC</b>：烟草制造业、住宿和餐饮业、批发和零售业、房地产业、租赁和商务服务业、娱乐业这六类不适用。D 信息技术服务业<b>可以</b>享受，不在负面清单里。","trap":"负面清单记六类，看到「信息技术服务」「制造业」别误伤。"},{"no":34,"type":"multi","stem":"在我国境内未设立机构、场所的非居民企业取得的下列利息所得中，免征企业所得税的有( )。","opts":{"A":"外国政府向中国政府提供贷款取得的利息所得","B":"国际金融组织向中国政府提供优惠贷款取得的利息所得","C":"国际金融组织向非居民企业提供贷款取得的利息所得","D":"外国政府向中国居民企业提供贷款取得的利息所得"},"ans":"AB","raw":"【解析】(1)选项C:国际金融组织向中国居民企业提供优惠贷款取得的利息所得免征企\n业所得税。\n(\n(2)选项D:外国政府向中国政府提供贷款取得的利息所得免征企业所得税。","block":"4-16","exam":"非居民企业利息所得免税情形","think":"<b>AB</b>：外国政府向<b>中国政府</b>提供贷款取得的利息、国际金融组织向中国政府提供<b>优惠贷款</b>取得的利息免征。C 错：国际金融组织向<b>非居民企业</b>提供贷款不在免税名单（免税的是向中国政府和<b>中国居民企业</b>提供优惠贷款）。D 错：外国政府免税的对手方是<b>中国政府</b>，不是中国居民企业。","trap":"把「谁借给谁」写清楚：外国政府 → 中国政府；国际金融组织 → 中国政府 / 中国居民企业（且须优惠贷款）。"},{"no":35,"type":"multi","stem":"下列关于企业所得税征收管理的表述中，正确的有( )。","opts":{"A":"企业在一个纳税年度中间开业，应当以连续经营的12个月为一个纳税年度","B":"企业清算时，应当以清算期间为一个纳税年度","C":"企业在年度中间终止经营活动的，应当自纳税年度终了之日起5个月内汇算清缴","D":"企业所得税按年计征，分月或者分季预缴，年终汇算清缴，多退少补"},"ans":"BD","raw":"【解析】(1)选项A:企业在一个纳税年度中间开业，或者终止经营活动，使该纳税年度\n的实际经营期不足12个月的，应当以其实际经营期为一个纳税年度。\n(2)选项C:企业在年度中间终止经营活动的，应当自实际经营终止之日起60日内，向\n税务机关办理当期企业所得税汇算清缴。","block":"4-21","exam":"纳税年度与汇算清缴","think":"<b>BD</b>：清算期间单独作为一个纳税年度；按年计征、分月或分季预缴、年终汇算清缴、多退少补。A 错：年度中间开业或终止经营、实际经营期不足 12 个月的，以<b>实际经营期</b>为一个纳税年度，不是「连续 12 个月」。C 错：年度中间终止经营的，应自实际经营终止之日起 <b>60 日内</b>汇缴，5 个月是正常年度终了后的期限。","trap":"两个期限：正常年度 5 个月、中途终止 60 日，别串。"},{"no":36,"type":"multi","stem":"根据跨地区经营汇总纳税企业所得税征收管理规定，总机构按照规定的因素，将统一计算的企业当期应纳税额的50%在各分支机构之间进行分摊。决定分支机构分摊所得税款的规定因素包括( )。","opts":{"A":"营业成本.","B":"营业收入","C":"资产总额","D":"职工薪酬"},"ans":"BCD","raw":"【解析】总机构按照上年度各省市分支机构的营业收入、职工薪酬和资产总额三个因素，\n将统一计算的企业当期应纳税额的50%在各分支机构之间进行分摊。","block":"4-21","exam":"跨地区汇总纳税的分摊因素","think":"<b>BCD</b>：总机构按<b>上年度</b>各省市分支机构的营业收入、职工薪酬、资产总额三个因素，把统一计算的当期应纳税额的 50% 在各分支机构间分摊。A 营业成本<b>不在</b>三因素里。","trap":"三因素记「人、钱、物」：职工薪酬、营业收入、资产总额；用的是上年度数据。"},{"no":37,"type":"multi","stem":"下列增值税中，符合规定条件的，可作为企业所得税不征税收入的有( )。","opts":{"A":"即征即退的增值税","B":"增值税出口退税","C":"先征后返的增值税","D":"直接减免的增值税"},"ans":"ACD","raw":"【解析】企业取得的，由国务院财政、税务主管部门规定专项用途并经国务院批准的财\n政性资金，不征收企业所得税。财政性资金，是指企业取得的来源于政府及其有关部\n门的财政补助、补贴、贷款贴息，以及其他各类财政专项资金，包括直接减免的增值\n税和即征即退、先征后退、先征后返的各种税收，但不包括企业按规定取得的出口退\n税款。","block":"4-6","exam":"可作为不征税收入的增值税相关款项","think":"<b>ACD</b>：即征即退、先征后返、直接减免的增值税属于「有专项用途并经国务院批准的财政性资金」，符合条件可作不征税收入。B 错：<b>出口退税</b>退的是进项税额、本来就不是收入，明确排除在财政性资金之外。","trap":"「出口退税」是这一题唯一的排除项；记住它和其他三种退税性质不同。"},{"no":38,"type":"multi","stem":"甲公司2025年年初向乙公司进行混合性投资1000万元，双方约定投资期限为两年，两年后乙公司须偿还本金，每年年底乙公司应向甲公司固定支付80万元的利息，并且甲公司对乙公司净资产不拥有所有权、不具有选举权和被选举权、不参与乙公司日常生产经营活动。下列关于80万元利息双方的税务处理，表述正确的有( )","opts":{"A":"甲公司取得的80万元免征企业所得税","B":"乙公司支付的80万元不得税前扣除","C":"甲公司取得的80万元按规定缴纳企业所得税","D":"乙公司支付的80万元在不超过金融企业同期同类贷款利率计算的部分允许税前扣除"},"ans":"CD","raw":"【解析】甲公司对乙公司的投资，应按债权性投资业务进行企业所得税处理，即投资方甲\n公司取得利息收入按规定缴纳企业所得税，被投资方乙公司支付的不超标利息可在企业\n所得税前扣除。","block":"4-5","exam":"混合性投资按债权处理的后果","think":"<b>CD</b>：约定固定利息、到期还本、不拥有净资产、无选举权、不参与经营 → 符合<b>债权性投资</b>条件。投资方取得的 80 万按利息收入<b>缴纳</b>企业所得税；被投资方在不超过金融企业同期同类贷款利率计算的部分<b>准予税前扣除</b>。A 免税、B 不得扣除都反了。","trap":"判断是债还是股看「还本义务 + 固定收益 + 不参与经营」，不看名字叫不叫投资。"},{"no":39,"type":"multi","stem":"某公司2025年12月转让代张某持有的限售股，取得收入1000万元，但是不能准确计算限售股原值。下列处理中，符合规定的有( )。","opts":{"A":"由该公司缴纳企业所得税","B":"由张某自行缴纳个人所得税","C":"应缴纳所得税212.5万元","D":"该公司将限售股转让收入余额转付给张某时扣缴个人所得税"},"ans":"AC","raw":"【解析】(1)选项AB:企业转让代个人持有的限售股取得的收入，应作为企业应税收入\n计算纳税。\n(2)选项C:不能准确计算该限售股原值的，主管税务机关一律按该限售股转让收入的\n15核定为该限售股原值和合理税费，应缴纳企业所得税=1000×(1-15%25%=\n212.5(万元)。\n(3)选项D:依照规定完成纳税义务后的限售股转让收入余额转付给实际所有人时不再\n纳税。","block":"4-5","exam":"企业转让代个人持有的限售股","think":"<b>AC</b>：名义持有人是企业，所以由<b>企业</b>就转让收入缴纳企业所得税；原值不能准确计算的，按转让收入的 <b>15%</b> 核定原值和合理税费，应纳 = 1000×(1-15%)×25% = <b>212.5 万</b>。B 错：不是张某自行缴个税；D 错：完成纳税义务后把余额转付给实际所有人时<b>不再</b>扣缴个税。","trap":"15% 是核定<b>原值及合理税费</b>，所以应税部分是收入的 85%，别直接拿 15% 乘税率。"},{"no":40,"type":"multi","stem":"某公司的下列支出中，可以作为计算职工福利费税前扣除限额基数的有( )。","opts":{"A":"在年度汇算清缴结束前向员工实际支付的已预提汇缴年度工资薪金","B":"接受外部劳务派遣用工，按照协议约定直接支付给劳务派遣公司的费用","C":"雇用实习生实际发生的工资薪金","D":"返聘离退休人员实际发生的工资薪金"},"ans":"ACD","raw":"【解析】选项B:企业接受外部劳务派遣用工所实际发生的费用，按照协议(合同)约定\n直接支付给劳务派遣公司的费用，应作为劳务费支出；直接支付给员工个人的费用，应\n作为工资薪金支出和职工福利费支出。其中属于工资薪金支出的费用，准予计入企业工\n资薪金总额的基数，作为计算其他各项相关费用扣除的依据。","block":"4-8","exam":"职工福利费扣除限额的工资总额基数","think":"<b>ACD</b>：汇缴结束前实际支付的已预提工资、雇用实习生实际发生的工资薪金、返聘离退休人员实际发生的工资薪金，都计入工资薪金总额。B 错：按协议直接付给<b>劳务派遣公司</b>的费用是<b>劳务费</b>，不进工资总额；只有直接支付给员工个人且属工资薪金性质的部分才进。","trap":"与单选 41 同一条规则，正反各考一次：付给公司 = 劳务费，付给个人 = 拆工资/福利。"},{"no":41,"type":"multi","stem":"某公司为增值税一般纳税人，2025年实现会计利润1200万元。当年发生符合公益性捐赠条件的慈善捐赠130万元，上年结转公益性捐赠20万元。则下列处理中，正确的有( )。","opts":{"A":"上年结转的公益性捐赠20万元准予在本年全部扣除","B":"本年发生的公益性捐赠130万元准予在本年全部扣除","C":"结转以后年度扣除的公益性捐赠为6万元","D":"当年公益性捐赠整体纳税调减14万元"},"ans":"ACD","raw":"【解析】企业在对公益性捐赠支出计算扣除时，应先扣除以前年度结转的捐赠支出，再扣除\n当年发生的捐赠支出。2025年公益性捐赠税前扣除限额=1200×12%44(万元),先扣\n除上年结转的20万元(纳税调减),结转以后年度扣除的公益性捐赠=130-(144-20)=\n6(万元)(纳税调增),当年公益性捐赠整体纳税调减14万元。\n项目\n具体规定\n同时符合下列条件：\n(1)被投资企业接受投资后，需要按投资合同或协议约定的利\n率定期支付利息(或定期支付保底利息、固定利润、固定股息，\n下同)\n前提\n(2)有明确的投资期限或特定的投资条件，并在投资期满或者\n满足特定投资条件后，被投资企业需要赎回投资或偿还本金\n(3)投资企业对被投资企业净资产不拥有所有权\n(4)投资企业不具有选举权和被选举权\n(5)投资企业不参与被投资企业日常生产经营活动\n投资企业：应于被投资企业应付利息的日期，确认利息收入的\n实现并计入当期应纳税所得额\n支付的利息\n被投资企业：应于应付利息的日期，确认利息支出，并按规定\n税务\n进行税前扣除(标准以内)\n处理\n投资双方应于赎回时将赎价与投资成本之间的差额确认为债务\n被投资企业\n重组损益\n赎回的投资\n(1)确认为债务重组损失的，准予在税前扣除\n(2)确认为债务重组所得的，计入当期应纳税所得额","block":"4-8","exam":"公益性捐赠结转与扣除顺序","think":"<b>ACD</b>：限额 = 1200×12% = 144；<b>先扣上年结转</b>的 20 万（纳税调减），再扣本年 130 万中的 124 万，结转以后年度 = 130-124 = <b>6 万</b>（纳税调增），整体净调减 20-6 = <b>14 万</b>。B 错：本年 130 万不能全额扣。","trap":"顺序不能反：先上年结转、后本年发生；结转以后 3 年扣除。"},{"no":42,"type":"multi","stem":"下列关于企业筹办费的处理，表述正确的有( )。","opts":{"A":"筹建期间发生的业务宣传费支出，可按实际发生额计入企业筹办费","B":"筹建期间发生的业务招待费支出，可按实际发生额计入企业筹办费","C":"筹办费可以在生产经营当年一次性扣除","D":"筹办费可以作为长期待摊费用在2年内摊销"},"ans":"AC","raw":"【解析】(1)选项B:筹建期间发生的业务招待费支出，可按实际发生额的60%入企业\n筹办费。\n(2)选项D:筹办费可采用在生产经营当年一次性扣除，或者作为长期待摊费用不短于3\n年摊销。","block":"4-20","exam":"筹办费与筹建期费用","think":"<b>AC</b>：筹建期广告费和业务宣传费按<b>实际发生额</b>计入筹办费；筹办费可在开始生产经营当年<b>一次性扣除</b>。B 错：筹建期业务招待费按实际发生额的 <b>60%</b> 计入筹办费。D 错：作为长期待摊费用摊销的年限是<b>不短于 3 年</b>，不是 2 年；且一经选定不得改变。","trap":"筹建期招待费只按 60% 进筹办费（不设收入 5‰ 那道闸）；筹办费不算亏损。"},{"no":43,"type":"multi","stem":"(非标准题)下列企业发生的手续费及佣金支出，准予在当年据实税前扣除的有( )。","opts":{"A":"证券企业","B":"保险企业","C":"期货企业","D":"设备制造企业","E":"电信企业","F":"保险代理企业","G":"商业企业"},"ans":"ACF","raw":"【解析】(1)选项ACF:从事代理服务、主营业务收入为手续费、佣金的企业(如证券、\n期货、保险代理等企业),其为取得该类收入而实际发生的营业成本(包括手续费及佣金\n支出),准予在企业所得税前据实扣除。\n(2)选项B:保险企业发生与其经营活动有关的手续费及佣金支出，不超过当年全部保\n费收入扣除退保金等后余额的18含本数)的部分，在计算应纳税所得额时准予扣除；\n超过部分，允许结转以后年度扣除。\n(3)选项DG:其他企业，按与具有合法经营资格中介服务机构或个人(不含交易双方及\n其雇员、代理人和代表人等)所签订服务协议或合同确认的收入金额的5%算限额在税\n前扣除。\n(4)选项E:电信企业在发展客户、拓展业务等过程中(如委托销售电话人网卡、电话充\n值卡等),需向经纪人、代办商支付手续费及佣金的，其实际发生的相关手续费及佣金支出，\n不超过企业当年收入总额5%部分，准予在企业所得税税前据实扣除。","block":"4-20","exam":"手续费及佣金据实扣除的行业（7 选项）","think":"<b>ACF</b>：从事代理服务、<b>主营业务收入就是手续费佣金</b>的企业（证券、期货、保险代理）可据实扣除。B 保险企业按净保费收入 <b>18%</b> 限额（超额可结转）；D 设备制造、G 商业企业按合同确认收入的 <b>5%</b> 限额；E 电信企业按收入总额 <b>5%</b> 限额。","trap":"「据实」看的是主营收入性质，不是行业规模；保险 18% 和电信 5% 的基数还不一样。"},{"no":44,"type":"multi","stem":"甲公司由于无法偿还所欠乙公司欠款1000万元，于2025年12月将一批自产汽车配件抵偿该欠款，甲公司向乙公司开具增值税专用发票注明配件价款800万元、增值税104万元，该批配件的实际成本650万元。已知甲、乙公司均为增值税一般纳税人，不考虑其他相关税费。下列表述中，正确的有( )。","opts":{"A":"甲公司应确认所得96万元","B":"甲公司应确认所得246万元","C":"乙公司应确认损失96万元","D":"乙公司应确认损失246万元"},"ans":"BC","raw":"【解析】(1)债务重组的一般性税务处理中，以非货币性资产清偿债务应分解为转让相关\n非货币性资产和按非货币性资产公允价值清偿债务两项业务，确认相关资产的所得或损失。\n(2)甲公司转让资产收益=800-650=150(万元),债务重组收益=1000-800-104=96(万\n元),甲公司应确认债务重组所得=150+96=246(万元)。\n(3)乙公司应确认债务重组损失=1000-(800+104)=96(万元)。","block":"4-12","exam":"以非货币性资产清偿债务的债务重组","think":"<b>BC</b>：一般性处理要拆成两笔——甲公司转让资产所得 = 800-650 = 150，按公允价值清偿债务的重组所得 = 1000-800-104 = 96，合计 <b>246 万</b>；乙公司债务重组损失 = 1000-(800+104) = <b>96 万</b>。","trap":"两笔都要算，只算资产转让得 150、只算重组得 96 都会漏；增值税 104 要计入清偿对价。"},{"no":45,"type":"multi","stem":"企业实施合并重组，适用企业所得税特殊性税务处理方法时，下列处理正确的有( )。","opts":{"A":"合并企业接受被合并企业资产的计税基础，以被合并企业的公允价值确定","B":"被合并企业亏损可由合并企业在限额内弥补","C":"被合并企业股东取得合并企业股权的计税基础，以其原持有的被合并企业股权的计税基础确定","D":"合并企业应支付不少于其交易支付总额的75%股权"},"ans":"BC","raw":"【解析】(1)选项A:合并企业接受被合并企业资产的计税基础，以被合并企业的原有计\n税基础确定。\n(2)选项D:企业股东在该企业合并发生时取得的股权支付金额不低于其交易支付总额\n的85以及同一控制下且不需要支付对价的企业合并，可以按特殊性税务处理方法\n处理。","block":"4-12","exam":"企业合并适用特殊性税务处理","think":"<b>BC</b>：被合并企业亏损可由合并企业在<b>限额内</b>弥补；被合并企业股东取得合并企业股权的计税基础，以其<b>原持有</b>股权的计税基础确定。A 错：合并企业接受资产的计税基础以<b>原有计税基础</b>确定，不是公允价值。D 错：股权支付比例不低于交易支付总额的 <b>85%</b>（旧口径 75% 已作废）。","trap":"「一般看公允、特殊看原值」；85% 是 2026 教材口径，别沿用旧数字。"},{"no":46,"type":"multi","stem":"(非标准题)下列关于海南自由贸易港鼓励类产业企业所得税优惠政策的表述中，正确的有( )。","opts":{"A":"对注册在海南自由贸易港并实质性运营的鼓励类产业企业适用15%惠税率","B":"《海南自由贸易港鼓励类产业目录》中规定的产业项目业务收入占收入总额比例应不低于50%","C":"实质性运营要求企业实际管理机构设在海南自由贸易港，并对企业生产经营等实施实质性全面管理和控制","D":"对总机构设在海南自由贸易港以外的企业，仅就其设在海南自由贸易港内的符合条件的分支机构的所得，适用15%率","E":"鼓励类产业仅指海南自由贸易港新增鼓励类产业"},"ans":"ACD","raw":"【解析】(1)选项B:鼓励类产业企业，是指以《海南自由贸易港鼓励类产业目录》中规\n定的产业项目为主营业务，且其主营业务收入占企业收入总额60%以上的企业，非50%\n(2)选项E:《海南自由贸易港鼓励类产业目录》既包含全国性现有产业目录中的鼓励类\n产业，也包含海南自由贸易港新增鼓励类产业。","block":"4-13","exam":"海南自贸港鼓励类产业优惠（5 选项非标准题）","think":"<b>ACD</b>：注册在海南并<b>实质性运营</b>的鼓励类产业企业适用 15%；实质性运营要求实际管理机构设在海南并实施实质性全面管理和控制；总机构在海南以外的，仅就设在海南的符合条件分支机构所得适用 15%。B 错：主营业务收入占收入总额比例应为 <b>60% 以上</b>，不是 50%。E 错：目录既含全国性现有鼓励类产业，<b>也含海南新增</b>鼓励类产业。","trap":"60%、实质性运营、目录范围，三处都是把「且」写成「仅」或把数字调低。"}],"notes":{"blocks":[{"id":"4-1","name":"谁要交、按什么交：居民/非居民与四档税率","star":"★★★","level":"L3","scene":"一家公司赚了钱，国家凭什么向它收税？先看它跟中国有没有「身份关系」。<br><br>甲公司在深圳注册，老板在开曼开会——它是居民企业；乙公司在开曼注册，但董事会、财务、公章全在上海——它也是居民企业。丙公司在 A 国注册、也在 A 国管，只是偶尔卖给中国客户一台机器，或者在中国有个办事处——它是非居民企业。<br><br>单选题 1、2、3 就是让你在这三种身份里挑：谁全球所得都交、谁只交中国来源的那部分、谁按 10% 被代扣。","why":"为什么用「成立地 <b>或</b> 实际管理机构」两个标准？因为只看注册地太容易躲：在避税地挂个壳、实际经营全在国内，就可以不交税。所以税法把<b>实质控制地</b>也拉进来，满足其一就算居民，堵住这个口子。<br><br>为什么居民企业要就<b>全球所得</b>交税、非居民只就<b>境内所得</b>交？因为居民企业享受了这个国家完整的法律、市场、基础设施保护，税基就该是全部；非居民只是偶尔来赚一笔，只能就来源于境内的部分征，否则别国也不会认。<br><br>非居民再分两层，逻辑是一条链：<b>有没有境内机构场所 → 这笔所得跟它有没有实际联系</b>。有联系，说明本质是在中国常设经营，按 25% 正常征；没联系，说明只是被动收钱（股息、利息、租金、特许权使用费），没法核算成本，就按<b>收入全额 ×10%</b> 源泉扣缴，由付款方代扣。境外的所得，如果无实际联系，中国根本不征。<br><br>顺带记住一个反直觉点：<b>个体工商户、个人独资企业、合伙企业不是企业所得税纳税人</b>——它们没有独立法人资格，所得直接穿透到投资人交个税。所以题目里拿它们当「居民企业」的选项是必错项。","sentence":"两个标准满足其一即居民，居民全球所得 25%；非居民先看有无机构场所、再看有无实际联系——有联系 25%，没联系境内所得按 10% 全额源泉扣缴，境外无联系不征。","trap":"· 拿「个体工商户 / 合伙企业」当居民企业选 → 错，它们不适用企业所得税法；<br>· 「境内有机构场所」≠「所有境外所得都要交」，只有与该机构有<b>实际联系</b>的境外所得才交；<br>· 源泉扣缴的扣缴义务人是<b>支付人</b>（不是税务机关），税率 10%，不是 15%；<br>· 转让财产所得按<b>差额</b>（收入全额 - 财产净值）计征，股息利息租金特许权使用费按<b>全额</b>计征；<br>· 所得来源地口诀：不动产看<b>不动产所在地</b>，股息红利看<b>分配方</b>所在地，利息租金特许权费看<b>负担/支付方</b>所在地，权益性投资资产转让看<b>被投资企业</b>所在地（不是转出方）。","table":{"head":["身份","境内所得","境外所得","税率"],"rows":[["居民企业（成立地或实际管理机构在境内）","征","征","25%（优惠另议）"],["非居民·有机构场所·有实际联系","征","征","25%"],["非居民·有机构场所·无实际联系","征","不征","10% 源泉扣缴"],["非居民·无机构场所","征（境内来源）","不征","10% 源泉扣缴"]]},"tips":["判断税率只问两句：「境内有没有机构场所？」「这笔钱跟它有没有实际联系？」——两问定生死。","所得来源地里最容易错的是股息红利：按<b>分配所得的企业</b>所在地，不是投资方所在地。"],"qs":[1,2,3,1]},{"id":"4-2","name":"收入什么时候算：权责发生制与四类「合同约定日」","star":"★★★","level":"L3","scene":"会计上说「货发出去了、风险报酬转移了」就确认收入；税法不吃这一套，它要一个<b>能查证、不会扯皮</b>的时点。<br><br>比如分期收款卖设备，会计按现值一次性确认，税法说：按<b>合同约定的收款日期</b>一笔一笔确认；租金、利息、特许权使用费也一样，看合同约定的应付日期；接受捐赠则干脆按<b>实际收到</b>资产的日期。为什么差别这么大？往下看。","why":"税法确认收入时点，背后是两股力量在拉扯：<b>要收得准</b>（权责发生制，收入归到赚到它的那一年）和<b>要收得到</b>（纳税人得有钱交）。<br><br>· <b>分期收款 / 利息 / 租金 / 特许权使用费</b>：如果按权责发生制一次性确认，企业还没收到钱就要先交税，容易逼出欠税；而按合同日期，付款义务到期那一刻既有凭据、也大概率有现金，征纳双方都不用争。<br>· <b>接受捐赠</b>：白拿的东西没有对价、没有合同应付款日，唯一确定的时刻就是东西到手，所以按实际收到日。<br>· <b>股权转让</b>：要等协议生效 <b>且</b> 完成股权变更手续，因为没过户就不算真的转走。<br>· <b>政府补贴</b>：跟销售数量/金额挂钩的，本质是价款的一部分，跟货物一起按权责发生制；其他财政补贴、补助、退税，按实际取得时间。<br><br>这条「确定性优先」的思路还能解释金额规则：<b>商业折扣按扣除后金额</b>（真实成交价就是折后价）；<b>现金折扣按扣除前金额</b>（那是提前付款的融资费用，不是降价，另作财务费用）；<b>售后回购按售价确认、回购作购进</b>（税法不认「其实是融资」的会计实质，除非另有规定）。多选题 3 的八个选项，全在这条线上。","sentence":"税法要的是「能查证的确定时刻」：分期收款、利息、租金、特许权费看合同约定应付日；捐赠看实际收到日；股权转让看协议生效+变更手续；跟销量挂钩的补贴随货物按权责发生制，其余补贴按实际取得。","trap":"· 预收款销售在<b>发出商品</b>时确认，不是收到预收款时；托收承付在<b>办妥托收手续</b>时；委托代销（支付手续费方式）在<b>收到代销清单</b>时；<br>· 以旧换新按<b>销售商品正常确认收入</b>、回收商品作购进，不是按净额；<br>· 包含在售价内可区分的服务费，要在<b>服务期间分期</b>确认；<br>· 宣传媒介收费在广告<b>公之于众</b>时确认，广告制作费才按完工进度；为特定客户开发软件按完工进度；<br>· 持续时间超 12 个月的工程/劳务，按纳税年度内<b>完工进度或工作量</b>确认；<br>· 利息收入按<b>合同约定应付利息日</b>，不是实际收到日（多选 7 的 D 就死在这）。","table":{"head":["收入类型","确认时点","为什么"],"rows":[["分期收款销售货物","合同约定收款日期","付款义务到期、有现金"],["利息 / 租金 / 特许权使用费","合同约定应付日期","凭据确定"],["接受捐赠","实际收到资产日期","没有对价与合同日"],["股权转让","协议生效且完成股权变更","未过户不算转移"],["股息红利","被投资方作出利润分配决定日","分配义务确定"],["劳务（跨年 >12 个月）","完工进度 / 工作量","避免一次确认、无款可缴"]]},"tips":["把「按合同约定日期」的四个背成一句：<b>分期、利息、租金、特许权</b>。其余看到「实际收到」先警惕，多半只有捐赠和部分补贴。","现金折扣不减收入、商业折扣减收入——一个管钱早晚，一个管价高低。"],"qs":[4,3,4,7]},{"id":"4-3","name":"视同销售：只看所有权有没有出门","star":"★★★","level":"L3","scene":"公司把自产的一批货送给了灾区、分给了股东、或者拿来抵债；另一批货从北京仓库搬到天津分公司、从原料加工成半成品。<br><br><b>前者要视同销售交税，后者不交。</b>分界线只有一条：货的<b>所有权</b>有没有离开这家企业。","why":"企业所得税是对「所得」征税，而所得只有在<b>对外实现</b>时才好计量。资产在内部挪来挪去（自用、总分机构之间转移、继续加工），企业整体没多出一分钱，也没有外部交易价格可参照——硬要确认收入，等于对左口袋倒右口袋征税，还会逼企业自己编一个价格。<br><br>一旦所有权出门（捐赠、分配给股东、投资、抵债、广告样品），情况就变了：企业用这批资产<b>换到了别的东西</b>——换到了声誉、换到了分红义务的履行、换到了债务消灭、换到了股权。既然换到了对价，就要按<b>公允价值</b>确认收入、同时结转成本，把这笔隐含的增值收上来。不然企业大可用「送」的方式把利润转移出去，税基就漏了。<br><br>注意和增值税的区别：增值税的视同销售看的是「进项有没有被抵扣、货有没有进入最终消费」，所以<b>总分机构异地移送</b>在增值税上可能要视同销售，在企业所得税上因为所有权没变而<b>不视同</b>。这是两税最经典的对照点。<br><br>单选 53 是把自产药品分配给股东未作账，要补：调增 = 公允价值 450 - 成本 300 - 相关税费，再乘 25%。","sentence":"所有权出了企业门就视同销售（按公允价值确认收入、结转成本）；内部移送、自用、继续加工一律不视同。","trap":"· 自建商品房转自用、境内总分机构间移送、自产货物用于加工另一产品 → 都不视同；<br>· 用于<b>股息分配</b>、对外捐赠、对外投资、抵债、广告样品 → 视同；<br>· 视同销售收入要计入<b>业务招待费/广宣费限额基数</b>（销售营业收入），但<b>接受捐赠收入</b>是营业外收入，不计入基数；<br>· 公益性捐赠视同销售的销项税额要计入捐赠支出（单选 44：140+140×13%=158.2）；<br>· 政府/股东划入资产是「进来」，方向相反，不按这条判断。","table":{"head":["处置情形","所有权变化","企税视同销售","增值税"],"rows":[["总分机构间移送（境内）","不变","否","异地移送可能视同"],["自产货物用于继续加工","不变","否","否"],["自建商品房转自用","不变","否","否"],["自产货物对外捐赠 / 分配给股东","变","是，按公允价值","视同销售"],["以自产货物抵债","变","是","视同销售"]]},"tips":["一句话分家：<b>企税看所有权，增值税看抵扣链条</b>。","看到「未作任何账务处理」先条件反射：补收入、补成本、补税金、再调应纳税所得额。"],"qs":[5,53]},{"id":"4-4","name":"收入金额怎么定：折扣、折让、买一赠一","star":"★★","level":"L2","scene":"一台冰箱标价 6 万，买一赠一送加湿器；另一批货先卖 100 万，客户发现瑕疵退 10 万折让；还有一批 1000 万的货，给 50 万商业折扣，或者改成了「10 天内付款减 50 万」的现金折扣。<br><br>四笔业务，税法给出的收入金额都不一样。它不是在抠字眼，是在问同一个问题：<b>这批货真实成交价到底是多少</b>。","why":"· <b>商业折扣</b>：折扣发生在销售<b>当时</b>，价目表上就是折后价，真实成交价 = 1000-50，按净额确认。<br>· <b>现金折扣</b>：折扣发生在销售<b>之后</b>，是为早点拿到钱付的融资代价，货本身还是卖 1000 万；所以收入按 1000 万，那 50 万另作财务费用。<br>· <b>销售折让 / 退回</b>：已确认的收入后来因瑕疵被减掉，税法允许在<b>发生当期冲减</b>当期收入，不追溯改以前年度报表（征管上省事）。<br>· <b>买一赠一</b>：最容易想错成「赠品是捐赠，要视同销售」。但赠品不是白送，它是这笔买卖的条件之一，钱是<b>一整笔</b>收的。所以税法要求把总销售额按各项商品<b>公允价值比例分摊</b>，冰箱和加湿器各自确认自己的收入——既不多收（不按赠品市价额外加）、也不少收（不把全部金额算成冰箱）。<br><br>单选 6：60000 ÷ (60000 + 600×20) × 60000 = 50000 元。单选 36/37 是一对母题子题，只改「商业折扣 → 现金折扣」，答案就从 1040 变 1090，正好验证上面这条分界。","sentence":"成交价是多少就认多少：商业折扣减、现金折扣不减、折让退回当期冲减、买一赠一按公允价值比例分摊总额。","trap":"· 买一赠一<b>不属于捐赠</b>，不视同销售、不额外按赠品市价加收入；<br>· 现金折扣计入财务费用，不影响收入；<br>· 折让冲的是<b>发生当期</b>收入，不是追溯调整上年；<br>· 以旧换新按全额确认收入，回收商品另作购进。","tips":["母题子题只改一个词，答案就变——遇到这种题先圈出改的是哪个词，别整题重算。"],"qs":[6,36,37]},{"id":"4-5","name":"投资相关收入：股权、撤资、清算、永续债、可转债、限售股","star":"★★★","level":"L3","scene":"同样是「不持股了、拿回 1800 万」，<b>把股权卖给别人</b>、<b>从被投资公司撤资</b>、<b>公司清算分剩余财产</b>，三种拿钱方式的应纳税所得额完全不一样。<br><br>教材给了一张表（单选 18/19 就是母题子题）：转让 = 收入 - 初始成本；撤资 = 收入 - 初始成本 - 股息所得；清算 = 分得资产 - 股息所得 - 初始成本。为什么撤资和清算要先扣一块「股息所得」？","why":"因为<b>交易对手不同</b>：股权转让是你和<b>第三方股东</b>做买卖，对方付的钱里包含对未分配利润的预期，但税法不让你把被投资企业的留存收益扣掉（否则等于把免税股息伪装成转让所得），所以一律 1800-1000=800。<br><br>撤资/清算是<b>被投资企业自己</b>把钱退给你。它退的钱在法律上分三层：先还你的<b>本</b>（初始出资，不征税），再分它攒下的<b>未分配利润/盈余公积</b>（这部分性质是股息，符合居民企业间股息免税条件，所以单独切出来免税），剩下的才是<b>投资资产转让所得</b>。所以撤资题要先算 1500×40%=600 万股息，再算 1800-1000-600=200 万应税。<br><br>同一个「按性质拆分」的思路串起其余几个：<br>· <b>股东划入资产</b>约定作资本金且会计已处理 → 是<b>投入资本</b>不是收入，但计税基础按<b>公允价值</b>（防止把低估资产塞进来以后多提折旧）。<br>· <b>可转债转股</b>：应收未收利息一并转股的，税收上要先确认利息收入，再把「购买价 + 利息 + 相关税费」一起作为股票计税基础（单选 13 = 500+5+2=507）。<br>· <b>永续债 / 混合性投资</b>：名字叫「债」还是「股」不看名字，看<b>有没有还本义务、固定利息、期限、是否参与经营、是否承担经营风险</b>。满足 5 条以上按债券利息处理（投资方交税、发行方扣利息）；否则按股息处理。多选 5、6、38 全在考这条。<br>· <b>代个人持有的限售股</b>：名义上是企业持有，所以由<b>企业</b>就转让收入交企税；原值算不清的，按转让收入的 15% 核定原值和税费，1000×(1-15%)×25%=212.5 万；余额转付给个人时不再扣个税。","sentence":"钱从谁手里来决定性质：第三方买股权不扣留存收益；被投资企业退钱要切成「还本 / 股息 / 转让所得」三层。名字不重要，还本义务和经营风险决定是债还是股。","trap":"· 股权转让<b>不得</b>扣除被投资企业未分配利润中按持股比例可分配金额（单选 18 的 1500 万是干扰项）；<br>· 撤资/清算才扣股息所得，且顺序别乱；<br>· 股东划入资产按<b>公允价值</b>定计税基础，不是账面净值；<br>· 永续债条件里「被投资企业<b>可以</b>赎回」才符合，写「不可以赎回」是错的；税收处理方法<b>一经确定不得变更</b>，可以与会计处理不一致但要做纳税调整；<br>· 委托境外研发、限售股核定 15%，都是「算不清就给一个法定比例」的同一类规则。","table":{"head":["退出方式","公式","关键"],"rows":[["股权转让","收入 - 初始投资成本","留存收益不得扣"],["撤资 / 减资","取得资产 - 初始成本 - 股息所得","先切免税股息"],["清算","分得资产 - 股息所得 - 初始成本","顺序与撤资相反写法"],["可转债转股计税基础","购买价 + 应收未收利息 + 税费","利息先确认收入"],["限售股原值不清","转让收入 ×15% 核定","企业交企税"]]},"tips":["先问一句「钱是股东给的还是公司退的」，三层切分自然就出来了。","母题子题里改成「撤回全部投资」，只改了钱从哪儿来，其他数字全都别动。"],"qs":[7,13,17,18,19,5,6,38,39]},{"id":"4-6","name":"不征税收入 vs 免税收入：一个永久出局，一个只是这一轮免","star":"★★★","level":"L3","scene":"公司收到政府一笔专项拨款，用它买了台设备；另一笔钱是持有国债收到的利息。两者都「不用交税」，但后果完全不同：<br><br><b>用不征税收入买的那台设备，折旧永远不能在税前扣；用免税的国债利息买的设备，折旧照样能扣。</b>这是全章最容易考、也最容易想不通的一组对照。","why":"关键在于<b>这笔钱到底算不算「收入」</b>。<br><br>· <b>不征税收入</b>压根不是「经营所得」，它是财政拨款、行政事业性收费、有专项用途并经国务院批准的财政性资金。国家把钱给你是让你办特定事，不是让你赚钱——它<b>从来没进过税基</b>。既然本金没被征过，用它形成的费用/资产折旧当然也不能再扣一次，否则等于同一笔财政资金扣了两回。<br>· <b>免税收入</b>（国债利息、符合条件的居民企业间股息红利、非营利组织收入、沪港通连续持 H 股满 12 个月的股息）本来<b>属于应税收入</b>，是国家为了鼓励某类行为，特意在这一轮免掉。它进过税基的口径、只是被优惠政策抹掉，所以对应的成本费用照常可扣。<br><br>由此还能推出两个常考点：<br>① <b>不征税收入孳生的银行存款利息</b>是免税收入（多选 8 的 D），而「因政府购买服务取得的收入」<b>不属于</b>非营利组织免税收入（那是等价交易，不是捐赠补助）。<br>② 增值税里：<b>即征即退、先征后返、直接减免</b>的增值税属于「财政性资金」，符合专项用途条件可作不征税收入；<b>出口退税</b>是退还进项、本来就不是收入，明确排除（多选 37 的 B 错在这）。<br><br>单选 8 四个选项正好把三类摆一排：A 免税、B 照章纳税（国债<b>转让</b>收入不免税）、CD 不征税。","sentence":"不征税收入从来没进税基 → 对应的费用/折旧也不许扣；免税收入本该征税只是这轮被免 → 对应成本费用照常扣。","trap":"· 国债<b>利息</b>免税，国债<b>转让</b>所得照章纳税（单选 8 B、单选 40）；<br>· 出口退税不是不征税收入；<br>· 非营利组织：接受捐赠、省级以上民政财政部门规定收取的会费、不征税/免税收入孳生的利息 → 免税；<b>政府购买服务收入</b>不免税、<b>市级</b>规定的会费不算；<br>· 居民企业间股息红利免税要求「符合条件」，<b>连续持有不足 12 个月</b>的上市股票股息不免税；<br>· 被投资企业用<b>股权溢价形成的资本公积转增股本</b>，不作为投资方股息红利收入，也不得增加计税基础。","table":{"head":["","不征税收入","免税收入"],"rows":[["典型","财政拨款、行政事业性收费、专项用途财政性资金","国债利息、符合条件的股息红利、非营利组织收入"],["是否曾属应税","否，从未进入税基","是，被优惠免掉"],["用于支出形成的费用/折旧","<b>不得扣除</b>","可以扣除"],["孳生利息","作为免税收入","—"]]},"tips":["判断口诀：<b>「国家给你的钱不许再扣，国家免你的钱照常扣」</b>。","看到「政府购买服务」「市级会费」「出口退税」三个词，多选里一律先划掉。"],"qs":[8,2,8,37]},{"id":"4-7","name":"国债三件事：利息免税、转让征税、成本方法禁用后进先出","star":"★★","level":"L2","scene":"公司 1000 万买入一年期国债，年利率 4.5%，持有 200 天以 1030 万卖掉。这 30 万价差里，有多少是<b>还没兑付的利息</b>、有多少是<b>真正的转让所得</b>？<br><br>税法说：持有期间应计的利息 1000×4.5%÷365×200 = 24.66 万，这部分免税；剩下的 1030-1000-24.66 = 5.34 万才是转让所得，×25% = 1.34 万。","why":"国债利息免税是为了鼓励买国债（帮国家低成本融资），但<b>免税的是「利息」这个性质</b>，不是「跟国债有关的所有钱」。二级市场上低买高卖赚的价差是资本利得，跟持有国债的鼓励目的无关，当然要征税。<br><br>难点在于：持有期间<b>尚未兑付</b>的利息已经包含在卖价里了，如果不把它先剥出来，就会把本该免税的利息当成价差征了税。所以要按「面值 × 年利率 ÷ 365 × 持有天数」把应计利息算出来先免税。<br><br>另一件事：卖掉一批国债时要算成本，可选<b>先进先出、加权平均、个别计价</b>，<b>禁用后进先出</b>（单选 9）。为什么？后进先出会让企业永远把最新、通常最高的成本先结转成扣除，在通胀环境下能长期压低所得、递延纳税。存货成本计算也禁它，同一个理由。而增值税里金融商品买入价用的是加权平均/移动加权平均且 36 个月不变——两税口径不同，别串。","sentence":"国债只免「利息」不免「价差」：转让时先把持有期应计利息剥出来免税，剩余价差按 25% 交；成本可用先进先出/加权平均/个别计价，禁用后进先出。","trap":"· 「国债转让收入免税」是错的；<br>· 应计利息按 <b>365 天</b>折算，不是 360；<br>· 别把 1030-1000 全额当所得（会算出 7.5 万，选项 B 就是这个坑）；<br>· 铁路债券利息是<b>减半征收</b>，不是免税；国债利息才免税。","tips":["看到「持有 XX 天转让国债」，第一步永远是先算应计利息，第二步再算价差。"],"qs":[9,40]},{"id":"4-8","name":"限额家族：三项经费、招待费、广宣费、公益性捐赠","star":"★★★","level":"L3","scene":"企业花了钱，税务局却说「只能扣一部分」。这一整组考点的共同点是：<b>支出本身真实、也跟经营有关，但容易被拿来变相发福利、避税</b>，所以国家给一个「天花板」。<br><br>福利费 14%、工会 2%、职工教育 8%、招待费 60% 与收入 5‰ 孰低、广宣费 15%（特殊行业 30%）、公益性捐赠利润总额 12%。这些数字不用硬背——它们分属三种不同的「天花板逻辑」。","why":"<b>① 按比例给上限（三项经费、广宣费）</b>：因为这类支出容易膨胀成隐性薪酬。以<b>工资薪金总额</b>为基数，等于「你发多少工资，才配扣多少配套费用」，天然封顶。<br><b>② 双限额孰低（招待费）</b>：招待费最难说清是公务还是私人消费，所以设两道闸——<b>发生额的 60%</b>（先假设 40% 是私人成分，一律不认）+ <b>销售(营业)收入的 5‰</b>（跟生意规模挂钩），取小的那个。<br><b>③ 按利润比例 + 结转（公益性捐赠）</b>：捐赠是好事，但不能让企业把利润全捐光来避税，所以限额 = <b>年度利润总额 ×12%</b>；超额部分可结转以后 <b>3 年</b>，且扣除时<b>先扣上年结转、再扣本年发生</b>（单选 44、多选 41）。<br><br>三个高频细节都从「基数」长出来：<br>· <b>销售(营业)收入</b> = 主营 + 其他业务 + <b>视同销售收入</b>，但<b>不含营业外收入</b>（接受捐赠收入）和投资收益——单选 43 的 100 万捐赠收入就是拿来骗你进基数的。<br>· <b>劳务派遣</b>：直接付给派遣公司的费用算<b>劳务费</b>（不进工资总额）；直接发给派遣员工的，拆分工资薪金部分才进基数（单选 41：1200+70=1270，×14%=177.8）。<br>· <b>工资总额</b>还包括汇缴前实际支付的已预提工资、实习生工资、返聘离退休人员工资（多选 40）。<br><br>能结转的只有三类：<b>职工教育经费（无限期）、广宣费（无限期）、公益性捐赠（3 年）</b>；福利费、工会经费、招待费超了就永久作废。这个区别考过无数次。","sentence":"先定基数、再算限额、最后看能否结转：三项经费看工资总额，招待费看 60% 与收入 5‰ 孰低，广宣费看收入 15%/30%，捐赠看利润总额 12% 且先扣上年结转。","trap":"· 招待费里的销售(营业)收入<b>含视同销售、不含接受捐赠和投资收益</b>；<br>· 广宣费 30% 只给<b>化妆品制造或销售、医药制造、饮料制造（不含酒类）</b>；<b>烟草企业的烟草广宣费一律不得扣除</b>；啤酒、医药零售都不在 30% 名单里；<br>· 职工教育经费：<b>软件企业职工培训费、核电厂操纵员培养费可全额扣除</b>（单选 54 先剔 50 万再算 8%）；<br>· 公益性捐赠限额用<b>会计利润总额</b>，不是应纳税所得额；捐赠自产货物要按公允价值加销项税确认支出（140+18.2=158.2）；<br>· 违约金、银行罚息<b>可以扣</b>；税收滞纳金、罚金、非广告赞助、预提维简费不得扣；<br>· 筹建期业务招待费按<b>60%</b> 计入筹办费（不设收入 5‰ 那道闸），广宣费按实际发生额全额计入。","table":{"head":["项目","限额","基数","超了能否结转"],"rows":[["职工福利费","14%","工资薪金总额","否"],["工会经费","2%","工资薪金总额","否"],["职工教育经费","8%","工资薪金总额","是，无限期"],["业务招待费","60% 与 5‰ 孰低","发生额 / 销售营业收入","否"],["广宣费","15%（特殊 30%）","销售营业收入","是，无限期"],["公益性捐赠","12%","年度利润总额","是，3 年"]]},"tips":["所有限额题第一步都是<b>找基数</b>，不是急着乘百分比。","结转三兄弟：<b>教、广、捐</b>；其余超支当年作废。"],"qs":[10,41,43,44,54,10,40,41]},{"id":"4-9","name":"税会差异：股权激励与非货币性资产投资 5 年递延","star":"★★★","level":"L3","scene":"会计上确认了一笔费用，税法却说「今年一分不许扣」；或者反过来，会计上一次性确认了 60 万所得，税法说「分 5 年，每年只认 12 万」。<br><br>这两件事看着毫无关系，其实是同一个动作：<b>把会计口径和税法口径的时间差，用「纳税调增 / 调减」记下来</b>。整章最核心的心法就在这里。","why":"<b>股权激励</b>：等待期内会计按权责发生制把期权费用摊进各年，但此时<b>没人行权、没有实际支出、金额还会随股价变</b>。税法只认「确定的、已实现的」支出，所以等待期一律<b>调增</b>（可扣 0）。等真正行权那天，行权价与公允价的差额才是公司实打实付出的成本，一次性按 (26-8)×100×20000÷10000=3600 万扣除（单选 11/12）。<br><br><b>非货币性资产对外投资</b>：拿一批成本 140、公允 200 的货去投资，账上立刻多出 60 万所得。但公司<b>没收到一分钱现金</b>，只换回了股权——立刻征税等于逼企业卖资产交税。所以税法允许把 60 万在不超过 5 年内<b>分期均匀</b>计入：每年 12 万。于是 2023 年会计 60、税法 12，<b>调减 48</b>；2024–2027 每年会计 0、税法 12，<b>调增 12</b>（单选 38）。<br><br>如果 5 年内<b>转让股权或收回投资</b>，说明变现了、递延理由消失，要把剩余年度未确认的所得一次性补上（单选 39：2025 收回，剩 2025–2027 三年 = 36 万，调增 36）。<br><br>这类题有个万能做法：<b>画两行时间轴</b>，一行写会计每年认多少，一行写税法每年认多少，差额就是调增/调减，符号别靠感觉。","sentence":"税会差异 = 两条时间轴相减：会计认了税法没认 → 调增；税法认了会计没认 → 调减。递延的前提是「没拿到现金」，一变现就停止递延。","trap":"· 等待期股权激励费用<b>全额调增</b>，不是按公允价值折算；<br>· 行权时扣的是 <b>(行权日公允价 - 行权价) × 数量</b>，与授予日股价无关；<br>· 5 年递延是「<b>不超过</b> 5 年、<b>均匀</b>」，不是想怎么分怎么分；<br>· 收回投资当年一次性确认的是<b>剩余未确认</b>部分，不是全额 60 万；<br>· 自产货物分配股东、视同销售补账，也属于「会计没记、税法要记」的调增（单选 53）。","table":{"head":["年度","会计确认","税法确认","纳税调整"],"rows":[["2023（投资当年）","60 万","12 万","调减 48"],["2024","0","12 万","调增 12"],["2025 收回投资","0","12×3 = 36 万（一次性）","调增 36"]]},"tips":["遇到「调增还是调减」别凭直觉，画两条时间轴，用<b>税法 − 会计</b>定符号。","凡是税法给了递延，一定会配一条「提前变现就补回来」的规则——两道题往往成对出。"],"qs":[11,12,38,39]},{"id":"4-10","name":"固定资产折旧：年限、加速、一次性扣除、不得折旧","star":"★★★","level":"L3","scene":"同样是买设备，有的能当年一次性全扣，有的必须分 10 年，有的<b>永远不许扣折旧</b>。<br><br>单选题 14、27、31、51 和多选 18、19 都在问：这台东西，税法认不认、按几年扣、从哪个月开始扣。","why":"折旧的本质是<b>把资本性支出分期摊进成本</b>。税法管三件事：<br>① <b>是不是真在为企业赚钱</b>：经营租入的（不属于你）、融资租出的（已不归你用）、房屋建筑物以外未投入使用的、已提足折旧还在用的、与经营无关的、单独估价入账的土地 → 一律不许再扣折旧。<br>② <b>按几年摊</b>：房屋建筑物 20 年、飞机火车轮船机器等 10 年、器具工具家具 5 年、飞机火车轮船以外的运输工具 <b>4 年</b>、电子设备 3 年。核定征收期间买的资产改成查账征收，要按税法年限<b>扣掉已用年限</b>继续摊（单选 14：4-1=3 年）。<br>③ <b>政府想鼓励更新设备时</b>：允许<b>缩短折旧年限（不低于法定年限 60%）</b>或加速折旧；2018–2027 年新购进<b>单位价值 ≤500 万的设备器具</b>（<b>不含房屋建筑物</b>）可一次性税前扣除。<br><br>为什么一次性扣除要排除房产？因为房产价值大、使用期长、还常被用来持有增值，一次性扣会瞬间击穿税基；而设备更新快、政策目的就是让企业敢买。<br><br>单选 51 把两个规则叠在一起：1600 万设备 → 缩短年限法最低 10×60%=6 年；<b>投入使用次月起</b>计提，2025 年只扣 7–12 月共 6 个月：1600×(1-5%)÷6×6/12 = 126.67 万。注意别把「6 年」和「6 个月」看混。","sentence":"先问能不能扣（ownership + 在用），再问按几年（法定年限 / 60% 加速），最后问从哪月起（投入使用次月）；≤500 万设备器具 2027 年底前可一次性扣，房产不行。","trap":"· 「房屋建筑物以外未投入使用」不得扣；但<b>未投入使用的厂房</b>可以扣（多选 18 的 C 是可扣的，别选它进「不得扣」）；<br>· 融资<b>租入</b>可扣、融资<b>租出</b>不可扣；经营<b>租入</b>不可扣；<br>· 一次性扣除看<b>单位价值</b>不是总价，且限<b>设备器具</b>；超过 500 万仍可加速折旧；<br>· 已足额提取折旧的固定资产改建支出走<b>长期待摊（按预计尚可使用年限）</b>，尚未提足的改建支出是<b>增加计税基础</b>；<br>· 其他长期待摊费用摊销年限<b>不得低于 3 年</b>（不是 5 年）；大修理支出按尚可使用年限，租入固定资产改建按剩余租期。","table":{"head":["资产 / 支出","税法处理","年限"],"rows":[["房屋建筑物","正常折旧","20 年"],["机器设备","正常折旧","10 年"],["运输工具（非飞机火车轮船）","正常折旧","4 年"],["电子设备","正常折旧","3 年"],["缩短年限法（加速）","不低于法定 60%","10 年 → 6 年"],["≤500 万设备器具","一次性扣除","2018–2027"],["其他长期待摊费用","分期摊销","≥3 年"]]},"tips":["计算题固定三步：<b>定年限 → 定起扣月 → 定当年月数</b>，别跳步。","「房屋建筑物以外未投入使用」这半句要连着读，漏掉前半句就会把厂房误判成不能扣。"],"qs":[14,27,51,18]},{"id":"4-11","name":"其他资产的税法口径：生物、无形、投资、税金、长期待摊","star":"★★","level":"L2","scene":"公司买了片林子、一批用于收藏的文物、一项专利，还替在建厂房交了契税。哪些能摊、哪些永远不能摊？<br><br>判断标准还是那句：<b>它是不是在生产经营中被消耗掉</b>。","why":"· <b>生物资产</b>分三类：消耗性（用材林、生长中的农田作物，等着卖掉，是存货）、<b>生产性</b>（薪炭林、产奶的奶牛，持续产出，可提折旧）、公益性（水源涵养林，不产生经营收益，不可提）。只有生产性可提折旧（单选 15）。<br>· <b>商誉</b>：自创商誉不得摊销（自己夸自己值多少钱，没有可验证的成本）；<b>外购商誉</b>的支出只有在企业整体转让或清算时才准扣（单选/多选 20）。无形资产摊销年限<b>不低于 10 年</b>；接受投资/捐赠/非货币交换取得的，按<b>公允价值 + 相关税费</b>定计税基础，不是账面价值。<br>· <b>投资资产</b>：持有期间成本<b>不得扣除</b>（钱只是换了个形态），转让处置时才准扣；<b>文物、艺术品</b>用于收藏展示保值增值的按投资资产处理，持有期间计提的折旧<b>不得扣</b>（单选 17）。<br>· <b>税金</b>：计入「税金及附加」当期扣（消费税、车船税、房产税、印花税、环保税等）；<b>资本化进资产成本、以后分摊</b>的是契税、车辆购置税、耕地占用税、进口关税、不得抵扣的增值税（多选 9 = CDG）；企业所得税本身和可抵扣的增值税<b>永远不得扣</b>。<br>· <b>存货成本</b>禁用后进先出法。","sentence":"只有「在经营中被消耗」的资产才能摊：生产性生物资产、外购无形、在用固定资产；投资资产和收藏品持有期间一律不摊，卖出时才扣成本。","trap":"· 自创商誉不摊、外购商誉只在整体转让/清算时扣；<br>· 无形资产的计税基础看<b>公允价值</b>，不是账面价值；<br>· 被投资企业发生的亏损由<b>被投资企业</b>自己结转，投资企业不得弥补（单选 16 D）；<br>· 「其他应当作为长期待摊费用的支出」摊销 ≥3 年，不是 5 年；<br>· 使固定资产达到预定用途的支出计入<b>计税基础</b>，不是长期待摊。","tips":["把资产分成「会耗掉」和「只是换形态」两类，八成选择题就定了。"],"qs":[15,16,9,19,20]},{"id":"4-12","name":"企业重组：一般性 vs 特殊性，一条「有没有变现」的分界线","star":"★★★","level":"L3","scene":"甲公司合并乙公司、收购股权、或者把一台设备无偿划给 100% 控股的子公司。会计上都可能没收到现金，税法却有两种完全不同的处理：<br><br><b>一般性</b>：当作按公允价值卖了一遍，当场确认所得或损失，计税基础改成公允价值，亏损不许带走。<br><b>特殊性</b>：当作没卖，暂不确认所得，计税基础<b>原样结转</b>，亏损可以在限额内带过来。<br><br>为什么同一笔交易能有两种结果？","why":"因为<b>重组往往只是换了个持有方式，老板没真正退出、也没拿到钱</b>。如果一律按公允价值立即征税，企业会因为没有现金缴税而不敢重组，等于税法在阻碍正常的产业整合。所以国家给一个选择：<b>只要交易主要是用股权支付的（没有变现），就允许递延</b>。<br><br>由此推出特殊性税务处理的五个条件，全都能理解而不是背：<br>① <b>合理商业目的</b>（不是纯为避税）；② <b>股权支付 ≥85%</b>（钱没怎么出去，才有递延理由）；③ 收购/合并的资产或股权比例 ≥50%（确实是重大重组）；④ 重组后 <b>12 个月</b>内不改变原实质性经营活动；⑤ 取得股权支付的原主要股东 <b>12 个月</b>内不转让所取得的股权（防止立刻套现）。<br><br>两个必须会算的限额：<br>· <b>被合并企业亏损</b>可带入，但限额 = 被合并企业<b>净资产公允价值 × 合并当年年末最长期限国债利率</b>（单选 20：(7500-5200)×6% = 138 万，与 460 万亏损取小）。为什么设这个闸？因为亏损是「税盾」，不设限就会出现「买一家亏损公司来抵自己的税」。<br>· <b>非股权支付部分仍要确认所得</b>：(被转让资产公允价值 - 计税基础) × (非股权支付金额 ÷ 公允价值)（单选 47：(3200-2000)×200/3200 = 75 万）。收了现金的那一部分，没有递延理由。<br><br>一般性处理则全程相反：被收购方<b>确认</b>所得、收购方按<b>公允价值</b>定计税基础、亏损<b>不得</b>结转（单选 21）。多选 45 的 D 写「股权支付 ≥75%」是旧比例，正确是 <b>85%</b>。","sentence":"特殊性 = 没变现就递延：股权支付 ≥85%、原计税基础结转、亏损限额带入；收了现金（非股权支付）的那一块仍当场确认所得。一般性 = 按公允价值当场卖一遍。","trap":"· 特殊性处理的股权支付比例是 <b>85%</b>，不是 75%；资产/股权转让比例 ≥50%；<br>· 合并企业接受资产的计税基础按<b>原有计税基础</b>，不是公允价值（多选 45 A）；<br>· 100% 直接控制的居民企业间按<b>账面净值</b>划转：划出方、划入方均不确认所得，划入方计税基础按<b>原账面净值</b>（单选 22：5000-1200=3800），折旧也按原账面净值（多选 24）；<br>· 特殊性处理下被合并企业亏损「<b>限额内</b>」弥补，不是全额；<br>· 债务重组以非货币资产清偿要拆成两笔：转让资产所得 + 按公允价值清偿债务的重组所得（多选 44：150+96=246）。","table":{"head":["","一般性税务处理","特殊性税务处理"],"rows":[["是否确认所得","当场确认","暂不确认（非股权支付部分除外）"],["计税基础","公允价值","原计税基础 / 原账面净值"],["亏损","不得结转","限额内由合并企业弥补"],["适用前提","默认","合理商业目的 + 比例 ≥50% + 股权支付 ≥85% + 两个 12 个月"]]},"tips":["一句话记：<b>「一般看公允，特殊看原值」</b>——所有选项只要写反就错。","看到「划转」「合并」「收购」先问：钱出去了没有？出去了多少？"],"qs":[20,21,22,47,24,44,45]},{"id":"4-13","name":"特殊主体与专项政策：REITs、境外投资者再投资、海南自贸港","star":"★★","level":"L2","scene":"这三块看着零散，其实是同一类题：<b>国家为了某个政策目标，给一条专门通道</b>。考法全是「哪条通道、门槛数字是多少」，没有推理空间，只能把边界记准。","why":"· <b>基础设施 REITs 设立阶段</b>：原始权益人把项目公司股权转给 REITs，账上有评估增值，但<b>钱还没真正到手</b>（要等完成募资、支付转让价款）。所以政策给的是<b>「当期暂不缴纳、递延到募资完成后」</b>，不是免税、也不是不征税（单选 23 的 C）。这个「暂不缴」和 4-9 的 5 年递延是同一逻辑。<br>· <b>境外投资者以分得利润境内直接投资</b>：目的是把外资利润留在中国继续投，所以给<b>投资额 10% 的税额抵免</b>（当年不足可结转）。边界很严：增资、新建、股权收购等权益性投资可以，但<b>新增/转增/收购上市公司股份</b>不行（符合战略投资条件除外）；现金利润必须<b>从利润分配企业账户直接转入</b>被投资企业账户，中途不得在其他账户周转；<b>不满 5 年收回</b>要补缴递延税款<b>并且</b>按比例减少抵免额度（单选 55）。<br>· <b>海南自贸港</b>：注册在海南且<b>实质性运营</b>的鼓励类产业企业减按 15%；「实质性运营」要求实际管理机构设在海南并实施实质性全面管理和控制；主营业务须来自《鼓励类产业目录》且<b>收入占比 ≥60%</b>（不是 50%）；目录既含全国性现有鼓励类产业、也含海南新增；总机构在海南以外的，只有设在海南的符合条件分支机构所得适用 15%（多选 46）。","sentence":"三条专门通道：REITs 设立增值「暂不缴、递延到募资后」；境外利润再投资抵免 10% 且资金不得周转；海南 15% 要实质运营 + 主营收入 60% 以上。","trap":"· 单选 23 别选「免征」或「不征」，是<b>暂不缴纳（递延）</b>；<br>· 抵免比例是<b>投资额 10%</b>，创投企业抵扣是<b>投资额 70%</b>抵应纳税所得额——一个是抵<b>税额</b>、一个是抵<b>所得额</b>，别混；<br>· 海南比例 <b>60%</b>，不是 50%；<br>· 收购上市公司股份不属于合格的境内直接投资。","tips":["这块的数字没有逻辑可推，用「<b>暂不缴 / 10% / 60%</b>」三个锚点串起来记。"],"qs":[23,55,46]},{"id":"4-14","name":"税基式优惠：减计、加计、减免所得、创投抵扣","star":"★★★","level":"L3","scene":"同样是「少交税」，这一组动的是<b>税基</b>：要么收入只按 90% 计，要么费用按 200% 扣，要么所得直接免一半。<br><br>它和 4-15 的税率式、税额式优惠是三套并行工具，题目最爱把三者混在选项里问「属于哪一类」。","why":"为什么分三种？因为政策力度和指向不同：<b>减计收入 / 加计扣除</b>是「特定行为给折扣」，<b>减免所得</b>是「整块所得打折」，<b>税率式</b>是「整个企业换个档」，<b>税额抵免</b>是「直接从应纳税额里减钱」——越往后越直接、也越贵，所以条件越严。<br><br><b>必背的几个数字与边界</b>：<br>· <b>减计收入 90%</b>：金融机构农户小额贷款利息（单笔且该农户贷款余额 ≤10 万，不是 15 万）、保险公司为种植业养殖业提供保险的保费、综合利用资源生产<b>国家非限制和禁止</b>且符合标准产品的收入（单选 28；写「限制性产品」是错的）。<br>· <b>研发费用加计 100%</b>（2023 起）：未形成无形资产的按实际发生额再加扣 100%。基数含人员人工、直接投入、折旧、无形资产摊销、新产品设计费等；<b>其他相关费用（如知识产权申请费）限额 = 五项费用之和 ×10%÷(1-10%)</b>；<b>市场调查研究费</b>不属于研发、常规性升级不适用（单选 50 = 1000 万，多选 29）。<br>· <b>委托境外研发</b>：按「实际发生额 80%」与「境内符合条件研发费用的 2/3」<b>孰低</b>为基数；委托境外<b>个人</b>研发不得加计；受托方一律不得再加计（单选 49 = (570+320)×100%=890）。<br>· <b>不能加计扣除的行业</b>：烟草制造、住宿餐饮、批发零售、房地产、租赁和商务服务、娱乐业（多选 33）。<br>· <b>技术转让所得</b>：≤500 万免、超过部分减半；境内转让须经<b>省级以上科技部门</b>认定（不是商务部门）；从直接或间接持股合计达 <b>100%</b> 关联方取得的不享受；未单独计算所得的也不享受（单选 48 = (1300-500)×50%×25%=100 万；多选 27）。<br>· <b>创投企业</b>：股权投资初创科技型企业满 2 年，按<b>投资额 70%</b> 抵扣<b>应纳税所得额</b>，不足可结转（单选 24）。<br>· <b>农林项目</b>：远洋捕捞、林木种植等免税；内陆养殖、香料作物种植等<b>减半</b>（多选 25）。<br>· <b>三免三减半</b>：公共基础设施、环保节能节水项目、农村饮水工程、节能服务公司合同能源管理项目，自<b>项目取得第一笔生产经营收入所属纳税年度</b>起；而集成电路/软件企业自<b>获利年度</b>起（单选 25、多选 26/31）。<br>· 其他：企业出资给高校/非营利科研机构用于基础研究，可<b>100% 加计扣除</b>（多选 31 写 50% 是错的）；证券投资基金买卖股票债券差价、投资者从基金分配取得的收入均<b>暂不征收</b>（多选 30）。","sentence":"先分清动的是哪一层：减计收入(90%)、加计扣除(100%)、减免所得(500 万以内免)、抵扣所得额(创投 70%)、抵免税额(设备 10%)、换税率(15%)。","trap":"· 农户小额贷款门槛是 <b>10 万</b>；<br>· 委托境外研发的「2/3」是<b>境内</b>符合条件研发费用的 2/3，不是全部研发费用；<br>· 技术转让认定机关是<b>科技部门</b>、关联方门槛 <b>100%</b>；<br>· 节能服务公司是<b>三免三减半</b>，不是两免三减半；<br>· 集成电路/软件企业优惠期从<b>获利年度</b>起，公共基础设施项目从<b>第一笔生产经营收入</b>年度起——两个起点最爱对调。","table":{"head":["工具","典型政策","落在哪一层"],"rows":[["减计收入","农户小额贷款利息、种养业保费、资源综合利用","收入 ×90%"],["加计扣除","研发费用、基础研究出资","费用 ×200%"],["减免所得","技术转让、农林项目、三免三减半","所得免/减半"],["抵扣所得额","创投投初创科技型企业","投资额 70%"],["抵免税额","专用设备、境外利润再投资","税额 -10%"]]},"tips":["看到百分比先问：<b>乘在收入上、费用上、所得上，还是直接减税额</b>？问完就不会把 70% 和 10% 搞反。"],"qs":[24,25,28,48,49,50,25,26,27,29,30,31,33]},{"id":"4-15","name":"税率式与税额式优惠：15%、小微、专用设备抵免","star":"★★★","level":"L3","scene":"这一组动的是<b>税率</b>和<b>最终那张税单</b>，力度最大，所以条件也最具体。<br><br>小型微利企业 260 万所得只交 13 万；买一台 600 万的安全生产专用设备，直接少交 60 万税，5 年内转卖又要补回来。","why":"· <b>15% 优惠税率</b>给的是国家想扶持的「身份」：高新技术企业、技术先进型服务企业、西部鼓励类产业企业、海南鼓励类、污染防治第三方企业（多选 28）。注意<b>科技型中小企业</b>本身不是 15% 税率，它的好处是<b>亏损结转 10 年</b>和研发加计，别把它混进来。<br>· <b>小型微利企业</b>是「税基 + 税率」双重优惠：2027 年底前，应纳税所得额<b>减按 25% 计入</b>，再按 <b>20% 税率</b>，实际税负 <b>5%</b>。260×25%×20%=13 万（单选 26）。<b>查账、核定征收都能享受</b>，统一<b>按季</b>预缴，填申报表即可享受、无需审批（多选 32）。<br>· <b>税额抵免</b>：购置并实际使用环保/节能节水/安全生产专用设备，按<b>投资额 10%</b> 直接抵免<b>应纳税额</b>，当年不足可向以后 <b>5 年</b>结转（单选 29：1000×25% - 600×10% = 190）。<b>5 年内转让、出租要停止优惠并补缴已抵免税款</b>；受让方可以就该设备再享受 10% 抵免（单选 30）。<br>· <b>智能化改造</b>：2024–2027 年专用设备数字化智能化改造投入，不超过<b>原计税基础 50%</b> 的部分按 10% 抵免（单选 31：240×50%=120 > 150 取 120，×10%=12）。<br>· <b>集成电路和软件</b>：国家鼓励的重点集成电路设计企业和软件企业，第 1–5 年免、接续年度减按 10%，自<b>获利年度</b>起（单选 25）；「2 免 3 减半」「5 免 5 减半」按线宽和经营期分档，起点按企业或项目不同而不同。","sentence":"小微 = 所得额 ×25% ×20%（实际 5%）；设备抵免 = 投资额 10% 直接减税单，5 年内转卖要补；15% 是身份优惠，科技型中小企业不在这档。","trap":"· 小微实际税负 <b>5%</b>，不是 20%，也不是 25%；<br>· 专用设备抵的是<b>应纳税额</b>，创投 70% 抵的是<b>应纳税所得额</b>；<br>· 设备 5 年内转让由<b>转让方</b>补缴，受让方可另行享受抵免；<br>· 智能化改造投入要<b>先封顶到原计税基础 50%</b> 再乘 10%；<br>· 集成电路软件企业从<b>获利年度</b>起算，公共基础设施项目从<b>第一笔收入年度</b>起算。","tips":["把「抵所得额」和「抵税额」写成两栏贴在桌上：创投 70% 在上，设备 10% 在下。"],"qs":[26,29,30,31,28,32]},{"id":"4-16","name":"核定征收与跨境：算不清账时怎么办","star":"★★★","level":"L3","scene":"公司成本费用一团乱，税务局没法查账，于是给一个<b>应税所得率</b>：收入 600 万 ×15% = 90 万应纳税所得额，×25% = 22.5 万。<br><br>另一头，境外公司在中国没设机构，卖设备顺带安装，合同里没单列安装费；或者跨境电商在综试区里核定征收。这三件事的共同点是：<b>算不清，就用法定比例替代真实核算</b>。","why":"核定征收不是惩罚，是<b>征管上的替代算法</b>：能查清收入总额就用「收入 × 应税所得率」；只能查清成本费用就用「成本 ÷(1-应税所得率) × 应税所得率」；两头都查不清才直接核定税额。跨境电商综试区统一按 <b>4%</b> 应税所得率（单选 32、35）。注意<b>专门从事股权（股票）投资业务的企业不得核定征收</b>。<br><br>跨境那头更难：非居民企业卖中国设备又提供安装劳务，合同不列劳务费，很容易把利润全压到境外去。所以税法规定：无参照标准时，劳务收入<b>不低于销售合同总价款的 10%</b>（单选 33）。<br><br><b>源泉扣缴</b>的四个要点（单选 34、52、多选 34）：<br>· 扣缴义务人是<b>支付人</b>；<br>· 在<b>每次支付或到期应支付</b>时扣（不是合同约定的某个日期，也不是按年）；<br>· 自代扣之日起 <b>7 日内</b>缴入国库；<br>· 税率 <b>10%</b>；股息利息租金特许权费按<b>收入全额</b>，财产转让按<b>差额</b>（单选 52：(100 + 1000-700)×10% = 40 万）。<br><br>非居民免税的三类利息：外国政府向<b>中国政府</b>贷款、国际金融组织向<b>中国政府和居民企业</b>提供优惠贷款、国务院批准的其他所得。国际金融组织向「非居民企业」贷款、外国政府向「中国居民企业」贷款都不在免税名单（多选 34）。","sentence":"查不清账 → 收入×应税所得率（跨境电商 4%）；查不清劳务费 → 不低于合同总价 10%；境外 passive income → 支付人按 10% 源泉扣缴，全额或差额看所得类型。","trap":"· 核定征收的<b>小型微利企业照样能享受优惠</b>；<br>· 源泉扣缴时点是「<b>支付或到期应支付</b>」，不是合同约定日期；<br>· 扣缴税率 10%、解缴 7 日、扣缴义务人是支付人——三个数字题常错；<br>· 财产转让所得按<b>差额</b>，股息利息按<b>全额</b>；<br>· 外国政府向中国居民企业贷款的利息<b>不免税</b>。","table":{"head":["情形","替代算法 / 规则","关键数字"],"rows":[["居民企业核定（能查收入）","收入 × 应税所得率 × 25%","单题 15%"],["跨境电商综试区核定","收入 × 4%","4%"],["非居民劳务费未列明","不低于销售合同总价 10%","10%"],["非居民源泉扣缴","支付人代扣，全额或差额计税","10%、7 日"]]},"tips":["「算不清就给法定比例」是这一章的通用套路：核定所得率 4%、劳务费 10%、限售股原值 15%、委托境外研发 80%。"],"qs":[32,33,34,35,52,34]},{"id":"4-17","name":"利息与借款费用：四个维度、债资比、资本化","star":"★★★","level":"L3","scene":"公司借钱付了 200 万利息，税法只允许扣 120 万。为什么？<br><br>因为借钱这件事，税法先要判断<b>「这是不是一笔正常的借钱」</b>，再判断<b>「钱用到哪儿去了」</b>。","why":"<b>第一问：钱从谁那儿来、给谁付</b>——四个维度：<br>① <b>据实扣除</b>：非金融企业向金融企业借款、金融企业存款利息、金融企业同业拆借、经批准发行债券的利息；<br>② <b>单一限额</b>：非金融企业向非关联方借款、付给无关联自然人 → 本金 × 金融企业同期同类贷款利率；<br>③ <b>双限额</b>：付给<b>关联方</b> → 「权益性投资 ×2（非金融企业）/×5（金融企业）」与「借款本金」取小，再 × 同期同类利率；<br>④ <b>不得扣除</b>：非银行企业内营业机构之间支付的利息。<br><br>为什么关联方要加一道<b>债资比</b>？因为关联方可以随意把「本该投进来的股本」包装成「借款」，用利息把利润提前抽走（资本弱化）。设 2:1 就是划一条线：股本 1000 万，最多认 2000 万的债，超出的 1000 万对应利息不许扣。单选 42：1000×2=2000，2000×6%=120 万。<br><br><b>第二问：钱花在哪儿</b>——为购置建造固定资产、无形资产、以及<b>经过 12 个月以上建造</b>才达到可销售状态的存货，在<b>建造期间</b>的借款费用要<b>资本化</b>进资产成本（以后通过折旧摊销扣）；资产<b>交付使用后</b>发生的利息、以及日常经营不需要资本化的借款费用，才在当期扣（多选 11）。<br><br>同一逻辑还管着<b>金融企业贷款损失准备金</b>：只有「承担风险和损失」的贷款类资产才能按年末余额 1% 计提扣除；<b>委托贷款、代理贷款、国债投资、应收股利、上交央行准备金、剥离的债权股权、应收财政贴息</b>等不承担风险的资产，一律不得提取（多选 12）。","sentence":"先分四维（据实 / 单一限额 / 双限额 / 不得扣），再看用途（建造期间资本化、交付使用后当期扣）；关联方债资比非金融 2:1、金融 5:1。","trap":"· 双限额是「权益投资×倍率」与「借款本金」<b>取小</b>后乘利率，不是直接乘利率；<br>· 资本化门槛是建造期 <b>超过 12 个月</b>的存货；普通存货建造期间利息当期扣；<br>· <b>银行</b>企业内营业机构之间支付的利息<b>可以扣</b>，非银行企业不行（多选 13 G、14 G）；<br>· 罚金、被没收财物损失、税收滞纳金不得扣；<b>违约金、银行罚息、诉讼费</b>可以扣；<br>· 非金融企业向金融企业借款利息据实扣除，别误套限额。","table":{"head":["维度","适用","限额"],"rows":[["据实","向金融企业借款、同业拆借、发债","无"],["单一限额","向非关联方 / 无关联自然人","本金 × 同期同类利率"],["双限额","关联方借款","min(权益×2或5, 本金) × 利率"],["不得扣","非银行企业内机构间利息","—"]]},"tips":["关联方借款题先画两个数：权益投资额 ×2、实际借款额，取小的那个再乘利率。"],"qs":[42,11,12]},{"id":"4-18","name":"亏损弥补：5 年、10 年与重组带来的限额","star":"★★","level":"L2","scene":"2019 年亏了 1000 万，到 2024 年还剩 40 万没补完，2025 年赚了 1600 万——这 40 万还能不能抵？<br><br><b>不能。</b>一般企业亏损最长结转 <b>5 年</b>，2019 年的亏损只能用 2020–2024 年的所得补，2025 年已过期；直接 1800×25%=450 万（单选 45）。","why":"为什么设期限？因为亏损是「未来的税盾」，无限期结转会让企业长期不纳税，也会让税务机关要保存几十年的凭证。5 年是「给足够长的恢复期、又不让账无限敞着」的折中。<br><br>谁可以延长到 <b>10 年</b>？<b>高新技术企业</b>和<b>科技型中小企业</b>——研发投入大、盈利周期长，5 年不够回本。注意是「具备资格年度<b>之前 5 个年度</b>发生的尚未弥补完的亏损」延长，不是所有亏损自动 10 年（多选 15）。<br><br>还有一个容易混的点：<b>被投资企业的亏损由被投资企业自己结转</b>，投资企业不能拿去抵（单选 16 D）；只有<b>企业合并</b>且适用特殊性税务处理时，被合并企业亏损才可由合并企业在限额内弥补（见 4-12）。<br><br>筹办期间的费用<b>不得计算为当期亏损</b>——企业还没开始经营，谈不上「经营亏损」；可以在开始经营当年一次性扣除，或作为长期待摊费用不少于 3 年摊销，一经选定不得改变（多选 42）。","sentence":"一般亏损结转 5 年，高新技术企业/科技型中小企业延到 10 年；被投资方亏损不能给投资方用；筹办费不算亏损。","trap":"· 5 年从<b>亏损年度的次年</b>起算，2019 年亏 → 2020–2024；<br>· <b>技术先进型服务企业、西部鼓励类企业</b>不享受 10 年，只有高新技术和科技型中小企业；<br>· 亏损弥补用的是<b>调整后的应纳税所得额</b>，不是会计利润；<br>· 筹办费可选一次性或 ≥3 年摊销，不是 2 年。","tips":["做亏损题先写一行年份轴，把可弥补年度圈出来，再看当年的所得额。"],"qs":[45,15]},{"id":"4-19","name":"资产损失与税前扣除凭证：拿什么证明钱真的花了","star":"★★★","level":"L3","scene":"仓库里 40 万的原材料被盗，保险赔 25 万、管理员赔 8 万，进项税已抵扣过。税法允许扣多少？<br><br>答案 12.2 万 = 40 + <b>5.2（进项转出）</b> - 25 - 8。很多人漏掉那 5.2 万：因为进项税当初抵扣了，现在货没了，这笔税不能再抵，转出来后它<b>也是企业真实的损失</b>，可以一起扣。","why":"资产损失扣除的底层逻辑是<b>「净损失 + 合法性」</b>：只扣企业真正兜下的那部分（要减赔偿），且必须有证据证明这笔支出真实发生、与经营相关。<br><br><b>凭证规则</b>：境内支出属于增值税应税项目、对方是已办理税务登记的纳税人 → 必须凭<b>发票</b>（含税务机关代开）；对方是无需税务登记的单位或小额零星经营的个人 → 可用税务机关代开发票或<b>收款凭证 + 内部凭证</b>（多选 16）。<br><br>如果对方注销、吊销、被认定非正常户，<b>无法补开发票</b>怎么办？税法给一条补救通道：凭资料证实真实性后允许扣除，其中<b>必备三项</b> = ① 无法补开的原因证明 ② 业务合同或协议 ③ <b>非现金</b>方式支付的付款凭证；出入库内部凭证、运输证明、会计核算记录属于补充资料，不是必备（多选 17）。为什么强调非现金？因为现金支付无法第三方验证，最容易虚构交易。<br><br><b>损失认定条件</b>也全是「证据强度」问题：应收账款要债务人死亡遗产不足清偿、债务重组后无法追偿、自然灾害；仅「逾期 1 年未清偿预计难收回」<b>不够</b>，需逾期 <b>3 年以上</b>且有确凿证据无力清偿（多选 21）。股权投资损失要求被投资方依法破产/注销，或连续停止经营 <b>3 年以上</b>且无恢复计划；「投资期限超过 5 年」「清算期超过 1 年」都不达标（要 10 年 / 3 年，多选 22）。<br><br>追补规则：以前年度<b>实际资产损失</b>准予追补至损失发生年度扣除（一般不超过 5 年），多缴的税可在追补确认年度抵扣；<b>法定资产损失</b>则在申报年度扣除（多选 23）。已扣除的损失以后又收回的，计入<b>收回当期</b>收入，不是原损失年度。","sentence":"净损失 = 成本 + 不得抵扣的进项转出 - 保险赔款 - 责任人赔偿；扣除凭证以发票为主，补不开票时必备「原因证明 + 合同 + 非现金付款凭证」三项。","trap":"· 已抵扣进项税的被盗/霉烂存货要做<b>进项转出</b>，并计入损失一起扣；<br>· 「逾期 1 年」「清算期超过 1 年」「投资超过 5 年」都是教材故意调低的错误数字；<br>· 无法补开发票时，<b>出入库内部凭证不是必备资料</b>；<br>· 已扣损失以后收回，计入<b>收回当期</b>，不追溯；<br>· 实际资产损失追补到<b>发生年度</b>，法定资产损失在<b>申报年度</b>扣。","table":{"head":["损失类型","扣除条件要点"],"rows":[["存货被盗","成本 + 进项转出 - 保险 - 责任人赔偿"],["应收账款","逾期 3 年以上且确凿无力清偿 / 破产 / 重组 / 灾害"],["股权投资","破产注销，或停营 3 年以上无恢复计划；无控制且投资 >10 年"],["补不开票","原因证明 + 合同 + 非现金付款凭证（三项必备）"]]},"tips":["看到「预计难以收回」「超过 1 年」这类软措辞，先怀疑数字被调低了。"],"qs":[46,16,17,21,22,23]},{"id":"4-20","name":"其他扣除边界：不得扣除项目、手续费佣金、筹办费、平台劳务报酬","star":"★★","level":"L2","scene":"企业之间付的管理费、被没收财物的损失、向投资者支付的股息、烟草企业的烟草广宣费——这些<b>一律不能扣</b>；而违约金、银行罚息、诉讼费、银行内部机构间利息<b>可以扣</b>。<br><br>这一块就是把「哪些钱税法认」的边界一次划清。","why":"不得扣除项目的共同点：<b>要么不是经营代价，要么扣了会破坏别的制度</b>。向投资者支付股息是利润分配（不是费用）；企业之间支付的管理费、内营业机构间利息容易被用来转移利润；罚金、滞纳金、被没收财物损失若允许扣，等于国家替违法者买单；非广告性质赞助、为投资者付的商业保险费与经营无关。<br><br><b>手续费及佣金</b>分三档（多选 43）：<br>① <b>据实扣除</b>：从事代理服务、主营收入就是手续费佣金的企业（证券、期货、保险代理等）；<br>② <b>限额但可结转</b>：保险企业按「全部保费收入 - 退保金等」余额的 <b>18%</b>；<br>③ <b>限额不可结转</b>：电信企业按收入总额 <b>5%</b>；其他企业按服务协议确认收入金额的 <b>5%</b>。另外发行权益性证券的手续费佣金属资本性支出，冲减资本公积、不得当期扣；<b>除委托个人代理外，现金等非转账方式支付</b>的手续费佣金不得扣。<br><br><b>互联网平台企业</b>是 2026 年新考点（单选 56）：要<b>同时</b>完成个人所得税扣缴申报、增值税及附加税费代办申报并缴款，且按规定留存实名核验、业务交易明细等真实性资料，才能凭完税凭证<b>据实扣除</b>劳务报酬；只办个税、或没留存资料、或用内部付款凭证，都不行。<br><br><b>筹建期</b>：广告费和业务宣传费按实际发生额计入筹办费，业务招待费按 <b>60%</b> 计入；筹办费不算亏损，可在开始经营当年一次性扣除或作为长期待摊费用 <b>不少于 3 年</b>摊销，一经选定不得改变（多选 42）。","sentence":"不得扣的四类：利润分配、内部转移、违法代价、与经营无关；手续费佣金三档（代理据实 / 保险 18% 可结转 / 电信及其他 5% 不可结转）。","trap":"· 「<b>非银行</b>企业内营业机构之间支付的利息」不得扣，「<b>银行</b>企业」可以；<br>· 烟草企业的<b>烟草</b>广宣费一律不得扣；<br>· 预提的维简费不得扣，实际发生且属收益性支出的才可以；<br>· 电信企业 5% 的基数是<b>收入总额</b>，其他企业是<b>合同确认的收入金额</b>；<br>· 保险企业 18% 超额可结转，其他企业 5% 超额不可结转；<br>· 平台企业只完成个税扣缴<b>不够</b>，必须同时办增值税及附加代办申报。","table":{"head":["企业类型","手续费佣金限额","超额结转"],"rows":[["证券 / 期货 / 保险代理等","据实扣除","—"],["保险企业","净保费收入 18%","可结转"],["电信企业","收入总额 5%","不可结转"],["其他企业","合同确认收入 5%","不可结转"]]},"tips":["「据实扣除」的那一档看的是<b>主营业务本身就是手续费佣金</b>，不是行业名头。"],"qs":[56,13,14,42,43]},{"id":"4-21","name":"征收管理：纳税年度、汇算清缴、跨地区汇总纳税","star":"★","level":"L1","scene":"一年中间才开业、或者中途终止经营，这一年怎么算？
