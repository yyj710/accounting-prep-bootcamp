数电发票：单一联次、自动交付、开错只能<b>红冲不能作废</b>；发票总额度是「不含税」口径。","sentence":"义务时间 = 收钱、约定付款、完成孰先，先开票看开票；专票三红线：免税、自然人、差额扣除部分。","trap":"· 10 日/15 日计税期是「期满 <b>5 日</b>内预缴」，不是 15 日（多选 25 的 D 选项就是坑）；<br>· 总分机构「只能分别申报」——错，经批准可汇总；「随便汇总」也错；<br>· 数电票开错<b>不能作废</b>只能红字；总额度是<b>不含税</b>上限；<br>· 贷款利息：结息日起 90 天内的应收未收利息照章纳税，超 90 天的暂不缴、实收时再缴。","qs":[14,15,25,26,41,42,43]},{"id":"2-21","name":"特殊业务合集：预付卡、平销返利、白送股票、反向开票、混合vs兼营","star":"★★","level":"L2","scene":"五个零碎业务，每个都可能考一道：卖购物卡；商场收厂家的销售返利；把股票白送给另一家公司；废品回收站从大爷手里收纸箱开不出票；电梯厂卖电梯顺带安装。","why":"· <b>单用途预付卡</b>：卖卡/充值只是「收钱代管」，预收资金<b>不征</b>增值税；持卡人消费时，真正卖货的商户纳税（且不再给持卡人开票）；售卡方只就办卡的<b>手续费、服务费</b>按经纪代理 6% 交。一句话：卡在谁手里不重要，消费发生时才算交易。<br>· <b>平销返利</b>：商场按销量从厂家拿的返利，本质是「事后价格折让」——所以<b>冲减进项</b>（返利÷(1+税率)×税率），不是确认销项。方向千万别反。<br>· <b>无偿转让股票</b>：转出方按「买入价=卖出价」处理，差价为 0，不交税；下家再卖时，以<b>原转出方的买入价</b>为成本。防止无偿转让把成本洗没、国家吃亏。<br>· <b>反向开票</b>：资源回收企业从个人手里收废品，个人开不出票——让<b>收购方反过来给个人开票</b>，链条就接上了。一般计税的回收企业可反向开专票+普票，简易计税的只能开普票；同一自然人 12 个月累计不得超 500 万。<br>· <b>混合 vs 兼营</b>：一笔交易里的主从关系（卖设备+安装、卖软件+培训）→ 按主业税率，叫混合交易；两笔独立生意（建材店又卖建材又给人装修）→ 分别核算各算各的，不分就从高，叫兼营。判断就一句：<b>是「一笔买卖」还是「两笔生意」</b>。","sentence":"卖卡不征、消费才征；返利冲进项不冲销项；白送股票按原买入价零差价；反向开票补断链；一笔买卖按主业、两笔生意分开算。","trap":"· 平销返利冲<b>进项</b>不是算销项——多选 35 题四个选项三个在考这个方向感；<br>· 混合销售里的「销售机器设备+安装」按<b>货物 13%</b>，安装不单独按建筑 9%（分别核算也不分行——政策强制）；<br>· 反向开票给同一自然人 12 个月不能超 500 万；<br>· 售卡方卖卡时只能开<b>普票</b>，不能开专票。","qs":[4,47,10,29,34,35]}],"questions":[{"no":1,"type":"single","block":"2-3","stem":"下列应税交易中，应按照“生产生活服务”计征增值税的是（　）。","opts":{"A":"无运输工具承运业务","B":"快递企业提供快递服务","C":"装饰服务","D":"保险服务"},"ans":"B","exam":"税目归类——同一笔钱叫什么名字，直接决定税率。","think":"快递是「收派服务」，归在物流辅助服务里，属于生产生活服务。A 无运输工具承运：你没车但承诺把货运到，卖的是「运输结果」，算交通运输；C 装饰服务是建筑服务；D 保险是金融服务。","trap":"「无运输工具承运」听名字像代理，但它要承担承运人责任，所以是交通运输——别被「无运输工具」四个字带偏。","raw":"选项A：按“交通运输服务”计征；选项B：按“生产生活服务——物流辅助服务（收派服务）”计征；选项C：按“建筑服务”计征；选项D：按“金融服务”计征。"},{"no":2,"type":"single","block":"2-3","stem":"港口设施经营人收取港口设施保安费，属于增值税征税范围中的（　）。","opts":{"A":"经纪代理服务","B":"物流辅助服务","C":"鉴证咨询服务","D":"其他生产生活服务"},"ans":"B","exam":"「保安费」这个词的伪装。","think":"别看到「保安」就去找安全保护服务——看业务实质：它是港口设施经营人围绕港口运营收的钱，跟着港口走，按「物流辅助服务——港口码头服务」。","trap":"归类的钥匙永远是「这项收入依附于什么业务」，不是字面叫什么。","raw":"港口设施经营人收取的港口设施保安费按照“物流辅助服务——港口码头服务”缴纳增值税。"},{"no":3,"type":"single","block":"2-2","stem":"下列行为中，需要计算缴纳增值税的是（　）。","opts":{"A":"取得贷款利息","B":"收取行政事业性收费","C":"员工为受雇单位提供取得工资的服务","D":"依照法律规定被征收而取得补偿"},"ans":"A","exam":"征税范围的门槛：四类「有钱拿也不征」。","think":"B 是政府履行管理职能的收费，C 是雇佣关系不是经营，D 是公权力补偿——三个都不是经营交易。A 取得贷款利息=你在放贷，资金占用费是金融服务，要征。","trap":"记方向：钱<b>存</b>进去拿利息（存款利息）不征；钱<b>贷</b>出去收利息（贷款利息）要征。","raw":"不征收增值税的情形：(1)员工为受雇单位或雇主提供取得工资、薪金的服务；(2)收取行政事业性收费、政府性基金；(3)依法被征收、征用而取得补偿；(4)取得存款利息收入。"},{"no":4,"type":"single","block":"2-21","stem":"关于单用途商业预付卡增值税的规定，下列表述正确的是（　）。","opts":{"A":"售卡方可以向购卡人开具增值税专用发票","B":"售卡方在销售单用途卡时，取得预收资金需缴纳增值税","C":"持卡人使用单用途卡购买货物时，货物的销售方不缴纳增值税","D":"售卡方因发行单用途卡并办理相关资金收付结算业务时，取得的手续费应按规定缴纳增值税"},"ans":"D","exam":"预付卡三段论：卖卡、消费、手续费，各是什么待遇。","think":"卖卡只是「收钱代管」，预收资金不征（B 错）、只能开普票（A 错）；持卡人消费时，真正卖货的商户照章纳税（C 错）；售卡方真正的收入是办卡和结算的<b>手续费</b>，按经纪代理服务 6% 交（D 对）。","trap":"一句话：卡只是钱的搬运工，消费发生时才算交易，售卡方只赚手续费就只交手续费的税。","raw":"选项A：售卡方销售单用途卡可向购卡人开具增值税普通发票，不得开具专用发票；选项B：售卡或接受充值取得的预收资金不缴纳增值税；选项C：持卡人消费时，销售方应按规定缴纳增值税且不得向持卡人开票。"},{"no":5,"type":"single","block":"2-6","stem":"下列关于增值税一般纳税人登记管理的表述中，正确的是（　）。","opts":{"A":"经常发生应税交易的个体工商户年应征增值税销售额超过500万元，应当登记为一般纳税人","B":"纳税人年应征增值税销售额未超过规定标准，办理一般纳税人登记的，一般纳税人生效之日为办理登记的次月1日","C":"纳税人因自行更正调整销售额，年应征增值税销售额超过规定标准的，应自调整之日起15个工作日内办理一般纳税人登记","D":"年应征增值税销售额未超过规定标准的纳税人一律不得登记为一般纳税人"},"ans":"A","exam":"500 万这条线的细节：超了必须登记，没到也能登记。","think":"A 对：超 500 万是「应当登记」，个体户经常发生应税交易不豁免。B 错：生效日是「办理登记的当期 1 日」，不是次月 1 日。C 错：是调整之日起 10 个工作日，不是 15 个。D 错：没超标的，会计核算健全的可以主动登记。","trap":"「500 万」是<b>应当</b>登记的线，不是<b>才能</b>登记的线——D 选项把方向说反了。数字记 10 个工作日（追溯调整情形）。","raw":"选项B：生效之日为办理登记的当期1日；选项C：应自调整之日起10个工作日内办理；选项D：未超标准但会计核算健全、能提供准确税务资料的，可以办理登记。"},{"no":6,"type":"single","block":"2-6","stem":"关于增值税纳税人和扣缴义务人的规定，下列表述正确的是（　）。","opts":{"A":"单位以挂靠方式经营，挂靠人以被挂靠人名义对外经营但由被挂靠人承担相关法律责任的，被挂靠人为纳税人","B":"报关进口货物，以进口货物的发货人为纳税人","C":"资管产品运营过程中发生的增值税应税交易，以资管产品管理人为纳税人","D":"境外单位在境内提供应税服务，以购买方为纳税人"},"ans":"C","exam":"谁是纳税人：名义+责任、收货人 000-9000)÷(1+6%)×6%=452.83（D 对）。公允价值 15000 是干扰项。","trap":"别拿公允价值 15000 当甲的卖出价（会算成 B）。无偿转让股票的政策就是「不让无偿行为洗掉成本」：甲零差价，乙继承 9000 的成本。","raw":"纳税人无偿转让股票时，转出方以该股票的买入价为卖出价计算缴纳增值税，甲公司销项=0；转入方再转让时以原转出方的买入价为买入价，乙公司销项=(17000-9000)÷(1+6%)×6%=452.83（元）。"},{"no":35,"type":"multi","block":"2-21","stem":"某商场为增值税一般纳税人，与其供货企业甲饼干厂达成协议，按销售量的一定比例进行平销返利。2026年1月从甲饼干厂购进饼干取得增值税专用发票，注明价款160万元、增值税20.8万元，当月按平价全部销售，月末甲饼干厂按照协议支付给商场含税返利3.8万元。下列关于该项业务的处理，符合增值税有关规定的有（　）。","opts":{"A":"商场应以160万元作为计税销售额计算销项税额","B":"商场该项业务的销项税额为20.36万元","C":"商场该项业务的进项税额为20.8万元","D":"商场应冲减进项税额0.44万元"},"ans":"AD","exam":"平销返利：返利用来冲进项，不动销项。","think":"平价销售：销项=160×13%=20.8（A 对 B 错）。返利冲进项：3.8÷(1+13%)×13%=0.44（D 对），实际进项=20.8-0.44=20.36（C 错——20.8 是票面数，冲完才是真的）。","trap":"四个选项在玩「销项和进项谁动」的方向游戏：返利是供货方给的价格折让，所以买方冲<b>进项</b>。记不住的联想：返利=进货变便宜了=进项要减。","raw":"平销返利中商业企业向供货方收取的与销量挂钩的返还收入，应冲减当期进项税额=3.8÷(1+13%)×13%=0.44；销项=160×13%=20.8（万元）。"},{"no":36,"type":"multi","block":"2-13","stem":"（非标准题）增值税一般纳税人发生的下列行为中，可以选择适用简易计税方法计征增值税的有（　）。","opts":{"A":"水利工程供应天然水","B":"收取开工日期在2016年4月30日前的高速公路的车辆通行费","C":"资管产品管理人运营契约制资管产品过程中发生的增值税应税交易","D":"转让2016年10月1日取得的不动产","E":"提供教育辅助服务","F":"从事再生资源回收的纳税人销售其收购的再生资源","G":"批发零售抗癌药品"},"ans":"ABCEFG","exam":"简易计税白名单大点兵，唯一的假项藏在日期里。","think":"A 天然水比照自来水、B 2016.4.30 前开工的高速公路通行费、C 资管产品运营、E 教育辅助、F 再生资源回收、G 抗癌药品——都在名单。D 错：只有 <b>2016.4.30 前</b>取得的不动产才能选简易，2016.10.1 取得的不行（营改增分界线）。","trap":"D 的陷阱是日期：2016.4.30 是营改增的「老项目」分界，之后取得的不动产只能一般计税 9%。名单类多选题里总有一个日期/限定词陷阱。","raw":"选项D：转让2016年4月30日前取得的不动产可选择简易计税；之后取得的只能按一般计税9%计算销项税额。"},{"no":37,"type":"multi","block":"2-17","stem":"下列关于进口环节增值税的表述中，正确的有（　）。","opts":{"A":"小规模纳税人进口环节一律适用征收率","B":"跨境电子商务零售进口商品单次交易限值为人民币5000元","C":"在计算进口环节的应纳增值税额时不得抵扣任何税额","D":"进口货物增值税的纳税人是进口货物的收货人或办理报关手续的单位和个人"},"ans":"BCD","exam":"进口环节三规则：用税率、不抵扣、收货人。","think":"A 错：进口环节不分一般/小规模，一律按<b>税率</b>（征收率是简易计税的东西，进口不用）。B 对：跨境电商单次限值 5000（年度 26000）。C 对：进口环节没有「进项」概念，不抵扣任何税额。D 对：纳税人是收货人或报关人。","trap":"A 是身份陷阱：「小规模=征收率」在进口环节失效。进口缴的增值税拿到专用缴款书后在内销环节可抵——那是下一步，不矛盾。","raw":"选项A：除另有规定外，即便是小规模纳税人，进口环节计征增值税也适用税率，不适用征收率。"},{"no":38,"type":"multi","block":"2-19","stem":"（非标准题）下列各项中，免征增值税的有（　）。","opts":{"A":"个体工商户销售自己使用过的机器设备","B":"外国企业无偿援助的进口设备","C":"农业生产者销售外购的农产品","D":"残疾人的组织直接进口供残疾人专用的物品","E":"营利性美容医疗机构提供的医美服务","F":"图书馆举办文化活动的第一道门票收入","G":"学校提供的学历教育服务"},"ans":"DFG","exam":"免税清单的四个「限定词」陷阱。","think":"D 残疾人组织进口专用品、F 图书馆第一道门票、G 学历教育——免。A 错：自然人卖自用物品才免，个体户不免。B 错：外国<b>政府、国际组织</b>无偿援助才免，外国企业不免。C 错：农业生产者卖<b>自产</b>农产品才免，外购不免。E 错：医疗机构免，营利性美容医疗不算医疗机构。","trap":"四个假项各带一个限定词：自然人（不是个体户）、政府国际组织（不是企业）、自产（不是外购）、非营利医疗（不是医美）。多选题的限定词就是雷区。","raw":"选项A：自然人销售自己使用过的物品免征，个体工商户不免；选项B：外国政府、国际组织无偿援助的进口物资设备免征，外国企业不在内；选项C：农业生产者销售自产农产品免征；选项E：营利性美容医疗机构不属于免税的医疗机构。"},{"no":39,"type":"multi","block":"2-19","stem":"一般纳税人下列业务中，对增值税实际税负超过3%的部分实行增值税即征即退政策的有（　）。","opts":{"A":"将进口软件产品进行本地化改造后对外销售","B":"提供管道运输服务","C":"销售自产符合规定的资源综合利用产品","D":"销售自产的利用海上风力生产的电力产品"},"ans":"AB","exam":"「超 3% 即征即退」的名单：软件和管道运输。","think":"A 本地化改造的进口软件、B 管道运输——实际税负超 3% 部分即征即退。C 资源综合利用是按 30/50/70/90/100% 分档退税；D 海上风电是即征即退 50%——都是「按比例退」，不是「超 3% 退」。","trap":"「超 3% 退」和「按比例退」是两种机制，选项把后两个混进来。记名单：软件、管道运输、动漫等=超 3%。","raw":"选项C：资源综合利用按30%—100%分档即征即退；选项D：2025.11.1—2027.12.31海上风电实行即征即退50%。"},{"no":40,"type":"multi","block":"2-18","stem":"（非标准题）下列出口行为中，适用增值税免税并退税政策的有（　）。","opts":{"A":"特殊区域内的企业出口的特殊区域内的货物","B":"生产企业出口视同自产货物","C":"进料加工复出口货物","D":"来料加工复出口货物","E":"纳税人销售给特殊区域内的生活消费用品和交通运输工具","F":"纳税人以自营名义出口，其出口的同一批货物既签订购货合同，又签订代理出口合同的","G":"非列名生产企业出口的不符合视同自产条件的外购货物"},"ans":"BC","exam":"出口三档待遇：免税并退税 / 免税不退 / 照章征税。","think":"B 视同自产、C 进料加工复出口：免税并退税。A 特殊区域货物、D 来料加工（料是保税进的，没垫过税，无税可退）、G 非视同自产外购货：免税不退。E 卖给特殊区域的生活消费品/交通工具、F 假自营真代理：照章征税。","trap":"判断链条：进料加工垫过税→能退；来料加工保税进口→没得退。「免税并退税」要求链条上真的有税可退。","raw":"选项ADG：适用免税不退税政策；选项EF：适用征税政策。"},{"no":41,"type":"multi","block":"2-20","stem":"下列关于增值税纳税义务发生时间的表述中，正确的有（　）。","opts":{"A":"将自产货物用于交际应酬的，为货物发出的当日","B":"进口货物，为货物报关进口的当日","C":"无偿转让无形资产，为无形资产转让完成的当天","D":"先收取价款再分期或分次提供服务的，为收到价款的当天"},"ans":"ABC","exam":"义务发生时间：一般规则+视同+进口+分期服务。","think":"A、C 是视同销售：完成视同交易的当日（货物发出/转让完成）。B 进口：报关当天。D 错：先收款再分期服务的，按「首次实际开始提供服务」和「合同约定」孰先——不是简单看收款日。","trap":"D 的坑在「为收到价款的当天」听起来很合理，但规则是孰先原则：服务开始日 vs 合同日，谁早算谁。","raw":"选项D：先收取价款再分期或分次提供服务的，以首次提供服务的实际开始当日和合同约定的当日孰先确定，并就收到的全部价款申报纳税。"},{"no":42,"type":"multi","block":"2-20","stem":"（非标准题）增值税一般纳税人发生下列应税交易时，不得开具增值税专用发票的有（　）。","opts":{"A":"商业企业销售劳保用品","B":"纳税人提供旅游服务，准予扣除的向旅游服务购买方收取并支付给其他单位或个人的费用","C":"药品经销企业销售免税药品","D":"纳税人代理进口免税货物向委托方收取并代为支付的款项","E":"向李某销售住房","F":"金融商品转让","G":"融资性售后回租中，对外支付的借款利息","H":"教育部教育考试院及其直属单位在境内开展考试代为收取并支付给境外单位的考试费"},"ans":"BCDEFGH","exam":"专票三条红线的 8 选项实战版。","think":"红线：免税（C 免税药品）、自然人（E 李某）、差额扣除部分（B 旅游代付、D 代理进口代付、H 代收考试费）、金融类特殊（F 金融商品转让、G 售后回租的借款利息）。A 劳保用品正常货物，能开专票——唯一的「能开」。","trap":"9 选 8 的题心理压力巨大，但逻辑就一个：开了专票下家就能抵，所以「国家没收上家税」的环节一律不许开。A 是特意留的正常项，敢选就行。","raw":"选项A：可以正常开具增值税专用发票。不得开专票的情形包括：免税项目、购买方为自然人、差额计税的扣除部分、金融商品转让等。"},{"no":43,"type":"multi","block":"2-20","stem":"下列关于增值税纳税地点和计税期间的表述中，正确的有（　）。","opts":{"A":"以10日或者15日为一个计税期间的，自次月1日起15日内申报纳税","B":"不经常发生应税交易的纳税人，可以按次纳税","C":"有固定生产经营场所的纳税人，总机构和分支机构不在同一县（市）的，只能分别向各自所在地的主管税务机关申报纳税","D":"无固定生产经营场所的纳税人，应当向其应税交易发生地主管税务机关申报纳税"},"ans":"ABD","exam":"纳税地点的层级：机构所在地为原则，不动产所在地有例外。","think":"A 对（衔接 25 题规则）。B 对：不经常发生应税交易可按次。C 错在「只能」——经省级以上财政、税务批准可以由总机构汇总申报。D 对：无固定场所在交易发生地。","trap":"「只能」「一律」这类绝对词在征管题里几乎都是错的——税法处处留有「经批准可汇总」的弹性口。","raw":"选项C：总机构和分支机构不在同一县（市）的应分别申报，经省级以上财政、税务主管部门批准，可以由总机构汇总申报纳税。"}],"notes":{"blocks":[{"id":"2-1","name":"环环抵扣：增值税到底在对什么征税","star":"★★★","level":"L3","scene":"一块面包的旅程：面粉厂把面粉卖给面包厂 100 元（收 13 元税），面包厂做成面包卖给超市 300 元（收 39 元税），超市卖给消费者 500 元（收 65 元税）。<br><br>注意看面包厂：它<b>收了 39 元，但只交给国家 26 元</b>——因为它手里有一张面粉厂开的 13 元发票，可以抵掉。超市同理：收 65 元，交 65-39=26 元。最后国家一共收到 13+26+26=65 元，正好等于最后零售价 500 的 13%。<br><br>看出门道了吗？<b>每个环节只对自己「加出来的那截价值」交税</b>，税像接力棒一棒棒往下传，最后全部砸在买面包的消费者头上。前面的人只是代收，不是负担。","why":"为什么国家要费这么大劲设计成「环环抵扣」？想想反面：如果每一环都按<b>全额</b>征税（以前的营业税就是这样），货每倒一次手就被扒一层皮。那企业会怎么应对？——把所有环节都吞进自己肚子里，搞「大而全」，从面粉到面包全自己干，中间没有交易就没有重复征税。社会分工就死了。<br><br>抵扣制让每个环节只对自己创造的增值负责：你分工越细、外包越多，税上越不吃亏。这叫<b>税收中性</b>——税不干扰你的经营决策。<br><br>但这个设计有一个命门：凭什么相信你上家交过税？<b>凭票</b>。增值税专用发票就是这条链上的「完税证明」。这一章后面所有让你头疼的规则，全是这一句话的推论：<br>· 没票（或票不合规）→ 不能抵，因为无法证明上家交过；<br>· 拿去搞集体福利、个人消费 → 不能抵，因为货被吃掉了，链条到你这里断了，不会再产生销项；<br>· 管理不善货丢了 → 抵过的要吐出来（进项转出），同理；<br>· 出口 → 不但不收你的，还把链条上收过的全退给你，让货「裸价」出海。","sentence":"增值税不是对「你」征的，是对「你手上增值的那一段」征的。你只是替国家向下家收钱，再拿上家的票证明别人已经交过。","trap":"「增值税由卖方承担」——错。卖方只是过手，最终承担者是<b>终端消费者</b>。还有：「增值税是价内税」——错，它是<b>价外税</b>，税款独立于价格之外单独列示，这也是它能一环环传递的前提。","table":{"head":["环节","售价(不含税)","销项税","进项税","实际缴纳"],"rows":[["面粉厂 → 面包厂","100","13","0","13"],["面包厂 → 超市","300","39","13","26"],["超市 → 消费者","500","65","39","26"],["国家合计收到","—","—","—","65 = 500×13%"]]},"tips":["后面每学一条规则，都回来问一句：这是不是在维护「凭证链」和「只对增值征税」？是，就看懂了。","「销项 - 进项」不是公式，是这台机器的运转方式。"],"qs":[]},{"id":"2-2","name":"征税范围的门槛：境内、有偿、经营，三条缺一不可","star":"★★","level":"L2","scene":"三笔进账：你在公司上班拿到工资；你家房子被政府依法征收，拿到补偿款；你把 10 万块存进银行，年底拿到利息。<br><br>三笔钱都是「收入」，但增值税一分都不征。凭什么？","why":"增值税只管一件事：<b>经营活动中的有偿交易</b>。拿这三条卡一下：<br>· 工资——你和单位是雇佣关系，不是做生意，缺「经营性」；<br>· 征收补偿——是政府动用公权力拿走你的财产后给的补偿，不是你自愿卖的，缺「交易性」；<br>· 存款利息——这是你把钱借给银行的对价，本来够得上，但国家选择不征（银行端已经就贷款利息交过了，两头都征不合理）。<br><br>所以看到任何一笔钱，判断顺序是：先问是不是经营活动（把工资、行政事业性收费、征收补偿剔出去），再问发生在不在境内，最后才轮到税率多少、能不能扣。","sentence":"四类「有钱拿也不征」：员工拿工资、收行政事业性收费/政府性基金、依法被征收拿补偿、取得存款利息。","trap":"最毒的混法：把「存款利息」（不征）和「贷款利息」（银行要征，6%）放一起考。记方向：<b>钱存进去，不征；钱贷出去，征</b>。另外「取得财政补贴」要看挂不挂钩——和销售收入/数量直接挂钩的补贴要征，不挂钩的不征。","tips":["做题先看题干问的是「不征收」还是「免征」：不征是根本不在这个税的地盘里，免征是在地盘里但国家抬手放行——免税的进项不能抵，不征的没这个问题。"],"qs":[3]},{"id":"2-3","name":"税目归类：这门生意在税法上叫什么名字","star":"★★★","level":"L3","scene":"同一艘船，配着船员租给你跑一趟运输，叫「交通运输服务」9%；空船租给你自己开，叫「有形动产租赁」13%。同一栋楼，给你住叫「不动产租赁」9%，把楼里的广告位租给你贴海报，也叫不动产租赁。<br><br>税务局收到一笔钱，第一件事就是问：<b>这是什么生意？</b>因为名字直接决定税率，归错类，后面全错。","why":"归类不是背字典，逻辑只有一条：<b>看你卖的核心到底是什么</b>。三个判断口诀（来自你老师的课件）：<br><br>① <b>带人带物是运输，只带资产是租赁</b>。程租、期租、湿租都配了人（船员/机组），你买的是「运输」这个结果，按交通运输；光租、干租只给船和飞机，人你自己找，那是出租资产，按租赁。<br>② <b>修理看动不动</b>。修的是动产（机器、汽车）→ 加工修理修配 13%；修的是不动产（房屋）→ 建筑服务里的修缮 9%。<br>③ <b>实质重于形式</b>。融资性售后回租：名义上你把设备卖给租赁公司再租回来，实质上设备从没挪窝，你只是拿它当抵押借了笔钱——所以按「贷款服务」6%，不按租赁。<br><br>剩下的都是这条逻辑的展开：快递是「收派服务」（物流辅助 6%）不是邮政（邮政只有中国邮政集团能做）；酒店会议室连带配套服务开会，卖的是「会议展览」不是「住宿」。","sentence":"归类三问：卖的核心是什么？带不带人？修的东西动不动？","trap":"高频陷阱清单：<br>· 港口设施<b>保安费</b> → 物流辅助（港口码头服务），不是安全保护，也不是经纪代理；<br>· <b>快递</b> → 物流辅助-收派服务，不是交通运输，更不是邮政；<br>· <b>卫星电视信号落地转接</b> → 增值电信服务，不是交通运输也不是广播影视；<br>· <b>出租车公司收司机的管理费</b> → 交通运输（车是公司的，司机是打工的）；<br>· 宾馆提供<b>会议场地+配套服务</b> → 会议展览服务，不是住宿；<br>· <b>游览场所里</b>的索道、摆渡车 → 文化体育服务，不是交通运输；<br>· <b>航道疏浚</b> → 物流辅助-港口码头服务；其他疏浚 → 建筑服务。","table":{"head":["业务","税目","税率"],"rows":[["程租、期租、湿租（配人）","交通运输服务","9%"],["光租、干租（不配人）","有形动产租赁","13%"],["融资性售后回租","金融服务-贷款服务","6%"],["修车（动产）","加工修理修配","13%"],["修房（不动产）","建筑服务-修缮","9%"],["快递、装卸、仓储","物流辅助服务","6%"],["车辆停放、道路通行","不动产经营租赁","9%"]]},"tips":["老师口诀：「带人带物是运输，只带资产是租赁」——这一句话能解决多选题里一整类选项。"],"qs":[1,2,9,1,2,27,28]},{"id":"2-4","name":"「境内」怎么算：四样东西各有一条地点线","star":"★★","level":"L2","scene":"韩国公司给日本公司位于<b>中国</b>的写字楼做室内设计——要在中国交税。法国餐厅在<b>法国</b>给中国明星做了一顿饭——不在中国交税。新加坡公司转让在深交所发行的股票——要交。<br><br>都发生在「境外」，为什么待遇不同？","why":"「境内」不是地理概念，是按货物品类分别画线：<br>· <b>货物</b>：看起运地或所在地；<br>· <b>不动产、自然资源</b>：看坐落地（房子在境内，谁也跑不掉）；<br>· <b>金融商品</b>：看在不在境内发行，或销售方是不是境内单位个人；<br>· <b>服务、无形资产</b>：看「在不在境内消费」。境外单位卖服务给境内单位，原则上算境内消费、要征——<b>除非</b>这个服务必须人到现场才能消费（吃饭、理发、旅游），人不在境内就消费不了，这才算「境外现场消费」，不征。<br><br>韩国公司那单：服务和境内不动产直接相关，跑不掉。法国餐厅那单：吃饭必须人在场，明星在法国吃的，境外现场消费，不征。","sentence":"货物不动产看地点，金融看发行，服务看消费地；唯一的逃生口是「境外现场消费」。","trap":"别把规则简化成「接受方在境内就征」——境外现场消费是例外。反过来也别以为「发生在境外就不征」：服务和境内不动产直接相关的、金融商品在境内发行的，照样征。","qs":[32]},{"id":"2-5","name":"视同销售 vs 不得抵扣：货物出了厂门的两条路","star":"★★★","level":"L3","scene":"面包厂的三批面包：一批送给客户品尝，一批发给员工当年货，一批老板搬回家自己吃。三批都没卖一分钱，税务处理一样吗？<br><br>再换个问法：如果面包不是自家产的，是从外面买来再发给员工的，处理还一样吗？","why":"回到 2-1 的抵扣链。这批面包用的面粉，进项税<b>已经抵过了</b>。现在面包不进入流通、被直接「吃掉」，链条断在你手里，国家在这条链上颗粒无收。怎么办？两条补丁，用哪条看货物的「出身」：<br><br>· <b>自产 / 委托加工的货物</b>：你在厂里创造了增值（面粉变成了面包），这个增值必须完税——<b>视同销售</b>，按市场售价补一笔销项税。送去福利、个人消费、无偿赠送，都是。<br>· <b>外购的货物</b>：你没创造增值，只是买错了用途——不用补销项，但当初抵的进项<b>要吐出来</b>（不得抵扣/进项转出）。<br><br>一句话区分：<b>自产的讲「增值要完税」，外购的讲「抵扣要回吐」</b>。<br><br>还有个不看出身的例外：<b>无偿转让</b>（白送别人）——自产的、外购的，一律视同销售；无偿转让无形资产、不动产、金融商品，单位和个人都视同。因为东西送出去后还在流通链上（别人手里），链条没断，只是该你交的环节不能逃。","sentence":"自产进门（福利/消费/送人）→ 视同销售补销项；外购进门（福利/消费）→ 不视同，进项转出；外购送人 → 视同销售。方向正好相反，盯住「货是哪来的、去哪了」。","trap":"最爱混的一对：外购货物「<b>发下去</b>」（集体福利/个人消费）不视同、进项转出；外购货物「<b>送出去</b>」（无偿转让）要视同销售。还有一个反常识点：用于<b>公益事业或以社会公众为对象</b>的无偿转让，不视同——义捐不征税。","table":{"head":["货物来源","无偿转让/送人","集体福利、个人消费"],"rows":[["自产、委托加工","视同销售","视同销售"],["外购","视同销售","不视同，进项不得抵扣/转出"],["无形/不动产/金融商品（不论来源）","视同销售（公益除外）","—"]]},"tips":["核定销售额的顺序：先自己同类均价 → 再别人同类均价 → 最后组成计税价格（成本×(1+成本利润率)，应税消费品还要加回消费税）。税务机关不能跳着来。"],"qs":[39,32]},{"id":"2-6","name":"纳税人与扣缴义务人：谁来交、500 万这条线、境外怎么扣","star":"★★","level":"L2","scene":"三个场景：① 挂靠车队的车出了事故，到底谁是纳税人——开车的还是车队？② 一家年销售 600 万的个体户，必须升级成一般纳税人吗？400 万的呢？③ 境外公司给境内单位设计 logo，收了 5150 元，这笔税谁来交、怎么算？","why":"① <b>谁是纳税人看「名义+责任」</b>：挂靠人以被挂靠人名义对外经营、且由被挂靠人承担法律责任的，被挂靠人是纳税人——名义和责任在同一个人身上，就锁定他；不满足就还是实际经营的挂靠人。<br><br>② <b>500 万是「应当登记」线，不是「能不能登记」线</b>。连续不超过 12 个月（或 4 个季度）累计应征销售额超 500 万，必须登记；没到 500 万但会计核算健全的，可以主动登记（为了进抵扣链、给客户开专票）。两个例外：自然人（非个体户）永远是小规模；不经常发生应税交易的非企业性单位可以选择按小规模。<br><br>③ 境外单位在境内没有机构，中国的税务局够不着它——所以让<b>付款方</b>当扣缴义务人：你付钱之前先把税扣下来交给国家。算法是价税分离后乘税率：5150÷(1+6%)×6%。注意它是扣缴义务人，纳税人还是境外单位。","sentence":"名义责任合一锁定纳税人；500 万是必须登记的线不是只能登记的线；境外服务购买方扣缴，含税÷(1+税率)×税率。","trap":"· 报关进口货物，纳税人是<b>收货人</b>（或办报关手续的），不是境外发货人；<br>· 资管产品运营中的应税交易，纳税人是<b>管理人</b>；<br>· 年应征销售额不含「偶然发生的卖无形资产、卖不动产」的收入，但<b>含</b>稽查查补和自行更正调整的销售额；<br>· 超标后生效日是「当期 1 日」，追溯调整的是「调整之日起 10 个工作日内」办理。","tips":["扣缴计算的税率跟着业务走：设计、咨询这类生产生活服务是 6%，别看到境外就想当然用别的档。"],"qs":[5,6,8,3]},{"id":"2-7","name":"税率四档：13 / 9 / 6 / 0，不是背的是懂的","star":"★★★","level":"L3","scene":"都是吃的：玉米胚芽 9%，奶油 13%。都是住相关的：卖房子 9%，出租吊车 13%。都是服务：交通运输 9%，贷款服务 6%。<br><br>税率表看起来像随机抽签，其实背后是一套政策逻辑。","why":"四档税率对应四个政策意图：<br><br>· <b>13% 默认档</b>：工业品、加工修理修配、有形动产租赁。没什么特殊照顾的理由，就用基本税率。<br>· <b>9% 民生档</b>：跟「吃饱、住下、出门、读书、种地」直接相关的——农产品、油盐、自来水暖气燃气、图书报刊、饲料化肥农机农膜，外加交通运输、邮政、基础电信、建筑、不动产租售、转让土地使用权。税率定低一点，民生成本就低一点。<br>· <b>6% 轻资产档</b>：现代服务、金融、生活服务、增值电信、卖无形资产（土地使用权除外）。这些行业最大的特点是<b>没什么进项可抵</b>——成本主要是人，人开不出专票。税率定高了它们扛不住。<br>· <b>0% 出海档</b>：出口货物、跨境的特定服务和技术。让国货、国服务「裸价」出海抢市场。<br><br>老师口诀：<b>动产销售 13%，不动建筑 9%，服务无形 6%</b>。","sentence":"13 是默认，9 是民生，6 是轻资产服务，0 是出海。判断时先归类（2-3），税率自动跟上。","trap":"· 玉米胚芽 9%，但玉米浆、玉米淀粉 13%；巴氏杀菌乳 9%，奶油 13%——加工越深越接近 13%；<br>· 农机整机 9%，农机<b>零部件</b> 13%；<br>· 转让<b>土地使用权</b> 9%（跟着不动产走），其他无形资产（商标、技术）6%；<br>· 修理修配是 13% 的「劳务」，不是 6% 的服务——老师课件专门点了这个易混点；<br>· 废弃物专业化处理：没产生货物 6%（专业技术服务）；产生货物归委托方 13%（视同受托加工）；归受托方则处理费 6%、卖货另按货物税率。","table":{"head":["档位","范围","记忆锚点"],"rows":[["13%","货物、加工修理修配、有形动产租赁","能动的东西"],["9%","农产品/油盐/水气暖/书报/农资 + 交通/邮政/基础电信/建筑/不动产/土地使用权","民生+基础"],["6%","现代服务、金融、生活服务、增值电信、其他无形资产","靠人吃饭的行业"],["0%","出口货物、跨境特定服务与技术","裸价出海"]]},"tips":["多选题里税率常和税目一起考：先把生意归对类（2-3 的口诀），税率是水到渠成的事。"],"qs":[7,4,5,30]},{"id":"2-8","name":"销售额①：什么算进销售额——代收转付不算","star":"★★","level":"L2","scene":"4S 店卖一辆车，收了三笔钱：车款、内饰加装费、代保险公司收的车船税。前两家店吵起来了：一家说三笔都算销售额，一家说只有车款算。都对了一半。","why":"判断标准特别朴素：<b>这钱最终进谁的口袋</b>。进自己口袋的（车款、加装费、包装费、违约金、手续费）——全部价款加价外费用，都进销售额。只是过手的「代收转付」——钱在你账上转一圈就给别人了，你不是真正的收款方，不并入。<br><br>税法明确列了四类过路财神：① 代收的政府性基金/行政事业性收费；② 受托加工应税消费品时代收代缴的消费税；③ 代收的车辆购置税、车船税；④ 以委托方名义开发票代收的款项。","sentence":"全部价款+价外费用进销售额；四类「代收转付」不进。判断口诀：这钱最终归谁。","trap":"· 保险公司代收的车船税不并入（选项里爱把它混进「价外费用」）；<br>· <b>包装物租金</b>是价外费用，收取当期就并入——它和包装物「押金」是两回事，押金有递延规则（见 2-9），租金没有；<br>· 商业企业收取的<b>平销返利</b>不并进销售额也不算价外费用——它是冲减进项（见 2-21）。","qs":[8]},{"id":"2-9","name":"销售额②：五种特殊卖法——折扣、折让、以旧换新、押金、以物易物","star":"★★★","level":"L3","scene":"商场里同一天的五笔生意：全场 8 折促销；一批货有瑕疵给客户让了 15% 的价；跟大客户说「20 天内付款再减 2%」；空调以旧换新；卖白酒收了包装物押金。<br><br>五笔都「少收了钱」或「多收了钱」，税务处理全不一样。","why":"按「这笔钱什么时候、为什么变动」分类，就再也混不了：<br><br>· <b>商业折扣（折扣销售）</b>：卖之前讲好价。销售额和折扣额在<b>同一张发票的「金额」栏</b>分别注明 → 按折后价计税。写在备注栏 = 没写，按原价。为什么是「金额栏」？因为税务只看发票上能咬死的数字，备注栏没有证明力。<br>· <b>现金折扣（销售折扣）</b>：货早卖了，这是求你早点还钱的融资费用——买卖已经完成，折扣和货无关，<b>不许扣</b>。<br>· <b>销售折让</b>：货有质量问题退一部分钱——这笔交易的真实成交价本来就低了，<b>可以扣</b>（开红字发票冲减）。<br>· <b>以旧换新</b>：一般货物按<b>新货全价</b>，不许扣旧货作价——否则你随便给旧货估个高价就能把销售额做没了。例外：金银首饰按<b>实际收取的差价</b>，因为旧金银是有公允价格的硬通货，国家认。<br>· <b>包装物押金</b>：一般货物+啤酒黄酒——单独核算、没逾期、没超 1 年就不并，逾期才并；<b>其他酒（白酒等）</b>——收取当期就并入，逾期不再重复算。为什么酒类特殊？酒包装值钱、押金高，放一年再征太容易藏税。<br>· <b>以物易物 / 还本销售</b>：以物易物双方都按购销处理（各算销项、凭票抵进项）；还本销售按全额，还本支出不许扣。","sentence":"售前折按折后（金额栏注明）；售后折（现金折扣）不许扣；质量折让可以扣；以旧换新看是不是金银；押金：啤酒黄酒跟着一般货走逾期才征，白酒等其他酒收取就征。","trap":"· 折扣写<b>备注栏</b>=按全额（单选 35/36 题就是这对母子题）；<br>· 2/20、n/30 是现金折扣，<b>不得</b>从销售额扣减——和 15% 折让同题出现时各走各的规则；<br>· 白酒押金收取即征，逾期<b>不再</b>征——别两头都算；<br>· 金银首饰以旧换新按差价，但别忘了差价也是含税额，要 ÷(1+13%)。","table":{"head":["名目","为什么少收/多收","计税销售额"],"rows":[["商业折扣","售前促销","折后价（金额栏注明才认）"],["现金折扣","售后催款","折前全价，不许扣"],["销售折让","质量补偿","折后价（红字发票）"],["以旧换新-一般货","回收旧物","新货全价"],["以旧换新-金银","回收旧物","实收差价"],["押金-啤酒黄酒/一般货","担保包装归还","逾期或超1年才并入"],["押金-其他酒类","担保包装归还","收取当期即并入"]]},"tips":["这一块是计算题常客：先判断属于哪种「折」，再决定基数，最后才价税分离。顺序错了全盘皆输。"],"qs":[34,35,36,37,38]},{"id":"2-10","name":"差额计税：上游给不了票时的补救机制","star":"★★★","level":"L3","scene":"旅行社收你 700 元团费，转手替你付掉 320 住宿、80 交通、20 签证。如果按 700 全额计税，它替你垫的 420 也被征了一遍——它明明只赚了差价。<br><br>类似的还有：劳务派遣公司代发工资、客运场站代付承运方运费、房企向政府交的土地出让金。","why":"这些行业有个共同痛点：<b>付出去的大头拿不到专票</b>（付给个人、境外、政府）。抵扣链条天然断裂，按全额征税就是重复征税。国家的补救：既然没有进项票可抵，那就直接从<b>销售额</b>里把这截砍掉——这叫差额计税。<br><br>所以「差额」两个字背后永远是一个意思：<b>替别人收的钱，别算我的收入</b>。<br><br>金融商品转让是另一种差额：你 10 万买入 12 万卖出，增值的只有 2 万差价，本金不是增值——按卖出价-买入价计税，负差年内可结转，年底清零。<br><br>正面记住轻二这份清单就够：金融商品转让、客运场站（减运费）、航空运输（减代收他航票款）、机票代理（减净结算款）、签证代理（减签证认证费）、考试费（减付境外）、代理进口免税货（减代付货款）、融资租赁（扣两息一税）、融资性售后回租（不含本金，扣两息）、劳务派遣安保（减代付工资社保）、旅游（减住宿餐饮交通签证门票接团费）、房企一般计税（减土地价款）、建筑简易计税（减分包款）、金银以旧换新（减旧饰作价）。","sentence":"差额 = 防止「替别人收的钱」被重复征税。看到代收代付、转付、垫资，就往差额上想。","trap":"· <b>贷款服务是全额</b>——利息收入全额计税，不许扣你付出去的利息。它和旅游服务是多选题里最常被互换的一对；<br>· 差额扣除的部分<b>不得开专票</b>（下家对这部分无税可抵，开了就乱套），只能开普票；<br>· 房企差额扣的是「土地价款」（出让金、征地拆迁、前期开发、出让收益+货币形式拆迁补偿），<b>不含契税</b>；<br>· 建筑服务只有<b>简易计税</b>才差额扣分包款，一般计税下分包款走正常进项抵扣。","table":{"head":["业务","差额基数"],"rows":[["金融商品转让","卖出价-买入价（负差年内结转）"],["旅游服务","全额-住宿餐饮交通签证门票-接团费"],["劳务派遣/安保","全额-代付工资福利社保公积金"],["建筑服务(简易)","全额-分包款"],["房企卖自开发项目(一般计税)","全额-土地价款"],["客运场站","全额-付承运方运费"],["融资租赁","全额(含本金)-两息-车辆购置税"],["融资性售后回租","全额(不含本金)-两息"]]},"tips":["差额计税大多挂着「2027 年 12 月 31 日截止」的期限标签，做题时不用管，记规则即可。"],"qs":[11,12,33,6,7]},{"id":"2-11","name":"进项①：没有专票也能抵的三张口算抵扣","star":"★★★","level":"L3","scene":"你出差：坐飞机拿到行程单，坐大巴拿到公路客票，过桥过闸拿到通行费发票。行政部买食堂用的大米，从农民手里收，开的是收购发票。<br><br>没有一张是增值税专用发票——但税法全给留了口子，让你「计算抵扣」。","why":"为什么国家愿意在没专票的情况下也让抵？因为这些场景的上游<b>天生开不出或很难开出专票</b>：客运司机、收费站、农民。不让抵，就等于让下游企业替整个链条的「不规范」买单，抵扣链在这里断掉，增值税中性的设计就破功了。<br><br>所以规则是「凭证替代+公式计算」：<br>· <b>国内旅客运输</b>：航空行程单/铁路电子客票——按票面<b>注明或包含的税额</b>抵；列明旅客身份的公路、水路客票——票面金额÷(1+3%)×3%。<br>· <b>桥、闸通行费</b>：通行费发票金额÷(1+5%)×5%（注意：财政票据样式，按 5% 反算）——这里的 5% 是<b>计算抵扣的反算率</b>，不是简易计税征收率，新法统一征收率不影响它；<b>道路通行费</b>电子普票——按票面注明税额。<br>· <b>农产品</b>：收购发票/销售发票——买价×9% 计算抵。为什么是计算抵？因为农民自产自销免税、开不出带税额的票，国家就让你按买价「虚拟」出一笔进项。","sentence":"专票按票面税额抵；行程单/铁路票按注明税额抵；公路水路客票÷1.03×3%；桥闸通行费÷1.05×5%；农产品收购价×9%。","trap":"· 农产品从小规模取得 3% 专票：按<b>金额×9%</b> 计算抵，不是按票面税额抵（反直觉，专票反而不用票面数）；<br>· 批发零售环节的<b>蔬菜、部分鲜活肉蛋</b>免税，拿到的普通发票<b>不能</b>计算抵扣——免税环节没有税可传；<br>· 农产品买来直接用于<b>集体福利</b>（发职工的 1 吨黄芩）不能抵——能抵的只是用于生产经营的那部分，按用途拆；<br>· 旅客运输抵扣的是<b>国内</b>旅客运输且要列明身份信息，国际机票不行。","table":{"head":["凭证","怎么抵"],"rows":[["增值税专用发票 / 海关缴款书","票面注明税额"],["航空行程单 / 铁路电子客票","票面注明(包含)的税额"],["公路、水路客票(列明身份)","票面金额÷(1+3%)×3%"],["桥、闸通行费发票","金额÷(1+5%)×5%"],["农产品收购/销售发票","买价×9%"]]},"tips":["烟叶是农产品里的特殊生：买价=收购价款+10% 价外补贴+烟叶税（收购价款×1.1×20%），再乘 9% 抵。"],"qs":[13,14,40,48]},{"id":"2-12","name":"进项②：什么不能抵 & 已经抵了怎么吐出来","star":"★★★","level":"L3","scene":"仓库被雷劈了一批货；仓管疏忽另一批发了霉；买月饼发给职工过中秋；向银行贷款付了一笔「投融资咨询费」；买的厂房一半生产应税药一半生产免税药。<br><br>五笔进项，哪几笔能抵？","why":"还是那条链：<b>进项能抵的前提是这批投入还要继续进入流通、产生销项</b>。链条断了，抵扣资格就没了。断法有三种：<br><br>· <b>非正常损失</b>：因<b>管理不善</b>（被盗、丢失、霉烂变质）或<b>违法违规</b>（被没收、被强拆）导致货没了。链断在你手里，抵过的吐出来。注意：自然灾害（雷击、洪水）<b>不是</b>非正常损失——天灾不可抗力，能抵。人祸才转出。<br>· <b>集体福利、个人消费</b>：货被吃掉用掉了，退出流通，不抵/转出。<br>· <b>贷款服务相关</b>：贷款利息进项不能抵（因为存款端不征，利息这环国家选择不打通），连带给贷款方付的投融资顾问费、手续费、咨询费也一并不许抵。餐饮、居民日常、娱乐服务购进直接用于消费的，同处理。<br><br>转出的算法看当初怎么抵的：凭票抵的→按票面税率转出；农产品计算抵的→账面成本÷(1-扣除率)×扣除率（先还原成买价再算）；分不清的→按免税/简易项目销售额占比分摊。<br><br>还有一个反直觉的特例：<b>固定资产、无形资产、不动产</b>既用于应税又用于免税/简易等项目（混用），原值 ≤500 万的，<b>全额可抵</b>——货要按比例分摊，固定资产不用。","sentence":"断链三情形：管理不善/违法的非正常损失、集体福利个人消费、贷款相关费用——抵了也要转出。天灾可抵，人祸才转。","trap":"· 雷击毁损<b>能抵</b>，霉烂变质<b>不能抵</b>——「天灾 vs 人祸」是多选常客；<br>· 混用的<b>货物</b>按销售额占比分摊；混用的<b>固定资产/无形/不动产</b>≤500 万全额抵——考的就是这对反差（单选 44/45 母子题）；<br>· 现金赔付下保险公司把钱直接赔给汽修厂：不算保险公司购进修理服务，<b>保险方不能抵</b>；<br>· 非正常损失转出要连「对应的进项」一起转：香水被盗，转的是它耗用外购原料那部分（成本×原料占比×税率），不是整个成本。","table":{"head":["情形","转出公式"],"rows":[["凭票抵扣的","发票金额×税率"],["农产品计算抵扣的","账面成本÷(1-9%)×9%"],["无法划分(兼用于免税/简易)","全部进项×免税简易销售额占比"],["长期资产改变用途","对应进项×净值率"]]},"qs":[18,44,45,33]},{"id":"2-13","name":"简易计税与小规模：不玩抵扣链，直接乘征收率","star":"★★","level":"L2","scene":"街角小饭馆年收入 80 万，让它建账算进项、销项不现实。国家给它一条活路：收入直接乘个征收率，交完拉倒。这就是简易计税。","why":"简易计税 = <b>放弃抵扣，换低征收率</b>。适用于两类人：<br><br>· <b>小规模纳税人</b>：默认简易计税。<b>2026 年新法把征收率统一为 3%</b>（《增值税法》第 11 条），旧法下销售不动产等 5% 的档次已经取消。2026.1.1—2027.12.31 优惠期：3% 的项目<b>减按 1%</b>，但财政部税务总局 2026 年第 10 号公告明确<b>排除销售、出租不动产或转让土地使用权</b>——这几类仍按 3%，不参与减征。起征点：按月 10 万 / 按季 30 万，以下免征——差额计税的项目先差额再和起征点比。<br>· <b>一般纳税人的特定业务</b>：公共交通、装卸搬运、非学历教育、教育辅助、老项目建筑、2016.4.30 前取得的不动产转让、资管产品运营……这些行业共同点是进项天然就少（人力密集/历史资产），强制一般计税法它们血亏，所以给个选择题。<br><br>选简易的代价：对应进项不能抵。所以这是一道「进项多不多」的计算题，不是身份题。","sentence":"简易 = 不抵进项、全额×征收率；新法征收率统一 3%；优惠期一般业务减按 1%、不动产类不减；季 30 万是免税线；差额项目先差额再比线。","trap":"· 「减按 1%」是 2027 年底前的<b>限时</b>优惠，且<b>不动产类不适用</b>——同一道题里可能同时出现 1% 和 3%（单选 51 就考这个）；<br>· 别把「征收率 3%」和「预缴换算率 5%」混为一谈：前者是算税用的，后者只出现在老不动产项目过渡期的预缴公式里；<br>· 起征点按<b>差额后</b>余额判断（小规模建筑分包扣完再比 30 万）；<br>· 出租住房给小规模/个体户有专门口径：个体户出租住房按 <b>1.5%</b> 实际征收率（教材表格口径）；<br>· 直接收费金融服务<b>不能</b>选简易——多选题里拿它凑「可以选简易」的选项就是陷阱；<br>· 预收租金一次性开票的：全额在开票当期计税，别分摊。","qs":[10,46,50,51,24,36]},{"id":"2-14","name":"旧货与二手车：「自己用过的」和「收来卖的」两本账","star":"★★","level":"L2","scene":"三种「卖旧东西」：你把自己开了三年的车卖了；旧货店卖收来的二手电脑；二手车行卖收来的车。都叫「卖旧的」，税率天差地别。","why":"税法先问一个问题：<b>你当初买它的时候抵过进项吗？</b><br><br>· 一般纳税人卖<b>自己用过的固定资产</b>：当初抵过进项的→按正常税率（链是通的）；当初按规定<b>不得抵扣且没抵</b>的（比如专用于免税项目）→ 3% 减按 2%，因为你没进过抵扣链，按全额征税对你不公平。<br>· <b>经营旧货</b>（收别人的来卖，二手车除外）：3% 减按 2%。旧货的上家多是个人，你收进来就没有进项，给个减按照顾。<br>· <b>二手车经销</b>：0.5%（2027 年底前的行业扶持，力度最大）。<br>· 小规模卖自己用过的/旧货：叠加 2027 年底前 3% 减按 1%。<br><br>全部都别忘了价税分离：÷(1+征收率)×征收率。","sentence":"自己用过的固定资产：抵过按税率、没抵过减按 2%；经营旧货减按 2%；二手车 0.5%。先看身份，再看抵没抵过。","trap":"· <b>自然人</b>卖自己用过的物品<b>免</b>增值税，但<b>个体工商户</b>卖自己用过的<b>不免</b>——「个人」和「个体户」一字之差；<br>· 减按 2% 的算法是 ÷(1+2%)×2%？不——政策口径是按 3% 征收率减按 2%，即 ÷(1+2%)×2% 是错的口径要小心：轻二答案是直接 ÷(1+2%)×2%（2026 新口径），做题跟题目给的答案走，关键是<b>不要忘记价税分离</b>；<br>· 二手车 0.5% 也是含税先 ÷(1+0.5%)。","table":{"head":["卖方/货","处理"],"rows":[["一般纳税人卖已抵进项的固定资产","正常税率 13%"],["一般纳税人卖未抵进项的固定资产","3% 减按 2%"],["经营旧货(非二手车)","3% 减按 2%"],["二手车经销","减按 0.5%"],["小规模(2027年底前)","3% 减按 1%"]]},"qs":[19,20,21]},{"id":"2-15","name":"房地产专题：预缴、房企差额、个人卖房租房","star":"★★★","level":"L3","scene":"B 市的建筑公司跑去 M 省 N 市盖桥；房企拿地盖楼再卖；个体户把两年前买的住房转手；李某把房子出租一次性收了一年租金。<br><br>不动产这块有个共同动作：<b>预缴</b>。","why":"为什么不动产业务要预缴？因为<b>不动产坐落地和机构所在地经常不一致</b>：公司在 A 地注册，楼在 B 地盖、在 B 地卖。税全部回 A 地交，B 地政府白提供公共服务了。折中方案：<b>不动产所在地先预缴一笔，机构所在地再申报清算</b>，多退少补。<br><br>预缴公式统一是「基数÷(1+税率或征收率)×预征率」——<b>分母用的是计税方法对应的税率/征收率，乘的才是预征率</b>，两者不是一回事，这是本节最容易混的地方。<br><br>先分清新旧法：2026 年新法把简易计税<b>征收率统一为 3%</b>（旧法不动产 5% 的档次取消），所以新项目算税一律 3%（单选 51 按 3% 就是这个道理）。但教材答案册的预缴表里，<b>2016.4.30 前取得的老不动产项目在 2026.1.1—2027.12.31 过渡期</b>仍保留 5% 的换算口径——那是过渡期预缴，不是现行征收率，别拿它去算新项目的税。<br><br>预征率记三档：建筑服务跨区——一般计税 2%、简易计税 3%（基数都是「总包-分包」差额）；房企预售自开发楼盘——3%（基数是预收款）；不动产出租/销售异地按教材表格口径（自建全额、非自建差额）。<br><br>房企一般计税还有一个特殊差额：<b>卖楼时可以扣掉土地价款</b>（出让金、征地拆迁、前期开发、出让收益+货币拆迁补偿）——因为土地出让金交给政府拿不到专票，土地成本又是房企最大头，不差额就是灾难。注意：<b>契税不扣</b>，且按已售面积比例分摊扣除。<br><br>个人卖住房（不含个体户一般纳税人）：看<b>持有年限</b>——不足 2 年：全额按 3% 征收率；满 2 年：免。个体户里的一般纳税人不适用这个免税，正常一般计税 9%。自然人出租住房：一次性收租可按租赁期<b>月均分摊</b>再对起征点（月 10 万），所以预收一年 9.6 万，月摊 8000，免税。","sentence":"不动产三件套：跨区先预缴（建筑 2%/3%、房企预售 3%）；分母看计税方法、乘的是预征率，两者别混；新法征收率统一 3%，老项目过渡期预缴表里的 5% 是历史口径；房企一般计税可扣土地价款不含契税；个人卖房看 2 年，自然人出租按月摊。","trap":"· 建筑预缴基数是「总包-分包」<b>差额</b>，且简易计税 ÷(1+3%)×3%、一般计税 ÷(1+9%)×2%——两套换算率别换错（单选 25/26 母子题就考这个）；<br>· 房企差额扣土地价款时<b>契税不扣</b>，且按销售面积比例扣；<br>· 个体户<b>一般纳税人</b>卖住房不享受「满 2 年免」——身份把免税资格卡掉了（子题 2 专考）；<br>· 总分支机构不同县市原则分别申报，经省级批准才能汇总——不是「只能分别」也不是「随便汇总」；<br>· 教材表格里老不动产项目过渡期（至 2027.12.31）还写 5%，那是<b>预缴换算率</b>；新法下新项目征收率统一 3%，别拿 5% 去算税。","table":{"head":["业务","预征率（教材答案册口径）","基数"],"rows":[["建筑(一般计税)","2%","(总包-分包)÷(1+9%)"],["建筑(简易)","3%","(总包-分包)÷(1+3%)"],["房企预售(一般)","3%","预收款÷(1+9%)"],["出租不动产(一般/简易)","3% / 5%（老项目过渡）","租金"],["销售不动产(一般/简易)","5% / 5%（老项目过渡）","自建全额、非自建差额"]]},"qs":[24,25,26,27,28,29,30,31,9,31]},{"id":"2-16","name":"加计抵减与留抵退税：国家给的两种「额外现金」","star":"★★★","level":"L3","scene":"两家企业的两种烦恼：<br>A 是先进制造业，国家想扶持它——除了正常抵进项，再「凭空」多给一笔抵减额。<br>B 是租赁公司，年初购入大批设备，进项一大堆，可业务刚起步销项还没上来，账上趴着 8000 万「留抵税额」——这钱按规定只能留着以后慢慢抵，可公司现在就没现金了。","why":"两种烦恼对应两个政策工具：<br><br>· <b>加计抵减</b>（2023.1.1—2027.12.31）：名单内企业按「当期可抵扣进项税额」的一定比例<b>额外</b>计提抵减额——先进制造业 5%，集成电路、工业母机 15%。本质是产业补贴套了增值税的壳。使用规则：先算正常应纳税额；应纳税额>0 时拿加计抵减额去冲，冲不完结转下期；应纳税额=0 时全额结转。注意<b>出口</b>部分对应的进项不能计提（出口已经享受了退税，不能吃两碗），进项转出要同步调减加计抵减额。<br><br>· <b>留抵退税</b>：把「未来才能抵的进项」提前变现救现金流。退多少看「<b>新增</b>留抵」：和上一年度 12 月 31 日的存量比，多出来的部分才算；再乘「进项构成比例」（你进项里凭票类占比）；再分档打折——1 亿以内部分 ×60%，超 1 亿部分 ×30%（制造业等 4 行业和房地产另有口径）。拿过留抵退税的，不得再享受即征即退、先征后返——<b>二选一</b>。","sentence":"加计抵减 = 多给你抵（5% / 15%），先算正常税再拿它冲；留抵退税 = 提前给你钱，算新增、乘构成比例、分档打折。","trap":"· 加计抵减的计提基数是「当期<b>可抵扣</b>进项税额」，出口对应的进项要剔除，已转出的要调减；<br>· 「可计提未计提的」可以在确定适用当期<b>一并补提</b>——多选题爱反着出；<br>· 留抵退税算的是<b>增量</b>（和上年末存量比），不是全部期末留抵；<br>· 留抵退税与即征即退<b>互斥</b>；办完免抵退税后仍符合条件的，可以办留抵退税（顺序是：先免抵退，后留抵退）。","table":{"head":["工具","给谁","力度"],"rows":[["加计抵减 5%","先进制造业","进项×5% 额外抵"],["加计抵减 15%","集成电路、工业母机","进项×15% 额外抵"],["留抵退税","符合条件纳税人","新增留抵×构成比例×60%(1亿内)/30%(超出)"]]},"qs":[15,16,17,41,42,43,12,13,16,17]},{"id":"2-17","name":"进口环节：组成计税价格 + 跨境电商的特殊算法","star":"★★","level":"L2","scene":"进口一批高档化妆品，海关先收关税，再收消费税，最后收增值税——而且增值税的税基里居然把关税、消费税都包进去了。<br><br>另一边，个人在跨境电商平台买 4500 元羽绒服，税却打七折。","why":"进口环节征增值税的理由：让进口货和国产货<b>站在同一条起跑线上</b>。国产货的价格里叠着生产流通各环节的增值税；进口货进来时身上什么税都没有，不补一道就不公平。<br><br>补多少？组成计税价格 = 关税完税价格 + 关税 + 消费税。换句话说：进口增值税的税基 = 货物真实落地成本（含消费税的货要还原：÷(1-消费税税率)）。然后乘增值税<b>税率</b>——注意，<b>不分一般纳税人还是小规模，进口环节一律用税率，不用征收率</b>。因为征收率是「没有进项的简化算法」，进口环节恰恰是要把链条补齐。<br><br>跨境电商零售进口是特殊照顾通道：单次 ≤5000 元、年度 ≤26000 元 → 关税 0，增值税消费税按法定额 <b>70%</b> 征收；纳税人是购买商品的个人，电商平台/电商企业/物流企业可以做代收代缴义务人。","sentence":"进口组价 = (完税价+关税)÷(1-消费税率)，再×增值税率；进口不分规模全用税率；跨境电商限值内关税免、增值税打 7 折。","trap":"· 「小规模纳税人进口按征收率」——错，进口环节一律按<b>税率</b>；<br>· 进口环节不得抵扣任何税额（没有进项的概念），但进口缴纳的增值税拿到专用缴款书后，可以在<b>内销</b>环节作进项抵扣——别混；<br>· 跨境电商别把「关税 0」记成「全免」：增值税消费税照收，只是 ×70%。","qs":[22,23,18,37]},{"id":"2-18","name":"出口退税：免抵退（生产企业）vs 免退（外贸企业）","star":"★★★","level":"L3","scene":"同样把货卖到国外：螺丝厂是<b>自产自营出口</b>，用「免抵退」；外贸公司是<b>从工厂买来再出口</b>，用「免退」。为什么两套算法？","why":"零税率的目标是让出口货「裸价出海」——不但出口环节不收销项，还要把前面环节吃进来的进项<b>退掉</b>。问题是生产企业还有内销，进项池子是内外销混在一起的，没法直接说「哪笔进项对应出口」，所以设计了「免抵退」四步：<br><br>① <b>剔</b>：征税率和退税率的差（比如 13% vs 9%），这部分国家不退，转进成本：出口销售额×(13%-9%)。<br>② <b>抵</b>：算当期应纳税额 = 内销销项 - (全部进项 - 剔出来的) - 上期留抵。出口销项是 0 不算。算出来是负数，说明进项有富余。<br>③ <b>算</b>：算国家最多能退多少 = 出口销售额×退税率（免抵退税额）。<br>④ <b>比</b>：②的留抵 和 ③的上限，<b>谁小退谁</b>。差额叫「免抵税额」——不是退你的现金，是拿去「抵」了你内销该交的税（所以叫免抵），这部分还要计城建税。<br><br>外贸企业没有生产过程，出口的就是买来的那批货，直接：<b>购进金额×退税率</b>，干净利落。","sentence":"免抵退四步：剔（征退差转成本）、抵（算应纳税额）、算（退税上限）、比（留抵和上限谁小退谁）。外贸免退：买价×退税率。","trap":"· 「免抵税额」<b>不是退给你的钱</b>，是被内销销项吃掉的那部分——但它要作为城建税计税依据；<br>· 金融商品转让的负差结转规则别搬到这里来，两个制度；<br>· 来料加工复出口免税<b>不退</b>（料本来就是保税进的，没垫过税）；进料加工复出口适用免抵退；<br>· 特殊区域内企业出口区域内货物：免税不退；卖给特殊区域的生活消费用品、交通工具：照常征税。","table":{"head":["步骤","公式","在干嘛"],"rows":[["①剔","出口额×(征税率-退税率)","国家少退的部分转成本"],["②抵","内销销项-(进项-①)-上期留抵","算出当期应纳税额"],["③算","出口额×退税率","退税天花板"],["④比","②的留抵 vs ③，取小","确定实退，差额为免抵税额"]]},"tips":["轻二原话：免抵退是「笑面虎」，理解难、做题易——把四步当流程图背下来，照走就行。"],"qs":[53,54,40]},{"id":"2-19","name":"税收优惠：免税清单、即征即退、离境退税","star":"★★","level":"L2","scene":"卖自己种的菜免，卖外购的菜不免；学校学费免，赞助费不免；国债利息——2025 年 8 月 8 日成了分水岭，之前的老券继续免，之后新发的不免。<br><br>免税清单长得像背不完，其实逻辑只有三类。","why":"免税的逻辑：<br>· <b>民生底线</b>：蔬菜、部分鲜活肉蛋批发零售、学历教育、医疗服务（不含营利性美容）、养老育养、残疾服务、个人转让著作权/自建自用住房等；<br>· <b>政策引导</b>：农业生产者卖<b>自产</b>农产品、技术转让、学生勤工俭学、残疾人组织进口专用品、政府国际组织无偿援助物资；<br>· <b>国家信用</b>：国债、地方政府债利息（但 2025.8.8 后新发的恢复征税，金融债同）。<br><br>免税的代价要清楚：<b>对应进项不得抵扣</b>（所以农民卖菜免税，下游也别想拿普票计算抵）。<br><br>另外两种「准优惠」：<b>即征即退</b>——先正常征再退一部分：软件产品实际税负超 3% 部分即征即退；海上风电即征即退 50%；资源综合利用按 30/50/70/90/100% 分档。<b>离境退税</b>——境外旅客（境内连续居住 ≤183 天）在退税商店同日同店买满 200 元可退，退人民币，超 2 万只能银行转账。","sentence":"免税看「民生+引导」；即征即退看「行业名单+比例」；免税 ≠ 零税率——免税的进项不能抵，零税率还能退。","trap":"· <b>2025.8.8</b> 是国债/地方债/金融债利息免税的分水岭：之后新发的<b>恢复征税</b>（多选 21 题就埋了这个雷，A 选项 2026 年发行的国债不免）；<br>· 营利性<b>美容</b>医疗机构不免；学校<b>赞助费、择校费</b>不免；农业生产者卖<b>外购</b>农产品不免（自产才免）；<br>· 个人（自然人）卖自己用过的物品免，<b>个体户</b>不免；<br>· 香港市场投资者基金互认买卖内地基金份额的收入免。","qs":[49,52,11,19,20,21,22,23,38,39]},{"id":"2-20","name":"征管与发票：义务什么时候发生、在哪儿交、专票三条红线","star":"★★","level":"L2","scene":"货发了但钱没收到，要不要交税？钱先收了但服务明年才提供呢？发票先开了呢？——「纳税义务发生时间」就是回答「从哪一刻起国家认为你欠它税」。","why":"总原则：<b>收讫销售款、取得索款凭据、交易完成——孰先</b>。合同写了付款日就按付款日；先开票的按开票日（票一开，下家可能马上拿去抵，国家不能让你这边说义务没发生）。特殊：视同销售看「完成当天」（货发出/权属转移）；进口看报关当天；先收款再分期提供服务的，以「首次实际开始提供服务」和「合同约定」孰先，且就<b>全部已收价款</b>一次申报。<br><br>纳税地点：固定业户在机构所在地；总分机构不同县市的分别申报（经省级批准可汇总）；无固定场所的在交易发生地。<br><br>计税期间：10 日、15 日、1 个月、1 季度四种；月/季为期满的<b>次月 1 日起 15 日内</b>申报；10 日/15 日为期满 5 日内预缴。<br><br><b>专票三条红线</b>：① 免税项目不能开（开了下家就能凭空抵）；② 卖给自然人的不能开；③ 差额计税里<b>扣除的那部分</b>不能开（旅游代付、签证费、建筑分包扣除额、金融商品转让等）。<br><br>异常凭证：你拿到的专票如果来自「非正常户、涉嫌虚开、比对不符、走逃企业」，这张票被冻结——没抵的暂不许抵，抵过的要转出（A 级纳税信用纳税人有核实申辩通道）。数电发票：单一联次、自动交付、开错只能<b>红冲不能作废</b>；发票总额度是「不含税」口径。","sentence":"义务时间 = 收钱、约定付款、完成孰先，先开票看开票；专票三红线：免税、自然人、差额扣除部分。","trap":"· 10 日/15 日计税期是「期满 <b>5 日</b>内预缴」，不是 15 日（多选 25 的 D 选项就是坑）；<br>· 总分机构「只能分别申报」——错，经批准可汇总；「随便汇总」也错；<br>· 数电票开错<b>不能作废</b>只能红字；总额度是<b>不含税</b>上限；<br>· 贷款利息：结息日起 90 天内的应收未收利息照章纳税，超 90 天的暂不缴、实收时再缴。","qs":[14,15,25,26,41,42,43]},{"id":"2-21","name":"特殊业务合集：预付卡、平销返利、白送股票、反向开票、混合vs兼营","star":"★★","level":"L2","scene":"五个零碎业务，每个都可能考一道：卖购物卡；商场收厂家的销售返利；把股票白送给另一家公司；废品回收站从大爷手里收纸箱开不出票；电梯厂卖电梯顺带安装。","why":"· <b>单用途预付卡</b>：卖卡/充值只是「收钱代管」，预收资金<b>不征</b>增值税；持卡人消费时，真正卖货的商户纳税（且不再给持卡人开票）；售卡方只就办卡的<b>手续费、服务费</b>按经纪代理 6% 交。一句话：卡在谁手里不重要，消费发生时才算交易。<br>· <b>平销返利</b>：商场按销量从厂家拿的返利，本质是「事后价格折让」——所以<b>冲减进项</b>（返利÷(1+税率)×税率），不是确认销项。方向千万别反。<br>· <b>无偿转让股票</b>：转出方按「买入价=卖出价」处理，差价为 0，不交税；下家再卖时，以<b>原转出方的买入价</b>为成本。防止无偿转让把成本洗没、国家吃亏。<br>· <b>反向开票</b>：资源回收企业从个人手里收废品，个人开不出票——让<b>收购方反过来给个人开票</b>，链条就接上了。一般计税的回收企业可反向开专票+普票，简易计税的只能开普票；同一自然人 12 个月累计不得超 500 万。<br>· <b>混合 vs 兼营</b>：一笔交易里的主从关系（卖设备+安装、卖软件+培训）→ 按主业税率，叫混合交易；两笔独立生意（建材店又卖建材又给人装修）→ 分别核算各算各的，不分就从高，叫兼营。判断就一句：<b>是「一笔买卖」还是「两笔生意」</b>。","sentence":"卖卡不征、消费才征；返利冲进项不冲销项；白送股票按原买入价零差价；反向开票补断链；一笔买卖按主业、两笔生意分开算。","trap":"· 平销返利冲<b>进项</b>不是算销项——多选 35 题四个选项三个在考这个方向感；<br>· 混合销售里的「销售机器设备+安装」按<b>货物 13%</b>，安装不单独按建筑 9%（分别核算也不分行——政策强制）；<br>· 反向开票给同一自然人 12 个月不能超 500 万；<br>· 售卡方卖卡时只能开<b>普票</b>，不能开专票。","qs":[4,47,10,29,34,35]}]}},{"id":"ch3","no":"3","name":"消费税法","score":"7","star":"★★★","tagline":"一次性调节税：只挑 15 类商品，在第一次进流通时收一刀","intro":{"hook":"上一章的增值税是<b>环环收、层层抵</b>；这一章的消费税正好反过来——<b>挑 15 类商品，只在它第一次进入流通时收一刀，之后基本不再收</b>。<br><br>为什么会这么设计？因为增值税是为了稳定收钱，必须中性、不能干扰企业怎么分工；消费税是为了<b>调节</b>：烟伤身体、油耗资源、游艇和豪车是奢侈消费，国家想让这些行为贵一点、少一点，叫<b>寓禁于征</b>。既然目的不是层层抽税，那一刀就落在最好管、税基最大的生产环节。<br><br>这一章 20 个知识块，全都从这句话长出来：<b>只收一刀 → 价内税 → 组价要 ÷(1-税率) → 价格不能被压低 → 税基要守（门市部/换投抵/核定）→ 万一收了两刀要退回来（已纳税扣除）</b>。先读 3-1，把这台机器和增值税摆在一起看明白，后面就不用背了。","exam":"近 5 年（2021-2025）：单选 2-3 题、多选 1-2 题，外加综合题里 1-3 个小问，合计 4.5-9 分，平均约 7 分。特点是<b>综合性强</b>：常与关税（进口组价）、增值税（价税分离、视同销售）、城建税联合命题。2026 新增「成品油涉税产品检测」考点。","passline":"本章 55 题（28 单选 + 27 多选）。过关线：单选 ≥ 95%，多选 ≥ 90%。三个最容易翻车的地方：① 不征 / 免税 / 暂缓征收分不清；② 消费税额与增值税在自产自用上的处理不同；③ 征税环节的四类例外（卷烟电子烟批发、超豪华车零售、金银铂钻只在零售）。"},"blocks":[{"id":"3-1","name":"一次性调节税：消费税和增值税根本不是一类东西","star":"★★★","level":"L3","scene":"还是上一章那条面包流水线，现在换成一包烟：烟厂把烟卖给批发商，批发商卖给超市，超市卖给你。<br><br>增值税在这三环里<b>每一环都收、每一环都抵</b>，最后累计等于零售价的 13%。消费税呢？只在<b>烟厂出厂那一刀</b>收，批发、零售环节再也不收（卷烟是少数例外，后面单讲）。<br><br>更反直觉的是：这包烟标价 100 元里，消费税已经<b>藏在价格里面</b>了。你付的 100 元 = 成本 + 利润 + 消费税，而增值税是在 100 元之外再加 13 元。","why":"为什么国家要两套税叠着收？因为分工完全不同：<br><br>· <b>增值税是「普遍税」</b>——所有商品服务都收，目的是稳定拿财政收入，所以它必须中性：不能因为你分工细就多收、自己全干就少收，否则会扭曲企业的经营决策。<br>· <b>消费税是「选择税」</b>——只挑 15 类商品，目的是<b>调节</b>：烟、酒伤身体，成品油、实木地板耗资源，游艇、高档手表是奢侈消费。国家不指望靠它收多少钱，而是想让这些行为「贵一点、少一点」，这叫<b>寓禁于征</b>。<br><br>既然目的是调节而不是层层抽税，就没必要每个环节都管：<b>在商品第一次进入流通（生产/委托加工/进口）时收一刀</b>，税基最大、纳税人最少、最好管。后面的批发零售只是转手，价格里已经含过税了，再收就是重复。<br><br>还有一个技术后果必须记住：消费税是<b>价内税</b>。所以当你只有成本、没有售价要「组价」时，公式是 <b>÷(1-消费税率)</b>——因为税要藏在价格里，得把税「加回去」。增值税是价外税，换算永远是 <b>÷(1+增值税率)</b>，把税「剥出来」。第三章所有组价公式，根子就在这一句。","sentence":"增值税环环收、层层抵，是价外税；消费税挑 15 类商品、只在第一次进流通时收一刀，是价内税。看到「组价」先问：价内 → ÷(1-税率)，价外 → ÷(1+税率)。","trap":"· 别把「消费税只在生产环节收」背成绝对——卷烟、电子烟在批发环节加征，金银铂钻干脆只在零售环节收，超豪华小汽车零售加征。这三类例外是本章最高频的考点。<br>· 别把消费税和增值税的征税范围画等号：<b>增值税 > 消费税</b>，交增值税不代表交消费税（高档皮包、实木家具都不交消费税），但交消费税的一定同时交增值税（进口环节除外，那里缴的是海关代征的增值税）。<br>· 题干问「应征收消费税」时，先过两道门：① 是不是 15 类之一？② 是不是处在它的征税环节？两道都过才缴。","table":{"head":["","增值税","消费税"],"rows":[["立法目的","普遍征收、稳定收入","选择征收、寓禁于征"],["征税范围","所有货物/服务/无形资产/不动产","仅 15 类应税消费品"],["征税环节","每个流转环节","一般只在生产/委托加工/进口一次"],["价内 or 价外","价外（税款另列）","价内（税款藏在价格里）"],["组价换算","÷(1+增值税税率)","÷(1-消费税比例税率)"],["重复征税处理","凭票抵进项","按生产领用数量扣已纳税额"]]},"tips":["这一章只要卡住，就回来问：「这一刀本来该在哪儿收？题目把它挪到哪儿了？」","「寓禁于征」四个字能解释 80% 的税目边界：为什么高尔夫球具征、沙滩车不征，为什么电池涂料有环保免税。"],"qs":[3]},{"id":"3-2","name":"15 类税目地图：不征、免税、暂缓征收是三件事","star":"★★★","level":"L3","scene":"一道多选题甩给你八个商品：高尔夫车、未经涂饰的素板、150 毫升摩托车、雪地车、橡胶填充油、18K 金镶钻手链、变压器油、纯生物柴油——问哪些<b>属于消费税征税范围</b>。<br><br>你会发现它们「不交税」的理由各不相同：有的压根不在这 15 类里（高尔夫车、雪地车、150 毫升摩托车、变压器油），有的明明在税目里但国家抬手放行（纯生物柴油免征），还有的属于「暂缓征收」（航空煤油、航天煤油）。","why":"为什么要把这三种状态分这么细？因为<b>法律后果不同</b>：<br><br>· <b>不属于征税范围</b>：根本没进这个税的门。以后政策怎么变都跟你无关，也没有「免税要不要备案」「进项能不能抵」这些后续问题。<br>· <b>免税</b>：进了门，本来该缴，国家主动免掉。所以它会带一串配套规则：免税项目要单独核算、对应进项不能抵、放弃免税后 36 个月不能反悔（增值税那边）、免税但不能开专票。<br>· <b>暂缓征收</b>：进了门、也没正式免，只是暂时不收，随时可能恢复。<br><br>出题人就靠这个做文章：轻二多选 1 的答案里，<b>纯生物柴油（H）要选</b>——它属于成品油税目，只是享受免税；<b>150 毫升摩托车（C）不能选</b>——250 毫升以下根本不在征税范围；<b>变压器油（G）不能选</b>——绝缘油不属于润滑油。<br><br>15 类怎么记？按「为什么被选中」分四组，比硬背清单牢：<br>① <b>有害健康</b>：烟（含电子烟）、酒、鞭炮焰火<br>② <b>奢侈浪费</b>：高档化妆品、贵重首饰珠宝玉石、高尔夫球具、高档手表、游艇、小汽车、摩托车、超豪华小汽车<br>③ <b>稀缺资源</b>：木制一次性筷子、实木地板、成品油、电池、涂料<br>④ 剩下用口诀兜底：<b>「三高产品要征税，节能环保要牢记」</b>——高消费、高污染、高能耗。","sentence":"先问「在不在 15 类里」，再问「免不免」，最后问「在不在征税环节」。不征 / 免税 / 暂缓，三个词不能混用。","trap":"· 题干写「属于征税范围」时，<b>免税品也要选</b>（纯生物柴油、太阳能电池、燃料电池、无汞原电池都在此列）；写「应缴纳消费税」时，免税品不能选。轻二两道非标准题专门考这个读题差异。<br>· 易错归类：烟叶<b>不征</b>（只对烟草制品）；酒精、调味料酒<b>不征</b>；体育发令纸、鞭炮药引线<b>不征</b>；舞台演员用的油彩<b>不征</b>；竹制筷子<b>不征</b>（只有木制一次性筷子）；绝缘油类（变压器油、导热油）<b>不征</b>。<br>· 反向记：未经涂饰的素板、未经打磨倒角的木筷、橡胶填充油、烷基化油、重芳烃——这些「半成品/化工品」<b>都征</b>，国家把口子堵得很死，防止改名避税。","table":{"head":["状态","含义","典型例子","做题动作"],"rows":[["不属于征税范围","没进 15 类","沙滩车/雪地车/卡丁车/高尔夫车、150ml 摩托车、变压器油、烟叶、酒精","问「征税范围」不选；问「应缴」也不选"],["免税","进了门但免缴","纯生物柴油、太阳能电池、燃料电池、无汞原电池、锂离子蓄电池","问「征税范围」要选；问「应缴」不选"],["暂缓征收","暂时不收","航空煤油、航天煤油","两者都不选"],["正常征税","在范围内且无优惠","铅蓄电池(4%)、烷基化油、素板","都选"]]},"tips":["把「免税」两个字看成「进了门」——这是非标准题唯一的胜负手。","成品油是税目陷阱最密集的一块：石脑油/溶剂油/润滑油/燃料油各有自己的扩围清单，绝缘油是唯一明确排除的。"],"qs":[1,1]},{"id":"3-3","name":"够不够格：小汽车、游艇、高档化妆品、手表的门槛","star":"★★","level":"L2","scene":"四样东西摆在面前：23 座中轻型商用客车、8 米长的机动游艇、出厂价 16 元一片的面膜、单价 8000 元的手表。<br><br>前两样缴消费税，后两样不缴——差别全在<b>一条硬门槛</b>上。","why":"为什么消费税爱设「价格线」和「规格线」？因为它的目的是调节<b>奢侈消费</b>，不是给所有同类商品加税。国家不想让普通护肤水、通勤手表变贵，只想打到最后那一小撮高端消费，所以必须用客观、可核查的线把范围切开：<br><br>· <b>高档化妆品</b>：生产/进口环节不含增值税价 ≥<b>10 元/毫升(克)</b> 或 <b>15 元/片(张)</b>。<br>· <b>高档手表</b>：不含增值税售价每只 ≥<b>10000 元</b>。<br>· <b>游艇</b>：艇身长度 <b>8~90 米</b>、内置发动机、非牟利用途。<br>· <b>摩托车</b>：气缸容量 <b>≥250 毫升</b>。<br>· <b>小汽车</b>：乘用车 ≤9 座、中轻型商用客车 10~23 座；<b>大型商用客车、货车、沙滩车、雪地车、卡丁车、高尔夫车都不征</b>。判定看底盘（车架）原始属性，不看外观改装。<br><br>这些线还有个共同点：<b>都用不含增值税的价</b>。因为增值税是价外税，含在标价里会虚高，把本来不够格的商品推过门槛。所以看到「含税价」先 ÷1.13 再比线。","sentence":"消费税挑的是「高端那一小截」：化妆品 10 元/ml 或 15 元/片、手表 1 万元/只、游艇 8~90 米、摩托车 250ml、小汽车按座位数和底盘。比线前先把增值税剥掉。","trap":"· 轻二多选 19：16 元/片的面膜（≥15 元/片，<b>要缴</b>）、360 元/5 克的口红（72 元/克 ≥10，<b>要缴</b>）、500 元/100ml 护肤水（5 元/ml <10，<b>不缴</b>）、演员用油彩（<b>不征</b>）。答案 CD 是两个不缴的。<br>· 单价 8000 元手表（单选 4 选项 C）不到 1 万，<b>不缴</b>，别看到「手表」就选。<br>· <b>舞台、戏剧、影视演员化妆用的上妆油、卸妆油、油彩</b>不属于高档化妆品税目，是「不征」不是「免税」。<br>· 纯电动小汽车如果不是超豪华，<b>不征</b>消费税（但缴增值税）；一旦零售价 ≥90 万，就作为超豪华小汽车在零售环节征。","table":{"head":["税目","门槛","不征的典型"],"rows":[["高档化妆品","≥10 元/ml(g) 或 ≥15 元/片","演员用油彩、普通护肤水"],["高档手表","≥10000 元/只(不含增值税)","8000 元手表"],["游艇","8~90 米、内置发动机","非机动艇、超 90 米"],["摩托车","气缸容量 ≥250ml","150ml 轻便摩托"],["小汽车","乘用车≤9座 / 中轻客10~23座","大客、货车、沙滩车、卡丁车"]]},"tips":["所有价格门槛都用「不含增值税」口径，含税价一律 ÷1.13。","题目给「每片」「每毫升」时先统一单位再比线，别拿总价直接比。"],"qs":[2,19]},{"id":"3-4","name":"成品油与环保税目：为什么绝缘油偏偏不算","star":"★★","level":"L2","scene":"税务稽查到一家化工厂，仓库里堆着橡胶填充油、重芳烃、变压器油、导热油、烷基化油、纯生物柴油。会计说「都是油，凭什么有的征有的不征？」<br><br>答案藏在这些油的<b>用途</b>里：前几样最终会烧掉或变成燃料，变压器油和导热油是给设备<b>绝缘、传热</b>用的，一辈子不燃烧。","why":"成品油消费税的设计意图是对<b>能源消耗</b>征税（顺带调节污染），所以判断标准是「这东西会不会被当成燃料/润滑油用掉」，不是化学名字叫不叫油。<br><br>于是立法用了一张「扩围清单」把常见改名避税的化工品全点名：<br>· <b>石脑油</b>：混合芳烃、重芳烃、混合碳八、稳定轻烃、轻油、轻质煤焦油<br>· <b>溶剂油</b>：橡胶填充油、溶剂油原料、石油醚、各种工业白油<br>· <b>汽油</b>：甲醇/乙醇汽油、<b>烷基化油（异辛烷）</b><br>· <b>柴油</b>：含生物柴油<br>· <b>燃料油</b>：重油、渣油、腊油、船用重油等<br><br>反过来，<b>变压器油、导热类油等绝缘油明确不属于润滑油，不征</b>——它们不参与燃烧、不产生那类外部性。这就是轻二多选 1 里 G 不选、E 选的原因。<br><br>环保类还有两条线要一起记：<br>· <b>成品油优惠</b>：航空煤油、航天煤油<b>暂缓征收</b>；符合条件的纯生物柴油（废弃动植物油占比≥70%）<b>免征</b>；废矿物油再生的工业油料免征。<br>· <b>电池、涂料</b>：属于税目，但给了环保免税——无汞原电池、氢镍/锂离子蓄电池、太阳能电池、燃料电池、全钒液流电池<b>免征</b>；施工状态下 VOC ≤420 克/升的涂料<b>免征</b>。只有<b>铅蓄电池按 4% 征</b>。<br><br>看明白了吗？电池这一组就是把「污染重的征、干净的免」写成了法条。","sentence":"成品油看用途不看名字：会烧掉的都算，绝缘油（变压器油、导热油）不算。电池记住「铅蓄电池 4% 征，其余环保电池免」，涂料记住 VOC 420 克/升这条线。","trap":"· <b>航空煤油 / 航天煤油是「暂缓征收」</b>，不是免税，也不是不征——轻二单选 1 的答案就是 A，选项 C 太阳能电池、D 纯生物柴油是「免征」，B 鞭炮药引线是「不征」。四个选项四种状态，专门考你分不分得清。<br>· 啤酒屋（啤酒坊）用啤酒生产设备自制的啤酒<b>要征</b>消费税，且一律按甲类 250 元/吨，不管卖多便宜（多选 2 的 A）。<br>· 出国人员免税商店销售的金银首饰<b>照征</b>消费税（多选 2 的 C）——「免税店」免的是关税、增值税，不是消费税。<br>· 2026 新增的「成品油涉税产品检测」：征税/税率有争议、举报或发现涉税风险、媒体曝光造成重大影响，都可以启动检测（多选 27 全选）。","tips":["把「暂缓 / 免税 / 不征」三个词单独抄一张卡，本章至少考三次。","成品油的扩围清单不用全背，但「烷基化油=汽油」「橡胶填充油=溶剂油」「变压器油=不征」这三对必考。"],"qs":[2,5]},{"id":"3-5","name":"征税环节：一次征收 + 三类例外","star":"★★★","level":"L3","scene":"同一件商品从工厂到你手上，中间有生产、批发、零售三个口子。一般商品（比如一瓶高档香水）只在<b>第一个口子</b>收消费税，后面全免。<br><br>但有三类商品不老实：<b>卷烟、电子烟</b>在生产之后还要在批发环节再加一道；<b>超豪华小汽车</b>在生产/进口之后还要在零售环节再加一道；<b>金银铂钻首饰</b>更极端——前面全不收，只在零售环节收唯一一道。","why":"为什么单环节原则要破例？三个例外各有各的理由，理解了就不用背：<br><br>· <b>卷烟、电子烟加征批发环节</b>：烟草是「寓禁于征」最典型的商品，单靠生产环节一道税压不住消费；而且批发价格是税务部门最容易监控的口径，加在批发端最不容易逃。所以国家在生产环节收完，再在批发企业卖给零售商时加 11% + 定额。<br>· <b>超豪华小汽车加征零售环节</b>：它的调节对象是「买豪车这个消费行为」，而生产环节按排量征税只看车、不看人；只有落到最终成交价（≥90 万）才算奢侈消费，所以必须在零售端按成交价再加 10%。<br>· <b>金银铂钻只在零售环节</b>：历史原因——这类商品大量在作坊、个体户手里加工，生产端根本管不过来；而零售端（金店）相对集中、好管。索性把唯一一道税挪到最后。<b>代价</b>是：生产/进口环节不征，也就没有「已纳消费税」可扣，所以金银镶嵌首饰一律不得扣除外购珠宝玉石的已纳税款。<br><br>还有一个容易忽略的点：<b>批发企业之间</b>互相卖卷烟不缴批发环节消费税，只有卖给「零售商/非批发单位」才缴——因为加征那一刀要落在离开批发体系、流向消费者的那一刻。","sentence":"一般商品：生产/委托加工/进口一次。加征两道：卷烟、电子烟（+批发）、超豪华小汽车（+零售）。只收最后一道：金银铂钻（仅零售）。批发商之间卖卷烟不缴。","trap":"· 轻二多选 17 问「除了生产销售环节，还在批发环节征收」——答案只有 <b>卷烟、电子烟</b>；烟丝、雪茄烟都只在生产环节，别看带「烟」字就选。<br>· 多选 23 问「零售环节征收」：钻石戒指、铂金项链、古法金手链（金银铂钻）、纯电动超豪华小汽车、燃油超豪华小汽车都选；<b>镀金首饰、翡翠手镯、摩托车不选</b>（它们在生产/进口环节）。<br>· 二手超豪华小汽车<b>不征</b>消费税，因为那笔奢侈消费在第一手已经课过税了。<br>· 进口金银饰品不征消费税（单选 4 的 D 是错的）——金银铂钻的征税环节只有零售，进口不是它的环节。","table":{"head":["类型","生产/委托加工/进口","批发","零售"],"rows":[["一般应税消费品","√ 单环节","×","×"],["卷烟、电子烟","√","√ 加征","×"],["超豪华小汽车(有排量)","√","×","√ 加征 10%"],["超豪华小汽车(纯电/燃料电池)","×","×","√ 仅此一道"],["金银铂钻首饰","×","×","√ 仅此一道 5%"]]},"tips":["画一条三格流水线，把商品往上放，比背表格快。","「批发企业之间销售卷烟不缴」是单选题的常客，记「离开批发圈才缴」。"],"qs":[17,23]},{"id":"3-6","name":"三种计税方法：从价、从量、复合怎么分","star":"★★","level":"L2","scene":"三笔生意：卖一瓶高档香水（价格越高税越多）、卖 10 吨啤酒（不管贵不贵，每吨固定 250 元）、卖一批白酒（既按价钱抽 20%，又按斤数每 500 克加 0.5 元）。<br><br>为什么不能统一成一种算法？","why":"计税方法要匹配<b>商品的物理属性</b>和<b>调节目的</b>：<br><br>· <b>从价定率</b>（绝大多数）：这类商品价格跨度大、贵贱本身就是「奢侈程度」的信号，按价抽成最贴合调节意图。<br>· <b>从量定额</b>（<b>啤酒、黄酒、成品油</b>）：这三类的消费量才是外部性的来源（喝多少酒、烧多少油），而且计量单位标准、单价低、涨价慢。按量收既公平又抗通胀，还省得逐笔核价。<br>· <b>复合计征</b>（<b>只有卷烟、白酒</b>）：这两类是调节力度最大的商品，光按价收会被「低价走量」绕开，光按量收又打不到高价产品，所以两头一起收。<br><br>由此推出本章最重要的一张判定表：<b>从量三种、复合两种，剩下全从价</b>。多选题里只要先圈出「啤酒/黄酒/成品油」和「卷烟/白酒」，其余用排除法即可，不必记 15 类各自的税率。<br><br>另一个高频规则是「从高」：<b>兼营不同税率未分别核算 → 从高；组成成套消费品销售 → 无论是否分别核算，一律从高</b>。为什么后者更狠？因为成套销售时企业完全可以把高税率商品标价压到 1 元、低税率商品标高价来洗税基，单独核算已经防不住了，只能一刀切。","sentence":"从量只有啤酒、黄酒、成品油；复合只有卷烟、白酒；其余全从价。兼营不分开核算从高，成套销售一律从高。","trap":"· 多选 3 的 C「组成成套消费品分别核算则分别适用税率」是<b>错</b>的——成套销售没有「分别核算」这个例外，一律从高。<br>· 多选 4 问从量计征：啤酒、柴油（成品油）选；电池、涂料是<b>从价</b>，别因为它们是「环保调控」就以为从量。<br>· 白包卷烟（没牌号、无法核价）照样复合计征，D 是对的。<br>· 从量计征的商品<b>没有价税分离问题</b>——因为它压根不看销售额，这也解释了为什么啤酒/黄酒/成品油的包装物押金永远不影响消费税。","table":{"head":["方法","适用税目","应纳税额"],"rows":[["从价定率","除下列以外的绝大多数","不含增值税销售额 × 比例税率"],["从量定额","啤酒、黄酒、成品油","销售数量 × 定额税率"],["复合计征","卷烟、白酒","销售额×比例税率 + 数量×定额税率"]]},"tips":["先圈「从量三种 + 复合两种」，剩下的题都用排除法。","「成套销售一律从高」和「兼营未分别核算从高」是两句话，别合并成一句。"],"qs":[3,4]},{"id":"3-7","name":"销售额里塞了什么：价外费用与包装物押金","star":"★★★","level":"L3","scene":"卖一批白酒，除了货款还收了：品牌使用费、包装费、集资费、延期付款利息、包装物押金、代垫运费、代政府收的基金。会计问：哪些要并进销售额算消费税？<br><br>看着眼花，其实只有一句判断标准。","why":"消费税从价计征的税基是「<b>伴随这笔销售、买方实际付出的全部代价</b>」。名字叫什么完全不重要——叫「品牌使用费」也好、「服务费」也好，只要是因为买这批货才付的钱，就是价格的一部分。这叫<b>实质重于形式</b>：否则企业把货款拆成「货款 1 元 + 品牌费 99 元」，税基就没了。<br><br>真正能排除的只有两类，而且都要「符合条件」：<br>· <b>代垫运费</b>：运费发票开给购买方 + 纳税人把发票转交给购买方，两条同时满足。逻辑是这笔钱你只是过手，最终由买方直接付给承运方，不是你的收入。<br>· <b>政府性基金 / 行政事业性收费</b>：国务院或省级批准设立 + 开省级以上财政票据 + 全额上缴财政。同样是「过手钱」。<br><br>包装物要分三件事，别搅在一起：<br>① <b>连同货物销售的包装物</b>：无论是否单独计价、会计怎么核算，<b>一律并入销售额</b>（单选 27、多选 6）。<br>② <b>包装物押金</b>（酒类最复杂）：<br>　· 一般应税消费品：<b>收取时不征</b>，逾期或超 1 年才征（增值税、消费税同时）；<br>　· <b>除啤酒、黄酒外的其他酒类</b>：<b>收取当期就并入销售额</b>征增值税和消费税，逾期不再征——因为酒类押金常常就是变相价款，等逾期等于给了一条避税通道；<br>　· <b>啤酒、黄酒、成品油</b>：从量计征，押金<b>永远不影响消费税</b>，只有逾期影响增值税。<br>③ 押金是<b>含税价</b>，并入前先 ÷1.13。<br><br>为什么啤酒黄酒的押金对消费税「免疫」？回到 3-6：它们按吨/按升收税，价格这个变量压根不进公式。","sentence":"凡因这笔销售而收的钱都算价外费用；只有合规代垫运费和合规政府性基金能剔除。包装物押金记三行：一般逾期征、其他酒类收取即征、啤黄成品油永不影响消费税。","trap":"· <b>白酒品牌使用费必并入</b>（多选 6 的 B），这是明文规定，别当「无形资产使用费」放走。<br>· 红酒（葡萄酒）包装物押金属于「啤酒黄酒以外酒类」，<b>收取时并入</b>（多选 6 的 C）。<br>· 多选 20 问「无论是否单独作价，收取时并入增值税和消费税」：白酒、药酒选，<b>果啤、黄酒不选</b>——果啤按啤酒从量计征，押金只影响增值税。<br>· 单选 27：竹制雕花工艺筷子根本不是应税消费品，它的押金 2.5 万别往税基里加；木筷销售额 50 万里已含包装物 0.8 万，别重复加。答案是 50×5%=2.5 万。<br>· 价外费用默认<b>含增值税</b>，先 ÷1.13 再乘消费税率。","table":{"head":["押金类型","收取时","逾期/超1年"],"rows":[["一般应税消费品","增值税× 消费税×","增值税√ 消费税√"],["啤酒黄酒以外酒类","增值税√ 消费税√","不再征"],["啤酒、黄酒、成品油","增值税× 消费税×","增值税√ 消费税×"]]},"tips":["看到「品牌使用费」「返还利润」「集资费」直接归入价外费用，没有例外。","先判断商品是不是从量计征，是的话押金对消费税直接跳过。"],"qs":[27,6,7,20]},{"id":"3-8","name":"从量计征的两个坑：啤酒甲乙类与「数量」口径","star":"★★★","level":"L3","scene":"啤酒厂卖 10 吨鲜啤酒，专票上不含税价 29000 元，另收包装物押金 2000 元（其中塑料周转箱押金 500 元）。<br><br>问题来了：甲类 250 元/吨还是乙类 220 元/吨？差别就在「每吨出厂价 ≥3000 元」这条线——而这条线怎么算，藏着两个陷阱。","why":"为什么啤酒要按价格分甲乙两类、却又按吨收税？因为啤酒从量计征是历史选择（计量简单），但国家又想让贵一点的啤酒多承担一点，于是用「出厂价」把税<b>率档</b>切开，而不是改变计税方式。<br><br>判定线：<b>每吨出厂价（不含增值税）≥3000 元为甲类 250 元/吨，<3000 元为乙类 220 元/吨</b>。计算这个「出厂价」时要记住三条：<br>① <b>包装物押金要计入</b>，且是含税价，先 ÷1.13；<br>② <b>重复使用的塑料周转箱押金不计入</b>——它是可循环容器的押金，不是售价的一部分；<br>③ 用<b>不含税口径</b>。<br><br>所以轻二单选 26：鲜啤酒每吨 = [29000 + (2000-500)÷1.13] ÷ 10 = 3032.74 元 → <b>甲类</b>；果啤每吨 = [13800 + 750÷1.13] ÷ 5 = 2892.74 元 → <b>乙类</b>。最后 10×250 + 5×220 = 3600 元。这道题的四个选项就是把「押金全算」「押金全不算」「两类判反」分别做成了干扰项。<br><br>第二个坑是「销售数量」的四种口径，多选 8 考的就是这个：<br>· 销售 → <b>销售数量</b>；<br>· 自产自用 → <b>移送使用数量</b>（不是生产数量！选项 B 就错在这）；<br>· 委托加工 → <b>纳税人收回的数量</b>（不是发出加工的数量）；<br>· 进口 → <b>海关核定的征税数量</b>。<br><br>为什么自产自用按「移送」而不是「生产」？因为纳税义务发生在移送使用那一刻，生产出来还没用的部分并没有离开生产环节，不该提前计税。","sentence":"啤酒分档看每吨出厂价 3000 元：一般押金计入、塑料周转箱押金剔除、含税先 ÷1.13。数量口径：卖看销售、自用看移送、委外看收回、进口看海关核定。","trap":"· <b>啤酒屋自制啤酒一律按甲类 250 元/吨</b>，不看价格——因为现酿现卖没有可靠的出厂价，直接按最高档防避税。<br>· 黄酒 240 元/吨、成品油 1.2~1.52 元/升基本不用背，题目会给；但「成品油从量」这个方向必须判断对。<br>· 「自产自用按生产数量」是错的（多选 8 的 B）；「委托加工按委托加工数量」也是错的，要按<b>收回数量</b>。","table":{"head":["数量场景","计税数量口径"],"rows":[["销售","应税消费品销售数量"],["自产自用","移送使用数量"],["委托加工","纳税人收回的数量"],["进口","海关核定的进口征税数量"]]},"tips":["算啤酒分档时把「塑料周转箱押金」圈出来单独减掉，这是唯一要剔除的押金。","把「数量」和「价格」分开想：从量计征下价格只用来分档，不进税额公式。"],"qs":[26,8]},{"id":"3-9","name":"复合计征：白酒与卷烟的组价为什么长这样","star":"★★★","level":"L3","scene":"酒厂把 1 吨自酿白酒白送给客户，没有同类售价。成本 42000 元/吨，成本利润率 10%，白酒 20% + 0.5 元/500 克。你算出来的组价里，<b>为什么定额税要先加进分子、还要再除一次 (1-20%)</b>？","why":"因为消费税是<b>价内税</b>：价格里必须同时容下「从价那部分税」和「从量那部分税」。<br><br>设组成计税价格为 P。从价税 = P×20%，定额税 = 数量×0.5 元/500g（这部分是固定的，与 P 无关）。价内税的定义是：<b>P = 成本+利润 + 从价税 + 定额税</b>。<br><br>代入：P = 成本×(1+利润率) + P×20% + 定额税<br>⇒ P×(1-20%) = 成本×(1+利润率) + 定额税<br>⇒ <b>P = [成本×(1+利润率) + 数量×定额税率] ÷ (1-比例税率)</b><br><br>这就是答案册那张「三个环节组价公式表」的由来，不用背，推一次就够。轻二单选 8：<br>组价 = [42000×1.1 + 1×2000×0.5] ÷ (1-20%) = (46200+1000)÷0.8 = 59000 元；<br>应纳 = 59000×20% + 2000×0.5 = 11800+1000 = <b>12800 元</b>。<br><br>关键换算：<b>1 吨 = 1000 公斤 = 2000 斤 = 2000 个「500 克」</b>，所以定额税是 1000 元。这一步错，整题就错。<br><br>子题 9 把条件改成「有同类售价 60000 元/吨」，答案立刻变成 60000×20% + 1000 = <b>13000 元</b>。母子题放一起，考的是一条优先级：<b>同类售价优先，组价只是没有同类价时的兜底</b>。为什么？同类售价是真实市场信号，用它最不容易被操纵；组价里的成本利润率是税务机关核的，只是近似值。","sentence":"复合组价 = [成本×(1+利润率) + 数量×定额税率] ÷ (1-比例税率)；应纳税额 = 组价×比例税率 + 数量×定额税率。有同类售价就别组价。","trap":"· 1 吨 = 2000 个 500 克，白酒定额税 1000 元/吨；卷烟 1 标准箱 = 250 条 = 50000 支，生产环节定额 150 元/箱、批发环节 250 元/箱。这三组换算必须条件反射。<br>· 卷烟分甲乙类看<b>每标准条调拨价 70 元</b>：≥70 为甲类 56%，<70 为乙类 36%。但单选 17 用的是<b>核定计税价格</b> 61.41 元（=89×(1-31%)），比实际出厂价 58 元高，按孰高取 61.41 → 乙类 36%。<br>· 组价公式里的定额税<b>不除 (1-税率) 再加</b>——它是分子的一部分，要一起除。分开算是常见错法。","table":{"head":["环节","从价组价","复合组价"],"rows":[["生产(自产自用)","成本×(1+利润率)÷(1-率)","[成本×(1+利润率)+数量×定额]÷(1-率)"],["委托加工","(材料成本+加工费)÷(1-率)","(材料成本+加工费+数量×定额)÷(1-率)"],["进口","(关税完税价+关税)÷(1-率)","(关税完税价+关税+数量×定额)÷(1-率)"]]},"tips":["三行公式只有分子第一项不同：成本利润 / 材料加工费 / 关税完税价+关税。分母永远是 (1-比例税率)。","母子题连着做：差别只在「有没有同类售价」，先找这句话。"],"qs":[8,9]},{"id":"3-10","name":"计税依据被抬高的四种情形：门市部、换投抵、最低计税价","star":"★★★","level":"L3","scene":"四种「明明没按实价卖」的场景：① 电池厂把货移给自家非独立核算门市部，内部按成本 78 万记账，门市部对外卖 89.73 万；② 化妆品厂拿 100 箱香水精去换别人的香水精；③ 卷烟厂实际出厂 58 元/条，税务局按批发价倒推核定 61.41 元/条；④ 白酒厂把酒低价卖给关联销售公司。<br><br>这四种，国家都<b>不认你报的价</b>。","why":"共同逻辑只有一个：<b>消费税是价内税、又只在第一个环节收一刀，价格一旦被压低，这一刀就永远收不回来了</b>。增值税压低价格还有下游环节的销项能补回来（链条闭环），消费税没有下游，所以必须把税基守住。<br><br>四种守法的力度不一样，正好排成一条阶梯：<br><br>· <b>自设非独立核算门市部</b> → 按<b>门市部对外实际销售额</b>计税，不认内部调拨价/成本价（单选 5：89.73÷1.13×4%=3.18 万）。因为门市部不是独立法人，内部移送根本不是销售，真实交易只有对外那一笔。<br>· <b>「换、投、抵」</b>（换取生产资料/消费资料、投资入股、抵偿债务）→ 按同类应税消费品的<b>最高销售价格</b>计税（单选 6：5.1 万×100 箱，而不是 5 万）。为什么用最高价？这类交易没有货币对价，企业最容易「作价偏低」把货送出去，所以直接取上限。<b>对比记：增值税在同样场景用平均价</b>——因为增值税链不断，用平均价就够了。<br>· <b>卷烟最低计税价格</b> → 国家税务总局按「批发环节售价 ×(1-批发毛利率)」倒推核定，再与实际售价<b>孰高</b>取值（单选 17）。用批发价倒推，是因为批发端价格公开、难以和关联方串通。<br>· <b>白酒最低计税价格</b> → 当生产企业计税价 < 销售单位对外售价的 <b>70%</b> 时触发核定，核定比例为 <b>60%</b>，同样孰高。<br><br>看清了：<b>没有货币对价 → 取最高价；有货币但可能关联压价 → 倒推核定、孰高</b>。都是同一条防线。","sentence":"价内税只收一刀，所以税基不能让你自己定：门市部按对外实价、换投抵按最高价、卷烟按批发价倒推孰高、白酒低于 70% 触发核定。","trap":"· 「换投抵」<b>不包括无偿赠送</b>——多选 9 的 C「用于无偿赠送」是错的，赠送按同类加权平均价（无同类才组价），不是最高价。三种情形记死：换、投、抵。<br>· 单选 6 里有 5 万和 5.1 万两批货，换取生产资料要按<b>最高价 5.1 万</b>，别顺手拿 5 万算。<br>· 卷烟孰高后还要重新判甲乙类：单选 17 核定 61.41 元/条 <70 元 → <b>乙类 36%</b>，不是甲类。核定价格既影响计税依据，也影响税率档次。<br>· 非独立核算门市部移送<b>60% 外销</b>这类比例是干扰项——按门市部实际对外销售额算，不是按移送比例折算。","table":{"head":["情形","计税依据","防的是什么"],"rows":[["自设非独立核算门市部","门市部对外实际销售额/数量","内部调拨价压低"],["换取资料/投资入股/抵债","同类最高销售价格","无货币对价、作价偏低"],["卷烟最低计税价","批发价×(1-毛利率)，与实际价孰高","关联低价出厂"],["白酒最低计税价","低于外售 70% 触发，按 60% 核定","设销售公司转移利润"]]},"tips":["把增值税的「平均价」和消费税的「最高价」并排抄一次，这是跨章节的高频对照题。","题目出现「核定」「孰高」先判甲乙类，再算税，顺序反了会全错。"],"qs":[5,6,17,9]},{"id":"3-11","name":"自产自用：连续生产不缴，其他用途移送就缴","star":"★★★","level":"L3","scene":"化妆品厂生产了 5 吨高档香水精：1 吨对外卖、1 吨继续生产高档香水、1 吨继续生产普通护肤品、1 吨送客户、1 吨留在仓库。<br><br>五吨里只有三吨要缴消费税。哪三吨？","why":"先记住消费税只收「一刀」。如果自产的应税消费品拿去<b>连续生产另一件应税消费品</b>，那这一刀留到最终产品卖出去时再收——中间移送只是生产工序，提前收就变成两刀了（卷烟厂自产烟丝做卷烟就是典型）。<br><br>但只要货<b>离开「应税消费品生产线」</b>，去到任何别的地方，这一刀就必须在移送当天落下，否则以后再也没机会收：<br>· 用于生产<b>非应税消费品</b>（香水精做普通护肤品、白酒做酒心巧克力）；<br>· 在建工程、管理部门、非生产机构、提供劳务；<br>· 馈赠、赞助、集资、广告、样品、职工福利、奖励。<br><br>为什么「馈赠、样品、职工福利」也要缴？因为东西被消费掉了、不会再产生下一笔销售，如果不视同销售，企业只要把产品全发给自己人就能免税。<br><br>轻二单选 18：卖掉的 1 吨 + 做普通护肤品的 1 吨 + 送客户的 1 吨 = 3 吨计税；继续做高档香水的 1 吨（连续生产应税品）不缴；留库待售的 1 吨还没移送不缴。有同类售价 1500 万元/吨（含增值税），所以 1500÷1.13×3×15% = 597.35 万。<br><br>这里还藏着一个和增值税的巨大差异，多选 21、25、26 都在考：<br>· <b>连续生产应税消费品</b>：增值税不缴、消费税不缴（都没离开企业）；<br>· <b>连续生产非应税消费品 / 管理部门用 / 在建工程</b>：消费税<b>缴</b>，增值税<b>不缴</b>（增值税只对「有偿转让」和「视同销售货物」征，自用不视同销售）；<br>· <b>馈赠、职工福利、奖励、样品</b>：两税<b>都缴</b>（都构成视同销售）；<br>· <b>换、投、抵</b>：两税都缴，但消费税按最高价、增值税按平均价。","sentence":"连续生产应税消费品 → 不缴；只要离开这条线（非应税品、工程、管理、送礼、福利、样品、奖励）→ 移送当天缴。留库未移送不缴。","trap":"· 多选 21 的 B「卷烟厂自产烟丝用于生产卷烟」和 G「酒厂自产葡萄酒勾兑红酒」都是<b>连续生产应税消费品 → 不缴</b>，不选；其余 A/C/D/E/F/H 全选。<br>· 单选 23 的 A「经销样品无须缴纳消费税」是<b>错</b>的，样品要缴。<br>· 多选 25 的 E「葡萄酒用于生产酒心巧克力」只缴消费税不缴增值税；H「素板用于生产实木指接地板」两税都不缴——这是「两税同缴」题最阴的两个选项。<br>· 单选 18 里「成本 1100 万/吨、成本利润率 5%」是干扰项：<b>有同类售价就优先用同类价</b>，别去组价。","table":{"head":["自产应税消费品用途","增值税","消费税"],"rows":[["连续生产应税消费品","×","×"],["连续生产非应税消费品","×","√"],["在建工程/管理部门/非生产机构","×","√"],["馈赠/赞助/集资/广告/样品/福利/奖励","√","√"],["换取资料、投资入股、抵偿债务","√ 平均价","√ 最高价"]]},"tips":["判断顺序：先看「是不是连续生产应税品」，不是就基本要缴消费税；再单独判断增值税有没有「视同销售」。","两税对照表是本章最容易丢分的地方，建议抄在纸上做三遍。"],"qs":[18,23,21]},{"id":"3-12","name":"委托加工：谁提供原料，决定整道题的走向","star":"★★★","level":"L3","scene":"甲把烟叶交给乙加工成烟丝，付加工费 3 万。另一种情形：乙先自己买料、做完卖给甲，或者乙以自己的名义进料、甲只付加工费。<br><br>前者叫<b>委托加工</b>（甲是纳税人、乙代收代缴）；后两种税法直接判成<b>乙自产自销</b>，整个计税逻辑全变。","why":"为什么「谁出原料」这么要紧？因为消费税要锁住的是<b>这件商品第一次进入流通时的增值</b>。如果原料是委托方的，说明商品的所有权从头到尾没转移过，受托方只是提供了劳务，那真正「生产」这件消费品的是委托方，理应由委托方纳税。<br><br>可委托方分散在各地、税务机关管不过来，于是立法用了一招<b>源泉控制</b>：让受托方在<b>交货时</b>替国家把税扣下来（代收代缴）。受托方是企业就必须代收；受托方是<b>个人（含个体工商户）</b>则不得代收，由委托方收回后自行申报。<br><br>反过来，只要原料是受托方提供的（或先卖料再加工、或以委托方名义购料），就说明受托方在做自己的生意，按<b>销售自制应税消费品</b>处理——它有同类售价就按同类售价，没有才组价。轻二多选 24 就是这条：甲实木地板厂提供素板、乙付加工费，所以<b>甲是纳税人</b>，按甲同类含税售价 65÷1.13×5%=2.88 万，答案是 AD。<br><br>组价公式（无同类售价时）：<b>(材料成本 + 加工费) ÷ (1-消费税比例税率)</b>。两个词要抠准：<br>· <b>材料成本</b>是委托方提供原料的实际成本，<b>包括把原料运到受托方的运费</b>，但不包括可抵扣的增值税进项；<br>· <b>加工费</b>含代垫辅料成本，不含随加工费收的增值税；<br>· <b>把成品运回委托方的运费不计入</b>——货已经做完了，这是下一笔流通费用。<br><br>轻二单选 28 把这三样全塞进来了：烟叶买价 100 + 价外补贴 8（按收购价款 10% 计）+ 烟叶税 22 = 130 万，再×(1-9%) 剥掉可抵扣进项 = 118.3 万，加购料运费 1 万得 119.3 万；加工费 3 万；组价 (119.3+3)÷(1-30%)=174.71 万；代收代缴 174.71×30% = <b>52.41 万</b>。运回的 2 万运费是干扰项。","sentence":"委托方出原料 → 真委托：委托方纳税、受托方交货时代收代缴（个人受托除外）；组价 =(材料成本+加工费)÷(1-率)，购料运费进成本、运回运费不进。受托方出料 → 按自产自销。","trap":"· 三种「假委托」：① 受托方提供原料；② 受托方先卖料给委托方再加工；③ 受托方以委托方名义购料。全按受托方<b>销售自制应税消费品</b>（单选 10 答案 C 是唯一真委托）。<br>· 受托方没代收代缴：<b>对受托方罚应代收税款 50% 以上 3 倍以下</b>（不是 5 倍，多选 22 的 A 错在这）；<b>税款由委托方补缴</b>，不是受托方（D 也错）。已直接销售的按销售额补，未销售/不能直接销售的按组价补（BC 对）。<br>· 委托加工收回后<b>加价出售</b>要再申报消费税，但准予扣除受托方已代收代缴的税额（无税目范围限制）；不加价出售不再缴。<br>· 组价里「材料成本」的运费方向：<b>去程算、回程不算</b>。","table":{"head":["判断点","规则"],"rows":[["真委托的界定","委托方提供原料及主要材料，受托方只收加工费+代垫辅料"],["纳税人","委托方"],["代收代缴人","受托方（企业）；受托方是个人/个体户则委托方自缴"],["计税顺序","受托方同类售价 → 无则组价"],["组价","(材料成本 + 加工费) ÷ (1 - 比例税率)"],["未代收代缴","罚受托方 50%~3 倍；委托方按销售额或组价补税"]]},"tips":["每道委托加工题先只做一件事：圈出「谁提供的原料」。这一步定生死。","组价里出现烟叶时，记得「收购价款 + 10% 价外补贴 + 20% 烟叶税」，再 ×(1-9%) 剥进项。"],"qs":[10,28,22,24]},{"id":"3-13","name":"进口环节：组价为什么要先把关税加进去","star":"★★★","level":"L3","scene":"卷烟厂进口一批烟丝，成交价 292 万，另外自己承担了运抵我国口岸前的运费和保险费 8 万。关税 10%、消费税 30%。<br><br>为什么答案第一步是 (292+8)×(1+10%) = 330 万，而不是直接拿 292 万算？","why":"因为消费税是<b>价内税</b>，进口这批货在国内第一次进入流通时的「完整价格」应该包含三块：货价 + 运保费 + 关税。关税是进口环节交给国家的成本，它已经固化在货物价值里，将来在国内卖的时候也会体现在售价中，所以必须成为消费税的税基。<br><br>再往上推一步：既然消费税本身也是价内税，价格里还得留出消费税的位置。设组价为 P，则 P = (关税完税价格 + 关税) + P×消费税率，整理得 <b>P = (关税完税价 + 关税) ÷ (1 - 消费税率)</b>。<br><br>轻二单选 11：关税完税价 = 292+8 = 300 万（<b>运抵输入地点起卸前的运费、保险费要计入</b>，这是关税完税价格的定义）；关税 = 300×10% = 30 万；组价 = (300+30)÷(1-30%) = 471.43 万；消费税 = 471.43×30% = <b>141.43 万</b>。选项 128.57 就是忘了加 8 万运费，125.14 是没做价内税还原。<br><br>三种形态并列记：<br>· 从价：组价 =(关税完税价+关税)÷(1-率)<br>· 从量：直接 进口数量×定额税率，<b>不组价</b><br>· 复合：组价 =(关税完税价+关税+进口数量×定额税率)÷(1-率)，税额 = 组价×率 + 数量×定额<br><br>还有个征管要点：进口消费税由<b>报关地海关代征</b>，纳税义务发生时间是<b>报关进口当天</b>，自海关填发专用缴款书之日起 <b>15 日内</b>缴纳（单选 15 答案 C）。进口环节除国务院另有规定外<b>一律不得减免</b>——因为进口货没在国内的生产环节被课过税，这一刀是唯一机会。","sentence":"进口组价 =(关税完税价 + 关税 [+ 数量×定额]) ÷ (1-消费税率)，完税价含运抵口岸前的运保费。报关地海关代征、报关当天发生义务、缴款书起 15 日内缴。","trap":"· 运抵我国<b>输入地点起卸前</b>的运费、保险费要计入完税价；起卸后的境内运费不计。<br>· 进口环节消费税<b>不分一般/小规模</b>，一律按法定税率（和增值税组成计税价格那套不同，别串）。<br>· 进口金银首饰<b>不缴消费税</b>（它的环节只有零售），但缴增值税和关税。<br>· 进口已税消费品在国内直接销售一般不再缴消费税，但卷烟、电子烟、超豪华小汽车要在批发/零售环节二次计税。","table":{"head":["计征方式","组成计税价格","应纳税额"],"rows":[["从价","(完税价+关税)÷(1-率)","组价×率"],["从量","不组价","进口数量×定额税率"],["复合","(完税价+关税+数量×定额)÷(1-率)","组价×率 + 数量×定额"]]},"tips":["进口组价是三个环节里最简单的：分子只有「完税价+关税」，别把加工费、成本利润串进来。","把 3-9 的三行组价表和这里对着看，分子换了、分母没换。"],"qs":[11,15]},{"id":"3-14","name":"已纳消费税扣除：同一税目 + 生产领用","star":"★★★","level":"L3","scene":"化妆品厂外购已税高档香水精，用来连续生产自家高档化妆品；另一家珠宝厂外购已税珠宝玉石，做成金银镶嵌戒指。<br><br>前者可以扣掉上家已缴的消费税，后者<b>一分都不让扣</b>。为什么？","why":"消费税本来只收一刀。如果外购的应税消费品被<b>当作原料，继续加工成同一税目的应税消费品</b>，那上家出厂时已经收过一刀，成品出厂又要收一刀——两刀了。为了避免重复，允许按<b>当期生产领用数量</b>扣掉上家已纳的税。<br><br>三个条件缺一不可：<br>① <b>同一税目内连续生产</b>（烟丝→卷烟、已税高档化妆品→高档化妆品、已税实木地板→实木地板、已税汽油→成品油）。跨税目不行：外购已税珍珠做珍珠项链可以，外购已税珠宝玉石做<b>金银镶嵌首饰</b>不行——因为后者改在零售环节按 5% 征，环节和税目都变了，没有「已纳税」可对应。<br>② <b>按生产领用数量扣</b>，不是按购进数量。购进还没用的部分仍躺在仓库里，扣了就等于提前免税。<br>③ <b>仅在生产环节扣</b>。零售环节征税的金银铂钻一律不得扣除。<br><br>为什么有一张「十大不可扣」清单（酒类（葡萄酒除外）、小汽车、游艇、高档手表、雪茄烟、电子烟、金银铂钻、电池、摩托车、溶剂油、涂料）？因为这些品类要么<b>不是靠连续加工增值的</b>（小汽车、游艇、手表买来基本直接卖），要么<b>政策本来就想让它多缴几道</b>（酒、烟）。记法：<b>可扣的基本都是「原料→同类成品」的加工链</b>。<br><br>还有两个特殊点：<br>· <b>葡萄酒</b>：从葡萄酒生产企业<b>购进或进口</b>可以扣，<b>委托加工收回的不行</b>——口诀「外购含葡可抵扣，委托无葡要牢记」（多选 11 的 D 错在这）。且本期不足抵扣的余额<b>留待下期</b>（多选 12 的 A 对、B 错）。<br>· <b>外购白酒生产白酒一律不得扣</b>，不管高度低度（多选 12 的 C 对、D 错）。<br><br>计算两条线：外购按<b>买价</b>算（期初库存买价 + 当期购进 - 期末库存买价，再×税率）；委托加工收回按<b>税款</b>算（期初税款 + 当期收回税款 - 期末税款）。单选 19：进口高档香水精组价 = 30×(1+20%)÷(1-15%)，×15% = 已纳税额，再乘领用 90% 得 5.72 万；应纳 = 400×15% - 5.72 = <b>54.28 万</b>。","sentence":"可扣 = 同一税目 + 连续生产 + 按当期生产领用数量，且只在生产环节。外购按买价算、委外按已纳税款算；葡萄酒只认购进和进口，白酒一律不扣。","trap":"· 单选 12：纯金/铂金/纯银镶嵌首饰（ABC）都<b>不得扣</b>外购珠宝玉石已纳税款，只有 D 珍珠项链（仍属「贵重首饰及珠宝玉石」税目、在生产环节征）可以扣。<br>· 多选 11 答案 BCH：委托加工收回的已税汽油→成品油、已税高档化妆品→高档化妆品、外购已税杆头→高尔夫球杆可扣；A（金银镶嵌）、D（委托加工葡萄酒）、E（白酒）、F（摩托车）、G（溶剂油）都不可扣。<br>· 单选 23 的 D「外购珍珠已纳税款可以扣除」是<b>错</b>的——不能跨税目抵（高档化妆品 ≠ 珠宝玉石）。<br>· 商贸企业外购后<b>直接转售</b>不得扣除，必须是工业企业连续生产。","table":{"head":["可扣","不可扣"],"rows":[["烟丝→卷烟","酒类（葡萄酒除外）：白酒、黄酒等"],["高档化妆品→高档化妆品","小汽车、游艇、高档手表、摩托车"],["珠宝玉石→贵重首饰(非金银镶嵌)","金银铂钻（零售环节）"],["鞭炮焰火、高尔夫球杆、木筷、实木地板","雪茄烟、电子烟、电池、涂料、溶剂油"],["成品油同类、购进/进口葡萄酒","委托加工收回的葡萄酒"]]},"tips":["先问「是不是同一税目」，再问「是不是生产领用」，两步就能排掉大半选项。","葡萄酒的「外购/进口可扣、委托加工不可扣」是每年都要考一次的分界线。"],"qs":[12,19,11,12]},{"id":"3-15","name":"金银铂钻零售环节：五条专属规则","star":"★★★","level":"L3","scene":"珠宝店一天做了三笔：直接零售金首饰 800 克；以旧换新收了 300 克的差价；还卖了一批镀金首饰。柜台里还有带料加工的、连同包装物一起卖的、和别的产品组成套装的。<br><br>这几笔<b>算法各不相同</b>。","why":"因为金银铂钻把整道消费税挪到了零售环节（见 3-5），所以它的计税依据必须重新定一套——生产环节那套「出厂价」在金店里根本不存在。<br><br>五条专属规则，每条都有理由：<br>① <b>以旧换新按实际收取的不含税全部价款</b>计税。理由：旧首饰是顾客拿来抵价的，金店实际只收到差价，那才是这次交易的真实对价（其他商品以旧换新一般按新货全额计税，金银是特例）。<br>② <b>连同包装物销售，无论是否单独计价都并入销售额</b>。防止把价款拆到包装盒上。<br>③ <b>成套销售按销售额全额征收</b>，不拆分。理由同 3-6 的「成套从高」。<br>④ <b>带料加工</b>：先按受托方同类金银首饰售价，没有才组价 =(材料成本+加工费)÷(1-5%)。<br>⑤ <b>未分别核算</b>：生产环节从高按 10%，零售环节统一按金银首饰 5%。<br><br>轻二单选 25：直接零售 800×1180÷1.13×5% + 以旧换新 300×390÷1.13×5% = <b>46946.90 元</b>；镀金首饰不在零售环节征，15000 元不计。答案 A。选项 D 就是把以旧换新按「新首饰全额」算出来的。<br><br>还有个必须分清的界限：<b>金银铂钻</b> = 金基/银基合金首饰及其镶嵌首饰、铂金首饰、钻石及钻石饰品，<b>零售环节 5%</b>；<b>镀金(银)、包金(银)首饰及其镶嵌首饰、翡翠、珍珠、玛瑙</b>属于「其他贵重首饰及珠宝玉石」，<b>生产/进口环节 10%</b>。多选 23 的 B 镀金首饰、F 翡翠手镯不选，就是这个原因。","sentence":"金银铂钻只在零售按 5%：以旧换新按实收差价、包装物并入、成套按全额、带料加工先同类价后组价、未分别核算零售统一 5%。镀金包金和翡翠珍珠在生产环节 10%。","trap":"· 多选 10 的 B「包装物单独计价无须并入」是<b>错</b>的；C「带料加工按组价」也错，<b>同类售价优先</b>。答案 AD。<br>· 单选 25 里「镀金首饰零售收入 15000」是干扰，镀金首饰在零售环节不缴消费税。<br>· 出国人员免税商店销售金银首饰<b>照征</b>（多选 2 的 C）。<br>· 金银镶嵌首饰在计税时<b>一律不得扣除</b>外购或委托加工收回珠宝玉石的已纳税款（单选 12、多选 11 的 A）。","table":{"head":["情形","计税依据"],"rows":[["一般零售","不含增值税销售额 × 5%"],["以旧换新/翻新改制","实际收取的不含税全部价款（差价）"],["连同包装物","包装物价款并入销售额"],["成套销售","销售额全额"],["带料加工","受托方同类售价 → 无则组价"],["镀金/包金/翡翠/珍珠","不在零售环节；生产/进口 10%"]]},"tips":["看到「以旧换新」先确认是不是金银：金银按实收差价，其他商品按新货全额。","把「金银铂钻 5% 零售」和「其他贵重首饰 10% 生产」写在同一行对照，多选题靠它秒判。"],"qs":[25,10]},{"id":"3-16","name":"卷烟批发与电子烟：谁有资格当纳税人","star":"★★★","level":"L3","scene":"甲卷烟批发企业卖给<b>零售单位</b> 30 箱 168 万，卖给<b>另一家批发企业</b> 10 箱 48 万。电子烟厂甲持有「云雾」商标，同时替别人代加工「云彩」牌。<br><br>两道题考的是同一件事：<b>这一道加征的税，到底该落在谁头上</b>。","why":"先说卷烟批发。加征批发环节的税，是为了在卷烟离开批发体系、流向消费者之前再压一道。因此：<br>· 卖给<b>零售单位/非批发单位</b> → 缴；<br>· <b>批发企业之间</b>互卖 → 不缴（货还在批发圈里，没到终点，提前收会在后续批发环节重复）。<br>轻二单选 24：168÷1.13×11% + 30×250÷10000 = <b>17.10 万</b>；48 万那笔不算。选项 B 就是把两笔都算进去。<br><br>税率是复合：<b>11% + 250 元/标准箱</b>（=1 元/条 = 0.005 元/支）。注意<b>批发环节不得扣除生产环节已纳消费税</b>——这两道税本来就是政策故意叠的，允许扣就白加了。<br><br>再说电子烟。它的规则核心是<b>「持有商标者纳税」</b>：生产环节纳税人是取得烟草专卖生产企业许可证并<b>持有电子烟商标</b>的企业；只做代加工、不持商标的企业<b>不是纳税人</b>，由持有商标的委托方申报。为什么？因为品牌方才是定价、获利的主体，代工厂只是收加工费，向代工厂征税既不好算也容易被转移。<br><br>由此推出「分开核算」的硬要求：一家企业既做自有品牌又做代加工，<b>必须分开核算</b>两类销售额；<b>未分开核算的，一并缴纳消费税</b>。轻二母题 20 分开核算 → 只对「云雾」90 万×36% = 32.4 万（答案 C）；子题 21 未分开 → (90+35)×36% = 45 万（答案 D）。母子题并排，就是让你记住「分开」这个动作值 12.6 万。<br><br>电子烟的其他边界：从价定率（<b>不是复合</b>，多选 14 的 A 错）；生产/进口 36%、批发 11%；征税对象含烟弹、烟具及组合产品；代销按经销商卖给批发企业的销售额计税。","sentence":"卷烟批发：只卖给零售商的那部分缴，11%+250 元/箱，不得扣生产环节已纳税。电子烟：持商标者纳税，代加工不是纳税人；自有品牌与代加工必须分开核算，否则一并缴；从价 36%/11%。","trap":"· 多选 13：批发企业之间销售卷烟不缴（B 错）；总分机构不在同一地区由<b>总机构</b>申报（D 错）；兼营批发零售未分开核算的<b>全部视同批发</b>征税（C 对）。答案 AC。<br>· 多选 14 的 D「代加工企业申报缴纳」是错的，由持商标企业申报；答案 BC。<br>· 批发环节卷烟不分甲乙类，一律 11% + 250 元/箱——别把生产环节的 56%/36% 带过来。<br>· 多选 17 问批发环节征税的只有卷烟和电子烟，<b>烟丝、雪茄烟不选</b>。","table":{"head":["","卷烟批发","电子烟"],"rows":[["环节","生产/进口 + 批发加征","生产(进口) 36% + 批发 11%"],["计征方式","复合 11% + 250 元/箱","从价定率（非复合）"],["纳税人","从事卷烟批发的单位/个人","持商标的企业；代加工方不是"],["特殊排除","批发企业之间销售不缴","自有品牌与代加工应分开核算"]]},"tips":["卷烟批发题先圈出买方身份：零售商=缴，批发商=不缴。","电子烟母子题的差别只有「分开核算」四个字，做题时先找这句话。"],"qs":[20,21,24,13,14]},{"id":"3-17","name":"超豪华小汽车：90 万这条线（课件旧数字要小心）","star":"★★","level":"L2","scene":"4S 店零售一辆不含税价 100 万的纯电动小汽车；另一辆 85 万的中轻型商用客车；还有一辆二手超豪华车。<br><br>哪些要在零售环节加征 10%？","why":"超豪华小汽车的零售加征，逻辑和卷烟批发一样：<b>生产环节按排量征税只看车，看不到「这笔消费有多奢侈」</b>，只有最终成交价能体现。所以国家在零售端再按成交价抽 10%。<br><br>门槛是<b>每辆零售价格 ≥90 万元（不含增值税）</b>的各种动力类型乘用车和中轻型商用客车。<br><br><b>⚠ 这里有个必须提醒的坑</b>：ima 课件第 03 讲考点二写的是「售价 ≥130 万元」，那是 2016 年政策刚出台时的旧标准；<b>2025 年新政已下调到 90 万元</b>，同一份课件后面的考点四、以及轻二 2026 版答案册用的都是 90 万。按旧资料复习会直接做错单选 4 和多选 23。做数字题一律以教材和当年政策为准。<br><br>按动力类型分两种：<br>· <b>有气缸容量</b>（燃油、混动）：生产/进口环节按现行税率征 + 零售环节加征 10%，<b>双环节</b>；生产企业直接卖给消费者时两档税率叠加。<br>· <b>无气缸容量</b>（纯电动、燃料电池）：<b>仅在零售环节</b>征一道 10%，生产/进口环节不征。理由是排量税本来就没法对无排量车课。<br><br>零售环节销售额<b>包含以精品、配饰、服务等名义收取的价款</b>（2026 新规，单选 7 的 D 就错在这）；<b>二手超豪华小汽车不征</b>（第一手已课过）。","sentence":"不含税零售价 ≥90 万 → 零售加征 10%；有排量的双环节、纯电/燃料电池只在零售征；服务费精品费并入销售额；二手车不征。","trap":"· 课件里的「130 万」是旧标准，<b>现行是 90 万</b>。这是本章最值得单独记的一个政策更新。<br>· 轻二单选 7 答案 C：A「85 万中轻型商用客车属于征收范围」错在没到 90 万；B「燃料电池超豪华车进口+零售都征」错在只在零售征；D「服务费不计入」错在新规明确要计入。C「二手超豪华不征」正确。<br>· 单选 4 答案 B：4S 店零售 100 万纯电动车要征；A 雪茄烟批发不征；C 8000 元手表不到门槛；D 进口金银饰品不征。<br>· 多选 23 里纯电动超豪华小汽车（C）和燃油超豪华小汽车（H）都要选。","table":{"head":["车型","生产/进口环节","零售环节"],"rows":[["有排量、≥90 万","按现行税率征","加征 10%"],["纯电/燃料电池、≥90 万","不征","仅此一道 10%"],["<90 万","按现行税率征（普通小汽车）","不加征"],["二手超豪华","—","不征"]]},"tips":["90 万统一按「不含增值税」口径，题目给含税价先 ÷1.13。","把「只在零售征」的两类放一起记：金银铂钻、纯电/燃料电池超豪华车。"],"qs":[4,7]},{"id":"3-18","name":"出口退（免）税：只看主体，不看商品","star":"★★★","level":"L3","scene":"四种出口：① 外贸企业买了一批木制一次性筷子直接出口；② 酒厂出口自产红酒；③ 高尔夫球具厂委托外贸企业代理出口自产球杆；④ 商业批发企业委托外贸企业代理出口涂料。<br><br>四种商品都是应税消费品，四种待遇完全不同。","why":"消费税只收一刀，而且是在<b>生产环节</b>收。所以出口时能不能退税，取决于一个朴素的问题：<b>这批货在国内到底缴过消费税没有</b>。<br><br>· <b>外贸企业购进后直接出口</b>：它从生产企业买货时，价格里<b>已经含了那一道消费税</b>（是它真金白银付出去的）。货要裸价出海参与竞争，就该把这笔已纳税退回去 → <b>免税并退税</b>。<br>· <b>生产企业自营出口 / 委托外贸代理出口自产货</b>：货是它自己生产的，出口时生产环节直接免征，<b>压根没缴过</b> → 无税可退，只能 <b>免税但不退税</b>。<br>· <b>一般商贸企业（既非生产企业也非外贸企业）委托代理出口</b>：不具备出口退税资格 → <b>不免税也不退税</b>，出口时照缴。<br><br>所以判断顺序是：<b>先看出口主体是谁，再看它有没有「买进来」</b>。口诀：<b>外贸购进出「免退」，生产自营出「免不退」，商贸出口「不免不退」</b>。<br><br>「外贸企业受其他外贸企业委托代理出口」属于第一类（免税并退税），因为委托方本身是外贸企业、货是购进的，已纳税款确实存在。<br><br>轻二单选 13 答案 C（外贸企业购进木筷直接出口 → 免税并退税）；A 酒厂自产出口、B 生产企业委托代理出口都是免税不退税；D 商业批发企业委托代理出口是不免税也不退税。","sentence":"外贸购进（含受其他外贸企业委托代理）→ 免税并退税；生产企业自营或委托出口自产 → 免税不退税；一般商贸企业委托出口 → 不免税也不退税。","trap":"· 多选 15 问「免税不退税」：C 高档化妆品生产企业自营出口、D 实木地板生产企业委托外贸出口自产，选；A 外贸企业购进电子烟直接出口、B 外贸企业受其他外贸企业委托代理出口都是免税并退税，不选。<br>· 多选 16 答案 CD：A「外贸企业购进直接出口不予退还」错（可退）；B「生产企业自营出口可办理退还」错（没缴过）；C 生产企业委托代理出口自产不予退还、D 外贸企业受其他外贸企业委托代理出口可退，都对。<br>· 退税计税依据是<b>已征且未在内销应纳税额中抵扣过</b>的购进金额/数量，以消费税专用缴款书为准；从价按金额×率、从量按数量×定额、复合两者相加。<br>· 别和增值税的「免抵退/免退」串：消费税生产环节单一，没有「抵」这一层。","table":{"head":["出口主体 / 方式","政策","理由"],"rows":[["外贸企业购进直接出口","免税并退税","购进货价里已含消费税"],["外贸企业受其他外贸企业委托代理出口","免税并退税","同上"],["生产企业自营出口自产","免税不退税","生产环节直接免，没缴过"],["生产企业委托外贸代理出口自产","免税不退税","同上"],["一般商贸企业委托外贸代理出口","不免税也不退税","无出口退税资格"]]},"tips":["三句口诀抄下来，本章出口题基本不会错。","看到「生产企业」四个字先默认「免税不退税」，看到「外贸企业购进」先默认「免税并退税」。"],"qs":[13,15,16]},{"id":"3-19","name":"征收管理：义务发生时间、期限、地点三张表","star":"★★","level":"L2","scene":"四笔业务：分期收款合同约定本月收 50%（客户只付了 30%）；预收货款但货还没发；委托银行收款已发货并办妥托收；进口一批烟丝刚报关。<br><br>本月该缴哪几笔？","why":"消费税只有一个环节，<b>纳税义务发生时间就是那一刀落下的时刻</b>，定错了就整期错。核心原则是「<b>以结算方式决定的法定时点为准，不以实际收钱、开票为准</b>」——否则企业拖着不收钱就能无限递延。<br><br>· <b>赊销/分期收款</b>：<b>书面合同约定的收款日</b>当天；没约定或没书面合同才是发出当天。所以单选 22 里，合同约定 50% 就按 50% 的销售额算，<b>实际只收到 30% 不影响</b>；预收货款那笔因为没发货，本月不缴。<br>· <b>预收货款</b>：发出应税消费品当天。<br>· <b>托收承付 / 委托银行收款</b>：<b>发出并办妥托收手续</b>当天（两个条件同时满足，单选 16 答案 A）。<br>· <b>自产自用</b>：移送使用当天。<br>· <b>委托加工</b>：<b>纳税人提货当天</b>（消费税特有，多选 18 的 B「加工完成当天」错在这）。<br>· <b>进口</b>：报关进口当天。<br><br>纳税期限与增值税基本一致：1/3/5/10/15 日、1 个月或 1 个季度；月/季期满 15 日内申报，短期限满 5 日内预缴、次月 1 日起 15 日内结清；<b>进口自海关填发缴款书之日起 15 日内</b>（单选 15 答案 C，注意不是「次月 15 日」）。<br><br>纳税地点记「<b>跟着纳税人走，不跟货走</b>」：销售及自产自用 → 机构所在地/居住地；到外县销售或委托外县代销 → <b>仍回机构所在地</b>（单选 14 的 A 错）；进口 → <b>报关地海关</b>（B 错）；委托加工 → 一般由<b>受托方</b>机构所在地解缴（D 说成委托方缴纳也错）。答案 C。","sentence":"分期收款看合同约定日、预收看发货日、托收看「发货+办妥手续」、自用看移送、委外看提货、进口看报关。地点跟人不跟货，进口找报关地海关。","trap":"· 多选 18 答案 CDF：A 分期收款「发出当天」错；B 委托加工「加工完成」错（应提货当天）；E 投资入股「办股权证」错（应移送使用当天）；C 报关进口当天、D 预收货款发出当天、F 托收承付发货并办妥手续当天都对。<br>· 委托加工由受托方解缴，但<b>受托方是个人（含个体户）时</b>由委托方在自身机构所在地申报——两个例外叠一起最容易错。<br>· 卷烟批发企业总分机构不在同一地区的，<b>由总机构汇总申报</b>（不是分别申报）。","table":{"head":["情形","纳税义务发生时间","纳税地点"],"rows":[["分期收款/赊销","合同约定收款日；无约定则发出当天","机构所在地/居住地"],["预收货款","发出应税消费品当天","机构所在地/居住地"],["托收承付/委托收款","发出并办妥托收手续当天","机构所在地/居住地"],["自产自用","移送使用当天","机构所在地/居住地"],["委托加工","纳税人提货当天","受托方机构所在地（个人受托除外）"],["进口","报关进口当天","报关地海关"]]},"tips":["把「实际收钱」「开票」「发货」三个时点划掉，只认法定时点。","进口的 15 日从「海关填发缴款书之日」起算，不是期满、也不是次月。"],"qs":[14,16,22,18]},{"id":"3-20","name":"收尾：两税同缴判断表 + 2026 新增的成品油检测","star":"★★","level":"L2","scene":"八笔业务摆一排，问哪些<b>同时</b>缴增值税和消费税：进口轮胎、零售翡翠手镯、啤酒屋卖自产啤酒、卖自产中轻型商用客车、自产葡萄酒做酒心巧克力、自产卷烟抵债、自产涂料装修办公室、自产素板做实木指接地板。<br><br>这不是背规则，是走两道门。","why":"「两税同缴」是本章的综合题眼，因为它逼你把前三章的东西同时调用起来。判断顺序固定两步：<br><br><b>第一步：消费税的门</b>——是不是 15 类应税消费品？是不是处在它的征税环节？<br><b>第二步：增值税的门</b>——是不是发生了「有偿转让」或「视同销售货物」？<br><br>于是八笔业务可以分成四类（轻二多选 25 答案 CDF）：<br>· <b>只缴增值税</b>：进口轮胎（轮胎不是 15 类）、零售翡翠手镯（翡翠在生产/进口环节征，零售不是它的环节）；<br>· <b>只缴消费税</b>：自产葡萄酒做酒心巧克力（连续生产非应税消费品，见 3-11）；<br>· <b>两税都不缴</b>：自产素板做实木指接地板（连续生产应税消费品）；<br>· <b>两税都缴</b>：啤酒屋卖自产啤酒、卖自产中轻型商用客车、自产卷烟抵偿债务。<br><br>多选 26 同型：A 自产鞭炮发员工福利（两税都缴）、B 自产高档香水精做高档口红（连续生产应税品，都不缴）、C 外购葡萄酒对外投资（增值税缴、消费税不缴——外购不是自产）、D 自产实木地板装修职工食堂（消费税缴、增值税不缴）。答案 AD。<br><br>最后补一个 2026 新增考点（多选 27 全选）：<b>成品油涉税产品检测</b>。为什么会有这条？回到 3-4——成品油的边界靠「用途」和一堆化工品清单划，企业改个名字就能争议「我这不算成品油」。所以税务机关需要技术检测来定事实。可启动检测的情形有四类：纳税人对是否征税或适用税率有争议、举报线索反映风险、税务机关自行发现风险、新闻媒体曝光造成重大影响，外加兜底的「其他情形」。由税务机关牵头，可联合发改、财政、市场监管部门，也可请第三方检测机构协助；检测结果用于纳税评估、税务稽查和行政处罚的事实依据。","sentence":"两税同缴走两道门：先看「15 类 + 征税环节」，再看「有偿转让或视同销售」。进口轮胎/零售翡翠只缴增值税，自产做非应税品只缴消费税，连续生产应税品都不缴。","trap":"· 「零售翡翠手镯」不是「不缴消费税」这么简单——它在生产环节已经缴过，零售环节不重复缴，所以零售这笔只缴增值税。<br>· 自产用于<b>职工福利/馈赠</b>两税都缴；自产用于<b>管理部门/在建工程/连续生产非应税品</b>只缴消费税。这条分界在多选 25、26 里反复出现。<br>· 多选 27 四个选项全对（ABCD），别因为「新闻媒体曝光」看着不像法定情形就排除，它是明文列举的启动情形之一。","table":{"head":["业务类型","增值税","消费税"],"rows":[["非 15 类商品销售/进口","√","×"],["应税消费品在非征税环节销售","√","×"],["连续生产应税消费品","×","×"],["连续生产非应税品/在建工程/管理部门","×","√"],["馈赠/福利/奖励/样品/换投抵","√","√"],["生产环节正常对外销售","√","√"]]},"tips":["把这张表当作本章的结课检查表，任何一道「缴不缴」的题都往上套。","遇到「外购」二字先停一下：外购商品对外投资不涉及自产，消费税不缴。"],"qs":[25,26,27]}],"questions":[{"no":1,"type":"single","block":"3-2","stem":"下列消费品中，暂缓征收消费税的是（　）。","opts":{"A":"航天煤油","B":"鞭炮药引线","C":"太阳能电池","D":"纯生物柴油"},"ans":"A","exam":"四个选项正好是四种法律状态，考的是「不征 / 免税 / 暂缓征收」分不分得清。","think":"A 航天煤油：参照航空煤油，<b>暂缓征收</b>——进了成品油税目，国家暂时不收，随时可能恢复。B 鞭炮药引线：<b>不属于征税范围</b>（和体育发令纸一样）。C 太阳能电池：属于电池税目但<b>免征</b>。D 纯生物柴油：属于成品油税目，符合条件<b>免征</b>。","trap":"「暂缓征收」不等于「免税」。轻二把三个状态各放一个选项，就是逼你别看到「不用缴税」就随便选。记：<b>航空煤油、航天煤油 = 暂缓</b>；无汞原电池、锂电、太阳能、燃料电池、全钒液流电池、纯生物柴油 = 免征；烟叶、酒精、发令纸、绝缘油 = 不征。","raw":"选项A：对航天煤油参照航空煤油暂缓征收消费税。选项B：不征收消费税。选项CD：免征消费税。"},{"no":2,"type":"single","block":"3-3","stem":"下列消费品中，属于消费税「小汽车」税目征税范围的是（　）。","opts":{"A":"大型商用客车","B":"沙滩车","C":"中轻型商用客车","D":"卡丁车"},"ans":"C","exam":"小汽车税目的边界：按座位数和底盘属性划，不按「长得像不像车」。","think":"「小汽车」税目只覆盖两类：<b>乘用车（≤9 座）</b>和<b>中轻型商用客车（10~23 座）</b>，以及用对应底盘改装/改制的车型。C 中轻型商用客车正好落在这条线上。A 大型商用客车（含车身≥7 米且 10~23 座的）明确排除；B 沙滩车、D 卡丁车和雪地车、高尔夫车一起属于休闲娱乐车辆，一律不征。","trap":"别被「商用」两个字带偏——中轻型商用客车是<b>征</b>的，只有大型商用客车和货车不征。另外判定看<b>底盘（车架）原始属性</b>，改装车按原底盘算，不看外观。","raw":"选项AC：中轻型商用客车属于「小汽车」税目，大型商用客车不属于。选项BD：沙滩车、雪地车、卡丁车、高尔夫车等均不属于消费税征税范围。"},{"no":3,"type":"single","block":"3-1","stem":"纳税人生产销售的下列货物，应征收消费税的是（　）。","opts":{"A":"高档奢侈品皮包","B":"实木家具","C":"调味料酒","D":"游艇"},"ans":"D","exam":"消费税只挑 15 类商品，「高档」「实木」这类形容词最容易骗人。","think":"逐个过 15 类清单：A 皮包再贵也不在税目里（高档化妆品、贵重首饰、高档手表有，皮具没有）；B 实木<b>家具</b>不征，征的是实木<b>地板</b>；C 调味料酒不征（酒类征的是白酒、啤酒、黄酒、其他酒，酒精和调味料酒排除）；D 游艇是明确的税目（8~90 米、内置发动机）。","trap":"「实木」两个字只在「实木地板」这个税目里有用，实木家具、实木工艺品都不征。同理「高档」只出现在「高档化妆品」「高档手表」，高档服装、高档皮包都不征。做题时把 15 类在脑子里过一遍，别凭语感。","raw":"选项ABC：均不属于消费税应税消费品，不征收消费税。"},{"no":4,"type":"single","block":"3-17","stem":"下列各项应当征收消费税的是（　）。","opts":{"A":"香烟批发商批发销售雪茄烟","B":"4S 店零售不含税价 100 万元的纯电动小汽车","C":"手表厂生产销售单价 8000 元手表","D":"进出口企业从国外进口金银饰品"},"ans":"B","exam":"一道题同时考四个「征税环节 + 门槛」，是每个选项都要单独判的综合小题。","think":"A 雪茄烟只在生产/委托加工/进口环节征，<b>批发环节不征</b>（只有卷烟和电子烟在批发加征）。B 纯电动小汽车零售不含税价 100 万 ≥<b>90 万</b>，属于超豪华小汽车，且无气缸容量的车型<b>仅在零售环节</b>征 10%，要缴。C 高档手表门槛是每只 ≥10000 元，8000 元不到线，不征。D 金银铂钻<b>只在零售环节</b>征，进口不是它的环节，不征。","trap":"超豪华小汽车的门槛是 <b>90 万（不含增值税）</b>，2025 年新政从 130 万下调而来——ima 课件里还写着 130 万，按旧数字会把 B 判成不征。<b>这条是本章最值得单独记的政策更新</b>。另外注意题干问「应当征收」，四个选项里只有 B 同时满足「在 15 类里」和「处在征税环节」。","raw":"选项A：雪茄烟在生产销售、委托加工或进口环节缴纳消费税，批发环节不缴纳。选项B：零售价格90万元（不含增值税）及以上的纯电动、燃料电池等没有气缸容量的小汽车属于超豪华小汽车，在零售环节征收消费税。选项C：高档手表指不含增值税售价每只10000元（含）以上。选项D：金银铂钻在零售环节缴纳消费税，进口环节不缴纳。"},{"no":5,"type":"single","block":"3-10","stem":"某电池生产企业为增值税一般纳税人，下设一非独立核算的门市部，2025 年 11 月将生产的一批成本价 78 万元的铅蓄电池移送门市部，门市部将其中 60% 对外销售，取得含税销售额 89.73 万元。已知成本利润率为 4%。该企业此项业务应缴纳的消费税税额为（　）万元。（铅蓄电池消费税税率为 4%）","opts":{"A":"3.18","B":"3.59","C":"3.38","D":"5.29"},"ans":"A","exam":"自设非独立核算门市部：内部调拨价不作数，按门市部对外实价计税。","think":"门市部不是独立法人，把货从车间移到门市部<b>根本不是销售</b>，真实交易只有门市部卖给客户那一笔。所以计税依据是<b>门市部对外实际销售额 89.73 万（含增值税）</b>：89.73 ÷ (1+13%) × 4% = <b>3.18 万</b>。","trap":"题干里的「成本价 78 万」「成本利润率 4%」「只卖了 60%」全是干扰项。成本价是内部调拨价，国家不认；60% 是移送比例，也不用来折算——按<b>实际对外卖了多少、卖了多少钱</b>算。选 D 5.29 就是拿 78 万去组价了。","raw":"纳税人通过自设非独立核算门市部销售的自产应税消费品，应按门市部对外销售额或者销售数量计算征收消费税。应纳消费税=89.73÷(1+13%)×4%=3.18（万元）。"},{"no":6,"type":"single","block":"3-10","stem":"某化妆品厂为增值税一般纳税人，2025 年 12 月：5 日销售高档化妆品 200 箱，每箱不含税价 5 万元；15 日销售同类高档化妆品 300 箱，每箱不含税价 5.1 万元。当月以 100 箱同类高档化妆品与某公司换取香水精。该厂当月应纳消费税（　）万元。（高档化妆品消费税税率为 15%）","opts":{"A":"379.5","B":"456","C":"454.5","D":"459"},"ans":"B","exam":"「换取生产资料」属于换投抵，要用同类最高销售价格，不是平均价、更不是成本价。","think":"前两笔正常销售按各自实价：5×200 = 1000 万，5.1×300 = 1530 万。第三笔拿 100 箱换香水精，属于「换取生产资料」，按<b>同类最高销售价格 5.1 万/箱</b>：5.1×100 = 510 万。合计 (1000+1530+510) × 15% = 3040×15% = <b>456 万</b>。","trap":"选项 C 454.5 是把换货那 100 箱按 5 万算出来的；A 379.5 更低。记住<b>换、投、抵三种情形用最高价</b>，因为这类交易没有货币对价，企业最容易作价偏低。<b>对比记：增值税在同样场景用平均价</b>——增值税链条不断，用平均价就够；消费税只收一刀，必须用上限守住税基。","raw":"纳税人将自产的应税消费品用于换取生产资料和消费资料、投资入股和抵偿债务等方面，应当按纳税人同类应税消费品的最高销售价格作为计税依据。应纳消费税=(5×200+5.1×300+5.1×100)×15%=456（万元）。"},{"no":7,"type":"single","block":"3-17","stem":"下列关于超豪华小汽车征收消费税的表述，正确的是（　）。","opts":{"A":"不含增值税零售价格为 85 万元的中轻型商用客车属于超豪华小汽车征收范围","B":"对燃料电池超豪华小汽车在进口环节和零售环节征收消费税","C":"对纳税人销售二手超豪华小汽车，不征收消费税","D":"纳税人向购买方以服务名义收取的价款无须计入零售环节销售额"},"ans":"C","exam":"超豪华小汽车四个高频细节：90 万门槛、无排量只征零售、二手车不征、服务费要并入。","think":"A 错：门槛是每辆零售价 ≥<b>90 万元（不含增值税）</b>，85 万不到线。B 错：纯电动、燃料电池等<b>没有气缸容量</b>的超豪华小汽车<b>仅在零售环节</b>征，进口环节不征。C 对：二手超豪华小汽车不征——那笔奢侈消费在第一手已经课过税。D 错：零售环节销售额<b>包括以精品、配饰和服务等名义收取的价款</b>（2026 新规）。","trap":"B 最容易错：有排量的超豪华车是「生产/进口 + 零售」双环节，纯电/燃料电池是<b>只有零售一道</b>。把 3-5 那张环节表调出来对照。另外课件里的「130 万」是旧标准，本题按 90 万判。","raw":"选项A：征收范围为每辆零售价格90万元（不含增值税）及以上的各种动力类型的乘用车和中轻型商用客车。选项B：纯电动、燃料电池等没有气缸容量的超豪华小汽车仅在零售环节征收消费税。选项D：零售环节销售额包括纳税人向购买方以精品、配饰和服务等名义收取的价款。"},{"no":8,"type":"single","block":"3-9","stem":"（母题）某酒厂为增值税一般纳税人，2025 年 12 月将 1 吨自制新型粮食白酒无偿赠送给客户，无同类白酒销售价格。已知粮食白酒成本为 42000 元/吨，成本利润率为 10%。该酒厂上述业务当月应纳消费税（　）元。（白酒消费税税率为 20% 加 0.5 元/500 克）","opts":{"A":"12800","B":"11800","C":"11550","D":"13000"},"ans":"A","exam":"自产自用 + 无同类价 + 复合计征，组价公式的完整应用。","think":"无偿赠送属于「其他用途」，移送时视同销售缴消费税。无同类售价才组价：<br>① <b>1 吨 = 2000 个 500 克</b>，定额税 = 2000×0.5 = 1000 元。<br>② 复合组价 = [成本×(1+利润率) + 数量×定额税率] ÷ (1-比例税率) = [42000×1.1 + 1000] ÷ (1-20%) = 47200÷0.8 = <b>59000 元</b>。<br>③ 应纳 = 59000×20% + 1000 = 11800+1000 = <b>12800 元</b>。","trap":"· 定额税要<b>先放进分子、一起除 (1-20%)</b>，不是算完再加。<br>· 1 吨 = 2000 斤 = 2000 个 500 克，这步换算错整题就错。<br>· 选项 B 11800 是只算了从价部分，漏了定额税；D 13000 是下一题（有同类价）的答案，母子题别串。","raw":"自制粮食白酒无偿赠送给客户，应视同销售缴纳消费税。无同类白酒销售价格时，应组成计税价格计算消费税。组成计税价格=[42000×(1+10%)+1×2000×0.5]÷(1-20%)=59000（元），应纳消费税=59000×20%+1×2000×0.5=12800（元）。"},{"no":9,"type":"single","block":"3-9","stem":"（子题）将上题条件「无同类白酒销售价格」修改为「该酒厂同类白酒销售价格为 60000 元/吨」，其他条件不变。该酒厂上述业务当月应纳消费税（　）元。（白酒消费税税率为 20% 加 0.5 元/500 克）","opts":{"A":"12800","B":"11800","C":"11550","D":"13000"},"ans":"D","exam":"母子题只改一个条件，考的是「同类售价优先于组价」这条顺序。","think":"一旦有同类售价，就<b>不再组价</b>——真实市场价是最可靠的税基，组价只是兜底。应纳 = 60000×20% + 2000×0.5 = 12000 + 1000 = <b>13000 元</b>。定额税那 1000 元照加，因为复合计征是「从价 + 从量」两条腿。","trap":"成本 42000、成本利润率 10% 全部作废，别再代进组价公式。<b>「有同类价用同类价、无同类价才组价」</b>这条顺序在自产自用、委托加工、金银带料加工里都适用，是本章最值钱的一条通用规则。","raw":"自制粮食白酒无偿赠送给客户，应视同销售缴纳消费税。有同类白酒销售价格时，应优先适用同类价。应纳消费税=60000×20%+1×2000×0.5=13000（元）。"},{"no":10,"type":"single","block":"3-12","stem":"根据消费税的相关规定，下列各项中，属于委托加工业务的是（　）。","opts":{"A":"受托方提供原材料，委托方支付加工费和辅助材料费","B":"受托方先将原材料卖给委托方，再接受加工由委托方支付加工费","C":"委托方提供原料和主要材料，受托方只收取加工费和代垫部分辅助材料费","D":"由受托方以委托方名义购进原材料生产，再由委托方支付加工费和辅助材料费"},"ans":"C","exam":"真委托的唯一判据：原料和主要材料由谁出。","think":"只有 C 是<b>委托方出原料和主要材料、受托方只收加工费和代垫辅料</b>——商品所有权从头到尾没转移，受托方只是提供劳务。A、B、D 三种情形下原料实际由受托方提供（B 是先卖料再加工、D 是以委托方名义购料），税法一律判成<b>受托方销售自制应税消费品</b>。","trap":"三种「假委托」要背熟：① 受托方提供原料；② 受托方先卖料给委托方再加工；③ 受托方以委托方名义购料。判别时只看「谁承担了原料的取得」，不看合同标题写的是不是「委托加工合同」。定性错了，后面纳税人、组价、代收代缴全错。","raw":"选项ABD：受托方应当按照销售自制应税消费品缴纳消费税。委托加工的定义：委托方提供原料和主要材料，受托方只收取加工费和代垫部分辅助材料加工的应税消费品。"},{"no":11,"type":"single","block":"3-13","stem":"某卷烟厂进口一批烟丝，货物成交价合计 292 万元，该卷烟厂另行承担并支付运抵我国口岸前的运费和保险费支出 8 万元，进口环节应缴纳的消费税为（　）万元。（烟丝关税税率为 10%，消费税税率为 30%）","opts":{"A":"137.66","B":"141.43","C":"128.57","D":"125.14"},"ans":"B","exam":"进口组价三步：完税价含运保费 → 加关税 → 除以 (1-消费税率) 还原价内税。","think":"① <b>关税完税价格</b> = 292 + 8 = 300 万（货物运抵我国境内输入地点<b>起卸前</b>的运费、保险费要计入）。<br>② 关税 = 300×10% = 30 万。<br>③ 消费税是价内税，组价 = (300+30) ÷ (1-30%) = <b>471.43 万</b>。<br>④ 应纳 = 471.43×30% = <b>141.43 万</b>。","trap":"· 8 万运保费漏掉会得 128.57（选项 C）；<br>· 没做 ÷(1-30%) 的价内税还原会得 99（不在选项里），把关税也算漏会得 125.14（D）。<br>· 分母是 <b>(1-消费税率)</b> 不是 (1+增值税率)——消费税是价内税，税要「加回」价格里。","raw":"进口货物的关税计税价格包括货价、货物运抵我国境内输入地点起卸前的运输及其相关费用、保险费。组成计税价格=(关税计税价格+关税)÷(1-消费税比例税率)=(292+8)×(1+10%)÷(1-30%)=471.43（万元）；进口环节应纳消费税=471.43×30%=141.43（万元）。"},{"no":12,"type":"single","block":"3-14","stem":"某工艺品厂在计算缴纳下列产品消费税时，可以扣除外购珠宝玉石已纳消费税的是（　）。","opts":{"A":"外购已税玛瑙生产的纯金镶嵌戒指","B":"外购已税翡翠生产的铂金镶嵌项链","C":"外购已税珊瑚生产的纯银镶嵌手链","D":"外购已税珍珠加工的珍珠项链"},"ans":"D","exam":"已纳税额扣除的两道门：同一税目 + 只在生产环节扣。","think":"A、B、C 做出来的都是<b>金银镶嵌首饰</b>，属于「金银铂钻」类，<b>改在零售环节按 5% 征税</b>。这类商品在计税时一律不得扣除外购或委托加工收回的珠宝玉石已纳税款——因为生产环节压根没缴过消费税，没有「已纳税」可对应。D 珍珠项链仍属「贵重首饰及珠宝玉石」税目、在生产环节按 10% 征，属于同一税目连续生产，可按<b>当期生产领用数量</b>扣除。","trap":"看到「纯金 / 铂金 / 纯银镶嵌」就要条件反射：零售环节、不得抵扣。别被「外购已税珠宝玉石」这几个字带走——<b>能不能扣看成品在哪个环节缴税，不看原料缴没缴过</b>。","raw":"选项ABC：纳税人用外购的已税珠宝玉石生产的改在零售环节征收消费税的金银首饰（镶嵌首饰），在计税时一律不得扣除外购珠宝玉石的已纳税款。选项D：用外购已税珠宝玉石为原料生产的贵重首饰及珠宝玉石，应按当期生产领用数量扣除珠宝玉石已纳的消费税税款。"},{"no":13,"type":"single","block":"3-18","stem":"下列各项中，适用消费税出口免税并退税政策的是（　）。","opts":{"A":"酒厂出口自产红酒","B":"高尔夫球具厂委托外贸企业代理出口自产高尔夫球杆","C":"外贸企业购进木制一次性筷子直接出口","D":"商业批发企业委托外贸企业代理出口涂料"},"ans":"C","exam":"出口三档政策，只按出口主体和「有没有买进来」判断。","think":"能不能退税，取决于这批货在国内<b>缴没缴过消费税</b>。C 外贸企业是<b>购进</b>后出口，买价里已经含了生产企业缴的那一道消费税，货要裸价出海就该退 → <b>免税并退税</b>。A 生产企业自营出口、B 生产企业委托外贸代理出口自产货，都在生产环节直接免征、<b>没缴过</b> → 免税不退税。D 一般商贸企业没有出口退税资格 → 不免税也不退税。","trap":"口诀：<b>外贸购进出「免退」，生产自营出「免不退」，商贸出口「不免不退」</b>。注意「外贸企业受其他外贸企业委托代理出口」属于第一类（免税并退税），因为委托方本身是外贸企业、货是购进的。别把「委托代理」四个字一律归到生产企业那档。","raw":"选项AB：适用出口免税不退税政策。选项D：适用出口不免税也不退税政策。"},{"no":14,"type":"single","block":"3-19","stem":"下列关于消费税纳税地点的表述中，正确的是（　）。","opts":{"A":"甲个体工商户到外县销售自产应税消费品，应向销售地税务机关申报纳税","B":"乙企业进口应税消费品，应向企业所在地申报纳税","C":"丙企业自产自用的应税消费品，除另有规定外，应向机构所在地或者居住地的主管税务机关申报纳税","D":"委托非个人加工应税消费品，委托方向机构所在地或居住地主管税务机关缴纳消费税税款"},"ans":"C","exam":"纳税地点总原则：跟着纳税人走，不跟着货走；只有进口例外。","think":"A 错：到外县销售或委托外县代销自产应税消费品，<b>仍回机构所在地/居住地</b>申报，不随临时销售地变。B 错：进口向<b>报关地海关</b>申报，由海关代征。C 对：销售及自产自用一律机构所在地/居住地。D 错：委托加工由<b>受托方</b>向自身机构所在地解缴（受托方是个人/个体户时才由委托方自缴）。","trap":"D 的表述特别阴——它把「委托方」和「受托方」调了个个儿。记：<b>源泉控制在受托方交货那一刻</b>，所以税在受托方所在地入库。只有「受托方是个人」这个例外才回到委托方。","raw":"选项A：到外县（市）销售或者委托外县（市）代销自产应税消费品的，于应税消费品销售后，应当向机构所在地或者居住地主管税务机关申报纳税。选项B：进口应税消费品，应向报关地海关申报纳税。选项D：委托非个人加工应税消费品，受托方向机构所在地或居住地主管税务机关解缴消费税税款。"},{"no":15,"type":"single","block":"3-13","stem":"纳税人进口应税消费品，应当自海关填发海关进口消费税专用缴款书之日起一定期限内缴纳消费税，该期限为（　）。","opts":{"A":"5 日","B":"10 日","C":"15 日","D":"30 日"},"ans":"C","exam":"进口消费税的缴款期限，起算点是「海关填发缴款书之日」。","think":"自海关填发海关进口消费税<b>专用缴款书之日起 15 日内</b>缴纳税款。这个 15 日和按月/按季申报「期满之日起 15 日内」数字一样，但<b>起算点完全不同</b>：一个是缴款书填发日，一个是纳税期满日。","trap":"别选成「次月 15 日」——那是国内按月申报的口径。进口环节由海关代征，跟着海关的单据走。顺便把整张期限表记下来：月/季 → 期满 15 日内申报；1/3/5/10/15 日 → 期满 5 日内预缴、次月 1 日起 15 日内结清；进口 → 缴款书之日起 15 日内。","raw":"纳税人进口应税消费品，应于海关填发海关进口消费税专用缴款书之日起15日内缴纳消费税税款。"},{"no":16,"type":"single","block":"3-19","stem":"纳税人采取委托银行收款方式销售应税消费品的，其消费税纳税义务发生时间为（　）。","opts":{"A":"发出应税消费品并办妥托收手续的当天","B":"签收货物的当天","C":"签订合同的当天","D":"支付货款的当天"},"ans":"A","exam":"托收承付 / 委托银行收款：两个条件要同时满足。","think":"税法给的是<b>「发出应税消费品」+「办妥托收手续」</b>两个动作都完成的当天。为什么要两个？只发货没办托收，说明还没向银行主张收款；只办手续没发货，货还在库里。两者齐了，交易才算真正启动。","trap":"B「签收」、D「付款」都是买方那边的时点，税法一律不认；C「签合同」更早。这类题的通用原则：<b>纳税义务时点由结算方式法定确定，不看实际收钱、签收或开票</b>——否则企业拖着不收钱就能无限递延。对照预收货款（发货当天）、分期收款（合同约定收款日）。","raw":"纳税人采取托收承付和委托银行收款方式销售应税消费品的，其纳税义务发生时间为发出应税消费品并办妥托收手续的当天。"},{"no":17,"type":"single","block":"3-10","stem":"（母题）某卷烟生产企业的「和平」牌卷烟出厂价格为每标准条 58 元（不含增值税），税务机关采集该牌卷烟批发环节价格为每标准条 89 元，国家税务总局核定的同类卷烟的批发环节毛利率为 31%。该卷烟生产企业当期出厂销售「和平」牌卷烟 90 标准箱（每标准箱 250 标准条），当期应纳的消费税为（　）元。（甲类卷烟 56% 加 150 元/标准箱；乙类卷烟 36% 加 150 元/标准箱）","opts":{"A":"787140","B":"510921","C":"734400","D":"787266"},"ans":"B","exam":"卷烟最低计税价格：批发价倒推 → 与实际价孰高 → 还要重新判甲乙类。","think":"① <b>核定计税价格</b> = 批发环节售价 × (1 - 批发毛利率) = 89 × (1-31%) = <b>61.41 元/条</b>。<br>② <b>孰高</b>：61.41 > 实际出厂价 58，取 61.41 作为计税价格。<br>③ <b>判甲乙类</b>：61.41 < 70 元/条 → <b>乙类 36%</b>（这一步最容易漏）。<br>④ 从价 = 61.41 × 90 箱 × 250 条 × 36% = 497421 元；从量 = 90 × 150 = 13500 元；合计 = <b>510921 元</b>。","trap":"· 别直接拿 58 元算，也别拿 89 元算——用<b>核定价格与实价孰高</b>。<br>· 核定价既决定计税依据，<b>也决定税率档次</b>：61.41 落在乙类，用 36% 不是 56%。选 A 787140 就是用甲类算出来的。<br>· 单位换算：1 标准箱 = 250 标准条，定额税生产环节 150 元/箱（批发环节才是 250 元/箱）。","raw":"「和平」牌卷烟核定计税价格=批发环节销售价格×(1-适用批发毛利率)=89×(1-31%)=61.41（元/标准条），属乙类卷烟，高于生产企业实际销售价格58元/标准条，应按核定计税价格确定计税销售额。应纳消费税=90×150+61.41×90×250×36%=510921（元）。"},{"no":18,"type":"single","block":"3-11","stem":"某化妆品厂为增值税一般纳税人，2025 年 12 月生产高档香水精 5 吨：对外销售 1 吨，取得含增值税销售额 1500 万元；将 1 吨用于继续生产高档香水；将 1 吨用于继续生产普通护肤品；将 1 吨馈赠给客户；另外 1 吨留存待售。已知高档香水精生产成本为 1100 万元/吨，成本利润率为 5%。该厂当月应缴纳消费税（　）万元。（高档化妆品税率为 15%）","opts":{"A":"597.35","B":"675","C":"796.46","D":"995.58"},"ans":"A","exam":"自产自用五吨货逐吨判断，再加一条「同类售价优先」。","think":"逐吨过「连续生产应税品 → 不缴；其他用途 → 移送就缴」：<br>· 对外销售 1 吨 → 缴<br>· 继续生产高档香水（<b>也是应税消费品</b>）1 吨 → <b>不缴</b><br>· 继续生产普通护肤品（非应税品）1 吨 → 缴<br>· 馈赠客户 1 吨 → 缴<br>· 留库待售 1 吨 → 还没移送，<b>不缴</b><br>共 3 吨计税。有同类售价 1500 万元/吨（含增值税），优先用同类价：1500 ÷ 1.13 × 3 × 15% = <b>597.35 万</b>。","trap":"· 「生产成本 1100 万/吨、成本利润率 5%」是干扰项——<b>有同类售价就不组价</b>。<br>· 「留存待售」不等于自产自用，没移送就不发生纳税义务。<br>· 含税销售额先 ÷1.13 再乘消费税率，别直接 1500×3×15%（会得 675，选项 B）。","raw":"纳税人自产自用的应税消费品，只要没有用于连续生产15类应税消费品而用于其他方面，均应视同销售，于移送使用时缴纳消费税。用于对外销售、继续生产普通护肤品和馈赠客户的高档香水精须计缴消费税，继续生产高档香水和尚未销售的无须计税。有同类消费品销售价格的，应优先采用同类价。应纳消费税=1500÷(1+13%)×(1+1+1)×15%=597.35（万元）。"},{"no":19,"type":"single","block":"3-14","stem":"某化妆品生产企业 2025 年 12 月从法国进口高档香水精，关税计税价格 30 万元，海关已代征增值税、消费税。2026 年 1 月生产领用上述进口高档香水精的 90% 用于连续生产本企业品牌的高档化妆品，本月在国内销售高档化妆品取得不含税销售额 400 万元。该企业 2026 年 1 月应缴纳消费税（　）万元。（高档化妆品关税税率 20%，消费税税率 15%）","opts":{"A":"55.95","B":"54.28","C":"60.00","D":"53.65"},"ans":"B","exam":"进口已税消费品连续生产：按生产领用数量扣除，扣除额要用进口组价还原。","think":"① 进口环节已纳消费税 = 30×(1+20%) ÷ (1-15%) × 15% = 42.35×15% = <b>6.35 万</b>（进口组价要先加关税、再还原价内税）。<br>② 按<b>当期生产领用 90%</b> 扣除：6.35 × 90% ≈ <b>5.72 万</b>。<br>③ 本月销售应纳税额 = 400×15% = 60 万；应缴 = 60 - 5.72 = <b>54.28 万</b>。","trap":"· 别拿 30 万直接 ×15% 算已纳税额（会得 4.05，选 A 55.95 就是这么来的）——进口环节缴的是按<b>组价</b>算的税。<br>· 扣的是<b>领用 90%</b> 不是全部进口量，剩下 10% 还在库存里不能提前抵。<br>· 选项 C 60.00 是压根没扣。","raw":"进口高档化妆品用于连续生产高档化妆品，可以按照当期生产领用数量抵扣进口环节已纳消费税。当期准予扣除的进口应税消费品已纳税款=30×(1+20%)÷(1-15%)×90%×15%=5.72（万元）。应纳消费税=400×15%-5.72=54.28（万元）。"},{"no":20,"type":"single","block":"3-16","stem":"（母题）甲电子烟生产企业持有电子烟商标「云雾」，2025 年 12 月生产销售「云雾牌」电子烟给乙电子烟批发企业，不含增值税销售额 90 万元。甲企业不持有商标「云彩」，仅从事代加工业务，当月生产销售「云彩牌」电子烟给持有该商标的丙企业，取得不含增值税销售额 35 万元。甲企业<b>分开核算</b>两类销售额。甲企业当月应申报缴纳电子烟消费税为（　）万元。（生产环节税率 36%）","opts":{"A":"13.75","B":"28.67","C":"32.4","D":"45"},"ans":"C","exam":"电子烟「持有商标者纳税」+ 分开核算的待遇。","think":"生产环节纳税人是<b>取得烟草专卖生产企业许可证并持有电子烟商标</b>的企业。甲持有「云雾」商标 → 这 90 万要缴；甲对「云彩」只做代加工、不持商标 → <b>甲不是这部分货的纳税人</b>，由持商标的丙企业申报。既然题目说<b>分开核算</b>，两部分就不会被合并征税：90 × 36% = <b>32.4 万</b>。","trap":"为什么代加工方不算纳税人？品牌方才是定价、获利的主体，向只收加工费的代工厂征税既不好算也容易被转移。但代价是<b>必须分开核算</b>——下一题改成「未分开核算」，答案立刻变成 45 万。母子题的 12.6 万差额，就是这四个字。","raw":"取得烟草专卖生产企业许可证、持有商标的企业为电子烟生产环节的纳税人；通过代加工方式生产电子烟的，由持有商标的企业申报缴纳消费税；只从事代加工电子烟产品业务的企业不属于电子烟消费税纳税人。电子烟生产环节纳税人从事代加工业务的，应当分开核算持有商标电子烟的销售额和代加工电子烟的销售额；未分开核算的，一并缴纳消费税。本题已明确分开核算，甲仅就「云雾牌」缴纳：90×36%=32.4（万元）。"},{"no":21,"type":"single","block":"3-16","stem":"（子题）将上题条件「甲电子烟生产企业分开核算两类销售额」修改为「甲电子烟生产企业<b>未分开核算</b>两类销售额」，其他条件不变。甲企业当月应申报缴纳电子烟消费税为（　）万元。（生产环节税率 36%）","opts":{"A":"13.75","B":"28.67","C":"32.4","D":"45"},"ans":"D","exam":"分开核算是义务，不是选择；没分开就一并计税。","think":"未分开核算 → 代加工那 35 万<b>一并</b>计入甲的计税销售额：(90 + 35) × 36% = <b>45 万</b>。注意这不是「惩罚性税率」，只是把两笔销售额合起来按法定 36% 计税。","trap":"和上题对照记：<b>分开 → 32.4 万；不分开 → 45 万</b>。做题第一步永远先找「分开核算 / 未分开核算」这个短语。另外电子烟是<b>从价定率</b>，不是复合计征，别去加定额税。","raw":"本题已明确「未分开核算」，所以甲电子烟生产企业针对「云雾牌」和「云彩牌」电子烟均缴纳消费税。应纳消费税=(90+35)×36%=45（万元）。"},{"no":22,"type":"single","block":"3-19","stem":"某卷烟厂为增值税一般纳税人，2025 年 12 月以分期收款方式销售甲类卷烟 260 标准箱，不含增值税销售额合计 780 万元，合同约定当月应收取 50% 货款，但因客户资金紧张本月实际收到 30% 货款；另采取预收货款方式销售乙类卷烟 100 标准箱，不含增值税销售额合计 125 万元，当月尚未发出应税消费品。该卷烟厂当月应缴纳消费税（　）万元。（甲类 56% 加 150 元/标准箱；乙类 36% 加 150 元/标准箱）","opts":{"A":"440.7","B":"132.21","C":"220.35","D":"266.85"},"ans":"C","exam":"分期收款按合同约定日、预收货款按发货日，两条时点规则放一题里考。","think":"① 分期收款按<b>合同约定的收款日期</b>确认，与实际收 30% 无关，本月按 <b>50%</b> 计税：从价 780×56% = 436.8 万，从量 260×150÷10000 = 3.9 万，合计 440.7 万，再 ×50% = <b>220.35 万</b>。<br>② 预收货款方式纳税义务发生时间是<b>发出应税消费品当天</b>，本月尚未发货 → 不缴。","trap":"· 「实际收到 30%」是纯干扰，税法认<b>合同约定</b>。<br>· 从量定额税也要按 50% 折算（整笔业务乘 50%），不是只把从价部分打折——选项 B 132.21 就是这么算错的。<br>· 预收款那 125 万和 100 箱全部不计入本月，别看着数字就往里加。","raw":"采取赊销或分期收款结算方式的，纳税义务发生时间为书面合同约定的收款日期的当天；该卷烟厂就该项业务当月应缴纳的消费税=(260×150÷10000+780×56%)×50%=220.35（万元）。采取预收货款结算方式的，纳税义务发生时间为发出应税消费品的当天；本月尚未发出应税消费品，所以不涉及缴纳消费税。"},{"no":23,"type":"single","block":"3-11","stem":"某化妆品厂以外购已税高档化妆品和已税珍珠为原料生产新型高档化妆品，将其中一部分用于经销样品和赠送客户。该业务消费税处理的下列表述中，符合税法规定的是（　）。（2025 年）","opts":{"A":"作为经销样品的新型高档化妆品无须缴纳消费税","B":"外购高档化妆品的已纳消费税税款不得扣除","C":"用于赠送客户的新型高档化妆品应计缴消费税","D":"外购珍珠的已纳消费税税款可以扣除"},"ans":"C","exam":"自产自用（样品/赠送）+ 已纳税额扣除（同一税目），两个考点塞在一题里。","think":"A 错：作为经销<b>样品</b>属于「用于广告、样品」，移送时视同销售，要缴。B 错：外购<b>已税高档化妆品</b>生产高档化妆品，是同一税目连续生产，<b>可以</b>按生产领用数量扣除。C 对：赠送客户属于「馈赠」，移送当天缴消费税。D 错：珍珠属于「贵重首饰及珠宝玉石」税目，用它生产高档化妆品是<b>跨税目</b>，不得扣除已纳税款。","trap":"「样品 / 馈赠 / 职工福利 / 奖励」这四个词一出现，消费税一定缴；「跨税目」三个字一出现，已纳税额一定不能扣。把 3-11 和 3-14 两张表叠起来看，这题四个选项正好各考一条。","raw":"选项A：作为经销样品的新型高档化妆品应计缴消费税。选项B：外购高档化妆品的已纳消费税税款可以扣除。选项D：外购已税珠宝、玉石为原料连续生产贵重首饰及珠宝、玉石，符合条件可以扣除已纳税款，不能跨税目抵扣。"},{"no":24,"type":"single","block":"3-16","stem":"甲卷烟批发企业为增值税一般纳税人，主要从事卷烟的批发和零售业务，2025 年 12 月向乙卷烟<b>零售单位</b>销售「黄河牌
