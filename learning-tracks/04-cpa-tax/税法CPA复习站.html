document.getElementById('searchInput')?.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  const kw = e.target.value.trim();
  if (!kw) return;
  const hits = [];
  Object.values(CH).forEach(ch => {
    ch.notes.blocks.forEach(b => {
      const hay = [b.name, b.scene, b.why, b.sentence, b.trap, (b.tips || []).join(' ')].join(' ');
      if (hay.includes(kw)) hits.push({ ch, b });
    });
  });
  if (!hits.length) { alert('没搜到「' + kw + '」，换个词试试'); return; }
  if (hits.length === 1) { go(`#/${hits[0].ch.id}/b/${hits[0].b.id}`); return; }
  document.getElementById('view').innerHTML = `<div class="crumb"><b>搜索</b> · 「${esc(kw)}」</div>
    <h1 class="title">${hits.length} 个知识点提到它</h1>
    <div class="mapgrid" style="margin-top:16px">${hits.map(h => `<button class="mapitem" data-go="#/${h.ch.id}/b/${h.b.id}">
      <span class="st">${esc(h.b.star)}</span><span>${esc(h.b.name)}<br><span class="sub" style="font-size:11.5px">${esc(h.ch.name)}</span></span></button>`).join('')}</div>`;
  bindNav();
});

/* boot */
document.documentElement.dataset.theme = S.theme;
migrateWrongLog();
buildNav();
route();
</script>
<script id="sb-boost">
/* 学习站通用增强 v2 · 2026-11-10
   纯附加模块：不改原站逻辑，只读 localStorage，额外提供进度总览、章节完成度、
   保存时间反馈与进度备份。注入时把 {"name":"税法 CPA 复习站","keys":["tax_cpa_v1"],"rec":{"key":"tax_cpa_v1","path":"answers"},"total":368,"chapterTotals":{"第1章 税法总论":32,"第2章 增值税法":97,"第3章 消费税法":55,"第4章 企业所得税法":102,"第5章 个人所得税法":82},"chapterOrder":["第1章 税法总论","第2章 增值税法","第3章 消费税法","第4章 企业所得税法","第5章 个人所得税法"],"chapterMap":{"1":"第1章 税法总论","2":"第2章 增值税法","3":"第3章 消费税法","4":"第4章 企业所得税法","5":"第5章 个人所得税法"},"chapter":function(id){var m=String(id).match(/^ch(\d+)/);return m?(CFG.chapterMap[m[1]]||'第'+m[1]+'章'):'其他';},"showRate":false,"flush":function(){try{save();}catch(e){}},"tsKey":"sb_ts_tax"} 替换成站点配置对象字面量。 */
(function () {
  if (window.__STUDY_BOOST__) return;
  window.__STUDY_BOOST__ = 1;
  var CFG = {"name":"税法 CPA 复习站","keys":["tax_cpa_v1"],"rec":{"key":"tax_cpa_v1","path":"answers"},"total":368,"chapterTotals":{"第1章 税法总论":32,"第2章 增值税法":97,"第3章 消费税法":55,"第4章 企业所得税法":102,"第5章 个人所得税法":82},"chapterOrder":["第1章 税法总论","第2章 增值税法","第3章 消费税法","第4章 企业所得税法","第5章 个人所得税法"],"chapterMap":{"1":"第1章 税法总论","2":"第2章 增值税法","3":"第3章 消费税法","4":"第4章 企业所得税法","5":"第5章 个人所得税法"},"chapter":function(id){var m=String(id).match(/^ch(\d+)/);return m?(CFG.chapterMap[m[1]]||'第'+m[1]+'章'):'其他';},"showRate":false,"flush":function(){try{save();}catch(e){}},"tsKey":"sb_ts_tax"};
  var UNIT = CFG.unit || '题';
  var DONE_LABEL = CFG.doneLabel || '已做';
  var SHOW_RATE = CFG.showRate !== false;
  var TS_KEY = CFG.tsKey || '__sb_saved_at__';
  var BOTTOM = CFG.bottom == null ? 18 : CFG.bottom;
  var RIGHT = CFG.right == null ? 18 : CFG.right;

  var esc = function (s) {
    return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  };
  var pad = function (n) { return n < 10 ? '0' + n : '' + n; };
  var hms = function (t) { var d = new Date(t); return pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds()); };

  /* 记录每次 localStorage 写入的时间，用来给出「最近保存」的可见反馈 */
  try {
    if (window.Storage && window.Storage.prototype && !window.__SB_TS_PATCHED__) {
      window.__SB_TS_PATCHED__ = 1;
      var _origSet = Storage.prototype.setItem;
      Storage.prototype.setItem = function (k, v) {
        var r = _origSet.apply(this, arguments);
        try { if (k !== TS_KEY && k !== '__sb_saved_at__') _origSet.call(this, TS_KEY, String(Date.now())); } catch (e) {}
        return r;
      };
    }
  } catch (e) {}

  /* ---------- 读取本站进度 ---------- */
  function readAll() {
    var out = {};
    CFG.keys.forEach(function (k) {
      try {
        var raw = localStorage.getItem(k);
        if (raw == null) return;
        try { out[k] = JSON.parse(raw); } catch (e) { out[k] = raw; }
      } catch (e) {}
    });
    return out;
  }
  function recordOf(all) {
    var v = all[CFG.rec.key];
    if (!v || typeof v !== 'object' || Array.isArray(v)) return {};
    if (!CFG.rec.path) return v;
    var p = v[CFG.rec.path];
    return (p && typeof p === 'object' && !Array.isArray(p)) ? p : {};
  }
  function chapterOf(id) {
    if (typeof CFG.chapter === 'function') {
      try { return CFG.chapter(id) || '其他'; } catch (e) { return '其他'; }
    }
    var s = String(id);
    var m = s.match(/^(?:ch|chapter|m)(\d+)/i);
    if (m) return '第' + (+m[1]) + '章';
    m = s.match(/^(\d+)[-|_.\/]/);
    if (m) return '第' + (+m[1]) + '章';
    var parts = s.split(/[-|_.\/]/);
    return parts.length > 1 ? (parts[0] || '其他') : '全部题目';
  }
  function isCorrect(v) {
    if (typeof CFG.correct === 'function') { try { return !!CFG.correct(v); } catch (e) { return false; } }
    return v === 1 || v === true || !!(v && (v.ok === true || v.correct === true));
  }
  function detectTotal() {
    if (CFG.total) return CFG.total;
    try {
      var t = (document.body.innerText || '').slice(0, 4000);
      var m = t.match(/共\s*(\d{2,4})\s*题/) || t.match(/(\d{2,4})\s*道题/) ||
              t.match(/已做\s*\d+\s*\/\s*(\d{2,4})/) || t.match(/\/\s*(\d{2,4})\s*题/);
      if (m) return +m[1];
      if (window.DATA && window.DATA.questions && window.DATA.questions.length) return window.DATA.questions.length;
    } catch (e) {}
    return 0;
  }
  function chapStat(cur) {
    var totals = CFG.chapterTotals || {};
    var order = CFG.chapterOrder || Object.keys(totals);
    var used = {}, list = [];
    order.forEach(function (name) {
      used[name] = 1;
      list.push({ label: name, done: cur[name] || 0, total: totals[name] || 0 });
    });
    Object.keys(cur).forEach(function (name) {
      if (!used[name]) list.push({ label: name, done: cur[name], total: 0 });
    });
    return list;
  }

  var lastSig = '', lastChange = 0;
  function snapshot() {
    var all = readAll();
    var rec = recordOf(all);
    var ids = Object.keys(rec);
    // 题库删过题时，历史记录里已下架的题号不计入进度，避免「已做 > 总数」
    if (CFG.validIds) ids = ids.filter(function (id) { return !!CFG.validIds[id]; });
    var done = ids.length, correct = 0;
    if (SHOW_RATE) ids.forEach(function (id) { if (isCorrect(rec[id])) correct++; });
    var chapters = {};
    ids.forEach(function (id) { var c = chapterOf(id); chapters[c] = (chapters[c] || 0) + 1; });
    var chap = chapStat(chapters);
    var finished = chap.filter(function (x) { return x.total > 0 && x.done >= x.total; }).length;
    var measurable = chap.filter(function (x) { return x.total > 0; }).length;
    var ts = 0;
    try { ts = +(localStorage.getItem(TS_KEY) || 0); } catch (e) {}
    var sig = JSON.stringify(all);
    if (sig !== lastSig) { lastSig = sig; lastChange = Date.now(); }
    return {
      done: done, correct: correct, total: detectTotal(), chap: chap,
      finished: finished, measurable: measurable,
      savedAt: Math.max(ts, lastChange), keys: CFG.keys.length
    };
  }

  /* ---------- 导出 / 导入备份 ---------- */
  function exportAll() {
    var payload = { app: CFG.name, v: 2, exportedAt: new Date().toISOString(), data: readAll() };
    var blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = CFG.name.replace(/[\\\/:*?"<>|]/g, '_') + '_进度备份_' + new Date().toISOString().slice(0, 10) + '.json';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 1500);
    toast('进度已导出，换设备可导入合并');
  }
  function importAll(file) {
    var r = new FileReader();
    r.onload = function () {
      try {
        var j = JSON.parse(r.result);
        var d = j && j.data ? j.data : j;
        if (!d || typeof d !== 'object') throw new Error('不是进度备份文件');
        var n = 0;
        CFG.keys.forEach(function (k) {
          if (!(k in d)) return;
          var nw = d[k], old = null;
          try { old = JSON.parse(localStorage.getItem(k) || 'null'); } catch (e) {}
          var out = nw;
          if (old && nw && !Array.isArray(old) && !Array.isArray(nw) && typeof old === 'object' && typeof nw === 'object') {
            out = Object.assign({}, old);
            Object.keys(nw).forEach(function (f) {
              var a = out[f], b = nw[f];
              if (a && b && !Array.isArray(a) && !Array.isArray(b) && typeof a === 'object' && typeof b === 'object') out[f] = Object.assign({}, a, b);
              else out[f] = b;
            });
          } else if (Array.isArray(old) && Array.isArray(nw)) {
            out = Array.from(new Set(old.concat(nw)));
          }
          localStorage.setItem(k, typeof out === 'string' ? out : JSON.stringify(out));
          n++;
        });
        if (!n) throw new Error('备份里没有本站的进度');
        toast('已合并 ' + n + ' 项，正在刷新…');
        setTimeout(function () { location.reload(); }, 700);
      } catch (e) { toast('导入失败：' + e.message); }
    };
    r.readAsText(file);
  }

  var toastTimer = null;
  function toast(msg) {
    var t = document.getElementById('sb-toast');
    if (!t) {
      t = document.createElement('div'); t.id = 'sb-toast';
      t.style.cssText = 'position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1f3a5f;color:#fff;padding:9px 16px;border-radius:99px;font-size:13px;z-index:999999;box-shadow:0 8px 24px rgba(0,0,0,.22);transition:opacity .25s';
      document.body.appendChild(t);
    }
    t.textContent = msg; t.style.opacity = '1';
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.style.opacity = '0'; }, 2600);
  }

  /* ---------- 悬浮入口与面板 ---------- */
  var C_INK = '#1f3a5f', C_GREEN = '#2e7d55', C_MUTE = '#6f7887', C_LINE = '#e9e4da', C_BG = '#fffdf9';
  function build() {
    var btn = document.createElement('button');
    btn.id = 'sb-btn'; btn.title = '学习进度与备份'; btn.textContent = '进度';
    btn.style.cssText = 'position:fixed;right:' + RIGHT + 'px;bottom:' + BOTTOM + 'px;z-index:999998;' +
      'width:52px;height:52px;border-radius:50%;border:0;background:' + C_INK + ';color:#fff;' +
      'font:600 13px/1 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;' +
      'cursor:pointer;box-shadow:0 6px 20px rgba(31,58,95,.35)';
    document.body.appendChild(btn);

    var panel = document.createElement('div');
    panel.id = 'sb-panel';
    panel.style.cssText = 'display:none;position:fixed;right:' + RIGHT + 'px;bottom:' + (BOTTOM + 62) + 'px;' +
      'z-index:999998;width:340px;max-width:calc(100vw - 36px);max-height:72vh;overflow:auto;' +
      'background:' + C_BG + ';color:#1b232e;border:1px solid ' + C_LINE + ';border-radius:14px;' +
      'padding:16px 16px 14px;box-shadow:0 16px 48px rgba(27,35,46,.22);' +
      'font:13px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif';
    document.body.appendChild(panel);

    var file = document.createElement('input');
    file.type = 'file'; file.accept = '.json,application/json'; file.id = 'sb-file'; file.style.display = 'none';
    document.body.appendChild(file);

    btn.addEventListener('click', function () {
      var open = panel.style.display !== 'none';
      panel.style.display = open ? 'none' : 'block';
      if (!open) render();
    });
    file.addEventListener('change', function () {
      if (file.files && file.files[0]) { importAll(file.files[0]); file.value = ''; }
    });
    panel.addEventListener('click', function (e) {
      var b = e.target.closest && e.target.closest('[data-sb]');
      if (!b) return;
      if (b.dataset.sb === 'export') exportAll();
      if (b.dataset.sb === 'import') file.click();
      if (b.dataset.sb === 'refresh') render();
    });
  }

  function render() {
    var p = document.getElementById('sb-panel');
    if (!p) return;
    var s = snapshot();
    var pct = s.total ? Math.round(s.done / s.total * 1000) / 10 : 0;
    var bar = s.total ? Math.min(100, s.done / s.total * 100).toFixed(2) : 0;
    var rate = s.done ? Math.round(s.correct / s.done * 100) : 0;

    var chHtml = s.chap.length ? s.chap.map(function (x) {
      var w = x.total ? Math.min(100, x.done / x.total * 100).toFixed(1) : 0;
      var ok = x.total > 0 && x.done >= x.total;
      var right = x.total ? (ok ? '<span style="color:' + C_GREEN + '">✓ 已完成</span>'
        : '还差 ' + Math.max(0, x.total - x.done) + ' ' + UNIT) : '—';
      return '<div style="padding:6px 0;border-bottom:1px solid #f0ece3">' +
        '<div style="display:flex;justify-content:space-between;gap:8px">' +
          '<span>' + esc(x.label) + '</span>' +
          '<b style="color:' + C_INK + ';white-space:nowrap">' + x.done + (x.total ? ' / ' + x.total : '') + ' ' + UNIT + '</b></div>' +
        (x.total ? '<div style="height:5px;border-radius:99px;background:#efeae0;margin:5px 0 3px;overflow:hidden">' +
          '<i style="display:block;height:100%;width:' + w + '%;background:' + (ok ? C_GREEN : C_INK) + '"></i></div>' : '') +
        '<div style="color:' + C_MUTE + ';font-size:11.5px">' + right + '</div></div>';
    }).join('') : '<div style="color:' + C_MUTE + '">还没有做题记录，先去做几道吧</div>';

    p.innerHTML =
      '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:2px">' +
        '<b style="font-size:15px">我的进度</b>' +
        '<button data-sb="refresh" style="border:0;background:none;color:' + C_INK + ';font-size:12px;cursor:pointer">刷新</button></div>' +
      '<div style="color:' + C_MUTE + ';font-size:12px">' + esc(CFG.name) + ' · 本机自动保存</div>' +
      '<div style="display:flex;gap:16px;flex-wrap:wrap;margin:14px 0 10px">' +
        '<div><b style="font-size:22px;color:' + C_INK + '">' + s.done + '</b><span style="color:' + C_MUTE + '"> ' + DONE_LABEL + '</span></div>' +
        '<div><b style="font-size:22px;color:' + C_INK + '">' + (s.total ? s.total : '—') + '</b><span style="color:' + C_MUTE + '"> 总' + UNIT + '</span></div>' +
        '<div><b style="font-size:22px;color:' + C_GREEN + '">' + (s.total ? Math.max(0, s.total - s.done) : '—') + '</b><span style="color:' + C_MUTE + '"> 剩余</span></div>' +
        (SHOW_RATE ? '<div><b style="font-size:22px;color:' + C_INK + '">' + (s.done ? rate + '%' : '—') + '</b><span style="color:' + C_MUTE + '"> 正确率</span></div>' : '') +
      '</div>' +
      '<div style="height:9px;border-radius:99px;background:#efeae0;overflow:hidden">' +
        '<i style="display:block;height:100%;width:' + bar + '%;background:linear-gradient(90deg,' + C_INK + ',' + C_GREEN + ');border-radius:99px"></i></div>' +
      '<div style="color:' + C_MUTE + ';font-size:12px;margin-top:6px">' +
        (s.total ? '总进度 <b>' + pct + '%</b>' : '总数未识别，已做数为精确值') +
        ' · ' + (s.savedAt ? '最近保存 ' + hms(s.savedAt) : '本机已存 ' + s.keys + ' 项记录') + '</div>' +
      '<div style="display:flex;justify-content:space-between;align-items:center;margin:15px 0 4px">' +
        '<b>章节完成度</b><span style="color:' + C_GREEN + ';font-size:12px">已完成 ' + s.finished + ' / ' + s.measurable + ' 章</span></div>' +
      chHtml +
      '<div style="display:flex;gap:8px;margin-top:14px;flex-wrap:wrap">' +
        '<button data-sb="export" style="flex:1;min-width:110px;padding:7px 10px;border:1px solid ' + C_LINE + ';border-radius:8px;background:#faf8f3;color:#1b232e;font-size:12.5px;cursor:pointer">导出进度备份</button>' +
        '<button data-sb="import" style="flex:1;min-width:110px;padding:7px 10px;border:1px solid ' + C_LINE + ';border-radius:8px;background:#faf8f3;color:#1b232e;font-size:12.5px;cursor:pointer">导入进度</button>' +
      '</div>' +
      '<div style="color:' + C_MUTE + ';font-size:11.5px;margin-top:10px;line-height:1.5">' +
        '原站每次答题都会立即写入本机；本面板实时读取并给出章节完成度。换设备或清缓存前请先导出，导入时与本机记录合并，不会覆盖。</div>';
  }

  /* ---------- 启动与切后台落盘 ---------- */
  function flush() {
    if (typeof CFG.flush === 'function') { try { CFG.flush(); } catch (e) {} }
  }
  function boot() {
    build();
    snapshot();
    setInterval(function () {
      var before = lastSig;
      snapshot();
      var p = document.getElementById('sb-panel');
      if (before !== lastSig && p && p.style.display !== 'none') render();
    }, 1500);
    window.addEventListener('pagehide', flush);
    window.addEventListener('beforeunload', flush);
    document.addEventListener('visibilitychange', function () {
      if (document.visibilityState === 'hidden') flush();
    });
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();

</script>
