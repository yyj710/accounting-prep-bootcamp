29000 + (2000-500)÷1.13] ÷ 10 = <b>3032.74 元/吨</b> → 甲类<br>· 果啤：[13800 + 750÷1.13] ÷ 5 = <b>2892.74 元/吨</b> → 乙类<br>应纳 = 10×250 + 5×220 = <b>3600 元</b>。","trap":"· 塑料周转箱押金 500 元必须剔除，全算进去会把果啤或鲜啤的档位算偏。<br>· 押金是含税价，要 ÷1.13。<br>· 啤酒从量计征，价格只用来<b>分档</b>，不进税额公式——别拿销售额去乘税率。选项 A 2500 就是只算了鲜啤酒 10 吨。","raw":"啤酒每吨出厂价格（不含税）≥3000元的为甲类，<3000元的为乙类。出厂价格包含一般包装物及包装物押金（押金视为含税收入），不包含重复使用的塑料周转箱押金。鲜啤酒每吨出厂价=[29000+(2000-500)÷(1+13%)]÷10=3032.74（元），为甲类；果啤每吨出厂价=[13800+750÷(1+13%)]÷5=2892.74（元），为乙类。应纳消费税=10×250+5×220=3600（元）。"},{"no":27,"type":"single","block":"3-7","stem":"某筷子生产企业为增值税一般纳税人，2025 年 11 月，生产销售木制一次性筷子取得不含税销售额 50 万元，其中含包装物销售额 0.8 万元，另单独收取包装物押金 1.2 万元；销售竹制雕花工艺筷子取得不含税销售额 30 万元，没收逾期未退的竹制雕花工艺筷子包装物押金 2.5 万元。该企业 11 月应缴纳消费税（　）万元。（木制一次性筷子税率 5%）","opts":{"A":"2.5","B":"2.55","C":"4.16","D":"4"},"ans":"A","exam":"包装物三种情形 + 竹制筷子根本不是应税消费品。","think":"① 木制一次性筷子是应税消费品，销售额 <b>50 万</b>里已经含了包装物 0.8 万（连同货物销售的包装物无论是否单独计价都并入销售额），所以不用再加一次。<br>② 单独收的包装物押金 1.2 万：木筷属于「一般应税消费品」，<b>收取时不缴消费税</b>，逾期才缴，本月不计。<br>③ 竹制雕花工艺筷子<b>不属于征税范围</b>，30 万销售额和 2.5 万押金全部无关。<br>应纳 = 50 × 5% = <b>2.5 万</b>。","trap":"· 只有「木制一次性筷子」征，竹制、木制<b>非一次性</b>筷子都不征。<br>· 只有<b>除啤酒黄酒外的其他酒类</b>押金才「收取即征」，一般消费品的押金收取时不缴、逾期才缴。<br>· 别把 0.8 万重复加，也别把 30 万竹筷销售额算进来（会得 4 万，选项 D）。","raw":"木制一次性筷子属于消费税征税范围，竹制雕花工艺筷子不属于应税消费品。应税消费品连同包装物销售的，无论包装物是否单独计价，均应并入销售额征收消费税。非酒类产品的包装物押金在收取时不缴纳消费税。应纳消费税=50×5%=2.5（万元）。"},{"no":28,"type":"single","block":"3-12","stem":"甲企业为增值税一般纳税人，2026 年 2 月从农业生产者手中收购一批烟叶，开具农产品收购发票，注明收购价款 100 万元，并按规定支付了价外补贴 8 万元。随即将该批烟叶运往乙企业委托其加工烟丝，取得增值税专用发票注明运费 1 万元、税额 0.09 万元，支付不含税委托加工费 3 万元。烟丝加工完成后运回甲企业所在地，支付丙企业不含税运费 2 万元，取得其开具的增值税专用发票。假定乙企业无同类产品对外销售价格。乙企业当月应代收代缴的消费税为（　）万元。（烟丝税率 30%）","opts":{"A":"52.41","B":"58.29","C":"57.26","D":"58.34"},"ans":"A","exam":"委托加工组价里「材料成本」的范围：烟叶税 + 去程运费，回程运费不算。","think":"① <b>烟叶税</b> = (收购价款 + 10% 价外补贴) × 20% = 100 × 1.1 × 20% = <b>22 万</b>（按法定 10% 算，不是实际付的 8 万）。<br>② 烟叶买价 = 100 + 8 + 22 = 130 万；农产品可计算抵扣进项，材料成本要剥掉 9%：130 × (1-9%) = <b>118.3 万</b>。<br>③ 加<b>去程运费 1 万</b>（把原料运往受托方，属材料成本）→ 119.3 万；加工费 3 万。<br>④ 组价 = (119.3 + 3) ÷ (1-30%) = 174.71 万；代收代缴 = 174.71 × 30% = <b>52.41 万</b>。<br>⑤ <b>回程运费 2 万不计入</b>——货已做完，那是下一笔流通费用。","trap":"· 烟叶税的价外补贴按<b>法定 10%</b> 计算，题干给的「实际支付 8 万」只用于算买价，两处别混。<br>· 材料成本要 ×(1-9%) 剥掉可抵扣的进项税额。<br>· 运费方向：<b>去程算、回程不算</b>；加工费里的增值税也不算。<br>· 乙企业无同类售价 → 才用组价；有同类售价就优先用同类价。","raw":"受托方无同类产品对外销售价格，应组价确定计税依据，组价=(材料成本+加工费)÷(1-消费税比例税率)。「材料成本」包括买价以及将原材料运往受托方过程中发生的运费；烟叶买价包括收购价款、实际支付的价外补贴以及烟叶税，不包括可以计算抵扣的增值税进项税额。烟叶税=100×(1+10%)×20%=22（万元）；材料成本=(100+8+22)×(1-9%)+1=119.3（万元）；组价=(119.3+3)÷(1-30%)=174.71（万元）；代收代缴消费税=174.71×30%=52.41（万元）。"},{"no":1,"type":"multi","block":"3-2","stem":"（非标准题）下列商品中，属于消费税征税范围的有（　）。","opts":{"A":"高尔夫车","B":"未经涂饰的素板","C":"气缸容量 150 毫升的摩托车","D":"雪地车","E":"橡胶填充油","F":"18K 金镶钻手链","G":"变压器油","H":"纯生物柴油"},"ans":"BEFH","exam":"八选四的非标准题，胜负手是「免税品也属于征税范围」。","think":"B 未经涂饰的<b>素板</b>属于实木地板税目（国家把半成品也圈进来防改名避税）→ 选。E <b>橡胶填充油</b>属于溶剂油税目 → 选。F 18K 金镶钻手链属于金银首饰（零售环节 5%）→ 选。H <b>纯生物柴油</b>属于成品油税目、只是<b>免征</b> → 仍属征税范围，选。<br>排除：A 高尔夫车、D 雪地车（和沙滩车、卡丁车一起明确不征）；C 150 毫升摩托车（气缸容量 <250 毫升根本不在征税范围）；G 变压器油（绝缘油类不属于润滑油，不征）。","trap":"这题最容易漏 H 或多选 C。<b>「属于征税范围」≠「应缴纳消费税」</b>：免税品进了门，只是国家抬手放行；不征品是压根没进门。轻二答案册专门给了【解题通法】：纯生物柴油、太阳能电池、燃料电池等都属于征税范围，但予以免税。做题时先看清题干问的是哪一个。","raw":"选项AD：沙滩车、雪地车、卡丁车、高尔夫车等均不属于消费税征税范围。选项C：气缸容量250毫升（不含）以下的摩托车不属于征税范围。选项G：变压器油、导热类油等绝缘油类产品不属于润滑油，不征收消费税。【解题通法】「属于征税范围」和「免税」并不冲突，纯生物柴油、太阳能电池、燃料电池等都属于消费税的征税范围，但是予以免税。"},{"no":2,"type":"multi","block":"3-4","stem":"纳税人生产销售下列产品，应缴纳消费税的有（　）。","opts":{"A":"娱乐业举办的啤酒屋（啤酒坊）利用啤酒生产设备生产的啤酒","B":"体育上用的发令纸","C":"出国人员免税商店销售的金银首饰","D":"烷基化油"},"ans":"ACD","exam":"三个「听起来像免税」的场景，实际都要缴。","think":"A 啤酒屋用啤酒生产设备<b>自制</b>啤酒属于生产行为，要缴消费税，且一律按甲类 250 元/吨（现酿现卖没有可靠出厂价，直接按最高档防避税）→ 选。B 体育发令纸和鞭炮药引线明确<b>不征</b> → 不选。C 免税商店免的是关税、进口增值税，<b>金银首饰的消费税照征</b>（零售环节 5%）→ 选。D 烷基化油（异辛烷）按<b>汽油</b>税目征 → 选。","trap":"「免税店」三个字是本题最大的坑。另外「啤酒屋」属于娱乐业，很多人以为只是餐饮服务不缴消费税——只要它<b>用啤酒生产设备自制</b>啤酒，就构成生产环节。","raw":"选项B：体育上用的发令纸、鞭炮药引线，不征收消费税。"},{"no":3,"type":"multi","block":"3-6","stem":"下列各项关于消费税税率的表述中，正确的有（　）。","opts":{"A":"消费税采用比例税率和定额税率两种形式","B":"纳税人兼营不同税率的应税消费品，未分别核算销售额、销售数量的，从高适用税率","C":"纳税人将不同税率应税消费品组成成套消费品销售的，分别核算则分别适用各自的税率","D":"白包卷烟采用复合计征方法征收消费税"},"ans":"ABD","exam":"税率形式的一般规定 + 「从高」两条规则的区别。","think":"A 对：比例税率、定额税率两种形式（复合计征是两者并用）。B 对：兼营不同税率<b>未分别核算</b> → 从高。C <b>错</b>：组成<b>成套消费品</b>销售的，<b>无论是否分别核算，一律从高</b>——因为企业可以把高税率商品标价压到 1 元来洗税基，单独核算防不住。D 对：白包卷烟（无牌号、无法按调拨价核价）照样按复合计征。","trap":"B 和 C 一定要分开记：<b>兼营</b>有「分别核算」这个出路，<b>成套销售</b>没有。这是多选题里最经典的一对对照。A 别因为「还有复合计征」就判错——复合是两种形式的组合，不是第三种独立形式。","raw":"选项C：纳税人将不同税率的应税消费品组成成套消费品销售的，从高适用税率。"},{"no":4,"type":"multi","block":"3-6","stem":"下列应税消费品中，从量计征消费税的有（　）。","opts":{"A":"电池","B":"涂料","C":"啤酒","D":"柴油"},"ans":"CD","exam":"从量只有三类：啤酒、黄酒、成品油。","think":"C 啤酒、D 柴油（成品油）→ 从量定额。A 电池、B 涂料 → <b>从价定率</b>（分别是 4%、4%）。记忆法：<b>从量三种（啤酒/黄酒/成品油）、复合两种（卷烟/白酒），其余全从价</b>，用排除法即可，不必记 15 类各自税率。","trap":"电池、涂料属于「环保调控类」，很容易让人误以为按「数量/体积」征。但它们是从价计征，只对无汞原电池、锂电、太阳能、燃料电池、全钒液流电池、低 VOC 涂料给免税。别把「环保」和「从量」绑在一起。","raw":"选项AB：从价计征消费税。【解题通法】记忆「从量」和「复合」计征消费税的税目，其余采用排除法：从量定额=啤酒、黄酒、成品油；复合计税=卷烟、白酒；从价定率=其余税目。"},{"no":5,"type":"multi","block":"3-4","stem":"下列各项中，免征消费税的有（　）。","opts":{"A":"燃料电池","B":"锂离子蓄电池","C":"全钒液流电池","D":"铅蓄电池"},"ans":"ABC","exam":"电池税目的环保免税清单，只有一个例外要缴。","think":"A 燃料电池、B 锂离子蓄电池、C 全钒液流电池，加上无汞原电池、金属氢化物镍蓄电池、锂原电池、太阳能电池，都在<b>免征</b>清单里 → 选。D <b>铅蓄电池按 4% 征</b>，是电池税目里唯一正常缴税的（铅污染重）→ 不选。","trap":"注意题干问「免征」，不是「不征」——这七类电池都<b>属于征税范围</b>，只是享受免税。如果题干问「属于征税范围」，D 也要选。这一组题和单选 1、多选 1 是同一个考点的三种问法。","raw":"选项ABC：对无汞原电池、金属氢化物镍蓄电池（氢镍/镍氢蓄电池）、锂原电池、锂离子蓄电池、太阳能电池、燃料电池和全钒液流电池免征消费税。选项D：自2016年1月1日起，铅蓄电池按4%税率征收消费税。"},{"no":6,"type":"multi","block":"3-7","stem":"消费税纳税人销售应税消费品一并收取的下列款项中，应计入消费税计税依据的有（　）。","opts":{"A":"符合条件的代垫运费","B":"白酒品牌使用费","C":"红酒包装物押金","D":"价外收取的返还利润"},"ans":"BCD","exam":"价外费用「实质重于形式」+ 两类合规排除 + 酒类押金特殊规则。","think":"B <b>白酒品牌使用费</b>是随白酒销售向购货方收的，明文规定属于销售价款组成部分，无论用什么名义收取都并入 → 选。C 红酒（葡萄酒）属于「<b>除啤酒、黄酒外的其他酒类</b>」，包装物押金<b>收取当期</b>就并入销售额征增值税和消费税 → 选。D 返还利润是典型价外费用 → 选。A 符合条件的代垫运费（运费发票开给购买方 + 纳税人把发票转交购买方，两条同时满足）属于<b>过手钱</b>，可排除 → 不选。","trap":"代垫运费的「符合条件」四个字要抠：必须<b>两个条件同时满足</b>，缺一个就要全额并入。另一类可排除的是合规政府性基金/行政事业性收费（三个条件）。记住原则：只要是因这笔销售而收的钱都算，名字叫什么不重要。","raw":"选项A：同时符合「承运部门的运输费用发票开具给购买方」「纳税人将该项发票转交给购买方」两个条件的代垫运输费用不包括在价外费用内。选项B：白酒生产企业向商业销售单位收取的「品牌使用费」属于应税白酒销售价款的组成部分，应并入销售额。选项C：对销售除啤酒、黄酒外的其他酒类产品而收取的包装物押金，无论是否返还以及会计上如何核算，均应并入当期销售额征收消费税。选项D：价外收取的返还利润属于价外费用。"},{"no":7,"type":"multi","block":"3-7","stem":"某白酒制造厂生产销售白酒同时收取的下列款项中，应计入消费税计税依据的有（　）。","opts":{"A":"包装物押金","B":"符合条件代为收取的政府性基金","C":"包装费","D":"集资费"},"ans":"ACD","exam":"和上一题同型，但把「代垫运费」换成了「政府性基金」。","think":"A 白酒属于「啤酒黄酒以外酒类」，押金<b>收取时并入</b> → 选。C 包装费、D 集资费都是价外费用 → 选。B <b>符合条件</b>代为收取的政府性基金/行政事业性收费可排除（需国务院或省级批准设立、开省级以上财政票据、全额上缴财政三条同时满足）→ 不选。","trap":"两题连着做，把两类可排除项配齐：<b>合规代垫运费</b>、<b>合规政府性基金</b>。除此之外，违约金、滞纳金、赔偿金、补贴、集资费、返还利润、包装费、储备费、运输装卸费、品牌使用费，一律并入。","raw":"选项B：符合条件代为收取的政府性基金或者行政事业性收费不应计入消费税计税依据。"},{"no":8,"type":"multi","block":"3-8","stem":"下列各项中，符合应税消费品销售数量规定的有（　）。","opts":{"A":"销售应税消费品的，为应税消费品的销售数量","B":"自产自用应税消费品的，为应税消费品的生产数量","C":"进口应税消费品的，为海关核定的应税消费品进口征税数量","D":"委托加工应税消费品的，为纳税人收回的应税消费品数量"},"ans":"ACD","exam":"从量计征的四种「数量」口径，两个选项在玩文字游戏。","think":"A 销售 → 销售数量；C 进口 → 海关核定的进口征税数量；D 委托加工 → <b>纳税人收回的数量</b>；都对。B 错在「<b>生产数量</b>」——自产自用应按<b>移送使用数量</b>，因为纳税义务发生在移送那一刻，生产出来还没用的部分没离开生产环节，不该提前计税。","trap":"两个高频错法：自产自用写「生产数量」、委托加工写「委托加工数量」。正确说法是「<b>移送使用数量</b>」和「<b>收回数量</b>」。这四个口径在啤酒、黄酒、成品油、卷烟白酒的从量部分都要用。","raw":"选项B：自产自用应税消费品的，为应税消费品的移送使用数量。"},{"no":9,"type":"multi","block":"3-10","stem":"纳税人用于下列情形的自产应税消费品，应以同类应税消费品的<b>最高销售价格</b>作为计税依据计征消费税的有（　）。","opts":{"A":"用于换取生产资料的应税消费品","B":"用于抵偿债务的应税消费品","C":"用于无偿赠送的应税消费品","D":"用于投资入股的应税消费品"},"ans":"ABD","exam":"「换、投、抵」三个字要背死，第四个选项是来混的。","think":"A 换取生产资料、B 抵偿债务、D 投资入股，加上「换取消费资料」，这四种情形按<b>同类最高销售价格</b>计税 → 选。C <b>无偿赠送</b>不在此列，它按同类消费品<b>加权平均售价</b>（无同类才组价）→ 不选。","trap":"为什么只有这四种？因为它们都<b>没有货币对价</b>，企业最容易把货作价偏低送出去，所以直接取上限。<b>对比记：增值税在同样场景用平均价</b>——增值税链条不断，用平均价就够；消费税只收一刀，必须用最高价守住税基。别把「无偿赠送」也算进「换投抵」。","raw":"纳税人用于换取生产资料、消费资料、投资入股、抵偿债务等方面的应税消费品，以纳税人同类应税消费品的最高销售价格作为计税依据计算消费税。"},{"no":10,"type":"multi","block":"3-15","stem":"下列关于金银首饰消费税计税依据的表述中，符合税法规定的有（　）。","opts":{"A":"在境内从事金银首饰零售业务的单位和个人为纳税人","B":"金银首饰连同包装物销售，包装物单独计价的，无须并入金银首饰的销售额计征消费税","C":"带料加工的金银首饰，按照组成计税价格计算纳税","D":"金银首饰与其他产品组成成套消费品销售的，应按销售额全额征收消费税"},"ans":"AD","exam":"金银铂钻零售环节的专属规则，两个选项错在「顺序」和「并入」。","think":"A 对：金银铂钻只在<b>零售环节</b>征，纳税人就是境内从事零售的单位和个人。D 对：成套销售<b>按销售额全额</b>征收，不拆分。B 错：连同包装物销售，<b>无论是否单独计价、无论会计怎么核算</b>，包装物都要并入销售额。C 错：带料加工有<b>顺序</b>——先按受托方销售同类金银首饰的售价，<b>没有同类售价才组价</b>，不是「一律按组价」。","trap":"C 的错法和单选 9（有同类价优先）是同一条通用规则：<b>同类售价优先，组价兜底</b>。本章至少考三次：自产自用、委托加工、金银带料加工。B 则是「实质重于形式」的又一次应用。","raw":"选项B：金银首饰连同包装物销售，无论包装物是否单独计价，也无论会计上如何核算，均应并入金银首饰的销售额计征消费税。选项C：带料加工的金银首饰，按受托方销售同类金银首饰的销售价格确定计税依据；没有同类金银首饰销售价格的，按照组成计税价格计算纳税。"},{"no":11,"type":"multi","block":"3-14","stem":"（非标准题）下列产品中，在计算缴纳消费税时准许扣除外购或委托加工应税消费品已纳消费税的有（　）。","opts":{"A":"委托加工收回的已税珠宝玉石为原料生产的金银镶嵌首饰","B":"委托加工收回的已税汽油为原料生产的应税成品油","C":"委托加工收回的已税高档化妆品为原料生产的高档化妆品","D":"委托加工收回的已税葡萄酒为原料生产的葡萄酒","E":"外购已税白酒为原料生产的应税白酒","F":"外购已税摩托车生产的应税摩托车","G":"外购已税溶剂油为原料生产的应税成品油","H":"外购已税杆头为原料生产的高尔夫球杆"},"ans":"BCH","exam":"八选三，考的是「同一税目 + 生产环节 + 委托加工葡萄酒例外」。","think":"B 已税汽油 → 应税成品油（同一税目连续生产）→ 可扣。C 已税高档化妆品 → 高档化妆品 → 可扣。H 外购已税杆头 → 高尔夫球杆（球具税目内的原料→成品）→ 可扣。<br>排除：A 金银镶嵌首饰在<b>零售环节</b>征税，一律不得扣；D <b>委托加工收回的葡萄酒</b>不得扣（只有从葡萄酒生产企业<b>购进或进口</b>的可以）；E 白酒一律不得扣；F 摩托车在十大不可扣清单；G 溶剂油也在不可扣清单。","trap":"D 是本题的题眼，口诀「<b>外购含葡可抵扣，委托无葡要牢记</b>」。另外 A 和单选 12 是同一个考点：只要成品是金银镶嵌首饰，就不能扣珠宝玉石已纳税款。可扣的基本都是「原料 → 同类成品」的加工链，跨税目、跨环节、直接转售都不行。","raw":"选项A：在零售环节纳税的金银首饰、铂金首饰、钻石及钻石饰品不得抵扣外购或委托加工收回的珠宝玉石的已纳税款。选项D：从葡萄酒生产企业购进、进口（不含委托加工收回）葡萄酒连续生产应税葡萄酒的，准予扣除所耗用应税葡萄酒已纳消费税税款。选项EFG：都属于不得扣除外购应税消费品已纳消费税的情形。"},{"no":12,"type":"multi","block":"3-14","stem":"关于已纳消费税扣除，下列表述正确的有（　）。","opts":{"A":"扣减外购葡萄酒已纳消费税时，本期税额不足抵扣的，余额留待下期抵扣","B":"扣减进口葡萄酒已纳消费税时，本期税额不足抵扣的，不得结转抵扣","C":"以外购高度白酒生产低度白酒，不得扣除外购白酒已纳税额","D":"以外购低度白酒生产高度白酒，按照当期购进数量计算扣除外购白酒已纳消费税"},"ans":"AC","exam":"葡萄酒的结转规则 + 白酒一律不扣。","think":"A 对、B 错：从葡萄酒生产企业<b>购进或进口</b>葡萄酒连续生产应税葡萄酒，准予扣除已纳税款；<b>本期应纳税额不足抵扣的，余额留待下期抵扣</b>——购进和进口适用<b>同一条</b>规则，B 把两者拆开是为了设套。C 对：<b>外购已税白酒连续生产应税白酒，一律不得扣除</b>，不管高度换低度还是低度换高度。D 错：既违反了「白酒不得扣」，还错在「按购进数量」——扣除一律按<b>当期生产领用数量</b>，不是购进数量。","trap":"记住两条：① 葡萄酒可扣的只有「购进 + 进口」，且不足抵扣可结转；② 白酒任何方向都不扣。另外「按购进数量」是万能干扰项，看到就划掉。","raw":"选项AB：纳税人从葡萄酒生产企业购进、进口葡萄酒连续生产应税葡萄酒的，准予从葡萄酒消费税应纳税额中扣除所耗用应税葡萄酒已纳消费税税款；如本期消费税应纳税额不足抵扣的，余额留待下期抵扣。选项CD：外购已税白酒连续生产应税白酒，不得扣除外购白酒已纳税额。"},{"no":13,"type":"multi","block":"3-16","stem":"下列关于卷烟批发销售环节征收消费税的表述中，符合税法规定的有（　）。","opts":{"A":"适用从价定率和从量定额的复合计征方式","B":"卷烟批发企业之间销售卷烟照章缴纳消费税","C":"纳税人兼营批发业务和零售业务未分开核算的，全部视同批发环节征收消费税","D":"总机构与分支机构不在同一地区的，分别向各自机构所在地缴纳消费税"},"ans":"AC","exam":"卷烟批发四条规定：复合、批批不征、未分开全征、总机构汇总。","think":"A 对：批发环节是复合计征 <b>11% + 250 元/标准箱</b>（=1 元/条 = 0.005 元/支）。C 对：兼营批发和零售<b>未分开核算</b>的，全部按批发环节征税——防止企业把批发收入挪到零售名下逃掉加征。B 错：<b>批发企业之间</b>销售卷烟不缴（货还在批发圈里，没到终点）。D 错：总分机构不在同一地区的，由<b>总机构汇总</b>申报纳税。","trap":"B 和 D 都是把规则反过来说。另外记一条：<b>批发环节不得扣除生产环节已纳消费税</b>——这两道税是政策故意叠的，允许扣就白加了。注意批发环节不分甲乙类，一律 11%，别把生产环节的 56%/36% 带过来。","raw":"选项B：卷烟批发企业之间销售的卷烟不缴纳消费税。选项D：卷烟批发环节的纳税地点为卷烟批发企业的机构所在地，总机构与分支机构不在同一地区的，由总机构申报纳税。"},{"no":14,"type":"multi","block":"3-16","stem":"下列关于电子烟消费税相关规定的表述中，正确的有（　）。","opts":{"A":"电子烟采用从价定率和从量定额复合方法计征消费税","B":"电子烟生产环节纳税人采用代销方式销售电子烟的，按照经销商（代理商）销售给电子烟批发企业的销售额计算纳税","C":"电子烟消费税征税对象包括烟弹、烟具以及烟弹与烟具组合销售的电子烟产品","D":"通过代加工方式生产电子烟的，由代加工的企业申报缴纳消费税"},"ans":"BC","exam":"电子烟四个高频细节：从价（非复合）、代销口径、征税对象、持商标者纳税。","think":"B 对：代销按<b>经销商（代理商）销售给电子烟批发企业的销售额</b>计税。C 对：征税对象含烟弹、烟具及二者组合产品。A 错：电子烟是<b>从价定率</b>（生产/进口 36%、批发 11%），<b>不是复合计征</b>——复合只有卷烟和白酒。D 错：代加工方式由<b>持有商标的企业</b>申报，只做代加工、不持商标的企业不是纳税人。","trap":"「电子烟跟卷烟一样」是最危险的直觉。它俩只在「双环节（生产+批发）」上一样，<b>计征方式不同</b>：卷烟复合、电子烟从价。D 和单选 20/21 母子题是同一个考点，配合着记。","raw":"选项A：电子烟采用从价定率方法计征消费税。选项D：通过代加工方式生产电子烟的，由持有商标的企业申报缴纳消费税。"},{"no":15,"type":"multi","block":"3-18","stem":"下列各项中，适用消费税出口<b>免税不退税</b>政策的有（　）。","opts":{"A":"外贸企业购进电子烟直接出口","B":"外贸企业受其他外贸企业委托代理出口燃料油","C":"高档化妆品生产企业自营出口自产高档化妆品","D":"实木地板生产企业委托外贸公司出口自产实木地板"},"ans":"CD","exam":"出口三档政策，本题只要「生产环节直接免征、无税可退」那一档。","think":"C 生产企业自营出口自产货、D 生产企业委托外贸公司代理出口自产货——两者都在<b>生产环节直接免征</b>消费税，压根没缴过，所以无税可退 → <b>免税不退税</b>，选。A 外贸企业<b>购进</b>电子烟直接出口、B 外贸企业受其他外贸企业委托代理出口，货都是买进来的、买价里已含消费税 → <b>免税并退税</b>，不选。","trap":"口诀：<b>外贸购进出「免退」，生产自营出「免不退」，商贸出口「不免不退」</b>。判断题只有一个动作：看主体是「生产企业」还是「外贸企业」，再看有没有「购进」。B 里的「委托代理」容易被误归到生产企业那档，但委托方是外贸企业，所以仍是免税并退税。","raw":"选项AB：适用出口免税并退税政策。"},{"no":16,"type":"multi","block":"3-18","stem":"根据消费税出口退（免）税的相关规定，下列表述正确的有（　）。","opts":{"A":"外贸企业购进应税消费品直接出口不予办理退还消费税","B":"生产企业自营出口可办理退还消费税","C":"生产企业委托外贸企业代理出口自产的应税消费品不予办理退还消费税","D":"外贸企业受其他外贸企业委托代理出口可办理退还消费税"},"ans":"CD","exam":"和上一题互补，改成判断「能不能办理退还」。","think":"C 对：生产企业委托外贸代理出口<b>自产</b>货，生产环节免征、没缴过税 → 不予退还。D 对：外贸企业受其他外贸企业委托代理出口，货是购进的、已含消费税 → 可办理退还。A 错：外贸企业<b>购进</b>直接出口恰恰是「免税并退税」的典型情形，可以退。B 错：生产企业自营出口免税不退税，<b>不予</b>退还。","trap":"两题连着做会发现，出口题的所有花样都在考一句话：<b>有没有真的缴过消费税</b>。缴过才退；生产环节直接免掉的，没缴过就不退。别和增值税的「免抵退」串——消费税生产环节单一，没有「抵」这一层。","raw":"选项A：外贸企业购进应税消费品直接出口，适用出口免税并退税，可办理退还消费税。选项B：生产企业自营出口，适用出口免税不退税，不予办理退还消费税。"},{"no":17,"type":"multi","block":"3-5","stem":"下列应税消费品中，除了在生产销售环节征收消费税外，还应在<b>批发环节</b>征收消费税的有（　）。","opts":{"A":"卷烟","B":"电子烟","C":"烟丝","D":"雪茄烟"},"ans":"AB","exam":"批发环节加征只给两类烟草制品，不是「带烟字就加」。","think":"A 卷烟、B 电子烟实行<b>双环节</b>：生产（进口）环节征一次，批发环节再加征一次 → 选。C 烟丝、D 雪茄烟只在生产/委托加工/进口环节<b>单环节</b>征收，批发环节不征 → 不选。","trap":"烟草类四个里只有两个加征。记忆法：<b>加征批发的只有「能直接抽的成品」——卷烟和电子烟</b>；烟丝是原料、雪茄是小众制品，都没进加征范围。另外超豪华小汽车是加征<b>零售</b>不是批发，别混。","raw":"选项CD：在批发环节不缴纳消费税。【解题通法】一般应税消费品为生产/委托加工/进口单环节；卷烟、电子烟为生产+批发双环节；金银铂钻仅零售单环节；超豪华小汽车（有排量）为生产+零售双环节。"},{"no":18,"type":"multi","block":"3-19","stem":"（非标准题）下列关于消费税纳税义务发生时间的表述中，正确的有（　）。","opts":{"A":"采取分期收款结算方式的，消费税纳税义务发生时间为发出应税消费品的当天","B":"委托加工的应税消费品，消费税纳税义务发生时间为受托方加工完成的当天","C":"进口的应税消费品，消费税纳税义务发生时间为报关进口的当天","D":"采取预收货款结算方式的，消费税纳税义务发生时间为发出应税消费品的当天","E":"将自产应税消费品用于投资入股，消费税纳税义务发生时间为办理股权证的当天","F":"采取托收承付方式的，消费税纳税义务发生时间为发出应税消费品并办妥托收手续的当天"},"ans":"CDF","exam":"六选三，三条对的、三条把法定时点往前或往后挪了。","think":"C 进口 → <b>报关进口当天</b>，对。D 预收货款 → <b>发出应税消费品当天</b>，对。F 托收承付 → <b>发出 + 办妥托收手续当天</b>（两个条件同时满足），对。<br>A 错：分期收款应为<b>书面合同约定的收款日期当天</b>，只有没约定或没书面合同才是发出当天。<br>B 错：委托加工是<b>纳税人提货当天</b>（消费税特有规定），不是加工完成当天。<br>E 错：自产自用（含投资入股）一律是<b>移送使用当天</b>，不是办股权证。","trap":"B「加工完成 vs 提货」是消费税区别于增值税的特有点，几乎年年考。通用原则再念一遍：<b>时点由结算方式法定确定，不看实际收钱、开票、签收</b>。A 把「无约定时的兜底」当成了一般规则，也是经典错法。","raw":"选项A：采取赊销和分期收款结算方式的，纳税义务发生时间为书面合同约定的收款日期的当天；书面合同没有约定收款日期或者无书面合同的，为发出应税消费品的当天。选项B：委托加工的应税消费品，纳税义务发生时间为纳税人提货的当天。选项E：自产自用的应税消费品，纳税义务发生时间为移送使用的当天。"},{"no":19,"type":"multi","block":"3-3","stem":"下列消费品中，<b>无须</b>缴纳消费税的有（　）。","opts":{"A":"出厂销售价格（不含增值税）16 元/片的面膜","B":"进口计税价格 360 元一只（5 克）的口红","C":"戏剧演员化妆用的油彩","D":"出厂销售价格（不含增值税）500 元一瓶（100 毫升）的护肤水"},"ans":"CD","exam":"高档化妆品的两条价格门槛 + 一个「不征」特例，注意问的是「无须缴纳」。","think":"高档化妆品门槛：生产/进口环节不含税价 <b>≥10 元/毫升(克)</b> 或 <b>≥15 元/片(张)</b>。<br>A 面膜 16 元/片 ≥15 → <b>要缴</b>，不选。<br>B 口红 360 元/5 克 = 72 元/克 ≥10 → <b>要缴</b>，不选。<br>C 舞台、戏剧、影视演员化妆用的上妆油、卸妆油、<b>油彩不属于征税范围</b> → 无须缴纳，选。<br>D 护肤水 500 元/100 毫升 = 5 元/毫升 <10 → 够不上高档化妆品，无须缴纳，选。","trap":"本题问「<b>无须</b>缴纳」，是反向提问，A、B 是缴的别选。B 要把 360 元÷5 克换算成每克单价再比线，别拿总价 360 和「10 元」直接比。C 是「不征」不是「免税」，性质不同。","raw":"选项ABD：须缴纳消费税的高档美容、修饰类化妆品和高档护肤类化妆品，是指生产（进口）环节销售（计税）价格（不含增值税）在10元/毫升（克）或15元/片（张）及以上的美容、修饰类化妆品和护肤类化妆品。选项C：舞台、戏剧、影视演员化妆用的上妆油、卸妆油、油彩不属于消费税高档化妆品税目的征税范围。"},{"no":20,"type":"multi","block":"3-7","stem":"销售下列酒类产品时收取的包装物押金，无论是否单独作价，均应在<b>收取时</b>并入当期销售额，并同时缴纳增值税和消费税的有（　）。","opts":{"A":"果啤","B":"白酒","C":"药酒","D":"黄酒"},"ans":"BC","exam":"包装物押金三行表：只有「啤酒黄酒以外的其他酒类」收取即征。","think":"B 白酒、C 药酒（其他酒）→ <b>收取时</b>就并入销售额，增值税和消费税同时缴 → 选。A 果啤按<b>啤酒</b>从量计征、D 黄酒也从量计征 → 押金<b>永远不影响消费税</b>，只有逾期才影响增值税 → 不选。","trap":"为什么啤酒黄酒免疫？回到 3-6：它们按吨收税，<b>价格这个变量压根不进消费税公式</b>。别因为「果啤是果味酒」就当成其他酒。三行表再念一遍：一般消费品逾期征；其他酒类收取即征、逾期不再征；啤酒黄酒成品油逾期只征增值税。","raw":"选项AD：啤酒（含果啤）、黄酒、成品油从量计征消费税，包装物押金不计征消费税，包装物押金在逾期或超过1年时征收增值税。选项BC：除啤酒、黄酒以外的其他酒类的包装物押金，无论是否单独作价，在收取时均应并入当期销售额征收增值税和消费税。"},{"no":21,"type":"multi","block":"3-11","stem":"（非标准题）下列各项中，应征收消费税的有（　）。","opts":{"A":"酒厂将自产白酒用于生产酒心巧克力","B":"卷烟厂将自产烟丝用于生产卷烟","C":"日化厂将自产高档化妆品发给职工作为福利","D":"涂料厂将自产涂料用于管理部门","E":"家具厂将自产实木地板用于馈赠","F":"筷子厂将自产木制一次性筷子用于职工奖励","G":"酒厂将自产葡萄酒用于勾兑红酒","H":"日化厂将自产高档化妆品用于样品试用"},"ans":"ACDEFH","exam":"八选六，只有两个「连续生产应税消费品」不缴。","think":"判断就一句：<b>连续生产应税消费品 → 不缴；其他用途 → 移送就缴</b>。<br>不缴的两个：B 自产烟丝 → 生产卷烟（都是应税消费品）、G 自产葡萄酒 → 勾兑红酒（都是应税消费品）。<br>其余全缴：A 白酒→酒心巧克力（<b>非应税消费品</b>）、C 职工福利、D 管理部门、E 馈赠、F 职工奖励、H 样品试用。","trap":"A 和 G 长得几乎一样，差别只在成品是不是应税消费品——<b>酒心巧克力是糖果、红酒是酒</b>。这是本题唯一的胜负手。另外注意本题只问消费税，不问增值税：A、D 在增值税上其实不缴（自用于连续生产非应税品/管理部门不视同销售），两税别串。","raw":"选项ACDEFH：纳税人自产的应税消费品用于生产非应税消费品、在建工程、管理部门、非生产机构、提供劳务，以及用于馈赠、赞助、集资、广告、样品、职工福利、奖励等方面，于移送使用时缴纳消费税。选项BG：纳税人自产的应税消费品，用于连续生产应税消费品的，不缴纳消费税。"},{"no":22,"type":"multi","block":"3-12","stem":"甲礼花厂委托乙厂加工一批烟花爆竹，双方协议约定由甲礼花厂提供原材料并支付加工费，加工完成后由甲礼花厂收回。税务机关在检查中发现，乙厂未按规定代收代缴消费税，下列关于消费税税务处理的表述中正确的有（　）。","opts":{"A":"乙厂没有代收代缴消费税，应对乙厂处以应代收代缴税款 50% 以上 5 倍以下的罚款","B":"甲礼花厂已销售的，以销售额作为补缴税款的计税依据","C":"甲礼花厂未销售的，以组成计税价格作为补缴税款的计税依据","D":"应由乙厂补缴消费税"},"ans":"BC","exam":"受托方没代收代缴：处罚归处罚、补税归委托方，两条线并行。","think":"B 对：收回后<b>已直接销售</b>的，按<b>实际销售额</b>补征。C 对：尚未销售或不能直接销售的，按<b>委托加工组价</b>补征。<br>A 错：罚款是应代收代缴税款 <b>50% 以上 3 倍以下</b>，不是 5 倍。<br>D 错：<b>税款由委托方（甲礼花厂）补缴</b>，乙厂承担的是未履行扣缴义务的行政处罚。","trap":"记「<b>罚受托方、补委托方</b>」这八个字，两条责任并行，不因受托方被罚就免了委托方的纳税义务。罚款倍数 50%~3 倍（不是 5 倍）是数字陷阱。顺带记：受托方是<b>个人</b>时本来就不得代收代缴，由委托方收回后自行申报。","raw":"选项A：如果受托方（个人除外）没有代收代缴消费税，对受托方处以应代收代缴税款50%以上3倍以下的罚款。选项BC：对委托方补征税款的计税依据，收回的应税消费品已直接销售的，按销售额计税；尚未销售或不能直接销售的，按委托加工业务的组价计税。选项D：应由甲礼花厂补缴消费税。"},{"no":23,"type":"multi","block":"3-5","stem":"（非标准题）下列商品中，在<b>零售环节</b>征收消费税的有（　）。","opts":{"A":"钻石戒指","B":"镀金首饰","C":"纯电动超豪华小汽车","D":"摩托车","E":"铂金项链","F":"翡翠手镯","G":"古法金手链","H":"燃油超豪华小汽车"},"ans":"ACEGH","exam":"八选五，把「只在零售征」和「零售加征」两类一起考。","think":"零售环节征税的只有两拨：<br>① <b>金银铂钻</b>（唯一一道，5%）：A 钻石戒指、E 铂金项链、G 古法金手链 → 选。<br>② <b>超豪华小汽车</b>（≥90 万，零售加征 10%）：C 纯电动（无排量，<b>仅</b>零售征）、H 燃油（生产+零售双环节）→ 选。<br>排除：B 镀金首饰、F 翡翠手镯属于「其他贵重首饰及珠宝玉石」，在<b>生产/进口</b>环节 10%；D 摩托车在生产/委托加工/进口环节。","trap":"B「镀金首饰」是本章最经典的陷阱——它<b>不属于金银首饰</b>，只有金基/银基合金首饰及其镶嵌首饰、铂金首饰、钻石及钻石饰品才在零售征。F 翡翠同理。另外 C 和 H 虽然都在零售征，但 C 是「只征这一道」、H 是「加征第二道」，性质不同，别因为觉得「纯电动可能免税」就漏选。","raw":"选项AEG：金银首饰、铂金首饰、钻石及钻石饰品在零售环节征收消费税。选项B：镀金（银）、包金（银）首饰及其镶嵌首饰不属于金银首饰，应在生产销售、委托加工或进口环节征收消费税。选项CH：对纯电动、燃料电池等没有气缸容量的超豪华小汽车仅在零售环节征收消费税；对其他超豪华小汽车，在生产（进口）环节按现行税率征收基础上，在零售环节加征一道消费税。选项DF：在生产销售、委托加工或者进口环节征收消费税。"},{"no":24,"type":"multi","block":"3-12","stem":"甲实木地板厂为增值税一般纳税人，受乙地板厂委托加工一批 M 型实木地板，双方约定由<b>甲实木地板厂提供素板</b>，乙地板厂支付加工费，当月将加工完毕的实木地板交付乙地板厂，开具的增值税专用发票注明收取材料费金额 42 万元、加工费 8 万元，甲实木地板厂同型号该批实木地板的含增值税销售价格为 65 万元。下列消费税税务处理正确的有（　）。（实木地板税率 5%）","opts":{"A":"纳税人为甲实木地板厂","B":"纳税人为乙地板厂","C":"上述行为涉及的消费税应纳税额为 2.63 万元","D":"上述行为涉及的消费税应纳税额为 2.88 万元"},"ans":"AD","exam":"「受托方提供原料」→ 假委托，整题按甲自产自销处理。","think":"题干写着「委托加工」，但<b>素板是甲提供的</b>——按 3-12 的判定，原料由受托方出，这就是<b>甲销售自制应税消费品</b>，不是委托加工。所以纳税人是<b>甲</b>（A 对、B 错）。甲有同类 M 型实木地板的含税售价 65 万，<b>同类售价优先</b>：65 ÷ 1.13 × 5% = <b>2.88 万</b>（D 对、C 错）。","trap":"· 「材料费 42 万 + 加工费 8 万 = 50 万」是组价用的数字，本题有同类售价，<b>用不上</b>——选 C 2.63 就是拿 50÷1.13×5% 或组价算出来的。<br>· 合同标题写「委托加工」不作数，只看谁出原料。<br>· 含税售价要 ÷1.13。","raw":"由受托方提供原材料生产的应税消费品，不能作为委托加工应税消费品业务处理，应按照甲实木地板厂销售自制应税消费品处理。甲有同类实木地板的销售价格，计税依据为当月销售同类M型实木地板的不含增值税销售价格。消费税应纳税额=65÷(1+13%)×5%=2.88（万元）。"},{"no":25,"type":"multi","block":"3-20","stem":"（非标准题）企业发生的下列经营行为中，应当<b>同时</b>缴纳增值税和消费税的有（　）。","opts":{"A":"汽车修理厂从境外进口轮胎","B":"商场零售翡翠手镯","C":"啤酒屋销售自产啤酒","D":"汽车制造厂销售自产中轻型商用客车","E":"葡萄酒厂将自产葡萄酒用于生产酒心巧克力","F":"卷烟厂将自产卷烟用于抵偿债务","G":"涂料厂将自产涂料用于办公室装修","H":"实木地板厂将自产素板用于生产实木指接地板"},"ans":"CDF","exam":"两税同缴走两道门：先「15 类 + 征税环节」，再「有偿转让或视同销售」。","think":"C 啤酒屋自产啤酒对外销售、D 自产中轻型商用客车销售、F 自产卷烟抵债 → 两税都缴，选。<br>A 进口轮胎：轮胎不是 15 类 → 只缴增值税（和关税）。<br>B 零售翡翠手镯：翡翠在<b>生产/进口</b>环节征消费税，零售不是它的环节 → 只缴增值税。<br>E 自产葡萄酒做酒心巧克力：连续生产<b>非应税</b>消费品 → 只缴消费税，增值税不缴。<br>G 自产涂料装修办公室：管理部门/非生产项目 → 只缴消费税。<br>H 自产素板做实木指接地板：连续生产<b>应税</b>消费品 → 两税都不缴。","trap":"E 和 H 是本题最阴的一对：差别只在成品是不是应税消费品（酒心巧克力不是、实木指接地板是）。G「办公室装修」属于管理部门使用，增值税不视同销售。B 不是「翡翠不缴消费税」，而是「零售这笔不缴」——它出厂时已经缴过了。","raw":"选项AB：缴纳增值税，但是不缴纳消费税。选项EG：缴纳消费税，但是不缴纳增值税。选项H：既不缴纳增值税，也不缴纳消费税。【解题通法】判断是否征收消费税：先看是否属于15类应税消费品，再看是否处于该应税消费品的征税环节。"},{"no":26,"type":"multi","block":"3-20","stem":"下列企业发生的经营行为中，应当同时缴纳增值税和消费税的有（　）。","opts":{"A":"某鞭炮生产企业将自产鞭炮发给员工作为春节福利","B":"某化妆品生产企业将自产高档香水精用于生产高档口红","C":"某白酒生产企业将外购葡萄酒用于对外投资","D":"某实木地板生产企业将自产实木地板用于职工食堂装修"},"ans":"AD","exam":"和上一题同型，但多了「外购」这个变量。","think":"A 自产鞭炮发职工福利 → 视同销售，<b>两税都缴</b>。D 自产实木地板用于职工食堂装修 → 属于职工福利/非生产项目，<b>两税都缴</b>。<br>B 自产高档香水精 → 生产高档口红：连续生产<b>应税</b>消费品，两税都不缴。<br>C <b>外购</b>葡萄酒对外投资：增值税视同销售要缴；但消费税针对的是「自产自用」，外购商品对外投资不构成消费税纳税义务 → 只缴增值税。","trap":"C 的「<b>外购</b>」二字是本题题眼：消费税视同销售只管自产应税消费品，买入的货再投出去不产生新的消费税（它在生产环节已经缴过）。B 和 D 的对比也值得留意：同样是「自产自用」，连续生产应税品不缴，用在职工食堂要缴。","raw":"选项B：既不需要缴纳增值税，也不需要缴纳消费税。选项C：需要缴纳增值税，但是不需要缴纳消费税。【解题通法】自产应税消费品用于连续生产应税消费品的，两税均不缴；用于连续生产非应税消费品、非生产项目的，缴消费税不缴增值税；用于馈赠、福利、奖励、换投抵的，两税均缴。"},{"no":27,"type":"multi","block":"3-20","stem":"为加强成品油行业税收监管，税务部门需对涉税争议产品实施检测。下列情形中，税务机关可以启动成品油涉税产品检测的有（　）。","opts":{"A":"纳税人对成品油涉税产品是否征税或适用税率存在争议的","B":"举报线索反映纳税人可能存在涉税风险的","C":"税务机关发现纳税人可能存在涉税风险的","D":"新闻媒体曝光，造成重大社会影响的"},"ans":"ABCD","exam":"2026 年新增考点：成品油涉税产品检测的启动情形。","think":"四类情形都可以启动：① 纳税人对是否征税或适用税率<b>存在争议</b>；② <b>举报线索</b>反映涉税风险；③ 税务机关<b>自行发现</b>涉税风险；④ <b>新闻媒体曝光</b>造成重大社会影响；另有「其他需要检测的情形」兜底。由税务机关牵头，可联合发改、财政、市场监管部门，也可请第三方检测机构协助；检测结果用于纳税评估、税务稽查和行政处罚的事实依据。","trap":"别因为 D「新闻媒体曝光」看着不像法定情形就排除——它是<b>明文列举</b>的启动情形之一，本题答案是全选 ABCD。为什么会有这条新规？回到 3-4：成品油边界靠用途和一堆化工品清单划，企业改个名字就能争议「我这不算成品油」，所以税务机关需要技术检测来定事实。","raw":"2026年新增《成品油涉税产品检测管理暂行办法》：出现纳税人对征税或税率存争议、发现或举报反映涉税风险、媒体曝光造成重大影响、其他需要检测的情形时，可启动检测；由税务机关牵头组织实施，可联合相关部门并聘请第三方检测机构协助。"}],"notes":{"blocks":[{"id":"3-1","name":"一次性调节税：消费税和增值税根本不是一类东西","star":"★★★","level":"L3","scene":"还是上一章那条面包流水线，现在换成一包烟：烟厂把烟卖给批发商，批发商卖给超市，超市卖给你。<br><br>增值税在这三环里<b>每一环都收、每一环都抵</b>，最后累计等于零售价的 13%。消费税呢？只在<b>烟厂出厂那一刀</b>收，批发、零售环节再也不收（卷烟是少数例外，后面单讲）。<br><br>更反直觉的是：这包烟标价 100 元里，消费税已经<b>藏在价格里面</b>了。你付的 100 元 = 成本 + 利润 + 消费税，而增值税是在 100 元之外再加 13 元。","why":"为什么国家要两套税叠着收？因为分工完全不同：<br><br>· <b>增值税是「普遍税」</b>——所有商品服务都收，目的是稳定拿财政收入，所以它必须中性：不能因为你分工细就多收、自己全干就少收，否则会扭曲企业的经营决策。<br>· <b>消费税是「选择税」</b>——只挑 15 类商品，目的是<b>调节</b>：烟、酒伤身体，成品油、实木地板耗资源，游艇、高档手表是奢侈消费。国家不指望靠它收多少钱，而是想让这些行为「贵一点、少一点」，这叫<b>寓禁于征</b>。<br><br>既然目的是调节而不是层层抽税，就没必要每个环节都管：<b>在商品第一次进入流通（生产/委托加工/进口）时收一刀</b>，税基最大、纳税人最少、最好管。后面的批发零售只是转手，价格里已经含过税了，再收就是重复。<br><br>还有一个技术后果必须记住：消费税是<b>价内税</b>。所以当你只有成本、没有售价要「组价」时，公式是 <b>÷(1-消费税率)</b>——因为税要藏在价格里，得把税「加回去」。增值税是价外税，换算永远是 <b>÷(1+增值税率)</b>，把税「剥出来」。第三章所有组价公式，根子就在这一句。","sentence":"增值税环环收、层层抵，是价外税；消费税挑 15 类商品、只在第一次进流通时收一刀，是价内税。看到「组价」先问：价内 → ÷(1-税率)，价外 → ÷(1+税率)。","trap":"· 别把「消费税只在生产环节收」背成绝对——卷烟、电子烟在批发环节加征，金银铂钻干脆只在零售环节收，超豪华小汽车零售加征。这三类例外是本章最高频的考点。<br>· 别把消费税和增值税的征税范围画等号：<b>增值税 > 消费税</b>，交增值税不代表交消费税（高档皮包、实木家具都不交消费税），但交消费税的一定同时交增值税（进口环节除外，那里缴的是海关代征的增值税）。<br>· 题干问「应征收消费税」时，先过两道门：① 是不是 15 类之一？② 是不是处在它的征税环节？两道都过才缴。","table":{"head":["","增值税","消费税"],"rows":[["立法目的","普遍征收、稳定收入","选择征收、寓禁于征"],["征税范围","所有货物/服务/无形资产/不动产","仅 15 类应税消费品"],["征税环节","每个流转环节","一般只在生产/委托加工/进口一次"],["价内 or 价外","价外（税款另列）","价内（税款藏在价格里）"],["组价换算","÷(1+增值税税率)","÷(1-消费税比例税率)"],["重复征税处理","凭票抵进项","按生产领用数量扣已纳税额"]]},"tips":["这一章只要卡住，就回来问：「这一刀本来该在哪儿收？题目把它挪到哪儿了？」","「寓禁于征」四个字能解释 80% 的税目边界：为什么高尔夫球具征、沙滩车不征，为什么电池涂料有环保免税。"],"qs":[3]},{"id":"3-2","name":"15 类税目地图：不征、免税、暂缓征收是三件事","star":"★★★","level":"L3","scene":"一道多选题甩给你八个商品：高尔夫车、未经涂饰的素板、150 毫升摩托车、雪地车、橡胶填充油、18K 金镶钻手链、变压器油、纯生物柴油——问哪些<b>属于消费税征税范围</b>。<br><br>你会发现它们「不交税」的理由各不相同：有的压根不在这 15 类里（高尔夫车、雪地车、150 毫升摩托车、变压器油），有的明明在税目里但国家抬手放行（纯生物柴油免征），还有的属于「暂缓征收」（航空煤油、航天煤油）。","why":"为什么要把这三种状态分这么细？因为<b>法律后果不同</b>：<br><br>· <b>不属于征税范围</b>：根本没进这个税的门。以后政策怎么变都跟你无关，也没有「免税要不要备案」「进项能不能抵」这些后续问题。<br>· <b>免税</b>：进了门，本来该缴，国家主动免掉。所以它会带一串配套规则：免税项目要单独核算、对应进项不能抵、放弃免税后 36 个月不能反悔（增值税那边）、免税但不能开专票。<br>· <b>暂缓征收</b>：进了门、也没正式免，只是暂时不收，随时可能恢复。<br><br>出题人就靠这个做文章：轻二多选 1 的答案里，<b>纯生物柴油（H）要选</b>——它属于成品油税目，只是享受免税；<b>150 毫升摩托车（C）不能选</b>——250 毫升以下根本不在征税范围；<b>变压器油（G）不能选</b>——绝缘油不属于润滑油。<br><br>15 类怎么记？按「为什么被选中」分四组，比硬背清单牢：<br>① <b>有害健康</b>：烟（含电子烟）、酒、鞭炮焰火<br>② <b>奢侈浪费</b>：高档化妆品、贵重首饰珠宝玉石、高尔夫球具、高档手表、游艇、小汽车、摩托车、超豪华小汽车<br>③ <b>稀缺资源</b>：木制一次性筷子、实木地板、成品油、电池、涂料<br>④ 剩下用口诀兜底：<b>「三高产品要征税，节能环保要牢记」</b>——高消费、高污染、高能耗。","sentence":"先问「在不在 15 类里」，再问「免不免」，最后问「在不在征税环节」。不征 / 免税 / 暂缓，三个词不能混用。","trap":"· 题干写「属于征税范围」时，<b>免税品也要选</b>（纯生物柴油、太阳能电池、燃料电池、无汞原电池都在此列）；写「应缴纳消费税」时，免税品不能选。轻二两道非标准题专门考这个读题差异。<br>· 易错归类：烟叶<b>不征</b>（只对烟草制品）；酒精、调味料酒<b>不征</b>；体育发令纸、鞭炮药引线<b>不征</b>；舞台演员用的油彩<b>不征</b>；竹制筷子<b>不征</b>（只有木制一次性筷子）；绝缘油类（变压器油、导热油）<b>不征</b>。<br>· 反向记：未经涂饰的素板、未经打磨倒角的木筷、橡胶填充油、烷基化油、重芳烃——这些「半成品/化工品」<b>都征</b>，国家把口子堵得很死，防止改名避税。","table":{"head":["状态","含义","典型例子","做题动作"],"rows":[["不属于征税范围","没进 15 类","沙滩车/雪地车/卡丁车/高尔夫车、150ml 摩托车、变压器油、烟叶、酒精","问「征税范围」不选；问「应缴」也不选"],["免税","进了门但免缴","纯生物柴油、太阳能电池、燃料电池、无汞原电池、锂离子蓄电池","问「征税范围」要选；问「应缴」不选"],["暂缓征收","暂时不收","航空煤油、航天煤油","两者都不选"],["正常征税","在范围内且无优惠","铅蓄电池(4%)、烷基化油、素板","都选"]]},"tips":["把「免税」两个字看成「进了门」——这是非标准题唯一的胜负手。","成品油是税目陷阱最密集的一块：石脑油/溶剂油/润滑油/燃料油各有自己的扩围清单，绝缘油是唯一明确排除的。"],"qs":[1,1]},{"id":"3-3","name":"够不够格：小汽车、游艇、高档化妆品、手表的门槛","star":"★★","level":"L2","scene":"四样东西摆在面前：23 座中轻型商用客车、8 米长的机动游艇、出厂价 16 元一片的面膜、单价 8000 元的手表。<br><br>前两样缴消费税，后两样不缴——差别全在<b>一条硬门槛</b>上。","why":"为什么消费税爱设「价格线」和「规格线」？因为它的目的是调节<b>奢侈消费</b>，不是给所有同类商品加税。国家不想让普通护肤水、通勤手表变贵，只想打到最后那一小撮高端消费，所以必须用客观、可核查的线把范围切开：<br><br>· <b>高档化妆品</b>：生产/进口环节不含增值税价 ≥<b>10 元/毫升(克)</b> 或 <b>15 元/片(张)</b>。<br>· <b>高档手表</b>：不含增值税售价每只 ≥<b>10000 元</b>。<br>· <b>游艇</b>：艇身长度 <b>8~90 米</b>、内置发动机、非牟利用途。<br>· <b>摩托车</b>：气缸容量 <b>≥250 毫升</b>。<br>· <b>小汽车</b>：乘用车 ≤9 座、中轻型商用客车 10~23 座；<b>大型商用客车、货车、沙滩车、雪地车、卡丁车、高尔夫车都不征</b>。判定看底盘（车架）原始属性，不看外观改装。<br><br>这些线还有个共同点：<b>都用不含增值税的价</b>。因为增值税是价外税，含在标价里会虚高，把本来不够格的商品推过门槛。所以看到「含税价」先 ÷1.13 再比线。","sentence":"消费税挑的是「高端那一小截」：化妆品 10 元/ml 或 15 元/片、手表 1 万元/只、游艇 8~90 米、摩托车 250ml、小汽车按座位数和底盘。比线前先把增值税剥掉。","trap":"· 轻二多选 19：16 元/片的面膜（≥15 元/片，<b>要缴</b>）、360 元/5 克的口红（72 元/克 ≥10，<b>要缴</b>）、500 元/100ml 护肤水（5 元/ml <10，<b>不缴</b>）、演员用油彩（<b>不征</b>）。答案 CD 是两个不缴的。<br>· 单价 8000 元手表（单选 4 选项 C）不到 1 万，<b>不缴</b>，别看到「手表」就选。<br>· <b>舞台、戏剧、影视演员化妆用的上妆油、卸妆油、油彩</b>不属于高档化妆品税目，是「不征」不是「免税」。<br>· 纯电动小汽车如果不是超豪华，<b>不征</b>消费税（但缴增值税）；一旦零售价 ≥90 万，就作为超豪华小汽车在零售环节征。","table":{"head":["税目","门槛","不征的典型"],"rows":[["高档化妆品","≥10 元/ml(g) 或 ≥15 元/片","演员用油彩、普通护肤水"],["高档手表","≥10000 元/只(不含增值税)","8000 元手表"],["游艇","8~90 米、内置发动机","非机动艇、超 90 米"],["摩托车","气缸容量 ≥250ml","150ml 轻便摩托"],["小汽车","乘用车≤9座 / 中轻客10~23座","大客、货车、沙滩车、卡丁车"]]},"tips":["所有价格门槛都用「不含增值税」口径，含税价一律 ÷1.13。","题目给「每片」「每毫升」时先统一单位再比线，别拿总价直接比。"],"qs":[2,19]},{"id":"3-4","name":"成品油与环保税目：为什么绝缘油偏偏不算","star":"★★","level":"L2","scene":"税务稽查到一家化工厂，仓库里堆着橡胶填充油、重芳烃、变压器油、导热油、烷基化油、纯生物柴油。会计说「都是油，凭什么有的征有的不征？」<br><br>答案藏在这些油的<b>用途</b>里：前几样最终会烧掉或变成燃料，变压器油和导热油是给设备<b>绝缘、传热</b>用的，一辈子不燃烧。","why":"成品油消费税的设计意图是对<b>能源消耗</b>征税（顺带调节污染），所以判断标准是「这东西会不会被当成燃料/润滑油用掉」，不是化学名字叫不叫油。<br><br>于是立法用了一张「扩围清单」把常见改名避税的化工品全点名：<br>· <b>石脑油</b>：混合芳烃、重芳烃、混合碳八、稳定轻烃、轻油、轻质煤焦油<br>· <b>溶剂油</b>：橡胶填充油、溶剂油原料、石油醚、各种工业白油<br>· <b>汽油</b>：甲醇/乙醇汽油、<b>烷基化油（异辛烷）</b><br>· <b>柴油</b>：含生物柴油<br>· <b>燃料油</b>：重油、渣油、腊油、船用重油等<br><br>反过来，<b>变压器油、导热类油等绝缘油明确不属于润滑油，不征</b>——它们不参与燃烧、不产生那类外部性。这就是轻二多选 1 里 G 不选、E 选的原因。<br><br>环保类还有两条线要一起记：<br>· <b>成品油优惠</b>：航空煤油、航天煤油<b>暂缓征收</b>；符合条件的纯生物柴油（废弃动植物油占比≥70%）<b>免征</b>；废矿物油再生的工业油料免征。<br>· <b>电池、涂料</b>：属于税目，但给了环保免税——无汞原电池、氢镍/锂离子蓄电池、太阳能电池、燃料电池、全钒液流电池<b>免征</b>；施工状态下 VOC ≤420 克/升的涂料<b>免征</b>。只有<b>铅蓄电池按 4% 征</b>。<br><br>看明白了吗？电池这一组就是把「污染重的征、干净的免」写成了法条。","sentence":"成品油看用途不看名字：会烧掉的都算，绝缘油（变压器油、导热油）不算。电池记住「铅蓄电池 4% 征，其余环保电池免」，涂料记住 VOC 420 克/升这条线。","trap":"· <b>航空煤油 / 航天煤油是「暂缓征收」</b>，不是免税，也不是不征——轻二单选 1 的答案就是 A，选项 C 太阳能电池、D 纯生物柴油是「免征」，B 鞭炮药引线是「不征」。四个选项四种状态，专门考你分不分得清。<br>· 啤酒屋（啤酒坊）用啤酒生产设备自制的啤酒<b>要征</b>消费税，且一律按甲类 250 元/吨，不管卖多便宜（多选 2 的 A）。<br>· 出国人员免税商店销售的金银首饰<b>照征</b>消费税（多选 2 的 C）——「免税店」免的是关税、增值税，不是消费税。<br>· 2026 新增的「成品油涉税产品检测」：征税/税率有争议、举报或发现涉税风险、媒体曝光造成重大影响，都可以启动检测（多选 27 全选）。","tips":["把「暂缓 / 免税 / 不征」三个词单独抄一张卡，本章至少考三次。","成品油的扩围清单不用全背，但「烷基化油=汽油」「橡胶填充油=溶剂油」「变压器油=不征」这三对必考。"],"qs":[2,5]},{"id":"3-5","name":"征税环节：一次征收 + 三类例外","star":"★★★","level":"L3","scene":"同一件商品从工厂到你手上，中间有生产、批发、零售三个口子。一般商品（比如一瓶高档香水）只在<b>第一个口子</b>收消费税，后面全免。<br><br>但有三类商品不老实：<b>卷烟、电子烟</b>在生产之后还要在批发环节再加一道；<b>超豪华小汽车</b>在生产/进口之后还要在零售环节再加一道；<b>金银铂钻首饰</b>更极端——前面全不收，只在零售环节收唯一一道。","why":"为什么单环节原则要破例？三个例外各有各的理由，理解了就不用背：<br><br>· <b>卷烟、电子烟加征批发环节</b>：烟草是「寓禁于征」最典型的商品，单靠生产环节一道税压不住消费；而且批发价格是税务部门最容易监控的口径，加在批发端最不容易逃。所以国家在生产环节收完，再在批发企业卖给零售商时加 11% + 定额。<br>· <b>超豪华小汽车加征零售环节</b>：它的调节对象是「买豪车这个消费行为」，而生产环节按排量征税只看车、不看人；只有落到最终成交价（≥90 万）才算奢侈消费，所以必须在零售端按成交价再加 10%。<br>· <b>金银铂钻只在零售环节</b>：历史原因——这类商品大量在作坊、个体户手里加工，生产端根本管不过来；而零售端（金店）相对集中、好管。索性把唯一一道税挪到最后。<b>代价</b>是：生产/进口环节不征，也就没有「已纳消费税」可扣，所以金银镶嵌首饰一律不得扣除外购珠宝玉石的已纳税款。<br><br>还有一个容易忽略的点：<b>批发企业之间</b>互相卖卷烟不缴批发环节消费税，只有卖给「零售商/非批发单位」才缴——因为加征那一刀要落在离开批发体系、流向消费者的那一刻。","sentence":"一般商品：生产/委托加工/进口一次。加征两道：卷烟、电子烟（+批发）、超豪华小汽车（+零售）。只收最后一道：金银铂钻（仅零售）。批发商之间卖卷烟不缴。","trap":"· 轻二多选 17 问「除了生产销售环节，还在批发环节征收」——答案只有 <b>卷烟、电子烟</b>；烟丝、雪茄烟都只在生产环节，别看带「烟」字就选。<br>· 多选 23 问「零售环节征收」：钻石戒指、铂金项链、古法金手链（金银铂钻）、纯电动超豪华小汽车、燃油超豪华小汽车都选；<b>镀金首饰、翡翠手镯、摩托车不选</b>（它们在生产/进口环节）。<br>· 二手超豪华小汽车<b>不征</b>消费税，因为那笔奢侈消费在第一手已经课过税了。<br>· 进口金银饰品不征消费税（单选 4 的 D 是错的）——金银铂钻的征税环节只有零售，进口不是它的环节。","table":{"head":["类型","生产/委托加工/进口","批发","零售"],"rows":[["一般应税消费品","√ 单环节","×","×"],["卷烟、电子烟","√","√ 加征","×"],["超豪华小汽车(有排量)","√","×","√ 加征 10%"],["超豪华小汽车(纯电/燃料电池)","×","×","√ 仅此一道"],["金银铂钻首饰","×","×","√ 仅此一道 5%"]]},"tips":["画一条三格流水线，把商品往上放，比背表格快。","「批发企业之间销售卷烟不缴」是单选题的常客，记「离开批发圈才缴」。"],"qs":[17,23]},{"id":"3-6","name":"三种计税方法：从价、从量、复合怎么分","star":"★★","level":"L2","scene":"三笔生意：卖一瓶高档香水（价格越高税越多）、卖 10 吨啤酒（不管贵不贵，每吨固定 250 元）、卖一批白酒（既按价钱抽 20%，又按斤数每 500 克加 0.5 元）。<br><br>为什么不能统一成一种算法？","why":"计税方法要匹配<b>商品的物理属性</b>和<b>调节目的</b>：<br><br>· <b>从价定率</b>（绝大多数）：这类商品价格跨度大、贵贱本身就是「奢侈程度」的信号，按价抽成最贴合调节意图。<br>· <b>从量定额</b>（<b>啤酒、黄酒、成品油</b>）：这三类的消费量才是外部性的来源（喝多少酒、烧多少油），而且计量单位标准、单价低、涨价慢。按量收既公平又抗通胀，还省得逐笔核价。<br>· <b>复合计征</b>（<b>只有卷烟、白酒</b>）：这两类是调节力度最大的商品，光按价收会被「低价走量」绕开，光按量收又打不到高价产品，所以两头一起收。<br><br>由此推出本章最重要的一张判定表：<b>从量三种、复合两种，剩下全从价</b>。多选题里只要先圈出「啤酒/黄酒/成品油」和「卷烟/白酒」，其余用排除法即可，不必记 15 类各自的税率。<br><br>另一个高频规则是「从高」：<b>兼营不同税率未分别核算 → 从高；组成成套消费品销售 → 无论是否分别核算，一律从高</b>。为什么后者更狠？因为成套销售时企业完全可以把高税率商品标价压到 1 元、低税率商品标高价来洗税基，单独核算已经防不住了，只能一刀切。","sentence":"从量只有啤酒、黄酒、成品油；复合只有卷烟、白酒；其余全从价。兼营不分开核算从高，成套销售一律从高。","trap":"· 多选 3 的 C「组成成套消费品分别核算则分别适用税率」是<b>错</b>的——成套销售没有「分别核算」这个例外，一律从高。<br>· 多选 4 问从量计征：啤酒、柴油（成品油）选；电池、涂料是<b>从价</b>，别因为它们是「环保调控」就以为从量。<br>· 白包卷烟（没牌号、无法核价）照样复合计征，D 是对的。<br>· 从量计征的商品<b>没有价税分离问题</b>——因为它压根不看销售额，这也解释了为什么啤酒/黄酒/成品油的包装物押金永远不影响消费税。","table":{"head":["方法","适用税目","应纳税额"],"rows":[["从价定率","除下列以外的绝大多数","不含增值税销售额 × 比例税率"],["从量定额","啤酒、黄酒、成品油","销售数量 × 定额税率"],["复合计征","卷烟、白酒","销售额×比例税率 + 数量×定额税率"]]},"tips":["先圈「从量三种 + 复合两种」，剩下的题都用排除法。","「成套销售一律从高」和「兼营未分别核算从高」是两句话，别合并成一句。"],"qs":[3,4]},{"id":"3-7","name":"销售额里塞了什么：价外费用与包装物押金","star":"★★★","level":"L3","scene":"卖一批白酒，除了货款还收了：品牌使用费、包装费、集资费、延期付款利息、包装物押金、代垫运费、代政府收的基金。会计问：哪些要并进销售额算消费税？<br><br>看着眼花，其实只有一句判断标准。","why":"消费税从价计征的税基是「<b>伴随这笔销售、买方实际付出的全部代价</b>」。名字叫什么完全不重要——叫「品牌使用费」也好、「服务费」也好，只要是因为买这批货才付的钱，就是价格的一部分。这叫<b>实质重于形式</b>：否则企业把货款拆成「货款 1 元 + 品牌费 99 元」，税基就没了。<br><br>真正能排除的只有两类，而且都要「符合条件」：<br>· <b>代垫运费</b>：运费发票开给购买方 + 纳税人把发票转交给购买方，两条同时满足。逻辑是这笔钱你只是过手，最终由买方直接付给承运方，不是你的收入。<br>· <b>政府性基金 / 行政事业性收费</b>：国务院或省级批准设立 + 开省级以上财政票据 + 全额上缴财政。同样是「过手钱」。<br><br>包装物要分三件事，别搅在一起：<br>① <b>连同货物销售的包装物</b>：无论是否单独计价、会计怎么核算，<b>一律并入销售额</b>（单选 27、多选 6）。<br>② <b>包装物押金</b>（酒类最复杂）：<br>　· 一般应税消费品：<b>收取时不征</b>，逾期或超 1 年才征（增值税、消费税同时）；<br>　· <b>除啤酒、黄酒外的其他酒类</b>：<b>收取当期就并入销售额</b>征增值税和消费税，逾期不再征——因为酒类押金常常就是变相价款，等逾期等于给了一条避税通道；<br>　· <b>啤酒、黄酒、成品油</b>：从量计征，押金<b>永远不影响消费税</b>，只有逾期影响增值税。<br>③ 押金是<b>含税价</b>，并入前先 ÷1.13。<br><br>为什么啤酒黄酒的押金对消费税「免疫」？回到 3-6：它们按吨/按升收税，价格这个变量压根不进公式。","sentence":"凡因这笔销售而收的钱都算价外费用；只有合规代垫运费和合规政府性基金能剔除。包装物押金记三行：一般逾期征、其他酒类收取即征、啤黄成品油永不影响消费税。","trap":"· <b>白酒品牌使用费必并入</b>（多选 6 的 B），这是明文规定，别当「无形资产使用费」放走。<br>· 红酒（葡萄酒）包装物押金属于「啤酒黄酒以外酒类」，<b>收取时并入</b>（多选 6 的 C）。<br>· 多选 20 问「无论是否单独作价，收取时并入增值税和消费税」：白酒、药酒选，<b>果啤、黄酒不选</b>——果啤按啤酒从量计征，押金只影响增值税。<br>· 单选 27：竹制雕花工艺筷子根本不是应税消费品，它的押金 2.5 万别往税基里加；木筷销售额 50 万里已含包装物 0.8 万，别重复加。答案是 50×5%=2.5 万。<br>· 价外费用默认<b>含增值税</b>，先 ÷1.13 再乘消费税率。","table":{"head":["押金类型","收取时","逾期/超1年"],"rows":[["一般应税消费品","增值税× 消费税×","增值税√ 消费税√"],["啤酒黄酒以外酒类","增值税√ 消费税√","不再征"],["啤酒、黄酒、成品油","增值税× 消费税×","增值税√ 消费税×"]]},"tips":["看到「品牌使用费」「返还利润」「集资费」直接归入价外费用，没有例外。","先判断商品是不是从量计征，是的话押金对消费税直接跳过。"],"qs":[27,6,7,20]},{"id":"3-8","name":"从量计征的两个坑：啤酒甲乙类与「数量」口径","star":"★★★","level":"L3","scene":"啤酒厂卖 10 吨鲜啤酒，专票上不含税价 29000 元，另收包装物押金 2000 元（其中塑料周转箱押金 500 元）。<br><br>问题来了：甲类 250 元/吨还是乙类 220 元/吨？差别就在「每吨出厂价 ≥3000 元」这条线——而这条线怎么算，藏着两个陷阱。","why":"为什么啤酒要按价格分甲乙两类、却又按吨收税？因为啤酒从量计征是历史选择（计量简单），但国家又想让贵一点的啤酒多承担一点，于是用「出厂价」把税<b>率档</b>切开，而不是改变计税方式。<br><br>判定线：<b>每吨出厂价（不含增值税）≥3000 元为甲类 250 元/吨，<3000 元为乙类 220 元/吨</b>。计算这个「出厂价」时要记住三条：<br>① <b>包装物押金要计入</b>，且是含税价，先 ÷1.13；<br>② <b>重复使用的塑料周转箱押金不计入</b>——它是可循环容器的押金，不是售价的一部分；<br>③ 用<b>不含税口径</b>。<br><br>所以轻二单选 26：鲜啤酒每吨 = [29000 + (2000-500)÷1.13] ÷ 10 = 3032.74 元 → <b>甲类</b>；果啤每吨 = [13800 + 750÷1.13] ÷ 5 = 2892.74 元 → <b>乙类</b>。最后 10×250 + 5×220 = 3600 元。这道题的四个选项就是把「押金全算」「押金全不算」「两类判反」分别做成了干扰项。<br><br>第二个坑是「销售数量」的四种口径，多选 8 考的就是这个：<br>· 销售 → <b>销售数量</b>；<br>· 自产自用 → <b>移送使用数量</b>（不是生产数量！选项 B 就错在这）；<br>· 委托加工 → <b>纳税人收回的数量</b>（不是发出加工的数量）；<br>· 进口 → <b>海关核定的征税数量</b>。<br><br>为什么自产自用按「移送」而不是「生产」？因为纳税义务发生在移送使用那一刻，生产出来还没用的部分并没有离开生产环节，不该提前计税。","sentence":"啤酒分档看每吨出厂价 3000 元：一般押金计入、塑料周转箱押金剔除、含税先 ÷1.13。数量口径：卖看销售、自用看移送、委外看收回、进口看海关核定。","trap":"· <b>啤酒屋自制啤酒一律按甲类 250 元/吨</b>，不看价格——因为现酿现卖没有可靠的出厂价，直接按最高档防避税。<br>· 黄酒 240 元/吨、成品油 1.2~1.52 元/升基本不用背，题目会给；但「成品油从量」这个方向必须判断对。<br>· 「自产自用按生产数量」是错的（多选 8 的 B）；「委托加工按委托加工数量」也是错的，要按<b>收回数量</b>。","table":{"head":["数量场景","计税数量口径"],"rows":[["销售","应税消费品销售数量"],["自产自用","移送使用数量"],["委托加工","纳税人收回的数量"],["进口","海关核定的进口征税数量"]]},"tips":["算啤酒分档时把「塑料周转箱押金」圈出来单独减掉，这是唯一要剔除的押金。","把「数量」和「价格」分开想：从量计征下价格只用来分档，不进税额公式。"],"qs":[26,8]},{"id":"3-9","name":"复合计征：白酒与卷烟的组价为什么长这样","star":"★★★","level":"L3","scene":"酒厂把 1 吨自酿白酒白送给客户，没有同类售价。成本 42000 元/吨，成本利润率 10%，白酒 20% + 0.5 元/500 克。你算出来的组价里，<b>为什么定额税要先加进分子、还要再除一次 (1-20%)</b>？","why":"因为消费税是<b>价内税</b>：价格里必须同时容下「从价那部分税」和「从量那部分税」。<br><br>设组成计税价格为 P。从价税 = P×20%，定额税 = 数量×0.5 元/500g（这部分是固定的，与 P 无关）。价内税的定义是：<b>P = 成本+利润 + 从价税 + 定额税</b>。<br><br>代入：P = 成本×(1+利润率) + P×20% + 定额税<br>⇒ P×(1-20%) = 成本×(1+利润率) + 定额税<br>⇒ <b>P = [成本×(1+利润率) + 数量×定额税率] ÷ (1-比例税率)</b><br><br>这就是答案册那张「三个环节组价公式表」的由来，不用背，推一次就够。轻二单选 8：<br>组价 = [42000×1.1 + 1×2000×0.5] ÷ (1-20%) = (46200+1000)÷0.8 = 59000 元；<br>应纳 = 59000×20% + 2000×0.5 = 11800+1000 = <b>12800 元</b>。<br><br>关键换算：<b>1 吨 = 1000 公斤 = 2000 斤 = 2000 个「500 克」</b>，所以定额税是 1000 元。这一步错，整题就错。<br><br>子题 9 把条件改成「有同类售价 60000 元/吨」，答案立刻变成 60000×20% + 1000 = <b>13000 元</b>。母子题放一起，考的是一条优先级：<b>同类售价优先，组价只是没有同类价时的兜底</b>。为什么？同类售价是真实市场信号，用它最不容易被操纵；组价里的成本利润率是税务机关核的，只是近似值。","sentence":"复合组价 = [成本×(1+利润率) + 数量×定额税率] ÷ (1-比例税率)；应纳税额 = 组价×比例税率 + 数量×定额税率。有同类售价就别组价。","trap":"· 1 吨 = 2000 个 500 克，白酒定额税 1000 元/吨；卷烟 1 标准箱 = 250 条 = 50000 支，生产环节定额 150 元/箱、批发环节 250 元/箱。这三组换算必须条件反射。<br>· 卷烟分甲乙类看<b>每标准条调拨价 70 元</b>：≥70 为甲类 56%，<70 为乙类 36%。但单选 17 用的是<b>核定计税价格</b> 61.41 元（=89×(1-31%)），比实际出厂价 58 元高，按孰高取 61.41 → 乙类 36%。<br>· 组价公式里的定额税<b>不除 (1-税率) 再加</b>——它是分子的一部分，要一起除。分开算是常见错法。","table":{"head":["环节","从价组价","复合组价"],"rows":[["生产(自产自用)","成本×(1+利润率)÷(1-率)","[成本×(1+利润率)+数量×定额]÷(1-率)"],["委托加工","(材料成本+加工费)÷(1-率)","(材料成本+加工费+数量×定额)÷(1-率)"],["进口","(关税完税价+关税)÷(1-率)","(关税完税价+关税+数量×定额)÷(1-率)"]]},"tips":["三行公式只有分子第一项不同：成本利润 / 材料加工费 / 关税完税价+关税。分母永远是 (1-比例税率)。","母子题连着做：差别只在「有没有同类售价」，先找这句话。"],"qs":[8,9]},{"id":"3-10","name":"计税依据被抬高的四种情形：门市部、换投抵、最低计税价","star":"★★★","level":"L3","scene":"四种「明明没按实价卖」的场景：① 电池厂把货移给自家非独立核算门市部，内部按成本 78 万记账，门市部对外卖 89.73 万；② 化妆品厂拿 100 箱香水精去换别人的香水精；③ 卷烟厂实际出厂 58 元/条，税务局按批发价倒推核定 61.41 元/条；④ 白酒厂把酒低价卖给关联销售公司。<br><br>这四种，国家都<b>不认你报的价</b>。","why":"共同逻辑只有一个：<b>消费税是价内税、又只在第一个环节收一刀，价格一旦被压低，这一刀就永远收不回来了</b>。增值税压低价格还有下游环节的销项能补回来（链条闭环），消费税没有下游，所以必须把税基守住。<br><br>四种守法的力度不一样，正好排成一条阶梯：<br><br>· <b>自设非独立核算门市部</b> → 按<b>门市部对外实际销售额</b>计税，不认内部调拨价/成本价（单选 5：89.73÷1.13×4%=3.18 万）。因为门市部不是独立法人，内部移送根本不是销售，真实交易只有对外那一笔。<br>· <b>「换、投、抵」</b>（换取生产资料/消费资料、投资入股、抵偿债务）→ 按同类应税消费品的<b>最高销售价格</b>计税（单选 6：5.1 万×100 箱，而不是 5 万）。为什么用最高价？这类交易没有货币对价，企业最容易「作价偏低」把货送出去，所以直接取上限。<b>对比记：增值税在同样场景用平均价</b>——因为增值税链不断，用平均价就够了。<br>· <b>卷烟最低计税价格</b> → 国家税务总局按「批发环节售价 ×(1-批发毛利率)」倒推核定，再与实际售价<b>孰高</b>取值（单选 17）。用批发价倒推，是因为批发端价格公开、难以和关联方串通。<br>· <b>白酒最低计税价格</b> → 当生产企业计税价 < 销售单位对外售价的 <b>70%</b> 时触发核定，核定比例为 <b>60%</b>，同样孰高。<br><br>看清了：<b>没有货币对价 → 取最高价；有货币但可能关联压价 → 倒推核定、孰高</b>。都是同一条防线。","sentence":"价内税只收一刀，所以税基不能让你自己定：门市部按对外实价、换投抵按最高价、卷烟按批发价倒推孰高、白酒低于 70% 触发核定。","trap":"· 「换投抵」<b>不包括无偿赠送</b>——多选 9 的 C「用于无偿赠送」是错的，赠送按同类加权平均价（无同类才组价），不是最高价。三种情形记死：换、投、抵。<br>· 单选 6 里有 5 万和 5.1 万两批货，换取生产资料要按<b>最高价 5.1 万</b>，别顺手拿 5 万算。<br>· 卷烟孰高后还要重新判甲乙类：单选 17 核定 61.41 元/条 <70 元 → <b>乙类 36%</b>，不是甲类。核定价格既影响计税依据，也影响税率档次。<br>· 非独立核算门市部移送<b>60% 外销</b>这类比例是干扰项——按门市部实际对外销售额算，不是按移送比例折算。","table":{"head":["情形","计税依据","防的是什么"],"rows":[["自设非独立核算门市部","门市部对外实际销售额/数量","内部调拨价压低"],["换取资料/投资入股/抵债","同类最高销售价格","无货币对价、作价偏低"],["卷烟最低计税价","批发价×(1-毛利率)，与实际价孰高","关联低价出厂"],["白酒最低计税价","低于外售 70% 触发，按 60% 核定","设销售公司转移利润"]]},"tips":["把增值税的「平均价」和消费税的「最高价」并排抄一次，这是跨章节的高频对照题。","题目出现「核定」「孰高」先判甲乙类，再算税，顺序反了会全错。"],"qs":[5,6,17,9]},{"id":"3-11","name":"自产自用：连续生产不缴，其他用途移送就缴","star":"★★★","level":"L3","scene":"化妆品厂生产了 5 吨高档香水精：1 吨对外卖、1 吨继续生产高档香水、1 吨继续生产普通护肤品、1 吨送客户、1 吨留在仓库。<br><br>五吨里只有三吨要缴消费税。哪三吨？","why":"先记住消费税只收「一刀」。如果自产的应税消费品拿去<b>连续生产另一件应税消费品</b>，那这一刀留到最终产品卖出去时再收——中间移送只是生产工序，提前收就变成两刀了（卷烟厂自产烟丝做卷烟就是典型）。<br><br>但只要货<b>离开「应税消费品生产线」</b>，去到任何别的地方，这一刀就必须在移送当天落下，否则以后再也没机会收：<br>· 用于生产<b>非应税消费品</b>（香水精做普通护肤品、白酒做酒心巧克力）；<br>· 在建工程、管理部门、非生产机构、提供劳务；<br>· 馈赠、赞助、集资、广告、样品、职工福利、奖励。<br><br>为什么「馈赠、样品、职工福利」也要缴？因为东西被消费掉了、不会再产生下一笔销售，如果不视同销售，企业只要把产品全发给自己人就能免税。<br><br>轻二单选 18：卖掉的 1 吨 + 做普通护肤品的 1 吨 + 送客户的 1 吨 = 3 吨计税；继续做高档香水的 1 吨（连续生产应税品）不缴；留库待售的 1 吨还没移送不缴。有同类售价 1500 万元/吨（含增值税），所以 1500÷1.13×3×15% = 597.35 万。<br><br>这里还藏着一个和增值税的巨大差异，多选 21、25、26 都在考：<br>· <b>连续生产应税消费品</b>：增值税不缴、消费税不缴（都没离开企业）；<br>· <b>连续生产非应税消费品 / 管理部门用 / 在建工程</b>：消费税<b>缴</b>，增值税<b>不缴</b>（增值税只对「有偿转让」和「视同销售货物」征，自用不视同销售）；<br>· <b>馈赠、职工福利、奖励、样品</b>：两税<b>都缴</b>（都构成视同销售）；<br>· <b>换、投、抵</b>：两税都缴，但消费税按最高价、增值税按平均价。","sentence":"连续生产应税消费品 → 不缴；只要离开这条线（非应税品、工程、管理、送礼、福利、样品、奖励）→ 移送当天缴。留库未移送不缴。","trap":"· 多选 21 的 B「卷烟厂自产烟丝用于生产卷烟」和 G「酒厂自产葡萄酒勾兑红酒」都是<b>连续生产应税消费品 → 不缴</b>，不选；其余 A/C/D/E/F/H 全选。<br>· 单选 23 的 A「经销样品无须缴纳消费税」是<b>错</b>的，样品要缴。<br>· 多选 25 的 E「葡萄酒用于生产酒心巧克力」只缴消费税不缴增值税；H「素板用于生产实木指接地板」两税都不缴——这是「两税同缴」题最阴的两个选项。<br>· 单选 18 里「成本 1100 万/吨、成本利润率 5%」是干扰项：<b>有同类售价就优先用同类价</b>，别去组价。","table":{"head":["自产应税消费品用途","增值税","消费税"],"rows":[["连续生产应税消费品","×","×"],["连续生产非应税消费品","×","√"],["在建工程/管理部门/非生产机构","×","√"],["馈赠/赞助/集资/广告/样品/福利/奖励","√","√"],["换取资料、投资入股、抵偿债务","√ 平均价","√ 最高价"]]},"tips":["判断顺序：先看「是不是连续生产应税品」，不是就基本要缴消费税；再单独判断增值税有没有「视同销售」。","两税对照表是本章最容易丢分的地方，建议抄在纸上做三遍。"],"qs":[18,23,21]},{"id":"3-12","name":"委托加工：谁提供原料，决定整道题的走向","star":"★★★","level":"L3","scene":"甲把烟叶交给乙加工成烟丝，付加工费 3 万。另一种情形：乙先自己买料、做完卖给甲，或者乙以自己的名义进料、甲只付加工费。<br><br>前者叫<b>委托加工</b>（甲是纳税人、乙代收代缴）；后两种税法直接判成<b>乙自产自销</b>，整个计税逻辑全变。","why":"为什么「谁出原料」这么要紧？因为消费税要锁住的是<b>这件商品第一次进入流通时的增值</b>。如果原料是委托方的，说明商品的所有权从头到尾没转移过，受托方只是提供了劳务，那真正「生产」这件消费品的是委托方，理应由委托方纳税。<br><br>可委托方分散在各地、税务机关管不过来，于是立法用了一招<b>源泉控制</b>：让受托方在<b>交货时</b>替国家把税扣下来（代收代缴）。受托方是企业就必须代收；受托方是<b>个人（含个体工商户）</b>则不得代收，由委托方收回后自行申报。<br><br>反过来，只要原料是受托方提供的（或先卖料再加工、或以委托方名义购料），就说明受托方在做自己的生意，按<b>销售自制应税消费品</b>处理——它有同类售价就按同类售价，没有才组价。轻二多选 24 就是这条：甲实木地板厂提供素板、乙付加工费，所以<b>甲是纳税人</b>，按甲同类含税售价 65÷1.13×5%=2.88 万，答案是 AD。<br><br>组价公式（无同类售价时）：<b>(材料成本 + 加工费) ÷ (1-消费税比例税率)</b>。两个词要抠准：<br>· <b>材料成本</b>是委托方提供原料的实际成本，<b>包括把原料运到受托方的运费</b>，但不包括可抵扣的增值税进项；<br>· <b>加工费</b>含代垫辅料成本，不含随加工费收的增值税；<br>· <b>把成品运回委托方的运费不计入</b>——货已经做完了，这是下一笔流通费用。<br><br>轻二单选 28 把这三样全塞进来了：烟叶买价 100 + 价外补贴 8（按收购价款 10% 计）+ 烟叶税 22 = 130 万，再×(1-9%) 剥掉可抵扣进项 = 118.3 万，加购料运费 1 万得 119.3 万；加工费 3 万；组价 (119.3+3)÷(1-30%)=174.71 万；代收代缴 174.71×30% = <b>52.41 万</b>。运回的 2 万运费是干扰项。","sentence":"委托方出原料 → 真委托：委托方纳税、受托方交货时代收代缴（个人受托除外）；组价 =(材料成本+加工费)÷(1-率)，购料运费进成本、运回运费不进。受托方出料 → 按自产自销。","trap":"· 三种「假委托」：① 受托方提供原料；② 受托方先卖料给委托方再加工；③ 受托方以委托方名义购料。全按受托方<b>销售自制应税消费品</b>（单选 10 答案 C 是唯一真委托）。<br>· 受托方没代收代缴：<b>对受托方罚应代收税款 50% 以上 3 倍以下</b>（不是 5 倍，多选 22 的 A 错在这）；<b>税款由委托方补缴</b>，不是受托方（D 也错）。已直接销售的按销售额补，未销售/不能直接销售的按组价补（BC 对）。<br>· 委托加工收回后<b>加价出售</b>要再申报消费税，但准予扣除受托方已代收代缴的税额（无税目范围限制）；不加价出售不再缴。<br>· 组价里「材料成本」的运费方向：<b>去程算、回程不算</b>。","table":{"head":["判断点","规则"],"rows":[["真委托的界定","委托方提供原料及主要材料，受托方只收加工费+代垫辅料"],["纳税人","委托方"],["代收代缴人","受托方（企业）；受托方是个人/个体户则委托方自缴"],["计税顺序","受托方同类售价 → 无则组价"],["组价","(材料成本 + 加工费) ÷ (1 - 比例税率)"],["未代收代缴","罚受托方 50%~3 倍；委托方按销售额或组价补税"]]},"tips":["每道委托加工题先只做一件事：圈出「谁提供的原料」。这一步定生死。","组价里出现烟叶时，记得「收购价款 + 10% 价外补贴 + 20% 烟叶税」，再 ×(1-9%) 剥进项。"],"qs":[10,28,22,24]},{"id":"3-13","name":"进口环节：组价为什么要先把关税加进去","star":"★★★","level":"L3","scene":"卷烟厂进口一批烟丝，成交价 292 万，另外自己承担了运抵我国口岸前的运费和保险费 8 万。关税 10%、消费税 30%。<br><br>为什么答案第一步是 (292+8)×(1+10%) = 330 万，而不是直接拿 292 万算？","why":"因为消费税是<b>价内税</b>，进口这批货在国内第一次进入流通时的「完整价格」应该包含三块：货价 + 运保费 + 关税。关税是进口环节交给国家的成本，它已经固化在货物价值里，将来在国内卖的时候也会体现在售价中，所以必须成为消费税的税基。<br><br>再往上推一步：既然消费税本身也是价内税，价格里还得留出消费税的位置。设组价为 P，则 P = (关税完税价格 + 关税) + P×消费税率，整理得 <b>P = (关税完税价 + 关税) ÷ (1 - 消费税率)</b>。<br><br>轻二单选 11：关税完税价 = 292+8 = 300 万（<b>运抵输入地点起卸前的运费、保险费要计入</b>，这是关税完税价格的定义）；关税 = 300×10% = 30 万；组价 = (300+30)÷(1-30%) = 471.43 万；消费税 = 471.43×30% = <b>141.43 万</b>。选项 128.57 就是忘了加 8 万运费，125.14 是没做价内税还原。<br><br>三种形态并列记：<br>· 从价：组价 =(关税完税价+关税)÷(1-率)<br>· 从量：直接 进口数量×定额税率，<b>不组价</b><br>· 复合：组价 =(关税完税价+关税+进口数量×定额税率)÷(1-率)，税额 = 组价×率 + 数量×定额<br><br>还有个征管要点：进口消费税由<b>报关地海关代征</b>，纳税义务发生时间是<b>报关进口当天</b>，自海关填发专用缴款书之日起 <b>15 日内</b>缴纳（单选 15 答案 C）。进口环节除国务院另有规定外<b>一律不得减免</b>——因为进口货没在国内的生产环节被课过税，这一刀是唯一机会。","sentence":"进口组价 =(关税完税价 + 关税 [+ 数量×定额]) ÷ (1-消费税率)，完税价含运抵口岸前的运保费。报关地海关代征、报关当天发生义务、缴款书起 15 日内缴。","trap":"· 运抵我国<b>输入地点起卸前</b>的运费、保险费要计入完税价；起卸后的境内运费不计。<br>· 进口环节消费税<b>不分一般/小规模</b>，一律按法定税率（和增值税组成计税价格那套不同，别串）。<br>· 进口金银首饰<b>不缴消费税</b>（它的环节只有零售），但缴增值税和关税。<br>· 进口已税消费品在国内直接销售一般不再缴消费税，但卷烟、电子烟、超豪华小汽车要在批发/零售环节二次计税。","table":{"head":["计征方式","组成计税价格","应纳税额"],"rows":[["从价","(完税价+关税)÷(1-率)","组价×率"],["从量","不组价","进口数量×定额税率"],["复合","(完税价+关税+数量×定额)÷(1-率)","组价×率 + 数量×定额"]]},"tips":["进口组价是三个环节里最简单的：分子只有「完税价+关税」，别把加工费、成本利润串进来。","把 3-9 的三行组价表和这里对着看，分子换了、分母没换。"],"qs":[11,15]},{"id":"3-14","name":"已纳消费税扣除：同一税目 + 生产领用","star":"★★★","level":"L3","scene":"化妆品厂外购已税高档香水精，用来连续生产自家高档化妆品；另一家珠宝厂外购已税珠宝玉石，做成金银镶嵌戒指。<br><br>前者可以扣掉上家已缴的消费税，后者<b>一分都不让扣</b>。为什么？","why":"消费税本来只收一刀。如果外购的应税消费品被<b>当作原料，继续加工成同一税目的应税消费品</b>，那上家出厂时已经收过一刀，成品出厂又要收一刀——两刀了。为了避免重复，允许按<b>当期生产领用数量</b>扣掉上家已纳的税。<br><br>三个条件缺一不可：<br>① <b>同一税目内连续生产</b>（烟丝→卷烟、已税高档化妆品→高档化妆品、已税实木地板→实木地板、已税汽油→成品油）。跨税目不行：外购已税珍珠做珍珠项链可以，外购已税珠宝玉石做<b>金银镶嵌首饰</b>不行——因为后者改在零售环节按 5% 征，环节和税目都变了，没有「已纳税」可对应。<br>② <b>按生产领用数量扣</b>，不是按购进数量。购进还没用的部分仍躺在仓库里，扣了就等于提前免税。<br>③ <b>仅在生产环节扣</b>。零售环节征税的金银铂钻一律不得扣除。<br><br>为什么有一张「十大不可扣」清单（酒类（葡萄酒除外）、小汽车、游艇、高档手表、雪茄烟、电子烟、金银铂钻、电池、摩托车、溶剂油、涂料）？因为这些品类要么<b>不是靠连续加工增值的</b>（小汽车、游艇、手表买来基本直接卖），要么<b>政策本来就想让它多缴几道</b>（酒、烟）。记法：<b>可扣的基本都是「原料→同类成品」的加工链</b>。<br><br>还有两个特殊点：<br>· <b>葡萄酒</b>：从葡萄酒生产企业<b>购进或进口</b>可以扣，<b>委托加工收回的不行</b>——口诀「外购含葡可抵扣，委托无葡要牢记」（多选 11 的 D 错在这）。且本期不足抵扣的余额<b>留待下期</b>（多选 12 的 A 对、B 错）。<br>· <b>外购白酒生产白酒一律不得扣</b>，不管高度低度（多选 12 的 C 对、D 错）。<br><br>计算两条线：外购按<b>买价</b>算（期初库存买价 + 当期购进 - 期末库存买价，再×税率）；委托加工收回按<b>税款</b>算（期初税款 + 当期收回税款 - 期末税款）。单选 19：进口高档香水精组价 = 30×(1+20%)÷(1-15%)，×15% = 已纳税额，再乘领用 90% 得 5.72 万；应纳 = 400×15% - 5.72 = <b>54.28 万</b>。","sentence":"可扣 = 同一税目 + 连续生产 + 按当期生产领用数量，且只在生产环节。外购按买价算、委外按已纳税款算；葡萄酒只认购进和进口，白酒一律不扣。","trap":"· 单选 12：纯金/铂金/纯银镶嵌首饰（ABC）都<b>不得扣</b>外购珠宝玉石已纳税款，只有 D 珍珠项链（仍属「贵重首饰及珠宝玉石」税目、在生产环节征）可以扣。<br>· 多选 11 答案 BCH：委托加工收回的已税汽油→成品油、已税高档化妆品→高档化妆品、外购已税杆头→高尔夫球杆可扣；A（金银镶嵌）、D（委托加工葡萄酒）、E（白酒）、F（摩托车）、G（溶剂油）都不可扣。<br>· 单选 23 的 D「外购珍珠已纳税款可以扣除」是<b>错</b>的——不能跨税目抵（高档化妆品 ≠ 珠宝玉石）。<br>· 商贸企业外购后<b>直接转售</b>不得扣除，必须是工业企业连续生产。","table":{"head":["可扣","不可扣"],"rows":[["烟丝→卷烟","酒类（葡萄酒除外）：白酒、黄酒等"],["高档化妆品→高档化妆品","小汽车、游艇、高档手表、摩托车"],["珠宝玉石→贵重首饰(非金银镶嵌)","金银铂钻（零售环节）"],["鞭炮焰火、高尔夫球杆、木筷、实木地板","雪茄烟、电子烟、电池、涂料、溶剂油"],["成品油同类、购进/进口葡萄酒","委托加工收回的葡萄酒"]]},"tips":["先问「是不是同一税目」，再问「是不是生产领用」，两步就能排掉大半选项。","葡萄酒的「外购/进口可扣、委托加工不可扣」是每年都要考一次的分界线。"],"qs":[12,19,11,12]},{"id":"3-15","name":"金银铂钻零售环节：五条专属规则","star":"★★★","level":"L3","scene":"珠宝店一天做了三笔：直接零售金首饰 800 克；以旧换新收了 300 克的差价；还卖了一批镀金首饰。柜台里还有带料加工的、连同包装物一起卖的、和别的产品组成套装的。<br><br>这几笔<b>算法各不相同</b>。","why":"因为金银铂钻把整道消费税挪到了零售环节（见 3-5），所以它的计税依据必须重新定一套——生产环节那套「出厂价」在金店里根本不存在。<br><br>五条专属规则，每条都有理由：<br>① <b>以旧换新按实际收取的不含税全部价款</b>计税。理由：旧首饰是顾客拿来抵价的，金店实际只收到差价，那才是这次交易的真实对价（其他商品以旧换新一般按新货全额计税，金银是特例）。<br>② <b>连同包装物销售，无论是否单独计价都并入销售额</b>。防止把价款拆到包装盒上。<br>③ <b>成套销售按销售额全额征收</b>，不拆分。理由同 3-6 的「成套从高」。<br>④ <b>带料加工</b>：先按受托方同类金银首饰售价，没有才组价 =(材料成本+加工费)÷(1-5%)。<br>⑤ <b>未分别核算</b>：生产环节从高按 10%，零售环节统一按金银首饰 5%。<br><br>轻二单选 25：直接零售 800×1180÷1.13×5% + 以旧换新 300×390÷1.13×5% = <b>46946.90 元</b>；镀金首饰不在零售环节征，15000 元不计。答案 A。选项 D 就是把以旧换新按「新首饰全额」算出来的。<br><br>还有个必须分清的界限：<b>金银铂钻</b> = 金基/银基合金首饰及其镶嵌首饰、铂金首饰、钻石及钻石饰品，<b>零售环节 5%</b>；<b>镀金(银)、包金(银)首饰及其镶嵌首饰、翡翠、珍珠、玛瑙</b>属于「其他贵重首饰及珠宝玉石」，<b>生产/进口环节 10%</b>。多选 23 的 B 镀金首饰、F 翡翠手镯不选，就是这个原因。","sentence":"金银铂钻只在零售按 5%：以旧换新按实收差价、包装物并入、成套按全额、带料加工先同类价后组价、未分别核算零售统一 5%。镀金包金和翡翠珍珠在生产环节 10%。","trap":"· 多选 10 的 B「包装物单独计价无须并入」是<b>错</b>的；C「带料加工按组价」也错，<b>同类售价优先</b>。答案 AD。<br>· 单选 25 里「镀金首饰零售收入 15000」是干扰，镀金首饰在零售环节不缴消费税。<br>· 出国人员免税商店销售金银首饰<b>照征</b>（多选 2 的 C）。<br>· 金银镶嵌首饰在计税时<b>一律不得扣除</b>外购或委托加工收回珠宝玉石的已纳税款（单选 12、多选 11 的 A）。","table":{"head":["情形","计税依据"],"rows":[["一般零售","不含增值税销售额 × 5%"],["以旧换新/翻新改制","实际收取的不含税全部价款（差价）"],["连同包装物","包装物价款并入销售额"],["成套销售","销售额全额"],["带料加工","受托方同类售价 → 无则组价"],["镀金/包金/翡翠/珍珠","不在零售环节；生产/进口 10%"]]},"tips":["看到「以旧换新」先确认是不是金银：金银按实收差价，其他商品按新货全额。","把「金银铂钻 5% 零售」和「其他贵重首饰 10% 生产」写在同一行对照，多选题靠它秒判。"],"qs":[25,10]},{"id":"3-16","name":"卷烟批发与电子烟：谁有资格当纳税人","star":"★★★","level":"L3","scene":"甲卷烟批发企业卖给<b>零售单位</b> 30 箱 168 万，卖给<b>另一家批发企业</b> 10 箱 48 万。电子烟厂甲持有「云雾」商标，同时替别人代加工「云彩」牌。<br><br>两道题考的是同一件事：<b>这一道加征的税，到底该落在谁头上</b>。","why":"先说卷烟批发。加征批发环节的税，是为了在卷烟离开批发体系、流向消费者之前再压一道。因此：<br>· 卖给<b>零售单位/非批发单位</b> → 缴；<br>· <b>批发企业之间</b>互卖 → 不缴（货还在批发圈里，没到终点，提前收会在后续批发环节重复）。<br>轻二单选 24：168÷1.13×11% + 30×250÷10000 = <b>17.10 万</b>；48 万那笔不算。选项 B 就是把两笔都算进去。<br><br>税率是复合：<b>11% + 250 元/标准箱</b>（=1 元/条 = 0.005 元/支）。注意<b>批发环节不得扣除生产环节已纳消费税</b>——这两道税本来就是政策故意叠的，允许扣就白加了。<br><br>再说电子烟。它的规则核心是<b>「持有商标者纳税」</b>：生产环节纳税人是取得烟草专卖生产企业许可证并<b>持有电子烟商标</b>的企业；只做代加工、不持商标的企业<b>不是纳税人</b>，由持有商标的委托方申报。为什么？因为品牌方才是定价、获利的主体，代工厂只是收加工费，向代工厂征税既不好算也容易被转移。<br><br>由此推出「分开核算」的硬要求：一家企业既做自有品牌又做代加工，<b>必须分开核算</b>两类销售额；<b>未分开核算的，一并缴纳消费税</b>。轻二母题 20 分开核算 → 只对「云雾」90 万×36% = 32.4 万（答案 C）；子题 21 未分开 → (90+35)×36% = 45 万（答案 D）。母子题并排，就是让你记住「分开」这个动作值 12.6 万。<br><br>电子烟的其他边界：从价定率（<b>不是复合</b>，多选 14 的 A 错）；生产/进口 36%、批发 11%；征税对象含烟弹、烟具及组合产品；代销按经销商卖给批发企业的销售额计税。","sentence":"卷烟批发：只卖给零售商的那部分缴，11%+250 元/箱，不得扣生产环节已纳税。电子烟：持商标者纳税，代加工不是纳税人；自有品牌与代加工必须分开核算，否则一并缴；从价 36%/11%。","trap":"· 多选 13：批发企业之间销售卷烟不缴（B 错）；总分机构不在同一地区由<b>总机构</b>申报（D 错）；兼营批发零售未分开核算的<b>全部视同批发</b>征税（C 对）。答案 AC。<br>· 多选 14 的 D「代加工企业申报缴纳」是错的，由持商标企业申报；答案 BC。<br>· 批发环节卷烟不分甲乙类，一律 11% + 250 元/箱——别把生产环节的 56%/36% 带过来。<br>· 多选 17 问批发环节征税的只有卷烟和电子烟，<b>烟丝、雪茄烟不选</b>。","table":{"head":["","卷烟批发","电子烟"],"rows":[["环节","生产/进口 + 批发加征","生产(进口) 36% + 批发 11%"],["计征方式","复合 11% + 250 元/箱","从价定率（非复合）"],["纳税人","从事卷烟批发的单位/个人","持商标的企业；代加工方不是"],["特殊排除","批发企业之间销售不缴","自有品牌与代加工应分开核算"]]},"tips":["卷烟批发题先圈出买方身份：零售商=缴，批发商=不缴。","电子烟母子题的差别只有「分开核算」四个字，做题时先找这句话。"],"qs":[20,21,24,13,14]},{"id":"3-17","name":"超豪华小汽车：90 万这条线（课件旧数字要小心）","star":"★★","level":"L2","scene":"4S 店零售一辆不含税价 100 万的纯电动小汽车；另一辆 85 万的中轻型商用客车；还有一辆二手超豪华车。<br><br>哪些要在零售环节加征 10%？","why":"超豪华小汽车的零售加征，逻辑和卷烟批发一样：<b>生产环节按排量征税只看车，看不到「这笔消费有多奢侈」</b>，只有最终成交价能体现。所以国家在零售端再按成交价抽 10%。<br><br>门槛是<b>每辆零售价格 ≥90 万元（不含增值税）</b>的各种动力类型乘用车和中轻型商用客车。<br><br><b>⚠ 这里有个必须提醒的坑</b>：ima 课件第 03 讲考点二写的是「售价 ≥130 万元」，那是 2016 年政策刚出台时的旧标准；<b>2025 年新政已下调到 90 万元</b>，同一份课件后面的考点四、以及轻二 2026 版答案册用的都是 90 万。按旧资料复习会直接做错单选 4 和多选 23。做数字题一律以教材和当年政策为准。<br><br>按动力类型分两种：<br>· <b>有气缸容量</b>（燃油、混动）：生产/进口环节按现行税率征 + 零售环节加征 10%，<b>双环节</b>；生产企业直接卖给消费者时两档税率叠加。<br>· <b>无气缸容量</b>（纯电动、燃料电池）：<b>仅在零售环节</b>征一道 10%，生产/进口环节不征。理由是排量税本来就没法对无排量车课。<br><br>零售环节销售额<b>包含以精品、配饰、服务等名义收取的价款</b>（2026 新规，单选 7 的 D 就错在这）；<b>二手超豪华小汽车不征</b>（第一手已课过）。","sentence":"不含税零售价 ≥90 万 → 零售加征 10%；有排量的双环节、纯电/燃料电池只在零售征；服务费精品费并入销售额；二手车不征。","trap":"· 课件里的「130 万」是旧标准，<b>现行是 90 万</b>。这是本章最值得单独记的一个政策更新。<br>· 轻二单选 7 答案 C：A「85 万中轻型商用客车属于征收范围」错在没到 90 万；B「燃料电池超豪华车进口+零售都征」错在只在零售征；D「服务费不计入」错在新规明确要计入。C「二手超豪华不征」正确。<br>· 单选 4 答案 B：4S 店零售 100 万纯电动车要征；A 雪茄烟批发不征；C 8000 元手表不到门槛；D 进口金银饰品不征。<br>· 多选 23 里纯电动超豪华小汽车（C）和燃油超豪华小汽车（H）都要选。","table":{"head":["车型","生产/进口环节","零售环节"],"rows":[["有排量、≥90 万","按现行税率征","加征 10%"],["纯电/燃料电池、≥90 万","不征","仅此一道 10%"],["<90 万","按现行税率征（普通小汽车）","不加征"],["二手超豪华","—","不征"]]},"tips":["90 万统一按「不含增值税」口径，题目给含税价先 ÷1.13。","把「只在零售征」的两类放一起记：金银铂钻、纯电/燃料电池超豪华车。"],"qs":[4,7]},{"id":"3-18","name":"出口退（免）税：只看主体，不看商品","star":"★★★","level":"L3","scene":"四种出口：① 外贸企业买了一批木制一次性筷子直接出口；② 酒厂出口自产红酒；③ 高尔夫球具厂委托外贸企业代理出口自产球杆；④ 商业批发企业委托外贸企业代理出口涂料。<br><br>四种商品都是应税消费品，四种待遇完全不同。","why":"消费税只收一刀，而且是在<b>生产环节</b>收。所以出口时能不能退税，取决于一个朴素的问题：<b>这批货在国内到底缴过消费税没有</b>。<br><br>· <b>外贸企业购进后直接出口</b>：它从生产企业买货时，价格里<b>已经含了那一道消费税</b>（是它真金白银付出去的）。货要裸价出海参与竞争，就该把这笔已纳税退回去 → <b>免税并退税</b>。<br>· <b>生产企业自营出口 / 委托外贸代理出口自产货</b>：货是它自己生产的，出口时生产环节直接免征，<b>压根没缴过</b> → 无税可退，只能 <b>免税但不退税</b>。<br>· <b>一般商贸企业（既非生产企业也非外贸企业）委托代理出口</b>：不具备出口退税资格 → <b>不免税也不退税</b>，出口时照缴。<br><br>所以判断顺序是：<b>先看出口主体是谁，再看它有没有「买进来」</b>。口诀：<b>外贸购进出「免退」，生产自营出「免不退」，商贸出口「不免不退」</b>。<br><br>「外贸企业受其他外贸企业委托代理出口」属于第一类（免税并退税），因为委托方本身是外贸企业、货是购进的，已纳税款确实存在。<br><br>轻二单选 13 答案 C（外贸企业购进木筷直接出口 → 免税并退税）；A 酒厂自产出口、B 生产企业委托代理出口都是免税不退税；D 商业批发企业委托代理出口是不免税也不退税。","sentence":"外贸购进（含受其他外贸企业委托代理）→ 免税并退税；生产企业自营或委托出口自产 → 免税不退税；一般商贸企业委托出口 → 不免税也不退税。","trap":"· 多选 15 问「免税不退税」：C 高档化妆品生产企业自营出口、D 实木地板生产企业委托外贸出口自产，选；A 外贸企业购进电子烟直接出口、B 外贸企业受其他外贸企业委托代理出口都是免税并退税，不选。<br>· 多选 16 答案 CD：A「外贸企业购进直接出口不予退还」错（可退）；B「生产企业自营出口可办理退还」错（没缴过）；C 生产企业委托代理出口自产不予退还、D 外贸企业受其他外贸企业委托代理出口可退，都对。<br>· 退税计税依据是<b>已征且未在内销应纳税额中抵扣过</b>的购进金额/数量，以消费税专用缴款书为准；从价按金额×率、从量按数量×定额、复合两者相加。<br>· 别和增值税的「免抵退/免退」串：消费税生产环节单一，没有「抵」这一层。","table":{"head":["出口主体 / 方式","政策","理由"],"rows":[["外贸企业购进直接出口","免税并退税","购进货价里已含消费税"],["外贸企业受其他外贸企业委托代理出口","免税并退税","同上"],["生产企业自营出口自产","免税不退税","生产环节直接免，没缴过"],["生产企业委托外贸代理出口自产","免税不退税","同上"],["一般商贸企业委托外贸代理出口","不免税也不退税","无出口退税资格"]]},"tips":["三句口诀抄下来，本章出口题基本不会错。","看到「生产企业」四个字先默认「免税不退税」，看到「外贸企业购进」先默认「免税并退税」。"],"qs":[13,15,16]},{"id":"3-19","name":"征收管理：义务发生时间、期限、地点三张表","star":"★★","level":"L2","scene":"四笔业务：分期收款合同约定本月收 50%（客户只付了 30%）；预收货款但货还没发；委托银行收款已发货并办妥托收；进口一批烟丝刚报关。<br><br>本月该缴哪几笔？","why":"消费税只有一个环节，<b>纳税义务发生时间就是那一刀落下的时刻</b>，定错了就整期错。核心原则是「<b>以结算方式决定的法定时点为准，不以实际收钱、开票为准</b>」——否则企业拖着不收钱就能无限递延。<br><br>· <b>赊销/分期收款</b>：<b>书面合同约定的收款日</b>当天；没约定或没书面合同才是发出当天。所以单选 22 里，合同约定 50% 就按 50% 的销售额算，<b>实际只收到 30% 不影响</b>；预收货款那笔因为没发货，本月不缴。<br>· <b>预收货款</b>：发出应税消费品当天。<br>· <b>托收承付 / 委托银行收款</b>：<b>发出并办妥托收手续</b>当天（两个条件同时满足，单选 16 答案 A）。<br>· <b>自产自用</b>：移送使用当天。<br>· <b>委托加工</b>：<b>纳税人提货当天</b>（消费税特有，多选 18 的 B「加工完成当天」错在这）。<br>· <b>进口</b>：报关进口当天。<br><br>纳税期限与增值税基本一致：1/3/5/10/15 日、1 个月或 1 个季度；月/季期满 15 日内申报，短期限满 5 日内预缴、次月 1 日起 15 日内结清；<b>进口自海关填发缴款书之日起 15 日内</b>（单选 15 答案 C，注意不是「次月 15 日」）。<br><br>纳税地点记「<b>跟着纳税人走，不跟货走</b>」：销售及自产自用 → 机构所在地/居住地；到外县销售或委托外县代销 → <b>仍回机构所在地</b>（单选 14 的 A 错）；进口 → <b>报关地海关</b>（B 错）；委托加工 → 一般由<b>受托方</b>机构所在地解缴（D 说成委托方缴纳也错）。答案 C。","sentence":"分期收款看合同约定日、预收看发货日、托收看「发货+办妥手续」、自用看移送、委外看提货、进口看报关。地点跟人不跟货，进口找报关地海关。","trap":"· 多选 18 答案 CDF：A 分期收款「发出当天」错；B 委托加工「加工完成」错（应提货当天）；E 投资入股「办股权证」错（应移送使用当天）；C 报关进口当天、D 预收货款发出当天、F 托收承付发货并办妥手续当天都对。<br>· 委托加工由受托方解缴，但<b>受托方是个人（含个体户）时</b>由委托方在自身机构所在地申报——两个例外叠一起最容易错。<br>· 卷烟批发企业总分机构不在同一地区的，<b>由总机构汇总申报</b>（不是分别申报）。","table":{"head":["情形","纳税义务发生时间","纳税地点"],"rows":[["分期收款/赊销","合同约定收款日；无约定则发出当天","机构所在地/居住地"],["预收货款","发出应税消费品当天","机构所在地/居住地"],["托收承付/委托收款","发出并办妥托收手续当天","机构所在地/居住地"],["自产自用","移送使用当天","机构所在地/居住地"],["委托加工","纳税人提货当天","受托方机构所在地（个人受托除外）"],["进口","报关进口当天","报关地海关"]]},"tips":["把「实际收钱」「开票」「发货」三个时点划掉，只认法定时点。","进口的 15 日从「海关填发缴款书之日」起算，不是期满、也不是次月。"],"qs":[14,16,22,18]},{"id":"3-20","name":"收尾：两税同缴判断表 + 2026 新增的成品油检测","star":"★★","level":"L2","scene":"八笔业务摆一排，问哪些<b>同时</b>缴增值税和消费税：进口轮胎、零售翡翠手镯、啤酒屋卖自产啤酒、卖自产中轻型商用客车、自产葡萄酒做酒心巧克力、自产卷烟抵债、自产涂料装修办公室、自产素板做实木指接地板。<br><br>这不是背规则，是走两道门。","why":"「两税同缴」是本章的综合题眼，因为它逼你把前三章的东西同时调用起来。判断顺序固定两步：<br><br><b>第一步：消费税的门</b>——是不是 15 类应税消费品？是不是处在它的征税环节？<br><b>第二步：增值税的门</b>——是不是发生了「有偿转让」或「视同销售货物」？<br><br>于是八笔业务可以分成四类（轻二多选 25 答案 CDF）：<br>· <b>只缴增值税</b>：进口轮胎（轮胎不是 15 类）、零售翡翠手镯（翡翠在生产/进口环节征，零售不是它的环节）；<br>· <b>只缴消费税</b>：自产葡萄酒做酒心巧克力（连续生产非应税消费品，见 3-11）；<br>· <b>两税都不缴</b>：自产素板做实木指接地板（连续生产应税消费品）；<br>· <b>两税都缴</b>：啤酒屋卖自产啤酒、卖自产中轻型商用客车、自产卷烟抵偿债务。<br><br>多选 26 同型：A 自产鞭炮发员工福利（两税都缴）、B 自产高档香水精做高档口红（连续生产应税品，都不缴）、C 外购葡萄酒对外投资（增值税缴、消费税不缴——外购不是自产）、D 自产实木地板装修职工食堂（消费税缴、增值税不缴）。答案 AD。<br><br>最后补一个 2026 新增考点（多选 27 全选）：<b>成品油涉税产品检测</b>。为什么会有这条？回到 3-4——成品油的边界靠「用途」和一堆化工品清单划，企业改个名字就能争议「我这不算成品油」。所以税务机关需要技术检测来定事实。可启动检测的情形有四类：纳税人对是否征税或适用税率有争议、举报线索反映风险、税务机关自行发现风险、新闻媒体曝光造成重大影响，外加兜底的「其他情形」。由税务机关牵头，可联合发改、财政、市场监管部门，也可请第三方检测机构协助；检测结果用于纳税评估、税务稽查和行政处罚的事实依据。","sentence":"两税同缴走两道门：先看「15 类 + 征税环节」，再看「有偿转让或视同销售」。进口轮胎/零售翡翠只缴增值税，自产做非应税品只缴消费税，连续生产应税品都不缴。","trap":"· 「零售翡翠手镯」不是「不缴消费税」这么简单——它在生产环节已经缴过，零售环节不重复缴，所以零售这笔只缴增值税。<br>· 自产用于<b>职工福利/馈赠</b>两税都缴；自产用于<b>管理部门/在建工程/连续生产非应税品</b>只缴消费税。这条分界在多选 25、26 里反复出现。<br>· 多选 27 四个选项全对（ABCD），别因为「新闻媒体曝光」看着不像法定情形就排除，它是明文列举的启动情形之一。","table":{"head":["业务类型","增值税","消费税"],"rows":[["非 15 类商品销售/进口","√","×"],["应税消费品在非征税环节销售","√","×"],["连续生产应税消费品","×","×"],["连续生产非应税品/在建工程/管理部门","×","√"],["馈赠/福利/奖励/样品/换投抵","√","√"],["生产环节正常对外销售","√","√"]]},"tips":["把这张表当作本章的结课检查表，任何一道「缴不缴」的题都往上套。","遇到「外购」二字先停一下：外购商品对外投资不涉及自产，消费税不缴。"],"qs":[25,26,27]}]}},{"id":"ch4","no":"4","name":"企业所得税法","score":"20","star":"★★★","tagline":"整章只做一件事：把会计利润，调成税法认的应纳税所得额","intro":{"hook":"企业所得税这一章看着有上百个数字，其实<b>只做一件事</b>：拿会计账上的利润，一项一项改成税法认的「应纳税所得额」，再乘税率。<br><br>为什么非要改？因为两套账的<b>目的不一样</b>。会计是给投资人看的，讲谨慎、配比、权责发生制、实质重于形式；税法是给国家收钱的，讲<b>确定、可核查、防避税、还要顺便引导产业方向</b>。目的一不同，口径必然分家：会计说这笔费用该摊，税法说你没有真金白银的凭据、不许扣；会计说这 60 万所得已经实现，税法说你只换回了股权、没拿到钱，分 5 年慢慢认。<br><br>所以别把这一章当法条背。每遇到一个规定，只问两句话：<b>「会计认了没有？」「税法凭什么认或不认？」</b>21 个知识块、102 道题，全都挂在这两问上。前面三章讲的是「税怎么落到交易上」，这一章讲的是「交易记进账以后，税务局怎么重新算一遍」。","exam":"近 5 年（2021-2025）：<b>每年必考一道综合题，且常作压轴</b>，可单独考企税，也与增值税、附加税费、房产税、城镇土地使用税、土地增值税、车船税、印花税联合命题；国际税收计算题也常涉及本章。平均分值约 <b>20 分</b>，是全书分值最高、难度最高的一章。客观题集中在收入确认、扣除限额、资产税务处理、税收优惠、企业重组五个方向。","passline":"本章 <b>102 题</b>（56 单选 + 46 多选，含 6 道 8 选项非标准题）。过关线：单选 ≥ 95%，多选 ≥ 85%。三个最容易翻车的地方：① <b>不征税收入 / 免税收入</b>搞反（对应费用能不能扣完全不同）；② 限额题的<b>基数</b>找错（业务招待费含视同销售、不含捐赠收入）；③ 企业重组的<b>一般 vs 特殊</b>写反（公允价值 / 原计税基础）。综合题要练「两条时间轴相减」的纳税调整思路，别靠感觉定调增调减。"},"blocks":[{"id":"4-1","name":"谁要交、按什么交：居民/非居民与四档税率","star":"★★★","level":"L3","scene":"一家公司赚了钱，国家凭什么向它收税？先看它跟中国有没有「身份关系」。<br><br>甲公司在深圳注册，老板在开曼开会——它是居民企业；乙公司在开曼注册，但董事会、财务、公章全在上海——它也是居民企业。丙公司在 A 国注册、也在 A 国管，只是偶尔卖给中国客户一台机器，或者在中国有个办事处——它是非居民企业。<br><br>单选题 1、2、3 就是让你在这三种身份里挑：谁全球所得都交、谁只交中国来源的那部分、谁按 10% 被代扣。","why":"为什么用「成立地 <b>或</b> 实际管理机构」两个标准？因为只看注册地太容易躲：在避税地挂个壳、实际经营全在国内，就可以不交税。所以税法把<b>实质控制地</b>也拉进来，满足其一就算居民，堵住这个口子。<br><br>为什么居民企业要就<b>全球所得</b>交税、非居民只就<b>境内所得</b>交？因为居民企业享受了这个国家完整的法律、市场、基础设施保护，税基就该是全部；非居民只是偶尔来赚一笔，只能就来源于境内的部分征，否则别国也不会认。<br><br>非居民再分两层，逻辑是一条链：<b>有没有境内机构场所 → 这笔所得跟它有没有实际联系</b>。有联系，说明本质是在中国常设经营，按 25% 正常征；没联系，说明只是被动收钱（股息、利息、租金、特许权使用费），没法核算成本，就按<b>收入全额 ×10%</b> 源泉扣缴，由付款方代扣。境外的所得，如果无实际联系，中国根本不征。<br><br>顺带记住一个反直觉点：<b>个体工商户、个人独资企业、合伙企业不是企业所得税纳税人</b>——它们没有独立法人资格，所得直接穿透到投资人交个税。所以题目里拿它们当「居民企业」的选项是必错项。","sentence":"两个标准满足其一即居民，居民全球所得 25%；非居民先看有无机构场所、再看有无实际联系——有联系 25%，没联系境内所得按 10% 全额源泉扣缴，境外无联系不征。","trap":"· 拿「个体工商户 / 合伙企业」当居民企业选 → 错，它们不适用企业所得税法；<br>· 「境内有机构场所」≠「所有境外所得都要交」，只有与该机构有<b>实际联系</b>的境外所得才交；<br>· 源泉扣缴的扣缴义务人是<b>支付人</b>（不是税务机关），税率 10%，不是 15%；<br>· 转让财产所得按<b>差额</b>（收入全额 - 财产净值）计征，股息利息租金特许权使用费按<b>全额</b>计征；<br>· 所得来源地口诀：不动产看<b>不动产所在地</b>，股息红利看<b>分配方</b>所在地，利息租金特许权费看<b>负担/支付方</b>所在地，权益性投资资产转让看<b>被投资企业</b>所在地（不是转出方）。","table":{"head":["身份","境内所得","境外所得","税率"],"rows":[["居民企业（成立地或实际管理机构在境内）","征","征","25%（优惠另议）"],["非居民·有机构场所·有实际联系","征","征","25%"],["非居民·有机构场所·无实际联系","征","不征","10% 源泉扣缴"],["非居民·无机构场所","征（境内来源）","不征","10% 源泉扣缴"]]},"tips":["判断税率只问两句：「境内有没有机构场所？」「这笔钱跟它有没有实际联系？」——两问定生死。","所得来源地里最容易错的是股息红利：按<b>分配所得的企业</b>所在地，不是投资方所在地。"],"qs":[1,2,3,1]},{"id":"4-2","name":"收入什么时候算：权责发生制与四类「合同约定日」","star":"★★★","level":"L3","scene":"会计上说「货发出去了、风险报酬转移了」就确认收入；税法不吃这一套，它要一个<b>能查证、不会扯皮</b>的时点。<br><br>比如分期收款卖设备，会计按现值一次性确认，税法说：按<b>合同约定的收款日期</b>一笔一笔确认；租金、利息、特许权使用费也一样，看合同约定的应付日期；接受捐赠则干脆按<b>实际收到</b>资产的日期。为什么差别这么大？往下看。","why":"税法确认收入时点，背后是两股力量在拉扯：<b>要收得准</b>（权责发生制，收入归到赚到它的那一年）和<b>要收得到</b>（纳税人得有钱交）。<br><br>· <b>分期收款 / 利息 / 租金 / 特许权使用费</b>：如果按权责发生制一次性确认，企业还没收到钱就要先交税，容易逼出欠税；而按合同日期，付款义务到期那一刻既有凭据、也大概率有现金，征纳双方都不用争。<br>· <b>接受捐赠</b>：白拿的东西没有对价、没有合同应付款日，唯一确定的时刻就是东西到手，所以按实际收到日。<br>· <b>股权转让</b>：要等协议生效 <b>且</b> 完成股权变更手续，因为没过户就不算真的转走。<br>· <b>政府补贴</b>：跟销售数量/金额挂钩的，本质是价款的一部分，跟货物一起按权责发生制；其他财政补贴、补助、退税，按实际取得时间。<br><br>这条「确定性优先」的思路还能解释金额规则：<b>商业折扣按扣除后金额</b>（真实成交价就是折后价）；<b>现金折扣按扣除前金额</b>（那是提前付款的融资费用，不是降价，另作财务费用）；<b>售后回购按售价确认、回购作购进</b>（税法不认「其实是融资」的会计实质，除非另有规定）。多选题 3 的八个选项，全在这条线上。","sentence":"税法要的是「能查证的确定时刻」：分期收款、利息、租金、特许权费看合同约定应付日；捐赠看实际收到日；股权转让看协议生效+变更手续；跟销量挂钩的补贴随货物按权责发生制，其余补贴按实际取得。","trap":"· 预收款销售在<b>发出商品</b>时确认，不是收到预收款时；托收承付在<b>办妥托收手续</b>时；委托代销（支付手续费方式）在<b>收到代销清单</b>时；<br>· 以旧换新按<b>销售商品正常确认收入</b>、回收商品作购进，不是按净额；<br>· 包含在售价内可区分的服务费，要在<b>服务期间分期</b>确认；<br>· 宣传媒介收费在广告<b>公之于众</b>时确认，广告制作费才按完工进度；为特定客户开发软件按完工进度；<br>· 持续时间超 12 个月的工程/劳务，按纳税年度内<b>完工进度或工作量</b>确认；<br>· 利息收入按<b>合同约定应付利息日</b>，不是实际收到日（多选 7 的 D 就死在这）。","table":{"head":["收入类型","确认时点","为什么"],"rows":[["分期收款销售货物","合同约定收款日期","付款义务到期、有现金"],["利息 / 租金 / 特许权使用费","合同约定应付日期","凭据确定"],["接受捐赠","实际收到资产日期","没有对价与合同日"],["股权转让","协议生效且完成股权变更","未过户不算转移"],["股息红利","被投资方作出利润分配决定日","分配义务确定"],["劳务（跨年 >12 个月）","完工进度 / 工作量","避免一次确认、无款可缴"]]},"tips":["把「按合同约定日期」的四个背成一句：<b>分期、利息、租金、特许权</b>。其余看到「实际收到」先警惕，多半只有捐赠和部分补贴。","现金折扣不减收入、商业折扣减收入——一个管钱早晚，一个管价高低。"],"qs":[4,3,4,7]},{"id":"4-3","name":"视同销售：只看所有权有没有出门","star":"★★★","level":"L3","scene":"公司把自产的一批货送给了灾区、分给了股东、或者拿来抵债；另一批货从北京仓库搬到天津分公司、从原料加工成半成品。<br><br><b>前者要视同销售交税，后者不交。</b>分界线只有一条：货的<b>所有权</b>有没有离开这家企业。","why":"企业所得税是对「所得」征税，而所得只有在<b>对外实现</b>时才好计量。资产在内部挪来挪去（自用、总分机构之间转移、继续加工），企业整体没多出一分钱，也没有外部交易价格可参照——硬要确认收入，等于对左口袋倒右口袋征税，还会逼企业自己编一个价格。<br><br>一旦所有权出门（捐赠、分配给股东、投资、抵债、广告样品），情况就变了：企业用这批资产<b>换到了别的东西</b>——换到了声誉、换到了分红义务的履行、换到了债务消灭、换到了股权。既然换到了对价，就要按<b>公允价值</b>确认收入、同时结转成本，把这笔隐含的增值收上来。不然企业大可用「送」的方式把利润转移出去，税基就漏了。<br><br>注意和增值税的区别：增值税的视同销售看的是「进项有没有被抵扣、货有没有进入最终消费」，所以<b>总分机构异地移送</b>在增值税上可能要视同销售，在企业所得税上因为所有权没变而<b>不视同</b>。这是两税最经典的对照点。<br><br>单选 53 是把自产药品分配给股东未作账，要补：调增 = 公允价值 450 - 成本 300 - 相关税费，再乘 25%。","sentence":"所有权出了企业门就视同销售（按公允价值确认收入、结转成本）；内部移送、自用、继续加工一律不视同。","trap":"· 自建商品房转自用、境内总分机构间移送、自产货物用于加工另一产品 → 都不视同；<br>· 用于<b>股息分配</b>、对外捐赠、对外投资、抵债、广告样品 → 视同；<br>· 视同销售收入要计入<b>业务招待费/广宣费限额基数</b>（销售营业收入），但<b>接受捐赠收入</b>是营业外收入，不计入基数；<br>· 公益性捐赠视同销售的销项税额要计入捐赠支出（单选 44：140+140×13%=158.2）；<br>· 政府/股东划入资产是「进来」，方向相反，不按这条判断。","table":{"head":["处置情形","所有权变化","企税视同销售","增值税"],"rows":[["总分机构间移送（境内）","不变","否","异地移送可能视同"],["自产货物用于继续加工","不变","否","否"],["自建商品房转自用","不变","否","否"],["自产货物对外捐赠 / 分配给股东","变","是，按公允价值","视同销售"],["以自产货物抵债","变","是","视同销售"]]},"tips":["一句话分家：<b>企税看所有权，增值税看抵扣链条</b>。","看到「未作任何账务处理」先条件反射：补收入、补成本、补税金、再调应纳税所得额。"],"qs":[5,53]},{"id":"4-4","name":"收入金额怎么定：折扣、折让、买一赠一","star":"★★","level":"L2","scene":"一台冰箱标价 6 万，买一赠一送加湿器；另一批货先卖 100 万，客户发现瑕疵退 10 万折让；还有一批 1000 万的货，给 50 万商业折扣，或者改成了「10 天内付款减 50 万」的现金折扣。<br><br>四笔业务，税法给出的收入金额都不一样。它不是在抠字眼，是在问同一个问题：<b>这批货真实成交价到底是多少</b>。","why":"· <b>商业折扣</b>：折扣发生在销售<b>当时</b>，价目表上就是折后价，真实成交价 = 1000-50，按净额确认。<br>· <b>现金折扣</b>：折扣发生在销售<b>之后</b>，是为早点拿到钱付的融资代价，货本身还是卖 1000 万；所以收入按 1000 万，那 50 万另作财务费用。<br>· <b>销售折让 / 退回</b>：已确认的收入后来因瑕疵被减掉，税法允许在<b>发生当期冲减</b>当期收入，不追溯改以前年度报表（征管上省事）。<br>· <b>买一赠一</b>：最容易想错成「赠品是捐赠，要视同销售」。但赠品不是白送，它是这笔买卖的条件之一，钱是<b>一整笔</b>收的。所以税法要求把总销售额按各项商品<b>公允价值比例分摊</b>，冰箱和加湿器各自确认自己的收入——既不多收（不按赠品市价额外加）、也不少收（不把全部金额算成冰箱）。<br><br>单选 6：60000 ÷ (60000 + 600×20) × 60000 = 50000 元。单选 36/37 是一对母题子题，只改「商业折扣 → 现金折扣」，答案就从 1040 变 1090，正好验证上面这条分界。","sentence":"成交价是多少就认多少：商业折扣减、现金折扣不减、折让退回当期冲减、买一赠一按公允价值比例分摊总额。","trap":"· 买一赠一<b>不属于捐赠</b>，不视同销售、不额外按赠品市价加收入；<br>· 现金折扣计入财务费用，不影响收入；<br>· 折让冲的是<b>发生当期</b>收入，不是追溯调整上年；<br>· 以旧换新按全额确认收入，回收商品另作购进。","tips":["母题子题只改一个词，答案就变——遇到这种题先圈出改的是哪个词，别整题重算。"],"qs":[6,36,37]},{"id":"4-5","name":"投资相关收入：股权、撤资、清算、永续债、可转债、限售股","star":"★★★","level":"L3","scene":"同样是「不持股了、拿回 1800 万」，<b>把股权卖给别人</b>、<b>从被投资公司撤资</b>、<b>公司清算分剩余财产</b>，三种拿钱方式的应纳税所得额完全不一样。<br><br>教材给了一张表（单选 18/19 就是母题子题）：转让 = 收入 - 初始成本；撤资 = 收入 - 初始成本 - 股息所得；清算 = 分得资产 - 股息所得 - 初始成本。为什么撤资和清算要先扣一块「股息所得」？","why":"因为<b>交易对手不同</b>：股权转让是你和<b>第三方股东</b>做买卖，对方付的钱里包含对未分配利润的预期，但税法不让你把被投资企业的留存收益扣掉（否则等于把免税股息伪装成转让所得），所以一律 1800-1000=800。<br><br>撤资/清算是<b>被投资企业自己</b>把钱退给你。它退的钱在法律上分三层：先还你的<b>本</b>（初始出资，不征税），再分它攒下的<b>未分配利润/盈余公积</b>（这部分性质是股息，符合居民企业间股息免税条件，所以单独切出来免税），剩下的才是<b>投资资产转让所得</b>。所以撤资题要先算 1500×40%=600 万股息，再算 1800-1000-600=200 万应税。<br><br>同一个「按性质拆分」的思路串起其余几个：<br>· <b>股东划入资产</b>约定作资本金且会计已处理 → 是<b>投入资本</b>不是收入，但计税基础按<b>公允价值</b>（防止把低估资产塞进来以后多提折旧）。<br>· <b>可转债转股</b>：应收未收利息一并转股的，税收上要先确认利息收入，再把「购买价 + 利息 + 相关税费」一起作为股票计税基础（单选 13 = 500+5+2=507）。<br>· <b>永续债 / 混合性投资</b>：名字叫「债」还是「股」不看名字，看<b>有没有还本义务、固定利息、期限、是否参与经营、是否承担经营风险</b>。满足 5 条以上按债券利息处理（投资方交税、发行方扣利息）；否则按股息处理。多选 5、6、38 全在考这条。<br>· <b>代个人持有的限售股</b>：名义上是企业持有，所以由<b>企业</b>就转让收入交企税；原值算不清的，按转让收入的 15% 核定原值和税费，1000×(1-15%)×25%=212.5 万；余额转付给个人时不再扣个税。","sentence":"钱从谁手里来决定性质：第三方买股权不扣留存收益；被投资企业退钱要切成「还本 / 股息 / 转让所得」三层。名字不重要，还本义务和经营风险决定是债还是股。","trap":"· 股权转让<b>不得</b>扣除被投资企业未分配利润中按持股比例可分配金额（单选 18 的 1500 万是干扰项）；<br>· 撤资/清算才扣股息所得，且顺序别乱；<br>· 股东划入资产按<b>公允价值</b>定计税基础，不是账面净值；<br>· 永续债条件里「被投资企业<b>可以</b>赎回」才符合，写「不可以赎回」是错的；税收处理方法<b>一经确定不得变更</b>，可以与会计处理不一致但要做纳税调整；<br>· 委托境外研发、限售股核定 15%，都是「算不清就给一个法定比例」的同一类规则。","table":{"head":["退出方式","公式","关键"],"rows":[["股权转让","收入 - 初始投资成本","留存收益不得扣"],["撤资 / 减资","取得资产 - 初始成本 - 股息所得","先切免税股息"],["清算","分得资产 - 股息所得 - 初始成本","顺序与撤资相反写法"],["可转债转股计税基础","购买价 + 应收未收利息 + 税费","利息先确认收入"],["限售股原值不清","转让收入 ×15% 核定","企业交企税"]]},"tips":["先问一句「钱是股东给的还是公司退的」，三层切分自然就出来了。","母题子题里改成「撤回全部投资」，只改了钱从哪儿来，其他数字全都别动。"],"qs":[7,13,17,18,19,5,6,38,39]},{"id":"4-6","name":"不征税收入 vs 免税收入：一个永久出局，一个只是这一轮免","star":"★★★","level":"L3","scene":"公司收到政府一笔专项拨款，用它买了台设备；另一笔钱是持有国债收到的利息。两者都「不用交税」，但后果完全不同：<br><br><b>用不征税收入买的那台设备，折旧永远不能在税前扣；用免税的国债利息买的设备，折旧照样能扣。</b>这是全章最容易考、也最容易想不通的一组对照。","why":"关键在于<b>这笔钱到底算不算「收入」</b>。<br><br>· <b>不征税收入</b>压根不是「经营所得」，它是财政拨款、行政事业性收费、有专项用途并经国务院批准的财政性资金。国家把钱给你是让你办特定事，不是让你赚钱——它<b>从来没进过税基</b>。既然本金没被征过，用它形成的费用/资产折旧当然也不能再扣一次，否则等于同一笔财政资金扣了两回。<br>· <b>免税收入</b>（国债利息、符合条件的居民企业间股息红利、非营利组织收入、沪港通连续持 H 股满 12 个月的股息）本来<b>属于应税收入</b>，是国家为了鼓励某类行为，特意在这一轮免掉。它进过税基的口径、只是被优惠政策抹掉，所以对应的成本费用照常可扣。<br><br>由此还能推出两个常考点：<br>① <b>不征税收入孳生的银行存款利息</b>是免税收入（多选 8 的 D），而「因政府购买服务取得的收入」<b>不属于</b>非营利组织免税收入（那是等价交易，不是捐赠补助）。<br>② 增值税里：<b>即征即退、先征后返、直接减免</b>的增值税属于「财政性资金」，符合专项用途条件可作不征税收入；<b>出口退税</b>是退还进项、本来就不是收入，明确排除（多选 37 的 B 错在这）。<br><br>单选 8 四个选项正好把三类摆一排：A 免税、B 照章纳税（国债<b>转让</b>收入不免税）、CD 不征税。","sentence":"不征税收入从来没进税基 → 对应的费用/折旧也不许扣；免税收入本该征税只是这轮被免 → 对应成本费用照常扣。","trap":"· 国债<b>利息</b>免税，国债<b>转让</b>所得照章纳税（单选 8 B、单选 40）；<br>· 出口退税不是不征税收入；<br>· 非营利组织：接受捐赠、省级以上民政财政部门规定收取的会费、不征税/免税收入孳生的利息 → 免税；<b>政府购买服务收入</b>不免税、<b>市级</b>规定的会费不算；<br>· 居民企业间股息红利免税要求「符合条件」，<b>连续持有不足 12 个月</b>的上市股票股息不免税；<br>· 被投资企业用<b>股权溢价形成的资本公积转增股本</b>，不作为投资方股息红利收入，也不得增加计税基础。","table":{"head":["","不征税收入","免税收入"],"rows":[["典型","财政拨款、行政事业性收费、专项用途财政性资金","国债利息、符合条件的股息红利、非营利组织收入"],["是否曾属应税","否，从未进入税基","是，被优惠免掉"],["用于支出形成的费用/折旧","<b>不得扣除</b>","可以扣除"],["孳生利息","作为免税收入","—"]]},"tips":["判断口诀：<b>「国家给你的钱不许再扣，国家免你的钱照常扣」</b>。","看到「政府购买服务」「市级会费」「出口退税」三个词，多选里一律先划掉。"],"qs":[8,2,8,37]},{"id":"4-7","name":"国债三件事：利息免税、转让征税、成本方法禁用后进先出","star":"★★","level":"L2","scene":"公司 1000 万买入一年期国债，年利率 4.5%，持有 200 天以 1030 万卖掉。这 30 万价差里，有多少是<b>还没兑付的利息</b>、有多少是<b>真正的转让所得</b>？<br><br>税法说：持有期间应计的利息 1000×4.5%÷365×200 = 24.66 万，这部分免税；剩下的 1030-1000-24.66 = 5.34 万才是转让所得，×25% = 1.34 万。","why":"国债利息免税是为了鼓励买国债（帮国家低成本融资），但<b>免税的是「利息」这个性质</b>，不是「跟国债有关的所有钱」。二级市场上低买高卖赚的价差是资本利得，跟持有国债的鼓励目的无关，当然要征税。<br><br>难点在于：持有期间<b>尚未兑付</b>的利息已经包含在卖价里了，如果不把它先剥出来，就会把本该免税的利息当成价差征了税。所以要按「面值 × 年利率 ÷ 365 × 持有天数」把应计利息算出来先免税。<br><br>另一件事：卖掉一批国债时要算成本，可选<b>先进先出、加权平均、个别计价</b>，<b>禁用后进先出</b>（单选 9）。为什么？后进先出会让企业永远把最新、通常最高的成本先结转成扣除，在通胀环境下能长期压低所得、递延纳税。存货成本计算也禁它，同一个理由。而增值税里金融商品买入价用的是加权平均/移动加权平均且 36 个月不变——两税口径不同，别串。","sentence":"国债只免「利息」不免「价差」：转让时先把持有期应计利息剥出来免税，剩余价差按 25% 交；成本可用先进先出/加权平均/个别计价，禁用后进先出。","trap":"· 「国债转让收入免税」是错的；<br>· 应计利息按 <b>365 天</b>折算，不是 360；<br>· 别把 1030-1000 全额当所得（会算出 7.5 万，选项 B 就是这个坑）；<br>· 铁路债券利息是<b>减半征收</b>，不是免税；国债利息才免税。","tips":["看到「持有 XX 天转让国债」，第一步永远是先算应计利息，第二步再算价差。"],"qs":[9,40]},{"id":"4-8","name":"限额家族：三项经费、招待费、广宣费、公益性捐赠","star":"★★★","level":"L3","scene":"企业花了钱，税务局却说「只能扣一部分」。这一整组考点的共同点是：<b>支出本身真实、也跟经营有关，但容易被拿来变相发福利、避税</b>，所以国家给一个「天花板」。<br><br>福利费 14%、工会 2%、职工教育 8%、招待费 60% 与收入 5‰ 孰低、广宣费 15%（特殊行业 30%）、公益性捐赠利润总额 12%。这些数字不用硬背——它们分属三种不同的「天花板逻辑」。","why":"<b>① 按比例给上限（三项经费、广宣费）</b>：因为这类支出容易膨胀成隐性薪酬。以<b>工资薪金总额</b>为基数，等于「你发多少工资，才配扣多少配套费用」，天然封顶。<br><b>② 双限额孰低（招待费）</b>：招待费最难说清是公务还是私人消费，所以设两道闸——<b>发生额的 60%</b>（先假设 40% 是私人成分，一律不认）+ <b>销售(营业)收入的 5‰</b>（跟生意规模挂钩），取小的那个。<br><b>③ 按利润比例 + 结转（公益性捐赠）</b>：捐赠是好事，但不能让企业把利润全捐光来避税，所以限额 = <b>年度利润总额 ×12%</b>；超额部分可结转以后 <b>3 年</b>，且扣除时<b>先扣上年结转、再扣本年发生</b>（单选 44、多选 41）。<br><br>三个高频细节都从「基数」长出来：<br>· <b>销售(营业)收入</b> = 主营 + 其他业务 + <b>视同销售收入</b>，但<b>不含营业外收入</b>（接受捐赠收入）和投资收益——单选 43 的 100 万捐赠收入就是拿来骗你进基数的。<br>· <b>劳务派遣</b>：直接付给派遣公司的费用算<b>劳务费</b>（不进工资总额）；直接发给派遣员工的，拆分工资薪金部分才进基数（单选 41：1200+70=1270，×14%=177.8）。<br>· <b>工资总额</b>还包括汇缴前实际支付的已预提工资、实习生工资、返聘离退休人员工资（多选 40）。<br><br>能结转的只有三类：<b>职工教育经费（无限期）、广宣费（无限期）、公益性捐赠（3 年）</b>；福利费、工会经费、招待费超了就永久作废。这个区别考过无数次。","sentence":"先定基数、再算限额、最后看能否结转：三项经费看工资总额，招待费看 60% 与收入 5‰ 孰低，广宣费看收入 15%/30%，捐赠看利润总额 12% 且先扣上年结转。","trap":"· 招待费里的销售(营业)收入<b>含视同销售、不含接受捐赠和投资收益</b>；<br>· 广宣费 30% 只给<b>化妆品制造或销售、医药制造、饮料制造（不含酒类）</b>；<b>烟草企业的烟草广宣费一律不得扣除</b>；啤酒、医药零售都不在 30% 名单里；<br>· 职工教育经费：<b>软件企业职工培训费、核电厂操纵员培养费可全额扣除</b>（单选 54 先剔 50 万再算 8%）；<br>· 公益性捐赠限额用<b>会计利润总额</b>，不是应纳税所得额；捐赠自产货物要按公允价值加销项税确认支出（140+18.2=158.2）；<br>· 违约金、银行罚息<b>可以扣</b>；税收滞纳金、罚金、非广告赞助、预提维简费不得扣；<br>· 筹建期业务招待费按<b>60%</b> 计入筹办费（不设收入 5‰ 那道闸），广宣费按实际发生额全额计入。","table":{"head":["项目","限额","基数","超了能否结转"],"rows":[["职工福利费","14%","工资薪金总额","否"],["工会经费","2%","工资薪金总额","否"],["职工教育经费","8%","工资薪金总额","是，无限期"],["业务招待费","60% 与 5‰ 孰低","发生额 / 销售营业收入","否"],["广宣费","15%（特殊 30%）","销售营业收入","是，无限期"],["公益性捐赠","12%","年度利润总额","是，3 年"]]},"tips":["所有限额题第一步都是<b>找基数</b>，不是急着乘百分比。","结转三兄弟：<b>教、广、捐</b>；其余超支当年作废。"],"qs":[10,41,43,44,54,10,40,41]},{"id":"4-9","name":"税会差异：股权激励与非货币性资产投资 5 年递延","star":"★★★","level":"L3","scene":"会计上确认了一笔费用，税法却说「今年一分不许扣」；或者反过来，会计上一次性确认了 60 万所得，税法说「分 5 年，每年只认 12 万」。<br><br>这两件事看着毫无关系，其实是同一个动作：<b>把会计口径和税法口径的时间差，用「纳税调增 / 调减」记下来</b>。整章最核心的心法就在这里。","why":"<b>股权激励</b>：等待期内会计按权责发生制把期权费用摊进各年，但此时<b>没人行权、没有实际支出、金额还会随股价变</b>。税法只认「确定的、已实现的」支出，所以等待期一律<b>调增</b>（可扣 0）。等真正行权那天，行权价与公允价的差额才是公司实打实付出的成本，一次性按 (26-8)×100×20000÷10000=3600 万扣除（单选 11/12）。<br><br><b>非货币性资产对外投资</b>：拿一批成本 140、公允 200 的货去投资，账上立刻多出 60 万所得。但公司<b>没收到一分钱现金</b>，只换回了股权——立刻征税等于逼企业卖资产交税。所以税法允许把 60 万在不超过 5 年内<b>分期均匀</b>计入：每年 12 万。于是 2023 年会计 60、税法 12，<b>调减 48</b>；2024–2027 每年会计 0、税法 12，<b>调增 12</b>（单选 38）。<br><br>如果 5 年内<b>转让股权或收回投资</b>，说明变现了、递延理由消失，要把剩余年度未确认的所得一次性补上（单选 39：2025 收回，剩 2025–2027 三年 = 36 万，调增 36）。<br><br>这类题有个万能做法：<b>画两行时间轴</b>，一行写会计每年认多少，一行写税法每年认多少，差额就是调增/调减，符号别靠感觉。","sentence":"税会差异 = 两条时间轴相减：会计认了税法没认 → 调增；税法认了会计没认 → 调减。递延的前提是「没拿到现金」，一变现就停止递延。","trap":"· 等待期股权激励费用<b>全额调增</b>，不是按公允价值折算；<br>· 行权时扣的是 <b>(行权日公允价 - 行权价) × 数量</b>，与授予日股价无关；<br>· 5 年递延是「<b>不超过</b> 5 年、<b>均匀</b>」，不是想怎么分怎么分；<br>· 收回投资当年一次性确认的是<b>剩余未确认</b>部分，不是全额 60 万；<br>· 自产货物分配股东、视同销售补账，也属于「会计没记、税法要记」的调增（单选 53）。","table":{"head":["年度","会计确认","税法确认","纳税调整"],"rows":[["2023（投资当年）","60 万","12 万","调减 48"],["2024","0","12 万","调增 12"],["2025 收回投资","0","12×3 = 36 万（一次性）","调增 36"]]},"tips":["遇到「调增还是调减」别凭直觉，画两条时间轴，用<b>税法 − 会计</b>定符号。","凡是税法给了递延，一定会配一条「提前变现就补回来」的规则——两道题往往成对出。"],"qs":[11,12,38,39]},{"id":"4-10","name":"固定资产折旧：年限、加速、一次性扣除、不得折旧","star":"★★★","level":"L3","scene":"同样是买设备，有的能当年一次性全扣，有的必须分 10 年，有的<b>永远不许扣折旧</b>。<br><br>单选题 14、27、31、51 和多选 18、19 都在问：这台东西，税法认不认、按几年扣、从哪个月开始扣。","why":"折旧的本质是<b>把资本性支出分期摊进成本</b>。税法管三件事：<br>① <b>是不是真在为企业赚钱</b>：经营租入的（不属于你）、融资租出的（已不归你用）、房屋建筑物以外未投入使用的、已提足折旧还在用的、与经营无关的、单独估价入账的土地 → 一律不许再扣折旧。<br>② <b>按几年摊</b>：房屋建筑物 20 年、飞机火车轮船机器等 10 年、器具工具家具 5 年、飞机火车轮船以外的运输工具 <b>4 年</b>、电子设备 3 年。核定征收期间买的资产改成查账征收，要按税法年限<b>扣掉已用年限</b>继续摊（单选 14：4-1=3 年）。<br>③ <b>政府想鼓励更新设备时</b>：允许<b>缩短折旧年限（不低于法定年限 60%）</b>或加速折旧；2018–2027 年新购进<b>单位价值 ≤500 万的设备器具</b>（<b>不含房屋建筑物</b>）可一次性税前扣除。<br><br>为什么一次性扣除要排除房产？因为房产价值大、使用期长、还常被用来持有增值，一次性扣会瞬间击穿税基；而设备更新快、政策目的就是让企业敢买。<br><br>单选 51 把两个规则叠在一起：1600 万设备 → 缩短年限法最低 10×60%=6 年；<b>投入使用次月起</b>计提，2025 年只扣 7–12 月共 6 个月：1600×(1-5%)÷6×6/12 = 126.67 万。注意别把「6 年」和「6 个月」看混。","sentence":"先问能不能扣（ownership + 在用），再问按几年（法定年限 / 60% 加速），最后问从哪月起（投入使用次月）；≤500 万设备器具 2027 年底前可一次性扣，房产不行。","trap":"· 「房屋建筑物以外未投入使用」不得扣；但<b>未投入使用的厂房</b>可以扣（多选 18 的 C 是可扣的，别选它进「不得扣」）；<br>· 融资<b>租入</b>可扣、融资<b>租出</b>不可扣；经营<b>租入</b>不可扣；<br>· 一次性扣除看<b>单位价值</b>不是总价，且限<b>设备器具</b>；超过 500 万仍可加速折旧；<br>· 已足额提取折旧的固定资产改建支出走<b>长期待摊（按预计尚可使用年限）</b>，尚未提足的改建支出是<b>增加计税基础</b>；<br>· 其他长期待摊费用摊销年限<b>不得低于 3 年</b>（不是 5 年）；大修理支出按尚可使用年限，租入固定资产改建按剩余租期。","table":{"head":["资产 / 支出","税法处理","年限"],"rows":[["房屋建筑物","正常折旧","20 年"],["机器设备","正常折旧","10 年"],["运输工具（非飞机火车轮船）","正常折旧","4 年"],["电子设备","正常折旧","3 年"],["缩短年限法（加速）","不低于法定 60%","10 年 → 6 年"],["≤500 万设备器具","一次性扣除","2018–2027"],["其他长期待摊费用","分期摊销","≥3 年"]]},"tips":["计算题固定三步：<b>定年限 → 定起扣月 → 定当年月数</b>，别跳步。","「房屋建筑物以外未投入使用」这半句要连着读，漏掉前半句就会把厂房误判成不能扣。"],"qs":[14,27,51,18]},{"id":"4-11","name":"其他资产的税法口径：生物、无形、投资、税金、长期待摊","star":"★★","level":"L2","scene":"公司买了片林子、一批用于收藏的文物、一项专利，还替在建厂房交了契税。哪些能摊、哪些永远不能摊？<br><br>判断标准还是那句：<b>它是不是在生产经营中被消耗掉</b>。","why":"· <b>生物资产</b>分三类：消耗性（用材林、生长中的农田作物，等着卖掉，是存货）、<b>生产性</b>（薪炭林、产奶的奶牛，持续产出，可提折旧）、公益性（水源涵养林，不产生经营收益，不可提）。只有生产性可提折旧（单选 15）。<br>· <b>商誉</b>：自创商誉不得摊销（自己夸自己值多少钱，没有可验证的成本）；<b>外购商誉</b>的支出只有在企业整体转让或清算时才准扣（单选/多选 20）。无形资产摊销年限<b>不低于 10 年</b>；接受投资/捐赠/非货币交换取得的，按<b>公允价值 + 相关税费</b>定计税基础，不是账面价值。<br>· <b>投资资产</b>：持有期间成本<b>不得扣除</b>（钱只是换了个形态），转让处置时才准扣；<b>文物、艺术品</b>用于收藏展示保值增值的按投资资产处理，持有期间计提的折旧<b>不得扣</b>（单选 17）。<br>· <b>税金</b>：计入「税金及附加」当期扣（消费税、车船税、房产税、印花税、环保税等）；<b>资本化进资产成本、以后分摊</b>的是契税、车辆购置税、耕地占用税、进口关税、不得抵扣的增值税（多选 9 = CDG）；企业所得税本身和可抵扣的增值税<b>永远不得扣</b>。<br>· <b>存货成本</b>禁用后进先出法。","sentence":"只有「在经营中被消耗」的资产才能摊：生产性生物资产、外购无形、在用固定资产；投资资产和收藏品持有期间一律不摊，卖出时才扣成本。","trap":"· 自创商誉不摊、外购商誉只在整体转让/清算时扣；<br>· 无形资产的计税基础看<b>公允价值</b>，不是账面价值；<br>· 被投资企业发生的亏损由<b>被投资企业</b>自己结转，投资企业不得弥补（单选 16 D）；<br>· 「其他应当作为长期待摊费用的支出」摊销 ≥3 年，不是 5 年；<br>· 使固定资产达到预定用途的支出计入<b>计税基础</b>，不是长期待摊。","tips":["把资产分成「会耗掉」和「只是换形态」两类，八成选择题就定了。"],"qs":[15,16,9,19,20]},{"id":"4-12","name":"企业重组：一般性 vs 特殊性，一条「有没有变现」的分界线","star":"★★★","level":"L3","scene":"甲公司合并乙公司、收购股权、或者把一台设备无偿划给 100% 控股的子公司。会计上都可能没收到现金，税法却有两种完全不同的处理：<br><br><b>一般性</b>：当作按公允价值卖了一遍，当场确认所得或损失，计税基础改成公允价值，亏损不许带走。<br><b>特殊性</b>：当作没卖，暂不确认所得，计税基础<b>原样结转</b>，亏损可以在限额内带过来。<br><br>为什么同一笔交易能有两种结果？","why":"因为<b>重组往往只是换了个持有方式，老板没真正退出、也没拿到钱</b>。如果一律按公允价值立即征税，企业会因为没有现金缴税而不敢重组，等于税法在阻碍正常的产业整合。所以国家给一个选择：<b>只要交易主要是用股权支付的（没有变现），就允许递延</b>。<br><br>由此推出特殊性税务处理的五个条件，全都能理解而不是背：<br>① <b>合理商业目的</b>（不是纯为避税）；② <b>股权支付 ≥85%</b>（钱没怎么出去，才有递延理由）；③ 收购/合并的资产或股权比例 ≥50%（确实是重大重组）；④ 重组后 <b>12 个月</b>内不改变原实质性经营活动；⑤ 取得股权支付的原主要股东 <b>12 个月</b>内不转让所取得的股权（防止立刻套现）。<br><br>两个必须会算的限额：<br>· <b>被合并企业亏损</b>可带入，但限额 = 被合并企业<b>净资产公允价值 × 合并当年年末最长期限国债利率</b>（单选 20：(7500-5200)×6% = 138 万，与 460 万亏损取小）。为什么设这个闸？因为亏损是「税盾」，不设限就会出现「买一家亏损公司来抵自己的税」。<br>· <b>非股权支付部分仍要确认所得</b>：(被转让资产公允价值 - 计税基础) × (非股权支付金额 ÷ 公允价值)（单选 47：(3200-2000)×200/3200 = 75 万）。收了现金的那一部分，没有递延理由。<br><br>一般性处理则全程相反：被收购方<b>确认</b>所得、收购方按<b>公允价值</b>定计税基础、亏损<b>不得</b>结转（单选 21）。多选 45 的 D 写「股权支付 ≥75%」是旧比例，正确是 <b>85%</b>。","sentence":"特殊性 = 没变现就递延：股权支付 ≥85%、原计税基础结转、亏损限额带入；收了现金（非股权支付）的那一块仍当场确认所得。一般性 = 按公允价值当场卖一遍。","trap":"· 特殊性处理的股权支付比例是 <b>85%</b>，不是 75%；资产/股权转让比例 ≥50%；<br>· 合并企业接受资产的计税基础按<b>原有计税基础</b>，不是公允价值（多选 45 A）；<br>· 100% 直接控制的居民企业间按<b>账面净值</b>划转：划出方、划入方均不确认所得，划入方计税基础按<b>原账面净值</b>（单选 22：5000-1200=3800），折旧也按原账面净值（多选 24）；<br>· 特殊性处理下被合并企业亏损「<b>限额内</b>」弥补，不是全额；<br>· 债务重组以非货币资产清偿要拆成两笔：转让资产所得 + 按公允价值清偿债务的重组所得（多选 44：150+96=246）。","table":{"head":["","一般性税务处理","特殊性税务处理"],"rows":[["是否确认所得","当场确认","暂不确认（非股权支付部分除外）"],["计税基础","公允价值","原计税基础 / 原账面净值"],["亏损","不得结转","限额内由合并企业弥补"],["适用前提","默认","合理商业目的 + 比例 ≥50% + 股权支付 ≥85% + 两个 12 个月"]]},"tips":["一句话记：<b>「一般看公允，特殊看原值」</b>——所有选项只要写反就错。","看到「划转」「合并」「收购」先问：钱出去了没有？出去了多少？"],"qs":[20,21,22,47,24,44,45]},{"id":"4-13","name":"特殊主体与专项政策：REITs、境外投资者再投资、海南自贸港","star":"★★","level":"L2","scene":"这三块看着零散，其实是同一类题：<b>国家为了某个政策目标，给一条专门通道</b>。考法全是「哪条通道、门槛数字是多少」，没有推理空间，只能把边界记准。","why":"· <b>基础设施 REITs 设立阶段</b>：原始权益人把项目公司股权转给 REITs，账上有评估增值，但<b>钱还没真正到手</b>（要等完成募资、支付转让价款）。所以政策给的是<b>「当期暂不缴纳、递延到募资完成后」</b>，不是免税、也不是不征税（单选 23 的 C）。这个「暂不缴」和 4-9 的 5 年递延是同一逻辑。<br>· <b>境外投资者以分得利润境内直接投资</b>：目的是把外资利润留在中国继续投，所以给<b>投资额 10% 的税额抵免</b>（当年不足可结转）。边界很严：增资、新建、股权收购等权益性投资可以，但<b>新增/转增/收购上市公司股份</b>不行（符合战略投资条件除外）；现金利润必须<b>从利润分配企业账户直接转入</b>被投资企业账户，中途不得在其他账户周转；<b>不满 5 年收回</b>要补缴递延税款<b>并且</b>按比例减少抵免额度（单选 55）。<br>· <b>海南自贸港</b>：注册在海南且<b>实质性运营</b>的鼓励类产业企业减按 15%；「实质性运营」要求实际管理机构设在海南并实施实质性全面管理和控制；主营业务须来自《鼓励类产业目录》且<b>收入占比 ≥60%</b>（不是 50%）；目录既含全国性现有鼓励类产业、也含海南新增；总机构在海南以外的，只有设在海南的符合条件分支机构所得适用 15%（多选 46）。","sentence":"三条专门通道：REITs 设立增值「暂不缴、递延到募资后」；境外利润再投资抵免 10% 且资金不得周转；海南 15% 要实质运营 + 主营收入 60% 以上。","trap":"· 单选 23 别选「免征」或「不征」，是<b>暂不缴纳（递延）</b>；<br>· 抵免比例是<b>投资额 10%</b>，创投企业抵扣是<b>投资额 70%</b>抵应纳税所得额——一个是抵<b>税额</b>、一个是抵<b>所得额</b>，别混；<br>· 海南比例 <b>60%</b>，不是 50%；<br>· 收购上市公司股份不属于合格的境内直接投资。","tips":["这块的数字没有逻辑可推，用「<b>暂不缴 / 10% / 60%</b>」三个锚点串起来记。"],"qs":[23,55,46]},{"id":"4-14","name":"税基式优惠：减计、加计、减免所得、创投抵扣","star":"★★★","level":"L3","scene":"同样是「少交税」，这一组动的是<b>税基</b>：要么收入只按 90% 计，要么费用按 200% 扣，要么所得直接免一半。<br><br>它和 4-15 的税率式、税额式优惠是三套并行工具，题目最爱把三者混在选项里问「属于哪一类」。","why":"为什么分三种？因为政策力度和指向不同：<b>减计收入 / 加计扣除</b>是「特定行为给折扣」，<b>减免所得</b>是「整块所得打折」，<b>税率式</b>是「整个企业换个档」，<b>税额抵免</b>是「直接从应纳税额里减钱」——越往后越直接、也越贵，所以条件越严。<br><br><b>必背的几个数字与边界</b>：<br>· <b>减计收入 90%</b>：金融机构农户小额贷款利息（单笔且该农户贷款余额 ≤10 万，不是 15 万）、保险公司为种植业养殖业提供保险的保费、综合利用资源生产<b>国家非限制和禁止</b>且符合标准产品的收入（单选 28；写「限制性产品」是错的）。<br>· <b>研发费用加计 100%</b>（2023 起）：未形成无形资产的按实际发生额再加扣 100%。基数含人员人工、直接投入、折旧、无形资产摊销、新产品设计费等；<b>其他相关费用（如知识产权申请费）限额 = 五项费用之和 ×10%÷(1-10%)</b>；<b>市场调查研究费</b>不属于研发、常规性升级不适用（单选 50 = 1000 万，多选 29）。<br>· <b>委托境外研发</b>：按「实际发生额 80%」与「境内符合条件研发费用的 2/3」<b>孰低</b>为基数；委托境外<b>个人</b>研发不得加计；受托方一律不得再加计（单选 49 = (570+320)×100%=890）。<br>· <b>不能加计扣除的行业</b>：烟草制造、住宿餐饮、批发零售、房地产、租赁和商务服务、娱乐业（多选 33）。<br>· <b>技术转让所得</b>：≤500 万免、超过部分减半；境内转让须经<b>省级以上科技部门</b>认定（不是商务部门）；从直接或间接持股合计达 <b>100%</b> 关联方取得的不享受；未单独计算所得的也不享受（单选 48 = (1300-500)×50%×25%=100 万；多选 27）。<br>· <b>创投企业</b>：股权投资初创科技型企业满 2 年，按<b>投资额 70%</b> 抵扣<b>应纳税所得额</b>，不足可结转（单选 24）。<br>· <b>农林项目</b>：远洋捕捞、林木种植等免税；内陆养殖、香料作物种植等<b>减半</b>（多选 25）。<br>· <b>三免三减半</b>：公共基础设施、环保节能节水项目、农村饮水工程、节能服务公司合同能源管理项目，自<b>项目取得第一笔生产经营收入所属纳税年度</b>起；而集成电路/软件企业自<b>获利年度</b>起（单选 25、多选 26/31）。<br>· 其他：企业出资给高校/非营利科研机构用于基础研究，可<b>100% 加计扣除</b>（多选 31 写 50% 是错的）；证券投资基金买卖股票债券差价、投资者从基金分配取得的收入均<b>暂不征收</b>（多选 30）。","sentence":"先分清动的是哪一层：减计收入(90%)、加计扣除(100%)、减免所得(500 万以内免)、抵扣所得额(创投 70%)、抵免税额(设备 10%)、换税率(15%)。","trap":"· 农户小额贷款门槛是 <b>10 万</b>；<br>· 委托境外研发的「2/3」是<b>境内</b>符合条件研发费用的 2/3，不是全部研发费用；<br>· 技术转让认定机关是<b>科技部门</b>、关联方门槛 <b>100%</b>；<br>· 节能服务公司是<b>三免三减半</b>，不是两免三减半；<br>· 集成电路/软件企业优惠期从<b>获利年度</b>起，公共基础设施项目从<b>第一笔生产经营收入</b>年度起——两个起点最爱对调。","table":{"head":["工具","典型政策","落在哪一层"],"rows":[["减计收入","农户小额贷款利息、种养业保费、资源综合利用","收入 ×90%"],["加计扣除","研发费用、基础研究出资","费用 ×200%"],["减免所得","技术转让、农林项目、三免三减半","所得免/减半"],["抵扣所得额","创投投初创科技型企业","投资额 70%"],["抵免税额","专用设备、境外利润再投资","税额 -10%"]]},"tips":["看到百分比先问：<b>乘在收入上、费用上、所得上，还是直接减税额</b>？问完就不会把 70% 和 10% 搞反。"],"qs":[24,25,28,48,49,50,25,26,27,29,30,31,33]},{"id":"4-15","name":"税率式与税额式优惠：15%、小微、专用设备抵免","star":"★★★","level":"L3","scene":"这一组动的是<b>税率</b>和<b>最终那张税单</b>，力度最大，所以条件也最具体。<br><br>小型微利企业 260 万所得只交 13 万；买一台 600 万的安全生产专用设备，直接少交 60 万税，5 年内转卖又要补回来。","why":"· <b>15% 优惠税率</b>给的是国家想扶持的「身份」：高新技术企业、技术先进型服务企业、西部鼓励类产业企业、海南鼓励类、污染防治第三方企业（多选 28）。注意<b>科技型中小企业</b>本身不是 15% 税率，它的好处是<b>亏损结转 10 年</b>和研发加计，别把它混进来。<br>· <b>小型微利企业</b>是「税基 + 税率」双重优惠：2027 年底前，应纳税所得额<b>减按 25% 计入</b>，再按 <b>20% 税率</b>，实际税负 <b>5%</b>。260×25%×20%=13 万（单选 26）。<b>查账、核定征收都能享受</b>，统一<b>按季</b>预缴，填申报表即可享受、无需审批（多选 32）。<br>· <b>税额抵免</b>：购置并实际使用环保/节能节水/安全生产专用设备，按<b>投资额 10%</b> 直接抵免<b>应纳税额</b>，当年不足可向以后 <b>5 年</b>结转（单选 29：1000×25% - 600×10% = 190）。<b>5 年内转让、出租要停止优惠并补缴已抵免税款</b>；受让方可以就该设备再享受 10% 抵免（单选 30）。<br>· <b>智能化改造</b>：2024–2027 年专用设备数字化智能化改造投入，不超过<b>原计税基础 50%</b> 的部分按 10% 抵免（单选 31：240×50%=120 > 150 取 120，×10%=12）。<br>· <b>集成电路和软件</b>：国家鼓励的重点集成电路设计企业和软件企业，第 1–5 年免、接续年度减按 10%，自<b>获利年度</b>起（单选 25）；「2 免 3 减半」「5 免 5 减半」按线宽和经营期分档，起点按企业或项目不同而不同。","sentence":"小微 = 所得额 ×25% ×20%（实际 5%）；设备抵免 = 投资额 10% 直接减税单，5 年内转卖要补；15% 是身份优惠，科技型中小企业不在这档。","trap":"· 小微实际税负 <b>5%</b>，不是 20%，也不是 25%；<br>· 专用设备抵的是<b>应纳税额</b>，创投 70% 抵的是<b>应纳税所得额</b>；<br>· 设备 5 年内转让由<b>转让方</b>补缴，受让方可另行享受抵免；<br>· 智能化改造投入要<b>先封顶到原计税基础 50%</b> 再乘 10%；<br>· 集成电路软件企业从<b>获利年度</b>起算，公共基础设施项目从<b>第一笔收入年度</b>起算。","tips":["把「抵所得额」和「抵税额」写成两栏贴在桌上：创投 70% 在上，设备 10% 在下。"],"qs":[26,29,30,31,28,32]},{"id":"4-16","name":"核定征收与跨境：算不清账时怎么办","star":"★★★","level":"L3","scene":"公司成本费用一团乱，税务局没法查账，于是给一个<b>应税所得率</b>：收入 600 万 ×15% = 90 万应纳税所得额，×25% = 22.5 万。<br><br>另一头，境外公司在中国没设机构，卖设备顺带安装，合同里没单列安装费；或者跨境电商在综试区里核定征收。这三件事的共同点是：<b>算不清，就用法定比例替代真实核算</b>。","why":"核定征收不是惩罚，是<b>征管上的替代算法</b>：能查清收入总额就用「收入 × 应税所得率」；只能查清成本费用就用「成本 ÷(1-应税所得率) × 应税所得率」；两头都查不清才直接核定税额。跨境电商综试区统一按 <b>4%</b> 应税所得率（单选 32、35）。注意<b>专门从事股权（股票）投资业务的企业不得核定征收</b>。<br><br>跨境那头更难：非居民企业卖中国设备又提供安装劳务，合同不列劳务费，很容易把利润全压到境外去。所以税法规定：无参照标准时，劳务收入<b>不低于销售合同总价款的 10%</b>（单选 33）。<br><br><b>源泉扣缴</b>的四个要点（单选 34、52、多选 34）：<br>· 扣缴义务人是<b>支付人</b>；<br>· 在<b>每次支付或到期应支付</b>时扣（不是合同约定的某个日期，也不是按年）；<br>· 自代扣之日起 <b>7 日内</b>缴入国库；<br>· 税率 <b>10%</b>；股息利息租金特许权费按<b>收入全额</b>，财产转让按<b>差额</b>（单选 52：(100 + 1000-700)×10% = 40 万）。<br><br>非居民免税的三类利息：外国政府向<b>中国政府</b>贷款、国际金融组织向<b>中国政府和居民企业</b>提供优惠贷款、国务院批准的其他所得。国际金融组织向「非居民企业」贷款、外国政府向「中国居民企业」贷款都不在免税名单（多选 34）。","sentence":"查不清账 → 收入×应税所得率（跨境电商 4%）；查不清劳务费 → 不低于合同总价 10%；境外 passive income → 支付人按 10% 源泉扣缴，全额或差额看所得类型。","trap":"· 核定征收的<b>小型微利企业照样能享受优惠</b>；<br>· 源泉扣缴时点是「<b>支付或到期应支付</b>」，不是合同约定日期；<br>· 扣缴税率 10%、解缴 7 日、扣缴义务人是支付人——三个数字题常错；<br>· 财产转让所得按<b>差额</b>，股息利息按<b>全额</b>；<br>· 外国政府向中国居民企业贷款的利息<b>不免税</b>。","table":{"head":["情形","替代算法 / 规则","关键数字"],"rows":[["居民企业核定（能查收入）","收入 × 应税所得率 × 25%","单题 15%"],["跨境电商综试区核定","收入 × 4%","4%"],["非居民劳务费未列明","不低于销售合同总价 10%","10%"],["非居民源泉扣缴","支付人代扣，全额或差额计税","10%、7 日"]]},"tips":["「算不清就给法定比例」是这一章的通用套路：核定所得率 4%、劳务费 10%、限售股原值 15%、委托境外研发 80%。"],"qs":[32,33,34,35,52,34]},{"id":"4-17","name":"利息与借款费用：四个维度、债资比、资本化","star":"★★★","level":"L3","scene":"公司借钱付了 200 万利息，税法只允许扣 120 万。为什么？<br><br>因为借钱这件事，税法先要判断<b>「这是不是一笔正常的借钱」</b>，再判断<b>「钱用到哪儿去了」</b>。","why":"<b>第一问：钱从谁那儿来、给谁付</b>——四个维度：<br>① <b>据实扣除</b>：非金融企业向金融企业借款、金融企业存款利息、金融企业同业拆借、经批准发行债券的利息；<br>② <b>单一限额</b>：非金融企业向非关联方借款、付给无关联自然人 → 本金 × 金融企业同期同类贷款利率；<br>③ <b>双限额</b>：付给<b>关联方</b> → 「权益性投资 ×2（非金融企业）/×5（金融企业）」与「借款本金」取小，再 × 同期同类利率；<br>④ <b>不得扣除</b>：非银行企业内营业机构之间支付的利息。<br><br>为什么关联方要加一道<b>债资比</b>？因为关联方可以随意把「本该投进来的股本」包装成「借款」，用利息把利润提前抽走（资本弱化）。设 2:1 就是划一条线：股本 1000 万，最多认 2000 万的债，超出的 1000 万对应利息不许扣。单选 42：1000×2=2000，2000×6%=120 万。<br><br><b>第二问：钱花在哪儿</b>——为购置建造固定资产、无形资产、以及<b>经过 12 个月以上建造</b>才达到可销售状态的存货，在<b>建造期间</b>的借款费用要<b>资本化</b>进资产成本（以后通过折旧摊销扣）；资产<b>交付使用后</b>发生的利息、以及日常经营不需要资本化的借款费用，才在当期扣（多选 11）。<br><br>同一逻辑还管着<b>金融企业贷款损失准备金</b>：只有「承担风险和损失」的贷款类资产才能按年末余额 1% 计提扣除；<b>委托贷款、代理贷款、国债投资、应收股利、上交央行准备金、剥离的债权股权、应收财政贴息</b>等不承担风险的资产，一律不得提取（多选 12）。","sentence":"先分四维（据实 / 单一限额 / 双限额 / 不得扣），再看用途（建造期间资本化、交付使用后当期扣）；关联方债资比非金融 2:1、金融 5:1。","trap":"· 双限额是「权益投资×倍率」与「借款本金」<b>取小</b>后乘利率，不是直接乘利率；<br>· 资本化门槛是建造期 <b>超过 12 个月</b>的存货；普通存货建造期间利息当期扣；<br>· <b>银行</b>企业内营业机构之间支付的利息<b>可以扣</b>，非银行企业不行（多选 13 G、14 G）；<br>· 罚金、被没收财物损失、税收滞纳金不得扣；<b>违约金、银行罚息、诉讼费</b>可以扣；<br>· 非金融企业向金融企业借款利息据实扣除，别误套限额。","table":{"head":["维度","适用","限额"],"rows":[["据实","向金融企业借款、同业拆借、发债","无"],["单一限额","向非关联方 / 无关联自然人","本金 × 同期同类利率"],["双限额","关联方借款","min(权益×2或5, 本金) × 利率"],["不得扣","非银行企业内机构间利息","—"]]},"tips":["关联方借款题先画两个数：权益投资额 ×2、实际借款额，取小的那个再乘利率。"],"qs":[42,11,12]},{"id":"4-18","name":"亏损弥补：5 年、10 年与重组带来的限额","star":"★★","level":"L2","scene":"2019 年亏了 1000 万，到 2024 年还剩 40 万没补完，2025 年赚了 1600 万——这 40 万还能不能抵？<br><br><b>不能。</b>一般企业亏损最长结转 <b>5 年</b>，2019 年的亏损只能用 2020–2024 年的所得补，2025 年已过期；直接 1800×25%=450 万（单选 45）。","why":"为什么设期限？因为亏损是「未来的税盾」，无限期结转会让企业长期不纳税，也会让税务机关要保存几十年的凭证。5 年是「给足够长的恢复期、又不让账无限敞着」的折中。<br><br>谁可以延长到 <b>10 年</b>？<b>高新技术企业</b>和<b>科技型中小企业</b>——研发投入大、盈利周期长，5 年不够回本。注意是「具备资格年度<b>之前 5 个年度</b>发生的尚未弥补完的亏损」延长，不是所有亏损自动 10 年（多选 15）。<br><br>还有一个容易混的点：<b>被投资企业的亏损由被投资企业自己结转</b>，投资企业不能拿去抵（单选 16 D）；只有<b>企业合并</b>且适用特殊性税务处理时，被合并企业亏损才可由合并企业在限额内弥补（见 4-12）。<br><br>筹办期间的费用<b>不得计算为当期亏损</b>——企业还没开始经营，谈不上「经营亏损」；可以在开始经营当年一次性扣除，或作为长期待摊费用不少于 3 年摊销，一经选定不得改变（多选 42）。","sentence":"一般亏损结转 5 年，高新技术企业/科技型中小企业延到 10 年；被投资方亏损不能给投资方用；筹办费不算亏损。","trap":"· 5 年从<b>亏损年度的次年</b>起算，2019 年亏 → 2020–2024；<br>· <b>技术先进型服务企业、西部鼓励类企业</b>不享受 10 年，只有高新技术和科技型中小企业；<br>· 亏损弥补用的是<b>调整后的应纳税所得额</b>，不是会计利润；<br>· 筹办费可选一次性或 ≥3 年摊销，不是 2 年。","tips":["做亏损题先写一行年份轴，把可弥补年度圈出来，再看当年的所得额。"],"qs":[45,15]},{"id":"4-19","name":"资产损失与税前扣除凭证：拿什么证明钱真的花了","star":"★★★","level":"L3","scene":"仓库里 40 万的原材料被盗，保险赔 25 万、管理员赔 8 万，进项税已抵扣过。税法允许扣多少？<br><br>答案 12.2 万 = 40 + <b>5.2（进项转出）</b> - 25 - 8。很多人漏掉那 5.2 万：因为进项税当初抵扣了，现在货没了，这笔税不能再抵，转出来后它<b>也是企业真实的损失</b>，可以一起扣。","why":"资产损失扣除的底层逻辑是<b>「净损失 + 合法性」</b>：只扣企业真正兜下的那部分（要减赔偿），且必须有证据证明这笔支出真实发生、与经营相关。<br><br><b>凭证规则</b>：境内支出属于增值税应税项目、对方是已办理税务登记的纳税人 → 必须凭<b>发票</b>（含税务机关代开）；对方是无需税务登记的单位或小额零星经营的个人 → 可用税务机关代开发票或<b>收款凭证 + 内部凭证</b>（多选 16）。<br><br>如果对方注销、吊销、被认定非正常户，<b>无法补开发票</b>怎么办？税法给一条补救通道：凭资料证实真实性后允许扣除，其中<b>必备三项</b> = ① 无法补开的原因证明 ② 业务合同或协议 ③ <b>非现金</b>方式支付的付款凭证；出入库内部凭证、运输证明、会计核算记录属于补充资料，不是必备（多选 17）。为什么强调非现金？因为现金支付无法第三方验证，最容易虚构交易。<br><br><b>损失认定条件</b>也全是「证据强度」问题：应收账款要债务人死亡遗产不足清偿、债务重组后无法追偿、自然灾害；仅「逾期 1 年未清偿预计难收回」<b>不够</b>，需逾期 <b>3 年以上</b>且有确凿证据无力清偿（多选 21）。股权投资损失要求被投资方依法破产/注销，或连续停止经营 <b>3 年以上</b>且无恢复计划；「投资期限超过 5 年」「清算期超过 1 年」都不达标（要 10 年 / 3 年，多选 22）。<br><br>追补规则：以前年度<b>实际资产损失</b>准予追补至损失发生年度扣除（一般不超过 5 年），多缴的税可在追补确认年度抵扣；<b>法定资产损失</b>则在申报年度扣除（多选 23）。已扣除的损失以后又收回的，计入<b>收回当期</b>收入，不是原损失年度。","sentence":"净损失 = 成本 + 不得抵扣的进项转出 - 保险赔款 - 责任人赔偿；扣除凭证以发票为主，补不开票
