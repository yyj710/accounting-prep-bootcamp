<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>税法 CPA 复习站</title>
<style>
*,*::before,*::after{box-sizing:border-box}
:root{
  --bg:#f6f3ec; --panel:#fffdf8; --panel2:#f1ece1; --ink:#1b232e; --ink2:#3c4757;
  --muted:#6d7686; --line:#e4ddd0; --line2:#eee8dc;
  --brand:#1f3a5f; --brand-soft:#e9eef5; --accent:#b0392c; --accent-soft:#fbeeec;
  --ok:#2e7d55; --ok-soft:#e9f4ed; --gold:#a9761c; --gold-soft:#fbf3e0;
  --shadow:0 1px 2px rgba(27,35,46,.05),0 10px 28px -18px rgba(27,35,46,.3);
  --r:14px; --sidebar:280px;
}
html[data-theme=dark]{
  --bg:#12161a; --panel:#1a1f25; --panel2:#222831; --ink:#e9e5dd; --ink2:#c6c2b8;
  --muted:#949ca8; --line:#2c333c; --line2:#252b33;
  --brand:#9dc0e8; --brand-soft:#1d2a3a; --accent:#e07a6b; --accent-soft:#33211f;
  --ok:#7bc48f; --ok-soft:#1c2c22; --gold:#dcb264; --gold-soft:#2e2718;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px -18px rgba(0,0,0,.7);
}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);overflow-x:hidden;
  font:15px/1.8 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
a{color:var(--brand);text-decoration:none}
h1,h2,h3,h4{line-height:1.45;margin:0}
p{margin:0 0 .8em}
p:last-child{margin-bottom:0}

/* layout */
.layout{display:flex;min-height:100vh}
.sidebar{position:fixed;inset:0 auto 0 0;width:var(--sidebar);z-index:40;display:flex;flex-direction:column;
  background:var(--panel);border-right:1px solid var(--line);transition:transform .24s ease}
.brand{display:flex;gap:11px;align-items:center;padding:18px 18px 16px;border-bottom:1px solid var(--line2)}
.brand-mark{width:40px;height:40px;flex:none;border-radius:11px;display:grid;place-items:center;
  background:var(--brand);color:#fff;font-weight:700;font-size:13px;letter-spacing:.5px;line-height:1.1;text-align:center}
html[data-theme=dark] .brand-mark{color:#12161a}
.brand b{display:block;font-size:15.5px;letter-spacing:.3px}
.brand span{display:block;font-size:11.5px;color:var(--muted)}
.nav{flex:1;overflow-y:auto;padding:12px 10px 24px}
.nav::-webkit-scrollbar{width:8px}
.nav::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px}
.nav-group{margin:16px 0 6px;padding:0 10px;font-size:10.5px;font-weight:700;letter-spacing:1.5px;color:var(--muted)}
.nav-item{display:flex;align-items:center;gap:9px;width:100%;text-align:left;padding:9px 10px;
  border-radius:9px;color:var(--ink2);font-size:14px;line-height:1.4;transition:background .12s}
.nav-item:hover{background:var(--panel2);color:var(--ink)}
.nav-item.active{background:var(--brand-soft);color:var(--brand);font-weight:600}
.nav-item .num{margin-left:auto;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.nav-item.locked{opacity:.45;cursor:default}
.nav-sub{display:none;padding:2px 0 6px 24px}
.nav-course.open .nav-sub{display:block}
.nav-sub button{display:block;width:100%;text-align:left;padding:6px 9px;border-radius:7px;
  font-size:12.5px;color:var(--muted);line-height:1.5;transition:background .12s}
.nav-sub button:hover{background:var(--panel2);color:var(--ink)}
.nav-sub button.on{color:var(--brand);font-weight:600;background:var(--brand-soft)}
.side-foot{padding:12px 16px 16px;border-top:1px solid var(--line2)}
.prog{height:6px;border-radius:99px;background:var(--line2);overflow:hidden}
.prog i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--brand),var(--ok));transition:width .4s}
.ptxt{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);margin-top:6px;font-variant-numeric:tabular-nums}

.main{flex:1;min-width:0;max-width:100vw;margin-left:var(--sidebar)}
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;padding:10px 22px;
  background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.search{position:relative;flex:1;min-width:0;max-width:460px}
.search input{width:100%;min-width:0;padding:9px 12px 9px 32px;border-radius:10px;border:1px solid var(--line);
  background:var(--panel);color:var(--ink);font-size:13.5px;outline:none;transition:.15s}
.search input:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.search .lens{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:12px}
.icon-btn{width:36px;height:36px;flex:none;border-radius:9px;display:grid;place-items:center;color:var(--ink2);font-size:15px}
.icon-btn:hover{background:var(--panel2)}
#menuBtn{display:none}
#view{padding:28px 22px 100px;max-width:880px;margin:0 auto}
.scrim{display:none;position:fixed;inset:0;background:rgba(10,14,18,.45);z-index:35}
.scrim.on{display:block}

/* typography */
.sub{color:var(--muted);font-size:13px}
.crumb{font-size:12.5px;color:var(--muted);margin-bottom:14px;letter-spacing:.3px}
.crumb b{color:var(--ink2);font-weight:600}
h1.title{font-size:25px;letter-spacing:-.3px;margin-bottom:8px}
h1.title .pn{font-family:ui-monospace,monospace;font-size:14px;color:var(--accent);margin-right:8px;vertical-align:2px}
.tag{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:99px;font-size:11.5px;
  font-weight:600;letter-spacing:.3px;background:var(--panel2);color:var(--ink2);border:1px solid var(--line)}
.tag.lv3{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.tag.lv2{background:var(--brand-soft);color:var(--brand);border-color:transparent}
.tag.lv1{background:var(--panel2);color:var(--muted)}
.tag.star{background:var(--gold-soft);color:var(--gold);border-color:transparent}

/* cards */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:20px 22px;
  box-shadow:var(--shadow);margin-bottom:16px}
.card.plain{box-shadow:none}
.card-h{display:flex;align-items:center;gap:8px;font-size:11.5px;font-weight:700;letter-spacing:1.2px;
  color:var(--muted);margin-bottom:10px;text-transform:uppercase}
.card-h .dot{width:6px;height:6px;border-radius:99px;background:currentColor;opacity:.6}
.scene{background:var(--brand-soft);border:1px solid color-mix(in srgb,var(--brand) 18%,transparent)}
.scene .card-h{color:var(--brand)}
.why{border-left:3px solid var(--brand)}
.sentence{background:var(--gold-soft);border:1px solid color-mix(in srgb,var(--gold) 30%,transparent)}
.sentence .card-h{color:var(--gold)}
.sentence .big{font-size:16.5px;line-height:1.75;font-weight:600;color:var(--ink)}
.trapcard{border-left:3px solid var(--accent);background:var(--accent-soft)}
.trapcard .card-h{color:var(--accent)}
.tips{background:var(--panel2);border:1px dashed var(--line);font-size:13.5px}
.tips ul{margin:0;padding-left:18px}
.tips li{margin:3px 0}

table.tb{width:100%;border-collapse:collapse;font-size:13.2px;margin:2px 0 4px}
table.tb th,table.tb td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
table.tb th{background:var(--panel2);font-weight:600;color:var(--ink2);font-size:12.5px}
table.tb tr:nth-child(even) td{background:color-mix(in srgb,var(--panel2) 45%,transparent)}
.tb-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}

/* home */
.hero{padding:34px 0 10px}
.hero h1{font-size:30px;letter-spacing:-.5px;line-height:1.35;margin-bottom:12px}
.hero h1 em{font-style:normal;color:var(--accent)}
.hero p{font-size:15px;color:var(--ink2);max-width:600px}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0 26px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 16px;min-width:104px}
.stat b{display:block;font-size:20px;font-variant-numeric:tabular-nums;letter-spacing:-.5px}
.stat span{font-size:11.5px;color:var(--muted)}
.chlist{display:grid;gap:10px}
.chrow{display:flex;align-items:center;gap:14px;padding:15px 18px;background:var(--panel);
  border:1px solid var(--line);border-radius:12px;cursor:pointer;transition:.15s}
.chrow:hover{border-color:var(--brand);transform:translateY(-1px)}
.chrow .no{width:34px;height:34px;flex:none;border-radius:9px;display:grid;place-items:center;
  background:var(--brand-soft);color:var(--brand);font-weight:700;font-size:14px}
.chrow .mid{flex:1;min-width:0}
.chrow .mid b{display:block;font-size:14.5px}
.chrow .mid span{font-size:12px;color:var(--muted)}
.chrow .sc{font-size:12.5px;color:var(--muted);text-align:right;white-space:nowrap}
.chrow .sc b{display:block;font-size:15px;color:var(--ink);font-variant-numeric:tabular-nums}
.chrow.done .no{background:var(--ok-soft);color:var(--ok)}

/* block index */
.mapsec{margin-bottom:14px}
.mapsec h3{font-size:13px;color:var(--muted);font-weight:600;letter-spacing:.5px;margin-bottom:8px}
.mapgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media(max-width:700px){.mapgrid{grid-template-columns:1fr}}
.mapitem{display:flex;align-items:flex-start;gap:9px;padding:11px 13px;background:var(--panel);
  border:1px solid var(--line);border-radius:10px;text-align:left;font-size:13.2px;line-height:1.5;transition:.15s}
.mapitem:hover{border-color:var(--brand)}
.mapitem .st{color:var(--gold);font-size:11px;flex:none;letter-spacing:-1px}

/* questions */
.q{border:1px solid var(--line);border-radius:12px;padding:16px 18px;background:var(--panel);margin-bottom:12px}
.q-head{display:flex;align-items:center;gap:8px;margin-bottom:9px;font-size:11.5px;color:var(--muted)}
.q-no{font-family:ui-monospace,monospace;background:var(--panel2);padding:1px 7px;border-radius:5px;color:var(--ink2)}
.q-stem{font-size:14.6px;line-height:1.8;margin-bottom:12px}
.opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;padding:9px 12px;margin-bottom:7px;
  border:1px solid var(--line);border-radius:9px;font-size:14px;line-height:1.65;transition:.12s;background:transparent}
.opt:hover{border-color:var(--brand);background:var(--brand-soft)}
.opt .k{font-weight:700;color:var(--muted);flex:none}
.opt.sel{border-color:var(--brand);background:var(--brand-soft)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .k{color:var(--ok)}
.opt.wrong{border-color:var(--accent);background:var(--accent-soft)}
.opt.wrong .k{color:var(--accent)}
.opt[disabled]{cursor:default}
.submit{display:inline-block;padding:9px 22px;border-radius:9px;background:var(--brand);color:#fff;
  font-size:14px;font-weight:600;margin-top:4px}
html[data-theme=dark] .submit{color:#12161a}
.submit:disabled{opacity:.4}
.fb{margin-top:14px;padding-top:14px;border-top:1px dashed var(--line)}
.fb .verdict{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:14px;margin-bottom:10px}
.fb .verdict.ok{color:var(--ok)}
.fb .verdict.no{color:var(--accent)}
.fbrow{margin-bottom:10px;font-size:13.8px;line-height:1.8}
.fbrow b{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.8px;padding:1px 7px;
  border-radius:5px;margin-right:7px;vertical-align:1px}
.fbrow.exam b{background:var(--brand-soft);color:var(--brand)}
.fbrow.think b{background:var(--ok-soft);color:var(--ok)}
.fbrow.trap b{background:var(--accent-soft);color:var(--accent)}
.fbrow.raw b{background:var(--panel2);color:var(--muted)}
.fbrow.raw{color:var(--ink2);font-size:13.2px}

/* quiz bar */
.quizbar{position:sticky;top:57px;z-index:20;background:var(--bg);padding:10px 0 14px;
  display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line);margin-bottom:18px}
.quizbar .qb-prog{flex:1;height:5px;border-radius:99px;background:var(--line2);overflow:hidden}
.quizbar .qb-prog i{display:block;height:100%;background:var(--brand);border-radius:99px;transition:width .3s}
.quizbar .qb-txt{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 18px;border-radius:9px;font-size:13.5px;
  font-weight:600;border:1px solid var(--line);background:var(--panel);transition:.15s}
.btn:hover{border-color:var(--brand);color:var(--brand)}
.btn.primary{background:var(--brand);color:#fff;border-color:var(--brand)}
html[data-theme=dark] .btn.primary{color:#12161a}
.btn.ghost{background:transparent}
.actions{display:flex;gap:9px;flex-wrap:wrap;margin:20px 0 8px}
.pager{display:flex;justify-content:space-between;gap:10px;margin-top:26px;padding-top:18px;border-top:1px solid var(--line)}

.empty{text-align:center;padding:60px 20px;color:var(--muted)}
.empty b{display:block;font-size:16px;color:var(--ink2);margin-bottom:6px}

/* ---------- 速查卡 ---------- */
.cs-bar{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:13px 15px;margin-bottom:12px;box-shadow:var(--shadow)}
.cs-bar .row{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-bottom:9px}
.cs-bar .row:last-child{margin-bottom:0}
.cs-bar .lb{font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.6px;margin-right:2px;white-space:nowrap}
.chip{padding:5px 11px;border-radius:99px;border:1px solid var(--line);background:var(--panel);font-size:12.3px;color:var(--ink2);white-space:nowrap;transition:.12s}
.chip:hover{border-color:var(--brand);color:var(--brand)}
.chip.on{background:var(--brand);color:#fff;border-color:var(--brand)}
html[data-theme=dark] .chip.on{color:#12161a}
.cs-search{flex:1;min-width:140px;padding:7px 11px;border-radius:9px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font-size:13px;outline:none}
.cs-search:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.cs-meta{font-size:12px;color:var(--muted);margin:0 0 6px;font-variant-numeric:tabular-nums}
.cs-sec{margin:20px 0 9px;display:flex;align-items:center;gap:10px}
.cs-sec[hidden]{display:none!important}
.cs-sec b{font-size:13.5px;white-space:nowrap}
.cs-sec .ln{flex:1;height:1px;background:var(--line)}
.cs-sec span{font-size:11.5px;color:var(--muted);white-space:nowrap}
.cs-card{background:var(--panel);border:1px solid var(--line);border-radius:10px;margin-bottom:7px;overflow:hidden;break-inside:avoid}
.cs-card[hidden]{display:none!important}
.cs-card.checked{opacity:.48}
.cs-head{display:flex;align-items:flex-start;gap:8px;width:100%;text-align:left;padding:8px 12px;font-size:13.2px;line-height:1.55;cursor:pointer}
.cs-head:hover{background:var(--panel2)}
.cs-check{width:15px;height:15px;flex:none;margin-top:3px;accent-color:var(--ok);cursor:pointer}
.cs-id{font-family:ui-monospace,monospace;font-size:11px;color:var(--accent);background:var(--panel2);padding:2px 6px;border-radius:5px;flex:none}
.cs-name{font-weight:600;flex:1;min-width:0}
.cs-star{color:var(--gold);font-size:10.5px;letter-spacing:-1px;flex:none;white-space:nowrap}
.cs-lv{font-size:10.5px;color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:1px 5px;flex:none}
.cs-cnt{font-size:11px;color:var(--muted);flex:none;font-variant-numeric:tabular-nums;white-space:nowrap}
.cs-sentence{padding:0 12px 9px 30px;font-size:13px;line-height:1.75;color:var(--ink2)}
#view.brief .cs-sentence{display:none}
.cs-detail{display:none;padding:0 12px 12px 30px;border-top:1px dashed var(--line);margin-top:2px;padding-top:9px}
.cs-card.open .cs-detail{display:block}
.cs-lbl{font-size:11px;font-weight:700;letter-spacing:.6px;color:var(--muted);margin:8px 0 4px}
.cs-trap{font-size:12.8px;line-height:1.8;color:var(--ink2)}
.cs-tips{margin:0;padding-left:18px;font-size:12.8px;color:var(--ink2);line-height:1.8}
.cs-detail table.tb{font-size:12px}
.cs-detail table.tb th,.cs-detail table.tb td{padding:5px 7px}
mark.hl{background:var(--gold-soft);color:var(--accent);padding:0 2px;border-radius:3px;font-weight:700}
#view.no-hl mark.hl{background:transparent;color:inherit;font-weight:inherit;padding:0}

/* ---------- 错题冲刺 ---------- */
.sp-kpi{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0 18px}
.sp-kpi .stat{min-width:112px}
.sp-weak{display:flex;gap:11px;align-items:center;padding:10px 13px;background:var(--panel);border:1px solid var(--line);border-radius:10px;margin-bottom:7px}
.sp-weak .rk{width:23px;height:23px;flex:none;border-radius:7px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:11.5px}
.sp-weak .info{flex:1;min-width:0}
.sp-weak .info b{display:block;font-size:13.3px;line-height:1.5}
.sp-weak .info span{font-size:11.5px;color:var(--muted)}
.sp-bar{height:5px;border-radius:99px;background:var(--line2);overflow:hidden;width:76px;flex:none}
.sp-bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.sp-mini{padding:5px 10px;border-radius:8px;border:1px solid var(--line);font-size:12px;background:var(--panel);white-space:nowrap;flex:none}
.sp-mini:hover{border-color:var(--brand);color:var(--brand)}
.sp-src{background:var(--brand-soft);color:var(--brand);border-radius:5px;padding:1px 7px;font-size:11px}
.sp-after{margin-top:14px}
.sp-toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:14px 0 4px}
.sp-note{font-size:13px;line-height:1.9;color:var(--ink2)}

@media(max-width:860px){
  .cs-sentence,.cs-detail{padding-left:14px}
  .cs-star,.cs-lv{display:none}
  .cs-bar .lb{display:none}
  .sp-bar{display:none}
  .sp-weak{flex-wrap:wrap}
  .cs-bar .row:last-child .cs-search{flex:1 1 100%}
  .sidebar{transform:translateX(-100%)}
  .sidebar.open{transform:none}
  .main{margin-left:0}
  #menuBtn{display:grid}
  #view{padding:20px 16px 90px}
  h1.title{font-size:21px}
  .hero h1{font-size:24px}
  .topbar{padding:10px 14px}
}
@media print{
  @page{size:A4;margin:12mm}
  .sidebar,.topbar,.scrim,.cs-bar,.cs-meta,.actions,.pager,.sp-toolbar,.quizbar,.sp-after,.icon-btn{display:none!important}
  .main{margin-left:0}
  #view{padding:0;max-width:none}
  body{background:#fff;color:#000;font-size:10.5px;line-height:1.5}
  .cs-card,.card,.sp-weak{box-shadow:none;break-inside:avoid;page-break-inside:avoid;border-color:#ccc}
  .cs-card .cs-detail{display:block!important}
  #view.brief .cs-sentence{display:block!important}
  .cs-card.checked{opacity:1}
  .cs-sec{margin:12px 0 6px}
  mark.hl{background:#ffe9a8;color:#000}
}
</style>
</head>
<body>
<div class="scrim" id="scrim"></div>
<div class="layout">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-mark">税法<br>CPA</div>
      <div><b>税法复习站</b><span>先讲人话，再做题</span></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">
      <div class="prog"><i id="progBar"></i></div>
      <div class="ptxt"><span id="progTxt">已答 0 题</span><span id="progPct">0%</span></div>
    </div>
  </aside>

  <div class="main">
    <div class="topbar">
      <button class="icon-btn" id="menuBtn" aria-label="菜单">☰</button>
      <div class="search">
        <span class="lens">⌕</span>
        <input id="searchInput" placeholder="搜知识点、法条关键词…（如「特别法」「视同销售」）" autocomplete="off">
      </div>
      <button class="icon-btn" id="wrongBtn" title="错题本">✗</button>
      <button class="icon-btn" id="themeBtn" title="深浅色">◐</button>
    </div>
    <main id="view"></main>
  </div>
</div>

<script>
window.DATA = {"allChapters":[{"id":"ch1","no":1,"name":"税法总论","score":"约 3 分","desc":"税法这台机器的零件图：原则、要素、立法、执法"},{"id":"ch2","no":2,"name":"增值税法","score":"约 20 分","desc":"全书的发动机：环环抵扣，中国第一大税种"},{"id":"ch3","no":3,"name":"消费税法","score":"约 7 分","desc":"只挑 15 类商品，第一次进流通时收一刀"},{"id":"ch4","no":4,"name":"企业所得税法","score":"约 20 分","desc":"对所得征税，税会差异是主战场"},{"id":"ch5","no":5,"name":"个人所得税法","score":"约 10 分","desc":"综合与分类结合，工资、劳务、稿酬、年终奖"}],"chapters":[{"id":"ch1","no":1,"name":"税法总论","score":"2.5","star":"★","tagline":"这一章不考你算数，考你「税法这台机器长什么样」","intro":{"hook":"先说结论：这一章只有 2.5 分，但它是整套税法的说明书。<br><br>后面四章你会不停遇到同一批词——纳税人、征税对象、税率、纳税义务发生时间、税收优惠。这些词全部在这里定义。总论没弄懂，增值税那 20 分你只能靠背，一变形就崩。<br><br>所以别把它当「背诵章节」，把它当<b>零件图</b>：先认识每个零件叫什么、干什么用，后面装机器的时候你才知道自己在拧哪颗螺丝。","exam":"只考客观题（单选 + 多选），近三年 2.5～3.5 分。考点高度集中：税法原则、税法要素、立法机关与法律级次、税收收入划分、国际重复征税。题目不难，但多选题酷爱在「原则归属」和「收入归属」上设套。","passline":"本章验收线：单选 ≥ 95%，多选 ≥ 85%。32 道题里最多错 3 道。"},"blocks":[{"id":"1-1","name":"税收与税法：一个是钱，一个是规矩","star":"★","level":"L2","scene":"你交的每一笔税，背后都有两个东西在同时发生：<b>钱从你口袋流向国家</b>（这是税收），以及<b>国家凭什么能拿走、按什么规矩拿</b>（这是税法）。<br><br>前者是经济现象，后者是法律规范。考试爱在这里玩文字游戏：问「税收的本质」答分配关系，问「税法的本质」答权利义务规范。","why":"为什么必须分开讲？因为一旦混了，后面所有概念都会歪。税收讲究「三性」——强制性、无偿性、固定性，这是它作为分配方式的特征；税法讲究「义务性、综合性」，这是它作为法律规范的特征。<br><br>再往深一层：国家征税靠的是<b>政治权力</b>，不是财产权力。这句话不是背的，是你理解「为什么税收不用还」的钥匙——它不是交易，是强制分配。","sentence":"税收是「钱怎么走」，税法是「凭什么这么走」。国家征税凭政治权力，不凭所有权。","trap":"「税法只调整税务机关与纳税人的关系」——错。它调整的是<b>国家</b>与纳税人之间的关系，税务机关只是代表国家行使。还有「税法属于授权性法规」——错，税法以规定纳税人<b>义务</b>为主，是义务性法规。","table":{"head":["","税收","税法"],"rows":[["范畴","经济范畴","法律范畴"],["本质","国家参与社会产品分配的分配关系","调整征纳双方权利义务的规范总称"],["特征","强制性、无偿性、固定性","义务性、综合性"],["一句话","钱从纳税人流向国家","国家凭政治权力、依法取得这笔钱的规矩"]]},"tips":["税法的「综合性」来自它同时管实体（谁纳多少）和程序（怎么纳、怎么管）。"],"qs":[]},{"id":"1-2","name":"税收法律关系：谁跟谁、为了什么、各自担什么","star":"★★★","level":"L3","scene":"你去税务局申报个税。这一趟里其实发生了三层关系：<br>① <b>谁跟谁</b>——你（纳税主体）和税务局（征税主体）；<br>② <b>为了什么</b>——你那笔工资所得（客体，也就是征税对象）；<br>③ <b>各自担什么</b>——你要如实申报纳税，它要依法征收并为你保密（内容）。","why":"为什么非要拆成三块？因为这是法律关系的通用解剖法：任何法律关系都必须有「主体—客体—内容」三件套，税法只是套用了这个壳。<br><br>拆开之后，很多考题就变成了「这句话在说哪一块」的归类题，不用背也能判。更关键的是理解一句容易被考的话：<b>税法是前提，但税法本身不产生具体关系</b>。法是死的，得有一个「税收法律事实」——比如你开业了、你卖货了、地震把厂子毁了——才会真正生成一段具体的征纳关系。","sentence":"主体是人（征纳双方），客体是物或行为（征税对象），内容是权利义务。税法只是前提，事实才生关系。","trap":"三个高频坑：<br>① 把「纳税人的权利与义务」当成主体——那是<b>内容</b>；<br>② 说「税收法律关系只保护纳税主体」——错，对征纳双方<b>平等保护</b>；<br>③ 说「税法直接产生具体税收法律关系」——错，得有法律事实。<br>还有一个隐蔽的：征纳双方<b>法律地位平等，但权利义务不对等</b>——这两句经常被偷换成「地位不平等」。","table":{"head":["要素","是什么","典型选项长什么样"],"rows":[["主体","征纳双方：各级税务机关/海关 + 纳税人（法人、自然人、其他组织）","「征收税款的税务机关」「取得偶然所得的个人」"],["客体","征税对象：所得、财产、行为","「个体工商户生产经营所得」"],["内容","主体享有的权利和承担的义务","「纳税人必须依法缴纳税款」"]]},"tips":["关系的产生/变更/消灭，靠「税收法律事实」：事件（地震、死亡）+ 行为（开业、停业、转让）。"],"qs":[10,14,15]},{"id":"1-3","name":"税法跟别的法什么关系","star":"★","level":"L1","scene":"税法不是孤岛。它上面站着宪法，旁边挨着行政法、刑法、民法。","why":"记住一条主线就够：税法本质上是<b>公法</b>——命令与服从，不是平等协商。但它在处理税收债权债务、纳税担保这类问题时，会借用民法的规则。所以它是「公法为主、借一点私法」的混合体。","sentence":"宪法是爹（立法依据），行政法是同类，刑法管情节严重，民法可以借用。","trap":"「违反税法就是犯罪」——错。只有情节严重、触犯刑法才构成涉税犯罪，一般违法只承担行政责任。","qs":[]},{"id":"1-4","name":"税法基本原则：4 条，每条都在回答「凭什么」","star":"★★★","level":"L3","scene":"国家要征税，总得讲个道理。这四条就是四套道理：<br><b>法定</b>——有没有法律依据？<b>公平</b>——凭什么他少交我多交？<b>效率</b>——收税别把经济搞坏了、别把征管成本搞高了。<b>实质课税</b>——你换个马甲我就认不出你了？","why":"为什么「法定」是核心？因为它是唯一一条能约束国家自己的原则：没有法律依据，不能征税，也不能随便减免。其余三条是在「有法可依」之后，解决「法该怎么定」的问题。<br><br>「实质课税」听起来抽象，其实是反避税的总开关：你签的合同、搭的架构再漂亮，只要经济实质是避税，照样按实质征。后面第十二章国际反避税、第四章特别纳税调整，全是这条原则的具体化。","sentence":"4 条基本原则全都带「税」字：税收法定、税收公平、税收效率、实质课税。看到不带「税」字的，一律是适用原则。","trap":"最狠的陷阱是「混编」：把「实质课税」塞进适用原则里（多选第 1 题就这么干）。<br>记法：<b>基本原则=带「税」字（4基）；适用原则=不带「税」字（6适）</b>。<br>另一个坑：「禁止无正当理由给特定纳税人优惠」体现的是<b>公平</b>；「有利于资源配置」是效率的<b>经济</b>效率那一面，不是行政效率。","table":{"head":["原则","一句话内核","考试爱怎么考"],"rows":[["税收法定（核心）","要件法定 + 程序合法，无法律则无税收","问「基本原则的核心」；问「包括哪两项内容」"],["税收公平","量能课税，禁止无正当理由的差别对待","把「禁止特惠」挂在公平下面"],["税收效率","经济效率（不扭曲市场）+ 行政效率（省征管成本）","把经济效率偷换成行政效率"],["实质课税","看实质不看形式，反避税的基石","伪装成适用原则混进多选"]]},"tips":["「4 基 6 适」：基本原则 4 条、适用原则 6 条。数字记死，选项一数就知道有没有混。"],"qs":[1,16]},{"id":"1-5","name":"税法适用原则：6 条，每条都在解决「两部法打架听谁的」","star":"★★★","level":"L3","scene":"现实中总会撞车：新法和旧法规定不一样；中央的法和地方的法冲突；一般规定碰上特别规定；实体上你有理，但程序上你还没交钱。<br><br>这六条就是六条「撞车处理规则」。注意它们解决的是<b>适用</b>问题，不是「法该怎么立」的问题。","why":"把六条按「冲突类型」排一下，就不用背了：<br>· 上下级冲突 → <b>法律优位</b>（法律 > 行政法规 > 规章）<br>· 新旧冲突 → <b>新法优于旧法</b>、<b>不溯及既往</b>、<b>实体从旧程序从新</b><br>· 一般与特别冲突 → <b>特别法优于普通法</b><br>· 程序与实体冲突 → <b>程序优于实体</b><br><br>其中最反直觉的是「特别法优于普通法」：它<b>打破效力等级</b>——级别低的特别法，可以压过级别高的普通法。这是本章最爱考的一句。","sentence":"上下听高的，新旧听新的，一般让特别，程序压实体。只有「特别优于普通」能打破等级。","trap":"① 问「打破效力等级的是哪个」→ 特别法优于普通法，别选成法律优位（法律优位恰恰是<b>维护</b>等级）。<br>② 「实体从旧、程序从新」常被写成「程序优于实体」——两者不是一回事：前者讲新旧法怎么衔接，后者讲打官司时先走程序（先把税交了再复议）。<br>③ 「法律优位」冲突时结果是「效力低的<b>无效</b>」，不是「选对纳税人有利的」。第 3 题就是拿这句设套。","table":{"head":["原则","解决什么冲突","关键结论"],"rows":[["法律优位","效力等级","法律 > 行政法规 > 规章；冲突时低效力的无效"],["法律不溯及既往","新旧时间","新法不管新法生效前的行为"],["新法优于旧法","同一事项新旧规定不同","新法优先（第 12 题：印花税减半按新法退）"],["特别法优于普通法","一般 vs 特别","特别优先，且可打破效力等级"],["实体从旧、程序从新","实体/程序衔接","实体不溯及，程序在特定条件下有溯及力"],["程序优于实体","诉讼中的先后","先履行程序义务（如先缴税），才能进复议/诉讼"]]},"tips":["口诀：实体看旧，程序看新；一旦涉诉，程序先行。","「4 基 6 适」— 多选里数一数，混进来的那条一定不属于。"],"qs":[2,3,11,12,1,6]},{"id":"1-6","name":"税法要素：一台机器的 11 个零件","star":"★★★","level":"L3","scene":"任何一个税种，翻开来都是同一套零件：<br>对谁征（纳税人）→ 对什么征（征税对象）→ 具体哪些项目（税目）→ 按什么算（计税依据）→ 乘多少（税率）→ 在哪个环节征（纳税环节）→ 什么时候交（纳税期限/地点）→ 有没有优惠（减免税）→ 违反了怎么办（罚则）。","why":"为什么先讲零件？因为你后面学的每一个税种，都是这套零件的不同参数组合。增值税是「对增值额征，13%/9%/6%」，消费税是「对特定消费品征，生产环节一次性」，企税是「对所得征，25%」。<br><br>把这套零件吃透，后面五章你都是在填同一张表。","sentence":"三大核心要素：纳税人（谁交）、征税对象（对什么交）、税率（交多少）。","trap":"① <b>纳税人 ≠ 负税人</b>：能转嫁的（增值税、消费税）不一致，不能转嫁的（企税、个税）一致。原因只有一个——<b>税负转嫁</b>。<br>② <b>代扣代缴 vs 代收代缴</b>：付钱时代扣（出版社付稿酬扣个税），收钱时代收（受托加工方收加工费时代收消费税）。第 17 题就靠这个分。<br>③ 扣缴义务人<b>不是</b>纳税人。","table":{"head":["要素","解决什么问题","关键点"],"rows":[["纳税义务人","对谁征","法人/自然人；与负税人、扣缴义务人区分"],["征税对象","对什么征","区分税种的<b>根本标志</b>"],["税目","征哪些具体项目（质）","体现征税<b>广度</b>；不是所有税种都有"],["计税依据（税基）","按什么数量算（量）","从价 or 从量；不是税法要素"],["税率","征多少（深度）","衡量税负轻重的标志"],["纳税环节","在流转哪一环征","生产/批发/零售/进口"],["纳税期限","什么时候交","义务发生时间 + 纳税期限 + 缴库期限"],["减免税/罚则/附则","优惠、责任、附属性规定","罚则针对违法行为"]]},"tips":["代扣代缴=付钱时扣；代收代缴=收钱时收。一个字之差，方向相反。"],"qs":[17]},{"id":"1-7","name":"征税对象 / 税目 / 税基：一件事的三个问法","star":"★★★","level":"L3","scene":"以消费税为例：<br>「对什么征税？」→ 对消费品（<b>征税对象</b>）<br>「哪些消费品？」→ 烟、酒、小汽车等 15 类（<b>税目</b>）<br>「按什么算钱？」→ 销售额或销售数量（<b>税基/计税依据</b>）","why":"这三个词是最容易糊成一团的。给你一把刀切开：<br><b>征税对象</b>决定「这是哪种税」，是质的边界；<br><b>税目</b>是征税对象的<b>具体化分类</b>，管「广度」；<br><b>税基</b>是算钱的<b>数量依据</b>，管「量」。<br><br>所以：税目答「质」，税基答「量」，征税对象答「这是哪个税」。","sentence":"征税对象=区分税种的标志；税目=质（广度）；税基=量（算钱）。","trap":"① 「所有税种都必须设税目」——错。企业所得税就没有税目，直接按应纳税所得额乘税率。<br>② 把「税基」当成税法要素——教材明确它<b>不属于</b>税法要素（它是计算依据）。<br>③ 「纳税环节只指生产环节」——错，是从生产到消费的<b>整个流转过程</b>。","table":{"head":["概念","回答的问题","关键词"],"rows":[["征税对象","对什么征税","区分一种税与另一种税的<b>重要标志</b>"],["税目","征哪些具体项目","对课税对象<b>质</b>的界定，体现广度"],["税基（计税依据）","按多少算","对课税对象<b>量</b>的规定，解决计算问题"]]},"qs":[4,5,2]},{"id":"1-8","name":"税率：三种形态，各有各的适用场景","star":"★★★","level":"L3","scene":"同样叫「税率」，形态差很多：<br>卖一辆车按 10% 交（比例）；占一平米地交 30 元（定额）；工资越高，超出的部分按更高档交（累进）。","why":"为什么要有三种？因为它们对应三种不同的调节目的：<br>· <b>比例税率</b>——简单、中性，不干预规模（增值税、企税）<br>· <b>定额税率</b>——不受价格波动影响，适合计量稳定的（土地使用税、车船税）<br>· <b>累进税率</b>——调节收入分配，量能负担（个税、土地增值税）<br><br>累进里还要再分：<b>超额累进</b>只给个人所得税，<b>超率累进</b>只给土地增值税。这两句是送分题。","sentence":"超额累进只配个税，超率累进只配土增。幅度比例只有契税（3%–5%）。","trap":"比例税率还有三个子类，最容易混：<br>· <b>单一</b>比例：车辆购置税 10%、烟叶税 20%<br>· <b>差别</b>比例：增值税（行业差别）、城建税（地区差别）<br>· <b>幅度</b>比例：契税 3%–5%<br>第 18 题就让你把「差别」和「幅度」分开。记住：<b>契税是幅度，不是差别</b>。","table":{"head":["类型","特点","典型税种"],"rows":[["比例·单一","一个税率走天下","车辆购置税 10%、烟叶税 20%"],["比例·差别","按行业或地区分档","增值税（行业）、城建税（地区）"],["比例·幅度","给一个区间，地方定","契税 3%–5%"],["定额","按数量/重量直接定额","城镇土地使用税、车船税、耕地占用税"],["超额累进","分段、超额部分升档","个人所得税"],["超率累进","按增值率分档","土地增值税"]]},"qs":[6,18]},{"id":"1-9","name":"纳税环节 / 期限 / 地点：时间与空间","star":"★","level":"L2","scene":"同一批货，从出厂到你手里要经过生产、批发、零售。在哪个环节交税，结果完全不同。","why":"这是理解增值税和消费税关系的钥匙：<br>· <b>增值税</b>是多环节、环环抵扣——因为它要对「每一环新增的价值」征税；<br>· <b>消费税</b>原则上单一环节（生产/委托加工/进口），因为它要「一次性调节」特定消费，重复征会扭曲价格。<br><br>纳税期限又拆三层：<b>义务发生时间</b>（该不该交了）→ <b>纳税期限</b>（多久汇总一次）→ <b>缴库期限</b>（什么时候必须入库）。三层经常被合并成一个词考你。","sentence":"增值税多环节环环扣，消费税单环节一次收。期限三层：发生时间 → 纳税期限 → 缴库期限。","trap":"「纳税义务发生时间」和「纳税期限」被混用是最常见的错。前者是<b>时点</b>，后者是<b>间隔</b>。","qs":[]},{"id":"1-10","name":"税收立法：谁能定规矩，规矩分几级","star":"★★★","level":"L3","scene":"一个规则从想法变成法律，要过四道门：<b>提议 → 审议 → 通过 → 公布</b>。<br>而谁能定这个规矩，取决于规矩的「重量级」。","why":"为什么要分这么细？因为税收是拿走老百姓钱的事，必须由最有权力的机关定最基本的规则（税收法定）。所以形成了一条清晰的阶梯：<br><b>全国人大及常委会</b> → 税收法律（《个人所得税法》）<br><b>国务院</b> → 税收行政法规（《企业所得税法实施条例》）<br><b>财政部/税务总局/海关总署</b> → 税收部门规章（《消费税暂行条例实施细则》）<br><br>还有个特殊通道：全国人大<b>授权</b>国务院立法，产物叫「暂行条例」，性质上属于授权立法，效力高于行政法规。","sentence":"带「法」的是法律（人大），带「实施条例」的是行政法规（国务院），带「暂行条例实施细则/办法」的是部门规章（部委）。","trap":"① 《消费税暂行条例》不是行政法规，是<b>授权立法</b>（人大授权国务院）。<br>② 《消费税暂行条例实施细则》不是行政法规，是<b>部门规章</b>（财政部+税务总局）。第 5 题四个选项全在这两个点上做文章。<br>③ 我国目前<b>没有</b>统一的税收基本法。","table":{"head":["级次","制定机关","例子"],"rows":[["税收法律","全国人大及其常委会","《个人所得税法》《企业所得税法》《增值税法》"],["授权立法","人大授权国务院","《消费税暂行条例》"],["税收行政法规","国务院","《企业所得税法实施条例》《征管法实施细则》"],["税收部门规章","财政部、税务总局、海关总署","《消费税暂行条例实施细则》"],["地方性法规","地方人大（仅海南、民族自治地区）","—"],["地方规章","省级及以下政府（须有授权）","—"]]},"tips":["命名规律：××法→法律；××法实施条例→行政法规；××暂行条例实施细则→部门规章。"],"qs":[3,5]},{"id":"1-11","name":"18 个税种，14 部法：谁已经「转正」了","star":"★★","level":"L3","scene":"我国有 18 个实体税种，但不是每个都上升成了「法律」。目前 14 个已立法，4 个还停留在暂行条例。","why":"这条为什么重要？因为它是「税收法定原则」的落地进度表。考试就考你：哪些已经是「法」了。<br><br>没立法的 4 个，用一句口诀锁死：<b>「1 流转 3 房地」</b>——消费税（流转）+ 房产税、城镇土地使用税、土地增值税（三个房地产相关）。<br>反过来，剩下的都是已立法，包括很多人以为没有的：<b>增值税、关税、印花税、车船税、耕地占用税</b>。","sentence":"没立法的只有 4 个：1 流转（消费税）+ 3 房地（房产税、城镇土地使用税、土地增值税）。其余 14 个都已立法。","trap":"最大的坑是「关税」和「增值税」：直觉上觉得关税这么老牌应该有法、增值税这么大应该有法——两个都<b>有</b>（增值税法 2026 年 1 月 1 日施行）。反而「消费税」这么大还没立法，最反直觉。","table":{"head":["状态","数量","税种"],"rows":[["尚未立法","4 部","消费税、房产税、城镇土地使用税、土地增值税"],["已经立法","14 部","增值税、企业所得税、个人所得税、车船税、环境保护税、烟叶税、船舶吨税、耕地占用税、车辆购置税、资源税、契税、城市维护建设税、印花税、关税"]]},"qs":[4]},{"id":"1-12","name":"税收执法：谁收、收上来归谁","star":"★★★","level":"L3","scene":"两个征收机关在分工：<br><b>税务机关</b>管 16 个税种（国内增值税、消费税、企税、个税、资源税……）<br><b>海关</b>管关税、船舶吨税，还<b>代征</b>进口环节的增值税和消费税。","why":"钱收上来之后要分账，分账逻辑不是随意的，看这个税「调节的是全国性的事还是地方性的事」：<br>· 关乎主权和全国调控的（关税、消费税、车辆购置税）→ <b>中央固定</b><br>· 和地方民生、土地、环境紧密相关的（房产税、土增税、契税、耕占税、环保税、车船税、烟叶税）→ <b>地方固定</b><br>· 大税种要中央地方一起分（增值税五五、企税和个税六四）→ <b>共享</b>","sentence":"海关只碰四个：关税、船舶吨税（征收），进口环节增值税、消费税（代征）。其余都归税务机关。","trap":"五个高频错点：<br>① <b>海洋石油企业</b>的资源税、企业所得税归<b>中央</b>，不是地方；<br>② 消费税<b>全部</b>归中央，包括海关代征的那部分（不是共享）；<br>③ 证券交易印花税归中央，其余印花税归地方；<br>④ 城建税里，铁路集团、银行总行、保险总公司集中缴纳的部分归中央；<br>⑤ 进口环节增值税归中央，国内增值税才是五五分成。","table":{"head":["归属","税种"],"rows":[["中央固定","关税、船舶吨税、消费税（全部）、车辆购置税、海关代征进口环节增值税和消费税、铁路建设基金营改增"],["地方固定","房产税、土地增值税、契税、城镇土地使用税、耕地占用税、烟叶税、环境保护税、车船税"],["中央地方共享","增值税（50/50）、企业所得税（60/40）、个人所得税（60/40）、资源税（海洋石油归中央）、城建税（铁路/银行总行/保险总公司归中央）、印花税（证券交易归中央）"]]},"tips":["海关 = 2 征 + 2 代征。记住这个数，收入划分题就不会把「船舶吨税」错放给税务机关。"],"qs":[7,7,8,9]},{"id":"1-13","name":"征纳双方的权利义务 + 涉税专业服务","star":"★★","level":"L2","scene":"税务局有它的权力（征、管、查、罚、复议裁决），也有它的义务（宣传、咨询、保密、职责分离）。<br>你（纳税人）有义务（申报、缴款、接受检查），也有权利（知情、保密、减免退税、陈述申辩、复议诉讼、监督检举）。","why":"这一块最好用的记法是<b>「对号入座」</b>：题目里出现的主体是谁，决定了这句话是权利还是义务。<br>「广泛宣传税法、普及纳税知识」——主语只能是税务机关，那是<b>义务</b>。<br>「要求为自己的商业秘密保密」——主语是纳税人，那是<b>权利</b>。<br><br>还有一条常考：税务机关提供纳税咨询是<b>无偿</b>的，不是有偿。","sentence":"看主语定性质：税务机关的动作多是义务（宣传/咨询/保密），纳税人的动作多是权利（保密/减免/申辩）。","trap":"① 「税务机关可以有偿提供纳税咨询」——错，必须无偿。<br>② 把「依法缴纳税款」当成纳税人权利——那是<b>义务</b>。<br>③ 涉税专业服务机构包含：税务师事务所、会计师事务所、律师事务所、代理记账机构、税务代理公司、财税类咨询公司（注意「税务代理公司」也算）。","table":{"head":["涉税专业服务内容","一句话"],"rows":[["纳税申报代办","替你报税"],["一般税务咨询","答疑解惑"],["专业税务顾问","长期陪跑"],["税务合规计划","给你出「符合法规的纳税计划/方案」"],["涉税鉴证","出鉴证报告（如汇算清缴鉴证）"],["纳税情况审查","查你的税务健康度"]]},"qs":[8,13,10,11,12]},{"id":"1-14","name":"国际税收：两个国家同时想收同一笔税","star":"★★","level":"L3","scene":"你在 A 国的公司，从 B 国的子公司分回一笔股息。A 国说「你是我的居民，全球所得都要交税」；B 国说「这钱是在我这赚的，我得先收一道」。两边都伸手——这就是国际重复征税。","why":"重复征税的根子是<b>税收管辖权打架</b>。管辖权有两种：<b>属地</b>（在我地盘赚的，我管）和<b>属人</b>（你是我的居民/公民，我管）。<br>打架的三种组合：居民 vs 地域（最常见）、居民 vs 居民、地域 vs 地域。<br><br>然后按「是不是同一个纳税人」再分两类，这是本章最爱考的辨析：<br>· <b>法律性</b>重复征税：<b>同一个纳税人</b>、同一税源（总分公司）<br>· <b>经济性</b>重复征税：<b>不同纳税人</b>、同一税源（母子公司，公司利润+股东股息被征两次）","sentence":"同一纳税人被两国重复征 = 法律性；不同纳税人（母子公司）被重复征 = 经济性。","trap":"① 「国际税收中所指的国际重复征税一般属于税制性」——错，一般是<b>法律性</b>。<br>② 「经济性重复征税是同一征税主体对不同纳税人的不同税源」——错，是<b>不同征税主体</b>、<b>同一税源</b>。<br>③ 多选第 13 题有「居民管辖权与<b>收入</b>管辖权重叠」这个假选项——没有「收入管辖权」这个概念。","table":{"head":["类型","纳税人","典型情形","成因"],"rows":[["法律性","同一纳税人","总分公司","不同征税原则导致管辖权重叠"],["经济性","不同纳税人","母子公司（利润 + 股息）","股份公司这种经济组织形式"],["税制性","—","同一税源被征多种税","复合税制"]]},"tips":["协定解决重复征税的重点是「经营所得（营业利润）」，靠「常设机构」划分征税权。"],"qs":[9,14,13]}],"questions":[{"no":1,"type":"single","block":"1-4","stem":"税法基本原则的核心是（　）。","opts":{"A":"税收法定原则","B":"税收公平原则","C":"税收效率原则","D":"实质课税原则"},"ans":"A","exam":"考「核心」两个字。四个选项全是基本原则，只有一个能称「核心」。","think":"看到「核心 / 基石 / 灵魂」这类词，直接就往「税收法定」上锁。为什么是它？因为只有它能约束国家自己——没有法律依据就不能征、也不能随便免。","trap":"公平、效率、实质课税看起来也都「很重要」，考官就是用「都重要」来让你犹豫。判断标准不是重不重要，而是「谁给另外三条提供前提」。","raw":"选项A：税收法定原则（也称税收法定主义）是税法基本原则中的核心，其内容包括税收要件法定原则和税务合法性原则。"},{"no":2,"type":"single","block":"1-5","stem":"下列各项税法适用原则中，打破税法效力等级限制的是（　）。","opts":{"A":"法律不溯及既往原则","B":"程序优于实体原则","C":"新法优于旧法原则","D":"特别法优于普通法原则"},"ans":"D","exam":"考「哪条原则允许下级法压上级法」。","think":"「法律优位」维护等级，那反过来「打破等级」的只能是它的对家——特别法优于普通法。记住：级别低的特别法，能压过级别高的普通法。","trap":"C 新法优于旧法最像，但那解决的是「时间先后」，不是「等级」。A 解决的是时间，B 解决的是诉讼中的先后，都不碰等级。","raw":"选项D：对同一事项两部法律分别订有一般和特别规定时，特别规定的效力高于一般规定的效力。特别法优于普通法原则打破了税法效力等级的限制，居于特别法地位的级别比较低的税法，其效力可高于作为普通法的级别比较高的税法。"},{"no":3,"type":"single","block":"1-5","stem":"下列各项中，不符合法律优位原则相关规定的是（　）。","opts":{"A":"税收法律的效力高于税收行政法规的效力","B":"税收行政法规的效力优于税收行政规章的效力","C":"效力低的税法与效力高的税法发生冲突时，应选择更有利于纳税人的税法适用","D":"法律优位原则的作用主要体现在处理不同等级税法的关系上"},"ans":"C","exam":"反向题：找「不符合」的那一个。","think":"法律优位的逻辑是「高的赢，低的直接作废」，不是「谁有利选谁」。C 把「有利于纳税人」塞进来，是把民法的思路搬到了税法上。","trap":"「有利于纳税人」这句话单独看很对，很符合直觉，所以特别容易选进去。但法律优位讲的是效力秩序，冲突结果是低效力规范<b>无效</b>，不是做利弊权衡。","raw":"选项C：效力低的税法与效力高的税法发生冲突时，效力低的税法无效。"},{"no":4,"type":"single","block":"1-7","stem":"下列税法要素中，属于对课税对象质的界定的是（　）。","opts":{"A":"税目","B":"纳税人","C":"税率","D":"计税依据"},"ans":"A","exam":"考「质 vs 量」这一对。","think":"「质」问的是「征哪些具体项目」——这是税目在干的活。「量」问的是「算多少钱」——那是计税依据。","trap":"税率和征税对象最容易被拉进来凑数。税率管「深度」（征多少比例），不是「质」也不是「量」。","raw":"选项A：税目是对征税对象的分类规定，反映具体的征税范围，是对课税对象「质」的界定。"},{"no":5,"type":"single","block":"1-7","stem":"下列税法要素中，属于对课税对象量的规定的是（　）。","opts":{"A":"税目","B":"纳税人","C":"税率","D":"计税依据"},"ans":"D","exam":"和第 4 题是一对，考「量」。","think":"「量」＝按多少算钱＝计税依据（税基）。从价（金额）或从量（数量），都是它。","trap":"税率也参与计算，但它是「乘的那个比例」，不是「被乘的那个数量」。区分点：税率是尺度，计税依据是基数。","raw":"选项D：税基又称为计税依据，是据以计算征税对象应纳税款的直接数量依据，它解决对征税对象课税的计算问题，是对课税对象「量」的规定。"},{"no":6,"type":"single","block":"1-8","stem":"下列各项中，既是计算税额的尺度，也是衡量税负轻重与否的重要标志的是（　）。","opts":{"A":"税目","B":"征税对象","C":"税率","D":"计税依据"},"ans":"C","exam":"考税率的两重身份。","think":"「尺度」＝乘上去的那个数；「衡量税负轻重」＝征得深不深。两个描述都指向税率。这是教材原话，属于必背定义。","trap":"计税依据也参与算税额，但它只决定「基数多大」，不决定「负担重不重」——同样 100 万销售额，13% 和 6% 的负担天差地别，差别在税率。","raw":"选项C：税率是对征税对象的征收比例或征收程度，既是计算税额的尺度，也是衡量税负轻重与否的重要标志。"},{"no":7,"type":"single","block":"1-12","stem":"下列各项中，属于税收程序法的是（　）。","opts":{"A":"《中华人民共和国税收征收管理法》","B":"《中华人民共和国企业所得税法》","C":"《中华人民共和国土地增值税暂行条例》","D":"《中华人民共和国城市维护建设税法》"},"ans":"A","exam":"考实体法 vs 程序法。","think":"一句话分：规定「谁交多少」的是实体法，规定「怎么征、怎么管、怎么争议解决」的是程序法。征管法管的就是流程。","trap":"B、C、D 都带「税法/条例」字样，看起来更「实体」也更容易被误认为程序。判断别看法名，看它管什么。","raw":"选项BCD：属于税收实体法。"},{"no":8,"type":"single","block":"1-13","stem":"涉税专业服务机构接受委托，利用专业知识和技能，对纳税人的经营和投资活动提供符合税收法律法规及相关规定的纳税计划的业务是（　）。","opts":{"A":"纳税申报代办","B":"税务合规计划","C":"纳税情况审查","D":"涉税鉴证"},"ans":"B","exam":"考涉税服务的六项业务怎么区分。","think":"抓关键词「纳税计划、纳税方案」——出方案的是「税务合规计划」。其余三项：代办是跑腿、审查是体检、鉴证是出报告。","trap":"「涉税鉴证」听起来最专业，最像「出方案」，但它是出具证明性报告，不是设计计划。","raw":"选项B：税务合规计划是指对纳税人、扣缴义务人的经营和投资活动提供符合税收法律法规及相关规定的纳税计划、纳税方案。"},{"no":9,"type":"single","block":"1-14","stem":"下列各项关于国际重复征税的表述中，正确的是（　）。","opts":{"A":"法律性国际重复征税是指不同的征税主体对同一纳税人的同一税源进行的重复征税","B":"国际税收中所指的国际重复征税一般属于税制性国际重复征税","C":"法律性国际重复征税一般是由于股份公司经济组织形式所引起的","D":"经济性国际重复征税是指同一征税主体对不同纳税人的不同税源进行的重复征税"},"ans":"A","exam":"四个选项分别篡改了三种类型的关键限定词。","think":"先立两根柱子：法律性＝同一纳税人；经济性＝不同纳税人（母子公司）；两者都是「不同征税主体 + 同一税源」。拿这四句去卡每个选项。","trap":"B 把「法律性」换成「税制性」；C 把「经济性」的成因（股份公司）安给了法律性；D 把「不同征税主体、同一税源」篡改成「同一主体、不同税源」——三处都是偷换一个词。","raw":"（1）选项B：国际税收中所指的国际重复征税一般属于法律性国际重复征税。（2）选项C：经济性国际重复征税一般是由于股份公司经济组织形式所引起的。（3）选项D：经济性国际重复征税是指不同的征税主体对不同纳税人的同一税源进行的重复征税。"},{"no":10,"type":"single","block":"1-2","stem":"根据个人所得税法相关规定，下列各项中，属于税收法律关系客体的是（　）。","opts":{"A":"取得偶然所得的个人","B":"个体工商户从事生产经营取得的所得","C":"纳税人必须依照法律法规的规定缴纳税款","D":"征收个人所得税的税务机关"},"ans":"B","exam":"主体 / 客体 / 内容的归类题。","think":"主体是「人」（征纳双方），客体是「物或行为」（所得、财产、行为），内容是「权利义务」。B 是「所得」→ 客体。","trap":"A 的「个人」和 D 的「税务机关」都是人 → 主体；C 的「必须缴纳」是义务 → 内容。这道题四个选项刚好把三要素凑齐，是标准模板题。","raw":"（1）选项AD：属于税收法律关系的主体。（2）选项C：属于税收法律关系的内容。"},{"no":11,"type":"single","block":"1-5","stem":"纳税人在增值税税款的缴纳数额上同税务机关产生争议，提起税务行政复议，但是税务行政复议机关告知，必须在缴纳有争议的税款后，才能受理纳税人的复议申请，这体现了税法适用原则中的（　）。","opts":{"A":"实体从旧、程序从新原则","B":"程序优于实体原则","C":"特别法优于普通法原则","D":"新法优于旧法原则"},"ans":"B","exam":"给一个场景，判断是哪条适用原则。","think":"场景里有两个信号：① 有争议（实体上你有理）；② 但「先交钱才能复议」（程序上必须先走完）。这就是「程序优于实体」——先保证国家税款入库，再解决谁对谁错。","trap":"A「实体从旧、程序从新」最容易被误选，因为它也带「实体/程序」两个词。但那条讲的是新旧法衔接，跟「先交钱后复议」没关系。","raw":"程序优于实体原则是在发生税收争讼时的处理原则，指在诉讼发生时税收程序法优于税收实体法。"},{"no":12,"type":"single","block":"1-5","stem":"2023年9月，某企业按照千分之一的税率自行申报缴纳证券交易印花税，2023年10月该企业发现多缴税额故申请退还已缴纳税款的50%，税务机关查实后退税，这一做法遵循的税法原则是（　）。","opts":{"A":"法律不溯及既往原则","B":"税收效率原则","C":"实质课税原则","D":"新法优于旧法原则"},"ans":"D","exam":"给场景判原则，考点是「新规施行后按新规」。","think":"时间线：2023 年 8 月 28 日起证券交易印花税减半 → 企业 9 月按老税率交 → 10 月按新规退一半。这是「同一事项，新旧规定不同，新法优先」。","trap":"A「不溯及既往」方向正好相反：那条是「新法不管旧行为」。本题行为发生在新规<b>之后</b>，所以适用新法，不是溯及既往。","raw":"新法优于旧法原则强调当新法、旧法对同一事项有不同规定时，新法的效力优于旧法。自2023年8月28日起，证券交易印花税实施减半征收，该企业在2023年9月进行证券交易，应按新法的规定缴纳印花税。"},{"no":13,"type":"single","block":"1-13","stem":"下列各项中，属于纳税人权利的是（　）。","opts":{"A":"要求税务机关为其商业秘密及个人隐私的情况保密","B":"依照法律、行政法规的规定缴纳税款","C":"负责税收征收管理工作","D":"广泛宣传税收法律、行政法规，普及纳税知识"},"ans":"A","exam":"考「看主语定性质」。","think":"B 是缴款 → 义务；C 是征管 → 税务机关的权力；D 是宣传 → 税务机关的义务。只有 A 是纳税人能「要求」的事 → 权利。","trap":"D 的「宣传、普及」听起来像好事，容易被当成纳税人的权利，其实它是税务机关的法定<b>义务</b>。判断关键：这件事是「我能要」还是「他必须做」。","raw":"（1）选项B：属于纳税人的义务。（2）选项C：属于税务机关及税务人员的权利。（3）选项D：属于税务机关及税务人员的义务。"},{"no":14,"type":"single","block":"1-14","stem":"位于A国的股份有限公司M在B国投资设立控股子公司N，2025年子公司N在B国交完企业所得税后按持股比例向母公司M进行利润分配，如果A国对从B国分回的股息进行征税，那么此种国际重复征税类型属于（　）。","opts":{"A":"税制性国际重复征税","B":"法律性国际重复征税","C":"经济性国际重复征税","D":"普遍性国际重复征税"},"ans":"C","exam":"把「母子公司」这个场景翻译成类型。","think":"关键词：<b>母子公司 = 两个独立法律主体 = 不同纳税人</b>。同一笔利润被征两次（N 的企税 + M 收到股息的税）→ 不同纳税人、同一税源 → 经济性。","trap":"看到「重复征税」就选「法律性」是最常见的错。分界线只有一条：<b>是不是同一个纳税人</b>。总分公司是同一个，母子公司不是。","raw":"经济性国际重复征税是指不同的征税主体对「不同纳税人」的同一税源进行的重复征税。母公司M与子公司N都是独立的法律主体，属于不同的纳税人，A国和B国均对「股息」征税，此种国际重复征税类型属于经济性国际重复征税。"},{"no":1,"type":"multi","block":"1-5","stem":"（非标准题）下列各项中，属于税法适用原则的有（　）。","opts":{"A":"法律不溯及既往原则","B":"特别法优于普通法原则","C":"实体从旧、程序从新原则","D":"实质课税原则","E":"税收效率原则","F":"程序优于实体原则","G":"税收法定原则"},"ans":"ABCF","exam":"七选多，考「4 基 6 适」的分家。","think":"口诀一票否决：基本原则 4 条全部带「税」字——税收法定、税收公平、税收效率、实质课税。选项里 D、E、G 都带「税」，直接排除；A、B、C、F 都不带，留下。","trap":"这题的陷阱不是知识点，是<b>数量和心态</b>：七个选项容易让人只挑两三个。多选题错一个选项就整题不得分，所以宁可多确认一遍，也别凭感觉少选。","raw":"选项DEG：属于税法基本原则。准确区分「4基6适」（记忆点：税法基本原则中都有「税」字）。"},{"no":2,"type":"multi","block":"1-7","stem":"下列关于税法要素的表述中，正确的有（　）。","opts":{"A":"征税对象是区别一种税与另一种税的重要标志","B":"纳税环节主要指征税对象在生产环节应当缴纳税款的环节","C":"税基解决对征税对象课税的计算问题，是对课税对象量的规定","D":"我国现行的所有实体税种都需要规定税目"},"ans":"AC","exam":"四个选项各打一个要素的定义，逐个验。","think":"A 对（教材原话）；C 对（税基=量）；B 错在「生产环节」——应该是「从生产到消费的<b>整个流转过程</b>」；D 错在「所有」——企业所得税就不设税目。","trap":"B 和 D 都属于「缩窄/扩大范围」型错误：B 把全过程砍成一段，D 把「部分」说成「所有」。看到「所有/一律/仅」这类绝对词，先警惕。","raw":"（1）选项B：纳税环节主要指征税对象在从生产到消费的流转过程中应当缴纳税款的环节。（2）选项D：并非所有税种都需要规定税目，有些税种不区分课税对象的具体项目。"},{"no":3,"type":"multi","block":"1-10","stem":"下列各项中，属于税收立法原则的有（　）。","opts":{"A":"从实际出发的原则","B":"公平原则","C":"法律的稳定性、连续性与废、改、立相结合的原则","D":"税务机关决策的原则"},"ans":"ABC","exam":"考五条立法原则，用一条假原则做干扰。","think":"五条：从实际出发、公平、民主决策、原则性与灵活性相结合、稳定性连续性与废改立相结合。D 把「民主决策」偷换成「税务机关决策」——立法是人大的事，不是税务机关自己说了算。","trap":"D 改了一个词就变质了。凡是把「民主/人大」换成「税务/部门」的，一律错。","raw":"税收立法原则包括：（1）从实际出发的原则（选项A）。（2）公平原则（选项B）。（3）民主决策的原则。（4）原则性与灵活性相结合的原则。（5）法律的稳定性、连续性与废、改、立相结合的原则（选项C）。"},{"no":4,"type":"multi","block":"1-11","stem":"（非标准题）下列税种中，以国家法律形式发布实施的有（　）。","opts":{"A":"车船税","B":"印花税","C":"房产税","D":"城镇土地使用税","E":"企业所得税","F":"增值税","G":"消费税","H":"个人所得税","I":"关税"},"ans":"ABEFHI","exam":"18 个税种里，哪 14 个已经立法。","think":"用排除法最快：只记没立法的 4 个——「1 流转 3 房地」＝消费税(C 的反面 G)、房产税 C、城镇土地使用税 D、土地增值税（本题没有）。把 G、C、D 排掉，剩下全选。","trap":"最容易漏的是 I 关税和 F 增值税——直觉上觉得「关税这么老应该有吧」「增值税这么大应该有吧」，其实两个都<b>有</b>。最反直觉的是 G 消费税，这么大一个税种至今没立法。","raw":"选项CDG：目前尚未立法。现行的18个实体税种中，有14个税种已经立法，考生可采用排除法记忆。尚未立法（4部）：1流转3房地——消费税、房产税、城镇土地使用税、土地增值税。"},{"no":5,"type":"multi","block":"1-10","stem":"下列各项关于税收立法机关及法律级次的表述中，说法正确的有（　）。","opts":{"A":"《中华人民共和国个人所得税法》属于全国人大制定的税收法律","B":"《中华人民共和国企业所得税法实施条例》属于国务院制定的税收行政法规","C":"《中华人民共和国消费税暂行条例》属于国家税务总局制定的部门规章","D":"《中华人民共和国消费税暂行条例实施细则》属于国务院制定的税收行政法规"},"ans":"AB","exam":"四个选项两两配对，考「暂行条例」和「实施细则」的归属。","think":"按命名规律走：带「法」→ 法律（人大）；带「法实施条例」→ 行政法规（国务院）；带「暂行条例」→ 授权立法（人大授权国务院）；带「暂行条例实施细则」→ 部门规章（部委）。","trap":"C 和 D 是双向错位：C 把「暂行条例」降成部门规章（其实它是授权立法，比行政法规还高），D 把「实施细则」升成行政法规（其实它是部门规章）。这两个名字长得像，必须靠「有没有『实施』两字」区分。","raw":"（1）选项C：《中华人民共和国消费税暂行条例》属于全国人大及其常委会授权国务院制定的暂行条例，属于授权立法。（2）选项D：《中华人民共和国消费税暂行条例实施细则》属于国务院税务主管部门制定的税收部门规章。"},{"no":6,"type":"multi","block":"1-5","stem":"下列关于我国税收执法原则的说法中，正确的有（　）。","opts":{"A":"层次高的法律优于层次低的法律","B":"国内法优于国际法","C":"同一层次的法律中特别法优于普通法","D":"实体法从旧、程序法从新"},"ans":"ACD","exam":"四条执法原则，一条被反向改写。","think":"执法原则就是适用原则的实战版：高层优于低层（A）、同层中特别优于普通（C）、实体从旧程序从新（D）。B 恰恰说反了——是<b>国际法优于国内法</b>。","trap":"B 只调换了两词顺序，读起来非常顺，最容易漏。凡遇到「国际法/国内法」的关系，记一句：条约优先。","raw":"在税收执法过程中，应遵循的原则：（1）层次高的法律优于层次低的法律（选项A）。（2）同一层次的法律中特别法优于普通法（选项C）。（3）国际法优于国内法（而非国内法优于国际法）。（4）实体法从旧、程序法从新（选项D）。"},{"no":7,"type":"multi","block":"1-12","stem":"下列税种中，由税务机关负责征收和管理的有（　）。","opts":{"A":"环境保护税","B":"船舶吨税","C":"资源税","D":"耕地占用税"},"ans":"ACD","exam":"考「海关碰哪四个」。","think":"海关只碰四个：关税、船舶吨税（征），进口环节增值税、消费税（代征）。B 船舶吨税在名单里，排除，剩下全选。","trap":"船舶吨税名字里带「税」，又跟船有关，容易跟车船税混。车船税归税务机关，船舶吨税归海关——一字之差，机关不同。","raw":"选项B：由海关负责征收和管理。"},{"no":8,"type":"multi","block":"1-12","stem":"（非标准题）下列各项中，其收入全部作为中央政府固定收入的有（　）。","opts":{"A":"消费税","B":"个人所得税","C":"企业所得税","D":"房产税","E":"车辆购置税","F":"船舶吨税","G":"环境保护税","H":"车船税","I":"进口环节增值税","J":"资源税"},"ans":"AEFI","exam":"十选多，收入划分的硬核对。","think":"中央固定收入的口径：关乎主权和全国调控的——消费税 A、车辆购置税 E、船舶吨税 F、进口环节增值税 I（还有关税、海关代征进口消费税，本题未列）。B、C、J 是共享，D、G、H 是地方。","trap":"① I 进口环节增值税容易漏，因为「增值税」整体是共享的——但<b>进口环节</b>那一块归中央；② J 资源税是共享（海洋石油归中央，其余归地方），不是中央固定。","raw":"（1）选项BCJ：属于中央、地方共享收入。（2）选项DGH：属于地方政府固定收入。"},{"no":9,"type":"multi","block":"1-12","stem":"下列各项关于税收收入划分的表述中，正确的有（　）。","opts":{"A":"海洋石油企业缴纳的资源税属于地方政府固定收入","B":"证券交易印花税全部属于中央政府固定收入","C":"税务机关征收的消费税属于中央政府、地方政府共享收入","D":"车辆购置税属于中央政府固定收入"},"ans":"BD","exam":"四个选项打四个不同的划分口径。","think":"A 错：海洋石油的资源税归<b>中央</b>。B 对：证券交易印花税归中央，其余印花税归地方。C 错：消费税<b>全部</b>归中央，不共享。D 对。","trap":"C 的干扰力最强，因为它加了限定语「税务机关征收的」，让人以为「海关代征的那部分另算」。实际上消费税无论谁征，全部归中央。","raw":"（1）选项A：海洋石油企业缴纳的资源税属于中央政府固定收入。（2）选项C：消费税（包括税务机关征收及进口环节海关代征的全部消费税）属于中央政府固定收入。"},{"no":10,"type":"multi","block":"1-13","stem":"下列各项关于税务权利和义务的表述中，正确的有（　）。","opts":{"A":"任何单位和个人都有权检举违反税收法律、行政法规的行为","B":"税务机关应为检举人保密，并按照规定给予奖励","C":"税务机关可以有偿地为纳税人提供纳税咨询服务","D":"纳税人、扣缴义务人必须接受税务机关依法进行的税务检查"},"ans":"ABD","exam":"三条对、一条改了一个字。","think":"C 的「有偿」是唯一的错点——税务机关提供纳税咨询必须<b>无偿</b>。A、B、D 都是教材原文。","trap":"这种题不需要判断四条，只需要找出被改的那一条。「有偿/无偿」「可以/应当」「必须/可以」是税法多选题最爱的三个改写位。","raw":"选项C：税务机关应当广泛宣传税收法律、行政法规，普及纳税知识，无偿地为纳税人提供纳税咨询服务。"},{"no":11,"type":"multi","block":"1-13","stem":"下列业务中，属于涉税专业服务内容的有（　）。","opts":{"A":"专业税务顾问","B":"纳税情况审查","C":"一般税务咨询","D":"涉税鉴证"},"ans":"ABCD","exam":"六项服务内容，全选型。","think":"六项：纳税申报代办、一般税务咨询、专业税务顾问、税务合规计划、涉税鉴证、纳税情况审查。四个选项都在里面。","trap":"这类「全选」题反而容易因为不敢全选而丢分。判断依据：只要它属于「涉税专业服务机构能承接的业务」，就选。","raw":"涉税专业服务内容包括纳税申报代办、一般税务咨询（选项C）、专业税务顾问（选项A）、税务合规计划、涉税鉴证（选项D）、纳税情况审查（选项B）、其他税务事项代办和其他税务代理。"},{"no":12,"type":"multi","block":"1-13","stem":"下列各项中，属于涉税专业服务机构的有（　）。","opts":{"A":"会计师事务所","B":"税务代理公司","C":"税务师事务所","D":"代理记账机构"},"ans":"ABCD","exam":"考「机构」清单，不是「业务」清单。","think":"六类机构：税务师事务所、会计师事务所、律师事务所、代理记账机构、税务代理公司、财税类咨询公司。四个都在。","trap":"「代理记账机构」最容易被认为「档次不够」而排除。它确实属于涉税专业服务机构，只是业务范围偏基础。","raw":"涉税专业服务机构是指税务师事务所（选项C）和提供涉税专业服务的会计师事务所（选项A）、律师事务所、代理记账机构（选项D）、税务代理公司（选项B）、财税类咨询公司以及其他提供涉税专业服务的机构。"},{"no":13,"type":"multi","block":"1-14","stem":"依据税收管辖权相互重叠的形式，国际重复征税的产生主要包括（　）。","opts":{"A":"居民管辖权与地域管辖权的重叠","B":"公民管辖权与公民管辖权的重叠","C":"地域管辖权与地域管辖权的重叠","D":"居民管辖权与收入管辖权的重叠"},"ans":"ABC","exam":"三种重叠形式，混进一个不存在的概念。","think":"三种：居民 vs 地域（最常见）、居民 vs 居民（公民 vs 公民）、地域 vs 地域。D 里的「收入管辖权」根本不存在——只有居民、公民、地域三种管辖权。","trap":"D 造了一个听着很像的术语。凡是选项里出现「收入管辖权」「来源管辖权」这类自创名词，直接判错。","raw":"依据税收管辖权相互重叠的形式，国际重复征税的产生主要有下述几种情形：（1）居民（公民）管辖权同地域管辖权的重叠（选项A）。（2）居民（公民）管辖权与居民（公民）管辖权的重叠（选项B）。（3）地域管辖权与地域管辖权的重叠（选项C）。"},{"no":14,"type":"multi","block":"1-2","stem":"下列关于税收法律关系的表述中，正确的有（　）。","opts":{"A":"税收法律关系保护的是纳税主体，而非征税主体","B":"税法是引起税收法律关系的前提条件，税法产生具体的税收法律关系","C":"税收法律关系的内容是税法的灵魂","D":"税收法律关系的客体是征税对象"},"ans":"CD","exam":"四个选项，两错两对，错在「偏」和「过」。","think":"A 错在「只保护一方」——对征纳双方<b>平等保护</b>；B 错在后半句——税法只是前提，<b>产生</b>具体关系的是法律事实。C、D 是教材原话。","trap":"B 的前半句完全正确，后半句才错。这种「半对半错」是本章最爱的手法，读题必须读到句号。","raw":"（1）选项A：税收法律关系的保护对权利主体双方是平等的，不能只对一方保护，而对另一方不予保护。（2）选项B：税法是引起税收法律关系的前提条件，但税法本身并不能产生具体的税收法律关系，税收法律关系的产生、变更与消灭由税收法律事实来决定。"},{"no":15,"type":"multi","block":"1-2","stem":"下列各项中，属于税收法律关系主体的有（　）。","opts":{"A":"增值税的纳税人","B":"征收进口增值税的海关","C":"征收税款的税务机关","D":"纳税人所享有的权利"},"ans":"ABC","exam":"主体是「人」，考能不能认出「人」。","think":"主体＝征纳双方。A 纳税人（纳方）、B 海关（征方）、C 税务机关（征方），都是人。D 是权利 → 内容。","trap":"B 海关是「征税主体」这件事容易被忽略——很多人只记得税务机关。凡是代表国家行使征税职责的机关（税务机关 + 海关）都是征税主体。","raw":"（1）选项ABC：税收法律关系的主体包括征纳双方，一方是国家以及代表国家行使征税职责的国家各级税务机关和海关，另一方是履行纳税义务的法人、自然人和其他组织。（2）选项D：属于税收法律关系的内容。"},{"no":16,"type":"multi","block":"1-4","stem":"下列关于税法原则的表述中，正确的有（　）。","opts":{"A":"制定税法时禁止在没有正当理由的情况下给予特定纳税人特别优惠，这一做法体现了税收公平原则","B":"税法的制定要有利于资源的有效配置和经济体制的有效运行，这体现了税收效率原则对行政效率的要求","C":"实体税法不具备溯及力、程序性税法在特定条件下具备一定溯及力体现了程序优于实体原则","D":"税收法定原则包括税收要件法定原则和税务合法性原则"},"ans":"AD","exam":"四条原则一一对应，两条被「错配」。","think":"A 对（公平＝禁止无正当理由的差别对待）；D 对（法定＝要件法定 + 税务合法性）；B 错在把「资源配置」归到<b>行政</b>效率（那是经济效率）；C 错在把「实体从旧程序从新」说成「程序优于实体」。","trap":"B 和 C 都是「内容对、名字错」——描述的现象是真的，但挂错了原则名。这类错误比事实错误更隐蔽，必须把每条原则的内核记准。","raw":"（1）选项B：税收效率原则包括两个方面，一是指经济效率，要求税法的制定要有利于资源的有效配置和经济体制的有效运行；二是指行政效率，要求提高税收行政效率，节约税收征管成本。（2）选项C：实体税法不具备溯及力，程序性税法在特定条件下具备一定溯及力体现了实体从旧、程序从新原则。"},{"no":17,"type":"multi","block":"1-6","stem":"以下关于税法要素的表述中，正确的有（　）。","opts":{"A":"支付给作者稿酬的单位属于个人所得税代扣代缴义务人","B":"受托加工应税消费品的单位属于消费税代扣代缴义务人","C":"取得工资、薪金所得的个人为个人所得税纳税人","D":"销售交强险的保险机构属于车船税代收代缴义务人"},"ans":"ACD","exam":"代扣代缴 vs 代收代缴，一字之差。","think":"代扣＝<b>支付</b>款项时扣（出版社付稿酬、单位发工资）；代收＝<b>收取</b>款项时收（受托加工方收加工费时收消费税、保险机构卖交强险时收车船税）。B 说「代扣」→ 错，应该是代收。","trap":"B 的干扰在于「受托加工应税消费品」这个场景完全正确，只有「代扣」两个字错了。做题时先认出场景，再核对是扣还是收。","raw":"选项B：受托加工应税消费品的单位属于消费税代收代缴义务人。代扣代缴义务发生在「支付」款项时，代收代缴义务发生在「收取」款项时。"},{"no":18,"type":"multi","block":"1-8","stem":"（非标准题）下列实体税种中，适用差别比例税率的有（　）。","opts":{"A":"契税","B":"土地增值税","C":"城市维护建设税","D":"增值税","E":"车辆购置税","F":"烟叶税"},"ans":"CD","exam":"把「差别比例」和「幅度比例／单一比例」分开。","think":"差别＝按行业或地区分档：增值税（行业差别）、城建税（地区差别）。A 契税是<b>幅度</b>比例（3%–5%，由地方在区间内定）；B 是超率累进；E、F 是单一比例。","trap":"契税是最容易误选的——「3%–5% 由地方定」听起来就像「差别」，但教材把它归为<b>幅度</b>比例。区别在于：差别是「按类别分档」，幅度是「给区间自己选」。","raw":"（1）选项A：适用幅度比例税率。（2）选项B：适用超率累进税率。（3）选项C：适用地区差别比例税率。（4）选项D：适用行业差别比例税率。（5）选项EF：适用单一比例税率。"}],"notes":{"blocks":[{"id":"1-1","name":"税收与税法：一个是钱，一个是规矩","star":"★","level":"L2","scene":"你交的每一笔税，背后都有两个东西在同时发生：<b>钱从你口袋流向国家</b>（这是税收），以及<b>国家凭什么能拿走、按什么规矩拿</b>（这是税法）。<br><br>前者是经济现象，后者是法律规范。考试爱在这里玩文字游戏：问「税收的本质」答分配关系，问「税法的本质」答权利义务规范。","why":"为什么必须分开讲？因为一旦混了，后面所有概念都会歪。税收讲究「三性」——强制性、无偿性、固定性，这是它作为分配方式的特征；税法讲究「义务性、综合性」，这是它作为法律规范的特征。<br><br>再往深一层：国家征税靠的是<b>政治权力</b>，不是财产权力。这句话不是背的，是你理解「为什么税收不用还」的钥匙——它不是交易，是强制分配。","sentence":"税收是「钱怎么走」，税法是「凭什么这么走」。国家征税凭政治权力，不凭所有权。","trap":"「税法只调整税务机关与纳税人的关系」——错。它调整的是<b>国家</b>与纳税人之间的关系，税务机关只是代表国家行使。还有「税法属于授权性法规」——错，税法以规定纳税人<b>义务</b>为主，是义务性法规。","table":{"head":["","税收","税法"],"rows":[["范畴","经济范畴","法律范畴"],["本质","国家参与社会产品分配的分配关系","调整征纳双方权利义务的规范总称"],["特征","强制性、无偿性、固定性","义务性、综合性"],["一句话","钱从纳税人流向国家","国家凭政治权力、依法取得这笔钱的规矩"]]},"tips":["税法的「综合性」来自它同时管实体（谁纳多少）和程序（怎么纳、怎么管）。"],"qs":[]},{"id":"1-2","name":"税收法律关系：谁跟谁、为了什么、各自担什么","star":"★★★","level":"L3","scene":"你去税务局申报个税。这一趟里其实发生了三层关系：<br>① <b>谁跟谁</b>——你（纳税主体）和税务局（征税主体）；<br>② <b>为了什么</b>——你那笔工资所得（客体，也就是征税对象）；<br>③ <b>各自担什么</b>——你要如实申报纳税，它要依法征收并为你保密（内容）。","why":"为什么非要拆成三块？因为这是法律关系的通用解剖法：任何法律关系都必须有「主体—客体—内容」三件套，税法只是套用了这个壳。<br><br>拆开之后，很多考题就变成了「这句话在说哪一块」的归类题，不用背也能判。更关键的是理解一句容易被考的话：<b>税法是前提，但税法本身不产生具体关系</b>。法是死的，得有一个「税收法律事实」——比如你开业了、你卖货了、地震把厂子毁了——才会真正生成一段具体的征纳关系。","sentence":"主体是人（征纳双方），客体是物或行为（征税对象），内容是权利义务。税法只是前提，事实才生关系。","trap":"三个高频坑：<br>① 把「纳税人的权利与义务」当成主体——那是<b>内容</b>；<br>② 说「税收法律关系只保护纳税主体」——错，对征纳双方<b>平等保护</b>；<br>③ 说「税法直接产生具体税收法律关系」——错，得有法律事实。<br>还有一个隐蔽的：征纳双方<b>法律地位平等，但权利义务不对等</b>——这两句经常被偷换成「地位不平等」。","table":{"head":["要素","是什么","典型选项长什么样"],"rows":[["主体","征纳双方：各级税务机关/海关 + 纳税人（法人、自然人、其他组织）","「征收税款的税务机关」「取得偶然所得的个人」"],["客体","征税对象：所得、财产、行为","「个体工商户生产经营所得」"],["内容","主体享有的权利和承担的义务","「纳税人必须依法缴纳税款」"]]},"tips":["关系的产生/变更/消灭，靠「税收法律事实」：事件（地震、死亡）+ 行为（开业、停业、转让）。"],"qs":[10,14,15]},{"id":"1-3","name":"税法跟别的法什么关系","star":"★","level":"L1","scene":"税法不是孤岛。它上面站着宪法，旁边挨着行政法、刑法、民法。","why":"记住一条主线就够：税法本质上是<b>公法</b>——命令与服从，不是平等协商。但它在处理税收债权债务、纳税担保这类问题时，会借用民法的规则。所以它是「公法为主、借一点私法」的混合体。","sentence":"宪法是爹（立法依据），行政法是同类，刑法管情节严重，民法可以借用。","trap":"「违反税法就是犯罪」——错。只有情节严重、触犯刑法才构成涉税犯罪，一般违法只承担行政责任。","qs":[]},{"id":"1-4","name":"税法基本原则：4 条，每条都在回答「凭什么」","star":"★★★","level":"L3","scene":"国家要征税，总得讲个道理。这四条就是四套道理：<br><b>法定</b>——有没有法律依据？<b>公平</b>——凭什么他少交我多交？<b>效率</b>——收税别把经济搞坏了、别把征管成本搞高了。<b>实质课税</b>——你换个马甲我就认不出你了？","why":"为什么「法定」是核心？因为它是唯一一条能约束国家自己的原则：没有法律依据，不能征税，也不能随便减免。其余三条是在「有法可依」之后，解决「法该怎么定」的问题。<br><br>「实质课税」听起来抽象，其实是反避税的总开关：你签的合同、搭的架构再漂亮，只要经济实质是避税，照样按实质征。后面第十二章国际反避税、第四章特别纳税调整，全是这条原则的具体化。","sentence":"4 条基本原则全都带「税」字：税收法定、税收公平、税收效率、实质课税。看到不带「税」字的，一律是适用原则。","trap":"最狠的陷阱是「混编」：把「实质课税」塞进适用原则里（多选第 1 题就这么干）。<br>记法：<b>基本原则=带「税」字（4基）；适用原则=不带「税」字（6适）</b>。<br>另一个坑：「禁止无正当理由给特定纳税人优惠」体现的是<b>公平</b>；「有利于资源配置」是效率的<b>经济</b>效率那一面，不是行政效率。","table":{"head":["原则","一句话内核","考试爱怎么考"],"rows":[["税收法定（核心）","要件法定 + 程序合法，无法律则无税收","问「基本原则的核心」；问「包括哪两项内容」"],["税收公平","量能课税，禁止无正当理由的差别对待","把「禁止特惠」挂在公平下面"],["税收效率","经济效率（不扭曲市场）+ 行政效率（省征管成本）","把经济效率偷换成行政效率"],["实质课税","看实质不看形式，反避税的基石","伪装成适用原则混进多选"]]},"tips":["「4 基 6 适」：基本原则 4 条、适用原则 6 条。数字记死，选项一数就知道有没有混。"],"qs":[1,16]},{"id":"1-5","name":"税法适用原则：6 条，每条都在解决「两部法打架听谁的」","star":"★★★","level":"L3","scene":"现实中总会撞车：新法和旧法规定不一样；中央的法和地方的法冲突；一般规定碰上特别规定；实体上你有理，但程序上你还没交钱。<br><br>这六条就是六条「撞车处理规则」。注意它们解决的是<b>适用</b>问题，不是「法该怎么立」的问题。","why":"把六条按「冲突类型」排一下，就不用背了：<br>· 上下级冲突 → <b>法律优位</b>（法律 > 行政法规 > 规章）<br>· 新旧冲突 → <b>新法优于旧法</b>、<b>不溯及既往</b>、<b>实体从旧程序从新</b><br>· 一般与特别冲突 → <b>特别法优于普通法</b><br>· 程序与实体冲突 → <b>程序优于实体</b><br><br>其中最反直觉的是「特别法优于普通法」：它<b>打破效力等级</b>——级别低的特别法，可以压过级别高的普通法。这是本章最爱考的一句。","sentence":"上下听高的，新旧听新的，一般让特别，程序压实体。只有「特别优于普通」能打破等级。","trap":"① 问「打破效力等级的是哪个」→ 特别法优于普通法，别选成法律优位（法律优位恰恰是<b>维护</b>等级）。<br>② 「实体从旧、程序从新」常被写成「程序优于实体」——两者不是一回事：前者讲新旧法怎么衔接，后者讲打官司时先走程序（先把税交了再复议）。<br>③ 「法律优位」冲突时结果是「效力低的<b>无效</b>」，不是「选对纳税人有利的」。第 3 题就是拿这句设套。","table":{"head":["原则","解决什么冲突","关键结论"],"rows":[["法律优位","效力等级","法律 > 行政法规 > 规章；冲突时低效力的无效"],["法律不溯及既往","新旧时间","新法不管新法生效前的行为"],["新法优于旧法","同一事项新旧规定不同","新法优先（第 12 题：印花税减半按新法退）"],["特别法优于普通法","一般 vs 特别","特别优先，且可打破效力等级"],["实体从旧、程序从新","实体/程序衔接","实体不溯及，程序在特定条件下有溯及力"],["程序优于实体","诉讼中的先后","先履行程序义务（如先缴税），才能进复议/诉讼"]]},"tips":["口诀：实体看旧，程序看新；一旦涉诉，程序先行。","「4 基 6 适」— 多选里数一数，混进来的那条一定不属于。"],"qs":[2,3,11,12,1,6]},{"id":"1-6","name":"税法要素：一台机器的 11 个零件","star":"★★★","level":"L3","scene":"任何一个税种，翻开来都是同一套零件：<br>对谁征（纳税人）→ 对什么征（征税对象）→ 具体哪些项目（税目）→ 按什么算（计税依据）→ 乘多少（税率）→ 在哪个环节征（纳税环节）→ 什么时候交（纳税期限/地点）→ 有没有优惠（减免税）→ 违反了怎么办（罚则）。","why":"为什么先讲零件？因为你后面学的每一个税种，都是这套零件的不同参数组合。增值税是「对增值额征，13%/9%/6%」，消费税是「对特定消费品征，生产环节一次性」，企税是「对所得征，25%」。<br><br>把这套零件吃透，后面五章你都是在填同一张表。","sentence":"三大核心要素：纳税人（谁交）、征税对象（对什么交）、税率（交多少）。","trap":"① <b>纳税人 ≠ 负税人</b>：能转嫁的（增值税、消费税）不一致，不能转嫁的（企税、个税）一致。原因只有一个——<b>税负转嫁</b>。<br>② <b>代扣代缴 vs 代收代缴</b>：付钱时代扣（出版社付稿酬扣个税），收钱时代收（受托加工方收加工费时代收消费税）。第 17 题就靠这个分。<br>③ 扣缴义务人<b>不是</b>纳税人。","table":{"head":["要素","解决什么问题","关键点"],"rows":[["纳税义务人","对谁征","法人/自然人；与负税人、扣缴义务人区分"],["征税对象","对什么征","区分税种的<b>根本标志</b>"],["税目","征哪些具体项目（质）","体现征税<b>广度</b>；不是所有税种都有"],["计税依据（税基）","按什么数量算（量）","从价 or 从量；不是税法要素"],["税率","征多少（深度）","衡量税负轻重的标志"],["纳税环节","在流转哪一环征","生产/批发/零售/进口"],["纳税期限","什么时候交","义务发生时间 + 纳税期限 + 缴库期限"],["减免税/罚则/附则","优惠、责任、附属性规定","罚则针对违法行为"]]},"tips":["代扣代缴=付钱时扣；代收代缴=收钱时收。一个字之差，方向相反。"],"qs":[17]},{"id":"1-7","name":"征税对象 / 税目 / 税基：一件事的三个问法","star":"★★★","level":"L3","scene":"以消费税为例：<br>「对什么征税？」→ 对消费品（<b>征税对象</b>）<br>「哪些消费品？」→ 烟、酒、小汽车等 15 类（<b>税目</b>）<br>「按什么算钱？」→ 销售额或销售数量（<b>税基/计税依据</b>）","why":"这三个词是最容易糊成一团的。给你一把刀切开：<br><b>征税对象</b>决定「这是哪种税」，是质的边界；<br><b>税目</b>是征税对象的<b>具体化分类</b>，管「广度」；<br><b>税基</b>是算钱的<b>数量依据</b>，管「量」。<br><br>所以：税目答「质」，税基答「量」，征税对象答「这是哪个税」。","sentence":"征税对象=区分税种的标志；税目=质（广度）；税基=量（算钱）。","trap":"① 「所有税种都必须设税目」——错。企业所得税就没有税目，直接按应纳税所得额乘税率。<br>② 把「税基」当成税法要素——教材明确它<b>不属于</b>税法要素（它是计算依据）。<br>③ 「纳税环节只指生产环节」——错，是从生产到消费的<b>整个流转过程</b>。","table":{"head":["概念","回答的问题","关键词"],"rows":[["征税对象","对什么征税","区分一种税与另一种税的<b>重要标志</b>"],["税目","征哪些具体项目","对课税对象<b>质</b>的界定，体现广度"],["税基（计税依据）","按多少算","对课税对象<b>量</b>的规定，解决计算问题"]]},"qs":[4,5,2]},{"id":"1-8","name":"税率：三种形态，各有各的适用场景","star":"★★★","level":"L3","scene":"同样叫「税率」，形态差很多：<br>卖一辆车按 10% 交（比例）；占一平米地交 30 元（定额）；工资越高，超出的部分按更高档交（累进）。","why":"为什么要有三种？因为它们对应三种不同的调节目的：<br>· <b>比例税率</b>——简单、中性，不干预规模（增值税、企税）<br>· <b>定额税率</b>——不受价格波动影响，适合计量稳定的（土地使用税、车船税）<br>· <b>累进税率</b>——调节收入分配，量能负担（个税、土地增值税）<br><br>累进里还要再分：<b>超额累进</b>只给个人所得税，<b>超率累进</b>只给土地增值税。这两句是送分题。","sentence":"超额累进只配个税，超率累进只配土增。幅度比例只有契税（3%–5%）。","trap":"比例税率还有三个子类，最容易混：<br>· <b>单一</b>比例：车辆购置税 10%、烟叶税 20%<br>· <b>差别</b>比例：增值税（行业差别）、城建税（地区差别）<br>· <b>幅度</b>比例：契税 3%–5%<br>第 18 题就让你把「差别」和「幅度」分开。记住：<b>契税是幅度，不是差别</b>。","table":{"head":["类型","特点","典型税种"],"rows":[["比例·单一","一个税率走天下","车辆购置税 10%、烟叶税 20%"],["比例·差别","按行业或地区分档","增值税（行业）、城建税（地区）"],["比例·幅度","给一个区间，地方定","契税 3%–5%"],["定额","按数量/重量直接定额","城镇土地使用税、车船税、耕地占用税"],["超额累进","分段、超额部分升档","个人所得税"],["超率累进","按增值率分档","土地增值税"]]},"qs":[6,18]},{"id":"1-9","name":"纳税环节 / 期限 / 地点：时间与空间","star":"★","level":"L2","scene":"同一批货，从出厂到你手里要经过生产、批发、零售。在哪个环节交税，结果完全不同。","why":"这是理解增值税和消费税关系的钥匙：<br>· <b>增值税</b>是多环节、环环抵扣——因为它要对「每一环新增的价值」征税；<br>· <b>消费税</b>原则上单一环节（生产/委托加工/进口），因为它要「一次性调节」特定消费，重复征会扭曲价格。<br><br>纳税期限又拆三层：<b>义务发生时间</b>（该不该交了）→ <b>纳税期限</b>（多久汇总一次）→ <b>缴库期限</b>（什么时候必须入库）。三层经常被合并成一个词考你。","sentence":"增值税多环节环环扣，消费税单环节一次收。期限三层：发生时间 → 纳税期限 → 缴库期限。","trap":"「纳税义务发生时间」和「纳税期限」被混用是最常见的错。前者是<b>时点</b>，后者是<b>间隔</b>。","qs":[]},{"id":"1-10","name":"税收立法：谁能定规矩，规矩分几级","star":"★★★","level":"L3","scene":"一个规则从想法变成法律，要过四道门：<b>提议 → 审议 → 通过 → 公布</b>。<br>而谁能定这个规矩，取决于规矩的「重量级」。","why":"为什么要分这么细？因为税收是拿走老百姓钱的事，必须由最有权力的机关定最基本的规则（税收法定）。所以形成了一条清晰的阶梯：<br><b>全国人大及常委会</b> → 税收法律（《个人所得税法》）<br><b>国务院</b> → 税收行政法规（《企业所得税法实施条例》）<br><b>财政部/税务总局/海关总署</b> → 税收部门规章（《消费税暂行条例实施细则》）<br><br>还有个特殊通道：全国人大<b>授权</b>国务院立法，产物叫「暂行条例」，性质上属于授权立法，效力高于行政法规。","sentence":"带「法」的是法律（人大），带「实施条例」的是行政法规（国务院），带「暂行条例实施细则/办法」的是部门规章（部委）。","trap":"① 《消费税暂行条例》不是行政法规，是<b>授权立法</b>（人大授权国务院）。<br>② 《消费税暂行条例实施细则》不是行政法规，是<b>部门规章</b>（财政部+税务总局）。第 5 题四个选项全在这两个点上做文章。<br>③ 我国目前<b>没有</b>统一的税收基本法。","table":{"head":["级次","制定机关","例子"],"rows":[["税收法律","全国人大及其常委会","《个人所得税法》《企业所得税法》《增值税法》"],["授权立法","人大授权国务院","《消费税暂行条例》"],["税收行政法规","国务院","《企业所得税法实施条例》《征管法实施细则》"],["税收部门规章","财政部、税务总局、海关总署","《消费税暂行条例实施细则》"],["地方性法规","地方人大（仅海南、民族自治地区）","—"],["地方规章","省级及以下政府（须有授权）","—"]]},"tips":["命名规律：××法→法律；××法实施条例→行政法规；××暂行条例实施细则→部门规章。"],"qs":[3,5]},{"id":"1-11","name":"18 个税种，14 部法：谁已经「转正」了","star":"★★","level":"L3","scene":"我国有 18 个实体税种，但不是每个都上升成了「法律」。目前 14 个已立法，4 个还停留在暂行条例。","why":"这条为什么重要？因为它是「税收法定原则」的落地进度表。考试就考你：哪些已经是「法」了。<br><br>没立法的 4 个，用一句口诀锁死：<b>「1 流转 3 房地」</b>——消费税（流转）+ 房产税、城镇土地使用税、土地增值税（三个房地产相关）。<br>反过来，剩下的都是已立法，包括很多人以为没有的：<b>增值税、关税、印花税、车船税、耕地占用税</b>。","sentence":"没立法的只有 4 个：1 流转（消费税）+ 3 房地（房产税、城镇土地使用税、土地增值税）。其余 14 个都已立法。","trap":"最大的坑是「关税」和「增值税」：直觉上觉得关税这么老牌应该有法、增值税这么大应该有法——两个都<b>有</b>（增值税法 2026 年 1 月 1 日施行）。反而「消费税」这么大还没立法，最反直觉。","table":{"head":["状态","数量","税种"],"rows":[["尚未立法","4 部","消费税、房产税、城镇土地使用税、土地增值税"],["已经立法","14 部","增值税、企业所得税、个人所得税、车船税、环境保护税、烟叶税、船舶吨税、耕地占用税、车辆购置税、资源税、契税、城市维护建设税、印花税、关税"]]},"qs":[4]},{"id":"1-12","name":"税收执法：谁收、收上来归谁","star":"★★★","level":"L3","scene":"两个征收机关在分工：<br><b>税务机关</b>管 16 个税种（国内增值税、消费税、企税、个税、资源税……）<br><b>海关</b>管关税、船舶吨税，还<b>代征</b>进口环节的增值税和消费税。","why":"钱收上来之后要分账，分账逻辑不是随意的，看这个税「调节的是全国性的事还是地方性的事」：<br>· 关乎主权和全国调控的（关税、消费税、车辆购置税）→ <b>中央固定</b><br>· 和地方民生、土地、环境紧密相关的（房产税、土增税、契税、耕占税、环保税、车船税、烟叶税）→ <b>地方固定</b><br>· 大税种要中央地方一起分（增值税五五、企税和个税六四）→ <b>共享</b>","sentence":"海关只碰四个：关税、船舶吨税（征收），进口环节增值税、消费税（代征）。其余都归税务机关。","trap":"五个高频错点：<br>① <b>海洋石油企业</b>的资源税、企业所得税归<b>中央</b>，不是地方；<br>② 消费税<b>全部</b>归中央，包括海关代征的那部分（不是共享）；<br>③ 证券交易印花税归中央，其余印花税归地方；<br>④ 城建税里，铁路集团、银行总行、保险总公司集中缴纳的部分归中央；<br>⑤ 进口环节增值税归中央，国内增值税才是五五分成。","table":{"head":["归属","税种"],"rows":[["中央固定","关税、船舶吨税、消费税（全部）、车辆购置税、海关代征进口环节增值税和消费税、铁路建设基金营改增"],["地方固定","房产税、土地增值税、契税、城镇土地使用税、耕地占用税、烟叶税、环境保护税、车船税"],["中央地方共享","增值税（50/50）、企业所得税（60/40）、个人所得税（60/40）、资源税（海洋石油归中央）、城建税（铁路/银行总行/保险总公司归中央）、印花税（证券交易归中央）"]]},"tips":["海关 = 2 征 + 2 代征。记住这个数，收入划分题就不会把「船舶吨税」错放给税务机关。"],"qs":[7,7,8,9]},{"id":"1-13","name":"征纳双方的权利义务 + 涉税专业服务","star":"★★","level":"L2","scene":"税务局有它的权力（征、管、查、罚、复议裁决），也有它的义务（宣传、咨询、保密、职责分离）。<br>你（纳税人）有义务（申报、缴款、接受检查），也有权利（知情、保密、减免退税、陈述申辩、复议诉讼、监督检举）。","why":"这一块最好用的记法是<b>「对号入座」</b>：题目里出现的主体是谁，决定了这句话是权利还是义务。<br>「广泛宣传税法、普及纳税知识」——主语只能是税务机关，那是<b>义务</b>。<br>「要求为自己的商业秘密保密」——主语是纳税人，那是<b>权利</b>。<br><br>还有一条常考：税务机关提供纳税咨询是<b>无偿</b>的，不是有偿。","sentence":"看主语定性质：税务机关的动作多是义务（宣传/咨询/保密），纳税人的动作多是权利（保密/减免/申辩）。","trap":"① 「税务机关可以有偿提供纳税咨询」——错，必须无偿。<br>② 把「依法缴纳税款」当成纳税人权利——那是<b>义务</b>。<br>③ 涉税专业服务机构包含：税务师事务所、会计师事务所、律师事务所、代理记账机构、税务代理公司、财税类咨询公司（注意「税务代理公司」也算）。","table":{"head":["涉税专业服务内容","一句话"],"rows":[["纳税申报代办","替你报税"],["一般税务咨询","答疑解惑"],["专业税务顾问","长期陪跑"],["税务合规计划","给你出「符合法规的纳税计划/方案」"],["涉税鉴证","出鉴证报告（如汇算清缴鉴证）"],["纳税情况审查","查你的税务健康度"]]},"qs":[8,13,10,11,12]},{"id":"1-14","name":"国际税收：两个国家同时想收同一笔税","star":"★★","level":"L3","scene":"你在 A 国的公司，从 B 国的子公司分回一笔股息。A 国说「你是我的居民，全球所得都要交税」；B 国说「这钱是在我这赚的，我得先收一道」。两边都伸手——这就是国际重复征税。","why":"重复征税的根子是<b>税收管辖权打架</b>。管辖权有两种：<b>属地</b>（在我地盘赚的，我管）和<b>属人</b>（你是我的居民/公民，我管）。<br>打架的三种组合：居民 vs 地域（最常见）、居民 vs 居民、地域 vs 地域。<br><br>然后按「是不是同一个纳税人」再分两类，这是本章最爱考的辨析：<br>· <b>法律性</b>重复征税：<b>同一个纳税人</b>、同一税源（总分公司）<br>· <b>经济性</b>重复征税：<b>不同纳税人</b>、同一税源（母子公司，公司利润+股东股息被征两次）","sentence":"同一纳税人被两国重复征 = 法律性；不同纳税人（母子公司）被重复征 = 经济性。","trap":"① 「国际税收中所指的国际重复征税一般属于税制性」——错，一般是<b>法律性</b>。<br>② 「经济性重复征税是同一征税主体对不同纳税人的不同税源」——错，是<b>不同征税主体</b>、<b>同一税源</b>。<br>③ 多选第 13 题有「居民管辖权与<b>收入</b>管辖权重叠」这个假选项——没有「收入管辖权」这个概念。","table":{"head":["类型","纳税人","典型情形","成因"],"rows":[["法律性","同一纳税人","总分公司","不同征税原则导致管辖权重叠"],["经济性","不同纳税人","母子公司（利润 + 股息）","股份公司这种经济组织形式"],["税制性","—","同一税源被征多种税","复合税制"]]},"tips":["协定解决重复征税的重点是「经营所得（营业利润）」，靠「常设机构」划分征税权。"],"qs":[9,14,13]}]}},{"id":"ch2","no":"2","name":"增值税法","score":"20","star":"★★★","tagline":"全书的发动机：环环抵扣，只对「增值」征税","intro":{"hook":"这一章 20 分，每年必考一道综合题，还能和关税、消费税、企税联合命题——它是整套税法卷的<b>地基</b>。<br><br>好消息是：增值税的原理只有一句话——<b>一条流水线上，每个环节只对自己加出来的价值交税，拿上家的发票抵掉别人已交的部分</b>。这一章 20 个知识块，全是这一句话的推论。先读 2-1，把「环环抵扣」这台机器看明白，后面每条规则你都能自己推出来。","exam":"近 5 年：单选 2-3 题、多选 1-2 题、综合题 1 道（常含 2 个计算问答题），合计 17.5-22.5 分。新《增值税法》2026 年 1 月 1 日施行，本章题目全部按新法口径出题。","passline":"本章 97 题（54 单选 + 43 多选）是全站最重的一章。过关线：单选正确率 ≥ 95%，多选 ≥ 90%——多选错一个选项整题没分，税率、差额、视同销售这三块必须滚瓜烂熟。"},"blocks":[{"id":"2-1","name":"环环抵扣：增值税到底在对什么征税","star":"★★★","level":"L3","scene":"一块面包的旅程：面粉厂把面粉卖给面包厂 100 元（收 13 元税），面包厂做成面包卖给超市 300 元（收 39 元税），超市卖给消费者 500 元（收 65 元税）。<br><br>注意看面包厂：它<b>收了 39 元，但只交给国家 26 元</b>——因为它手里有一张面粉厂开的 13 元发票，可以抵掉。超市同理：收 65 元，交 65-39=26 元。最后国家一共收到 13+26+26=65 元，正好等于最后零售价 500 的 13%。<br><br>看出门道了吗？<b>每个环节只对自己「加出来的那截价值」交税</b>，税像接力棒一棒棒往下传，最后全部砸在买面包的消费者头上。前面的人只是代收，不是负担。","why":"为什么国家要费这么大劲设计成「环环抵扣」？想想反面：如果每一环都按<b>全额</b>征税（以前的营业税就是这样），货每倒一次手就被扒一层皮。那企业会怎么应对？——把所有环节都吞进自己肚子里，搞「大而全」，从面粉到面包全自己干，中间没有交易就没有重复征税。社会分工就死了。<br><br>抵扣制让每个环节只对自己创造的增值负责：你分工越细、外包越多，税上越不吃亏。这叫<b>税收中性</b>——税不干扰你的经营决策。<br><br>但这个设计有一个命门：凭什么相信你上家交过税？<b>凭票</b>。增值税专用发票就是这条链上的「完税证明」。这一章后面所有让你头疼的规则，全是这一句话的推论：<br>· 没票（或票不合规）→ 不能抵，因为无法证明上家交过；<br>· 拿去搞集体福利、个人消费 → 不能抵，因为货被吃掉了，链条到你这里断了，不会再产生销项；<br>· 管理不善货丢了 → 抵过的要吐出来（进项转出），同理；<br>· 出口 → 不但不收你的，还把链条上收过的全退给你，让货「裸价」出海。","sentence":"增值税不是对「你」征的，是对「你手上增值的那一段」征的。你只是替国家向下家收钱，再拿上家的票证明别人已经交过。","trap":"「增值税由卖方承担」——错。卖方只是过手，最终承担者是<b>终端消费者</b>。还有：「增值税是价内税」——错，它是<b>价外税</b>，税款独立于价格之外单独列示，这也是它能一环环传递的前提。","table":{"head":["环节","售价(不含税)","销项税","进项税","实际缴纳"],"rows":[["面粉厂 → 面包厂","100","13","0","13"],["面包厂 → 超市","300","39","13","26"],["超市 → 消费者","500","65","39","26"],["国家合计收到","—","—","—","65 = 500×13%"]]},"tips":["后面每学一条规则，都回来问一句：这是不是在维护「凭证链」和「只对增值征税」？是，就看懂了。","「销项 - 进项」不是公式，是这台机器的运转方式。"],"qs":[]},{"id":"2-2","name":"征税范围的门槛：境内、有偿、经营，三条缺一不可","star":"★★","level":"L2","scene":"三笔进账：你在公司上班拿到工资；你家房子被政府依法征收，拿到补偿款；你把 10 万块存进银行，年底拿到利息。<br><br>三笔钱都是「收入」，但增值税一分都不征。凭什么？","why":"增值税只管一件事：<b>经营活动中的有偿交易</b>。拿这三条卡一下：<br>· 工资——你和单位是雇佣关系，不是做生意，缺「经营性」；<br>· 征收补偿——是政府动用公权力拿走你的财产后给的补偿，不是你自愿卖的，缺「交易性」；<br>· 存款利息——这是你把钱借给银行的对价，本来够得上，但国家选择不征（银行端已经就贷款利息交过了，两头都征不合理）。<br><br>所以看到任何一笔钱，判断顺序是：先问是不是经营活动（把工资、行政事业性收费、征收补偿剔出去），再问发生在不在境内，最后才轮到税率多少、能不能扣。","sentence":"四类「有钱拿也不征」：员工拿工资、收行政事业性收费/政府性基金、依法被征收拿补偿、取得存款利息。","trap":"最毒的混法：把「存款利息」（不征）和「贷款利息」（银行要征，6%）放一起考。记方向：<b>钱存进去，不征；钱贷出去，征</b>。另外「取得财政补贴」要看挂不挂钩——和销售收入/数量直接挂钩的补贴要征，不挂钩的不征。","tips":["做题先看题干问的是「不征收」还是「免征」：不征是根本不在这个税的地盘里，免征是在地盘里但国家抬手放行——免税的进项不能抵，不征的没这个问题。"],"qs":[3]},{"id":"2-3","name":"税目归类：这门生意在税法上叫什么名字","star":"★★★","level":"L3","scene":"同一艘船，配着船员租给你跑一趟运输，叫「交通运输服务」9%；空船租给你自己开，叫「有形动产租赁」13%。同一栋楼，给你住叫「不动产租赁」9%，把楼里的广告位租给你贴海报，也叫不动产租赁。<br><br>税务局收到一笔钱，第一件事就是问：<b>这是什么生意？</b>因为名字直接决定税率，归错类，后面全错。","why":"归类不是背字典，逻辑只有一条：<b>看你卖的核心到底是什么</b>。三个判断口诀（来自你老师的课件）：<br><br>① <b>带人带物是运输，只带资产是租赁</b>。程租、期租、湿租都配了人（船员/机组），你买的是「运输」这个结果，按交通运输；光租、干租只给船和飞机，人你自己找，那是出租资产，按租赁。<br>② <b>修理看动不动</b>。修的是动产（机器、汽车）→ 加工修理修配 13%；修的是不动产（房屋）→ 建筑服务里的修缮 9%。<br>③ <b>实质重于形式</b>。融资性售后回租：名义上你把设备卖给租赁公司再租回来，实质上设备从没挪窝，你只是拿它当抵押借了笔钱——所以按「贷款服务」6%，不按租赁。<br><br>剩下的都是这条逻辑的展开：快递是「收派服务」（物流辅助 6%）不是邮政（邮政只有中国邮政集团能做）；酒店会议室连带配套服务开会，卖的是「会议展览」不是「住宿」。","sentence":"归类三问：卖的核心是什么？带不带人？修的东西动不动？","trap":"高频陷阱清单：<br>· 港口设施<b>保安费</b> → 物流辅助（港口码头服务），不是安全保护，也不是经纪代理；<br>· <b>快递</b> → 物流辅助-收派服务，不是交通运输，更不是邮政；<br>· <b>卫星电视信号落地转接</b> → 增值电信服务，不是交通运输也不是广播影视；<br>· <b>出租车公司收司机的管理费</b> → 交通运输（车是公司的，司机是打工的）；<br>· 宾馆提供<b>会议场地+配套服务</b> → 会议展览服务，不是住宿；<br>· <b>游览场所里</b>的索道、摆渡车 → 文化体育服务，不是交通运输；<br>· <b>航道疏浚</b> → 物流辅助-港口码头服务；其他疏浚 → 建筑服务。","table":{"head":["业务","税目","税率"],"rows":[["程租、期租、湿租（配人）","交通运输服务","9%"],["光租、干租（不配人）","有形动产租赁","13%"],["融资性售后回租","金融服务-贷款服务","6%"],["修车（动产）","加工修理修配","13%"],["修房（不动产）","建筑服务-修缮","9%"],["快递、装卸、仓储","物流辅助服务","6%"],["车辆停放、道路通行","不动产经营租赁","9%"]]},"tips":["老师口诀：「带人带物是运输，只带资产是租赁」——这一句话能解决多选题里一整类选项。"],"qs":[1,2,9,1,2,27,28]},{"id":"2-4","name":"「境内」怎么算：四样东西各有一条地点线","star":"★★","level":"L2","scene":"韩国公司给日本公司位于<b>中国</b>的写字楼做室内设计——要在中国交税。法国餐厅在<b>法国</b>给中国明星做了一顿饭——不在中国交税。新加坡公司转让在深交所发行的股票——要交。<br><br>都发生在「境外」，为什么待遇不同？","why":"「境内」不是地理概念，是按货物品类分别画线：<br>· <b>货物</b>：看起运地或所在地；<br>· <b>不动产、自然资源</b>：看坐落地（房子在境内，谁也跑不掉）；<br>· <b>金融商品</b>：看在不在境内发行，或销售方是不是境内单位个人；<br>· <b>服务、无形资产</b>：看「在不在境内消费」。境外单位卖服务给境内单位，原则上算境内消费、要征——<b>除非</b>这个服务必须人到现场才能消费（吃饭、理发、旅游），人不在境内就消费不了，这才算「境外现场消费」，不征。<br><br>韩国公司那单：服务和境内不动产直接相关，跑不掉。法国餐厅那单：吃饭必须人在场，明星在法国吃的，境外现场消费，不征。","sentence":"货物不动产看地点，金融看发行，服务看消费地；唯一的逃生口是「境外现场消费」。","trap":"别把规则简化成「接受方在境内就征」——境外现场消费是例外。反过来也别以为「发生在境外就不征」：服务和境内不动产直接相关的、金融商品在境内发行的，照样征。","qs":[32]},{"id":"2-5","name":"视同销售 vs 不得抵扣：货物出了厂门的两条路","star":"★★★","level":"L3","scene":"面包厂的三批面包：一批送给客户品尝，一批发给员工当年货，一批老板搬回家自己吃。三批都没卖一分钱，税务处理一样吗？<br><br>再换个问法：如果面包不是自家产的，是从外面买来再发给员工的，处理还一样吗？","why":"回到 2-1 的抵扣链。这批面包用的面粉，进项税<b>已经抵过了</b>。现在面包不进入流通、被直接「吃掉」，链条断在你手里，国家在这条链上颗粒无收。怎么办？两条补丁，用哪条看货物的「出身」：<br><br>· <b>自产 / 委托加工的货物</b>：你在厂里创造了增值（面粉变成了面包），这个增值必须完税——<b>视同销售</b>，按市场售价补一笔销项税。送去福利、个人消费、无偿赠送，都是。<br>· <b>外购的货物</b>：你没创造增值，只是买错了用途——不用补销项，但当初抵的进项<b>要吐出来</b>（不得抵扣/进项转出）。<br><br>一句话区分：<b>自产的讲「增值要完税」，外购的讲「抵扣要回吐」</b>。<br><br>还有个不看出身的例外：<b>无偿转让</b>（白送别人）——自产的、外购的，一律视同销售；无偿转让无形资产、不动产、金融商品，单位和个人都视同。因为东西送出去后还在流通链上（别人手里），链条没断，只是该你交的环节不能逃。","sentence":"自产进门（福利/消费/送人）→ 视同销售补销项；外购进门（福利/消费）→ 不视同，进项转出；外购送人 → 视同销售。方向正好相反，盯住「货是哪来的、去哪了」。","trap":"最爱混的一对：外购货物「<b>发下去</b>」（集体福利/个人消费）不视同、进项转出；外购货物「<b>送出去</b>」（无偿转让）要视同销售。还有一个反常识点：用于<b>公益事业或以社会公众为对象</b>的无偿转让，不视同——义捐不征税。","table":{"head":["货物来源","无偿转让/送人","集体福利、个人消费"],"rows":[["自产、委托加工","视同销售","视同销售"],["外购","视同销售","不视同，进项不得抵扣/转出"],["无形/不动产/金融商品（不论来源）","视同销售（公益除外）","—"]]},"tips":["核定销售额的顺序：先自己同类均价 → 再别人同类均价 → 最后组成计税价格（成本×(1+成本利润率)，应税消费品还要加回消费税）。税务机关不能跳着来。"],"qs":[39,32]},{"id":"2-6","name":"纳税人与扣缴义务人：谁来交、500 万这条线、境外怎么扣","star":"★★","level":"L2","scene":"三个场景：① 挂靠车队的车出了事故，到底谁是纳税人——开车的还是车队？② 一家年销售 600 万的个体户，必须升级成一般纳税人吗？400 万的呢？③ 境外公司给境内单位设计 logo，收了 5150 元，这笔税谁来交、怎么算？","why":"① <b>谁是纳税人看「名义+责任」</b>：挂靠人以被挂靠人名义对外经营、且由被挂靠人承担法律责任的，被挂靠人是纳税人——名义和责任在同一个人身上，就锁定他；不满足就还是实际经营的挂靠人。<br><br>② <b>500 万是「应当登记」线，不是「能不能登记」线</b>。连续不超过 12 个月（或 4 个季度）累计应征销售额超 500 万，必须登记；没到 500 万但会计核算健全的，可以主动登记（为了进抵扣链、给客户开专票）。两个例外：自然人（非个体户）永远是小规模；不经常发生应税交易的非企业性单位可以选择按小规模。<br><br>③ 境外单位在境内没有机构，中国的税务局够不着它——所以让<b>付款方</b>当扣缴义务人：你付钱之前先把税扣下来交给国家。算法是价税分离后乘税率：5150÷(1+6%)×6%。注意它是扣缴义务人，纳税人还是境外单位。","sentence":"名义责任合一锁定纳税人；500 万是必须登记的线不是只能登记的线；境外服务购买方扣缴，含税÷(1+税率)×税率。","trap":"· 报关进口货物，纳税人是<b>收货人</b>（或办报关手续的），不是境外发货人；<br>· 资管产品运营中的应税交易，纳税人是<b>管理人</b>；<br>· 年应征销售额不含「偶然发生的卖无形资产、卖不动产」的收入，但<b>含</b>稽查查补和自行更正调整的销售额；<br>· 超标后生效日是「当期 1 日」，追溯调整的是「调整之日起 10 个工作日内」办理。","tips":["扣缴计算的税率跟着业务走：设计、咨询这类生产生活服务是 6%，别看到境外就想当然用别的档。"],"qs":[5,6,8,3]},{"id":"2-7","name":"税率四档：13 / 9 / 6 / 0，不是背的是懂的","star":"★★★","level":"L3","scene":"都是吃的：玉米胚芽 9%，奶油 13%。都是住相关的：卖房子 9%，出租吊车 13%。都是服务：交通运输 9%，贷款服务 6%。<br><br>税率表看起来像随机抽签，其实背后是一套政策逻辑。","why":"四档税率对应四个政策意图：<br><br>· <b>13% 默认档</b>：工业品、加工修理修配、有形动产租赁。没什么特殊照顾的理由，就用基本税率。<br>· <b>9% 民生档</b>：跟「吃饱、住下、出门、读书、种地」直接相关的——农产品、油盐、自来水暖气燃气、图书报刊、饲料化肥农机农膜，外加交通运输、邮政、基础电信、建筑、不动产租售、转让土地使用权。税率定低一点，民生成本就低一点。<br>· <b>6% 轻资产档</b>：现代服务、金融、生活服务、增值电信、卖无形资产（土地使用权除外）。这些行业最大的特点是<b>没什么进项可抵</b>——成本主要是人，人开不出专票。税率定高了它们扛不住。<br>· <b>0% 出海档</b>：出口货物、跨境的特定服务和技术。让国货、国服务「裸价」出海抢市场。<br><br>老师口诀：<b>动产销售 13%，不动建筑 9%，服务无形 6%</b>。","sentence":"13 是默认，9 是民生，6 是轻资产服务，0 是出海。判断时先归类（2-3），税率自动跟上。","trap":"· 玉米胚芽 9%，但玉米浆、玉米淀粉 13%；巴氏杀菌乳 9%，奶油 13%——加工越深越接近 13%；<br>· 农机整机 9%，农机<b>零部件</b> 13%；<br>· 转让<b>土地使用权</b> 9%（跟着不动产走），其他无形资产（商标、技术）6%；<br>· 修理修配是 13% 的「劳务」，不是 6% 的服务——老师课件专门点了这个易混点；<br>· 废弃物专业化处理：没产生货物 6%（专业技术服务）；产生货物归委托方 13%（视同受托加工）；归受托方则处理费 6%、卖货另按货物税率。","table":{"head":["档位","范围","记忆锚点"],"rows":[["13%","货物、加工修理修配、有形动产租赁","能动的东西"],["9%","农产品/油盐/水气暖/书报/农资 + 交通/邮政/基础电信/建筑/不动产/土地使用权","民生+基础"],["6%","现代服务、金融、生活服务、增值电信、其他无形资产","靠人吃饭的行业"],["0%","出口货物、跨境特定服务与技术","裸价出海"]]},"tips":["多选题里税率常和税目一起考：先把生意归对类（2-3 的口诀），税率是水到渠成的事。"],"qs":[7,4,5,30]},{"id":"2-8","name":"销售额①：什么算进销售额——代收转付不算","star":"★★","level":"L2","scene":"4S 店卖一辆车，收了三笔钱：车款、内饰加装费、代保险公司收的车船税。前两家店吵起来了：一家说三笔都算销售额，一家说只有车款算。都对了一半。","why":"判断标准特别朴素：<b>这钱最终进谁的口袋</b>。进自己口袋的（车款、加装费、包装费、违约金、手续费）——全部价款加价外费用，都进销售额。只是过手的「代收转付」——钱在你账上转一圈就给别人了，你不是真正的收款方，不并入。<br><br>税法明确列了四类过路财神：① 代收的政府性基金/行政事业性收费；② 受托加工应税消费品时代收代缴的消费税；③ 代收的车辆购置税、车船税；④ 以委托方名义开发票代收的款项。","sentence":"全部价款+价外费用进销售额；四类「代收转付」不进。判断口诀：这钱最终归谁。","trap":"· 保险公司代收的车船税不并入（选项里爱把它混进「价外费用」）；<br>· <b>包装物租金</b>是价外费用，收取当期就并入——它和包装物「押金」是两回事，押金有递延规则（见 2-9），租金没有；<br>· 商业企业收取的<b>平销返利</b>不并进销售额也不算价外费用——它是冲减进项（见 2-21）。","qs":[8]},{"id":"2-9","name":"销售额②：五种特殊卖法——折扣、折让、以旧换新、押金、以物易物","star":"★★★","level":"L3","scene":"商场里同一天的五笔生意：全场 8 折促销；一批货有瑕疵给客户让了 15% 的价；跟大客户说「20 天内付款再减 2%」；空调以旧换新；卖白酒收了包装物押金。<br><br>五笔都「少收了钱」或「多收了钱」，税务处理全不一样。","why":"按「这笔钱什么时候、为什么变动」分类，就再也混不了：<br><br>· <b>商业折扣（折扣销售）</b>：卖之前讲好价。销售额和折扣额在<b>同一张发票的「金额」栏</b>分别注明 → 按折后价计税。写在备注栏 = 没写，按原价。为什么是「金额栏」？因为税务只看发票上能咬死的数字，备注栏没有证明力。<br>· <b>现金折扣（销售折扣）</b>：货早卖了，这是求你早点还钱的融资费用——买卖已经完成，折扣和货无关，<b>不许扣</b>。<br>· <b>销售折让</b>：货有质量问题退一部分钱——这笔交易的真实成交价本来就低了，<b>可以扣</b>（开红字发票冲减）。<br>· <b>以旧换新</b>：一般货物按<b>新货全价</b>，不许扣旧货作价——否则你随便给旧货估个高价就能把销售额做没了。例外：金银首饰按<b>实际收取的差价</b>，因为旧金银是有公允价格的硬通货，国家认。<br>· <b>包装物押金</b>：一般货物+啤酒黄酒——单独核算、没逾期、没超 1 年就不并，逾期才并；<b>其他酒（白酒等）</b>——收取当期就并入，逾期不再重复算。为什么酒类特殊？酒包装值钱、押金高，放一年再征太容易藏税。<br>· <b>以物易物 / 还本销售</b>：以物易物双方都按购销处理（各算销项、凭票抵进项）；还本销售按全额，还本支出不许扣。","sentence":"售前折按折后（金额栏注明）；售后折（现金折扣）不许扣；质量折让可以扣；以旧换新看是不是金银；押金：啤酒黄酒跟着一般货走逾期才征，白酒等其他酒收取就征。","trap":"· 折扣写<b>备注栏</b>=按全额（单选 35/36 题就是这对母子题）；<br>· 2/20、n/30 是现金折扣，<b>不得</b>从销售额扣减——和 15% 折让同题出现时各走各的规则；<br>· 白酒押金收取即征，逾期<b>不再</b>征——别两头都算；<br>· 金银首饰以旧换新按差价，但别忘了差价也是含税额，要 ÷(1+13%)。","table":{"head":["名目","为什么少收/多收","计税销售额"],"rows":[["商业折扣","售前促销","折后价（金额栏注明才认）"],["现金折扣","售后催款","折前全价，不许扣"],["销售折让","质量补偿","折后价（红字发票）"],["以旧换新-一般货","回收旧物","新货全价"],["以旧换新-金银","回收旧物","实收差价"],["押金-啤酒黄酒/一般货","担保包装归还","逾期或超1年才并入"],["押金-其他酒类","担保包装归还","收取当期即并入"]]},"tips":["这一块是计算题常客：先判断属于哪种「折」，再决定基数，最后才价税分离。顺序错了全盘皆输。"],"qs":[34,35,36,37,38]},{"id":"2-10","name":"差额计税：上游给不了票时的补救机制","star":"★★★","level":"L3","scene":"旅行社收你 700 元团费，转手替你付掉 320 住宿、80 交通、20 签证。如果按 700 全额计税，它替你垫的 420 也被征了一遍——它明明只赚了差价。<br><br>类似的还有：劳务派遣公司代发工资、客运场站代付承运方运费、房企向政府交的土地出让金。","why":"这些行业有个共同痛点：<b>付出去的大头拿不到专票</b>（付给个人、境外、政府）。抵扣链条天然断裂，按全额征税就是重复征税。国家的补救：既然没有进项票可抵，那就直接从<b>销售额</b>里把这截砍掉——这叫差额计税。<br><br>所以「差额」两个字背后永远是一个意思：<b>替别人收的钱，别算我的收入</b>。<br><br>金融商品转让是另一种差额：你 10 万买入 12 万卖出，增值的只有 2 万差价，本金不是增值——按卖出价-买入价计税，负差年内可结转，年底清零。<br><br>正面记住轻二这份清单就够：金融商品转让、客运场站（减运费）、航空运输（减代收他航票款）、机票代理（减净结算款）、签证代理（减签证认证费）、考试费（减付境外）、代理进口免税货（减代付货款）、融资租赁（扣两息一税）、融资性售后回租（不含本金，扣两息）、劳务派遣安保（减代付工资社保）、旅游（减住宿餐饮交通签证门票接团费）、房企一般计税（减土地价款）、建筑简易计税（减分包款）、金银以旧换新（减旧饰作价）。","sentence":"差额 = 防止「替别人收的钱」被重复征税。看到代收代付、转付、垫资，就往差额上想。","trap":"· <b>贷款服务是全额</b>——利息收入全额计税，不许扣你付出去的利息。它和旅游服务是多选题里最常被互换的一对；<br>· 差额扣除的部分<b>不得开专票</b>（下家对这部分无税可抵，开了就乱套），只能开普票；<br>· 房企差额扣的是「土地价款」（出让金、征地拆迁、前期开发、出让收益+货币形式拆迁补偿），<b>不含契税</b>；<br>· 建筑服务只有<b>简易计税</b>才差额扣分包款，一般计税下分包款走正常进项抵扣。","table":{"head":["业务","差额基数"],"rows":[["金融商品转让","卖出价-买入价（负差年内结转）"],["旅游服务","全额-住宿餐饮交通签证门票-接团费"],["劳务派遣/安保","全额-代付工资福利社保公积金"],["建筑服务(简易)","全额-分包款"],["房企卖自开发项目(一般计税)","全额-土地价款"],["客运场站","全额-付承运方运费"],["融资租赁","全额(含本金)-两息-车辆购置税"],["融资性售后回租","全额(不含本金)-两息"]]},"tips":["差额计税大多挂着「2027 年 12 月 31 日截止」的期限标签，做题时不用管，记规则即可。"],"qs":[11,12,33,6,7]},{"id":"2-11","name":"进项①：没有专票也能抵的三张口算抵扣","star":"★★★","level":"L3","scene":"你出差：坐飞机拿到行程单，坐大巴拿到公路客票，过桥过闸拿到通行费发票。行政部买食堂用的大米，从农民手里收，开的是收购发票。<br><br>没有一张是增值税专用发票——但税法全给留了口子，让你「计算抵扣」。","why":"为什么国家愿意在没专票的情况下也让抵？因为这些场景的上游<b>天生开不出或很难开出专票</b>：客运司机、收费站、农民。不让抵，就等于让下游企业替整个链条的「不规范」买单，抵扣链在这里断掉，增值税中性的设计就破功了。<br><br>所以规则是「凭证替代+公式计算」：<br>· <b>国内旅客运输</b>：航空行程单/铁路电子客票——按票面<b>注明或包含的税额</b>抵；列明旅客身份的公路、水路客票——票面金额÷(1+3%)×3%。<br>· <b>桥、闸通行费</b>：通行费发票金额÷(1+5%)×5%（注意：财政票据样式，按 5% 反算）——这里的 5% 是<b>计算抵扣的反算率</b>，不是简易计税征收率，新法统一征收率不影响它；<b>道路通行费</b>电子普票——按票面注明税额。<br>· <b>农产品</b>：收购发票/销售发票——买价×9% 计算抵。为什么是计算抵？因为农民自产自销免税、开不出带税额的票，国家就让你按买价「虚拟」出一笔进项。","sentence":"专票按票面税额抵；行程单/铁路票按注明税额抵；公路水路客票÷1.03×3%；桥闸通行费÷1.05×5%；农产品收购价×9%。","trap":"· 农产品从小规模取得 3% 专票：按<b>金额×9%</b> 计算抵，不是按票面税额抵（反直觉，专票反而不用票面数）；<br>· 批发零售环节的<b>蔬菜、部分鲜活肉蛋</b>免税，拿到的普通发票<b>不能</b>计算抵扣——免税环节没有税可传；<br>· 农产品买来直接用于<b>集体福利</b>（发职工的 1 吨黄芩）不能抵——能抵的只是用于生产经营的那部分，按用途拆；<br>· 旅客运输抵扣的是<b>国内</b>旅客运输且要列明身份信息，国际机票不行。","table":{"head":["凭证","怎么抵"],"rows":[["增值税专用发票 / 海关缴款书","票面注明税额"],["航空行程单 / 铁路电子客票","票面注明(包含)的税额"],["公路、水路客票(列明身份)","票面金额÷(1+3%)×3%"],["桥、闸通行费发票","金额÷(1+5%)×5%"],["农产品收购/销售发票","买价×9%"]]},"tips":["烟叶是农产品里的特殊生：买价=收购价款+10% 价外补贴+烟叶税（收购价款×1.1×20%），再乘 9% 抵。"],"qs":[13,14,40,48]},{"id":"2-12","name":"进项②：什么不能抵 & 已经抵了怎么吐出来","star":"★★★","level":"L3","scene":"仓库被雷劈了一批货；仓管疏忽另一批发了霉；买月饼发给职工过中秋；向银行贷款付了一笔「投融资咨询费」；买的厂房一半生产应税药一半生产免税药。<br><br>五笔进项，哪几笔能抵？","why":"还是那条链：<b>进项能抵的前提是这批投入还要继续进入流通、产生销项</b>。链条断了，抵扣资格就没了。断法有三种：<br><br>· <b>非正常损失</b>：因<b>管理不善</b>（被盗、丢失、霉烂变质）或<b>违法违规</b>（被没收、被强拆）导致货没了。链断在你手里，抵过的吐出来。注意：自然灾害（雷击、洪水）<b>不是</b>非正常损失——天灾不可抗力，能抵。人祸才转出。<br>· <b>集体福利、个人消费</b>：货被吃掉用掉了，退出流通，不抵/转出。<br>· <b>贷款服务相关</b>：贷款利息进项不能抵（因为存款端不征，利息这环国家选择不打通），连带给贷款方付的投融资顾问费、手续费、咨询费也一并不许抵。餐饮、居民日常、娱乐服务购进直接用于消费的，同处理。<br><br>转出的算法看当初怎么抵的：凭票抵的→按票面税率转出；农产品计算抵的→账面成本÷(1-扣除率)×扣除率（先还原成买价再算）；分不清的→按免税/简易项目销售额占比分摊。<br><br>还有一个反直觉的特例：<b>固定资产、无形资产、不动产</b>既用于应税又用于免税/简易等项目（混用），原值 ≤500 万的，<b>全额可抵</b>——货要按比例分摊，固定资产不用。","sentence":"断链三情形：管理不善/违法的非正常损失、集体福利个人消费、贷款相关费用——抵了也要转出。天灾可抵，人祸才转。","trap":"· 雷击毁损<b>能抵</b>，霉烂变质<b>不能抵</b>——「天灾 vs 人祸」是多选常客；<br>· 混用的<b>货物</b>按销售额占比分摊；混用的<b>固定资产/无形/不动产</b>≤500 万全额抵——考的就是这对反差（单选 44/45 母子题）；<br>· 现金赔付下保险公司把钱直接赔给汽修厂：不算保险公司购进修理服务，<b>保险方不能抵</b>；<br>· 非正常损失转出要连「对应的进项」一起转：香水被盗，转的是它耗用外购原料那部分（成本×原料占比×税率），不是整个成本。","table":{"head":["情形","转出公式"],"rows":[["凭票抵扣的","发票金额×税率"],["农产品计算抵扣的","账面成本÷(1-9%)×9%"],["无法划分(兼用于免税/简易)","全部进项×免税简易销售额占比"],["长期资产改变用途","对应进项×净值率"]]},"qs":[18,44,45,33]},{"id":"2-13","name":"简易计税与小规模：不玩抵扣链，直接乘征收率","star":"★★","level":"L2","scene":"街角小饭馆年收入 80 万，让它建账算进项、销项不现实。国家给它一条活路：收入直接乘个征收率，交完拉倒。这就是简易计税。","why":"简易计税 = <b>放弃抵扣，换低征收率</b>。适用于两类人：<br><br>· <b>小规模纳税人</b>：默认简易计税。<b>2026 年新法把征收率统一为 3%</b>（《增值税法》第 11 条），旧法下销售不动产等 5% 的档次已经取消。2026.1.1—2027.12.31 优惠期：3% 的项目<b>减按 1%</b>，但财政部税务总局 2026 年第 10 号公告明确<b>排除销售、出租不动产或转让土地使用权</b>——这几类仍按 3%，不参与减征。起征点：按月 10 万 / 按季 30 万，以下免征——差额计税的项目先差额再和起征点比。<br>· <b>一般纳税人的特定业务</b>：公共交通、装卸搬运、非学历教育、教育辅助、老项目建筑、2016.4.30 前取得的不动产转让、资管产品运营……这些行业共同点是进项天然就少（人力密集/历史资产），强制一般计税法它们血亏，所以给个选择题。<br><br>选简易的代价：对应进项不能抵。所以这是一道「进项多不多」的计算题，不是身份题。","sentence":"简易 = 不抵进项、全额×征收率；新法征收率统一 3%；优惠期一般业务减按 1%、不动产类不减；季 30 万是免税线；差额项目先差额再比线。","trap":"· 「减按 1%」是 2027 年底前的<b>限时</b>优惠，且<b>不动产类不适用</b>——同一道题里可能同时出现 1% 和 3%（单选 51 就考这个）；<br>· 别把「征收率 3%」和「预缴换算率 5%」混为一谈：前者是算税用的，后者只出现在老不动产项目过渡期的预缴公式里；<br>· 起征点按<b>差额后</b>余额判断（小规模建筑分包扣完再比 30 万）；<br>· 出租住房给小规模/个体户有专门口径：个体户出租住房按 <b>1.5%</b> 实际征收率（教材表格口径）；<br>· 直接收费金融服务<b>不能</b>选简易——多选题里拿它凑「可以选简易」的选项就是陷阱；<br>· 预收租金一次性开票的：全额在开票当期计税，别分摊。","qs":[10,46,50,51,24,36]},{"id":"2-14","name":"旧货与二手车：「自己用过的」和「收来卖的」两本账","star":"★★","level":"L2","scene":"三种「卖旧东西」：你把自己开了三年的车卖了；旧货店卖收来的二手电脑；二手车行卖收来的车。都叫「卖旧的」，税率天差地别。","why":"税法先问一个问题：<b>你当初买它的时候抵过进项吗？</b><br><br>· 一般纳税人卖<b>自己用过的固定资产</b>：当初抵过进项的→按正常税率（链是通的）；当初按规定<b>不得抵扣且没抵</b>的（比如专用于免税项目）→ 3% 减按 2%，因为你没进过抵扣链，按全额征税对你不公平。<br>· <b>经营旧货</b>（收别人的来卖，二手车除外）：3% 减按 2%。旧货的上家多是个人，你收进来就没有进项，给个减按照顾。<br>· <b>二手车经销</b>：0.5%（2027 年底前的行业扶持，力度最大）。<br>· 小规模卖自己用过的/旧货：叠加 2027 年底前 3% 减按 1%。<br><br>全部都别忘了价税分离：÷(1+征收率)×征收率。","sentence":"自己用过的固定资产：抵过按税率、没抵过减按 2%；经营旧货减按 2%；二手车 0.5%。先看身份，再看抵没抵过。","trap":"· <b>自然人</b>卖自己用过的物品<b>免</b>增值税，但<b>个体工商户</b>卖自己用过的<b>不免</b>——「个人」和「个体户」一字之差；<br>· 减按 2% 的算法是 ÷(1+2%)×2%？不——政策口径是按 3% 征收率减按 2%，即 ÷(1+2%)×2% 是错的口径要小心：轻二答案是直接 ÷(1+2%)×2%（2026 新口径），做题跟题目给的答案走，关键是<b>不要忘记价税分离</b>；<br>· 二手车 0.5% 也是含税先 ÷(1+0.5%)。","table":{"head":["卖方/货","处理"],"rows":[["一般纳税人卖已抵进项的固定资产","正常税率 13%"],["一般纳税人卖未抵进项的固定资产","3% 减按 2%"],["经营旧货(非二手车)","3% 减按 2%"],["二手车经销","减按 0.5%"],["小规模(2027年底前)","3% 减按 1%"]]},"qs":[19,20,21]},{"id":"2-15","name":"房地产专题：预缴、房企差额、个人卖房租房","star":"★★★","level":"L3","scene":"B 市的建筑公司跑去 M 省 N 市盖桥；房企拿地盖楼再卖；个体户把两年前买的住房转手；李某把房子出租一次性收了一年租金。<br><br>不动产这块有个共同动作：<b>预缴</b>。","why":"为什么不动产业务要预缴？因为<b>不动产坐落地和机构所在地经常不一致</b>：公司在 A 地注册，楼在 B 地盖、在 B 地卖。税全部回 A 地交，B 地政府白提供公共服务了。折中方案：<b>不动产所在地先预缴一笔，机构所在地再申报清算</b>，多退少补。<br><br>预缴公式统一是「基数÷(1+税率或征收率)×预征率」——<b>分母用的是计税方法对应的税率/征收率，乘的才是预征率</b>，两者不是一回事，这是本节最容易混的地方。<br><br>先分清新旧法：2026 年新法把简易计税<b>征收率统一为 3%</b>（旧法不动产 5% 的档次取消），所以新项目算税一律 3%（单选 51 按 3% 就是这个道理）。但教材答案册的预缴表里，<b>2016.4.30 前取得的老不动产项目在 2026.1.1—2027.12.31 过渡期</b>仍保留 5% 的换算口径——那是过渡期预缴，不是现行征收率，别拿它去算新项目的税。<br><br>预征率记三档：建筑服务跨区——一般计税 2%、简易计税 3%（基数都是「总包-分包」差额）；房企预售自开发楼盘——3%（基数是预收款）；不动产出租/销售异地按教材表格口径（自建全额、非自建差额）。<br><br>房企一般计税还有一个特殊差额：<b>卖楼时可以扣掉土地价款</b>（出让金、征地拆迁、前期开发、出让收益+货币拆迁补偿）——因为土地出让金交给政府拿不到专票，土地成本又是房企最大头，不差额就是灾难。注意：<b>契税不扣</b>，且按已售面积比例分摊扣除。<br><br>个人卖住房（不含个体户一般纳税人）：看<b>持有年限</b>——不足 2 年：全额按 3% 征收率；满 2 年：免。个体户里的一般纳税人不适用这个免税，正常一般计税 9%。自然人出租住房：一次性收租可按租赁期<b>月均分摊</b>再对起征点（月 10 万），所以预收一年 9.6 万，月摊 8000，免税。","sentence":"不动产三件套：跨区先预缴（建筑 2%/3%、房企预售 3%）；分母看计税方法、乘的是预征率，两者别混；新法征收率统一 3%，老项目过渡期预缴表里的 5% 是历史口径；房企一般计税可扣土地价款不含契税；个人卖房看 2 年，自然人出租按月摊。","trap":"· 建筑预缴基数是「总包-分包」<b>差额</b>，且简易计税 ÷(1+3%)×3%、一般计税 ÷(1+9%)×2%——两套换算率别换错（单选 25/26 母子题就考这个）；<br>· 房企差额扣土地价款时<b>契税不扣</b>，且按销售面积比例扣；<br>· 个体户<b>一般纳税人</b>卖住房不享受「满 2 年免」——身份把免税资格卡掉了（子题 2 专考）；<br>· 总分支机构不同县市原则分别申报，经省级批准才能汇总——不是「只能分别」也不是「随便汇总」；<br>· 教材表格里老不动产项目过渡期（至 2027.12.31）还写 5%，那是<b>预缴换算率</b>；新法下新项目征收率统一 3%，别拿 5% 去算税。","table":{"head":["业务","预征率（教材答案册口径）","基数"],"rows":[["建筑(一般计税)","2%","(总包-分包)÷(1+9%)"],["建筑(简易)","3%","(总包-分包)÷(1+3%)"],["房企预售(一般)","3%","预收款÷(1+9%)"],["出租不动产(一般/简易)","3% / 5%（老项目过渡）","租金"],["销售不动产(一般/简易)","5% / 5%（老项目过渡）","自建全额、非自建差额"]]},"qs":[24,25,26,27,28,29,30,31,9,31]},{"id":"2-16","name":"加计抵减与留抵退税：国家给的两种「额外现金」","star":"★★★","level":"L3","scene":"两家企业的两种烦恼：<br>A 是先进制造业，国家想扶持它——除了正常抵进项，再「凭空」多给一笔抵减额。<br>B 是租赁公司，年初购入大批设备，进项一大堆，可业务刚起步销项还没上来，账上趴着 8000 万「留抵税额」——这钱按规定只能留着以后慢慢抵，可公司现在就没现金了。","why":"两种烦恼对应两个政策工具：<br><br>· <b>加计抵减</b>（2023.1.1—2027.12.31）：名单内企业按「当期可抵扣进项税额」的一定比例<b>额外</b>计提抵减额——先进制造业 5%，集成电路、工业母机 15%。本质是产业补贴套了增值税的壳。使用规则：先算正常应纳税额；应纳税额>0 时拿加计抵减额去冲，冲不完结转下期；应纳税额=0 时全额结转。注意<b>出口</b>部分对应的进项不能计提（出口已经享受了退税，不能吃两碗），进项转出要同步调减加计抵减额。<br><br>· <b>留抵退税</b>：把「未来才能抵的进项」提前变现救现金流。退多少看「<b>新增</b>留抵」：和上一年度 12 月 31 日的存量比，多出来的部分才算；再乘「进项构成比例」（你进项里凭票类占比）；再分档打折——1 亿以内部分 ×60%，超 1 亿部分 ×30%（制造业等 4 行业和房地产另有口径）。拿过留抵退税的，不得再享受即征即退、先征后返——<b>二选一</b>。","sentence":"加计抵减 = 多给你抵（5% / 15%），先算正常税再拿它冲；留抵退税 = 提前给你钱，算新增、乘构成比例、分档打折。","trap":"· 加计抵减的计提基数是「当期<b>可抵扣</b>进项税额」，出口对应的进项要剔除，已转出的要调减；<br>· 「可计提未计提的」可以在确定适用当期<b>一并补提</b>——多选题爱反着出；<br>· 留抵退税算的是<b>增量</b>（和上年末存量比），不是全部期末留抵；<br>· 留抵退税与即征即退<b>互斥</b>；办完免抵退税后仍符合条件的，可以办留抵退税（顺序是：先免抵退，后留抵退）。","table":{"head":["工具","给谁","力度"],"rows":[["加计抵减 5%","先进制造业","进项×5% 额外抵"],["加计抵减 15%","集成电路、工业母机","进项×15% 额外抵"],["留抵退税","符合条件纳税人","新增留抵×构成比例×60%(1亿内)/30%(超出)"]]},"qs":[15,16,17,41,42,43,12,13,16,17]},{"id":"2-17","name":"进口环节：组成计税价格 + 跨境电商的特殊算法","star":"★★","level":"L2","scene":"进口一批高档化妆品，海关先收关税，再收消费税，最后收增值税——而且增值税的税基里居然把关税、消费税都包进去了。<br><br>另一边，个人在跨境电商平台买 4500 元羽绒服，税却打七折。","why":"进口环节征增值税的理由：让进口货和国产货<b>站在同一条起跑线上</b>。国产货的价格里叠着生产流通各环节的增值税；进口货进来时身上什么税都没有，不补一道就不公平。<br><br>补多少？组成计税价格 = 关税完税价格 + 关税 + 消费税。换句话说：进口增值税的税基 = 货物真实落地成本（含消费税的货要还原：÷(1-消费税税率)）。然后乘增值税<b>税率</b>——注意，<b>不分一般纳税人还是小规模，进口环节一律用税率，不用征收率</b>。因为征收率是「没有进项的简化算法」，进口环节恰恰是要把链条补齐。<br><br>跨境电商零售进口是特殊照顾通道：单次 ≤5000 元、年度 ≤26000 元 → 关税 0，增值税消费税按法定额 <b>70%</b> 征收；纳税人是购买商品的个人，电商平台/电商企业/物流企业可以做代收代缴义务人。","sentence":"进口组价 = (完税价+关税)÷(1-消费税率)，再×增值税率；进口不分规模全用税率；跨境电商限值内关税免、增值税打 7 折。","trap":"· 「小规模纳税人进口按征收率」——错，进口环节一律按<b>税率</b>；<br>· 进口环节不得抵扣任何税额（没有进项的概念），但进口缴纳的增值税拿到专用缴款书后，可以在<b>内销</b>环节作进项抵扣——别混；<br>· 跨境电商别把「关税 0」记成「全免」：增值税消费税照收，只是 ×70%。","qs":[22,23,18,37]},{"id":"2-18","name":"出口退税：免抵退（生产企业）vs 免退（外贸企业）","star":"★★★","level":"L3","scene":"同样把货卖到国外：螺丝厂是<b>自产自营出口</b>，用「免抵退」；外贸公司是<b>从工厂买来再出口</b>，用「免退」。为什么两套算法？","why":"零税率的目标是让出口货「裸价出海」——不但出口环节不收销项，还要把前面环节吃进来的进项<b>退掉</b>。问题是生产企业还有内销，进项池子是内外销混在一起的，没法直接说「哪笔进项对应出口」，所以设计了「免抵退」四步：<br><br>① <b>剔</b>：征税率和退税率的差（比如 13% vs 9%），这部分国家不退，转进成本：出口销售额×(13%-9%)。<br>② <b>抵</b>：算当期应纳税额 = 内销销项 - (全部进项 - 剔出来的) - 上期留抵。出口销项是 0 不算。算出来是负数，说明进项有富余。<br>③ <b>算</b>：算国家最多能退多少 = 出口销售额×退税率（免抵退税额）。<br>④ <b>比</b>：②的留抵 和 ③的上限，<b>谁小退谁</b>。差额叫「免抵税额」——不是退你的现金，是拿去「抵」了你内销该交的税（所以叫免抵），这部分还要计城建税。<br><br>外贸企业没有生产过程，出口的就是买来的那批货，直接：<b>购进金额×退税率</b>，干净利落。","sentence":"免抵退四步：剔（征退差转成本）、抵（算应纳税额）、算（退税上限）、比（留抵和上限谁小退谁）。外贸免退：买价×退税率。","trap":"· 「免抵税额」<b>不是退给你的钱</b>，是被内销销项吃掉的那部分——但它要作为城建税计税依据；<br>· 金融商品转让的负差结转规则别搬到这里来，两个制度；<br>· 来料加工复出口免税<b>不退</b>（料本来就是保税进的，没垫过税）；进料加工复出口适用免抵退；<br>· 特殊区域内企业出口区域内货物：免税不退；卖给特殊区域的生活消费用品、交通工具：照常征税。","table":{"head":["步骤","公式","在干嘛"],"rows":[["①剔","出口额×(征税率-退税率)","国家少退的部分转成本"],["②抵","内销销项-(进项-①)-上期留抵","算出当期应纳税额"],["③算","出口额×退税率","退税天花板"],["④比","②的留抵 vs ③，取小","确定实退，差额为免抵税额"]]},"tips":["轻二原话：免抵退是「笑面虎」，理解难、做题易——把四步当流程图背下来，照走就行。"],"qs":[53,54,40]},{"id":"2-19","name":"税收优惠：免税清单、即征即退、离境退税","star":"★★","level":"L2","scene":"卖自己种的菜免，卖外购的菜不免；学校学费免，赞助费不免；国债利息——2025 年 8 月 8 日成了分水岭，之前的老券继续免，之后新发的不免。<br><br>免税清单长得像背不完，其实逻辑只有三类。","why":"免税的逻辑：<br>· <b>民生底线</b>：蔬菜、部分鲜活肉蛋批发零售、学历教育、医疗服务（不含营利性美容）、养老育养、残疾服务、个人转让著作权/自建自用住房等；<br>· <b>政策引导</b>：农业生产者卖<b>自产</b>农产品、技术转让、学生勤工俭学、残疾人组织进口专用品、政府国际组织无偿援助物资；<br>· <b>国家信用</b>：国债、地方政府债利息（但 2025.8.8 后新发的恢复征税，金融债同）。<br><br>免税的代价要清楚：<b>对应进项不得抵扣</b>（所以农民卖菜免税，下游也别想拿普票计算抵）。<br><br>另外两种「准优惠」：<b>即征即退</b>——先正常征再退一部分：软件产品实际税负超 3% 部分即征即退；海上风电即征即退 50%；资源综合利用按 30/50/70/90/100% 分档。<b>离境退税</b>——境外旅客（境内连续居住 ≤183 天）在退税商店同日同店买满 200 元可退，退人民币，超 2 万只能银行转账。","sentence":"免税看「民生+引导」；即征即退看「行业名单+比例」；免税 ≠ 零税率——免税的进项不能抵，零税率还能退。","trap":"· <b>2025.8.8</b> 是国债/地方债/金融债利息免税的分水岭：之后新发的<b>恢复征税</b>（多选 21 题就埋了这个雷，A 选项 2026 年发行的国债不免）；<br>· 营利性<b>美容</b>医疗机构不免；学校<b>赞助费、择校费</b>不免；农业生产者卖<b>外购</b>农产品不免（自产才免）；<br>· 个人（自然人）卖自己用过的物品免，<b>个体户</b>不免；<br>· 香港市场投资者基金互认买卖内地基金份额的收入免。","qs":[49,52,11,19,20,21,22,23,38,39]},{"id":"2-20","name":"征管与发票：义务什么时候发生、在哪儿交、专票三条红线","star":"★★","level":"L2","scene":"货发了但钱没收到，要不要交税？钱先收了但服务明年才提供呢？发票先开了呢？——「纳税义务发生时间」就是回答「从哪一刻起国家认为你欠它税」。","why":"总原则：<b>收讫销售款、取得索款凭据、交易完成——孰先</b>。合同写了付款日就按付款日；先开票的按开票日（票一开，下家可能马上拿去抵，国家不能让你这边说义务没发生）。特殊：视同销售看「完成当天」（货发出/权属转移）；进口看报关当天；先收款再分期提供服务的，以「首次实际开始提供服务」和「合同约定」孰先，且就<b>全部已收价款</b>一次申报。<br><br>纳税地点：固定业户在机构所在地；总分机构不同县市的分别申报（经省级批准可汇总）；无固定场所的在交易发生地。<br><br>计税期间：10 日、15 日、1 个月、1 季度四种；月/季为期满的<b>次月 1 日起 15 日内</b>申报；10 日/15 日为期满 5 日内预缴。<br><br><b>专票三条红线</b>：① 免税项目不能开（开了下家就能凭空抵）；② 卖给自然人的不能开；③ 差额计税里<b>扣除的那部分</b>不能开（旅游代付、签证费、建筑分包扣除额、金融商品转让等）。<br><br>异常凭证：你拿到的专票如果来自「非正常户、涉嫌虚开、比对不符、走逃企业」，这张票被冻结——没抵的暂不许抵，抵过的要转出（A 级纳税信用纳税人有核实申辩通道）。
