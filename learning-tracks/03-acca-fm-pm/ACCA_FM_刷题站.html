V Co has a cost of equity of 12%. Using the geometric average historical dividend growth rate and the dividend growth model, What is the market price of SKV Co shares to the nearest cent on an ex dividend basis?","options":["$4.67","$5.14","$5.40","$6.97"],"answer":"C","answerRaw":"第三项","explain":{"ans":"几何平均增长：g = (36.0/31.1)^(1/3) − 1 = 5.0%。D1 = 36.0×1.05 = 37.8c。P0 = 37.8/(0.12 − 0.05) = 37.8/0.07 = 540c = **$5.40**。","wrong":{"A":"$4.67 是用算术平均增长率（约 5.1%）或直接把 36 当 D1。","B":"$5.14 是 g 用了 4%（(36/32)^(1/2) 之类的错配）算出来的。","D":"$6.97 是 g 用了 2% 左右（把增长算小了，分母变大）。"},"point":"历史股利增长率用几何平均：(末期/期初)^(1/年数) − 1。","trap":"2010→2013 是 **3 年**增长（3 个间隔），指数用 1/3 不是 1/4。"}},{"id":"C4Q03","topic":4,"topicName":"WACC","n":3,"tag":"Risk Concept","type":"single","stem":"Which of the following statements is/are correct? (1) The asset beta reflects both business risk and financial risk (2) Total risk is the sum of systematic risk and unsystematic risk (3) Assuming that the beta of debt is zero will understate financial risk when ungearing an equity beta","options":["2 only","1 and 3 only","2 and 3 only","1, 2 and 3"],"answer":"A","answerRaw":"第一项","explain":{"ans":"只有②对。总风险 = 系统风险（不可分散）+ 非系统风险（可分散），这是定义。①错：**asset beta 只反映经营风险**，equity beta 才同时反映经营风险 + 财务风险。③错：假设 βd = 0 影响的是让**资产 beta** 被低估（少算了债务那部分系统风险），说成「低估财务风险」是概念错位——财务风险是 regear 时才加回去的。","wrong":{"B":"把①当对了。asset beta 只有 business risk，这是必背结论。","C":"含③，概念错位。","D":"三条全选，①③都错。"},"point":"asset beta = 经营风险；equity beta = 经营风险 + 财务风险。","trap":"「ungearing 用 asset beta，regearing 得 equity beta」——方向别反。"}},{"id":"C4Q04","topic":4,"topicName":"WACC","n":4,"tag":"Cost of equity (DVM)","type":"number","stem":"The following information is available for a listed company: |Dividend recently paid|$0.10 per share| |---|---| |Dividend cover|4 times| |Price earnings ratio|5 times| |Estimated future growth in dividends|8%| Using the dividend growth model, what is the cost of equity for this company (to one decimal place)?","options":[],"answer":"13.4%","answerRaw":"13.4%","explain":{"ans":"dividend cover 4 倍 → EPS = 0.10×4 = $0.40；P/E 5 倍 → 股价 = 0.40×5 = $2.00。Ke = D1/P0 + g = 0.10×1.08/2.00 + 8% = 5.4% + 8% = **13.4%**。","wrong":{"other":"典型错法：直接用 D0/P0（0.10/2.00=5%）不加增长，得 13.0%；或者 P/E 乘错了基数（用 0.10 而不是 0.40）。"},"point":"DVM 用股价时，要先由 dividend cover 和 P/E 反推出 EPS 和股价。","trap":"P/E 的分母是 EPS 不是 DPS——0.10×5 = 0.50 是错的。"}},{"id":"C4Q06","topic":4,"topicName":"WACC","n":6,"tag":"Capital Structure theory","type":"single","stem":"Which of the following statements concerning capital structure theory is correct?","options":["In the traditional view, there is a linear relationship between the cost of equity and financial risk.","Modigliani and Miller said that, in the absence of tax, the cost of equity would remain constant.","Pecking order theory indicates that preference shares are preferred to convertible debt as a source of finance.","Business risk is assumed to be constant in both the traditional view and M&M theory"],"answer":"D","answerRaw":"第四项","explain":{"ans":"D 对：传统理论和 M&M 理论都建立在「business risk 不变」的假设上，只有资本结构在变，才能分离出财务风险的影响。","wrong":{"A":"传统观点认为 Ke 随 gearing 上升而上升，但不是**线性**——先缓慢上升，超过一定程度后加速上升。","B":"M&M 无税世界说的是 **WACC 不变**，不是 Ke 不变；Ke 是随杠杆上升的（因为股东承担更多财务风险）。","C":"啄食顺序是：留存收益 → 债务 → 可转债/优先股 → 新股，优先股排在很后面，不是排在可转债前面。"},"point":"传统理论：WACC 先降后升（U 型）；M&M 无税：WACC 恒定；M&M 含税：越借越便宜。","trap":"M&M 不变的是 WACC，不是 Ke——这是最高频混淆点。"}},{"id":"C4Q07","topic":4,"topicName":"WACC","n":7,"tag":"Cost of equity","type":"single","stem":"A company has announced that it will pay an annual dividend equal to 55% of earnings. Its earnings per share is $0.80 and it has ten million shares in issue. The return on equity is 20% and the current cum div share price is $4.60.\nWhat is the cost of equity?","options":["19.4%","20.5%","22.7%","28.0%"],"answer":"B","answerRaw":"第二项","explain":{"ans":"派息率 55% → 留存率 b = 45%；g = b × ROE = 45%×20% = 9%。DPS = 0.80×55% = $0.44。cum-div 4.60 减去这笔待付股利 → ex-div = $4.16。Ke = 0.44/4.16 + 9% = 10.6% + 9% ≈ **20.5%**。","wrong":{"A":"19.4% 是把 0.44 当作 D1 且用 ex-div 价直接算（10.6%+9% 附近的舍入差异），或 g 取了 8.8%。","C":"22.7% 是分母用了更小的价格（如没减股利又扣了别的东西）。","D":"28.0% 是 g 用了 18%（把 ROE 直接当增长率再加留存率）。"},"point":"g = b × r（留存率 × 权益回报率），这是 Gordon 增长近似。","trap":"cum-div 价要减掉待付股利才是 P0；b = 1 − 派息率，不是派息率本身。"}},{"id":"C4Q08","topic":4,"topicName":"WACC","n":8,"tag":"Other Source Of Finance For SME","type":"single","stem":"Which of the following statements is/are correct? (BPP revision kit) 1. A drawback of crowdfunding as a means of raising equity finance is that it takes a long time to arrange 2. Peer to peer lending has developed to allow start-up companies to raise debt finance","options":["1 only","2 only","Both 1 and 2","Neither 1 and 2"],"answer":"D","answerRaw":"第四项","explain":{"ans":"两句都错，选 D。①错：众筹的特点是**快**、门槛低，不是「耗时长」——耗时长的恰恰是传统 IPO。②错：P2P 借贷主要服务**已有经营记录**的中小企业，初创公司（start-up）几乎拿不到。","wrong":{"A":"把①当对了。","B":"把②当对了。","C":"两句都肯定。"},"point":"众筹 = 快但小额；P2P = 给有现金流的企业，不给初创。","trap":"SME 融资渠道的「特点描述」题，方向常常被反过来写。"}},{"id":"C4Q10","topic":4,"topicName":"WACC","n":10,"tag":"MV of bond","type":"number","stem":"ZZ company has a 10% debenture which will be redeemed in 5 years at par value $100. The interest will be paid very 6 month. The required return by debt holders is 8%. Calculate the market value of the redeemable debenture. (to two decimal places) $","options":[],"answer":"$108.16","answerRaw":"$108.16","explain":{"ans":"半年付息：每期票息 = 5，期数 = 10，每期折现率 = 8%/2 = 4%。MV = 5×AF(4%,10) + 100×DF(4%,10) = 5×8.111 + 100×0.676 = 40.55 + 67.60 = **$108.16**。","wrong":{"other":"典型错法：用年付息（5 期、8%）算，得 10×3.993+100×0.681 = 108.0 附近但尾数不对；或期数用 5、利率用 4%。"},"point":"半年付息 → 票息减半、期数翻倍、折现率减半。","trap":"「interest paid every 6 months」出现就必须做这三个换算，漏一个就错。"}},{"id":"J9Q01","topic":5,"n":1,"src":"J","tag":"Market efficiency forms","type":"single","stem":"Company A plans to merge with company B, which is in the same industry, and this deal is expected to bring forward synergy benefit. This merger plan has not been published to stakeholders yet.\n\nWill the share price of company A reflect this information?","options":["Will reflect this information in semi-strong efficiency market","Will reflect this information in both semi-strong and strong efficiency market","Will only reflect this information in strong efficiency market","Will not reflect this information no matter what kind of market it is"],"answer":"C","answerRaw":"第三项","topicName":"Business valuation","explain":{"ans":"C：未公开的并购信息属于**内部（私人）信息**，只有强式有效市场（股价反映一切信息，包括内部信息）才会反映它。","wrong":{"A":"半强式只反映**公开**信息。","B":"半强式不反映内部信息，错。","D":"强式有效时就会反映，\"绝不反映\"太绝对。"},"point":"弱式=历史价格；半强式=全部公开信息；强式=公开+内部信息。","trap":"\"not been published\"是关键词——直接锁定内部信息→强式。"}},{"id":"J9Q02","topic":5,"n":2,"src":"J","tag":"Weak form efficiency","type":"single","stem":"Frank decided to plot past share price movements to help spot patterns and create an investment strategy.\n\nWhat does Frank believe the stock market is?","options":["Strong form efficient","Semi-strong form efficient","Weak form efficient","Completely inefficient"],"answer":"D","answerRaw":"第四项","topicName":"Business valuation","explain":{"ans":"D：用历史价格找规律赚钱 = 认为历史价格里有未被消化的信息 → 市场连**弱式有效**都达不到 = 完全无效率。","wrong":{"A":"强式有效则技术分析无效。","B":"半强式包含弱式，同样无效。","C":"若弱式有效，历史价格无规律可循，Frank 的策略不可能成立。"},"point":"技术分析/图表派的存在前提 = 市场非弱式有效。","trap":"别选 C：弱式有效恰恰说明历史价格**不能**预测未来。"}},{"id":"J9Q03","topic":5,"n":3,"src":"J","tag":"Strong form evidence","type":"multi","stem":"Which TWO of the following would be evidence of strong form market efficiency?","options":["The lack of regulation on use of private information (insider dealing)","Inability to consistently outperform the market and make abnormal gains","Immediate share price reaction to company announcements to the market","Regulation to ensure quick and timely public announcement of information"],"answer":"AB","answerRaw":"第一、二项","topicName":"Business valuation","explain":{"ans":"**A 和 B**。缺乏内幕交易监管的情况下仍无人持续跑赢（连掌握内幕信息的人都不行）→ 强式证据；无法持续获得超额收益本身也是强式（乃至一切有效性）的证据。","wrong":{"C":"公告即时反应是**半强式**证据。","D":"信息披露监管是**半强式**的制度条件。"},"point":"强式证据看\"内部信息也无利可图\"；C/D 只到半强式层级。","trap":"区分证据层级：即时反应→半强式；内部人无超额收益→强式。"}},{"id":"J9Q04","topic":5,"n":4,"src":"J","tag":"DVM with delayed dividend","type":"single","stem":"Cant Co has a cost of equity of 10% and has forecast its future dividends as follows:\n\nCurrent year: No dividend; Year 1: No dividend; Year 2: $0.25 per share; Year 3: $0.50 per share and increasing by 3% per year in subsequent years.\n\nWhat is the current share price of Cant Co using the dividend valuation model?","options":["$7.35","$5.57","$6.11","$6.28"],"answer":"C","answerRaw":"第三项","topicName":"Business valuation","explain":{"ans":"第 2 年末价值 = D₃/(Ke−g) = 0.50/(0.10−0.03) = 7.143\n当前股价 = (0.25 + 7.143)×DF(10%,2) = 7.393×0.826 = **$6.11**","wrong":{"A":"7.35 = 只把增长年金折一期或忘折现。","B":"5.57 = 增长起点错位（把 D₂ 当 D₁ 增长）。","D":"6.28 = 折现年数错。"},"point":"DVM 延迟起步：先在股利进入稳定增长的前一年锁定价值，再整体折现。","trap":"0.50 从第 3 年开始增长——价值锚点在第 2 年末，别在第 3 年末折完再折 3 期。"}},{"id":"C5Q01","topic":5,"topicName":"Business valuation","n":1,"tag":"Stock MKT Efficiency","type":"single","stem":"An investor believes that they can make abnormal returns by studying past share price movements. In terms of capital market efficiency, to which of the following does the investor's belief relate?","options":["Fundamental analysis","Operational efficiency","Technical analysis","Semi-strong form efficiency"],"answer":"C","answerRaw":"第三项","explain":{"ans":"研究**过去股价走势**找规律交易，这就是技术分析（technical analysis）。技术分析成立的前提是市场**不是**弱式有效。","wrong":{"A":"基本面分析看的是财报、行业、管理层等基本面信息，不是历史价格图形。","B":"operational efficiency 指市场交易机制高效（成交快、成本低），跟能不能赚钱是两回事。","D":"半强式说的是价格反映所有**公开信息**，与「研究历史价格」不是同一层次。"},"point":"弱式有效 ⇔ 历史价格无预测力 ⇔ 技术分析无效。","trap":"技术分析 vs 基本面分析的分界：输入信息是「历史价量」还是「公开基本面」。"}},{"id":"C5Q02","topic":5,"topicName":"Business valuation","n":2,"tag":"Stock MKT Efficiency","type":"single","stem":"Which of the following statements are correct? (1) If a capital market is weak form efficient, an investor cannot make abnormal returns by using technical analysis (2) Operational efficiency means that efficient capital markets direct funds to their most productive use (3) Tests for semi-strong form efficiency focus on the speed and accuracy of share price responses to the arrival of new information","options":["1 and 2 only","1 and 3 only","2 and 3 only","1, 2 and 3"],"answer":"B","answerRaw":"第二项","explain":{"ans":"①对：弱式有效下历史价格已反映，技术分析拿不到超额收益。③对：半强式检验看的就是公告后价格反应的速度与准确性。②错：把「资金流向最有生产力的用途」说成 operational efficiency——那是 **allocational efficiency（配置效率）**；operational 指的是交易执行层面的效率。","wrong":{"A":"把②当对了，混淆了配置效率和运营效率。","C":"同样含②，且漏了①。","D":"三条全选。"},"point":"三种效率：operational（交易执行）、allocational（资金配置）、pricing（定价/EMH 的三种形式）。","trap":"EMH 说的是 **pricing efficiency**，别和 operational/allocational 混。"}},{"id":"C5Q03","topic":5,"topicName":"Business valuation","n":3,"tag":"Net Asset (Equity","type":"single","stem":"The following financial information relates to QK Co, whose ordinary shares have a nominal value of $0.50 per share: non-current assets $120m; inventory $8m; trade receivables $12m; total assets $140m; ordinary shares $25m; reserves $80m; non-current liabilities $20m; current liabilities $15m. On a historic basis, what is the net asset value per share of QK Co?","options":["$2.10 per share","$2.50 per share","$2.80 per share","$4.20 per share"],"answer":"A","answerRaw":"第一项","explain":{"ans":"净资产 = 普通股 25 + 留存收益 80 = $105m。股数 = 25m/0.50 = 50m 股。NAV per share = 105/50 = **$2.10**。","wrong":{"B":"$2.50 是用总资产 140 或含长期负债的资本去除了。","C":"$2.80 是把非流动负债 20 也加进净资产（105+20=125/50=2.50，或用 140/50）。","D":"$4.20 是股数算成了 25m（把 $25m 股本当成 25m 股），105/25 = 4.20。"},"point":"NAV = 普通股股本 + 留存收益（不含优先股时），股数 = 股本/面值。","trap":"面值 $0.50 就是用来算股数的，别把股本金额当股数。"}},{"id":"C5Q04","topic":5,"topicName":"Business valuation","n":4,"tag":"Stock market efficiency","type":"single","stem":"Which of the following is evidence that stock markets are semi-strong form efficient?","options":["Share price reaction occurs before announcements are made public","Attempting to trade on consistently repeating patterns is unlikely to work","The majority of share price reaction to news occurs when it is announced","Repeating patterns appear to exist"],"answer":"C","answerRaw":"第三项","explain":{"ans":"半强式的核心检验标准：**新信息公告时，价格迅速且准确地反应**。所以「大部分反应发生在公告时」就是证据。","wrong":{"A":"价格在公告**之前**就动，说明有人提前知道消息 → 这是**强式**（甚至内幕交易）的证据，恰恰反驳半强式。","B":"「重复图形赚不到钱」是**弱式**的证据。","D":"「图形确实存在」直接反驳弱式有效。"},"point":"弱式 → 历史价格无规律；半强式 → 公告即时反应；强式 → 连内幕信息也反映。","trap":"A 选项的「before」是关键词，一字之差换了市场形态。"}},{"id":"C5Q05","topic":5,"topicName":"Business valuation","n":5,"tag":"Information For Valuation","type":"single","stem":"ZZ Plc is considering making a takeover bid for BB Plc. Both companies are large listed sportswear retailer in China. The shares of both ZZ and BB are regularly traded and their share price react quickly to new information. Which of the following is likely to be needed to allow ZZ to make sure that its bid is not too high?","options":["The latest published statement of BB Plc's financial position","Estimates of the present value of the synergies that are likely to result from the takeover","No information is likely to be needed because the stock market is semi-strong form efficient","An aged accounts receivables summary"],"answer":"B","answerRaw":"第二项","explain":{"ans":"两家都是大型上市公司、股价对新信息反应快 → 半强式有效，BB 的**公开信息已体现在股价里**。所以 ZZ 真正需要的是市场还没定价的东西：**协同效应的现值估计**——出价不能超过「BB 独立价值 + 协同价值」。","wrong":{"A":"财务报表是公开信息，半强式下已经反映在股价里，看了也不带来额外价值。","C":"半强式有效不代表不用做估值——协同效应是 ZZ 自己创造的，市场不会替你算。","D":"账龄表是内部明细，对判断整体出价上限帮助很小。"},"point":"收购出价上限 = 目标独立价值（市场价格）+ 协同效应现值。","trap":"「市场有效」不等于「不用分析」，被收购方创造的价值仍需自己估。"}},{"id":"C5Q06","topic":5,"topicName":"Business valuation","n":6,"tag":"Weak Form Efficient","type":"multi","stem":"The efficient markets hypothesis refers to the way in which the prices of traded financial securities reflect relevant information. Which TWO of the following are true for a weak-form efficient market?","options":["Share prices fully and fairly represent past information","Share prices fully and fairly represent private information","Share prices appear to follow a 'random walk'","The market does not provide enough information to make good buying and selling decisions"],"answer":"AC","answerRaw":"第一、三项","explain":{"ans":"弱式有效就两条：A（价格充分反映**过去**信息）和 C（价格呈**随机漫步**，前后不相关）。","wrong":{"B":"「反映私人信息」是**强式**，不是弱式。","D":"弱式有效说价格已反映历史信息，但没说「信息不足以做决策」——这是错误推论。"},"point":"弱式=历史信息；半强式=公开信息；强式=全部信息（含内幕）。","trap":"多选题要选**两个**，A+C 是唯一正确组合。"}},{"id":"C5Q07","topic":5,"topicName":"Business valuation","n":7,"tag":"DVM-Valuation","type":"single","stem":"Bilbo Co is an unlisted company with 800,000 issued shares. Seema is one of the founders and owns 20% of the issued shares. Bilbo Co has just paid its annual dividend of $0.30 per share. It is expected that next year's dividend will be $0.32 per share. After that it is expected that dividends will grow indefinitely at 2% per year. Shareholders expect a 12% return from their investment. Using the dividend valuation model, calculate the value of Seema's shareholding.","options":["$512,000","$522,240","$489,600","$480,000"],"answer":"A","answerRaw":"第一项","explain":{"ans":"两段式：第 1 年股利 0.32 单独折现，之后从 0.32×1.02 起永续增长。P0 = 0.32/1.12 + [0.3264/(0.12−0.02)]/1.12 = 0.2857 + 3.264/1.12 = 0.2857 + 2.914 = **$3.20**。Seema 持股 800,000×20% = 160,000 股 → 160,000×3.20 = **$512,000**。","wrong":{"B":"$522,240 是漏了第一年单独折现、直接把 0.32 当永续起点（P0=3.264，×160,000=522,240）。","C":"$489,600 是股数用了 153,000 或用 3.06 的股价。","D":"$480,000 是股价用了 $3.00（g 取 1.3% 之类）。"},"point":"DVM 两段式：前段逐年折现，后段用 g 的永续公式再折回 0 期。","trap":"永续段的起点是「第 2 年股利」，且要再折现一次回 0 期，这两步最容易漏。"}},{"id":"C5Q08","topic":5,"topicName":"Business valuation","n":8,"tag":"Reason Of Valuation Difference","type":"single","stem":"Alpha Co and Beta Co are two companies in different industries who are both evaluating the acquisition of the same target company called Gamma Co. Gamma Co is in the same industry as Alpha Co. Alpha Co has valued Gamma Co at $100m but Beta Co has only valued Gamma Co at $90m. Which of following statements would explain why Alpha Co's value of Gamma Co is higher?","options":["Alpha Co has used more prudent growth estimates","Beta Co could achieve more synergy","Beta Co is a better negociator than Alpha Co","Gamma Co is a direct competitor of Alpha Co"],"answer":"D","answerRaw":"第四项","explain":{"ans":"Gamma 是 Alpha 的**直接竞争对手**（同行业）→ Alpha 更懂这个行业、能实现更多协同（成本削减、渠道整合），所以愿意出更高价。","wrong":{"A":"更**保守**的增长假设只会让估值更低，方向反了。","B":"Beta 能实现更多协同，应该估得**更高**，与题干相反。","C":"谈判能力影响成交价，不影响估值本身。"},"point":"同一目标估值不同的原因：行业相关性 → 协同效应大小 → 出价上限不同。","trap":"问的是「为什么 Alpha 估得高」，别选成「Beta 为什么低」。"}},{"id":"C5Q10","topic":5,"topicName":"Business valuation","n":10,"tag":"Stock Market Efficiency","type":"single","stem":"A financial manager believes that if information regarding his organisation is made public, it will not affect the share price as this information is already reflected in the current share price. What is the correct answer?","options":["Weak form efficiency","No efficiency","Strong form efficiency","Semi-strong form efficiency"],"answer":"C","answerRaw":"第三项","explain":{"ans":"「信息公开后价格也不动，因为已经反映」= 连**私人/内幕**信息都已经在价格里 → **强式有效**。","wrong":{"A":"弱式只管历史信息，公开新信息仍会推动价格。","B":"无效率意味着公开信息会明显推动价格，与题干相反。","D":"半强式下，**新公开**的信息会引起价格变动——题干说不动，所以超过半强式。"},"point":"判断市场形态就看「哪种信息已经不带来价格变动」。","trap":"「already reflected」修饰的是哪种信息，决定答案。"}},{"id":"C5Q11","topic":5,"topicName":"Business valuation","n":11,"tag":"Stock Mkt efficiency","type":"single","stem":"Which of the following is an implication of the semi-strong form of the efficient markets hypothesis?","options":["Security price movements should be predictable","Security prices should fully and fairly reflect all available information, whether public or private","Security prices should move when a takeover is announced","There would be no need to ban insider dealing"],"answer":"C","answerRaw":"第三项","explain":{"ans":"半强式 → 公开信息（如收购公告）一公布，价格**立即**调整。C 说的正是这一点。","wrong":{"A":"半强式下价格不可预测（随机漫步），可预测是无效市场的特征。","B":"「公开和私人信息都反映」是**强式**的定义。","D":"正因半强式下内幕信息仍能赚钱，才需要禁止内幕交易；强式下才「没必要」。"},"point":"EMH 的政策含义：弱式→技术分析无用；半强式→基本面分析无用但仍需禁内幕；强式→连内幕都无用。","trap":"B 和 D 都是强式的推论，别串到半强式。"}},{"id":"J10Q01","topic":6,"n":1,"src":"J","tag":"Derivatives contract size","type":"single","stem":"Which of the following derivative instruments are characterised by a standard contract size?\n\n(1) Futures contract\n(2) Exchange-traded option\n(3) Forward rate agreement\n(4) Swap","options":["1 and 2","2 and 3","3 and 4","1 and 4"],"answer":"A","answerRaw":"第一项","topicName":"Risk management","explain":{"ans":"A：期货 (1) 和场内期权 (2) 都是交易所标准化产品（标准合约规模、标准到期日）。","wrong":{"B":"FRA 是场外（OTC）定制产品，无标准规模。","C":"Swap 同为 OTC 定制。","D":"同上，FRA 不标准。"},"point":"标准化（交易所）vs 定制（OTC）：futures、exchange-traded options 标准化；FRA、swap、OTC options 定制。","trap":"用\"在哪交易\"判断：交易所=标准化，场外=量身定做。"}},{"id":"J10Q02","topic":6,"n":2,"src":"J","tag":"FRA compensation","type":"number","stem":"A company that has a $10m loan with a variable rate of interest has acquired a forward rate agreement (FRA) with a financial institution that offered a 3-6, 3.2% - 2.7% spread.\n\nWhat would be the payment made to the financial institution under the terms of the FRA if the actual rate of interest was 3% (to the nearest dollar)?","options":[],"answer":"5,000","answerRaw":"5,000","topicName":"Risk management","explain":{"ans":"FRA 3–6 借款利率 = 3.2%（公司要借钱，用高的那档）\n实际利率 3% < 3.2% → 公司补偿银行差额\n支付 = (3.2% − 3%)×10m×3/12 = 0.2%×2.5m = **$5,000**","wrong":{"other":"常见错：① 用 2.7%（那是存款档）；② 期限用 6/12 而不是 3/12（3–6 的区间是 3 个月）。"},"point":"FRA 双向报价：借款用高价、存款用低价；补偿 = 利差×本金×借款期。","trap":"\"3–6\"指 3 个月后开始的 3 个月期借款——计息期是 3 个月。"}},{"id":"J10Q04","topic":6,"n":4,"src":"J","tag":"Hedging a future borrowing","type":"multi","stem":"Act Co wishes to hedge interest rate movements on a borrowing it intends to make three months from now for a further period of six months.\n\nWhich TWO of the following will best help Act Co hedge its interest rate risk?","options":["Enter into a 3 v 6 forward rate agreement","Enter into a 3 v 9 forward rate agreement","Sell interest rate futures expiring in three months' time","Buy interest rate futures expiring in three months' time"],"answer":"BC","answerRaw":"第二、三项","topicName":"Risk management","explain":{"ans":"**B 和 C**。3 个月后借 6 个月 → 3 v 9 的 FRA（B）；借款人对冲利率上升 → 卖利率期货（C）。","wrong":{"A":"3 v 6 只覆盖 3 个月借款期，期限不够。","D":"买期货是对冲利率**下降**（存款人）的方向。"},"point":"FRA 记号 = 起点 v 终点（月）；借款→卖期货。","trap":"\"3 v 9\" = 3 个月后开始、9 个月时结束，正好覆盖 6 个月借款。"}},{"id":"J10Q05","topic":6,"n":5,"src":"J","tag":"Interest rate options","type":"single","stem":"Which of the following statements about interest rate risk hedging is correct?","options":["An interest rate floor can be used to hedge an expected increase in interest rates","The cost of an interest rate floor is higher than the cost of an interest rate collar","The premium on an interest rate option is payable when it is exercised","The standardised nature of interest rate futures means that over- and under-hedging can be avoided"],"answer":"B","answerRaw":"第二项","topicName":"Risk management","explain":{"ans":"B：Collar = 买 cap + 卖 floor，卖出 floor 收到权利金 → collar 净成本 < 单独买 floor（或 cap）→ floor 成本高于 collar ✓","wrong":{"A":"Floor 对冲利率**下降**（保护存款收益），不对冲利率上升。","C":"期权权利金在**购买时**支付，无论将来行权与否。","D":"期货标准化 → 金额只能取整 → over/under-hedging 无法避免。"},"point":"Collar = 放弃部分上行空间换成本下降。","trap":"C 是高频陷阱：premium 买入即付，行权与否都不退。"}},{"id":"J10Q06","topic":6,"n":6,"src":"J","tag":"Forward rate (IRP)","type":"single","stem":"The home currency of ZZ is the $ and it trades with a company in a foreign country whose home currency is the Euro. The following information is available:\n\nSpot rate: 2 Euro/$; Interest rate: home currency ($) 6%, foreign currency (Euro) 5%; Inflation rate: home 4.5%, foreign 3%.\n\nWhat is the 6 month forward exchange rate?","options":["1.981 Euro/$","1.990 Euro/$","1.971 Euro/$","1.985 Euro/$"],"answer":"B","answerRaw":"第二项","topicName":"Risk management","explain":{"ans":"6 个月远期（欧元/美元报价）：\nF = 2 × (1 + 5%/2)/(1 + 6%/2) = 2×1.025/1.03 = **1.990 欧元/$**\n（用**半年期**利率；美元利率高 → 远期美元贬值 → 每美元换到的欧元变少）","wrong":{"A":"1.981 = 把利率方向搞反（×1.06/1.05 再折半年错）。","C":"1.971 = 方向反 + 期数错。","D":"1.985 = 简单近似 (2×(1+(5%−6%)/2))。"},"point":"IRP：F = S×(1+i报价货币)/(1+i基础货币)，期限要匹配（半年用半年利率）。","trap":"报价是 euro per $——欧元利率做分子；高利率货币远期贴水。"}},{"id":"JP1","topic":6,"n":1,"src":"J","tag":"Peony Co: yield curve","type":"single","stem":"[Peony Co] Peony Co's finance director is concerned about the effect of future interest rates on the company and has been looking at the yield curve. Peony Co plans to take out a $100m loan in 3 months' time for 9 months, and its bank has offered a 3 v 12 FRA at 7.10 - 6.85.\n\nIn relation to the yield curve, which of the following statements is correct?","options":["Expectations theory suggests that deferred consumption requires increased compensation as maturity increases","An inverted yield curve can be caused by government action to increase its long-term borrowing","A kink (discontinuity) in the normal yield curve can be due to differing yields in different market segments","Basis risk can cause the corporate yield curve to rise more steeply than the government yield curve"],"answer":"C","answerRaw":"第三项","topicName":"Risk management","explain":{"ans":"C：市场分割理论（market segmentation）——不同期限市场由不同供需主体主导，收益率曲线出现**拐点/kink** 正是分割的体现 ✓","wrong":{"A":"期望理论谈未来利率预期，不是\"递延消费补偿\"（那是流动性偏好理论）。","B":"政府增加长期借款 → 长期利率上升 → 曲线更陡，不会倒挂。","D":"Basis risk 指对冲工具与标的不完全相关，不是曲线陡峭的理由。"},"point":"三大利率期限结构理论：期望、流动性偏好、市场分割。","trap":"kink/不连续 是分割理论的招牌现象。"}},{"id":"JP2","topic":6,"n":2,"src":"J","tag":"Peony Co: FRA compensation","type":"single","stem":"[Peony Co] Peony Co plans to take out a $100m loan in 3 months' time for a period of 9 months. The bank has offered a 3 v 12 FRA at 7.10 - 6.85. Peony Co is concerned that interest rates might rise before the loan is taken out.\n\nIf the interest rate on the loan is 6.5% when it is taken out, what is the nature of the compensatory payment under the forward rate agreement?","options":["Peony Co pays bank $600,000","Peony Co pays bank $250,000","Peony Co pays bank $450,000","Bank pays Peony Co $600,000"],"answer":"C","answerRaw":"第三项","topicName":"Risk management","explain":{"ans":"借款用 FRA 报价高档 7.10%（3 v 12 的借款利率）\n实际利率 6.5% < 7.10% → Peony 补偿银行\n支付 = (7.10% − 6.5%)×100m×9/12 = 0.6%×75m = **$450,000**","wrong":{"A":"600,000 = 期限按 12/12 算（实际借款 9 个月）。","B":"250,000 = 用 6.85%（存款档）算。","D":"方向反：利率低于 FRA 价时是公司**付**钱。"},"point":"FRA 补偿 = (FRA 借款利率 − 实际利率)×本金×借款期限。","trap":"3 v 12 = 3 个月后开始、借到 12 个月时点 → 计息期 9 个月；7.10–6.85 里借款取 7.10。"}},{"id":"JP3","topic":6,"n":3,"src":"J","tag":"Peony Co: IRP income","type":"single","stem":"[Peony Co] Peony Co's domestic currency is the dollar ($). A project will generate income of 580m pesos, with 200m pesos being paid in 6 months' time and 380m pesos being paid in 12 months' time. The current spot exchange rate is 5 pesos per $1. Current short-term interest rates: Dollars 6.5% per year; Pesos 10.0% per year.\n\nUsing exchange rates based on interest rate parity, what is the dollar income received from the project?","options":["$112.3m","$114.1m","$116.0m","$112.9m"],"answer":"D","answerRaw":"第四项","topicName":"Risk management","explain":{"ans":"IRP 求远期汇率（ pesos per $，比索利率做分子）：\nF(6m) = 5×(1+10%/2)/(1+6.5%/2) = 5×1.05/1.0325 = 5.0847\nF(12m) = 5×1.10/1.065 = 5.1646\n美元收入 = 200/5.0847 + 380/5.1646 = 39.33 + 73.58 = **$112.9m**","wrong":{"A":"112.3 = 远期方向搞反（美元利率做分子）。","B":"114.1 = 用即期 5 直接除或方向错的变体。","C":"116.0 = 同 A 的另一变体。"},"point":"比索利率高 → 远期比索贬值 → 每美元换更多比索（远期 5.08/5.16 > 5）。","trap":"高利率货币远期贴水：pesos 利率 10% > 美元 6.5%，所以远期 pesos/$ 变大。"}},{"id":"JP4","topic":6,"n":4,"src":"J","tag":"Peony Co: risk management","type":"single","stem":"[Peony Co] Peony Co is considering a variety of ways to manage its interest rate risk, including the use of derivatives.\n\nIn respect of Peony Co managing its interest rate risk, which of the following statements is/are correct?\n\n(1) Smoothing is an interest rate risk hedging technique that involves maintaining a balance between fixed-rate and floating-rate debt\n(2) Asset and liability management can hedge interest rate risk by matching the maturity of assets and liabilities","options":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"answer":"C","answerRaw":"第三项","topicName":"Risk management","explain":{"ans":"C：两句都对。Smoothing = 固定利率与浮动利率债务保持平衡 (1)；资产负债管理 = 期限匹配 (2)。","wrong":{"A/B":"都是缺一项的干扰，两句表述本身都正确。","D":"同上。"},"point":"利率风险管理的非衍生工具：smoothing、matching（资产负债期限）、提前/延后收付。","trap":"这两个表述是教材原文级别的定义，逐句核对即可。"}},{"id":"JP5","topic":6,"n":5,"src":"J","tag":"Peony Co: derivatives","type":"single","stem":"[Peony Co] In relation to the use of derivatives by Peony Co, which of the following statements is correct?","options":["Interest rate options must be exercised on their expiry date, if they have not been exercised before then","Peony Co can hedge interest rate risk on borrowing by selling interest rate futures now and buying them back in the future","An interest rate swap is an agreement to exchange both principal and interest rate payments","Peony Co can hedge interest rate risk on borrowing by buying a floor and selling a cap"],"answer":"B","answerRaw":"第二项","topicName":"Risk management","explain":{"ans":"B：借款人怕利率上升 → 现在**卖出**利率期货、将来买回 ✓","wrong":{"A":"场内（美式）期权到期前随时可行使，\"必须在到期日行权\"描述的是欧式期权。","C":"利率互换只交换**利息**（固定换浮动），本金不动（notional 仅用于计息）。","D":"借款人的 collar = 买 cap + 卖 floor；\"买 floor 卖 cap\"是存款人的做法。"},"point":"借款人工具箱：FRA/期货（锁死）、买 cap（保顶不封底）、collar（保顶+卖底降成本）。","trap":"principal 只在 currency swap 里才交换，利率 swap 本金只是名义额度。"}},{"id":"C6Q01","topic":6,"topicName":"Risk management","n":1,"tag":"Interest Rate Hedging Methods","type":"single","stem":"In relation to hedging interest rate risk, which of the following statements is correct?","options":["The flexible nature of interest rate futures means that they can always be matched with a specific interest rate exposure","Interest rate options carry an obligation to the holder to complete the contract at maturity","Forward rate agreements are the interest rate equivalent of forward exchange contracts","Matching is where a balance is maintained between fixed rate and floating rate debt"],"answer":"C","answerRaw":"第三项","explain":{"ans":"C 对：FRA 就是「利率版」的远期外汇合约——锁定未来某段期间的利率，OTC 定制、无本金交换。","wrong":{"A":"期货是**标准化**合约，交割月份固定，不能和任意具体日期完美匹配，所以无法「always matched」。","B":"期权给的是**权利**不是义务；有义务的是期货和远期。","D":"「固定与浮动利率保持平衡」是 **smoothing（平滑）**，不是 matching——matching 是把资产和负债的利率性质/期限对齐。"},"point":"内部三法：matching（匹配）、smoothing（平滑）、asset & liability management（资产负债管理）。","trap":"matching 和 smoothing 都是「平衡」，区别在对象：匹配资产与负债 vs 平衡固定与浮动。"}},{"id":"C6Q02","topic":6,"topicName":"Risk management","n":2,"tag":"Predict Exchange Rate","type":"single","stem":"The home currency of ACB Co is the dollar ($) and it trades with a company in a foreign country whose home currency is the Dinar. The following information is available: Home country Foreign country Spot rate 20.00 Dinar per $ Interest rate 3% per year 7% per year Inflation rate 2% per year 5% per year What is the six-month forward exchange rate?","options":["20.39 Dinar per $","20.30 Dinar per $","20.59 Dinar per $","20.78 Dinar per $"],"answer":"A","answerRaw":"第一项","explain":{"ans":"远期汇率用**利率平价**（不是 PPP）：F = S × (1 + i_foreign × 6/12)/(1 + i_home × 6/12) = 20.00 × (1+3.5%)/(1+1.5%) = 20 × 1.035/1.015 = **20.39**。外币利率高 → 外币远期贴水（Dinar 变多才能换 1 美元）。","wrong":{"B":"20.30 是用了**通胀率**（5%/2%）算的，那是预测即期汇率的 PPP，不是远期汇率。","C":"20.59 是利率方向搞反了（分子分母倒置后再放大）。","D":"20.78 是把年利率直接当半年利率用（没乘 6/12）。"},"point":"F = S×(1+i_c)/(1+i_b)：远期看**利率**，即期预测看**通胀**。","trap":"题目同时给利率和通胀，问 forward 就用利率——这是最经典的干扰设计。"}},{"id":"C6Q03","topic":6,"topicName":"Risk management","n":3,"tag":"Exchange Rate Change Effect","type":"single","stem":"What is the impact of a fall in a country's exchange rate? (1) Exports will be given a stimulus (2) The rate of domestic inflation will rise","options":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"answer":"C","answerRaw":"第三项","explain":{"ans":"两句都对。①本币贬值 → 出口品在国外变便宜 → 出口需求上升。②进口原材料、能源变贵 → 成本推动 → 国内通胀上升。","wrong":{"A":"只认出口刺激，漏了通胀传导。","B":"只认通胀，漏了出口。","D":"两句都否，方向全反。"},"point":"本币贬值 = 出口利好 + 进口通胀（双刃剑）。","trap":"J-curve 效应会让出口改善有滞后，但方向上①仍然成立。"}},{"id":"C6Q04","topic":6,"topicName":"Risk management","n":4,"tag":"Foreign Currency Risk","type":"single","stem":"There is a risk that the value of our foreign currency-denominated assets and liabilities will change when we prepare our accounts.\nTo which risk does the above statement refer?","options":["Translation risk","Economic risk","Transaction risk","Interest rate risk"],"answer":"A","answerRaw":"第一项","explain":{"ans":"「编制报表时，外币资产/负债的价值发生变化」= **折算风险（translation risk）**，纯粹是会计折算，不影响现金流。","wrong":{"B":"经济风险是长期汇率变动对公司**未来竞争力/价值**的影响。","C":"交易风险是已签约的进出口在结算日之前汇率变动，直接影响现金流。","D":"利率风险与汇率无关。"},"point":"三种外汇风险：translation（报表折算）、transaction（结算现金流）、economic（长期竞争力）。","trap":"题干出现「prepare our accounts」就是 translation 的信号词。"}},{"id":"C6Q05","topic":6,"topicName":"Risk management","n":5,"tag":"Money Mkt Hedge","type":"single","stem":"A company whose home currency is the dollar ($) expects to receive 500,000 pesos in six months' time from a customer in a foreign country. The following interest rates and exchange rates are available to the company: |Spot rate|15.00 peso per $| |---|---| |Six-month forward rate|15.30 peso per $| ||Home country|Foreign country| |---|---|---| |Borrowing interest rate|4% per year|8% per year| |Deposit interest rate|3% per year|6% per year|\nWorking to the nearest $100, what is the six-month dollar value of the expected receipt using a money-market hedge?","options":["$32,500","$33,700","$31,800","$31,900"],"answer":"A","answerRaw":"第一项","explain":{"ans":"应收外币 → 货币市场对冲：先**借外币**（8%/年，半年 4%）→ 500,000/1.04 = 480,769 pesos；按即期 15.00 换成 $32,051；再**存美元**（3%/年，半年 1.5%）→ 32,051×1.015 = **$32,532 ≈ $32,500**。","wrong":{"B":"$33,700 是按远期 15.30 直接换算后再调整，用了远期而非即期。","C":"$31,800 是把 borrowing/deposit 利率用反（美元用 4%、比索用 6%）。","D":"$31,900 是漏了美元存款利息。"},"point":"应收外币的对冲顺序：借外币 → 即期换本币 → 存本币。","trap":"借的是**外币的借款利率**，存的是**本币的存款利率**，两边的利率不能混。"}},{"id":"C6Q06","topic":6,"topicName":"Risk management","n":6,"tag":"Exchange Traded Tools For Currency","type":"single","stem":"Which of the following statements is correct?","options":["Once purchased, currency futures have a range of close-out dates","Currency swaps can be used to hedge exchange rate risk over longer periods than the forward market","Banks will allow forward exchange contracts to lapse if they are not used by a company","Currency options are paid for when they are exercised"],"answer":"B","answerRaw":"第二项","explain":{"ans":"B 对：货币互换期限可以做到几年甚至十年，远期市场通常只有 1 年以内（流动性好的期限更短）。","wrong":{"A":"期货是标准化合约，交割日固定且有限，不是「a range of close-out dates」；可以**平仓**，但不等于随意选日期。","C":"远期合约到期必须履约或展期，银行不会让它「自动失效」，不履约就是违约。","D":"期权费在**购买时**支付，不是行权时。"},"point":"期限长度排序：远期（≤1 年）< 期货（标准化短中期）< 互换（长期）。","trap":"期权费时点（购买时付）和远期不可撤销，这两条每年都考。"}},{"id":"C6Q07","topic":6,"topicName":"Risk management","n":7,"tag":"Cause Of Interest Rate Change","type":"single","stem":"Which of the following statements is correct?","options":["Governments may choose to raise interest rates so that the level of general expenditure in the economy will increase","The normal yield curve slopes upward to reflect increasing compensation to investors for being unable to use their cash now","The yield on long-term loan notes is lower than the yield on short-term loan notes because long-term debt is less risky for a company than short-term debt","Expectations theory states that future interest rates reflect expectations of future inflation rate movements"],"answer":"B","answerRaw":"第二项","explain":{"ans":"B 对：正常收益率曲线向上倾斜，是因为长期锁住资金、牺牲了流动性，投资者要求**期限溢价**。","wrong":{"A":"政府升息是为了**抑制**总支出/通胀，不是为了增加支出。","C":"长期债券收益率通常**更高**（期限溢价），不是更低。","D":"预期理论说的是远期利率反映**未来利率**的预期，不是通胀预期（那是费雪效应）。"},"point":"正常曲线向上 = 期限溢价；倒挂 = 预期未来降息。","trap":"预期理论解释的是「利率」，费雪效应才是「通胀」。"}},{"id":"C6Q08","topic":6,"topicName":"Risk management","n":8,"tag":"Interest Rate Change","type":"single","stem":"Which of the following statements are correct? (1) The general level of interest rates is affected by investors' desire for a real return (2) Market segmentation theory can explain kinks (discontinuities) in the yield curve (3) When interest rates are expected to fall, the yield curve could be sloping downwards","options":["1 and 2 only","1 and 3 only","2 and 3 only","1, 2 and 3"],"answer":"D","answerRaw":"第四项","explain":{"ans":"三条都对。①实际回报要求是利率的基本组成部分（实际利率 + 通胀 + 风险溢价）。②市场分割理论能解释曲线上的「折点」——不同期限由不同投资者群体定价。③预期未来利率下降 → 长期利率低于短期 → 曲线向下（倒挂）。","wrong":{"A":"漏了③，倒挂是预期理论的直接推论。","B":"漏了②，折点正是市场分割理论的解释对象。","C":"漏了①，实际回报要求是最基础的一条。"},"point":"利率水平的构成：实际回报 + 通胀补偿 + 流动性偏好 + 风险溢价。","trap":"「kink/折点」只有一个理论能解释：市场分割理论。"}},{"id":"C6Q09","topic":6,"topicName":"Risk management","n":9,"tag":"Interest Hedging Techniques","type":"single","stem":"Which of the following statements are correct? (1) Interest rate options allow the buyer to take advantage of favourable interest rate movements (2) A forward rate agreement does not allow a borrower to benefit from a decrease in interest rates (3) Borrowers hedging against an interest rate increase will buy interest rate futures now and sell them at a future date","options":["1 and 2 only","1 and 3 only","2 and 3 only","1, 2 and 3"],"answer":"A","answerRaw":"第一项","explain":{"ans":"①对：期权买方可以只享受有利变动、放弃不利变动。②对：FRA 锁死了利率，利率下降时借款者仍按约定利率，享受不到好处。③错：借款者对冲利率**上升**应该**先卖**期货，到期**买回**，方向写反了。","wrong":{"B":"把③当对了。方向反了：borrower 是 seller of futures。","C":"②③都对，③错。","D":"三条全选。"},"point":"期货方向口诀：借款者（怕利率涨）先卖后买；存款者（怕利率跌）先买后卖。","trap":"「buy futures now」是存款者的动作，看到 borrower + buy 就要判错。"}},{"id":"C6Q10","topic":6,"topicName":"Risk management","n":10,"tag":"IRPT","type":"single","stem":"An investor plans to exchange $1,000 into euros now, invest the resulting euros for 12 months, and then exchange the euros back into dollars at the end of the 12-month period. The spot exchange rate is €1.415 per $1 and the euro interest rate is 2% per year. The dollar interest rate is 1.8% per year. Compared to making a dollar investment for 12 months, at what 12-month forward exchange rate will the investor make neither a loss nor a gain?","options":["€1.223 per $1","€1.412 per $1","€1.418 per $1","€1.439 per $1"],"answer":"C","answerRaw":"第三项","explain":{"ans":"无盈亏的远期汇率就是利率平价算出的均衡远期：F = 1.415 × (1 + 2%)/(1 + 1.8%) = 1.415 × 1.001965 = **€1.418 per $1**。在这个汇率上，走「换欧元投资」和「直接投美元」结果完全相同。","wrong":{"A":"1.223 是分子分母倒置或把利率差当成 15% 算出来的。","B":"1.412 是把利率方向搞反（欧元利率更低才对）。","D":"1.439 是把两期利息重复计算（复利了两次）。"},"point":"IRP：高利率货币远期贴水，低利率货币远期升水。","trap":"判断方向：欧元利率 2% > 美元 1.8%，欧元应贴水 → 需要更多欧元换 1 美元 → F > S。"}},{"id":"C6Q11","topic":6,"topicName":"Risk management","n":11,"tag":"Gap Exposure","type":"single","stem":"Which of the following is a description of gap exposure?","options":["The difference between short-term and long-term interest rates","The difference between the amounts of interest-sensitive assets and liabilities","The difference between spot interest rates and futures interest rates","The difference between fixed and floating interest rates"],"answer":"B","answerRaw":"第二项","explain":{"ans":"gap exposure = **利率敏感资产与利率敏感负债的金额差**（重定价缺口）。差额越大，利率变动对净利息收入的冲击越大。","wrong":{"A":"短期与长期利率之差是「收益率曲线的斜率」，不是 gap。","C":"即期与期货利率之差是**基差（basis）**。","D":"固定与浮动利率之差不是 gap exposure 的定义。"},"point":"gap = 利率敏感资产 − 利率敏感负债。","trap":"gap / basis / 期限结构，三个概念近义但不同，别混。"}},{"id":"C6Q12","topic":6,"topicName":"Risk management","n":12,"tag":"FRA (Interest","type":"number","stem":"A company that has a $14m loan, with a variable rate of interest, has acquired a forward rate agreement (FRA) with a financial institution that offered a 4-11, 2.85% - 2.35% spread. What would be the amount received from the financial institution, under the terms of the FRA, if the actual rate of interest was 3.75%? (to the nearest dollar) $","options":[],"answer":"$73,500","answerRaw":"$73,500","explain":{"ans":"FRA 报价 4-11、2.85–2.35：借款利率 2.85%，期间是第 4 个月到第 11 个月共 **7 个月**。实际利率 3.75% > 2.85%，公司从银行收补偿：(3.75% − 2.85%) × $14m × 7/12 = 0.9% × 14m × 0.5833 = **$73,500**。","wrong":{"other":"典型错法：期间用 11 个月（0.9%×14m×11/12 = 115,500）；或用贷出利率 2.35%（差 1.4%，得 114,333）。"},"point":"FRA 补偿 = 利率差 × 本金 × 合约期间/12，期间 = 结束月 − 开始月。","trap":"4-11 是「4 个月后开始、11 个月后结束」，长度是 7 个月不是 11 个月；借款方用**较高的那个**报价（2.85%）。"}},{"id":"C6Q13","topic":6,"topicName":"Risk management","n":13,"tag":"Standard Tools","type":"multi","stem":"Which TWO of the following derivative instruments are characterized by a standard contract size?","options":["Forward contract","Forward rate agreement","Futures contract","Swap","Over-the-counter option","Exchange tradable option"],"answer":"CF","answerRaw":"第三、六项","explain":{"ans":"标准化合约规模只属于**交易所**产品：期货（futures）和交易所交易期权（exchange-traded option）→ C 和 F。","wrong":{"A":"远期合约是 OTC 定制，金额随意，没有标准规模。","B":"FRA 也是 OTC，本金可定制。","D":"互换是 OTC 双边协议，本金自由。","E":"OTC 期权同样是定制的。"},"point":"交易所 = 标准化（规模、到期日固定）+ 有保证金 + 可平仓；OTC = 定制 + 对手方风险。","trap":"题目要选**两个**，C+F 是唯一一对「交易所」产品。"}},{"id":"C6Q14","topic":6,"topicName":"Risk management","n":14,"tag":"","type":"multi","stem":"Which TWO of the following statements concerning the interest rate risk management method of smoothing are true?","options":["The debt portfolio will consist of a mixture of fixed and floating rate debt.","Interest payments will still increase if the interest rate rises.","Investments with a fixed cash flow will be financed with fixed rate debt","Full benefit will be obtained from a fall in interest rates","The net effect will be an interest payment which is fixed overall"],"answer":"AB","answerRaw":"第一、二项","explain":{"ans":"smoothing = 债务组合里**同时保留固定和浮动**，让利率波动只影响到一部分债务。所以 A 对（组合混合），B 对（还有浮动部分，利率上升利息仍会增加）。","wrong":{"C":"「固定现金流资产用固定利率债务融资」是 **matching**，不是 smoothing。","D":"只有 100% 浮动的组合才能享受降息的全部好处，混合结构只能享受一部分。","E":"混合结构的结果是「部分固定」，不是「整体固定」——那是全部用固定利率。"},"point":"smoothing 的本质是「折中」：既不是全固定，也不是全浮动。","trap":"A/B 是「混合」的两个自然推论；C/D/E 都在描述极端结构。"}},{"id":"C6Q15","topic":6,"topicName":"Risk management","n":15,"tag":"Predict Exchange rate","type":"number","stem":"The expected future spot rate in one year is 1.4505 euro per $1. The predicted inflation rates for the year ahead are: |Eurozone|Dollar| |---|---| |2% per year|3.5% per year| What is the current spot rate (to four decimal places)? euro per $1","options":[],"answer":"1.4718 euro per $1","answerRaw":"1.4718 euro per $1","explain":{"ans":"用 PPP 反推即期：S₁ = S₀ × (1+h_外币)/(1+h_本币) → 1.4505 = S₀ × 1.02/1.035 → S₀ = 1.4505 × 1.035/1.02 = **1.4718 欧元/$**。","wrong":{"other":"典型错法：把 1.4505 当成即期直接答；或用 1.4505 × 1.02/1.035（方向反，得 1.4294）。"},"point":"PPP：通胀高的国家货币远期/未来贬值。美元通胀 3.5% > 欧元区 2% → 美元未来贬值 → 现在 1 美元能换更多欧元（1.4718 > 1.4505）。","trap":"题目给的是「未来即期」，要**倒推**现在的即期，别直接填。"}},{"id":"C6Q18","topic":6,"topicName":"Risk management","n":18,"tag":"Predict Exchange Rate","type":"number","stem":"Assume the spot rate is 1.7050 $/£. The following are estimated inflation of the 2 countries. |Year|USA|UK| |---|---|---| |1|5%|2%| |2|3%|4%| Based on PPPT theory, calculate the expected spot rate for the year 2 (to 4 decimal places).","options":[],"answer":"1.7383","answerRaw":"1.7383","explain":{"ans":"两年 PPP 要**逐年连乘**：第 1 年 1.7050 × (1.05/1.02) = 1.7551；第 2 年 1.7551 × (1.03/1.04) = **1.7383**。也可以一次性：(1.05×1.03)/(1.02×1.04) = 1.0815/1.0608 = 1.0195，1.7050×1.0195 = 1.7383。","wrong":{"other":"典型错法：只用第 2 年通胀（1.7050×1.03/1.04 = 1.6886）；或把两年通胀简单相加（8% vs 6%）。"},"point":"多年 PPP：各年汇率变动**连乘**，不能把通胀率直接加总。","trap":"美国两年累计通胀 8.15%，英国 6.08% → 美元贬值约 1.95%，不是 2%。"}},{"id":"C6Q19","topic":6,"topicName":"Risk management","n":19,"tag":"Interest Yield Curve","type":"single","stem":"Which of the following statements concerning the causes of interest rate fluctuations is correct?","options":["Liquidity preference theory suggests that investors want more compensation for short-term lending than for long-term lending","According to expectations theory, the shape of the yield curve gives information on how inflation rates are expected to influence interest rates in the future","An inverted yield curve can arise if government policy is to keep short-term interest rates high in order to bring down inflation","Market segmentation theory suggests long-term interest rates depend on how easily investors can switch between market segments of different maturity"],"answer":"C","answerRaw":"第三项","explain":{"ans":"C 对：政府为了抑制通胀把**短期**利率维持在高位，而长期利率由市场对未来降息的预期决定 → 短高长低 → 收益率曲线倒挂。","wrong":{"A":"流动性偏好理论说的是**长期**贷款要更多补偿（期限越长越贵），方向反了。","B":"预期理论解释的是未来**利率**预期，不是通胀预期。","D":"市场分割理论讲的是不同期限市场由**不同投资者群体**主导、彼此不替代，跟「切换难易」不是一回事。"},"point":"倒挂的两种成因：预期未来降息 / 政府压制短端。","trap":"三个理论各自解释什么，必须能一句话分清：流动性偏好→期限溢价；预期→利率预期；市场分割→折点。"}},{"id":"C6Q20","topic":6,"topicName":"Risk management","n":20,"tag":"OTC Option Character","type":"single","stem":"Which of the following statements about an over-the-counter interest rate option are correct? (1) It is an agreement with a financial institution (2) It can be traded (3) An immediate premium is payable (4) It must be exercised","options":["1 and 2 only","1 and 3","3 and 4","1, 2 and 4"],"answer":"B","answerRaw":"第二项","explain":{"ans":"OTC 利率期权：(1) 对，与银行/金融机构签的定制协议；(3) 对，期权费在购买时立即支付。","wrong":{"A":"把 (2) 当对了。OTC 期权是**定制且不可转让**的，能交易的是交易所期权。","C":"(4) 错：期权是权利，买方可以不行权。","D":"含 (2)(4)，两处都错。"},"point":"OTC = 定制 + 不可交易 + 有对手方风险；交易所 = 标准化 + 可平仓。","trap":"「must be exercised」出现即错——期权永远是可选择行权。"}},{"id":"C6Q21","topic":6,"topicName":"Risk management","n":21,"tag":"Methods For Interest Rate Managing","type":"multi","stem":"Which TWO of the following hedging techniques can be used by an investor to protect against a fall in interest rates?  Money market hedge","options":["Money market hedge","Interest rate collar","Interest rate cap","Interest rate floor"],"answer":"BD","answerRaw":"第二、四项","explain":{"ans":"对冲利率**下跌**（存款方/投资者怕收益变少）要用 **floor（下限）** 和 **collar（领式：买 floor + 卖 cap）** → B 和 D。","wrong":{"A":"货币市场对冲是锁定汇率/利率的现金流匹配工具，但不是专门对冲利率下跌的期权类工具。","C":"cap（上限）对冲的是利率**上升**，方向反了。"},"point":"cap 防涨（借款方）；floor 防跌（存款方）；collar = 买 floor 卖 cap（降成本但放弃部分收益）。","trap":"题目说「investor」→ 投资者是收利息的一方 → 怕利率跌 → floor。"}},{"id":"C6Q22","topic":6,"topicName":"Risk management","n":22,"tag":"4 way equivalence","type":"single","stem":"Handria is a country that has the peso for its currency and Wengry is a country that has the dollar ($) for its currency. The current spot exchange rate is 1.5134 pesos = $1. Using interest-rate differentials, the one-year forward exchange rate is 1.5346 pesos = $1. The currency market between the peso and the dollar is assumed perfect and the International Fisher Effect holds. Which of the following statements is true?","options":["Wengry has a higher forecast rate of inflation than Handria","Handria has a higher nominal rate of interest than Wengry","Handria has a higher real rate of interest than Wengry","The forecast future spot rate of exchange will differ from the forward exchange rate"],"answer":"B","answerRaw":"第二项","explain":{"ans":"远期 1.5346 > 即期 1.5134，说明市场预期 peso **贬值**（要更多 peso 才能换 1 美元）。按 IRP，远期贴水的货币利率更高 → **Handria（peso）名义利率更高**。","wrong":{"A":"按 IFE，高利率货币预期通胀也高，应该是 Handria 通胀更高，选项反了。","C":"IFE 假设各国**实际利率相同**，所以不能说 Handria 实际利率更高。","D":"IFE 成立时，预期未来即期 ≈ 远期汇率，两者不应有系统性差异。"},"point":"IRP：远期升/贴水 = 利差；IFE：利差 = 预期通胀差 = 预期汇率变动。","trap":"IFE 的核心假设是「实际利率各国相同」，所以任何「某国实际利率更高」的选项都错。"}},{"id":"C6Q26","topic":6,"topicName":"Risk management","n":26,"tag":"","type":"single","stem":"Apollo Co needs a $10m nine-month loan in three months' time and buys a '3-12' FRA 4.6%-4.1%. In three months' time Apollo Co borrows the $10m at a rate of 4.5%. What will be the payment or receipt under the FRA for Apollo Co?","options":["$7,500 payment","$7,500 receipt","$10,000 payment","$10,000 receipt"],"answer":"A","answerRaw":"第一项","explain":{"ans":"9 个月借款、3 个月后开始 → 用 **3-12**（3 到 12 个月，正好 9 个月）。FRA 借款利率 4.6%，实际 4.5% < 4.6%，公司**付**银行差额：(4.6%−4.5%) × $10m × 9/12 = 0.1% × 10m × 0.75 = **$7,500 payment**。","wrong":{"B":"$7,500 receipt 方向反了——实际利率低于锁定利率，是公司占了便宜，所以要付钱给银行。","C":"$10,000 是期间用了 12 个月。","D":"$10,000 receipt 期间和方向都错。"},"point":"FRA 是零和：实际利率 > 锁定价 → 银行付公司；实际 < 锁定价 → 公司付银行。","trap":"方向最容易记反：借款方锁 4.6%，市场只 4.5%，等于你多付了，银行把差额还你——不对，是**你付银行**（因为你锁的价格比市场高）。"}},{"id":"J1Q01","topic":7,"n":1,"src":"J","tag":"Total shareholder return","type":"number","stem":"ZZ Co has just paid a dividend of 20c per share and its share price is $4.40 per share. The total shareholder return over the period is 15%.\n\nWhat was the share price per share one year ago? (round to 2 decimal places)","options":[],"answer":"$4.00","answerRaw":"4.00","topicName":"Financial management function","explain":{"ans":"TSR = (期末价 − 期初价 + 股利) / 期初价。设期初价 P₀：0.15 = (4.40 − P₀ + 0.20)/P₀ → 4.60 = 1.15 × P₀ → **P₀ = $4.00**","wrong":{"other":"常见错：忘加股利 20c（得 $3.83），或把 4.40 当期初价反算期末价。分子必须是“价差 + 股利”。"},"point":"Total shareholder return = 资本利得 + 股利收益，除以期初价。","trap":"“has just paid”说明 4.40 是除息后的期末价，20c 股利要单独加回分子。"}},{"id":"J1Q03","topic":7,"n":3,"src":"J","tag":"Financial management function","type":"single","stem":"Which of the following statements concerning financial management are correct?\n\n(1) It is concerned with investment decisions, financing decisions and dividend decisions\n(2) It is concerned with financial planning and financial control\n(3) It considers the management of risk","options":["(1) and (2) only","(1) and (3) only","(2) and (3) only","(1), (2) and (3)"],"answer":"D","answerRaw":"第四项","topicName":"Financial management function","explain":{"ans":"三句全对：财务管理的核心就是投资决策、融资决策、股利决策（1），加上财务计划与控制（2），并管理风险（3）→ **(1)(2)(3)**。","wrong":{},"point":"财务管理三大决策 + 计划控制 + 风险管理，全部属于 FM 职能范围。","trap":"这是定义题，选项组合方式（1+2 only 之类）是干扰，内容本身都正确。"}},{"id":"J1Q05","topic":7,"n":5,"src":"J","tag":"Objective of financial management","type":"single","stem":"Which of the following statements describes the main objective of financial management?","options":["Efficient acquisition and deployment of financial resources to ensure achievement of objectives","Providing information to management for day-to-day functions of control and decision-making","Providing information to external users about the historical results of the organisation","Maximisation of shareholder wealth"],"answer":"A","answerRaw":"第一项","topicName":"Financial management function","explain":{"ans":"A。财务管理的（职能）目标表述就是：高效获取和配置财务资源以实现组织目标。","wrong":{"B":"这是管理会计（给内部管理层提供日常控制与决策信息）。","C":"这是财务会计（给外部使用者提供历史信息）。","D":"股东财富最大化是**营利性组织**的整体财务目标，不是对 FM 职能本身的定义——本题考职能定义。"},"point":"区分三个职能：财务管理（资源配置）、管理会计（内部信息）、财务会计（外部信息）。","trap":"D 很诱人，但题目问的是 financial management 的职能表述；若问“公司的目标”才选 D。"}},{"id":"J1Q06","topic":7,"n":6,"src":"J","tag":"Value for money (3E)","type":"single","stem":"Value for money is an important objective for not-for-profit organisations.\n\nWhich action is LEAST consistent with increasing value for money?","options":["Using a cheaper source of goods without decreasing the quality of not-for-profit organisation services","Searching for ways to diversify the finances of the not-for-profit organisation","Decreasing waste in the provision of a service by the not-for-profit organisation","Focusing on meeting the objectives of the not-for-profit organisation"],"answer":"B","answerRaw":"第二项","topicName":"Financial management function","explain":{"ans":"B 与 3E 无关。VfM = Economy（省钱）、Efficiency（少浪费）、Effectiveness（达成目标）。“多元化筹资”不在 3E 框架内。","wrong":{"A":"更便宜的货源且不降质 = Economy ✓。","C":"减少浪费 = Efficiency ✓。","D":"聚焦组织目标 = Effectiveness ✓。"},"point":"Value for money = 3E 框架，是 NFP 组织的核心业绩目标。","trap":"凡是“和 3E 挂不上钩”的选项就是 LEAST consistent 的候选。"}},{"id":"C7Q01","topic":7,"topicName":"Financial management function","n":1,"tag":"TSR","type":"single","stem":"TKQ Co has just paid a dividend of 21c per share and its share price is $3.50 per share. The highest price during the year was $3.90. One year ago its share price was $3.10 per share. Working to one decimal place, what is the total shareholder return over the period?","options":["17.4%","18.2%","18.9%","19.7%"],"answer":"D","answerRaw":"第四项","explain":{"ans":"TSR = (P₁ − P₀ + D₁)/P₀ = (3.50 − 3.10 + 0.21)/3.10 = 0.61/3.10 = **19.7%**。","wrong":{"A":"17.4% 是只算了资本利得（0.40/3.10 = 12.9%）再加错数，或者分母用了 3.50。","B":"18.2% 是漏了部分股利（用 0.21 但分母用了 3.35 之类）。","C":"18.9% 是分子用了 0.40+0.19 之类的错配。"},"point":"TSR = (期末价 − 期初价 + 期间股利)/期初价。","trap":"「最高价 $3.90」是干扰项，TSR 只用期初和期末两个时点，不用年内最高价。"}},{"id":"C7Q02","topic":7,"topicName":"Financial management function","n":2,"tag":"TSR","type":"single","stem":"TKQ Co has just paid a dividend of 21 cents per share and its share price one year ago was $3.10 per share. The total shareholder return for the year was 19.7%. What is the current share price?","options":["$3.50","$3.71","$3.31","$3.35"],"answer":"A","answerRaw":"第一项","explain":{"ans":"反推：19.7% = (P − 3.10 + 0.21)/3.10 → P = 3.10×1.197 + 3.10 − 0.21 = **$3.50**（精确 3.5007）。","wrong":{"B":"$3.71 是把股利加到了错误的一侧（P = 3.10×1.197 + 0.21）。","C":"$3.31 是漏了股利，只用资本利得推（3.10×1.068）。","D":"$3.35 是用了 19.7% 但把股利当成了期初价的一部分。"},"point":"TSR 反推：P₁ = P₀(1+TSR) + P₀ − D₁ 的变形，注意股利的方向。","trap":"公式移项时股利是「加在回报里」，反推股价时要从总回报里**减掉**。"}},{"id":"C7Q03","topic":7,"topicName":"Financial management function","n":3,"tag":"Financial and non-financial objectives","type":"single","stem":"Which of the following statements are correct? (1)Maximising market share is an example of a financial objective (2) Shareholder wealth maximisation is the primary financial objective for a company listed on a stock exchange (3) Financial objectives should be quantitative so that their achievement can be measured","options":["(1) and (2) only","(1) and (3) only","(2) and (3) only","(1), (2) and (3)"],"answer":"C","answerRaw":"第三项","explain":{"ans":"②③对。②股东财富最大化是上市公司的首要财务目标。③财务目标必须可量化，否则无法衡量是否达成。①错：**市场份额是非财务目标**（和客户满意度、员工离职率一类）。","wrong":{"A":"把①当对了。市场份额常被误当财务指标，其实它不直接对应金额。","B":"含①。","D":"三条全选。"},"point":"财务目标 = 能用钱衡量的（利润、股价、ROCE）；非财务 = 市场份额、满意度、离职率。","trap":"市场份额听起来「很财务」，但它属于非财务目标，这是固定考点。"}},{"id":"C7Q04","topic":7,"topicName":"Financial management function","n":4,"tag":"Financial management decisions","type":"single","stem":"Which of the following is LEAST likely to fall within financial management?","options":["The dividend payment to shareholders is increased","Funds are raised to finance an investment project","Surplus assets are sold off","Non-executive directors are appointed to the remuneration committee"],"answer":"D","answerRaw":"第四项","explain":{"ans":"D：任命非执行董事进薪酬委员会属于**公司治理**范畴，不是财务管理决策（投资、融资、股利、风险管理）。","wrong":{"A":"股利支付增加 = 股利决策，属于财务管理。","B":"筹资 = 融资决策，属于财务管理。","C":"出售多余资产 = 投资/剥离决策，属于财务管理。"},"point":"财务管理四大决策：投资、融资、股利、风险管理。","trap":"治理（governance）和财务管理是相邻但不同的章节，别混。"}},{"id":"C7Q05","topic":7,"topicName":"Financial management function","n":5,"tag":"Accounting profit character","type":"single","stem":"Which of the following statements concerning profit are correct? (1) Accounting profit is not the same as economic profit (2) Profit takes account of risk (3) Accounting profit can be manipulated by managers","options":["1 and 3 only","1 and 2 only","2 and 3 only","1, 2 and 3"],"answer":"A","answerRaw":"第一项","explain":{"ans":"①对：会计利润按权责发生制和会计准则算，经济利润要扣掉全部机会成本，两者不同。③对：折旧政策、收入确认时点、准备金计提都能调节利润。②错：会计利润**不反映风险**——同样的 100 万利润，风险高低在报表上看不出来。","wrong":{"B":"把②当对了。不考虑风险正是会计利润被诟病的核心原因。","C":"②③对，且漏了①。","D":"三条全选。"},"point":"利润最大化的三大缺陷：短期化、不等于现金、不考虑风险。","trap":"「profit takes account of risk」这句话永远是错的。"}},{"id":"C7Q06","topic":7,"topicName":"Financial management function","n":6,"tag":"Financial and non-financial objectives","type":"single","stem":"Which of the following statements is correct?","options":["One of the problems with maximising accounting profit as a financial objective is that accounting profit can be manipulated","A target for a minimum level of dividend cover is a target for a minimum dividend payout ratio","The welfare of employees is a financial objective","One reason shareholders are interested in earnings per share is that accounting profit takes account of risk"],"answer":"A","answerRaw":"第一项","explain":{"ans":"A 对：把「最大化会计利润」当目标，经理可以靠调折旧年限、提前确认收入来美化数字，所以容易**被操纵**。","wrong":{"B":"股利保障倍数（dividend cover）的目标是**最低**保障倍数 = **最高**派息率，说成「最低派息率」方向反了。","C":"员工福利是非财务目标。","D":"股东关心 EPS 恰恰因为它是会计数字、**不**考虑风险，所以说「because it takes account of risk」是错的。"},"point":"dividend cover = EPS/DPS = 1/payout ratio，两者互为倒数。","trap":"cover 高 = payout 低；说「最低 cover = 最低 payout」就把方向搞反了。"}},{"id":"C7Q07","topic":7,"topicName":"Financial management function","n":7,"tag":"Profit Org and NFP-objectives","type":"single","stem":"Which of the following statements are correct? (1) Share option schemes always reward good performance by managers (2) Performance-related pay can encourage dysfunctional behaviour (3) Value for money as an objective in not-for-profit organisations requires the pursuit of economy, efficiency and effectiveness","options":["1 and 2 only","1 and 3 only","2 and 3 only","1, 2 and 3"],"answer":"C","answerRaw":"第三项","explain":{"ans":"②③对。②绩效工资会诱发 dysfunctional behaviour（只做能拿钱的事、藏坏消息）。③VFM 就是 3E：economy、efficiency、effectiveness。①错：股票期权**不一定**奖励好业绩——牛市里业绩平庸的经理也能靠股价上涨赚钱。","wrong":{"A":"把①当对了。「always」这种绝对词在 FM 里几乎总是错。","B":"含①。","D":"三条全选。"},"point":"激励指标设计不当 → 短期化/操纵；理想指标看长期价值（TSR、EVA）。","trap":"看到 always / never / all 这类词，先怀疑。"}},{"id":"C7Q08","topic":7,"topicName":"Financial management function","n":8,"tag":"Increase Shareholder wealth","type":"multi","stem":"Increasing which TWO of the following would be associated with the financial objective of shareholder wealth maximization?","options":["Share price","Dividend payment","Reported profit","Earnings per share","Weighted average cost of capital"],"answer":"AB","answerRaw":"第一、二项","explain":{"ans":"股东财富 = 股价 + 股利。所以增加 **A（share price）** 和 **B（dividend payment）** 就是直接增加股东财富。","wrong":{"C":"报告利润增加不等于股东变富——利润是账面数字，可能是靠高风险或会计手段做出来的。","D":"EPS 上升也可能靠回购缩股实现，股东实际财富未必增加。","E":"WACC 上升意味着折现率上升 → 未来现金流现值**下降** → 股东财富减少，方向反了。"},"point":"股东财富 = 股利 + 资本利得，两个来源就这两个。","trap":"WACC 是反向指标：折现率越高，估值越低。"}},{"id":"C7Q09","topic":7,"topicName":"Financial management function","n":9,"tag":"NFP 3E","type":"single","stem":"A state funded hospital has the objective of providing value for money. It measures the achievement of this objective using the three E's (economy, effectiveness and efficiency). Which of the following performance indicators measures the hospital's economy? What is the correct answer?","options":["Number of patients admitted per year","Total medical staff salary cost","Cost per successfully treated patient","Average waiting time for patient admission to hospital"],"answer":"B","answerRaw":"第二项","explain":{"ans":"economy（经济性）看的是**取得投入的成本**，不涉及产出。医院里最直接的就是「医疗人员总薪酬成本」——同样的服务质量，花得越少越 economy。","wrong":{"A":"每年收治病人数 = 产出量，偏 effectiveness（达成目标）。","C":"每成功治愈一名患者的成本 = 投入/产出比，这是 **efficiency**。","D":"平均等候时间 = 服务结果指标，偏 effectiveness。"},"point":"3E 分辨：economy 看投入单价；efficiency 看投入产出比；effectiveness 看结果/目标达成。","trap":"「cost per X」几乎都是 efficiency；只有「总成本/单价」才是 economy。"}},{"id":"C7Q10","topic":7,"topicName":"Financial management function","n":10,"tag":"NFP-3E","type":"multi","stem":"Beach Litter is a charity that was set up with the objective of cleaning litter from all beaches within the local area. Which TWO of the following performance measures would best fit with effectiveness in a value for money audit?","options":["Average hours worked to clean each beach","Number of beaches awarded the government's clean beach certification","Average annual expenditure on each successfully cleaned beach","Average hours worked by each volunteer per month","Amount of litter cleared each year measured in tonnes"],"answer":"BE","answerRaw":"第二、五项","explain":{"ans":"effectiveness 看的是**最终成果**：B（获得政府清洁海滩认证的海滩数量）= 目标达成度；E（每年清理的垃圾吨数）= 实际产出量。","wrong":{"A":"每片海滩清理耗时 → 投入/产出比，是 efficiency。","C":"每片成功清理海滩的年均支出 → 单位成本，是 efficiency。","D":"每位志愿者每月工时 → 投入量，偏 economy/efficiency。"},"point":"effectiveness = outcome（结果）；efficiency = output/input（比率）；economy = 投入价格。","trap":"带「per」「each」的比率型指标基本都是 efficiency，不是 effectiveness。"}},{"id":"C7Q11","topic":7,"topicName":"Financial management function","n":11,"tag":"Agency costs arise on agency problem","type":"single","stem":"Which of the following is NOT usually considered to be agency costs?","options":["Costs associated with giving share options to managers","Costs of monitoring managers","Costs of obtaining a listing on the stock exchange","Costs of divergent behaviour by managers"],"answer":"C","answerRaw":"第三项","explain":{"ans":"C：上市费用（listing costs）是**融资成本**，与代理问题无关。代理成本只有三类：监督成本（monitoring）、约束成本（bonding，如给期权绑定利益）、剩余损失（divergent behaviour 造成的损失）。","wrong":{"A":"给经理股票期权是 bonding cost，属于代理成本。","B":"监督经理（审计、董事会）就是 monitoring cost。","D":"经理偏离股东利益造成的损失就是 residual loss。"},"point":"代理成本三件套：monitoring + bonding + residual loss。","trap":"上市费用、发行成本属于融资决策成本，不属于代理成本。"}},{"id":"C7Q12","topic":7,"topicName":"Financial management function","n":12,"tag":"","type":"single","stem":"Remi Co is a listed company; its ordinary shares have a nominal value of $0.50 per share and a total nominal value of $30m. The following data applies to Remi Co: |Latest total ordinary dividend|$3.0m| |---|---| |Earnings yield|12.0%| |Dividend yield|4.0%| What is the earnings per share of Remi Co?","options":["$0.30","$0.33","$0.15","$0.83"],"answer":"C","answerRaw":"第三项","explain":{"ans":"股数 = $30m 面值 ÷ $0.50 = 60m 股。DPS = 3.0m/60m = $0.05。股利收益率 4% → 股价 = 0.05/0.04 = $1.25。盈利收益率 12% → EPS = 1.25 × 12% = **$0.15**。","wrong":{"A":"$0.30 是用 3.0m 除以 10m 股（股数算错）。","B":"$0.33 是用了 9m 股或把收益率关系搞反。","D":"$0.83 是把 12%/4% 的比例关系乱套。"},"point":"盈利收益率 = EPS/股价；股利收益率 = DPS/股价；两者之比 = 派息率的倒数关系。","trap":"股数必须由「总面值 ÷ 每股面值」算出，不能拿 3.0m 当股数。"}},{"id":"J2Q01","topic":8,"n":1,"src":"J","tag":"Financial intermediation","type":"single","stem":"Which of the following is/are usually seen as benefits of financial intermediation?\n\n(1) Interest rate fixing\n(2) Risk pooling\n(3) Maturity transformation","options":["(1) only","(1) and (3) only","(2) and (3) only","(1), (2) and (3)"],"answer":"C","answerRaw":"第三项","topicName":"Financial management environment","explain":{"ans":"C：只有 (2) 风险汇聚和 (3) 期限转换是金融中介的典型功能。","wrong":{"(1)":"利率锁定不是中介功能——利率由央行/市场决定，中介不能“定”利率。"},"point":"金融中介四大功能：风险汇聚、期限转换、降低交易成本、聚合资金。","trap":"不要把“提供各种利率的产品”误当成“interest rate fixing”。"}},{"id":"J2Q02","topic":8,"n":2,"src":"J","tag":"Monetary policy","type":"single","stem":"Governments have a number of economic targets as part of their monetary policy.\n\nWhich of the following targets relate predominantly to monetary policy?\n\n(1) Increasing tax revenue\n(2) Controlling the growth in the size of the money supply\n(3) Reducing public expenditure\n(4) Keeping interest rates low","options":["(1) only","(1) and (3)","(2) and (4) only","(2), (3) and (4)"],"answer":"C","answerRaw":"第三项","topicName":"Financial management environment","explain":{"ans":"C：货币政策管的是 (2) 货币供应量增速和 (4) 利率。","wrong":{"(1)":"税收收入是财政政策（fiscal）。","(3)":"公共支出是财政政策。"},"point":"货币政策 = 利率 + 货币供应量；财政政策 = 税收 + 政府支出/借款。","trap":"1、3 都是钱，但属于政府预算行为，归财政政策。"}},{"id":"J2Q03","topic":8,"n":3,"src":"J","tag":"Market failure","type":"single","stem":"Which of the following is/are usually seen as forms of market failure where regulation may be a solution?\n\n(1) Imperfect competition\n(2) Social costs or externalities\n(3) Imperfect information","options":["(1) only","(1) and (2) only","(2) and (3) only","(1), (2) and (3)"],"answer":"D","answerRaw":"第四项","topicName":"Financial management environment","explain":{"ans":"D：市场失灵的三种形式——不完全竞争、外部性/社会成本、信息不完全——都可能需要监管来解决，全选。","wrong":{},"point":"市场失灵是政府干预/监管的理由。","trap":"三个都是教材列举的标准市场失灵形式，别漏选 (3) 信息不完全。"}},{"id":"J2Q04","topic":8,"n":4,"src":"J","tag":"Fiscal policy","type":"single","stem":"Governments have a number of economic targets as part of their fiscal policy.\n\nWhich of the following government actions relate predominantly to fiscal policy?\n\n(1) Decreasing interest rates in order to stimulate consumer spending\n(2) Reducing taxation while maintaining public spending\n(3) Using official foreign currency reserves to buy the domestic currency\n(4) Borrowing money from the capital markets and spending it on public works","options":["(1) only","(1) and (3)","(2) and (4) only","(2), (3) and (4)"],"answer":"C","answerRaw":"第三项","topicName":"Financial management environment","explain":{"ans":"C：财政政策 = (2) 减税 + (4) 政府发债搞公共工程。","wrong":{"(1)":"降息刺激消费是货币政策。","(3)":"动用外汇储备买本币是汇率干预（货币政策范畴）。"},"point":"财政政策工具：税率、政府支出、政府借款。","trap":"(3) 最具迷惑性——花的是政府的钱，但操作对象是外汇储备，属于货币/汇率政策。"}},{"id":"J2Q05","topic":8,"n":5,"src":"J","tag":"Financial intermediaries","type":"single","stem":"Which of the following are financial intermediaries?\n\n(1) Venture capital organisation\n(2) Pension fund\n(3) Merchant bank","options":["(2) only","(1) and (3) only","(2) and (3) only","(1), (2) and (3)"],"answer":"D","answerRaw":"第四项","topicName":"Financial management environment","explain":{"ans":"D：风险投资机构、养老基金、商人银行全部是金融中介（撮合资金盈余方与短缺方）。","wrong":{},"point":"金融中介不限于银行：VC、养老金、投行都算。","trap":"别把 merchant bank（商人银行/投行）当商业网点银行而漏选。"}},{"id":"J2Q06","topic":8,"n":6,"src":"J","tag":"Money market instruments","type":"single","stem":"Which of the following statements are correct?\n\n(1) A certificate of deposit is an example of a money market instrument\n(2) Money market deposits are short-term loans between organisations such as banks\n(3) Treasury bills are bought and sold on a discount basis","options":["(1) and (2) only","(1) and (3) only","(2) and (3) only","(1), (2) and (3)"],"answer":"D","answerRaw":"第四项","topicName":"Financial management environment","explain":{"ans":"D：CD 是货币市场工具 ✓；货币市场存款是机构间短期贷款 ✓；国库券贴现发行买卖 ✓，全对。","wrong":{},"point":"货币市场三大工具：CD、存款、国库券（贴现 basis）。","trap":"国库券不付息票，收益来自买卖价差（贴现），这是常考表述。"}},{"id":"J2Q07","topic":8,"n":7,"src":"J","tag":"Eurobonds","type":"single","stem":"AB plc, a company listed in UK, decides to issue unsecured US dollar bonds in Australia.\n\nWhat are these bonds referred to as?","options":["Junk bonds","Commercial paper","Eurobonds","Treasury bills"],"answer":"C","answerRaw":"第三项","topicName":"Financial management environment","explain":{"ans":"C：Eurobond = 在**非计价货币国**发行的债券——美元债在美国以外（澳大利亚）发行，就是欧洲债券。","wrong":{"A":"Junk bonds 是低信用评级高收益债，与发行地无关。","B":"Commercial paper 是企业短期票据。","D":"Treasury bills 是政府短期债券。"},"point":"Eurobond 定义：以发行地以外货币计价的债券（与欧洲这个地理概念无关）。","trap":"“在澳大利亚发美元债”这个场景就是 Eurobond 的教科书定义，别被国名带偏。"}},{"id":"J2Q08","topic":8,"n":8,"src":"J","tag":"Expansionary monetary policy","type":"single","stem":"A government follows an expansionary monetary policy.\n\nHow would this typically affect businesses?","options":["Higher demand from customers, lower interest rates on loans and increased availability of credit","A contraction in demand from customers, higher interest rates and less available credit","Lower taxes, higher demand from customers but less government subsidies/available contracts","Lower interest rates, lower exchange rates and higher tax rates"],"answer":"A","answerRaw":"第一项","topicName":"Financial management environment","explain":{"ans":"A：扩张性货币政策 → 降息 → 企业贷款成本下降、信贷可得性上升、消费投资需求上升。","wrong":{"B":"这是紧缩性货币政策的效果。","C":"减税是财政政策。","D":"“低利率 + 低汇率 + 高税率”自相矛盾（税率归财政政策管）。"},"point":"扩张性货币政策 = 增加货币供应/降息 → 刺激需求。","trap":"选项混搭财政政策变量是命题惯用手法，先按“货币政策只管利率与货币量”过滤。"}},{"id":"J2Q09","topic":8,"n":9,"src":"J","tag":"Macroeconomic policy goals","type":"single","stem":"Which of the following are among the main goals of macroeconomic policy?\n\n(1) Encouraging economic growth\n(2) Low and stable inflation\n(3) Achievement of a balance between exports and imports\n(4) Encouraging an equitable distribution of income","options":["1 and 2","1, 2 and 3","2, 3 and 4","All of them"],"answer":"B","answerRaw":"第二项","topicName":"Financial management environment","explain":{"ans":"B：主要宏观经济目标 = 经济增长 (1) + 低而稳定的通胀 (2) + 国际收支平衡 (3)。","wrong":{"(4)":"收入公平分配属于政府的社会/政治目标，不算主要宏观经济政策目标。"},"point":"宏观经济政策四大经典目标：增长、通胀、就业（此处未列）、国际收支。","trap":"(4) 看起来“很正当”，但 BPP 教材明确把 equitable distribution 归为社会目标。"}},{"id":"J2Q10","topic":8,"n":10,"src":"J","tag":"Money market characteristics","type":"single","stem":"Which of the following statements relating to money markets is/are true?\n\n(1) Lending is for periods of greater than one year\n(2) Money market deposits are short-term loans between organisations such as banks\n(3) Borrowers are mainly small companies","options":["1 and 2","2 and 3","1 and 3","2 only"],"answer":"D","answerRaw":"第四项","topicName":"Financial management environment","explain":{"ans":"D：只有 (2) 对——货币市场存款是银行等机构间的短期借贷。","wrong":{"(1)":"货币市场借贷期限在一年以内，不是大于一年（那是资本市场）。","(3)":"借款人主要是大机构/政府/银行，不是小公司。"},"point":"货币市场 = 短期（<1 年）、大额、机构间、低风险。","trap":"“大于一年”是资本市场的特征，命题人故意张冠李戴。"}},{"id":"C8Q01","topic":8,"topicName":"Financial management environment","n":1,"tag":"Money market instrument","type":"single","stem":"Which of the following statements are correct? (1) A certificate of deposit is an example of a money market instrument (2) Money market deposits are short-term loans between organisations such as banks (3) Treasury bills are bought and sold on a discount basis","options":["1 and 2 only","1 and 3 only","2 and 3 only","1, 2 and 3"],"answer":"D","answerRaw":"第四项","explain":{"ans":"三条都对。①CD 是货币市场工具（1–12 个月、可转让）。②货币市场存款本质就是银行等机构间的短期拆借。③国库券以**贴现**方式发行和交易，不付息，到期按面值兑付。","wrong":{"A":"漏了③，贴现是国库券最核心的特征。","B":"漏了②。","C":"漏了①，CD 明确属于货币市场。"},"point":"货币市场：≤1 年、大额、批发、机构间。","trap":"贴现工具（T-bill、CP、BA）都「不付票息、折价发行」。"}},{"id":"C8Q02","topic":8,"topicName":"Financial management environment","n":2,"tag":"Macro-Economic policy","type":"single","stem":"Which of the following statements is/are correct? (1) Monetary policy seeks to influence aggregate demand by increasing or decreasing the money raised through taxation (2) When governments adopt a floating exchange rate system, the exchange rate is an equilibrium between demand and supply in the foreign exchange market (3) Fiscal policy seeks to influence the economy and economic growth by increasing or decreasing interest rates","options":["2 only","1 and 2 only","1 and 3 only","1, 2 and 3"],"answer":"A","answerRaw":"第一项","explain":{"ans":"只有②对。浮动汇率下汇率由外汇市场供需决定。①错：靠**税收**调节总需求是**财政政策**，不是货币政策。③错：靠**利率**调节是**货币政策**，不是财政政策——这两个正好互相搞反了。","wrong":{"B":"把①当对了。税=财政。","C":"含①③，两处都反。","D":"三条全选。"},"point":"货币政策 = 利率/货币供应量；财政政策 = 政府支出/税收。","trap":"考题最爱把这两个的工具对调，看到「税收+货币政策」直接判错。"}},{"id":"C8Q03","topic":8,"topicName":"Financial management environment","n":3,"tag":"Financial market classification","type":"single","stem":"Which of the following statements are correct? (1) Capital market securities are assets for the seller but liabilities for the buyer (2) Financial markets can be classified into exchange and over-the-counter markets (3) A secondary market is where securities are bought and sold by investors","options":["1 and 2 only","1 and 3 only","2 and 3 only","1, 2 and 3"],"answer":"C","answerRaw":"第三项","explain":{"ans":"②③对。②金融市场分为交易所市场与 OTC 市场。③二级市场是投资者之间买卖已发行证券的市场。①错：证券对**发行方（卖方）是负债**，对**买方（投资者）是资产**，方向写反了。","wrong":{"A":"含①。","B":"含①。","D":"三条全选。"},"point":"一级市场 = 发行筹资；二级市场 = 投资者之间转手。","trap":"资产/负债的方向：谁发行谁是负债，谁持有谁是资产。"}},{"id":"C8Q04","topic":8,"topicName":"Financial management environment","n":4,"tag":"Special concept","type":"single","stem":"Which of the following statements is/are correct? (1) Securitisation is the conversion of illiquid assets into marketable securities (2) The reverse yield gap refers to equity yields being higher than debt yields (3) Disintermediation arises where borrowers deal directly with lending individuals","options":["2 only","1 and 3 only","2 and 3 only","1, 2 and 3"],"answer":"B","answerRaw":"第二项","explain":{"ans":"①③对。①证券化 = 把流动性差的资产打包成可交易证券。③去中介化 = 借款方直接对接资金方，绕过银行。②错：反向收益率差（reverse yield gap）指的是**债券收益率高于股票收益率**（正常情况下股票收益率应更高），表述反了。","wrong":{"A":"只认②，方向反了。","C":"含②。","D":"三条全选。"},"point":"reverse yield gap：gilt 收益率 > 股息收益率，通常出现在高通胀/高利率时期。","trap":"「reverse」这个词提示它与常态相反，常态是股票收益率高。"}},{"id":"C8Q05","topic":8,"topicName":"Financial management environment","n":5,"tag":"Annualised interest on Repo","type":"number","stem":"A listed company is to enter into a sale and repurchase agreement on the money market. The company has agreed to sell $10m of treasury bills for $9.6m and will buy them back in 50 days' time for $9.65m. Assume a 365-day year.\nWhat is the implicit annual interest rate in this transaction? (to the nearest 0.01%)","options":[],"answer":"3.80%","answerRaw":"3.80%","explain":{"ans":"Repo 的本质是抵押借款：借入 9.6m，50 天后还 9.65m，利息 0.05m。年化 = (0.05/9.6) × (365/50) = 0.5208% × 7.3 = **3.80%**。","wrong":{"other":"典型错法：分母用 9.65（得 3.78%）或用 10m 面值（得 3.65%）；或按 360 天算。"},"point":"Repo 年化利率 = 利息/实际借入金额 × 365/天数。","trap":"分母是**实际拿到手的钱**（9.6m），不是面值 10m，也不是还款额 9.65m。"}},{"id":"C8Q06","topic":8,"topicName":"Financial management environment","n":6,"tag":"Money market instruments","type":"single","stem":"Which of the following statements relating to money market instruments is/are correct? (1) Discounted instruments do not pay coupon interest (2) Commercial paper is secured on assets of the issuing company","options":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"answer":"A","answerRaw":"第一项","explain":{"ans":"只有①对：贴现工具（国库券、商业票据、银行承兑汇票）不付票息，靠折价买入、面值赎回赚差价。②错：**商业票据是无担保**的短期债务，只靠发行人的信用。","wrong":{"B":"把②当对了。CP 恰恰以「无担保」著称，所以只有大机构才发得出来。","C":"两句都肯定。","D":"两句都否，①明显正确。"},"point":"CP：无担保、≤270 天、只限大型高信用机构。","trap":"「secured on assets」出现在 CP 的描述里就是错的。"}},{"id":"C8Q07","topic":8,"topicName":"Financial management environment","n":7,"tag":"Money market instruments","type":"single","stem":"A large, listed company is to issue 90-day commercial paper with a nominal value of $10m. Each paper will have a nominal value of $100,000. The annual required rate of return is 4% assuming a 365-day year.\nWhat will be the issue price of each paper?","options":["$99,023","$96,154","$99,014","$96,000"],"answer":"A","answerRaw":"第一项","explain":{"ans":"折价发行：价格 = 面值/(1 + r × 天数/365) = 100,000/(1 + 4%×90/365) = 100,000/1.009863 = **$99,023**。","wrong":{"B":"$96,154 是按 1 年（365 天）折现，忘了只有 90 天。","C":"$99,014 是用了 360 天基数（100,000/1.01 = 99,010 附近）。","D":"$96,000 是直接用 4% 乘面值减掉（100,000×0.96），把年利率当成了期间利率。"},"point":"贴现工具价格 = 面值/(1 + r×t/365)，用「折现」不是「扣减」。","trap":"90 天只占一年的 1/4，直接减 4% 会把折价放大 4 倍。"}},{"id":"C8Q08","topic":8,"topicName":"Financial management environment","n":8,"tag":"Macro-Economic policy","type":"multi","stem":"Which FOUR of the following descriptions relate to the main macroeconomic policy objectives?","options":["Ensuring minimum amounts of price increases","Increasing national income and living standards","Ensuring a balanced ratio of imports to exports","Maintaining interest rates at minimum levels","Balancing government spending with tax receipts","Ensuring a stable and fully employed labour force"],"answer":"ABCF","answerRaw":"第一、二、三、六项","explain":{"ans":"宏观经济四大目标：物价稳定（A）、经济增长/提高国民收入（B）、国际收支平衡（C）、充分就业（F）。","wrong":{"D":"「把利率维持在最低水平」不是目标——利率是**工具**，目标本身是物价、增长、就业、国际收支。","E":"「政府收支平衡」是财政纪律，不是四大宏观目标之一（虽然常被视为约束）。"},"point":"四大目标：物价稳定、经济增长、充分就业、国际收支平衡。","trap":"工具 ≠ 目标。利率、税率、政府支出都是工具。"}},{"id":"C8Q09","topic":8,"topicName":"Financial management environment","n":9,"tag":"Money market role","type":"single","stem":"What role would the money market have in a letter of credit arrangement?","options":["Initial arrangement of the letter of credit","Acceptance of the letter of credit","Issuing of a banker's acceptance","Discounting the banker's acceptance"],"answer":"D","answerRaw":"第四项","explain":{"ans":"信用证流程里，货币市场的作用是**贴现银行承兑汇票**——出口商拿到 BA 后到货币市场提前变现。开证、承兑都是银行做的事，不是「市场」的角色。","wrong":{"A":"开立信用证是进口方银行的事。","B":"承兑是承兑银行的事。","C":"签发 BA 也是银行的动作。"},"point":"货币市场提供的是「短期资金融通/贴现」功能。","trap":"题目问的是「money market 的角色」，凡是银行自己做的事都不是市场功能。"}},{"id":"C8Q10","topic":8,"topicName":"Financial management environment","n":10,"tag":"Fintech","type":"single","stem":"Which of the following statements is/are correct 1. Fintech has created a large market for private individuals to trade small amounts of currency on the currency futures market. 2. Companies are increasingly looking to raise equity finance using peer to peer lending due to the growth of Fin Tech.","options":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"answer":"D","answerRaw":"第四项","explain":{"ans":"两句都错。①货币期货是**交易所的标准化合约**，面向机构，散户无法小量参与。②P2P 借贷提供的是**债务融资**，不是股权融资。","wrong":{"A":"把①当对了，混淆了零售外汇交易和货币期货。","B":"把②当对了，P2P ≠ equity。","C":"两句都肯定。"},"point":"Fintech 改变的是渠道和效率，不改变工具的法律性质（债 vs 股）。","trap":"P2P、众筹、STO 的「股/债」属性是最常被考的反转点。"}},{"id":"C8Q12","topic":8,"topicName":"Financial management environment","n":12,"tag":"Money market characteristics","type":"single","stem":"Which of the following statements relating to money markets is/are true? (1) Lending is for periods of greater than one year (2) Lending is securitised (3) Borrowers are mainly small companies","options":["1 and 2","2 and 3","1 and 3","2 only"],"answer":"D","answerRaw":"第四项","explain":{"ans":"只有②对：货币市场的借贷有证券化形式（如 CD、CP、BA 都是可转让证券）。①错：货币市场是 **1 年以内**，不是大于 1 年。③错：借款方主要是**政府、银行、大型企业**，不是小公司。","wrong":{"A":"含①，期限说反了。","B":"含③，借款主体说反了。","C":"①③都错。"},"point":"货币市场三特征：短期（≤1 年）、大额批发、主体是机构。","trap":"「greater than one year」是资本市场，一字之差换市场。"}},{"id":"C8Q13","topic":8,"topicName":"Financial management environment","n":13,"tag":"Monetary policy","type":"single","stem":"A company is planning a major investment in a new manufacturing unit in the next year. Due to recent concerns that the economy may be growing too slowly, the government has unexpectedly announced a decrease in interest rates. Which of the following statements concerning the impact of the government's decision is TRUE?","options":["The company's cost of capital will increase","The company's shareholders will require higher returns","Demand for the company's products will increase","The NPV of the investment will be lower than initially expected"],"answer":"C","answerRaw":"第三项","explain":{"ans":"降息 → 借贷成本下降、储蓄收益下降 → 消费和投资需求上升 → **公司产品的需求增加**。","wrong":{"A":"降息会**降低**资本成本（Rf 下降 → CAPM 的 Ke 下降）。","B":"降息环境下股东要求的回报是**下降**的，不是上升。","D":"折现率下降 → NPV **上升**，不是下降。"},"point":"扩张性货币政策 → 利率↓ → 折现率↓ → NPV↑、需求↑。","trap":"A/B/D 三个选项方向全反，只要记住「降息对企业和估值都是利好」就能一起排除。"}},{"id":"C8Q14","topic":8,"topicName":"Financial management environment","n":14,"tag":"Supply side policy","type":"single","stem":"Supply-side government policy is designed for what purpose?","options":["To raise the level of aggregate monetary demand in the economy","To manage the money supply in the economy","To improve the ability of the economy to produce goods and services","To reduce unemployment by limiting the supply of labour"],"answer":"C","answerRaw":"第三项","explain":{"ans":"供给侧政策的目标是**提高经济的生产能力**（教育、培训、基建、 deregulation、技术创新），把「蛋糕」做大而不是刺激短期需求。","wrong":{"A":"提高总需求是**需求侧**政策（财政/货币扩张）。","B":"管理货币供应量是货币政策。","D":"「限制劳动力供给来降失业」逻辑本身就是错的。"},"point":"供给侧 = 提升产能；需求侧 = 刺激支出。","trap":"就业培训既像需求侧又像供给侧，但在 FM 里归供给侧（提升人力资本）。"}},{"id":"C8Q15","topic":8,"topicName":"Financial management environment","n":15,"tag":"Economic policy","type":"single","stem":"Which of the following government policies would NOT tend to raise the level of demand in the economy?","options":["Increased expenditure on the economic infrastructure","Tax cuts","Employment training schemes","Financial incentives to encourage personal saving"],"answer":"D","answerRaw":"第四项","explain":{"ans":"D：鼓励个人**储蓄**会把钱从消费里抽走，压低而不是提高总需求。","wrong":{"A":"基建支出是政府直接花钱，提高需求。","B":"减税增加可支配收入，提高需求。","C":"就业培训项目本身有支出，也提高需求（同时提升供给能力）。"},"point":"提高需求的手段：政府支出↑、税收↓、利率↓、汇率↓。","trap":"题目问 NOT，且选项里三个都是扩张性的，只有一个方向相反。"}},{"id":"C8Q16","topic":8,"topicName":"Financial management environment","n":16,"tag":"Economic policies","type":"multi","stem":"Which of the following TWO government policies are consistent with an objective of decreasing national economic growth?","options":["Increasing government expenditure","Decreasing interest rates","Allowing the domestic currency to appreciate","Increasing taxation","Reducing unemployment"],"answer":"CD","answerRaw":"第三、四项","explain":{"ans":"抑制增长要用紧缩手段：**C 让本币升值**（出口变贵、进口变便宜 → 净出口下降）+ **D 增税**（可支配收入下降 → 消费下降）。","wrong":{"A":"增加政府支出是扩张性的。","B":"降息是扩张性的。","E":"降低失业意味着经济在扩张。"},"point":"紧缩组合：增税、减支出、加息、本币升值。","trap":"「本币升值」抑制增长这一点最反直觉，但出口需求下降是直接后果。"}},{"id":"C8Q17","topic":8,"topicName":"Financial management environment","n":17,"tag":"Inflation effect","type":"multi","stem":"Which TWO of the following are likely to occur in a country that experiences relatively low inflation?","options":["Decrease of profitable investment opportunities","The domestic currency will devalue","Domestic demand for goods and services will rise","The weighted average cost of capital will fall"],"answer":"CD","answerRaw":"第三、四项","explain":{"ans":"低通胀环境下：**C 国内商品与服务需求上升**（购买力稳定、信心强）+ **D WACC 下降**（通胀溢价降低 → 无风险利率与股权成本下降）。","wrong":{"A":"低通胀通常伴随稳定的投资环境，盈利机会不会减少。","B":"低通胀国货币通常**升值**或稳定，不是贬值（按 PPP，通胀低的国家货币趋于升值）。"},"point":"通胀 ↓ → 利率 ↓ → WACC ↓ → 估值 ↑。","trap":"PPP 的方向：低通胀国货币升值，选项 B 说 devalue 正好反了。"}}],"cards":[{"part":"Part C","topic":"营运资本管理","q":"Compare the Baumol model and the Miller-Orr model.","en":["**Baumol** — applies inventory (EOQ) logic to cash: Q = √(2CF/i). Assumes cash flows are **steady and predictable**, no buffer cash is held, and the opportunity cost is the interest forgone.","**Baumol drawbacks** — cash flows are hard to predict; no buffer means possible cash-out and extra cost; holding cost rises as cash balance rises.","**Miller-Orr** — explicitly allows for **uncertain** cash flows. Management sets a minimum balance (based on risk attitude and borrowing ability); the model gives the spread and the upper limit.","**Miller-Orr mechanics** — at the upper limit buy securities to return to the return point; at the lower limit sell securities. Return point = lower limit + spread/3; upper limit = lower limit + spread.","**Miller-Orr drawbacks** — some cash flows are actually predictable (e.g. seasonal retail); it requires more management time."],"zh":"核心差别一句话：Baumol 假设现金流确定，Miller-Orr 承认不确定。答题时把「假设 → 公式 → 缺点」三段写全，比只写公式得分高。","keys":["steady and predictable","buffer cash","spread","upper limit","return point"]},{"part":"Part C","topic":"营运资本管理","q":"Discuss centralised treasury manageme
