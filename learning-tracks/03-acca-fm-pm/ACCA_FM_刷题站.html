<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ACCA FM 刷题站</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --ink:#1c2430; --ink2:#4a5568; --ink3:#8b96a5;
  --line:#e6e9ee; --bg:#f5f6f8; --card:#fff;
  --blue:#1f4e79; --blue2:#2f6fa8; --bluebg:#eef4fa;
  --amber:#c47d1a; --amberbg:#fdf6ea;
  --green:#2f7d5c; --greenbg:#eaf5f0;
  --red:#b3453c; --redbg:#fbeeed;
  --radius:14px;
}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:var(--bg); color:var(--ink); line-height:1.7; font-size:15px;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input{font-family:inherit}
.num{font-variant-numeric:tabular-nums}
.hide{display:none!important}

/* ---------- 顶栏 ---------- */
.topbar{
  position:sticky;top:0;z-index:50;background:rgba(255,255,255,.92);
  backdrop-filter:saturate(180%) blur(12px);border-bottom:1px solid var(--line);
}
.topbar-in{max-width:1240px;margin:0 auto;padding:0 20px;height:60px;display:flex;align-items:center;gap:24px}
.brand{font-weight:700;font-size:15px;letter-spacing:.3px;white-space:nowrap}
.brand em{font-style:normal;color:var(--ink3);font-weight:500;margin-left:6px;font-size:13px}
.tabs{display:flex;gap:4px;background:var(--bg);padding:4px;border-radius:10px}
.tab{padding:6px 16px;border-radius:8px;font-size:13.5px;font-weight:600;color:var(--ink2);transition:.15s}
.tab.on{background:#fff;color:var(--blue);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.spacer{flex:1}
.mini-stat{font-size:12.5px;color:var(--ink3);white-space:nowrap}
.mini-stat b{color:var(--blue);font-size:14px}

/* ---------- 布局 ---------- */
.wrap{max-width:1240px;margin:0 auto;padding:22px 20px 80px;display:flex;gap:22px;align-items:flex-start}
.side{width:236px;flex:none;position:sticky;top:82px}
.stage{flex:1;min-width:0}

/* ---------- 侧栏 ---------- */
.panel{background:var(--card);border-radius:var(--radius);padding:16px;box-shadow:0 1px 3px rgba(20,30,50,.05)}
.panel+.panel{margin-top:14px}
.panel h3{font-size:11.5px;letter-spacing:.8px;text-transform:uppercase;color:var(--ink3);font-weight:700;margin-bottom:10px}
.mode-list{display:flex;flex-direction:column;gap:2px}
.mode{text-align:left;padding:8px 10px;border-radius:8px;font-size:13.5px;color:var(--ink2);display:flex;justify-content:space-between;align-items:center}
.mode:hover{background:var(--bg)}
.mode.on{background:var(--bluebg);color:var(--blue);font-weight:600}
.mode span{font-size:11.5px;color:var(--ink3);font-weight:500}
.mode.on span{color:var(--blue2)}
.topic-row{width:100%;text-align:left;padding:7px 10px;border-radius:8px;font-size:13px;color:var(--ink2);display:block}
.topic-row:hover{background:var(--bg)}
.topic-row.on{background:var(--bluebg);color:var(--blue);font-weight:600}
.topic-row .tr-top{display:flex;justify-content:space-between;gap:8px}
.topic-row .pct{font-size:11px;color:var(--ink3);font-weight:600}
.bar{height:3px;background:var(--line);border-radius:2px;margin-top:5px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--blue2);border-radius:2px;transition:width .3s}

/* ---------- 题目卡 ---------- */
.qhead{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.qidx{font-size:12.5px;color:var(--ink3);font-weight:600;letter-spacing:.4px}
.chip{font-size:11.5px;padding:2px 9px;border-radius:20px;background:var(--bluebg);color:var(--blue2);font-weight:600}
.chip.warn{background:var(--amberbg);color:var(--amber)}
.chip.multi{background:#f2eefb;color:#6a4ba8}
.chip.num{background:var(--greenbg);color:var(--green)}

.qcard{background:var(--card);border-radius:var(--radius);padding:26px 28px;box-shadow:0 1px 3px rgba(20,30,50,.05)}
.stem{font-size:15.5px;line-height:1.85;color:var(--ink);white-space:pre-wrap}
.stem .tbl{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;background:var(--bg);padding:10px 12px;border-radius:8px;display:block;margin:10px 0;white-space:pre-wrap;color:var(--ink2)}

.opts{margin-top:20px;display:flex;flex-direction:column;gap:9px}
.opt{
  display:flex;gap:12px;align-items:flex-start;padding:12px 15px;border:1.5px solid var(--line);
  border-radius:11px;background:#fff;transition:.14s;text-align:left;width:100%;font-size:14.5px;line-height:1.65
}
.opt:hover{border-color:var(--blue2);background:#fbfcfe}
.opt .k{
  flex:none;width:24px;height:24px;border-radius:6px;background:var(--bg);color:var(--ink2);
  font-size:12.5px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:1px
}
.opt.sel{border-color:var(--blue2);background:var(--bluebg)}
.opt.sel .k{background:var(--blue2);color:#fff}
.opt.right{border-color:var(--green);background:var(--greenbg)}
.opt.right .k{background:var(--green);color:#fff}
.opt.wrong{border-color:var(--red);background:var(--redbg)}
.opt.wrong .k{background:var(--red);color:#fff}
.opt.dim{opacity:.55}
.opt.locked{cursor:default}
.opt.locked:hover{border-color:var(--line);background:#fff}
.opt.locked.right:hover{border-color:var(--green);background:var(--greenbg)}
.opt.locked.wrong:hover{border-color:var(--red);background:var(--redbg)}

.numbox{margin-top:20px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.numbox input{
  width:220px;padding:11px 14px;border:1.5px solid var(--line);border-radius:10px;font-size:15px;
  outline:none;background:#fff
}
.numbox input:focus{border-color:var(--blue2)}
.numbox .hint{font-size:12.5px;color:var(--ink3)}
.btn{padding:10px 20px;border-radius:10px;font-size:14px;font-weight:600;transition:.15s}
.btn-p{background:var(--blue);color:#fff}
.btn-p:hover{background:#183e60}
.btn-p:disabled{background:#b8c4d1;cursor:not-allowed}
.btn-g{background:var(--bg);color:var(--ink2)}
.btn-g:hover{background:#e9ecf1}

/* ---------- 解析 ---------- */
.explain{margin-top:22px;border-top:1px solid var(--line);padding-top:20px;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.verdict{display:flex;align-items:center;gap:10px;font-size:14.5px;font-weight:700;margin-bottom:14px}
.verdict.ok{color:var(--green)}
.verdict.no{color:var(--red)}
.verdict .ans-tag{margin-left:auto;font-size:13px;font-weight:600;color:var(--ink2);background:var(--bg);padding:3px 12px;border-radius:20px}
.sec{margin-top:16px}
.sec-t{font-size:12px;font-weight:700;letter-spacing:.5px;color:var(--ink3);margin-bottom:7px;text-transform:uppercase}
.sec p{font-size:14px;line-height:1.85;color:var(--ink2)}
.sec p b{color:var(--ink);font-weight:600}
.wrong-list{display:flex;flex-direction:column;gap:8px}
.wrow{display:flex;gap:10px;font-size:13.5px;line-height:1.75;color:var(--ink2)}
.wrow .wk{
  flex:none;min-width:22px;padding:0 6px;height:22px;border-radius:6px;background:var(--redbg);color:var(--red);
  font-size:12px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;white-space:nowrap
}
.wrow .wk.other{background:var(--bg);color:var(--ink3);width:auto;padding:0 7px;font-size:11.5px}
.callout{background:var(--amberbg);border-left:3px solid var(--amber);padding:11px 14px;border-radius:0 8px 8px 0;font-size:13.5px;line-height:1.75;color:#6b4a14}
.callout b{color:#8a5c11}
.keypoint{background:var(--bluebg);border-left:3px solid var(--blue2);padding:11px 14px;border-radius:0 8px 8px 0;font-size:13.5px;line-height:1.75;color:#254a6b}

/* ---------- 底部导航 ---------- */
.qnav{display:flex;align-items:center;gap:12px;margin-top:18px}
.qnav .btn{flex:none}
.qnav .pos{font-size:13px;color:var(--ink3);margin-left:auto}
.iconbtn{padding:9px 13px;border-radius:9px;background:#fff;border:1px solid var(--line);font-size:13px;color:var(--ink2)}
.iconbtn:hover{border-color:var(--blue2);color:var(--blue)}
.iconbtn.on{background:var(--amberbg);border-color:#e8c98e;color:var(--amber)}

/* ---------- 文字卡片 ---------- */
.fc-tools{display:flex;gap:8px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
.fc-tools .spacer{flex:1}
.fcard{background:var(--card);border-radius:var(--radius);padding:30px 32px;box-shadow:0 1px 3px rgba(20,30,50,.05);min-height:340px}
.fc-q{font-size:17px;line-height:1.8;font-weight:600;color:var(--ink)}
.fc-meta{font-size:12px;color:var(--ink3);margin-bottom:14px;letter-spacing:.3px}
.fc-body{margin-top:22px;border-top:1px dashed var(--line);padding-top:20px}
.fc-point{display:flex;gap:11px;font-size:14px;line-height:1.8;color:var(--ink2);margin-bottom:9px}
.fc-point .dot{flex:none;width:6px;height:6px;border-radius:50%;background:var(--blue2);margin-top:9px}
.fc-point b{color:var(--ink);background:#fff8e6;padding:0 2px;border-radius:2px}
.fc-zh{margin-top:18px;background:var(--bg);padding:13px 16px;border-radius:10px;font-size:13.5px;line-height:1.8;color:var(--ink2)}
.fc-zh b{color:var(--ink);font-weight:600}
.blur{filter:blur(5px);user-select:none;transition:filter .2s}
.reveal{display:inline-block;background:var(--bluebg);border-radius:4px;padding:0 5px;cursor:pointer;color:transparent;transition:.15s}
.reveal.on{background:transparent;color:inherit;cursor:default}
.grade{display:flex;gap:10px;margin-top:24px;flex-wrap:wrap}
.grade button{flex:1;min-width:120px;padding:12px;border-radius:11px;border:1.5px solid var(--line);font-size:14px;font-weight:600;color:var(--ink2)}
.grade button:hover{border-color:var(--blue2)}
.grade .g1:hover{border-color:var(--red);color:var(--red);background:var(--redbg)}
.grade .g2:hover{border-color:var(--amber);color:var(--amber);background:var(--amberbg)}
.grade .g3:hover{border-color:var(--green);color:var(--green);background:var(--greenbg)}

/* ---------- 速查 ---------- */
.chapter{background:var(--card);border-radius:var(--radius);margin-bottom:14px;overflow:hidden;box-shadow:0 1px 3px rgba(20,30,50,.05)}
.ch-head{padding:16px 22px;display:flex;align-items:center;gap:12px;cursor:pointer}
.ch-head:hover{background:#fafbfc}
.ch-head h2{font-size:15px;font-weight:700;flex:1}
.ch-head .n{font-size:12px;color:var(--ink3)}
.ch-body{padding:0 22px 22px;display:none}
.chapter.open .ch-body{display:block}
.ch-body h4{font-size:13.5px;color:var(--blue);margin:16px 0 6px;font-weight:700}
.ch-body p,.ch-body li{font-size:13.5px;line-height:1.85;color:var(--ink2)}
.ch-body ul{padding-left:20px;margin:6px 0}
.ch-body b{color:var(--ink)}
.formula{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;background:var(--bg);padding:2px 7px;border-radius:5px;color:var(--blue)}
.searchbox{width:100%;padding:12px 16px;border:1.5px solid var(--line);border-radius:11px;font-size:14px;outline:none;margin-bottom:16px;background:#fff}
.searchbox:focus{border-color:var(--blue2)}

/* ---------- 统计 ---------- */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:18px}
.stat{background:var(--card);border-radius:12px;padding:16px 18px;box-shadow:0 1px 3px rgba(20,30,50,.05)}
.stat .v{font-size:24px;font-weight:700;color:var(--blue);line-height:1.2}
.stat .l{font-size:12px;color:var(--ink3);margin-top:3px}

/* ---------- 移动端 ---------- */
.mobile-bar{display:none}
@media(max-width:900px){
  .topbar-in{height:54px;padding:0 14px;gap:12px}
  .brand em{display:none}
  .mini-stat{display:none}
  .tab{padding:6px 11px;font-size:12.5px}
  .wrap{padding:14px 12px 96px;flex-direction:column;gap:12px}
  .side{display:none;width:100%;position:static}
  .side.open{display:block}
  .qcard,.fcard{padding:20px 18px}
  .stem{font-size:15px}
  .opt{padding:11px 13px;font-size:14px}
  .mobile-bar{
    display:flex;position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);
    padding:9px 12px;gap:8px;z-index:60;align-items:center
  }
  .mobile-bar .btn{flex:1;padding:11px}
}
/* 速查跳转高亮 */
.chapter{scroll-margin-top:92px}
.chapter.flash{outline:2px solid var(--amber);border-radius:12px;box-shadow:0 0 0 6px rgba(196,125,26,.14)}
/* 错题本 */
.wb-group{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:14px}
.wb-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.wb-head b{font-size:15px}
.wb-sub{display:block;color:var(--ink3);font-size:12.5px;margin-top:3px;font-weight:400}
.wb-acts{display:flex;gap:8px;flex-wrap:wrap}
.wb-row{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 12px;margin-top:6px;cursor:pointer;font-size:13.5px;color:var(--ink2);transition:border-color .15s}
.wb-row:hover{border-color:var(--blue2)}
.wb-row .wb-tag{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wb-row .bad{color:var(--red)} .wb-row .good{color:var(--green)}
.wb-row .wb-go{color:var(--ink3);font-size:12px;white-space:nowrap}
.wb-empty{background:var(--card);border:1px dashed var(--line);border-radius:var(--radius);padding:40px;text-align:center;color:var(--ink3)}
/* 解析内「回速查」入口 */
.btn.goRef{width:100%;justify-content:flex-start;text-align:left;background:var(--bluebg);color:var(--blue2);border:1px solid #d8e6f4;font-weight:600;padding:12px 16px;transition:background .15s,border-color .15s}
.btn.goRef:hover{background:#e4eff9;border-color:var(--blue2);color:var(--blue)}
@media (max-width:640px){
  .wb-group{padding:13px}
  .wb-head{align-items:flex-start}
  .wb-acts{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);width:100%;gap:8px}
  .wb-acts .btn:nth-child(3){grid-column:1/-1}
  .wb-acts .btn{width:100%;min-width:0;padding:10px 4px;font-size:12.5px;white-space:nowrap;justify-content:center}
  .wb-row{flex-wrap:wrap;gap:4px 8px;padding:9px 10px}
  .wb-row .wb-tag{flex:1 1 100%;order:-1;white-space:normal;font-size:12.5px}
  .wb-row .wb-go{display:none}
}
@media print{.topbar,.side,.qnav,.mobile-bar{display:none}.wrap{padding:0}}
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-in">
    <div class="brand">ACCA FM<em>统考复习</em></div>
    <nav class="tabs">
      <button class="tab on" data-view="quiz">刷题</button>
      <button class="tab" data-view="cards">背文字题</button>
      <button class="tab" data-view="wb">错题本</button>
      <button class="tab" data-view="ref">速查</button>
    </nav>
    <div class="spacer"></div>
    <div class="mini-stat" id="miniStat"></div>
  </div>
</header>

<div class="wrap">
  <!-- ============ 刷题 ============ -->
  <aside class="side" id="side">
    <div class="panel">
      <h3>模式</h3>
      <div class="mode-list" id="modes"></div>
    </div>
    <div class="panel">
      <h3>Topic</h3>
      <div id="topicList"></div>
    </div>
  </aside>

  <main class="stage">
    <!-- 刷题 -->
    <section id="view-quiz">
      <div class="qhead" id="qhead"></div>
      <div class="qcard" id="qcard"></div>
      <div class="qnav">
        <button class="btn btn-g" id="prevBtn">← 上一题</button>
        <button class="btn btn-g" id="nextBtn">下一题 →</button>
        <button class="iconbtn" id="starBtn" title="收藏（S）">☆ 收藏</button>
        <button class="iconbtn" id="flagBtn" title="标记疑问（F）">⚑ 疑问</button>
        <span class="pos" id="posInfo"></span>
      </div>
    </section>

    <!-- 背文字题 -->
    <section id="view-cards" class="hide">
      <div class="fc-tools">
        <button class="chip" id="fcModeQ" style="border:1px solid var(--line);background:#fff">只看题干</button>
        <button class="chip" id="fcToggleBlur" style="border:1px solid var(--line);background:#fff">挖空模式</button>
        <select id="fcPart" style="padding:7px 10px;border-radius:9px;border:1px solid var(--line);font-size:13px;background:#fff;color:var(--ink2)"></select>
        <div class="spacer"></div>
        <span class="mini-stat" id="fcCount"></span>
      </div>
      <div class="fcard" id="fcard"></div>
      <div class="qnav">
        <button class="btn btn-g" id="fcPrev">← 上一张</button>
        <button class="btn btn-g" id="fcNext">下一张 →</button>
        <button class="iconbtn" id="fcReveal">显示全部答案</button>
      </div>
    </section>

    <!-- 错题本 -->
    <section id="view-wb" class="hide">
      <div id="wbBody"></div>
    </section>

    <!-- 速查 -->
    <section id="view-ref" class="hide">
      <input class="searchbox" id="refSearch" placeholder="搜索知识点、公式、关键词…">
      <div class="stats" id="statBox"></div>
      <div id="refBody"></div>
    </section>
  </main>
</div>

<div class="mobile-bar">
  <button class="btn btn-g" id="mPrev">←</button>
  <button class="btn btn-p" id="mNext">下一题</button>
  <button class="btn btn-g" id="mMenu">目录</button>
</div>

<script id="fm-data" type="application/json">{"questions":[{"id":"J3Q01","topic":1,"n":1,"src":"J","tag":"Financing cost of current assets","type":"single","stem":"The figures below are extracted from the statement of financial position of ZZ Plc. The overdraft rate is 7% per annum and the long-term finance cost is 10% per annum.\n\nTrade receivable $60,000; Inventory $90,000; Trade payable $80,000; Bank overdraft $20,000.\n\nWhat is the financial cost of current assets?","options":["10,600","11,000","6,400","12,000"],"answer":"C","answerRaw":"第三项","topicName":"Working capital management","explain":{"ans":"流动资产 = 60k + 90k = 150k。融资结构：应付账款 80k（无息）+ 透支 20k（7%）+ 长期资金 50k（10%）。\n财务成本 = 20,000×7% + 50,000×10% = 1,400 + 5,000 = **$6,400**","wrong":{"A":"10,600 = 口径混乱的结果（如把部分资产重复计息）。","B":"11,000 = 全部净流动资产按 10% 计息（50k×10%=5k 加错基数），口径错误。","D":"12,000 = 120k×10%，忘了扣除应付账款这 80k 无息来源。"},"point":"流动资产的融资成本要按**资金来源**分别计息：无息的应付账款不算成本。","trap":"先用无息负债（应付账款）抵扣流动资产，剩余部分再按透支/长期资金的利率计息。"}},{"id":"J3Q02","topic":1,"n":2,"src":"J","tag":"Net current assets","type":"single","stem":"ZZ Plc has annual credit sales of $365 million and related cost of sales of $260 million.\n\nTrade receivable days 50 days; Inventory days 60 days; Trade payable days 45 days. Assume there are 365 days in the year.\n\nWhat is the net current asset of the company?","options":["60 million","58 million","61 million","62 million"],"answer":"C","answerRaw":"第三项","topicName":"Working capital management","explain":{"ans":"AR = 365m×50/365 = **50m**\nInventory = 260m×60/365 = **42.7m**（用成本口径）\nAP = 260m×45/365 = **32.1m**\n净流动资产 = 50 + 42.7 − 32.1 = **61m**（第三项）","wrong":{"A":"60 = 50+42.7−32.7，应付天数用错口径。","B":"58 = 存货按销售口径 365×60/365 算小了再减：口径错。","D":"62 = 四舍五入路径不同。"},"point":"存货和应付必须用**成本/采购**口径（260m），应收用销售口径（365m）。","trap":"三个周转天数的分子口径不同，是本题唯一考点。"}},{"id":"J3Q03","topic":1,"n":3,"src":"J","tag":"Operating cycle","type":"single","stem":"The following information relates to a business:\n\nDebt collection period 8 weeks; Raw material inventory holding period 2 weeks; Suppliers' credit period 5 weeks; Production period 2 weeks; Finished goods inventory holding period 1 week.\n\nWhat is the operating cycle of the business?","options":["8 weeks","7 weeks","10 weeks","12 weeks"],"answer":"A","answerRaw":"第一项","topicName":"Working capital management","explain":{"ans":"经营周期 = 8 + 2 + 2 + 1 − 5 = **8 周**（收现期 + 原材料持有 + 生产期 + 产成品持有 − 供应商信用期）","wrong":{"B":"7 = 漏了某一项持有期。","C":"10 = 忘减供应商信用期 5 之外的口径错误。","D":"12 = 没减供应商信用期（8+2+2+1=13 附近口径混乱）。"},"point":"Operating cycle = inventory days + receivable days − payable days（本题细化到原材料/WIP/产成品）。","trap":"供应商信用期是“减项”——它替你垫了资金。"}},{"id":"J3Q04","topic":1,"n":4,"src":"J","tag":"Net working capital","type":"multi","stem":"Which TWO of the following are correct descriptions of net working capital?","options":["Current assets - current liabilities","Inventory days + accounts receivable days - accounts payable days","Current assets / current liabilities","The long-term capital invested in net current assets"],"answer":"AD","answerRaw":"第一、四项","topicName":"Working capital management","explain":{"ans":"**A 和 D**。净营运资本 = 流动资产 − 流动负债（A）；也等于“投入净流动资产的长期资本”（D，因为长期资本要补足净 WC）。","wrong":{"B":"这是现金周转期（天数口径），不是金额。","C":"这是流动比率 current ratio。"},"point":"Net working capital 两个等价视角：CA−CL = 长期资本 − 净非流动资产。","trap":"B 混淆“金额”与“天数”；C 混淆“差额”与“比率”。"}},{"id":"J3Q05","topic":1,"n":5,"src":"J","tag":"Working capital statements","type":"single","stem":"Which of the following statements concerning working capital are correct?\n\n(1) Working capital should increase as sales increase\n(2) An increase in the cash operating cycle will decrease profitability\n(3) Overtrading is also known as under-capitalisation","options":["1 and 2 only","1 and 3 only","2 and 3 only","1, 2 and 3"],"answer":"D","answerRaw":"第四项","topicName":"Working capital management","explain":{"ans":"三句全对 → D。销售增长 → WC 需求随之增长 (1)；现金经营周期变长 → 占用资金更多、利息成本上升 → 盈利下降 (2)；Overtrading（过度交易）就是 under-capitalisation（资本不足）(3)。","wrong":{},"point":"Overtrading = 销售扩张太快而资本跟不上 = under-capitalisation。","trap":"(3) 是高频考点：overtrading 的两个名字要划等号。"}},{"id":"J3Q06","topic":1,"n":6,"src":"J","tag":"Early settlement discount","type":"single","stem":"Ling Co has annual credit sales of $4,500,000 and on average customers take 60 days to pay, assuming a 360-day year. As a result, Ling Co has a trade receivables balance of $750,000. Ling Co relies on an overdraft to finance this at an annual interest rate of 8%. Ling Co is considering offering an early settlement discount to its customers of 0.5% for payment in 30 days. It expects that 25% of its customers (representing 35% of the annual credit sales figure) will pay on 30 days in order to obtain the discount.\n\nIf Ling Co introduces the proposed discount, what will be the NET saving?","options":["$2,625","$1,875","$7,500","$10,500"],"answer":"A","answerRaw":"第一项","topicName":"Working capital management","explain":{"ans":"享受折扣的客户：新 AR = 4.5m×35%×30/360 = 131,250；旧 AR 中这部分 = 4.5m×35%×60/360 = 262,500\n释放资金 = 262,500 − 131,250 = 131,250 → 利息节省 = 131,250×8% = **10,500**\n折扣成本 = 4.5m×35%×0.5% = **7,875**\n净节省 = 10,500 − 7,875 = **$2,625**","wrong":{"B":"1,875 = 把利息节省算成 (750k−618.75k)×8% 时基数错。","C":"7,500 = 只算了部分折扣成本或利率配比错。","D":"10,500 = 只算利息节省、忘扣折扣成本。"},"point":"净节省 = 资金释放×利率 − 折扣成本。","trap":"折扣成本基数是“享受折扣那部分的销售额”（4.5m×35%），不是全额销售。"}},{"id":"J3Q07","topic":1,"n":7,"src":"J","tag":"Overtrading vs over-capitalisation","type":"multi","stem":"Which TWO of the following statements about over-capitalisation and overtrading are correct?","options":["Overtrading often arises from a rapid increase in sales revenue","Over-capitalisation results in a relatively low current ratio","Overtrading may result in a relatively high accounts payable turnover period","Over-capitalisation is the result of too much short-term capital"],"answer":"AC","answerRaw":"第一、三项","topicName":"Working capital management","explain":{"ans":"**A 和 C**。Overtrading 常源于销售快速扩张（资本跟不上）✓；Overtrading 资本不足 → 拖延付款 → 应付周转期偏高 ✓。","wrong":{"B":"Over-capitalisation 是资本**过多**闲置 → 流动比率反而**高**，不是低。","D":"Over-capitalisation 是**长期**资本过多（或资本总量相对业务过多），不是短期资本过多。"},"point":"Overtrading：销售↑资本不足、流动性差；Over-capitalisation：资本过剩、效率低、流动性高。","trap":"两个“over”的方向相反：一个缺钱一个钱多，比率表现正好镜像。"}},{"id":"J3Q08","topic":1,"n":8,"src":"J","tag":"Cost of discount","type":"single","stem":"Swap Co is due to receive goods costing $2,500. The terms of trade state that payment must be received within three months. However, a discount of 1.5% will be given for payment within one month.\n\nWhich of the following is the annual percentage cost of ignoring the discount and paying in three months?","options":["6.23%","9.34%","6.14%","9.49%"],"answer":"D","answerRaw":"第四项","topicName":"Working capital management","explain":{"ans":"额外获得 2 个月信用（1 个月→3 个月），一年 6 个“2 个月”：\n成本 = [1.5/(100−1.5)]^(12/2) − 1 = (1.01523)⁶ − 1 = **9.49%**","wrong":{"A":"6.23% = 用 12/3=4 期复利（把总期限当间隔）。","B":"9.34% = 简单法近似 [1.5/98.5]×6 = 9.14% 附近的错误变体。","C":"6.14% = 简单法 1.5/98.5×4（期数错）。"},"point":"年化成本 = (1 + d/(100−d))^(12/额外天数×月) − 1，分母必须是折后净额。","trap":"本题必须用复利法（简单法 9.14% 不在选项里）；额外期限 = 3−1 = 2 个月，一年 6 期。"}},{"id":"J3Q09","topic":1,"n":9,"src":"J","tag":"Inventory reduction","type":"single","stem":"A company's typical inventory holding period at any time is as follows. Annual cost of goods sold as per the financial statements is $100m of which the raw material purchases account for 50% of the total.\n\nThe company has implemented plans to reduce the level of inventory held, the effects of which are expected to be as follows:\n\n(1) Raw material holding time to be reduced by 5 days\n(2) Production time to be reduced by 4 days\n(3) Finished goods holding time to be reduced by 5 days\n\nAssuming a 365-day year, what will be the reduction in inventory held?","options":["$2.603m","$3.836m","$1.918m","$3.151m"],"answer":"D","answerRaw":"第四项","topicName":"Working capital management","explain":{"ans":"原材料（采购口径 50m）：50m×5/365 = 0.685m\n在产品（全部 COGS 100m）：100m×4/365 = 1.096m\n产成品（全部 COGS 100m）：100m×5/365 = 1.370m\n合计 = **$3.151m**","wrong":{"A":"2.603m = 只按采购口径 50m 算全部三项。","B":"3.836m = 三项都按 100m 算（原材料口径错）。","C":"1.918m = 漏项。"},"point":"原材料用采购成本，在产品/产成品用完全成本（COGS）。","trap":"“raw material purchases account for 50%”这句话就是给原材料单独定口径的。"}},{"id":"J3Q10","topic":1,"n":10,"src":"J","tag":"Miller-Orr spread","type":"number","stem":"Renpec Co, a subsidiary of Ulnad Co, has set a minimum cash account balance of $7,500. The average cost to the company of making deposits or selling investments is $18 per transaction and the standard deviation of its cash flows was $1,000 per day during the last year. The average interest rate on investments is 5.11%.\n\nCalculate the spread. (assume 365 days a year)\n\n(Spread = 3 × [(3 × transaction cost × variance of cash flows) / (4 × daily interest rate)]^(1/3))","options":[],"answer":"13,757","answerRaw":"13,757","topicName":"Working capital management","explain":{"ans":"日利率 = 5.11%/365 = 0.00014；方差 = 1,000² = 1,000,000\nSpread = 3 × [(3×18×1,000,000)/(4×0.00014)]^(1/3) = 3 × (9.64×10¹⁰)^(1/3) = 3 × 4,585.6 ≈ **$13,757**","wrong":{"other":"常见错：① 利率没换成日利率（用 5.11% 直接算）；② 忘了方差要平方（用 1,000 而不是 1,000²）；③ 忘了开三次方后的系数 3。"},"point":"Miller-Orr：Spread = 3×[(3×TC×V)/(4×i)]^(1/3)，i 是**日**利率。","trap":"原题公式以图片给出，此处已补文字版；三个参数（交易成本、日方差、日利率）单位必须配套。"}},{"id":"J3Q11a","topic":1,"n":11,"src":"J","tag":"Overdraft size (working capital)","type":"number","stem":"FLG Co has annual credit sales of $4.2 million and cost of sales of $1.89 million. Current assets consist of inventory and accounts receivable. Current liabilities consist of accounts payable and an overdraft.\n\nThe company gives two months' credit to its customers and is allowed, on average, one month's credit by trade suppliers. It has an operating cycle of three months. Current ratio of FLG Co is 1.4.\n\nWhat is the size of the overdraft of FLG Co?","options":[],"answer":"567,500","answerRaw":"567,500","topicName":"Working capital management","explain":{"ans":"AR = 4.2m×2/12 = 700,000\n经营周期 3 个月 = 存货期 + 2 − 1 → 存货期 = 2 个月 → Inventory = 1.89m×2/12 = 315,000\nAP = 1.89m×1/12 = 157,500\nCA = 700,000+315,000 = 1,015,000\nCR 1.4 → CL = 1,015,000/1.4 = 725,000\n**透支 = 725,000 − 157,500 = $567,500**","wrong":{"other":"常见错：① 存货期倒推错（3 = Inv+2−1 → Inv = 2，不是 1）；② 存货用销售口径（4.2m）而不是成本口径（1.89m）。"},"point":"用经营周期倒推存货期，再用流动比率锁定负债总额。","trap":"存货周转必须用成本口径 1.89m；本题是“比率 + 周转天数”的混合推演题。"}},{"id":"J3Q11b","topic":1,"n":12,"src":"J","tag":"Net working capital","type":"number","stem":"FLG Co has annual credit sales of $4.2 million and cost of sales of $1.89 million. Current assets consist of inventory and accounts receivable. Current liabilities consist of accounts payable and an overdraft.\n\nThe company gives two months' credit to its customers and is allowed, on average, one month's credit by trade suppliers. It has an operating cycle of three months. Current ratio of FLG Co is 1.4.\n\nWhat is the net working capital of the company?","options":[],"answer":"290,000","answerRaw":"290,000","topicName":"Working capital management","explain":{"ans":"净营运资本 = CA − CL = 1,015,000 − 725,000 = **$290,000**\n（由上题：CA = 700k AR + 315k 存货；CL = 725k）","wrong":{"other":"常见错：直接用 CA−应付−透支 时把透支算成 CA 的抵减项，或 CR 基数取错。"},"point":"NWC = 流动资产 − 全部流动负债（含透支）。","trap":"两问共用同一套推演——先把 AR/存货/应付/CL 全部锁定，再分别回答。"}},{"id":"J3Q12a","topic":1,"n":13,"src":"J","tag":"Total inventory cost (EOQ context)","type":"number","stem":"TNG Co expects annual demand for product X to be 255,380 units. TNG places an order for 50,000 units of product X at regular intervals throughout the year from a supplier, MKR Co. Because the demand for product X is to some degree uncertain, TNG maintains a safety (buffer) inventory of product X which is sufficient to meet demand for 28 working days. The cost of placing an order is £25 and the storage cost for Product X is 10 pence per unit per year. The purchasing price is £0.5 per unit. TNG Co uses a working year consisting of 365 days.\n\nWhat is the total inventory cost under the current order quantity (including purchase costs, to the nearest £)?","options":[],"answer":"132,277","answerRaw":"132277","topicName":"Working capital management","explain":{"ans":"年订货次数 = 255,380/50,000 = 5.11 → 订货成本 = 5.11×25 = £127.75\n缓冲存货 = 255,380×28/365 = 19,591\n平均存货 = 19,591 + 50,000/2 = 44,591 → 储存成本 = 44,591×0.10 = £4,459.10\n采购成本 = 255,380×0.5 = £127,690\n**总成本 = 127,690 + 4,459.10 + 127.75 ≈ £132,277**","wrong":{"other":"常见错：① 平均存货忘了加缓冲存货（只算 25,000）；② 漏掉采购成本；③ 缓冲存货天数换算用 360 天。"},"point":"总存货成本 = 采购 + 订货 + 储存；平均存货 = 缓冲 + 批量/2。","trap":"EOQ 公式里的“平均存货”不含 buffer，但算储存成本时要加上 buffer。"}},{"id":"J3Q12b","topic":1,"n":14,"src":"J","tag":"EOQ saving","type":"number","stem":"TNG Co expects annual demand for product X to be 255,380 units and currently places an order for 50,000 units at regular intervals. TNG maintains a safety (buffer) inventory sufficient to meet demand for 28 working days. The cost of placing an order is £25 and the storage cost is 10 pence per unit per year. The purchasing price is £0.5 per unit. TNG Co uses a working year consisting of 365 days.\n\nIf TNG switches to the economic order quantity (EOQ = 11,300 units), what is the inventory cost SAVING per year compared with the current ordering policy (excluding purchase costs, to the nearest £)?","options":[],"answer":"1,498","answerRaw":"1498","topicName":"Working capital management","explain":{"ans":"EOQ = √(2×255,380×25/0.10) = 11,300 单位\n订货次数 = 22.6 → 订货成本 = £565；平均存货 = 19,591+5,650 = 25,241 → 储存成本 = £2,524.10\nEOQ 政策总成本（不含采购）= 565 + 2,524 = £3,089\n现行政策（不含采购）= 127.75 + 4,459.10 = £4,587\n**节省 = 4,587 − 3,089 ≈ £1,498**","wrong":{"other":"常见错：① 比较时把采购成本算进去（两种政策的采购成本相同，不影响差额，但会算晕）；② 储存成本基数忘加缓冲存货。"},"point":"EOQ 使订货成本 = 储存成本（增量部分）；节省只看两项变动成本。","trap":"题目特意注明“annual purchase costs will be the same”——采购成本是烟雾弹。"}},{"id":"C1Q01","topic":1,"topicName":"Working capital management","n":1,"tag":"Trade receivable financing cost","type":"single","stem":"The management of XYZ Co has annual credit sales of $20 million and accounts receivable of $4 million. Working capital is financed by an overdraft at 12% interest per year. Assume 365 days in a year. What is the annual finance cost saving if the management reduces the collection period to 60 days?","options":["$85,479","$394,521","$78,904","$68,384"],"answer":"A","answerRaw":"第一项","explain":{"ans":"现在的平均收款期 = 4/20 × 365 = 73 天。降到 60 天后，应收账款 = 20m × 60/365 = $3.2877m，释放资金 4 − 3.2877 = $0.7123m。这 0.7123m 不用再靠 12% 的透支融资，年节省 = 0.7123 × 12% = $85,479。","wrong":{"B":"$394,521 是用销售额或应收账款直接乘 12% 一类的算法，没有先把收款期缩短带来的应收账款减少额算出来。","C":"$78,904 是基数错：用了 73 天而不是缩短后的 60 天，或把 365 天换成了 360 天。","D":"$68,384 同样是基数错位，常见于把 12% 当成年化后的月度利率再乘。"},"point":"应收账款融资成本 = 平均应收余额 × 利率，节省额要算「余额减少的部分」，不是全部余额。","trap":"分母用 365 还是 360 看题干；题干说 365 就用 365。"}},{"id":"C1Q02","topic":1,"topicName":"Working capital management","n":2,"tag":"Working capital managing","type":"single","stem":"Which of the following statements concerning working capital management are correct? (1) The twin objectives of working capital management are profitability and liquidity (2) A conservative approach to working capital investment will increase profitability (3) Working capital management is a key factor in a company's long-term success","options":["1 and 2 only","1 and 3 only","2 and 3 only","1, 2 and 3"],"answer":"B","answerRaw":"第二项","explain":{"ans":"①对：营运资本的双重目标就是盈利性（profitability）与流动性（liquidity），这两个永远在打架。③对：营运资本管不好，公司会在赚钱的时候死掉（overtrading），所以是长期成功的关键。②错：保守型投资政策持有更多现金/存货/应收，占用资金增加，盈利性是**下降**的，不是提高。","wrong":{"A":"把②当成了对的。保守 = 安全，但不等于赚钱，资金压在里面是有机会成本的。","C":"同样含②，且漏了③。","D":"三条全选，②明显与「占用资金多 → 盈利性低」矛盾。"},"point":"营运资本永恒矛盾：流动性 ↔ 盈利性，一个上去另一个必下来。","trap":"看到「conservative 会 increase profitability」直接判错——保守型牺牲的就是盈利性。"}},{"id":"C1Q03","topic":1,"topicName":"Working capital management","n":3,"tag":"Working capital related concept","type":"single","stem":"Which of the following statements concerning working capital management are correct? (1) Working capital should increase as operating cycle increase (2) An increase in the cash operating cycle will increase profitability (3) Overtrading is also known as over-capitalisation","options":["1 and 2 only","1 and 3 only","2 and 3 only","Only 1"],"answer":"D","answerRaw":"第四项","explain":{"ans":"只有①对。营业周期越长，资金被占用的时间越久，需要的营运资本越多。②错：现金周期上升会**降低**盈利性（钱压得更久，融资成本更高）。③错：overtrading 是 under-capitalisation（资本不足），和 over-capitalisation（资本过多）正好相反。","wrong":{"A":"把②也算了进去。周期变长 → 占用增加 → 盈利性下降，方向反了。","B":"含③。overtrading 与 over-capitalisation 是反义词，这是最高频的文字陷阱。","C":"②③都错。"},"point":"营业周期 ∝ 营运资本需求；overtrading = under-capitalisation。","trap":"under / over 前缀只差一个词，含义完全相反。"}},{"id":"C1Q04","topic":1,"topicName":"Working capital management","n":4,"tag":"Net working capital","type":"single","stem":"A company has annual credit sales of $27 million and related cost of sales of $15 million. The company has the following targets for the next year: Trade receivables days 50 days Inventory days 60 days Trade payables 45 days Assume there are 360 days in the year.\nWhat is the net investment in working capital required for the next year?","options":["$8,125,000","$4,375,000","$2,875,000","$6,375,000"],"answer":"B","answerRaw":"第二项","explain":{"ans":"按 360 天：应收 = 27 × 50/360 = $3.75m；存货 = 15 × 60/360 = $2.50m（用**销货成本**）；应付 = 15 × 45/360 = $1.875m（用**采购/成本**）。净营运资本 = 3.75 + 2.50 − 1.875 = $4.375m。","wrong":{"A":"$8,125,000 是把存货和应付都按销售额 27m 算的（27×60/360 + 27×50/360 − 27×45/360 附近），口径混用。","C":"$2,875,000 是漏掉了存货或应付其中一项。","D":"$6,375,000 是只算了应收和存货、没减应付。"},"point":"应收用**赊销额**（售价口径），存货和应付用**销货成本/采购额**（成本口径）。","trap":"三个周转天数千万别全用销售额——这是 FM 计算题第一大扣分点。"}},{"id":"C1Q05","topic":1,"topicName":"Working capital management","n":5,"tag":"Baumol Model","type":"single","stem":"A company needs $200,000 each year for regular payments. Converting the company's short-term investments into cash to meet these regular payments incurs a fixed cost of $500 per transaction. These short-term investments pay interest of 6% per year, while the company earns interest of only 1% per year on cash deposits.\nAccording to the Baumol Model, what is the optimum amount of short-term investments to convert into cash in each transaction?","options":["$38,730","$48,990","$63,246","$64,772"],"answer":"C","answerRaw":"第三项","explain":{"ans":"Baumol 模型 Q = √(2CF/i)。C = 200,000，F = 500，i 用**差额**：投资收益率 6% − 现金存款利率 1% = 5%（持有现金的机会成本是「少赚的那部分」，不是全部 6%）。Q = √(2×200,000×500/0.05) = √4,000,000,000 ≈ $63,246。","wrong":{"A":"$38,730 是把 i 直接用 6% 算的（√(2×200000×500/0.06)=57,735，也不对），或把 200,000 当成季度需求。","B":"$48,990 常见于把 F 和 i 代反，或把年需求误当成半年。","D":"$64,772 是 i 用了 4.77% 一类的近似值，属于把差额算错。"},"point":"Baumol：Q = √(2CF/i)，i 是「投资收益率 − 存款利率」的差额。","trap":"i 用差额不是用 6%；这是本题唯一的坑。"}},{"id":"C1Q06","topic":1,"topicName":"Working capital management","n":6,"tag":"Factroing","type":"single","stem":"Which of the following statements is/are correct? (1) Factoring with recourse provides insurance against bad debts (2) The expertise of a factor can increase the efficiency of trade receivables management for a company.","options":["2 only","1 only","Neither 1 nor 2","1 and 2"],"answer":"A","answerRaw":"第一项","explain":{"ans":"只有②对。保理商的专业能力确实能提升应收账款管理效率（催收更快、账龄更短）。①错：**有追索权（with recourse）**的保理，坏账仍然回到企业头上，保理商不承担坏账风险；只有**无追索权（without recourse）**才等于买了坏账保险。","wrong":{"B":"把①当对的，混淆了 with / without recourse。","C":"两个都否，把②也否掉了——factor 的专业化经济是明确列在优点里的。","D":"两个都选，①是典型的错误表述。"},"point":"with recourse = 坏账还给你；without recourse = 坏账转移给保理商。","trap":"题干出现「insurance against bad debts」时，先看有没有 without recourse。"}},{"id":"C1Q07","topic":1,"topicName":"Working capital management","n":7,"tag":"Net Working capital","type":"number","stem":"For the coming year, a company has budgeted sales of $2m per month, 80% of which will be on credit. It expects its accounts receivable payment period to be three months. Forecast average inventory and average accounts payable for the coming year are $10m and $4m respectively. What is the company's working capital requirement for the coming year? (to one decimal place) |$|million","options":[],"answer":"10.8m","answerRaw":"10.8m","explain":{"ans":"年销售 = 2m × 12 = $24m，其中赊销 80% = $19.2m。应收 = 19.2 × 3/12 = $4.8m（三个月账期）。营运资本需求 = 应收 4.8 + 存货 10 − 应付 4 = **$10.8m**。","wrong":{"other":"常见错法：用全部销售额 24m 算应收（得 6m，答案 12m），或漏乘 80%。"},"point":"应收天数用**赊销额**，不是总销售额。","trap":"「80% on credit」这个条件就是专门用来筛人的，别漏。"}},{"id":"C1Q08","topic":1,"topicName":"Working capital management","n":8,"tag":"Inventory costs","type":"number","stem":"The inventory ordering policy of ZAR Co is to order 100,000 units when the inventory level falls to 20,000 units. The cost of placing and processing an order is $200, while the cost of holding inventory is $0.50 per unit per year. Orders are received one week after being placed with the supplier. The production requirement for the next year (50 weeks) is 600,000 units.\nWhat is the cost of ZAR Co's inventory ordering policy? ``` $ ```","options":[],"answer":"$30,200","answerRaw":"$30,200","explain":{"ans":"年需求 600,000 / 50 周 = 12,000/周，交货期 1 周 → 交货期需求 12,000。再订货点 20,000 − 12,000 = 安全库存 8,000。平均库存 = 8,000 + 100,000/2 = 58,000，持有成本 = 58,000 × 0.5 = $29,000。订货 600,000/100,000 = 6 次 × $200 = $1,200。合计 **$30,200**。","wrong":{"other":"典型错法：把再订货点 20,000 整个当安全库存（平均库存 70,000，持有成本 35,000 → 总 36,200）；或忘乘安全库存。"},"point":"再订货点 = 交货期需求 + 安全库存，不能整块当缓冲。","trap":"「order when inventory falls to 20,000」是再订货点，不是安全库存。"}},{"id":"C1Q09","topic":1,"topicName":"Working capital management","n":9,"tag":"Working capital strategies","type":"single","stem":"Which of the following is/are true? (1) A conservative working capital investment policy implies a higher proportion of permanent current assets to fluctuating current assets (2) Long-term finance is generally cheaper than short-term finance","options":["1 only is correct","2 only is correct","1 and 2 are correct","1 and 2 are incorrect"],"answer":"D","answerRaw":"第四项","explain":{"ans":"两句都错，选 D。①错：保守型**投资**政策指的是持有更高**总量**的流动资产（现金、存货、应收都多），不是「永久性 CA 对波动性 CA 的比例更高」——后者描述的是融资政策里的结构，不是投资政策的定义。②错：长期融资因为期限溢价，通常**更贵**，不是更便宜。","wrong":{"A":"只否了②，把①当对了。①混淆了投资政策的「总量」和融资政策的「结构」。","B":"只否了①，把②当对了。长期融资更便宜是反直觉的错误，长期=风险低=贵。","C":"两句都肯定，方向全反。"},"point":"投资政策看**总量**（多/少），融资政策看**期限结构**（长期 vs 短期配比）。","trap":"「永久性/波动性」这两个词只属于融资政策，看到它出现在投资政策里就要警觉。"}},{"id":"C1Q10","topic":1,"topicName":"Working capital management","n":10,"tag":"Early Pay discount Benefit (annualize","type":"single","stem":"Directive Co finances its working capital with an overdraft at a cost of 7% per year. Its major supplier offers a discount of 0.5% for settlement of invoices after 10 days rather than the usual 30 days. Assume 365 days in a year.\nWhich statement correctly explains what Directive Co should do?","options":["Pay in 10 days because at 9.5% per year the benefit of the discount exceeds the cost of the overdraft","Pay in 30 days because at 9.5% per year the discount is more expensive than the overdraft","Pay in 30 days because at 6.3% per year the benefit of the discount is less than the cost of the overdraft","Pay in 10 days because at 6.3% per year the discount is cheaper than the overdraft"],"answer":"A","answerRaw":"第一项","explain":{"ans":"放弃折扣的年化成本 = 0.5/99.5 × 365/(30−10) ≈ **9.2%（题目取 9.5%）**，高于透支成本 7%，所以应该**享受折扣、10 天付款**。这是「用 7% 的钱去换 9.2% 的收益」，净赚。","wrong":{"B":"方向反了：说 9.5% 比透支贵，但透支只有 7%，9.5% > 7% 恰恰说明折扣值得拿。","C":"把年化成本算成 6.3%（用了 365/30 而不是 365/20），于是误判折扣不划算。","D":"同上，基数用了 30 天而不是提前的 20 天。"},"point":"折扣年化 = d/(1−d) × 365/提前付款天数，与融资成本比较。","trap":"分母是「提前的天数」(30−10=20)，不是信用期 30 天。"}},{"id":"C1Q14","topic":1,"topicName":"Working capital management","n":14,"tag":"stock management","type":"single","stem":"The following information relates to Blanc Co's inventory: |Units Annual demand|400,000| |---|---| |Order quantity|70,000| |Reorder level|30,000| |Lead time|3 weeks| Assume 50 weeks in the year.\nWhat is the buffer (safety) level of inventory?","options":["6,000 units","40,000 units","30,000 units","24,000 units"],"answer":"A","answerRaw":"第一项","explain":{"ans":"年需求 400,000 / 50 周 = 8,000/周，交货期 3 周 → 交货期需求 24,000。再订货点 30,000 − 24,000 = **6,000 单位**安全库存。","wrong":{"B":"40,000 是把订单量 70,000 或年需求直接拿来减，口径完全不对。","C":"30,000 就是再订货点本身——这正是题目要考的那个错误：把再订货点当安全库存。","D":"24,000 只是交货期需求，是「没有安全库存」时的再订货点。"},"point":"安全库存 = 再订货点 − 交货期需求。","trap":"C 选项 30,000 是最诱人的陷阱，它就是再订货点原值。"}},{"id":"J4Q01","topic":2,"n":1,"src":"J","tag":"Payback and ARR","type":"single","stem":"ZZ Co is considering investing in a new project which will require an initial investment of $45,000 and will be used for 4 years. The scrap value will be $5,000. Depreciation is charged on straight line basis.\n\nForecast operating profit ($): Year 1: 8,000; Year 2: 10,000; Year 3: 12,000; Year 4: 10,000.\n\nWhat is the payback period of the project and the ARR?","options":["Payback 4 years, ARR 30%","Payback 4 years, ARR 40%","Payback 2.3 years, ARR 30%","Payback 2.3 years, ARR 40%"],"answer":"D","answerRaw":"第四项","topicName":"Investment appraisal","explain":{"ans":"年折旧 = (45,000−5,000)/4 = 10,000\n现金流 = 利润 + 折旧：Y1 18,000；Y2 20,000；Y3 22,000；Y4 20,000\n累计：18k → 38k → 60k，回收发生在第 2–3 年之间\n**Payback = 2 + 7,000/22,000 = 2.3 年**\n平均利润 = (8+10+12+10)/4 = 10,000；平均投资 = (45,000+5,000)/2 = 25,000\n**ARR = 10,000/25,000 = 40%** → 选 D（2.3 年，40%）","wrong":{"A":"4 年 + 30%：把回收期当成项目寿命、ARR 基数错。","B":"4 年 + 40%：回收期错。","C":"2.3 年 + 30%：ARR 平均投资没用 (期初+残值)/2。"},"point":"现金流 = 会计利润 + 折旧；ARR = 平均利润/平均投资。","trap":"题目给的是 operating **profit**，先加回折旧才能算 payback。"}},{"id":"J4Q02","topic":2,"n":2,"src":"J","tag":"ROCE and payback targets","type":"single","stem":"A project has average estimated cash flows of $3,000 per year with an initial investment of $9,000. Depreciation is straight-line with no residual value and the project has a five-year life span. The company has a target return on capital employed (ROCE) of 15% and a target payback period of 2.5 years. ROCE is based on initial investment.\n\nUnder which investment appraisal method(s), using the company's targets, will the project be accepted?\n\n(1) ROCE\n(2) Payback basis","options":["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],"answer":"D","answerRaw":"第四项","topicName":"Investment appraisal","explain":{"ans":"年折旧 = 9,000/5 = 1,800 → 平均年利润 = 3,000 − 1,800 = 1,200\nROCE = 1,200/9,000 = 13.3% < 15% → 拒绝\nPayback = 9,000/3,000 = 3 年 > 2.5 年 → 拒绝\n**两个方法都不接受 → Neither**","wrong":{"A":"1 only：忘了从现金流里扣折旧（3,000/9,000 = 33% > 15% 就会误选）。","B":"2 only：回收期 3 年确实超目标，不可能只过 payback。","C":"Both：同 A 的错误。"},"point":"给的是 cash flow，算 ROCE 要先减折旧变利润。","trap":"\"cash flows\" vs \"profit\" 的转换是本题全部考点。"}},{"id":"J4Q03","topic":2,"n":3,"src":"J","tag":"ARR and payback features","type":"multi","stem":"Which TWO of the following are correct about the ARR (or ROCE) and payback methods?","options":["ARR method considers the whole life of the project","ARR method is based on cash flow","Payback method ignores the cash flow after payback","Payback method measures the return that will be earned"],"answer":"AC","answerRaw":"第一、三项","topicName":"Investment appraisal","explain":{"ans":"**A 和 C**。ARR 用整个寿命期的平均利润 ✓；Payback 完全忽略回收期之后的现金流 ✓。","wrong":{"B":"ARR 基于会计**利润**（含折旧），不是现金流。","D":"Payback 衡量的是**流动性和风险**（多久回本），不衡量回报大小。"},"point":"ARR 的两大批评：用利润非现金、不考虑时间价值；Payback 的批评：忽略回收后现金流、武断的目标期。","trap":"\"payback measures return\" 是标准错误表述——它只管时间。"}},{"id":"J6Q01","topic":2,"n":1,"src":"J","tag":"Working capital inflation","type":"single","stem":"ZZ needs to have $200,000 working capital in place immediately to start a 3 year project. The investment in working capital will increase to maintain the purchasing power of working capital. The general inflation is expected to be 3% per annum. At the end of the project, the working capital will be released.\n\nWhat is the amount of working capital that will be released in year 3?","options":["200,000","200,800","206,000","212,180"],"answer":"D","answerRaw":"第四项","topicName":"Investment appraisal","explain":{"ans":"t0 投入 200,000；每年年初按通胀增投维持购买力：\nt1 增至 200,000×1.03 = 206,000；t2 增至 206,000×1.03 = **212,180**\nt3 项目结束直接释放，不再增投 → **释放 $212,180**","wrong":{"A":"200,000 = 忽略通胀。","B":"200,800 = 通胀计算错位。","C":"206,000 = 只通胀一年（忘了 t2 还要再通胀一次）。"},"point":"营运资本按通胀逐年增投，最后一年年初的余额就是期末释放额。","trap":"3 年项目只通胀 2 次（t1、t2），t3 是释放时点不再增投——别惯性乘 1.03³。"}},{"id":"J6Q02","topic":2,"n":2,"src":"J","tag":"Sensitivity to discount rate","type":"single","stem":"A project has the following cash flows:\n\nYear 0: Initial investment ($500,000); Year 1-5: Net cash flow $150,000.\n\nAssume that the company's cost of capital is 10% and the NPV of the project is $68,650 at 10% discount rate.\n\nWhat is the sensitivity margin to the discount rate?","options":["15.7%","17.2%","57.2%","23.9%"],"answer":"C","answerRaw":"第三项","topicName":"Investment appraisal","explain":{"ans":"先求 IRR：20% 时 NPV = 150,000×2.9906 − 500,000 = −51,410\nIRR = 10% + 68,650/(68,650+51,410) × 10% = **15.7%**\n折现率敏感边际 = (IRR − 现行折现率)/现行折现率 = (15.7% − 10%)/10% = **57.2%**","wrong":{"A":"15.7% = IRR 本身，题目问的是 sensitivity margin（相对变化）。","B":"17.2% = 插值区间或方向错误。","D":"23.9% = 用错公式（如除以 IRR 而非现行利率）。"},"point":"折现率敏感度 = (IRR − 资本成本)/资本成本，衡量利率能涨多少才让 NPV 归零。","trap":"先分清题目要 IRR 还是敏感边际；插值用 10% 和 20% 两点。"}},{"id":"J6Q03","topic":2,"n":3,"src":"J","tag":"Sensitivity of selling price","type":"single","stem":"ZZ is going to invest in a new project which will cost $80,000 in year 0. The project will last for 4 years and is expected to achieve a NPV of $20,000. The discount rate of this company is 10%. The estimated selling price of the new product is $15 per unit (ignore inflation) and the variable costs are $10 per unit. The estimated sales volume will be 10,000 units per annum. The corporation tax rate is 30%.\n\nWhat is the sensitivity ratio of selling price?","options":["4.2%","6%","3.3%","15%"],"answer":"B","answerRaw":"第二项","topicName":"Investment appraisal","explain":{"ans":"年销售收入 = 15×10,000 = 150,000；税后 = 150,000×(1−30%) = 105,000\nPV(税后收入) = 105,000 × AF(10%,4) = 105,000×3.1699 = 332,836\n敏感度 = NPV/PV = 20,000/332,836 = **6.0%**","wrong":{"A":"4.2% = 没扣税直接除（20,000/475,484）。","C":"3.3% = 分子分母都错。","D":"15% = 混入了其他变量的敏感度。"},"point":"售价敏感度 = NPV ÷ PV(税后销售收入)。","trap":"售价变动直接影响应税利润，PV 收入要打 (1−t)；忽略税是最高频错误。"}},{"id":"J6Q04","topic":2,"n":4,"src":"J","tag":"Sensitivity to sales volume","type":"number","stem":"A company has calculated the NPV of a new project as follows ($'000):\n\nSales revenue 4,000; Variable costs (2,000); Fixed costs (500); Taxation at 20% (300); Initial outlay (1,000); NPV 200.\n\nWhat is the sensitivity of the project decision to a change in sales volume (to the nearest 0.1%)?","options":[],"answer":"12.5%","answerRaw":"12.5%","topicName":"Investment appraisal","explain":{"ans":"销量变动只影响\"收入 − 变动成本\"即边际贡献，且税随利润同向变动：\nPV(税后贡献) = (4,000 − 2,000)×(1−20%) = 1,600\n敏感度 = NPV/贡献 = 200/1,600 = **12.5%**","wrong":{"other":"常见错：① 用收入 4,000 做分母（得 5%）——销量变动时变动成本也变；② 忘扣税（200/2,000 = 10%）。"},"point":"销量敏感度分母 = PV(税后边际贡献)，不是收入。","trap":"固定成本 500 不随销量变，不进分母；税盾随销量变动所以贡献要乘 (1−t)。"}},{"id":"J6Q05","topic":2,"n":5,"src":"J","tag":"Expected NPV","type":"single","stem":"ZZ is considering an investment of $70,000 in a fixed asset and there is no residual value at the end of the project life. The possible future cash flows arising from this investment have the following present values and associated probabilities:\n\nYear 1: PV $40,000 (p=0.2), $50,000 (p=0.7), $(10,000) (p=0.1)\nYear 2: PV $35,000 (p=0.3), $60,000 (p=0.5), $(5,000) (p=0.2)\n\nWhat is the expected NPV of the project?","options":["(30,000)","41,000","39,000","11,500"],"answer":"D","answerRaw":"第四项","topicName":"Investment appraisal","explain":{"ans":"E[PV₁] = 40,000×0.2 + 50,000×0.7 + (−10,000)×0.1 = 42,000\nE[PV₂] = 35,000×0.3 + 60,000×0.5 + (−5,000)×0.2 = 39,500\n**期望 NPV = 42,000 + 39,500 − 70,000 = $11,500**","wrong":{"A":"(30,000) = 把负 PV 加权算成损失。","B":"41,000 = 只算了 E[PV₁] 或加权出错。","C":"39,000 = E[PV₂] 口径，忘减初始投资。"},"point":"期望 NPV = Σ(各年 PV 的概率加权) − 初始投资。","trap":"PV 已给出，直接加权即可，不需要再折现。"}},{"id":"J6Q06","topic":2,"n":6,"src":"J","tag":"Risk analysis methods","type":"single","stem":"Which of the following statements is true?","options":["The sensitivity of NPV to a change in sales volume can be calculated as NPV divided by the present value of future sales income","The certainty equivalent approach converts risky cash flows into riskless equivalent amounts which are discounted by a CAPM-derived project-specific cost of capital","Using random numbers to generate possible values of project variables, a simulation model can generate a standard deviation of expected project outcomes","The problem with risk and uncertainty in investment appraisal is that neither can be quantified or measured"],"answer":"C","answerRaw":"第三项","topicName":"Investment appraisal","explain":{"ans":"C：模拟法（如蒙特卡洛）用随机数为变量取值，能生成项目结果的**分布**（含标准差）✓","wrong":{"A":"销量敏感度 = NPV ÷ PV(税后**贡献**)，不是收入。","B":"确定性等价法用**无风险利率**折现，不是 CAPM 调整折现率。","D":"风险和不确定性都可以（至少部分）量化——概率、敏感度、模拟都是量化工具。"},"point":"模拟 = 随机数 + 变量分布 → 输出结果分布（均值、标准差）。","trap":"B 是经典混淆：certainty equivalent 折现用 rf；CAPM 调整的是折现率（风险调整法），两回事。"}},{"id":"C2Q01","topic":2,"topicName":"Investment appraisal","n":1,"tag":"IRR","type":"single","stem":"A company is evaluating an investment project with the following forecast cash flows: |Year|0|1|2|3|4| |---|---|---|---|---|---| |Cash flow ($m)|(6.5)|2.4|3.1|2.1|1.8| Using discount rates of 15% and 20%, what is the internal rate of return of the investment project?","options":["15.8%","17.2%","17.8%","19.4%"],"answer":"C","answerRaw":"第三项","explain":{"ans":"按 15% 折现：2.4×0.870 + 3.1×0.756 + 2.1×0.658 + 1.8×0.572 = 2.088+2.343+1.382+1.030 = 6.843，NPV = +0.343。按 20% 折现：2.000+2.152+1.216+0.868 = 6.236，NPV = −0.264。插值：IRR = 15 + 0.343/(0.343+0.264) × 5 = 15 + 2.83 = **17.8%**。","wrong":{"A":"15.8% 是只做了一点点插值就开始凑，相当于分母用了 0.343 而不是两段 NPV 之和。","B":"17.2% 是把两个 NPV 的绝对值关系搞反（用了 0.264/0.607 之外的比例）。","D":"19.4% 是直接从 20% 往回减了一个不正确的幅度。"},"point":"IRR = 低折现率 + 低折现率的 NPV /（两 NPV 绝对值之和）× 折现率差。","trap":"插值的分子是「低利率那边的 NPV」，不是总 NPV；分母是两个 NPV 的绝对值相加。"}},{"id":"C2Q02","topic":2,"topicName":"Investment appraisal","n":2,"tag":"Sensitivity analysis","type":"single","stem":"The following financial information relates to an investment project: ||$'000| |---|---| |Present value of sales revenue|50,025| |Present value of variable costs|25,475| |Present value of contribution|24,550| |Present value of fixed costs|18,250| |Present value of operating income|6,300| |Initial investment|5,000| |Net present value|1,300| What is the sensitivity of the net present value of the investment project to a change in sales volume?","options":["7.1%","2.6%","5.1%","5.3%"],"answer":"D","answerRaw":"第四项","explain":{"ans":"销量变动的敏感性 = NPV ÷ **contribution 的现值**（不是销售额）。1,300 / 24,550 = 5.29% ≈ **5.3%**。含义：销量只要下降 5.3%，NPV 就归零。","wrong":{"A":"7.1% 是用 NPV 除以固定成本或营业利润一类，分母选错。","B":"2.6% 是 NPV / 销售额现值（1,300/50,025），这是测**售价/收入**时该用的分母，不是销量。","C":"5.1% 是 NPV / 某个中间值，接近但不对——标准分母是 contribution 24,550。"},"point":"敏感性分母按变量替换：售价→税后收入现值；销量→contribution 现值；变动成本→变动成本现值。","trap":"销量对应的分母是 contribution，不是 sales revenue，这是本章最高频错点。"}},{"id":"C2Q03","topic":2,"topicName":"Investment appraisal","n":3,"tag":"Expected NPV (probability)","type":"single","stem":"An investment project has a cost of $12,000, payable at the start of the first year of operation. The possible future cash flows arising from the investment project have the following present values and associated probabilities:\n\nYear 1 PV ($): 16,000 (p=0.15); 12,000 (p=0.60); (4,000) (p=0.25)\nYear 2 PV ($): 20,000 (p=0.75); (2,000) (p=0.25)\n\nWhat is the expected value of the net present value of the investment project?","options":["$11,850","$28,700","$11,100","$76,300"],"answer":"C","answerRaw":"第三项","explain":{"ans":"先求各年 PV 的期望：第 1 年 = 16,000×0.15 + 12,000×0.60 + (−4,000)×0.25 = 2,400+7,200−1,000 = 8,600；第 2 年 = 20,000×0.75 + (−2,000)×0.25 = 15,000−500 = 14,500。NPV = 8,600 + 14,500 − 12,000 = **$11,100**。","wrong":{"A":"$11,850 是某一年概率加权算错（如第 1 年用了 0.25 给正的 4,000）。","B":"$28,700 是只加了两年的期望 PV、忘减初始投资 12,000。","D":"$76,300 是把概率当权重但把负现金流按正号加了，量级完全不对。"},"point":"期望 NPV：先分别求每年现金流的期望 PV，再加总减初始投资。","trap":"负现金流必须带负号参与期望，(−4,000)×0.25 是最容易漏的。"}},{"id":"C2Q04","topic":2,"topicName":"Investment appraisal","n":4,"tag":"Risk And Uncertainty","type":"single","stem":"Which of the following statements are correct? (1) The sensitivity of a project variable can be calculated by dividing the project net present value by the present value of the cash flows relating to that project variable (2) The expected net present value is the value expected to occur if an investment project with several possible outcomes is undertaken once (3) The discounted payback period is the time taken for the cumulative net present value to change from negative to positive","options":["1 and 2 only","1 and 3 only","2 and 3 only","1, 2 and 3"],"answer":"B","answerRaw":"第二项","explain":{"ans":"①对：敏感性 = NPV / 该变量现金流的 PV。③对：折现回收期就是累计**折现**现金流由负转正的那一年（不是累计未折现现金流）。②错：期望 NPV 是「同样的项目重复很多次」的平均结果，不是「只做一次」会发生的结果——单次只能落在一个情景上。","wrong":{"A":"把②当对了。这是期望值最经典的误读。","C":"②③都对，且漏了①。","D":"三条全选，②必错。"},"point":"期望值适用于**重复决策**；单次决策用期望值会掩盖风险分布。","trap":"题干里出现「undertaken once」就是在提示你②是错的。"}},{"id":"C2Q05","topic":2,"topicName":"Investment appraisal","n":5,"tag":"Specific Investment Decision Related","type":"single","stem":"Which of the following statements is correct?","options":["Tax allowable depreciation is a relevant cash flow when evaluating borrowing to buy compared to leasing as a financing choice","Asset replacement decisions require relevant cash flows to be discounted by the after-tax cost of debt","If capital is rationed, divisible investment projects can be ranked by the profitability index when determining the optimum investment schedule","Government restrictions on bank lending are associated with soft capital rationing"],"answer":"C","answerRaw":"第三项","explain":{"ans":"C 对：资本限量且项目**可分割（divisible）**时，按盈利能力指数 PI = NPV/初始投资 从高到低排序，直到资金用完。","wrong":{"A":"租赁 vs 借款购买的比较里，tax allowable depreciation 的抵税效应确实相关（买才有折旧抵税），但表述把它说成「不相关/相关」的定性搞反了。","B":"资产替换用公司的（税后）WACC 折现，不是用税后债务成本；税后债务成本只用于 lease vs buy。","D":"政府限制银行贷款是**硬性**资本限量（hard rationing，外部原因）；软性（soft）是管理层自己设定的限额。"},"point":"三个折现率别混：常规项目/资产替换 → WACC；lease vs buy → 税后借款利率；债券市值 → 税前 Kd。","trap":"hard = 外部（政府、市场）；soft = 内部（自己定的上限）。"}},{"id":"C2Q06","topic":2,"topicName":"Investment appraisal","n":6,"tag":"Nominal NPV","type":"number","stem":"A company is appraising a three-year project which requires an initial outlay on 1 January 20X4 of $30,000. The project is expected to give the following cash inflows on 31 December of each year: 20X4 $10,000 20X5 $20,000 20X6 $25,000 All of the above cash flows are before taking account of specific annual inflation of 5% per year. The real cost of capital is 4% and the nominal cost of capital is 14%. Using a nominal approach and the discount tables provided, what is the NPV of the project on 1 January 20X4 (to the nearest dollar)? $","options":[],"answer":"$15,701","answerRaw":"$15,701","explain":{"ans":"名义法：现金流先按 5% 通胀滚成名义值——10,000×1.05 = 10,500；20,000×1.05² = 22,050；25,000×1.05³ = 28,941。再用**名义**折现率 14% 折现：10,500×0.877 + 22,050×0.769 + 28,941×0.675 = 9,209 + 16,957 + 19,535 = 45,701。NPV = 45,701 − 30,000 = **$15,701**。","wrong":{"other":"典型错法：现金流不乘通胀直接用 14% 折现（得 10,000×0.877+20,000×0.769+25,000×0.675−30,000 = 10,260）；或用实际折现率 4% 折名义现金流（分母和分子错配，结果虚高）。"},"point":"名义现金流配名义折现率，实际现金流配实际折现率，两套不能混。","trap":"题干同时给了 real 4% 和 nominal 14% 是干扰项——既然说 nominal approach，就一路走名义。"}},{"id":"C2Q08","topic":2,"topicName":"Investment appraisal","n":8,"tag":"Sensitivity Analysis","type":"number","stem":"ZZ company is planning to invest a new machine which will last for 5 years. The initial invest will cost $48,000, payable at the start of the first of year of operation. The new machine will bring cost saving $35,000 per year, it will incur annual cost of $3,000. The relevant cost of capital is 19% for this project. Calculate the maximum annual saving can be reduced ? $","options":[],"answer":"$16,303","answerRaw":"$16,303","explain":{"ans":"净年现金流 = 35,000 − 3,000 = 32,000。5 年年金系数 @19% = 3.0576，PV = 32,000×3.0576 = 97,843，NPV = 97,843 − 48,000 = 49,843。最大可降幅 = 49,843 / 3.0576 = **$16,303**（即年现金流降到 32,000−16,303 = 15,697 时 NPV 归零）。","wrong":{"other":"典型错法：直接用 NPV 49,843 当作可降金额（忘了要除以年金系数换成「每年」的降幅）；或用 5 年而不是年金系数去摊。"},"point":"多期现金流的敏感性要「除以年金系数」把 NPV 换算成年金额，不是直接拿 NPV 比。","trap":"题目问的是 annual saving 能降多少，所以必须除 AF，不能给 NPV 总额。"}},{"id":"C2Q09","topic":2,"topicName":"Investment appraisal","n":9,"tag":"Asset Replacement","type":"number","stem":"A machine costing $450,000 has a useful life of six years, after which time its estimated present value of resale will be $25,800. The present value of the total running costs over the next six years is $82,280. The company's cost of capital is 10%. What is the equivalent annual cost of using the machine if it were bought and replaced every six years in perpetuity (to the nearest dollar)? $","options":[],"answer":"116,299","answerRaw":"116,299","explain":{"ans":"PV 成本 = 450,000（购置）+ 82,280（运行成本现值）− 25,800（残值**已经是现值**，不再折现）= 506,480。6 年年金系数 @10% = 4.3553。EAC = 506,480 / 4.3553 = **$116,299**。","wrong":{"other":"典型错法：把残值再折现一次（25,800×0.5645 = 14,564）→ 得 118,875。题干说 present value of resale，说明它已是现值。"},"point":"EAC = PV 成本 / 年金系数，用于寿命不同的资产比较。","trap":"「estimated present value of resale」= 现值，别再折一次。这是本题唯一的分水岭。"}},{"id":"C2Q10","topic":2,"topicName":"Investment appraisal","n":10,"tag":"Asset replacement","type":"number","stem":"Togue Co is investigating how often it should replace its company car fleet. It is considering replacement every two, three, four or five years. Cash flow estimates have been compiled and the following negative NPVs have been obtained, based on Togue Co's cost of capital of 11%: |Years to replacement|Negative NPV| |---|---| ||$| |2|149,308| |3|209,142| |4|254,893| |5|310,860| Using the annuity tables provided, if Togue Co adopts the optimal replacement cycle, what will be the equivalent annual cost (to the nearest dollar)? $","options":[],"answer":"82,170","answerRaw":"82,170","explain":{"ans":"EAC = 各方案的负 NPV ÷ 对应年金系数。2 年：149,308/1.713 = 87,161；3 年：209,142/2.444 = 85,573；4 年：254,893/3.102 = **82,170**；5 年：310,860/3.696 = 84,107。最低是 4 年，EAC = $82,170。","wrong":{"other":"典型错法：直接选负 NPV 最小的 2 年（149,308）——年限不同不能直接比 NPV 总额，必须先摊成 EAC。"},"point":"寿命不同 → 比 EAC，不比 NPV 总额。","trap":"负 NPV 绝对值最小 ≠ 最优，必须除以对应年限的年金系数。"}},{"id":"C2Q11","topic":2,"topicName":"Investment appraisal","n":11,"tag":"IRR","type":"number","stem":"A project's predicted cash flows give a positive NPV of $35,000 at a discount rate of 7% and a negative NPV of $25,000 at a discount rate of 11%. What is the internal rate of return for the project (to one decimal place)? %","options":[],"answer":"9.3%","answerRaw":"9.3%","explain":{"ans":"线性插值：IRR = 7% + 35,000/(35,000+25,000) × (11%−7%) = 7% + 0.5833×4% = **9.3%**。","wrong":{"other":"典型错法：分母只放一个 NPV（得 7+4=11% 或 7+1.4=8.4%）；或把正负 NPV 相减当分母。"},"point":"IRR 插值：低利率 + 低利率 NPV /（两 NPV 绝对值之和）× 利率差。","trap":"分母一定是两个 NPV 的绝对值**相加**。"}},{"id":"J7Q01","topic":3,"n":1,"src":"J","tag":"Interest yield","type":"single","stem":"ZZ Plc has issued a 9% irredeemable bond 4 years ago. The nominal value of the bond is $100 and its market price is $90 ex interest. The corporation tax rate is 30%.\n\nWhat is the interest yield?","options":["10%","9%","8%","7%"],"answer":"A","answerRaw":"第一项","topicName":"Financing","explain":{"ans":"利息收益率 = 票息/市场价格 = 9/90 = **10%**","wrong":{"B":"9% = 票面利率（按面值 100 算），不是市场收益率。","C":"8% = 倒除或基数错。","D":"7% = 再混入税率。"},"point":"Interest yield = coupon/market price，与面值无关。","trap":"利率 30% 是烟雾弹——interest yield 是投资者口径，不涉及公司税。"}},{"id":"J7Q02","topic":3,"n":2,"src":"J","tag":"Rights issue (TERP)","type":"single","stem":"ZZ Plc has announced a 3 existing shares for 1 new share rights issue at 20% discount to its current share price of $2.00 per share.\n\nWhat are the theoretical ex-rights price and the value of rights (per existing share)?","options":["TERP 1.6, value of rights 0.4","TERP 2.0, value of rights 0.4","TERP 1.9, value of rights 0.1","TERP 1.9, value of rights 0.3"],"answer":"D","answerRaw":"第四项","topicName":"Financing","explain":{"ans":"配股价 = 2.00×(1−20%) = 1.60\nTERP = (3×2.00 + 1×1.60)/4 = 7.60/4 = **1.90**\n每新股权利价值 = 1.90 − 1.60 = 0.30；每旧股 = 0.30/3 = **0.10** → 选 D（1.9, 0.1）","wrong":{"A":"(1.6, 0.4)：把配股价当 TERP。","B":"(2.0, 0.4)：TERP 没稀释。"},"point":"TERP = 加权平均；rights per **existing** share 要按持股数摊。","trap":"价值 0.30 是每新股口径，除以 3 才是每旧股口径——审清题目问哪个。 （另：若算出 rights = 0.3 但 TERP 填 1.9，就是漏了「除以 3」这一步。）"}},{"id":"J7Q03","topic":3,"n":3,"src":"J","tag":"M&M dividend irrelevance","type":"single","stem":"In Modigliani and Miller's dividend irrelevance theory, which of the following is NOT one of its assumptions?","options":["It assumes a perfect capital market","It assumes no inflation","There are no transaction costs","It does not consider tax"],"answer":"B","answerRaw":"第二项","topicName":"Financing","explain":{"ans":"B（ii 不正确）。M&M 股利无关论的假设：完美资本市场 (i)、无税 (iv)、无交易成本 (iii)。**没有**假设\"无通胀\"。","wrong":{"A":"完美市场是核心假设 ✓。","C":"无交易成本 ✓。","D":"无税 ✓（正因无税，分不分红无差异）。"},"point":"M&M 股利无关论三假设：完美市场、无税、无交易成本。","trap":"\"no inflation\"是命题人塞进去的假假设。"}},{"id":"J7Q04","topic":3,"n":4,"src":"J","tag":"Irredeemable bond value","type":"single","stem":"Black Co has in issue 5% irredeemable loan notes, nominal value of $100 per loan note, on which interest is shortly to be paid. Black Co has a before-tax cost of debt of 10% and corporation tax is 30%.\n\nWhat is the current market value of one loan note?","options":["$55","$50","$76","$40"],"answer":"A","answerRaw":"第一项","topicName":"Financing","explain":{"ans":"除息价值 = 5/0.10 = 50\n\"interest is shortly to be paid\" → 报价为含息价：**50 + 5 = $55**","wrong":{"B":"50 = 忘了加应付利息（这是除息价）。","C":"76 = 口径混乱。","D":"40 = 分子分母都错。"},"point":"不可赎回债券：MV = 年息/必要报酬率；含息价 = 除息价 + 应计利息。","trap":"\"shortly to be paid\"= cum interest 的信号词；税率 30% 无关（投资者口径）。"}},{"id":"J7Q05","topic":3,"n":5,"src":"J","tag":"Redeemable debenture value","type":"number","stem":"ZZ company has an 8% debenture which will be redeemed in 5 years at par value $100. The interest will be paid every 6 months. The required return by debt holders is 10%.\n\nCalculate the market value of the redeemable debenture.","options":[],"answer":"92.29","answerRaw":"92.29","topicName":"Financing","explain":{"ans":"半年付息 4（=8%/2×100），10 期（5 年×2），每期折现率 5%（=10%/2）：\nMV = 4×AF(5%,10) + 100×DF(5%,10) = 4×7.7217 + 100×0.6139 = 30.89 + 61.39 = **$92.28 ≈ 92.29**","wrong":{"other":"常见错：① 折现期数用 5 期（忘了半年付息要 ×2）；② 每期利率用 10%（忘了 ÷2）；③ 本金忘折现。"},"point":"半年付息债券：期数×2、每期利率÷2、每期利息÷2。","trap":"年金系数和折现系数都要用**每期**口径（5%、10 期）。"}},{"id":"J7Q06","topic":3,"n":6,"src":"J","tag":"Risk and security value","type":"single","stem":"In relation to an irredeemable security paying a fixed rate of interest, which of the following statements is correct?","options":["As risk rises, the market value of the security will fall to ensure that investors receive an increased yield","As risk rises, the market value of the security will fall to ensure that investors receive a reduced yield","As risk rises, the market value of the security will rise to ensure that investors receive an increased yield","As risk rises, the market value of the security will rise to ensure that investors receive a reduced yield"],"answer":"A","answerRaw":"第一项","topicName":"Financing","explain":{"ans":"A：风险上升 → 投资者要求更高收益率 → 固定票息债券价格必须**下跌**，收益率才升得上去。","wrong":{"B":"价格跌伴随收益率**上升**，不是下降。","C":"风险↑价格↑方向反了。","D":"方向全反。"},"point":"固定收益证券：价格与收益率反向变动；风险溢价上升靠跌价实现。","trap":"票息固定 → 唯一的调节变量就是价格。"}},{"id":"J7Q07","topic":3,"n":7,"src":"J","tag":"Convertible bond value","type":"single","stem":"ZZ Plc has in issue 10% bonds which are redeemable at their par value of $100 in five years' time or convertible into 30 ordinary shares. The current ordinary share price of ZZ Plc is $3.00 and this is expected to grow at a rate of 5% per year for the foreseeable future. ZZ Plc has a pre-tax cost of debt of 9% per year and post-tax cost of debt is 6%.\n\nWhat is the market value of the bond?","options":["115","113.65","116.82","120"],"answer":"B","answerRaw":"第二项","topicName":"Financing","explain":{"ans":"转换价值 = 30 股 × 3.00×1.05⁵ = 30×3.829 = 114.86 > 赎回价 100 → 投资者选转换\nMV = 10×AF(9%,5) + 114.86×DF(9%,5) = 10×3.8897 + 114.86×0.6499 = 38.90 + 74.65 = **$113.65**","wrong":{"A":"115 = 忽略货币时间价值直接用 114.86。","C":"116.82 = 用错增长年数或折现率。","D":"120 = 严重口径错误。"},"point":"可转债价值 = max(赎回, 转换) 为终值，票息按期折现；用**税前**债务成本折现（投资者口径）。","trap":"股价增长到第 5 年末（复利 5 次）；post-tax 6% 是干扰项——市场价值永远用投资者要求回报率折现。"}},{"id":"J7Q08","topic":3,"n":8,"src":"J","tag":"Rights issue (value of rights)","type":"number","stem":"ZZ Co is planning a 1 for 3 rights issue. The value of rights has been calculated as $0.30 per existing share. ZZ Co's market price is currently $6.20 per share.\n\nWhat is the theoretical ex-rights price (TERP) per share? (The rights issue price per share is asked in the explanation.)","options":[],"answer":"5.9","answerRaw":"5.9","topicName":"Financing","explain":{"ans":"每旧股权利价值 0.30 → 每新股 = 0.30×3 = 0.90\nTERP = (3×6.20 + P)/4，且 TERP − P = 0.90\n→ 18.60 + P = 4P + 3.60 → P = 5.00，**TERP = $5.90**（配股价 = $5.00）","wrong":{"other":"常见错：① 忘了 rights value 要乘认购倍数；② 联立方程时把 (TERP−P)/3 与 (TERP−P) 混淆。"},"point":"TERP = 市值加权；权利价值在\"每股新股\"与\"每股旧股\"之间靠 1:3 换算。","trap":"从权利价值反推 TERP 需要解方程——先把两个口径的关系式写清楚。"}},{"id":"C3Q01","topic":3,"topicName":"Financing","n":1,"tag":"Operational Gearing","type":"single","stem":"The following are extracts from the statement of profit or loss of CQB Co: $'000 Sales income 60,000 Cost of sales 50,000 Profit before interest and tax 10,000 Interest 4,000 Profit before tax 6,000 Tax 4,500 Profit after tax 1,500 60% of the cost of sales is variable costs. What is the operational gearing of CQB Co?","options":["5.0 times","2.0 times","0.5 times","3.0 times"],"answer":"D","answerRaw":"第四项","explain":{"ans":"变动成本 = 50,000 × 60% = 30,000，contribution = 60,000 − 30,000 = 30,000。经营杠杆 = contribution / PBIT = 30,000/10,000 = **3.0 倍**。意思是：销售额变动 1%，PBIT 变动 3%。","wrong":{"A":"5.0 是把 contribution 除以利息或税前利润，分母用错。","B":"2.0 是用了 sales/PBIT（60,000/30,000 之类），把销售额当贡献。","C":"0.5 是把公式倒过来算了（PBIT/contribution）。"},"point":"经营杠杆 = contribution / PBIT，衡量经营风险。","trap":"COGS 里只有 60% 是变动成本，必须先拆出来；直接用 sales/COGS 会得错数。"}},{"id":"C3Q03","topic":3,"topicName":"Financing","n":3,"tag":"Cash and non-cash dividend","type":"single","stem":"Which of the following statements is correct?","options":["A bonus issue can be used to raise new equity finance.","A share repurchase scheme can increase both earnings per share and gearing.","Miller and Modigliani argued that the financing decision is more important than the dividend decision","Shareholders usually have the power to increase dividends at annual general meetings of a company"],"answer":"B","answerRaw":"第二项","explain":{"ans":"B 对：股票回购会减少在外股数 → EPS 上升；同时股东权益减少、债务占比相对上升 → gearing 上升。两个方向同时成立。","wrong":{"A":"红利股（bonus issue）是把留存收益转成股本，**不带来任何现金**，不能融资。","C":"M&M 认为**投资决策**才是决定公司价值的，股利政策无关；把「融资决策更重要」安到他们头上是错的。","D":"股东在股东大会上只能**批准或否决**董事会提议的股利，没有权力主动提高。"},"point":"回购 = 股数↓ + 权益↓ → EPS↑ + gearing↑。","trap":"bonus issue / rights issue / share repurchase 三者对现金流和 EPS 的影响经常被混着考。"}},{"id":"C3Q04","topic":3,"topicName":"Financing","n":4,"tag":"Market value of loan note","type":"single","stem":"A company has 7% loan notes in issue which are redeemable in seven years' time at a 5% premium to their nominal value of $100 per loan note. The before-tax cost of debt of the company is 9% and the after-tax cost of debt of the company is 6%.\nWhat is the current market value of each loan note?","options":["$92.67","$108.90","$89.93","$103.14"],"answer":"A","answerRaw":"第一项","explain":{"ans":"赎回价 = 100 × 1.05 = 105。MV = 7×AF(9%,7) + 105×DF(9%,7) = 7×5.033 + 105×0.547 = 35.23 + 57.44 = **$92.67**。注意用**税前** Kd（9%），因为算的是债券市值。","wrong":{"B":"$108.90 是用税后 6% 折现（利率低 → 现值高），算债券市值不能这样。","C":"$89.93 是把赎回价当成 100（忽略 5% 溢价）。","D":"$103.14 是票息用了税后、折现用税前，两套口径混搭。"},"point":"债券市值用**税前** Kd 折现；赎回价要含溢价。","trap":"题目同时给 before-tax 9% 和 after-tax 6%，就是让你选对折现率——市值用税前。"}},{"id":"C3Q05","topic":3,"topicName":"Financing","n":5,"tag":"Financial Ratio Measure","type":"single","stem":"The following information relates to a company: |Year|0|1|2|3| |---|---|---|---|---| |Earnings per share (cents)|30.0|31.8|33.9|35.7| |Dividends per share (cents)|13.0|13.2|13.3|15.0| |Share price at start of year ($)|1.95|1.98|2.01|2.25|\nWhich of the following statements is correct?","options":["The dividend payout ratio is greater than 40% in every year in the period.","Mean growth in dividends per share over the period is 4%","Total shareholder return for the third year is 26%","Mean growth in earnings per share over the period is 6% per year"],"answer":"D","answerRaw":"第四项","explain":{"ans":"EPS 从 30.0 涨到 35.7，三年：(35.7/30)^(1/3) − 1 = **5.97% ≈ 6%**，D 对。","wrong":{"A":"派息率 13/30=43.3%、13.2/31.8=41.5%、13.3/33.9=**39.2%**，第三年已经低于 40%，不是每年都大于。","B":"股利从 13 到 15，三年增长率 (15/13)^(1/3)−1 = 4.9%，不是 4%；而且中间还有 13.2、13.3，简单平均也会得 4.9% 左右。","C":"第三年 TSR = (2.25 − 2.01 + 0.15)/2.01 = 19.4%，不是 26%（26% 是用期初 1.95 或漏加股利算出来的）。"},"point":"多年平均增长率用几何平均：(末期/期初)^(1/n) − 1。","trap":"TSR 的分子是「期末价 − 期初价 + 当年股利」，三个部分都要有。"}},{"id":"C3Q06","topic":3,"topicName":"Financing","n":6,"tag":"Financial Ratio Measure","type":"single","stem":"Which of the following statements is NOT correct?","options":["Return on capital employed can be defined as profit before interest and tax divided by the sum of shareholders' funds and prior charge capital","Return on capital employed is the product of net profit margin and net asset turnover","Dividend yield can be defined as dividend per share divided by the ex-dividend share price","Return on equity can be defined as profit before interest and tax divided by shareholders' funds"],"answer":"D","answerRaw":"第四项","explain":{"ans":"D 错：ROE 的分子是**归属于普通股东的税后利润（PAT − 优先股股利）**，不是 PBIT。PBIT 是 ROCE 的分子。","wrong":{"A":"这是 ROCE 的标准定义，对。","B":"ROCE = 净利率 × 净资产周转率，杜邦分解，对。","C":"股利收益率 = 每股股利 / 除息股价，对。"},"point":"ROCE 用 PBIT；ROE 用 PAT（扣优先股股利）。","trap":"本题问的是 NOT correct，别看到 A 眼熟就选。"}},{"id":"C3Q07","topic":3,"topicName":"Financing","n":7,"tag":"Market value of loan note","type":"single","stem":"A company has in issue loan notes with a nominal value of $100 each. Interest on the loan notes is 6% per year, payable annually. The loan notes will be redeemed in eight years' time at a 5% premium to nominal value. The beforetax cost of debt of the company is 7% per year. What is the ex-interest market value of each loan note?","options":["$94.03","$96.94","$102.91","$103.10"],"answer":"B","answerRaw":"第二项","explain":{"ans":"赎回价 = 105。MV = 6×AF(7%,8) + 105×DF(7%,8) = 6×5.971 + 105×0.582 = 35.83 + 61.11 = **$96.94**。","wrong":{"A":"$94.03 是赎回价用 100（忽略溢价）算的。","C":"$102.91 是票息用了税后（6%×0.75 之类）或者折现率用了 5%。","D":"$103.10 是把 8 年当成 6 年、折现不足。"},"point":"不可赎回债券 MV = 票息×AF + 赎回价×DF，折现率用税前 Kd。","trap":"题目说 ex-interest，说明当前价不含应计利息，直接用标准公式即可，不用再调应计。"}},{"id":"C3Q08","topic":3,"topicName":"Financing","n":8,"tag":"Dividend yield","type":"number","stem":"ZZ Plc paid an interim dividend of $0.20 per ordinary share on 31st August 202X and declared a final dividend of $0.24 on 31st December 202X. The ordinary shares in ZZ Plc are trading at a cum-div price of $5.24. What is the dividend yield?(to one decimal place) %","options":[],"answer":"8.8%","answerRaw":"8.8%","explain":{"ans":"全年 DPS = 0.20（已付 interim）+ 0.24（declared final）= 0.44。cum-div 价 5.24，**减去尚未除息的 final 0.24** 得 ex-div = 5.00。股利收益率 = 0.44/5.00 = **8.8%**。","wrong":{"other":"典型错法：把 0.44 也从 5.24 里减掉（得 4.80，收益率 9.2%），或直接用 cum-div 价 5.24 当分母（8.4%）。"},"point":"除息价 = cum-div 价 − **尚未支付**的那笔股利，不是减全年股利。","trap":"interim 已经付过了，股票里不含它；只有 final 还挂在价格上。"}},{"id":"J8Q01","topic":4,"n":1,"src":"J","tag":"Cost of equity (DVM)","type":"single","stem":"The share price of ZZ plc is quoted at $12.40 and a dividend of 40 cents is about to be paid. The average dividend growth rate is 5% per year. Corporation tax rate is 30%.\n\nCalculate the cost of equity of ZZ plc.","options":["8.5%","5.95%","8.39%","5.87%"],"answer":"A","answerRaw":"第一项","topicName":"WACC","explain":{"ans":"除息价 = 12.40 − 0.40 = 12.00\nD₁ = 0.40×1.05 = 0.42\n**Ke = 0.42/12.00 + 0.05 = 3.5% + 5% = 8.5%**","wrong":{"B":"5.95% = 用含息价 12.40 做分母（0.42/12.40+5% = 8.4% 附近变体）。","C":"8.39% = 分子忘增长（0.40/12+5%）或含息口径变体。","D":"5.87% = 增长率口径错。"},"point":"DVM：Ke = D₁/P₀ + g；P₀ 用除息价。","trap":"\"about to be paid\"= 含息报价，先减股利；税率 30% 无关（股利不可抵税）。"}},{"id":"J8Q02","topic":4,"n":2,"src":"J","tag":"Beta and risk","type":"single","stem":"Which of the following statements is NOT correct?","options":["Unsystematic risk is measured by the Beta factor","We normally assume government bonds are risk free","Equity beta reflects both business risk and financial risk","Asset beta reflects business risk only"],"answer":"A","answerRaw":"第一项","topicName":"WACC","explain":{"ans":"A 错误。Beta 衡量的是**系统风险**（systematic）；非系统风险通过分散化消除，不需要（也无法用）beta 定价。","wrong":{"B":"国债违约风险极低，通常当无风险资产 ✓。","C":"Equity beta 含经营风险 + 财务风险 ✓。","D":"Asset beta 只反映经营风险 ✓。"},"point":"β → 系统风险；非系统风险 → 分散化。","trap":"这是 CAPM 一章的定义级考点，四个表述要能独立判断真假。"}},{"id":"J8Q04","topic":4,"n":4,"src":"J","tag":"Project-specific CAPM","type":"number","stem":"Shyma Co is a company that manufactures ships and has an equity beta of 1.6 and a debt equity ratio of 1:3. It is considering a new project to manufacture farm vehicles.\n\nTrant Co is a manufacturer of farm vehicles and has an asset beta of 1.1 and a debt equity ratio of 2:3. The risk-free rate of return is 5%, the market risk premium is 3% and the corporation tax rate is 40%.\n\nUsing CAPM, what would be the suitable cost of equity for Shyma to use in its appraisal of the farm machinery project (to one decimal place)?","options":[],"answer":"9.0%","answerRaw":"9.0%","topicName":"WACC","explain":{"ans":"新行业用 Trant 的 asset beta 1.1（同业经营风险），再按 Shyma 自身资本结构 re-gear（税 40%，D:E = 1:3）：\nβe = 1.1 × [3 + 1×(1−0.4)]/3 = 1.1 × 1.2 = 1.32\n**Ke = 5% + 1.32×3% = 8.96% ≈ 9.0%**","wrong":{"other":"常见错：① 直接用 Shyma 自身 equity beta 1.6（那是造船业务的风险！）；② re-gear 忘了 (1−t)；③ 用 Trant 的 D:E 2:3 去 re-gear。"},"point":"项目特定折现率三步：同业 equity beta → un-gear → 用自身结构 re-gear → 套 CAPM。","trap":"本题 Trant 给的已是 **asset** beta，直接 re-gear 即可；Shyma 的 1.6 是纯干扰项。"}},{"id":"J8Q05","topic":4,"n":5,"src":"J","tag":"M&M and firm value","type":"number","stem":"A company's total debt plus equity is equal to $740 million. The current WACC is 9.46%.\n\nIt now plans to raise debt finance to repurchase ordinary shares and to keep post-tax operating cash flow unchanged. The WACC will become 9.21% after restructuring.\n\nCalculate the change in the value of total debt and equity after restructuring ($m).","options":[],"answer":"20","answerRaw":"20","topicName":"WACC","explain":{"ans":"M&M（含税）：V = 税后经营现金流/WACC\n现金流 = 740×9.46% = 70.004（不变）\n新价值 = 70.004/9.21% = 760.1\n**变化 = 760.1 − 740 ≈ +$20m**","wrong":{"other":"常见错：① 用 WACC 差额直接乘 740（9.46−9.21 = 0.25%，740×0.25% = 1.85，错）；② 忘了现金流不变这个前提。"},"point":"债务融资回购股票 → WACC 下降 → 价值上升，幅度 = CF×(1/WACC₁ − 1/WACC₀)。","trap":"价值是现金流的 capitalized value，不是 740×ΔWACC。"}},{"id":"J8Q06","topic":4,"n":6,"src":"J","tag":"Risk-adjusted discount rate","type":"single","stem":"Leah Co is an all-equity financed company which wishes to appraise a project in a new area of business. Its existing equity beta is 1.2. The average equity beta for the new business area is 2.0, with an average debt/(debt plus equity) ratio of 25%. The risk-free rate of return is 5% and the market risk premium is 4%.\n\nIgnoring taxation and using the capital asset pricing model, what is the risk-adjusted cost of equity for the new project?","options":["8.6%","9.8%","11.0%","13.0%"],"answer":"C","answerRaw":"第三项","topicName":"WACC","explain":{"ans":"去杠杆（无税）：βa = 2.0×(1 − 25%) = 1.5\nLeah 全股权 → βe = βa = 1.5\n**Ke = 5% + 1.5×4% = 11.0%**","wrong":{"A":"8.6% = 用了自身 equity beta 1.2（旧业务风险）。","B":"9.8% = β 取 1.2 附近变体。","D":"13.0% = 直接用同业 equity beta 2.0。"},"point":"新业务风险 → 用同业 equity beta 去杠杆得 asset beta → 自身结构 re-gear（全股权时 βe = βa）。","trap":"Leah 自己的 1.2 是旧行业风险，必须弃用；忽略税收时 βa = βe×E/(D+E)。"}},{"id":"J8Q07","topic":4,"n":7,"src":"J","tag":"Dividend yield","type":"number","stem":"Geeh Co paid an interim dividend of $0.06 per ordinary share on 31 October 20X6 and declared a final dividend of $0.08 on 31 December 20X6. The ordinary shares in Geeh Co are trading at a cum-div price of $1.83.\n\nWhat is the dividend yield (to one decimal place of a percentage point)?","options":[],"answer":"8.0%","answerRaw":"8.0%","topicName":"WACC","explain":{"ans":"全年股利 = 0.06 + 0.08 = 0.14\n除息价 = 1.83 − 0.08（即将支付的末期股利）= 1.75\n**股息率 = 0.14/1.75 = 8.0%**","wrong":{"other":"常见错：① 用含息价 1.83 做分母（7.7%）；② 分子只算末期股利 0.08；③ 分子只算中期股利。"},"point":"Dividend yield = 全年每股股利/除息价。","trap":"分子是一整年的股利（interim + final）；分母剔除的只是\"即将支付\"的那笔。"}},{"id":"C4Q01","topic":4,"topicName":"WACC","n":1,"tag":"MV of O.S. share","type":"single","stem":"A company has just paid an ordinary share dividend of 32.0 cents and is expected to pay a dividend of 33.6 cents in one year's time. The company has a cost of equity of 13%. What is the market price of the company's shares to the nearest cent on an ex dividend basis?","options":["$3.20","$4.41","$2.59","$4.20"],"answer":"D","answerRaw":"第四项","explain":{"ans":"隐含增长率 g = (33.6 − 32.0)/32.0 = 5%。D1 = 33.6c。P0 = D1/(Ke − g) = 33.6/(0.13 − 0.05) = 33.6/0.08 = 420c = **$4.20**。","wrong":{"A":"$3.20 是只用了 D1/Ke（33.6/0.13 ≈ 258c）或把 32c 直接除以 0.10。","B":"$4.41 是用 D0=32 算 D1（32×1.05=33.6 后再乘一次 1.05），重复增长。","C":"$2.59 是把 g 从分母里加而不是减（0.13+0.05=0.18）。"},"point":"戈登增长模型 P0 = D1/(Ke − g)，D1 是**下一期**股利。","trap":"题目给「just paid」= D0，必须先乘 (1+g) 换成 D1；给「expected to pay in one year」= D1，直接用。"}},{"id":"C4Q02","topic":4,"topicName":"WACC","n":2,"tag":"MV Of Share Price","type":"single","stem":"SKV Co has paid the following dividends per share in recent years: |Year|2013|2012|2011|2010| |---|---|---|---|---| |Dividend (cents per share)|36.0|33.8|32.8|31.1| The dividend for 2013 has just been paid and SK
