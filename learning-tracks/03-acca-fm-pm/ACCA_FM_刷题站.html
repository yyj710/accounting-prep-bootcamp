nt and its benefits.","en":["**Foreign currency risk reduced** — group receivables and payables can be **netted off**.","**Bulk borrowing** — larger loans attract lower interest rates.","**Lower bank charges** — avoids holding cash surpluses and overdrafts in different local accounts at the same time.","**Smaller precautionary balance** — a central pool of funds needs less buffer cash."],"zh":"四条好处：轧差降外汇风险、大额借款利率低、手续费低、预防性现金少。缺点是地方失去自主权（loss of autonomy），答题时补上这句更完整。","keys":["netting","bulk borrowing","bank charges","precautionary"]},{"part":"Part C","topic":"营运资本管理","q":"Discuss how a short-term cash surplus should be invested.","en":["Short-term surplus = cash not needed now but needed again in the near future.","Three criteria: **increase profitability**, **no risk of capital loss**, **marketability (liquidity)**.","**Bank deposit** — safe but low return.","**Treasury bills** — slightly higher return, can be resold in the market by discounting.","**Shares** — marketable, but price moves fast; risk of significant capital loss, so not appropriate for short-term investment."],"zh":"三个标准是固定答案：收益性、本金安全、可变现。任何选项如果牺牲本金安全（比如买股票），就不适合短期资金。","keys":["profitability","no risk of capital loss","marketability","treasury bills"]},{"part":"Part C","topic":"营运资本管理","q":"Discuss how accounts receivable can be managed / improved.","en":["**Credit analysis** — assess new customers before granting credit: bank reference, trade reference, credit rating agency, trading history, debt levels, payment performance, personal visit. Purpose: reduce bad debt exposure.","**Credit control** — ensure terms are followed and accounts do not fall into arrears: regular review, **aged receivable analysis** (number of accounts in arrears, amounts, extent of overdue).","**Collection** — invoice on sale, send statements regularly, offer early settlement discount; if overdue use reminder letter, telephone call, personal visit, legal action.","Other options: factoring, invoice discounting, early settlement discount (考官通常只要三种方法)."],"zh":"三部曲就是「事前查、事中控、事后收」。答题时按 分析→控制→催收 的顺序写，每步给一个具体手段做例子，这就是 discuss 要的 evidence。","keys":["credit analysis","credit control","aged receivable analysis","collection","factoring"]},{"part":"Part C","topic":"营运资本管理","q":"Discuss how to reduce the risk associated with foreign accounts receivable.","en":["**Creditworthiness check** — same as for domestic receivables.","**Export credit insurance** — covers non-payment.","**Letter of credit** — confirmed by a bank, reducing non-payment risk.","**Negotiate with the bank** — require payment in advance / bill of exchange settled through the bank.","**Reduce the investment in foreign receivables** — discount the bill of exchange in the money market to get cash immediately."],"zh":"五个手段按「查信用 → 买保险 → 银行担保 → 预收 → 提前贴现」的顺序记，逻辑是从源头到变现。","keys":["export credit insurance","letter of credit","bill of exchange","discount"]},{"part":"Part C","topic":"营运资本管理","q":"Discuss the advantages and disadvantages of JIT.","en":["Advantages: better relationship with customers; lower holding costs; shorter manufacturing lead time; less scrap/rework/obsolescence; higher quality (produce only to demand); lower purchase prices.","Disadvantage: many more orders → higher ordering cost and dependence on supplier reliability."],"zh":"优点记「省成本、提质量、缩周期、降报废」，缺点只有一个：订货次数暴增，对供应商依赖变强。","keys":["holding costs","lead time","obsolescence","number of orders"]},{"part":"Part C","topic":"营运资本管理","q":"Discuss the advantages of using a factor.","en":["**Source of finance** — advance up to 80% of receivables, improving cash flow (but interest is charged).","**Management focus** — frees up management time for core activities.","**Expertise** — the factor brings specialist credit knowledge.","**Economies of scale** — the factor collects more cheaply than an in-house department.","**Economies of specialisation** — shorter average collection period and lower bad debts.","**Administrative savings** — no need for an internal credit control department.","**Bad debts removed** — only if the factoring is **without recourse**."],"zh":"八条可以合并成四组：融资、专注、专业、省钱。最后一定要补一句「只有无追索权才转移坏账」，这是区分有追索权/无追索权的得分点。","keys":["advance","expertise","economies of scale","without recourse"]},{"part":"Part C","topic":"营运资本管理","q":"Discuss the factors that affect a company's optimum cash level.","en":["**Forecast of future cash inflows and outflows** — more uncertainty needs a bigger buffer.","**The company's tolerance of risk** — risk-averse holds more cash.","**Efficiency of cash flow management** — better forecasting and control → less cash needed.","**Availability of liquid assets** — easy access to short-term investments reduces the need to hold cash.","**Borrowing capacity** — a strong bank facility acts as a substitute for cash."],"zh":"五条可以归成两类：内部（预测能力、管理效率、风险偏好）和外部（可变现资产、借款能力）。外部越强，越不需要囤现金。","keys":["forecast","risk tolerance","efficiency","liquid assets","borrowing capacity"]},{"part":"Part C","topic":"营运资本管理","q":"Discuss the factors that affect the level of investment in working capital.","en":["**Nature of the industry** — long production process → long operating cycle → large WIP → high WC. (Construction vs retail: retail buys on credit and sells for cash, so the cycle can even be negative.)","**Working capital policy / risk attitude of management** — conservative (long credit to customers, high inventory, pay suppliers promptly) needs large investment; aggressive (minimal credit, low inventory, delay payment) needs little.","**Seasonal factors** — peak season requires more inventory.","**Size of the business** — higher sales with an unchanged cycle means proportionally more WC.","**Operating cycle length** — the longer the cycle, the more cash is tied up.","**Efficiency of management** — poor credit control or no EOQ/JIT pushes receivables and inventory up."],"zh":"六个因素记成一句话：行业、政策、季节、规模、周期、管理效率。答题要「因素 + 一句因果 + 一个例子」，只列名词拿不到分。","keys":["nature of the industry","operating cycle","conservative","aggressive","seasonal"]},{"part":"Part C","topic":"营运资本管理","q":"Discuss the methods of easing a cash shortage.","en":["**Delay non-essential capital expenditure** — postpone projects that are not urgent.","**Negotiate a reduction in cash outflow** — longer payable days, reschedule loan repayments, reduce dividend payment.","**Sale and leaseback** — sell an asset and lease it back to release a large lump of cash.","**Accelerate cash inflows** — early settlement discount, factoring, invoice discounting, bill discounting."],"zh":"四招 = 少花、晚付、卖资产换钱、早收钱。答题按「流出端 / 流入端」两组写，结构最清楚。","keys":["delay capital expenditure","sale and leaseback","factoring","early settlement discount"]},{"part":"Part C","topic":"营运资本管理","q":"Discuss the objectives of working capital management.","en":["The twin objectives are **liquidity** and **profitability**, and they conflict.","Liquidity: hold enough current assets to be able to pay liabilities as they fall due.","Profitability: invest less in current assets, because every $1 tied up in CA has an **opportunity cost** — it could earn more in non-current assets.","Therefore management must strike a **balance** between risk (liquidity) and return (profitability)."],"zh":"就三个词：risk（流动性）、return（盈利性）、balance。答满分的诀窍是每条都补一句「因为占用资金有机会成本」或「因为到期付不出钱会违约」。","keys":["liquidity","profitability","opportunity cost","balance"]},{"part":"Part C","topic":"营运资本管理","q":"Discuss whether XX Co is overtrading (under-capitalisation). 【Part C 大题必考模板】","en":["**Definition**: overtrading = under-capitalisation — sales revenue grows rapidly but the investment in working capital does not grow with it.","**Signal 1 — rapid sales growth**: sales revenue of XX Co increased by x%, while sales income/net working capital rose from x to x times, showing WC has not kept pace.","**Signal 2 — long-term debt repaid and not replaced**: long-term debt fell from $x to $y.","**Signal 3 — increased reliance on short-term finance**: overdraft and payables up, current liabilities/current assets rising.","**Signal 4 — current assets growing faster than sales**: receivable days and inventory days lengthened.","**Signal 5 — deteriorating liquidity**: current ratio and quick ratio fell below the industry average.","**Solutions**: raise long-term capital (equity/long-term debt); slow the growth rate; improve WC management (JIT, tighter credit control); then expand once the financial position is secure."],"zh":"这是 Part C 出现频率最高的大题。写法固定：先定义 → 五个信号逐个「算数据 + 说含义」→ 给解决方案。每个信号都必须带数字，只说结论不给分。","keys":["overtrading","under-capitalisation","sales/net working capital","overdraft","long-term capital"]},{"part":"Part C","topic":"营运资本管理","q":"Discuss working capital funding policy and the three approaches.","en":["Current assets split into **permanent (PCA)** — core level that grows with sales — and **fluctuating (FCA)** — seasonal/unpredictable.","Short-term finance is **cheaper but riskier** (repayable on demand); long-term finance is **more expensive but safer** (repayable on maturity). This is a risk–return trade-off.","**Matching**: short-term finance for FCA, long-term finance for PCA + non-current assets.","**Conservative**: long-term finance even for some FCA (long-term finance > minimum WC requirement).","**Aggressive**: short-term finance used even for part of PCA (long-term finance < minimum WC requirement)."],"zh":"判断策略的口诀：拿长期融资额去比「营运资本的最低需求」。等于→匹配；大于→保守；小于→激进。","keys":["permanent current assets","fluctuating current assets","matching","conservative","aggressive"]},{"part":"Part C","topic":"营运资本管理","q":"Explain the three motives for holding cash.","en":["**Transactions motive** — cash to meet day-to-day expenses: payroll, paying suppliers.","**Precautionary motive** — a cushion against unplanned expenditure.","**Speculative motive** — cash kept ready to take advantage of investment opportunities."],"zh":"交易、预防、投机。三个词各配一个例子，一分就到手。","keys":["transactions motive","precautionary motive","speculative motive"]},{"part":"Part D","topic":"投资评估","q":"Compare the NPV and IRR methods (discuss their relative merits).","en":["**Similar**: both consider the time value of money; both consider the whole life; both are based on cash flow; for conventional cash flows they give the same accept/reject decision.","**Difference 1** — NPV is an **absolute** amount (the increase in shareholder wealth); IRR is a **relative** percentage and says nothing about size.","**Difference 2** — for mutually exclusive projects, IRR ranking can mislead; NPV always selects the one that adds most value.","**Difference 3** — non-conventional cash flows can produce **multiple IRRs**, making IRR unusable.","**Difference 4** — IRR's reinvestment assumption (at the IRR itself) is unrealistic; NPV assumes reinvestment at the cost of capital.","Conclusion: **NPV is superior**."],"zh":"考官要 discuss relative merits，就要成对写「NPV 怎样、IRR 怎样」，不能只列 NPV 的优点。最后一句一定给结论：NPV 更优。","keys":["absolute","relative","mutually exclusive","multiple IRR","reinvestment assumption"]},{"part":"Part D","topic":"投资评估","q":"Discuss how investment in working capital is incorporated into investment appraisal.","en":["**Start of project** — an initial investment in working capital is required, usually proportional to sales.","**During the project** — incremental working capital is needed as sales grow or prices inflate; it is a cash outflow in that year.","**End of project** — the whole working capital investment is **released/recovered** as a cash inflow (unless the question says otherwise)."],"zh":"三句话：期初投入、期中随销售追加、期末全额收回。期末回收这一笔最容易漏，漏了 NPV 就错。","keys":["initial investment","incremental","released"]},{"part":"Part D","topic":"投资评估","q":"Discuss how to maximise shareholder wealth when capital is rationed.","en":["With unlimited funds, accept all positive-NPV projects; with rationing you cannot simply rank by absolute NPV.","**Divisible projects** — calculate the **profitability index (PI = NPV/initial investment)**, rank by PI, allocate funds in that order until exhausted.","**Indivisible projects** — use trial and error to find the combination of projects with the highest total NPV within the budget.","**Multi-period rationing** — use linear programming (beyond the scope of FM)."],"zh":"可分割用 PI 排序，不可分割用试错组合。这个区分是必考点，答题时先问一句「项目可否分割」。","keys":["profitability index","divisible","indivisible","trial and error"]},{"part":"Part D","topic":"投资评估","q":"Discuss the advantages and disadvantages of the payback and ARR methods.","en":["**Payback — advantages**: simple measure of risk (longer payback = higher risk); uses cash flows, less open to manipulation than profit; emphasises early cash flow.","**Payback — disadvantages**: ignores the time value of money; no measure of return; ignores cash flows **after** the payback period; short-term bias; the cut-off is arbitrary.","**ARR — advantages**: simple to understand and calculate; considers the **whole life** of the project; gives some measure of return.","**ARR — disadvantages**: ignores the time value of money; based on subjective **accounting profit**; not an absolute measure; can drive dysfunctional decisions; cut-off is arbitrary."],"zh":"两条铁律：Payback 用现金流、忽略回收期之后；ARR 用利润、看全周期。两者共同缺点是都不考虑货币时间价值。","keys":["ignores cash flows after payback","time value of money","accounting profit","whole life"]},{"part":"Part D","topic":"投资评估","q":"Discuss the causes of capital rationing.","en":["**Hard capital rationing (external)** — imposed by lenders/markets: industry-wide shortage of funds; poor or no credit rating; restrictive loan covenants; gearing already too high; lack of security; depressed capital market (government crowding out).","**Soft capital rationing (internal)** — self-imposed by management: to control growth beyond management capability; to avoid diluting control via new equity; to avoid the fixed commitment of extra debt; to create an internal market so projects compete for funds."],"zh":"hard = 外部给不了钱；soft = 自己能借但不借。四条 soft 理由都是管理层的主动选择。","keys":["hard","soft","covenants","dilute control"]},{"part":"Part D","topic":"投资评估","q":"Discuss the limitations of the NPV evaluation process.","en":["**Inflation** is assumed constant but may change several times over the project life.","**Fixed costs** may increase once the investment is made.","**Working capital** is assumed to move in proportion with sales — it may not.","**Tax rate** may change (government policy).","**Inter-relationship between variables** — raising price may reduce volume.","**Technological change** may force replacement mid-project.","**Project life** estimate may be too long or too short."],"zh":"七条可以记成「假设太理想」：通胀恒定、成本不变、税率不变、变量独立、技术不变、寿命估得准。答题时挑 4 条展开就够。","keys":["inflation","fixed costs","working capital","tax rate","project life"]},{"part":"Part D","topic":"投资评估","q":"Discuss the nominal and real approaches to calculating NPV.","en":["**Nominal approach** — inflate each cash flow by its **specific** inflation rate to get nominal cash flows, then discount at the **nominal** cost of capital.","**Real approach** — use today's-price (real) cash flows and discount at the **real** cost of capital, obtained from the Fisher effect: (1+m) = (1+r)(1+i).","Both give the **same NPV** provided the rules are applied consistently.","Practical rule: with **one** inflation rate either works; with **different** inflation rates for revenues and costs, use the nominal approach."],"zh":"名义配名义、实际配实际，绝不能混。多种通胀率并存时必须走名义法。","keys":["nominal cash flow","real cost of capital","Fisher effect","consistent"]},{"part":"Part D","topic":"投资评估","q":"Discuss the use of sensitivity analysis as a way of evaluating project risk.","en":["All project cash flows are estimates, so risk exists; sensitivity analysis shows how far a key variable can move before NPV falls to zero.","Purpose: identify the **most sensitive variable** so management can focus monitoring and control on it.","It also indicates the **robustness** of the project.","**Limitations**: gives no decision rule; ignores the interaction between variables; does not assess the **probability** that the change will occur; assumes the change persists for the whole project life."],"zh":"三个用途（找敏感变量、评估稳健性）+ 四个局限（无决策规则、忽略交互、无概率、假设变动持续）。四个局限几乎每年都考。","keys":["most sensitive variable","robustness","no decision rule","probability","interaction"]},{"part":"Part D","topic":"投资评估","q":"Discuss ways to encourage managers to achieve stakeholder objectives.","en":["**Agency problem** — managers may pursue short-term profit or personal benefit rather than long-term shareholder wealth.","**Share option schemes** — link reward to share price, encouraging long-term value creation rather than short-term profit.","**Performance-related pay** — part of remuneration conditional on targets such as EPS growth (but poorly designed targets can encourage dysfunctional behaviour).","**Regulation and governance** — corporate governance codes and listing rules impose monitoring and disclosure."],"zh":"三类手段：给股权（长期绑定）、给绩效工资（短期指标）、加监管（外部约束）。答完补一句「指标设计不当会诱发短期化」，显得有批判性。","keys":["agency problem","share option","performance-related pay","corporate governance"]},{"part":"Part D","topic":"投资评估","q":"Explain risk and uncertainty, and the methods of incorporating risk into investment appraisal.","en":["**Risk** — several possible outcomes, probabilities can be attached from past experience; can be quantified; increases with the variability of returns.","**Uncertainty** — possible outcomes exist but probabilities cannot be assigned; cannot be quantified; increases with project life.","**Sensitivity analysis** — how far a variable can change before NPV = 0; finds the most sensitive variable.","**Scenario analysis** — a few consistent sets of assumptions (optimistic/pessimistic).","**Simulation (Monte Carlo)** — assign probability distributions and use random numbers to generate a distribution of NPVs and its standard deviation.","**Probability analysis** — expected NPV and the probability of a negative NPV.","**Certainty equivalent** — convert risky cash flows into risk-free equivalents and discount at the **risk-free rate**.","**Risk-adjusted discount rate** — use a project-specific cost of capital (from CAPM)."],"zh":"先分清 risk（能给概率）和 uncertainty（给不了），再列方法。每个方法配一句「它解决什么、缺什么」。","keys":["risk","uncertainty","sensitivity analysis","simulation","certainty equivalent"]},{"part":"Part D","topic":"投资评估","q":"Explain why DCF methods are superior to non-DCF methods.","en":["**Time value of money** — DCF discounts; payback and ARR do not.","**Cash flow vs profit** — NPV/IRR use cash flow, which is objective and hard to manipulate; ARR uses accounting profit, which is subjective and affected by accounting policy.","**Whole life** — DCF considers all cash flows; payback ignores everything after the cut-off.","**Decision rule** — NPV gives a clear absolute measure of the increase in shareholder wealth; payback and ARR have arbitrary cut-offs.","**Consistency with the objective** — NPV is directly linked to maximising shareholder wealth."],"zh":"四条：时间价值、现金流优于利润、看全周期、有明确决策规则。最后落到「NPV 直接对应股东财富最大化」。","keys":["time value of money","cash flow","whole life","shareholder wealth"]},{"part":"Part D","topic":"投资评估","q":"How should assets with different lives be compared?","en":["Comparing the **PV of costs** of assets with different lives is wrong — it is not like-for-like.","Use **EAC (equivalent annual cost) = PV of costs / annuity factor** (or EAB for benefits).","Choose the asset with the **lower EAC** (or higher EAB).","The logic: EAC converts the whole-life cost into an equivalent annual charge, so different lives become comparable."],"zh":"一句话：寿命不同不能比总额，先摊成「每年等额成本」再比。EAC 低者优。","keys":["equivalent annual cost","annuity factor","lower EAC"]},{"part":"Part D","topic":"投资评估","q":"If a project has multiple IRRs, how can the problem be overcome?","en":["Multiple IRRs arise when cash flows are **non-conventional** — the sign changes more than once (e.g. mining: outflow at year 0, inflows years 1–20, decommissioning outflow at year 21).","In that case IRR is meaningless; use **NPV** instead, and evaluate at the company's cost of capital."],"zh":"符号变几次就可能有几个 IRR。答案永远是「改用 NPV」，并说明原因（IRR 不再唯一）。","keys":["non-conventional cash flow","sign changes","use NPV"]},{"part":"Part E","topic":"融资","q":"Discuss Islamic finance instruments.","en":["**Mudaraba** — one party provides capital, the other provides skill; profits shared in a pre-agreed ratio; the capital provider bears losses up to the capital contributed; the manager gets no salary. Similar to equity finance.","**Musharaka** — both parties contribute capital and skill (not necessarily equally); profits shared by agreement, losses shared in proportion to capital. Similar to venture capital.","**Murababa** — the bank buys the asset and resells it to the customer at a mark-up, paid in instalments. Similar to a secured loan.","**Ijara** — the bank buys the asset and leases it to the customer. Similar to leasing.","**Sukuk** — certificates backed by tangible assets, paying a share of the income those assets generate. Similar to bonds but asset-linked.","**Key prohibitions**: no interest (riba), no excessive uncertainty (gharar), no gambling, no prohibited activities."],"zh":"五个工具对应五种常规融资：Mudaraba→股权、Musharaka→风投、Murababa→抵押贷款、Ijara→租赁、Sukuk→债券。答题时用「对应关系」写，考官一眼看到你懂结构。","keys":["Mudaraba","Musharaka","Murababa","Ijara","Sukuk","riba"]},{"part":"Part E","topic":"融资","q":"Discuss the advantages and disadvantages of convertible loan notes.","en":["**Lower interest** — investors accept a lower coupon because they gain the option of a capital gain on conversion.","**Tax deductible** — interest is deductible, whereas dividends on new equity are not.","**Fewer covenants** — it is a hybrid, not pure debt, so lenders impose fewer restrictions.","**Self-liquidation** — on conversion the debt disappears without any cash repayment.","**Borrowing capacity preserved** — conversion reduces gearing, freeing capacity for future debt.","**Attractive to investors** — they hold the option to convert or not, so downside is protected by the floor value."],"zh":"六条好处全部围绕「利息低、税盾、约束少、不用还本、降杠杆、投资者喜欢」。缺点是股价不涨时投资者不转股，公司仍要还本。","keys":["lower interest","tax deductible","self-liquidation","gearing"]},{"part":"Part E","topic":"融资","q":"Discuss the advantages of leasing relative to borrowing to buy.","en":["**Flexibility** — the lease period can be shorter than the asset's useful life.","**Obsolescence risk transferred** — important where technology changes quickly.","**No loan arrangement** — avoids restrictive borrowing covenants.","**Residual value risk transferred** — the lessor bears the disposal risk.","**Maintenance** — major maintenance is usually the lessor's responsibility.","**Cost** — the lessor buys in bulk and may pass on part of the discount, making leasing cheaper."],"zh":"六条都是「把风险转移给出租人」的不同侧面：过时风险、残值风险、维修责任。答题时先给这个总纲，再分条。","keys":["flexibility","obsolescence","residual value","maintenance"]},{"part":"Part E","topic":"融资","q":"Discuss the dangers of a high level of gearing.","en":["**Greater volatility of earnings** — interest must be paid whatever the profit, so returns to shareholders become more volatile (financial risk).","**Higher cost of equity** — shareholders require a higher return for the increased financial risk (equity beta > asset beta).","**Reduced debt capacity / credibility** — falling share price makes further borrowing harder and more expensive.","**Short-termism** — management focuses on generating cash to service debt rather than on long-term shareholder wealth.","**Covenant pressure** — restrictions may force dividend cuts or limit investment."],"zh":"五条按「利润波动 → 股权成本上升 → 融资能力下降 → 行为短期化 → 契约受限」的链条记，是一条因果链而不是五个孤立点。","keys":["volatility","cost of equity","debt capacity","short-termism","covenants"]},{"part":"Part E","topic":"融资","q":"Discuss the factors affecting the market value of a traded bond.","en":["**Term to maturity** — longer term means more coupons but the redemption is discounted more heavily.","**Coupon rate** — higher coupon, higher market value.","**Required return of investors** — higher required return, lower market value (inverse relationship).","**Perceived risk of the company** — higher risk raises the required return.","**Frequency of interest payment** — more frequent payments raise the value slightly.","**Redemption amount** — a premium on redemption raises the value.","**Convertibility** — conversion value can lift the value above the pure bond floor."],"zh":"本质就是「债券现值 = 票息年金 + 本金折现」，所以凡是让分子变大或分母变小的因素，都会提高市值。","keys":["term to maturity","coupon","required return","redemption premium","convertible"]},{"part":"Part E","topic":"融资","q":"Discuss the factors considered by a company and by a lender when choosing debt finance.","en":["**Company side — cost**: interest plus issue costs, repayment terms, early repayment penalties.","**Company side — maturity**: match the life of the debt to the life of the asset and to the ability to repay.","**Company side — financial risk**: debt raises gearing; consider how gearing evolves over the loan's life.","**Company side — availability**: depends on company size, relationship with banks, existing security.","**Lender side — creditworthiness**: cash flow, existing gearing, interest cover, asset security.","**Lender side — covenants and term**: protection for the lender, priced into the interest rate."],"zh":"这题的关键是**分两栏写**：公司关心成本/期限/风险/可得性；贷款方关心还款能力/抵押/契约。混在一起写会丢分。","keys":["cost","maturity","financial risk","availability","creditworthiness"]},{"part":"Part E","topic":"融资","q":"Discuss the factors to consider when deciding dividend policy.","en":["**Profit for the year** — dividends are paid out of distributable profit.","**Liquidity** — dividends are paid in cash, so cash availability matters more than profit.","**Legal restrictions** — bond covenants may cap distributions.","**Financial risk** — retaining more reduces gearing.","**Signalling effect** — a dividend cut signals bad news to the market.","**Cost of capital** — retained earnings are the cheapest source, so paying out more raises WACC.","**Tax** — the tax position of shareholders may favour retention or distribution.","**Investment needs** — positive-NPV projects should be funded before dividends."],"zh":"八个因素记成四对：利润与现金、法律与风险、信号与资本成本、税与投资需求。答题挑 5 条展开即可。","keys":["liquidity","covenants","signalling","retained earnings","investment needs"]},{"part":"Part E","topic":"融资","q":"Discuss the factors to consider when using a rights issue.","en":["**Advantages**: issue costs lower than a fresh public issue; no dilution of control if all shareholders take up their rights; reduces gearing and financial risk.","**Disadvantages**: difficult to set the rights issue price; if some shareholders sell their rights, control may be diluted; only suitable for relatively large fundraisings."],"zh":"好处记「便宜、不稀释、降杠杆」；坏处记「定价难、有人卖权利就稀释、金额小不划算」。","keys":["issue costs","dilution","gearing","pricing"]},{"part":"Part E","topic":"融资","q":"Discuss the impact of fintech on finance.","en":["**On financial institutions** — challenger banks offer more competitive, flexible products; multi-currency accounts; hedging via apps; greater visibility of payment status in supply chain finance.","**On financial markets** — new electronic platforms increase the availability of finance: crowdfunding, peer-to-peer lending, security token offerings.","**Disintermediation** — companies can access a global pool of investors without a traditional intermediary.","**Crowdfunding** — small amounts from many investors, fast, but limited amounts and disclosure requirements.","**STO** — blockchain-based tokens; lighter regulation than a full listing, which makes it attractive to fundraisers."],"zh":"答 fintech 题抓两个方向：对机构（挑战者银行、更便宜更快）和对市场（去中介化、新平台）。再举个具体工具（众筹、P2P、STO）就有分。","keys":["challenger banks","disintermediation","crowdfunding","security token offering"]},{"part":"Part E","topic":"融资","q":"Discuss the interrelationship between investment, financing and dividend decisions.","en":["**Investment → financing**: a large programme of positive-NPV projects must be financed, so the financing decision follows the investment decision.","**Financing → dividend**: if external finance is unavailable or expensive, dividends must be cut to release retained earnings.","**Dividend → investment**: paying high dividends leaves less retained earnings, so future projects may be postponed.","**Financing → dividend → investment** forms a loop: each decision constrains the other two, and all three ultimately serve shareholder wealth maximisation."],"zh":"三个决策互为约束，写的时候要成对描述「一个变了，另一个被迫怎么变」。这是 Part E 的综合题，最容易考成 10 分论述。","keys":["positive-NPV projects","retained earnings","postpone","shareholder wealth"]},{"part":"Part E","topic":"融资","q":"Discuss whether changing dividend policy affects a company's share price.","en":["**M&M irrelevance** — in a perfect capital market, value depends on **investment decisions** only; dividend policy does not change share price.","Shareholders are indifferent between dividend income and capital gains — if they want cash they can sell shares; with no transaction costs this is costless.","**Counter-arguments (relevance)**: the **bird-in-hand** view (certain dividend preferred to uncertain capital gain); **signalling** (dividend changes convey management's view of future prospects); **clientele effect** (different investor groups prefer different payout policies); **agency** (dividends reduce free cash flow available to managers).","**Tax** — if dividends are taxed more heavily than capital gains, investors may prefer retention."],"zh":"这是标准「正反两面」题：先讲 M&M 无关（完美市场假设），再逐条打破假设（在手之鸟、信号、客户群、代理、税），最后落到「现实中股利政策确实影响股价」。","keys":["irrelevance","perfect capital market","bird-in-hand","signalling","clientele effect"]},{"part":"Part E","topic":"融资","q":"Explain the key features of a rights issue.","en":["**Pre-emptive right** — existing shareholders are offered the new shares first, preserving the balance of ownership and control.","**Issue price** — set at a **discount** to the cum-rights price to make the offer attractive.","**TERP** — the theoretical ex-rights price, a weighted average of the cum-rights price and the issue price: TERP = (N × cum price + issue price)/(N + 1).","**Value of the right** = TERP − issue price (per new share); per existing share = (TERP − issue price)/N.","**Neutral for shareholders** — the fall in share price is exactly offset by the value of the rights."],"zh":"五个特征：优先认购、折价发行、TERP、权利价值、对股东中性。TERP 的计算是必考，公式记住 (N×原价+1×发行价)/(N+1)。","keys":["pre-emptive right","discount","TERP","value of the right","neutral"]},{"part":"Part E","topic":"融资","q":"Explain the link between the cost of each source of finance and the creditor hierarchy.","en":["**Creditor hierarchy (on liquidation, highest priority first)**: secured creditors → unsecured creditors → preference shareholders → ordinary shareholders.","The lower the priority, the greater the risk of receiving nothing.","Providers require a return that compensates for that risk: **Kd < Kp < Ke**.","This explains why debt is the cheapest source and equity the most expensive."],"zh":"一条因果链：受偿顺序 → 风险高低 → 要求回报 → 资本成本排序。答题时把这条链完整写出来，比只写 Kd<Kp<Ke 得分高。","keys":["secured creditors","unsecured","preference","Kd < Kp < Ke"]},{"part":"Part E","topic":"融资","q":"Why is it difficult for SMEs to raise finance?","en":["**Funding gap** — existing owners/investors have reached the limit of their capacity, and as an unquoted company it cannot raise equity from the public.","**Maturity gap** — SMEs struggle to obtain medium/long-term debt, so they rely on short-term finance and suffer a mismatch.","**Information asymmetry** — no track record, no audited accounts, lenders cannot assess risk.","**Lack of security** — few tangible assets to pledge.","**Higher relative cost** — fixed costs of issuing and monitoring fall disproportionately on small amounts.","**Sources available**: owners' savings, friends and family, retained earnings, venture capital, business angels, bank debt, factoring, sale and leaseback, supply chain finance, crowdfunding, P2P, government schemes (AIM, EIS, VCT, tax incentives)."],"zh":"两道缺口是核心词：funding gap（拿不到钱）、maturity gap（拿不到长期钱）。答完补一句「所以 SME 更依赖短期融资，抗风险能力弱」。","keys":["funding gap","maturity gap","information asymmetry","security","crowdfunding"]},{"part":"Part E-WACC","topic":"WACC","q":"CAPM or DVM — which is better for calculating a project-specific discount rate?","en":["**DVM weaknesses**: assumes a constant growth rate in perpetuity (unrealistic); estimating g is difficult and based on the past; assumes business risk is constant, so Ke would change if risk changes; a share price fall may reflect higher Ke rather than lower dividends.","**CAPM strengths**: explicitly prices **systematic risk** through beta; allows a project-specific rate for a new industry by using a proxy company's asset beta; does not depend on dividend policy.","**CAPM weaknesses**: beta estimation is subjective; the market risk premium is an estimate; assumes a well-diversified investor and a perfect market.","Conclusion: for a **new industry (different business risk)**, CAPM is preferred; DVM is only appropriate for the existing business with stable dividend growth."],"zh":"结论要落到「什么场景用哪个」：同行业稳定增长用 DVM，跨行业必须用 CAPM。只列优缺点不给结论会丢分。","keys":["constant growth","systematic risk","beta","proxy company","market risk premium"]},{"part":"Part E-WACC","topic":"WACC","q":"Discuss the relationship between WACC, capital structure and corporate value.","en":["**Traditional view** — as gearing rises, Kd is initially cheap, so WACC falls; beyond a point Ke rises faster than the benefit of cheap debt, so WACC rises. There is an optimal capital structure that minimises WACC and maximises value.","**M&M without tax** — WACC is constant regardless of gearing; capital structure does not affect value.","**M&M with tax** — debt interest is tax deductible, so more debt lowers WACC and raises value; the theoretical optimum is 100% debt.","**Practical constraints** — bankruptcy costs, agency costs and loss of financial flexibility offset the tax benefit, which is why companies do not borrow to the maximum."],"zh":"三种观点画三条 WACC 曲线：传统是 U 型、M&M 无税是水平线、M&M 含税是下降直线。答题时先画这句「形状」，再解释原因。","keys":["traditional view","M&M without tax","tax shield","optimal capital structure"]},{"part":"Part E-WACC","topic":"WACC","q":"Explain systematic risk, business risk and financial risk, and how each is measured.","en":["**Business risk** — variability of shareholder returns caused by the nature of operations (industry, cost structure). Measured by **operating gearing = contribution/PBIT**, or fixed costs/total costs.","**Financial risk** — additional variability of returns to shareholders caused by **fixed interest commitments** (gearing). Measured by gearing ratios and interest cover.","**Systematic (market) risk** — the part of total risk that cannot be diversified away, because it arises from economy-wide factors. Measured by **beta**.","**Unsystematic risk** — company-specific, can be eliminated by diversification; not rewarded with a premium.","**Asset beta** reflects business risk only; **equity beta** reflects business risk + financial risk."],"zh":"四种风险对应四种衡量：business→operating gearing；financial→gearing/interest cover；systematic→beta；unsystematic→可分散、无溢价。这张对照表背熟。","keys":["business risk","financial risk","systematic risk","beta","operating gearing"]},{"part":"Part E-WACC","topic":"WACC","q":"Explain the relationship between WACC and the marginal cost of capital.","en":["**WACC** reflects the cost of capital from **historic** financing decisions.","**Marginal cost of capital (MC)** is the cost of the **next increment** of capital raised.","If MC < WACC, raising new funds pulls the average cost **down**.","If MC > WACC, the average cost is pulled **up**, but at a slower rate than MC itself is rising.","Implication: investment should continue while the project return exceeds the **marginal** cost, not the historic WACC."],"zh":"WACC 是「平均历史成本」，MC 是「下一块钱的成本」。投资决策应该看 MC，这是这题的落点。","keys":["historic","next increment","marginal cost"]},{"part":"Part E-WACC","topic":"WACC","q":"When can the current WACC be used as the discount rate, and how can its limitations be overcome?","en":["WACC is the average return required by investors given the company's **current business risk and financial risk**.","It can be used only if the new project has the **same business risk** (same industry, similar scale) and the **same financial risk** (gearing unchanged).","If business risk changes, de-gear a proxy company's equity beta to get the asset beta, then re-gear at the company's own gearing to obtain a project-specific Ke.","If financial risk changes, re-gear the asset beta at the new gearing level.","Limitation: WACC is a **marginal** concept — it applies to projects of average risk, not to every project."],"zh":"两个条件：经营风险不变 + 财务风险不变。只要有一个变，就要用 CAPM 重算项目专属折现率。","keys":["same business risk","same financial risk","proxy company","de-gear","re-gear"]},{"part":"Part E-WACC","topic":"WACC","q":"When should CAPM be used to adjust the discount rate, and what are its limitations?","en":["Use CAPM when the project's **business risk differs** from the company's existing business (diversifying into a new industry) but **financial risk is unchanged**.","Steps: find a proxy company in the new industry → **de-gear** its equity beta to an asset beta (remove its financial risk) → **re-gear** at the company's own gearing → plug into CAPM: Ke = Rf + β(E(rm) − Rf).","Limitations: difficulty finding a genuine proxy; betas are estimated from historical data; the market risk premium is an assumption; the model assumes diversified investors and ignores unsystematic risk."],"zh":"三步走：找代理公司 → ungear 得 asset beta → regear 得项目 Ke。顺序不能反，且 regear 要用**本公司**的 gearing。","keys":["proxy company","asset beta","re-gear","CAPM"]},{"part":"Part E-WACC","topic":"WACC","q":"Why should market values rather than book values be used when calculating WACC?","en":["Weights matter: WACC is a weighted average of Ke and Kd, so the weights must reflect the actual proportions of value.","The **market value of equity** is usually far above its book value, so book-value weights understate the weight of (expensive) equity.","Because equity is more expensive than debt, a book-value WACC is **lower** than a market-value WACC.","A WACC that is too low **overstates NPV**, so the company may accept projects that should be rejected — a suboptimal decision."],"zh":"一条因果链：账面权重 → 低估权益比重 → WACC 偏低 → NPV 虚高 → 接受不该接的项目。四级推理写全才拿满分。","keys":["weights","market value of equity","understate","overstate NPV"]},{"part":"Part F","topic":"企业估值","q":"Discuss behavioural finance.","en":["Behavioural finance argues investors are **not** fully rational, so markets may not be efficient.","**Overconfidence** — investors overestimate their ability, leading to excessive trading.","**Herding** — following the crowd rather than fundamentals, creating bubbles.","**Anchoring** — fixating on an initial reference price.","**Loss aversion / prospect theory** — losses hurt more than equivalent gains, causing investors to hold losing positions too long.","**Noise trading** — trading on irrelevant information.","Implication: prices may deviate from fundamental value, creating arbitrage opportunities — but limits to arbitrage allow mispricing to persist."],"zh":"五个偏差记成「过度自信、羊群、锚定、损失厌恶、噪音交易」。答题最后补一句「这构成对 EMH 的挑战」，把两部分知识串起来。","keys":["overconfidence","herding","anchoring","loss aversion","noise trading"]},{"part":"Part F","topic":"企业估值","q":"Discuss the limitations of the DVM and the P/E ratio when valuing a company.","en":["**DVM limitations**: assumes a constant growth rate in perpetuity; g is hard to estimate and past trends may not repeat; assumes business risk and Ke are constant; meaningless if g > Ke; a perpetuity assumption is unrealistic for most companies; assumes rational investors; unusable if the company pays no dividend.","**DVM advantage**: appropriate for valuing a **non-controlling interest** — it captures the value of the dividends that minority shareholders actually receive.","**P/E limitations**: the P/E of a listed proxy may not reflect the subject company's risk or growth; earnings can be manipulated; a quoted P/E already includes growth expectations that may not apply.","**P/E advantage**: simple, quick, and widely used for listed company comparisons."],"zh":"DVM 的命门是「永续稳定增长」这一条假设，P/E 的命门是「用别人的倍数套自己的公司」。答题时各给 3 条就够。","keys":["constant growth","perpetuity","proxy P/E","non-controlling interest"]},{"part":"Part F","topic":"企业估值","q":"Explain the efficient market hypothesis and its three forms.","en":["**Market efficiency** — the speed and accuracy with which prices reflect relevant information.","**Weak form** — prices fully reflect all **past** information; price changes are random (random walk); technical analysis cannot earn abnormal returns.","**Semi-strong form** — prices fully reflect all **public** information; fundamental analysis cannot earn abnormal returns; prices react immediately to announcements.","**Strong form** — prices reflect **all** information including private/inside information; even insider dealing cannot earn abnormal returns.","**Implications**: weak → technical analysis useless; semi-strong → fundamental analysis useless but insider dealing still profitable (hence regulation); strong → no need to regulate insider dealing."],"zh":"三种形态按「信息范围」排：历史 → 公开 → 全部。每种形态对应「什么分析没用」，这是拿分点。","keys":["weak form","semi-strong","strong form","random walk","abnormal return"]},{"part":"Part F","topic":"企业估值","q":"Explain the market paradox.","en":["For markets to be efficient, investors must **believe** markets are inefficient.","If everyone believed markets were perfectly efficient, nobody would trade actively, and prices would stop reacting to new information — which would make the market inefficient.","So active trading based on perceived mispricing is precisely what keeps prices efficient."],"zh":"一句话悖论：市场有效的前提是有人认为它无效。答题写「如果所有人都相信有效 → 没人交易 → 价格不再反映信息 → 反而不有效」。","keys":["believe inefficient","no trading","prices stop reacting"]},{"part":"Part G","topic":"风险管理","q":"Discuss how exchange rates can be forecast and the limitations of PPP.","en":["**Balance of payments** — the rate is primarily determined by supply and demand in the forex market (exports/imports).","**PPP (purchasing power parity)** — based on the law of one price: identical goods should cost the same everywhere; the country with **higher inflation** sees its currency **depreciate**.","**PPP formula**: future spot = current spot × (1 + inflation of foreign)/(1 + inflation of home).","**IRP**: forward rate = spot × (1 + interest of foreign)/(1 + interest of home).","**International Fisher Effect** — the interest rate differential is an unbiased predictor of the future spot rate.","**PPP limitations**: inflation forecasts are only estimates; the theory holds in the long run, not the short run; speculation (about 98% of forex transactions) dominates trade flows; governments intervene in the market."],"zh":"四个理论一句话分清：PPP 用通胀预测即期，IRP 用利率算远期，IFE 用利差预测即期，四向等价把四者串起来。PPP 的局限背三条就够。","keys":["law of one price","PPP","IRP","international Fisher effect","speculation"]},{"part":"Part G","topic":"风险管理","q":"Discuss the causes of interest rate movements and the shape of the yield curve.","en":["**Expectation theory** — the yield curve reflects expectations of **future interest rates**; an expected fall in rates produces a downward-sloping (inverted) curve.","**Liquidity preference theory** — the longer the maturity, the greater the risk (default, price volatility), so investors demand a **term premium**; the normal curve slopes upward.","**Market segmentation theory** — supply and demand differ between the short and long ends of the market; this explains **kinks (discontinuities)** in the curve.","**Government policy** — keeping short-term rates high to control inflation can invert the curve.","**General level of rates** is set by: compensation for risk, duration of the loan, government policy, need for liquidity, and the demand/supply of funds."],"zh":"三个理论各管一件事：预期理论管「方向」，流动性偏好管「为什么向上」，市场分割管「为什么有折点」。这三句配好，答题就不会乱。","keys":["expectation theory","liquidity preference","market segmentation","term premium","kink"]},{"part":"Part G","topic":"风险管理","q":"Discuss the methods of hedging interest rate risk.","en":["**Internal — matching**: assets and liabilities on the same interest rate basis.","**Internal — smoothing**: keep a balance between fixed-rate and floating-rate debt.","**Internal — asset and liability management**: match the duration of assets and liabilities.","**FRA**: OTC, locks in a target rate, tailor-made, short-term (1 month–2 years), hedges both favourable and adverse moves, **must be performed** (cannot lapse) and cannot be traded.","**FRA option**: same as an FRA but the buyer can take advantage of favourable moves and abandon the contract if adverse; a premium is payable up front.","**Interest rate futures**: exchange-traded, standardised contract size, initial margin, marked to market daily.","**Interest rate options (cap/floor/collar)**: cap protects a borrower against rising rates; floor protects a depositor against falling rates; a collar is buy floor + sell cap (cheaper but gives up some upside)."],"zh":"内部三法（匹配/平滑/资产负债管理）+ 外部四工具（FRA、FRA 期权、期货、期权）。每个工具记三件事：谁用、锁什么、缺点是什么。","keys":["matching","smoothing","FRA","cap","floor","collar"]},{"part":"Part G","topic":"风险管理","q":"Discuss the methods of hedging transaction risk.","en":["**Invoice in home currency** — transfers the risk to the counterparty, but may lose the customer; only feasible with market power.","**Leading and lagging** — pay early or late depending on the expected currency movement.","**Matching** — offset receipts and payments in the same currency at the same time.","**Netting** — offset intercompany receivables and payables within a group.","**Forward contract** — locks in a rate for a specific future date; OTC, flexible in amount.","**Money market hedge** — borrow/deposit in the appropriate currency to create a matched position now.","**Currency futures / options** — exchange-traded, standardised (options give the right but not the obligation, with a premium).","**Currency swap** — medium to long-term, low transaction cost, arranged by a bank, can exchange both interest and principal."],"zh":"先写内部三招（币种、提前/延后、轧差），再写外部四工具（远期、货币市场、期货期权、互换）。内部方法成本低但有商业代价，外部方法成本高但确定性强。","keys":["forward","money market hedge","netting","leading and lagging","currency swap"]},{"part":"Part G","topic":"风险管理","q":"Distinguish the types of foreign currency risk.","en":["**Transaction risk** — arises between the transaction date and the settlement date on imports/exports; affects **short-term cash flow**; can be hedged.","**Translation risk** — arises when consolidating foreign subsidiaries' accounts; a **paper** exercise, no actual cash conversion; can be reduced by matching assets and liabilities in the same currency.","**Economic risk** — the effect of exchange rate changes on a company's **international competitiveness**; affects long-term cash flow; difficult to quantify; can be diversified internationally but **cannot be eliminated**."],"zh":"三种风险按「时间长度」排：transaction（短期现金流）、translation（报表折算）、economic（长期竞争力）。能对冲的只有前两个。","keys":["transaction risk","translation risk","economic risk","competitiveness"]}],"topics":[{"id":1,"name":"营运资本管理"},{"id":2,"name":"投资评估"},{"id":3,"name":"融资"},{"id":4,"name":"WACC"},{"id":5,"name":"企业估值"},{"id":6,"name":"风险管理"},{"id":7,"name":"财务管理职能"},{"id":8,"name":"财务环境"}],"parts":["Part C","Part D","Part E","Part E-WACC","Part F","Part G"],"ref":[{"title":"全科地图：FM 到底在解决什么","n":"先看这页","body":"<p><b>一条主线：<\/b>公司要花钱（投资）→ 钱从哪来（融资）→ 赚了怎么分（股利）→ 过程中的不确定性怎么管（风险）。营运资本是「日常经营的那部分钱」，估值是把上面所有决策的结果算成一个价格。<\/p><h4>七个 Part 的关系<\/h4><ul><li><b>Part A<\/b> 目标：股东财富最大化，不是利润最大化（利润≠现金、不考虑风险、可被操纵）<\/li><li><b>Part B<\/b> 环境：利率、汇率、金融市场，决定你融资的成本<\/li><li><b>Part C<\/b> 营运资本：短期钱的周转（存货、应收、现金）<\/li><li><b>Part D<\/b> 投资评估：NPV 为核心，IRR/EAC/敏感性都是配套<\/li><li><b>Part E<\/b> 融资 + WACC：债务 vs 权益，加权成本就是折现率<\/li><li><b>Part F<\/b> 估值：DVM、P/E、NAV，以及市场是否有效<\/li><li><b>Part G<\/b> 风险：利率风险、汇率风险的对冲工具<\/li><\/ul><h4>考试结构（2026 考纲）<\/h4><ul><li>Section A：15 道单选，每题 2 分，共 30 分<\/li><li>Section B：3 个案例，每个 5 小问 × 2 分，共 30 分<\/li><li>Section C：2 道大题 × 20 分，共 40 分（计算 + 文字论述）<\/li><li>总分 100，及格 50，时长 3 小时 15 分<\/li><\/ul>"},{"title":"Part A｜财务管理职能","n":"Chapter 1","body":"<h4>四大决策<\/h4><ul><li><b>投资<\/b>：资本性资产（战略）、流动资产（营运资金）、金融资产<\/li><li><b>融资<\/b>：总额、内部 vs 外部、债务 vs 权益、长 vs 短<\/li><li><b>股利<\/b>：受融资需求与股东预期制约<\/li><li><b>风险管理<\/b>：贯穿前三者<\/li><\/ul><h4>目标：为什么不是利润最大化<\/h4><ul><li>利润是账面数字，股利要付现金；利润不考虑风险；利润可被会计政策调节（提前确认收入、拉长折旧年限）<\/li><li>股东财富 = 未来现金流折现 = 股利 + 资本利得，<b>TSR 是它的度量<\/b><\/li><li>非财务目标：市场份额、客户满意度、员工离职率、供应商付款天数<\/li><\/ul><h4>代理问题与治理<\/h4><ul><li>股东（委托人）vs 管理层（代理人）→ 代理成本三类：监督成本、约束成本（bonding）、剩余损失<\/li><li>把薪酬绑在 EPS 上是典型短期化诱因（砍研发、回购操纵 EPS）；理想指标看长期：TSR、EVA、股价<\/li><li>治理要点：NED 独立且占多数、董事长与 CEO 分离、设薪酬/提名/审计委员会（审计委员会仅 NED）<\/li><\/ul><h4>非营利组织：3E<\/h4><ul><li><b>Economy<\/b>：以更低成本取得同等质量的投入（看投入单价/总投入）<\/li><li><b>Efficiency<\/b>：投入产出比（cost per X）<\/li><li><b>Effectiveness<\/b>：目标达成度（outcome，如认证数量、治愈率）<\/li><\/ul>"},{"title":"Part B｜财务管理环境","n":"Chapter 2","body":"<h4>宏观政策<\/h4><ul><li><b>四大目标<\/b>：物价稳定、经济增长、充分就业、国际收支平衡<\/li><li><b>货币政策<\/b>工具：利率、货币供应量 → 扩张性：降息、增加信贷可得性<\/li><li><b>财政政策<\/b>工具：政府支出、税收 → 扩张性：增支出、减税<\/li><li>两者工具<b>不能对调<\/b>，这是最高频的选择题陷阱<\/li><\/ul><h4>利率与久期<\/h4><ul><li>固定利率 → 机会成本；浮动利率（SONIA±）→ 现金流风险<\/li><li><b>基差风险<\/b>：两个浮动利率挂钩的基础不同，变动幅度不一致；期货与现货利率变动不一致也是基差风险<\/li><li><b>缺口（gap）<\/b>：利率敏感资产 − 利率敏感负债<\/li><\/ul><h4>金融中介与市场<\/h4><ul><li>中介三大功能：聚合资金、期限转换、风险汇集（“利率固定”<b>不是<\/b>中介的好处）<\/li><li>去中介化（disintermediation）：借款方直接对接资金方<\/li><li>一级市场发行 / 二级市场转手；资本市场长期 / 货币市场短期<\/li><\/ul><h4>货币市场工具（≤1 年、大额、机构）<\/h4><ul><li>国库券 T-bill：贴现发行，1 个月–1 年<\/li><li>大额可转让存单 CD：1–12 个月，可二级转让<\/li><li>商业票据 CP：<b>无担保<\/b>，最长 270 天，仅大型机构<\/li><li>银行承兑汇票 BA：银行担保并收费<\/li><\/ul><h4>四个汇率/利率理论<\/h4><ul><li><b>PPP<\/b>：通胀差 → 预测未来<b>即期<\/b>汇率<\/li><li><b>IRP<\/b>：利率差 → 计算<b>远期<\/b>汇率<\/li><li><b>IFE<\/b>：利差是无偏的未来即期预测；假设各国实际利率相同<\/li><li><b>四向等价<\/b>：即期、利率、通胀、远期四者串联<\/li><\/ul>"},{"title":"Part C｜营运资本管理","n":"Chapter 3","body":"<h4>核心公式<\/h4><ul><li>营业周期 = 存货天数 + 应收天数 − 应付天数<\/li><li>存货天数 = 存货/销货成本×365；应收天数 = 应收/<b>赊销<\/b>×365；应付天数 = 应付/<b>采购<\/b>×365<\/li><li>EOQ = √(2C₀D/Cₕ)；再订货点 = 交货期需求 + 安全库存<\/li><li>Baumol：Q = √(2CF/i)，i 用「投资收益率 − 存款利率」的差额<\/li><\/ul><h4>投资政策<\/h4><ul><li>激进：低存货、低应收、少给信用 → 占用少、盈利性高、流动性风险大<\/li><li>保守：高现金/存货/应收、长信用期 → 占用大、盈利性低<\/li><li>温和：折中<\/li><\/ul><h4>融资政策（判断口诀）<\/h4><ul><li>拿长期融资额比「营运资本最低需求」：等于 → <b>匹配<\/b>；大于 → <b>保守<\/b>；小于 → <b>激进<\/b><\/li><li>短期融资便宜但风险高（随时可收回），长期融资贵但安全<\/li><\/ul><h4>过度交易 overtrading<\/h4><ul><li>定义：销售快速增长，营运资本投入没跟上 = under-capitalisation<\/li><li>五个信号：销售激增 / 长债偿还未再融 / 依赖透支与应付 / 应收存货增速超销售 / 流动比率速动比率下滑<\/li><li>对策：增加长期资本、放慢扩张、改善营运资本管理<\/li><\/ul><h4>应收与现金<\/h4><ul><li>三部曲：信用分析 → 信用控制（账龄分析）→ 催收<\/li><li>保理：<b>无追索权<\/b>才转移坏账；有追索权坏账仍归企业<\/li><li>早付款折扣年化 = d/(1−d) × 365/<b>提前的天数<\/b><\/li><li>持有现金三动机：交易、预防、投机<\/li><\/ul>"},{"title":"Part D｜投资评估","n":"Chapter 4–6","body":"<h4>四种方法<\/h4><ul><li><b>Payback<\/b>：用现金流，忽略回收期之后的现金流，无回报度量<\/li><li><b>ARR<\/b>：用会计利润（要减折旧），看全周期，不考虑时间价值<\/li><li><b>NPV<\/b>：绝对金额，直接对应股东财富增量，互斥项目选 NPV 最大<\/li><li><b>IRR<\/b>：相对百分比，非常规现金流会出现多重 IRR<\/li><\/ul><h4>NPV 优于 IRR 的四条理由<\/h4><ul><li>NPV 是绝对量，能反映项目规模；IRR 不能<\/li><li>互斥项目用 IRR 排序会出错<\/li><li>非常规现金流 → 多重 IRR，无法判断<\/li><li>IRR 的再投资假设（按 IRR 再投资）不现实<\/li><\/ul><h4>风险处理<\/h4><ul><li>敏感性 = NPV / 该变量现金流的 PV（售价→税后收入 PV；销量→<b>contribution<\/b> PV）<\/li><li>确定性等价：有风险现金流换成无风险等值，用<b>无风险利率<\/b>折现<\/li><li>模拟：随机数 → 结果分布 → 标准差<\/li><\/ul><h4>特定决策<\/h4><ul><li>资产替换：寿命不同 → 比 <b>EAC<\/b>（PV 成本/年金系数），不比 PV 总额<\/li><li>租赁 vs 购买：用<b>税后借款利率<\/b>折现<\/li><li>资本限量：可分割用 PI（NPV/初始投资）排序；不可分割用试错组合<\/li><li>名义/实际：现金流与折现率必须同一套口径<\/li><\/ul>"},{"title":"Part E｜融资与 WACC","n":"Chapter 7–8","body":"<h4>债务 vs 权益<\/h4><ul><li>债务便宜：风险低、清算优先、利息可抵税、不稀释控制权、发行成本低<\/li><li>债务的代价：财务风险上升、需抵押、到期还本、违约可能被清算、契约限制<\/li><li>清算受偿顺序：有担保债权人 → 无担保债权人 → 优先股 → 普通股，对应 <b>Kd &lt; Kp &lt; Ke<\/b><\/li><\/ul><h4>配股<\/h4><ul><li>TERP = (N × 原价 + 1 × 发行价)/(N + 1)<\/li><li>每新股权利价值 = TERP − 发行价；每老股 = (TERP − 发行价)/N<\/li><li>优先认购权保护持股比例，对股东中性（股价下跌恰好被权利价值抵消）<\/li><\/ul><h4>WACC<\/h4><ul><li>WACC = Ve/(Ve+Vd)×Ke + Vd/(Ve+Vd)×Kd(1−T)<\/li><li>权重必须用<b>市值<\/b>：账面会低估权益比重（权益市值远高于账面）→ WACC 偏低 → NPV 虚高 → 接受不该接的项目<\/li><li>Ke：CAPM（Rf + β×MRP）或 DVM（D₁/P₀ + g，g = b×r）<\/li><li>Kd：不可赎回 = 票息/<b>税前<\/b>市值；可赎回要算 IRR<\/li><\/ul><h4>折现率六种情况（必背）<\/h4><ul><li>常规项目 / 资产替换 → 税后 WACC<\/li><li>租赁 vs 购买 → 税后借款利率<\/li><li>债券市值 → 税前 Kd<\/li><li>公司/项目估值 → 税后 WACC<\/li><li>股票市值（DVM）→ Ke<\/li><li>项目风险不同 → CAPM 重算（ungear 代理公司 → regear 本公司）<\/li><\/ul>"},{"title":"Part F｜企业估值","n":"Chapter 9","body":"<h4>估值方法<\/h4><ul><li><b>市值法<\/b>：股价 × 股数（假设市场有效）；收购溢价英国平均 30%–50%<\/li><li><b>DVM<\/b>：P₀ = D₁/(Ke − g)，适合非控制性权益<\/li><li><b>P/E<\/b>：用可比公司倍数 × 目标盈利，快但粗糙<\/li><li><b>NAV<\/b>：净资产/股数，适合资产型公司或清算<\/li><\/ul><h4>DVM 的五个局限<\/h4><ul><li>假设 g 永续恒定（现实中没有公司能永远增长）<\/li><li>g 难估计，历史未必重演<\/li><li>假设经营风险与 Ke 不变<\/li><li>g &gt; Ke 时模型无意义<\/li><li>不分红的公司无法使用<\/li><\/ul><h4>有效市场假说<\/h4><ul><li>弱式：反映历史信息 → 技术分析无用<\/li><li>半强式：反映公开信息 → 基本面分析无用，但内幕交易仍可获利（所以要监管）<\/li><li>强式：反映全部信息（含内幕）→ 连内幕交易也无用<\/li><li>市场悖论：市场之所以有效，正因为有人相信它无效而在交易<\/li><\/ul>"},{"title":"Part G｜风险管理","n":"Chapter 10","body":"<h4>利率风险<\/h4><ul><li>内部三法：<b>匹配<\/b>（资产负债同基准）、<b>平滑<\/b>（固定/浮动各占一部分）、<b>资产负债管理<\/b>（期限/久期对齐）<\/li><li><b>FRA<\/b>：OTC 定制，锁定利率，通常 ≤2 年，必须履约、不可转让，有对手方风险<\/li><li><b>利率期货<\/b>：交易所标准合约（短期英镑 £500,000），报价 = 100 − 利率；借款者<b>先卖后买<\/b>，存款者先买后卖<\/li><li><b>期权<\/b>：cap 防利率涨（借款方）、floor 防利率跌（存款方）、collar = 买 floor + 卖 cap<\/li><li>期权费在<b>购买时<\/b>支付，不是行权时<\/li><\/ul><h4>汇率风险<\/h4><ul><li>交易风险：交易日到结算日，影响短期现金流，可对冲<\/li><li>折算风险：合并报表折算，纸面影响，不涉及真实现金<\/li><li>经济风险：长期竞争力，不可消除，只能分散<\/li><\/ul><h4>对冲工具<\/h4><ul><li>远期合约：锁定汇率，OTC，金额灵活<\/li><li>货币市场对冲：<b>应收外币<\/b>→借外币、即期换本币、存本币；<b>应付外币<\/b>→借本币、即期换外币、存外币<\/li><li>期货/期权：交易所标准化；互换：中长期<\/li><li>内部方法：币种匹配、提前/延后收付、轧差 netting<\/li><\/ul>"},{"title":"公式表 · 考题不给（必背）","n":"Not Given","body":"<ul><li>营业周期 = 存货天数 + 应收天数 − 应付天数<\/li><li>存货天数 = 存货/销货成本×365　·　应收天数 = 应收/赊销×365　·　应付天数 = 应付/采购×365<\/li><li>应收融资成本 = 平均应收余额 × 年利率<\/li><li>流动比率 = CA/CL　·　速动比率 = (CA − 存货)/CL<\/li><li>PI 盈利能力指数 = NPV/初始投资<\/li><li>EAC = PV 成本 / 年金系数<\/li><li>不可赎回债券 Kd = 票息 / 债券市值（税前）<\/li><li>TERP = (N×原价 + 1×发行价)/(N+1)　·　每股配股权价值 = TERP − 发行价<\/li><li>资本杠杆 = 优先资本/权益 ×100%<\/li><li>利息保障倍数 = PBIT/利息　·　ROCE = PBIT/(长期债+权益)<\/li><li>ROE = PAT/权益　·　经营杠杆 = contribution/PBIT<\/li><li>EPS = (PAT − 优先股股利)/普通股股数<\/li><li>TSR = (P₁ − P₀ + D₁)/P₀ × 100%<\/li><\/ul>"},{"title":"公式表 · 考题会给（别浪费时间背）","n":"Given","body":"<ul><li>EOQ = √(2C₀D/Cₕ)<\/li><li>Miller-Orr：spread、上限、回归点公式<\/li><li>CAPM：E(ri) = Rf + β(E(rm) − Rf)<\/li><li>资产 β 公式（ungear / regear）<\/li><li>增长模型：P₀ = D₀(1+g)/(re − g)<\/li><li>Gordon 增长近似：g = b×r<\/li><li>WACC 公式<\/li><li>Fisher：1 + i = (1 + r)(1 + h)<\/li><li>PPP：S₁ = S₀×(1+h_c)/(1+h_b)　·　IRP：F₀ = S₀×(1+i_c)/(1+i_b)<\/li><\/ul>"},{"title":"考前易错陷阱（9 条）","n":"进考场前看这页","body":"<ul><li><b>TSR<\/b>：股利取当期全部，股价用期初期末时点数，别用年内最高价<\/li><li><b>3E<\/b>：Economy 看总投入；Efficiency 看投入产出比；Effectiveness 看非财务结果<\/li><li><b>360 还是 365<\/b>：严格按题干，题目说 360 就用 360<\/li><li><b>Payback 用现金流、ARR 用利润<\/b>；ARR 分母看题目给的是「平均投资」还是「初始投资」<\/li><li><b>折现率六种情况<\/b>：常规项目→WACC；租赁购买→税后借款利率；债券市值→税前 Kd；股票市值→Ke<\/li><li><b>敏感性分母<\/b>：售价→税后销售收入 PV；销量→税后 contribution PV<\/li><li><b>口径不能混<\/b>：应收用售价，存货与应付用成本<\/li><li><b>保理<\/b>：有追索权不转移坏账，无追索权才转移<\/li><li><b>优先股<\/b>：算 EPS 和 ROE 时分子要先减优先股股利<\/li><\/ul>"}]}</script>
<script>
(function(){
"use strict";
var DATA = JSON.parse(document.getElementById("fm-data").textContent);
var QS = DATA.questions, CARDS = DATA.cards, REF = DATA.ref;
var LSK = "fm_state_v2";
var state = { answers:{}, stars:{}, flags:{}, cardGrade:{}, filter:"all", topic:0, idx:0, mode:"seq", wbPart:"", fcIdx:0, fcPart:"all", blur:false };

try{ var saved = JSON.parse(localStorage.getItem(LSK)||"{}"); Object.assign(state, saved); }catch(e){}
function save(){ try{ localStorage.setItem(LSK, JSON.stringify(state)); }catch(e){} }

/* ---------- 章节映射（Topic -> 速查 Part） ---------- */
var PARTS = {7:"A",8:"B",1:"C",2:"D",3:"E",4:"E",5:"F",6:"G"};
var PART_REF = {"A":1,"B":2,"C":3,"D":4,"E":5,"F":6,"G":7};
var VIEWS = ["quiz","cards","ref","wb"];
function partOf(q){ return PARTS[q.topic] || ""; }
function partTitle(p){ var i = PART_REF[p]; return (i!=null && REF[i]) ? REF[i].title : ("Part "+p); }
function switchView(v){
  [].forEach.call(document.querySelectorAll(".tab"), function(x){ x.classList.toggle("on", x.dataset.view===v); });
  VIEWS.forEach(function(x){ document.getElementById("view-"+x).classList.add("hide"); });
  document.getElementById("view-"+v).classList.remove("hide");
  document.getElementById("side").classList.toggle("hide", v!=="quiz");
  var mb = document.querySelector(".mobile-bar");
  if(mb) mb.style.display = (v==="quiz") ? "" : "none";
  window.scrollTo(0,0);
}
function gotoRef(part){
  var pi = PART_REF[part]; if(pi==null) return;
  switchView("ref"); renderRef("");
  var chs = document.querySelectorAll("#refBody .chapter");
  var el = chs[pi]; if(!el) return;
  [].forEach.call(chs, function(c,i){ c.classList.toggle("open", i===pi); });
  setTimeout(function(){
    var y = el.getBoundingClientRect().top + window.pageYOffset - 78;
    window.scrollTo(0, Math.max(0,y));
    el.classList.add("flash");
    setTimeout(function(){                       // 布局稳定后再校正一次
      var y2 = el.getBoundingClientRect().top + window.pageYOffset - 78;
      if(Math.abs(y2-y) > 4) window.scrollTo(0, Math.max(0,y2));
    }, 320);
    setTimeout(function(){ el.classList.remove("flash"); }, 3200);
  }, 90);
}

/* ---------- 题池 ---------- */
function pool(){
  var a = QS.slice();
  if(state.mode==="wrong") a = a.filter(function(q){ return state.answers[q.id] && !state.answers[q.id].ok; });
  if(state.mode==="todo") a = a.filter(function(q){ return !state.answers[q.id]; });
  if(state.mode==="star") a = a.filter(function(q){ return state.stars[q.id]; });
  if(state.mode==="random" && state._fixed){ var f = state._fixed; a = a.filter(function(q){ return f.indexOf(q.id)>=0; }); }
  if(state.topic) a = a.filter(function(q){ return q.topic===state.topic; });
  if(state.wbPart) a = a.filter(function(q){ return partOf(q)===state.wbPart; });
  return a;
}
var cur = pool();
function clamp(){ if(state.idx >= cur.length) state.idx = Math.max(0, cur.length-1); if(state.idx<0) state.idx=0; }

/* ---------- 渲染侧栏 ---------- */
function stat(){
  var total = QS.length, done = 0, ok = 0;
  QS.forEach(function(q){ var r=state.answers[q.id]; if(r){ done++; if(r.ok) ok++; } });
  return {total:total, done:done, ok:ok, rate: done? Math.round(ok/done*100):0};
}
function renderModes(){
  var s = stat();
  var modes = [
    ["seq","顺序练习", s.done+"/"+s.total],
    ["random","随机 20 题",""],
    ["wrong","错题重做", QS.filter(function(q){return state.answers[q.id]&&!state.answers[q.id].ok&&(!state.wbPart||partOf(q)===state.wbPart);}).length],
    ["todo","未做题",""],
    ["star","我的收藏", Object.keys(state.stars).filter(function(k){return state.stars[k];}).length]
  ];
  document.getElementById("modes").innerHTML = modes.map(function(m){
    return '<button class="mode '+(state.mode===m[0]?"on":"")+'" data-mode="'+m[0]+'">'+m[1]+'<span>'+m[2]+'</span></button>';
  }).join("");
  [].forEach.call(document.querySelectorAll(".mode"), function(b){
    b.onclick = function(){ setMode(b.dataset.mode); };
  });
}
function renderTopics(){
  var html = '<button class="topic-row '+(state.topic===0?"on":"")+'" data-t="0"><div class="tr-top"><span>全部</span><span class="pct">'+stat().total+'</span></div></button>';
  DATA.topics.forEach(function(t){
    var qs = QS.filter(function(q){return q.topic===t.id;});
    var d = qs.filter(function(q){return state.answers[q.id];});
    var o = d.filter(function(q){return state.answers[q.id].ok;});
    var p = d.length? Math.round(o.length/d.length*100):0;
    html += '<button class="topic-row '+(state.topic===t.id?"on":"")+'" data-t="'+t.id+'">'+
      '<div class="tr-top"><span>'+t.name+'</span><span class="pct">'+o.length+'/'+qs.length+'</span></div>'+
      '<div class="bar"><i style="width:'+p+'%"></i></div></button>';
  });
  document.getElementById("topicList").innerHTML = html;
  [].forEach.call(document.querySelectorAll(".topic-row"), function(b){
    b.onclick = function(){ state.topic = +b.dataset.t; state.wbPart=""; state.idx=0; cur=pool(); renderAll(); };
  });
}

/* ---------- 渲染题目 ---------- */
function renderQ(){
  var q = cur[state.idx];
  var head = document.getElementById("qhead"), card = document.getElementById("qcard");
  if(!q){ head.innerHTML=""; card.innerHTML='<p style="color:var(--ink3)">这个模式下暂时没有题目。</p>'; document.getElementById("posInfo").textContent=""; return; }
  var rec = state.answers[q.id];
  var typeChip = q.type==="multi"?'<span class="chip multi">多选 · 选 '+q.answer.length+' 项</span>':(q.type==="number"?'<span class="chip num">数值填空</span>':'');
  head.innerHTML = '<span class="qidx num">'+q.id+'</span>'+
    (q.src==='J'?'<span class="chip" style="background:#eef4ff;color:#3b6fd4">基础册</span>':'')+    (q.tag?'<span class="chip">'+esc(q.tag)+'</span>':'')+ typeChip +
    (q.doubt?'<span class="chip warn">⚠ 原答案存疑</span>':'')+
    (state.wbPart?'<span class="chip" style="background:#fdf6ea;color:#c47d1a">错题 · '+esc(partTitle(state.wbPart))+'</span>':'');
  var html = '<div class="stem">'+fmt(q.stem)+'</div>';
  if(q.type==="number"){
    html += '<div class="numbox"><input id="numIn" placeholder="输入数值" autocomplete="off"'+(rec?' value="'+rec.raw+'" disabled':'')+'>'+
      '<button class="btn btn-p" id="numGo">'+(rec?"已提交":"确认")+'</button>'+
      '<span class="hint">'+(rec?"":"只填数字，可带 m / % 单位，误差 1% 内算对")+'</span></div>';
  }else{
    html += '<div class="opts">'+ q.options.map(function(o,i){
      var k = "ABCDEF"[i], cls="opt";
      if(rec){
        cls += " locked";
        if(q.answer.indexOf(k)>=0) cls+=" right";
        else if(rec.chosen.indexOf(k)>=0) cls+=" wrong";
        else cls+=" dim";
      }else if(rec===undefined && state._tmp && state._tmp[q.id] && state._tmp[q.id].indexOf(k)>=0){ cls+=" sel"; }
      return '<button class="'+cls+'" data-k="'+k+'"><span class="k">'+k+'</span><span>'+esc(o)+'</span></button>';
    }).join("")+'</div>';
    if(q.type==="multi" && !rec){
      html += '<div style="margin-top:14px"><button class="btn btn-p" id="multiGo" disabled>确认答案（已选 0/'+q.answer.length+'）</button></div>';
    }
  }
  if(rec) html += explainHTML(q, rec);
  card.innerHTML = html;

  if(!rec && q.type!=="number"){
    [].forEach.call(card.querySelectorAll(".opt"), function(b){
      b.onclick = function(){ choose(q, b.dataset.k); };
    });
    if(q.type==="multi") refreshMulti(q);
  }
  if(!rec && q.type==="number"){
    var inp = document.getElementById("numIn");
    var go = function(){ submitNum(q, inp.value); };
    document.getElementById("numGo").onclick = go;
    inp.onkeydown = function(e){ if(e.key==="Enter") go(); };
    inp.focus();
  }
  var gr = card.querySelector(".goRef");
  if(gr) gr.onclick = function(){ gotoRef(gr.dataset.part); };
  document.getElementById("posInfo").textContent = (state.idx+1)+" / "+cur.length;
  document.getElementById("starBtn").classList.toggle("on", !!state.stars[q.id]);
  document.getElementById("starBtn").textContent = state.stars[q.id]?"★ 已收藏":"☆ 收藏";
  document.getElementById("flagBtn").classList.toggle("on", !!state.flags[q.id]);
}

function refreshMulti(q){
  var btn = document.getElementById("multiGo"); if(!btn) return;
  var sel = (state._tmp && state._tmp[q.id]) || [];
  btn.disabled = sel.length !== q.answer.length;
  btn.textContent = "确认答案（已选 "+sel.length+"/"+q.answer.length+"）";
  btn.onclick = function(){ submitMulti(q, sel); };
}
function submitMulti(q, sel){
  if(state.answers[q.id]) return;
  var k = sel.slice().sort().join("");
  if(!k) return;
  var a = q.answer.split("").sort().join("");
  state.answers[q.id] = {chosen:k, ok:(k===a), raw:k};
  save(); renderQ(); renderModes(); renderTopics(); updateMini();
}
function choose(q, k){
  if(state.answers[q.id]) return;
  if(q.type==="multi"){
    state._tmp = state._tmp || {};
    var sel = state._tmp[q.id] || [];
    if(sel.indexOf(k)>=0) sel = sel.filter(function(x){return x!==k;});
    else if(sel.length < (q.answer?q.answer.length:2)) sel.push(k);
    state._tmp[q.id] = sel;
    [].forEach.call(document.querySelectorAll("#qcard .opt"), function(b){
      b.classList.toggle("sel", sel.indexOf(b.dataset.k)>=0);
    });
    refreshMulti(q);
    return;
  }
  var ok = q.answer === k;
  state.answers[q.id] = {chosen:k, ok:ok, raw:k};
  save(); renderQ(); renderModes(); renderTopics(); updateMini();
}
function submitNum(q, v){
  if(state.answers[q.id]) return;
  var u = num(v), a = num(q.answer);
  if(u===null){ return; }
  var ok = a!==null && a!==0 ? Math.abs(u-a)/Math.abs(a) <= 0.0101 : u===a;
  state.answers[q.id] = {chosen:v, ok:ok, raw:v};
  save(); renderQ(); renderModes(); renderTopics(); updateMini();
}
function explainHTML(q, rec){
  var h = '<div class="explain">';
  h += '<div class="verdict '+(rec.ok?"ok":"no")+'">'+(rec.ok?"✓ 答对了":"✗ 答错了")+
       '<span class="ans-tag">正确答案 '+q.answer+'</span></div>';
  if(q.explain && q.explain.ans) h += '<div class="sec"><div class="sec-t">解法</div><p>'+fmt(q.explain.ans)+'</p></div>';
  if(q.explain && q.explain.wrong){
    var keys = Object.keys(q.explain.wrong);
    h += '<div class="sec"><div class="sec-t">'+(keys.length&&keys[0]==="other"?"常见错法":"其余选项为什么错")+'</div><div class="wrong-list">';
    keys.forEach(function(k){
      var label = k==="other"?"典型错法":("选项 "+k);
      h += '<div class="wrow"><span class="wk'+(k==="other"?" other":"")+'">'+label+'</span><span>'+fmt(q.explain.wrong[k])+'</span></div>';
    });
    h += '</div></div>';
  }
  if(q.explain && q.explain.point) h += '<div class="sec"><div class="keypoint"><b>考点　</b>'+fmt(q.explain.point)+'</div></div>';
  if(q.explain && q.explain.trap) h += '<div class="sec"><div class="callout"><b>易错　</b>'+fmt(q.explain.trap)+'</div></div>';
  var p = partOf(q);
  if(p) h += '<div class="sec"><button class="btn btn-g goRef" data-part="'+p+'" style="width:100%">📖 回速查补漏 · '+esc(partTitle(p))+'</button></div>';
  h += '</div>';
  return h;
}

/* ---------- 文字卡 ---------- */
function cardPool(){
  return CARDS.filter(function(c){ return state.fcPart==="all" || c.part===state.fcPart; });
}
function renderCard(){
  var list = cardPool(), c = list[state.fcIdx];
  var box = document.getElementById("fcard");
  if(!c){ box.innerHTML='<p style="color:var(--ink3)">没有卡片。</p>'; return; }
  var g = state.cardGrade[c.id]||0;
  var html = '<div class="fc-meta">'+c.part+' · '+c.topic+'　<span style="color:var(--ink3)">'+(state.fcIdx+1)+" / "+list.length+'</span></div>'+
    '<div class="fc-q">'+fmt(c.q)+'</div>'+
    '<div class="fc-body" id="fcBody" '+(state.hideAns?'style="display:none"':'')+'>'+
      c.en.map(function(p){
        var t = fmt(p);
        if(state.blur) t = t.replace(/\*\*(.+?)\*\*/g, function(_,kw){ return '<span class="reveal">'+kw+'</span>'; });
        return '<div class="fc-point"><span class="dot"></span><span>'+t+'</span></div>';
      }).join("")+
      '<div class="fc-zh"><b>怎么记　</b>'+fmt(c.zh)+'</div>'+
    '</div>';
  html += '<div class="grade">'+
    '<button class="g1" data-g="1">不会（明天再来）</button>'+
    '<button class="g2" data-g="2">半会（3 天后）</button>'+
    '<button class="g3" data-g="3">会了（7 天后）</button></div>';
  box.innerHTML = html;
  [].forEach.call(box.querySelectorAll(".grade button"), function(b){
    b.onclick = function(){ state.cardGrade[c.id] = +b.dataset.g; save(); nextCard(1); toast(b.dataset.g==="1"?"记下来了，明天再刷一遍":(b.dataset.g==="2"?"标记为半会":"标记为已会")); };
  });
  [].forEach.call(box.querySelectorAll(".reveal"), function(s){
    s.onclick = function(){ s.classList.add("on"); };
  });
  document.getElementById("fcCount").textContent = list.length+" 张 · 已评 "+Object.keys(state.cardGrade).length;
}

/* ---------- 错题本 ---------- */
function renderWB(){
  updateMini();
  var box = document.getElementById("wbBody");
  var wrong = QS.filter(function(q){ return state.answers[q.id] && !state.answers[q.id].ok; });
  if(!wrong.length){
    box.innerHTML = '<div class="wb-empty">🎉 暂无错题。<br><br>做错的题会自动按速查章节归档到这里，方便分章消灭。</div>';
    return;
  }
  var html = "";
  ["A","B","C","D","E","F","G"].forEach(function(p){
    var ws = wrong.filter(function(q){ return partOf(q)===p; });
    if(!ws.length) return;
    var qs = QS.filter(function(q){ return partOf(q)===p; });
    var done = qs.filter(function(q){ return state.answers[q.id]; }).length;
    html += '<div class="wb-group">'+
      '<div class="wb-head"><div><b>'+esc(partTitle(p))+'</b>'+
      '<span class="wb-sub">本章已做 '+done+' / '+qs.length+' · 待消灭错题 <b style="color:var(--red)">'+ws.length+'</b></span></div>'+
      '<div class="wb-acts"><button class="btn btn-p" data-redo="'+p+'">重做本章错题</button>'+
      '<button class="btn btn-g" data-all="'+p+'">练本章全部题</button>'+
      '<button class="btn btn-g" data-ref="'+p+'">📖 看本章速查</button></div></div>';
    html += ws.map(function(q){
      var r = state.answers[q.id];
      return '<button class="wb-row" data-q="'+q.id+'">'+
        '<span class="qidx num">'+q.id+'</span>'+
        '<span class="wb-tag">'+esc(q.tag||"")+'</span>'+
        '<span>你答 <b class="bad">'+esc(String(r.raw||"-"))+'</b> → 正确 <b class="good">'+esc(String(q.answer))+'</b></span>'+
        '<span class="wb-go">去做 →</span></button>';
    }).join("");
    html += '</div>';
  });
  box.innerHTML = html;
  [].forEach.call(box.querySelectorAll("[data-ref]"), function(b){
    b.onclick = function(e){ e.stopPropagation(); gotoRef(b.dataset.ref); };
  });
  [].forEach.call(box.querySelectorAll("[data-redo]"), function(b){
    b.onclick = function(e){ e.stopPropagation(); redoPart(b.dataset.redo); };
  });
  [].forEach.call(box.querySelectorAll("[data-all]"), function(b){
    b.onclick = function(e){ e.stopPropagation(); drillPart(b.dataset.all); };
  });
  [].forEach.call(box.querySelectorAll(".wb-row"), function(b){
    b.onclick = function(){ jumpTo(b.dataset.q); };
  });
}
function drillPart(p){
  state.mode = "seq"; state.wbPart = p; state.topic = 0; state.idx = 0;
  state._fixed = null;
  switchView("quiz");
  renderAll();
}
function redoPart(p){
  state.mode = "wrong"; state.wbPart = p; state.topic = 0; state.idx = 0;
  state._fixed = null;
  switchView("quiz");
  renderAll();
}
function jumpTo(qid){
  state.mode = "seq"; state.wbPart = ""; state.topic = 0; state._fixed = null;
  cur = pool();
  var i = -1;
  for(var k=0;k<cur.length;k++){ if(cur[k].id===qid){ i=k; break; } }
  if(i<0) return;
  state.idx = i;
  switchView("quiz");
  renderAll();
}

/* ---------- 速查 ---------- */
function renderRef(kw){
  var html = "";
  REF.forEach(function(ch){
    var body = ch.body;
    if(kw){
      var hit = (ch.title+" "+body.replace(/<[^>]+>/g,"")).toLowerCase().indexOf(kw.toLowerCase())>=0;
      if(!hit) return;
    }
    html += '<div class="chapter'+(kw?" open":"")+'"><div class="ch-head"><h2>'+ch.title+'</h2><span class="n">'+(ch.n||"")+'</span></div><div class="ch-body">'+body+'</div></div>';
  });
  document.getElementById("refBody").innerHTML = html || '<p style="color:var(--ink3);padding:20px">没有找到相关内容。</p>';
  [].forEach.call(document.querySelectorAll(".ch-head"), function(h){
    h.onclick = function(){ h.parentNode.classList.toggle("open"); };
  });
  var s = stat();
  document.getElementById("statBox").innerHTML =
    '<div class="stat"><div class="v num">'+s.done+'<span style="font-size:14px;color:var(--ink3)">/'+s.total+'</span></div><div class="l">已做题目</div></div>'+
    '<div class="stat"><div class="v num">'+s.rate+'%</div><div class="l">正确率</div></div>'+
    '<div class="stat"><div class="v num">'+QS.filter(function(q){return state.answers[q.id]&&!state.answers[q.id].ok;}).length+'</div><div class="l">待复习错题</div></div>'+
    '<div class="stat"><div class="v num">'+Object.keys(state.cardGrade).length+'<span style="font-size:14px;color:var(--ink3)">/'+CARDS.length+'</span></div><div class="l">已背卡片</div></div>';
}

/* ---------- 工具 ---------- */
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function fmt(s){
  s = esc(s);
  s = s.replace(/\*\*(.+?)\*\*/g, "<b>$1</b>");
  s = s.replace(/\\n/g,"\n");
  return s;
}
function num(v){
  if(v===undefined||v===null) return null;
  var t = String(v).replace(/[,$£€\s]/g,"").replace(/%/g,"");
  var m = t.match(/-?\d+(\.\d+)?/);
  if(!m) return null;
  var n = parseFloat(m[0]);
  if(/m$/i.test(t)) n = n*1; // m 视为单位，不放大
  return isNaN(n)? null : n;
}
var toastT;
function toast(msg){
  var d = document.getElementById("toast");
  if(!d){ d=document.createElement("div"); d.id="toast"; d.style.cssText="position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:rgba(28,36,48,.9);color:#fff;padding:9px 18px;border-radius:20px;font-size:13px;z-index:99;transition:.3s;opacity:0"; document.body.appendChild(d); }
  d.textContent = msg; d.style.opacity="1";
  clearTimeout(toastT); toastT = setTimeout(function(){ d.style.opacity="0"; }, 1400);
}
function updateMini(){
  var s = stat();
  document.getElementById("miniStat").innerHTML = "已做 <b>"+s.done+"</b> / "+s.total+"　正确率 <b>"+s.rate+"%</b>";
}

/* ---------- 导航 ---------- */
function setMode(m){
  state.mode = m; state.idx = 0; state.wbPart = "";
  if(m==="random"){
    cur = QS.slice().sort(function(){ return Math.random()-0.5; }).slice(0,20);
  }else{ cur = pool(); }
  state._rand = (m==="random");
  if(state._rand) state._fixed = cur.map(function(q){return q.id;});
  renderAll();
}
function nextQ(d){
  if(!cur.length) return;
  state.idx += d;
  if(state.idx<0) state.idx=0;
  if(state.idx>=cur.length) state.idx=cur.length-1;
  save(); renderQ();
}
function nextCard(d){
  var list = cardPool();
  state.fcIdx = (state.fcIdx + d + list.length) % list.length;
  save(); renderCard();
}

function renderAll(){ cur = pool(); clamp(); renderModes(); renderTopics(); renderQ(); updateMini(); }

/* ---------- 事件 ---------- */
[].forEach.call(document.querySelectorAll(".tab"), function(t){
  t.onclick = function(){
    switchView(t.dataset.view);
    if(t.dataset.view==="ref") renderRef("");
    if(t.dataset.view==="cards") renderCard();
    if(t.dataset.view==="wb") renderWB();
  };
});
document.getElementById("prevBtn").onclick = function(){ nextQ(-1); };
document.getElementById("nextBtn").onclick = function(){ nextQ(1); };
document.getElementById("mPrev").onclick = function(){ nextQ(-1); };
document.getElementById("mNext").onclick = function(){ nextQ(1); };
document.getElementById("mMenu").onclick = function(){ document.getElementById("side").classList.toggle("open"); };
document.getElementById("starBtn").onclick = function(){
  var q=cur[state.idx]; if(!q) return;
  state.stars[q.id] = !state.stars[q.id]; save(); renderQ(); renderModes();
};
document.getElementById("flagBtn").onclick = function(){
  var q=cur[state.idx]; if(!q) return;
  state.flags[q.id] = !state.flags[q.id]; save(); renderQ();
};
document.getElementById("fcPrev").onclick = function(){ nextCard(-1); };
document.getElementById("fcNext").onclick = function(){ nextCard(1); };
document.getElementById("fcReveal").onclick = function(){
  var b = document.getElementById("fcBody");
  if(b) b.style.display = b.style.display==="none"?"block":"none";
};
document.getElementById("fcToggleBlur").onclick = function(){
  state.blur = !state.blur; save();
  this.style.background = state.blur?"var(--bluebg)":"#fff";
  this.style.color = state.blur?"var(--blue)":"var(--ink2)";
  renderCard();
};
document.getElementById("fcPart").onchange = function(){ state.fcPart=this.value; state.fcIdx=0; save(); renderCard(); };
document.getElementById("refSearch").oninput = function(){ renderRef(this.value.trim()); };

document.addEventListener("keydown", function(e){
  if(e.target.tagName==="INPUT"||e.target.tagName==="SELECT") return;
  if(document.getElementById("view-quiz").classList.contains("hide")) return;
  var q = cur[state.idx]; if(!q) return;
  if(/^[1-4]$/.test(e.key) && q.type!=="number"){
    var k = "ABCD"[+e.key-1];
    if(q.options[+e.key-1]) choose(q,k);
  }
  if(e.key==="Enter") nextQ(1);
  if(e.key==="s"||e.key==="S") document.getElementById("starBtn").click();
  if(e.key==="f"||e.key==="F") document.getElementById("flagBtn").click();
  if(e.key==="ArrowRight") nextQ(1);
  if(e.key==="ArrowLeft") nextQ(-1);
});

/* ---------- 初始化 ---------- */
document.getElementById("fcPart").innerHTML = '<option value="all">全部 Part</option>'+
  DATA.parts.map(function(p){ return '<option value="'+p+'">'+p+'</option>'; }).join("");
document.getElementById("fcPart").value = state.fcPart;
if(state.blur){ var b=document.getElementById("fcToggleBlur"); b.style.background="var(--bluebg)"; b.style.color="var(--blue)"; }
renderModes(); renderTopics(); renderQ(); renderCard(); renderRef(""); updateMini();

/* 深链：?go=题号 直达某题 */
var mg = location.search.match(/[?&]go=([A-Za-z0-9]+)/);
if(mg){
  for(var gi=0; gi<QS.length; gi++){
    if(QS[gi].id===mg[1]){ state.topic=0; state.mode="seq"; state.idx=gi; break; }
  }
  renderAll();
}
/* 自检入口：?demo 单题演示 / ?demo=card 卡片 / ?demo=ref 速查 / ?demo=wb 错题本 */
if(location.search.indexOf("demo")>=0){
  setTimeout(function(){
    if(location.search.indexOf("wb")>=0){
      // 模拟答错：每个 Part 挑 1-2 题，直接写入错误记录
      var demos = ["J1Q02","C1Q04","J2Q01","C2Q03","J7Q02","C4Q02","J9Q02","C6Q05"];
      demos.forEach(function(qid){
        var q = QS.filter(function(x){return x.id===qid;})[0]; if(!q) return;
        var bad;
        if(q.type==="number") bad = "999";
        else{
          bad = q.answer[0]==="A" ? "D" : "A";
          if(q.type==="multi") bad = "AB";
        }
        state.answers[q.id] = {chosen:bad, ok:false, raw:bad};
      });
      document.querySelectorAll(".tab")[2].click();
    }
    else if(location.search.indexOf("ref")>=0){ document.querySelectorAll(".tab")[3].click(); }
    else if(location.search.indexOf("card")>=0){
      document.querySelectorAll(".tab")[1].click();
    }else{
      var q0 = cur[state.idx];
      if(q0 && !state.answers[q0.id]){
        if(q0.type==="single") choose(q0, q0.answer[0]);
        else if(q0.type==="multi"){ state._tmp=state._tmp||{}; state._tmp[q0.id]=q0.answer.split(""); submitMulti(q0, q0.answer.split("")); }
      }
    }
    var mj = location.search.match(/[?&]jump=([A-G])/);
    if(mj) setTimeout(function(){ gotoRef(mj[1]); }, 400);
    var mr = location.search.match(/[?&]redo=([A-G])/);
    if(mr) setTimeout(function(){ redoPart(mr[1]); }, 400);
  }, 150);
}
})();
</script>
