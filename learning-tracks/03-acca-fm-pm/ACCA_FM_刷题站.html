      var w = x.total ? Math.min(100, x.done / x.total * 100).toFixed(1) : 0;
      var ok = x.total > 0 && x.done >= x.total;
      var right = x.total ? (ok ? '<span style="color:' + C_GREEN + '">✓ 已完成</span>'
        : '还差 ' + Math.max(0, x.total - x.done) + ' ' + UNIT) : '—';
      return '<div style="padding:6px 0;border-bottom:1px solid #f0ece3">' +
        '<div style="display:flex;justify-content:space-between;gap:8px">' +
          '<span>' + esc(x.label) + '</span>' +
          '<b style="color:' + C_INK + ';white-space:nowrap">' + x.done + (x.total ? ' / ' + x.total : '') + ' ' + UNIT + '</b></div>' +
        (x.total ? '<div style="height:5px;border-radius:99px;background:#efeae0;margin:5px 0 3px;overflow:hidden">' +
          '<i style="display:block;height:100%;width:' + w + '%;background:' + (ok ? C_GREEN : C_INK) + '"></i></div>' : '') +
        '<div style="color:' + C_MUTE + ';font-size:11.5px">' + right + '</div></div>';
    }).join('') : '<div style="color:' + C_MUTE + '">还没有做题记录，先去做几道吧</div>';

    p.innerHTML =
      '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:2px">' +
        '<b style="font-size:15px">我的进度</b>' +
        '<button data-sb="refresh" style="border:0;background:none;color:' + C_INK + ';font-size:12px;cursor:pointer">刷新</button></div>' +
      '<div style="color:' + C_MUTE + ';font-size:12px">' + esc(CFG.name) + ' · 本机自动保存</div>' +
      '<div style="display:flex;gap:16px;flex-wrap:wrap;margin:14px 0 10px">' +
        '<div><b style="font-size:22px;color:' + C_INK + '">' + s.done + '</b><span style="color:' + C_MUTE + '"> ' + DONE_LABEL + '</span></div>' +
        '<div><b style="font-size:22px;color:' + C_INK + '">' + (s.total ? s.total : '—') + '</b><span style="color:' + C_MUTE + '"> 总' + UNIT + '</span></div>' +
        '<div><b style="font-size:22px;color:' + C_GREEN + '">' + (s.total ? Math.max(0, s.total - s.done) : '—') + '</b><span style="color:' + C_MUTE + '"> 剩余</span></div>' +
        (SHOW_RATE ? '<div><b style="font-size:22px;color:' + C_INK + '">' + (s.done ? rate + '%' : '—') + '</b><span style="color:' + C_MUTE + '"> 正确率</span></div>' : '') +
      '</div>' +
      '<div style="height:9px;border-radius:99px;background:#efeae0;overflow:hidden">' +
        '<i style="display:block;height:100%;width:' + bar + '%;background:linear-gradient(90deg,' + C_INK + ',' + C_GREEN + ');border-radius:99px"></i></div>' +
      '<div style="color:' + C_MUTE + ';font-size:12px;margin-top:6px">' +
        (s.total ? '总进度 <b>' + pct + '%</b>' : '总数未识别，已做数为精确值') +
        ' · ' + (s.savedAt ? '最近保存 ' + hms(s.savedAt) : '本机已存 ' + s.keys + ' 项记录') + '</div>' +
      '<div style="display:flex;justify-content:space-between;align-items:center;margin:15px 0 4px">' +
        '<b>章节完成度</b><span style="color:' + C_GREEN + ';font-size:12px">已完成 ' + s.finished + ' / ' + s.measurable + ' 章</span></div>' +
      chHtml +
      '<div style="display:flex;gap:8px;margin-top:14px;flex-wrap:wrap">' +
        '<button data-sb="export" style="flex:1;min-width:110px;padding:7px 10px;border:1px solid ' + C_LINE + ';border-radius:8px;background:#faf8f3;color:#1b232e;font-size:12.5px;cursor:pointer">导出进度备份</button>' +
        '<button data-sb="import" style="flex:1;min-width:110px;padding:7px 10px;border:1px solid ' + C_LINE + ';border-radius:8px;background:#faf8f3;color:#1b232e;font-size:12.5px;cursor:pointer">导入进度</button>' +
      '</div>' +
      '<div style="color:' + C_MUTE + ';font-size:11.5px;margin-top:10px;line-height:1.5">' +
        '原站每次答题都会立即写入本机；本面板实时读取并给出章节完成度。换设备或清缓存前请先导出，导入时与本机记录合并，不会覆盖。</div>';
  }

  /* ---------- 启动与切后台落盘 ---------- */
  function flush() {
    if (typeof CFG.flush === 'function') { try { CFG.flush(); } catch (e) {} }
  }
  function boot() {
    build();
    snapshot();
    setInterval(function () {
      var before = lastSig;
      snapshot();
      var p = document.getElementById('sb-panel');
      if (before !== lastSig && p && p.style.display !== 'none') render();
    }, 1500);
    window.addEventListener('pagehide', flush);
    window.addEventListener('beforeunload', flush);
    document.addEventListener('visibilitychange', function () {
      if (document.visibilityState === 'hidden') flush();
    });
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();

</script>
</body>
</html>
